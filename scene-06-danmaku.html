    function resolveFumoToFumoCollisions() {
      for (let i = 0; i < fumos.length; i++) {
        for (let j = i + 1; j < fumos.length; j++) {
          const a = fumos[i];
          const b = fumos[j];
          const minDist = (a.radius + b.radius) * 0.78;
          const dx = b.pos.x - a.pos.x;
          const dy = (b.pos.y + b.radius * 0.6) - (a.pos.y + a.radius * 0.6);
          const dz = b.pos.z - a.pos.z;
          const distSq = dx * dx + dy * dy + dz * dz;

          if (distSq < minDist * minDist && distSq > 0.0001) {
            const dist = Math.sqrt(distSq);
            const nx = dx / dist;
            const ny = dy / dist;
            const nz = dz / dist;
            const overlap = (minDist - dist) * 0.5;

            if (!a.isDragged) {
              a.pos.x -= nx * overlap;
              a.pos.y = Math.max(0, a.pos.y - ny * overlap);
              a.pos.z -= nz * overlap;
            }
            if (!b.isDragged) {
              b.pos.x += nx * overlap;
              b.pos.y = Math.max(0, b.pos.y + ny * overlap);
              b.pos.z += nz * overlap;
            }

            const rvx = b.vel.x - a.vel.x;
            const rvy = b.vel.y - a.vel.y;
            const rvz = b.vel.z - a.vel.z;
            const vn = rvx * nx + rvy * ny + rvz * nz;
            if (vn < 0) {
              const imp = -vn * 0.68;
              if (!a.isDragged) {
                a.vel.x -= imp * nx;
                a.vel.y -= imp * ny;
                a.vel.z -= imp * nz;
                a.squashVel -= Math.min(5.0, imp * 0.6);
              }
              if (!b.isDragged) {
                b.vel.x += imp * nx;
                b.vel.y += imp * ny;
                b.vel.z += imp * nz;
                b.squashVel -= Math.min(5.0, imp * 0.6);
              }
              if (imp > 1.5) soundFX.playBounce(imp * 0.07);
            }
          }
        }
      }
    }

      b.sy = opts.sy || 1.0;
      b.sz = opts.sz || 1.0;
      b.spinSpeed = opts.spinSpeed !== undefined ? opts.spinSpeed : 4.0;
      b.yaw = Math.atan2(b.vx, b.vz);
      b.age = 0;
      b.maxLife = opts.maxLife || 4.8;
      b.bouncesLeft = opts.bounces !== undefined ? opts.bounces : 1;
      b.ownerId = opts.ownerId || '';
      b.colorHex = opts.color || '#38bdf8';
      b.trailTick = 0;

      tempColor.set(b.colorHex);
      bulletInstanced.setColorAt((bulletCursor + MAX_BULLETS - 1) % MAX_BULLETS, tempColor);
    }

    function spawnTrailVoxel(x, y, z, colorHex, scale = 0.85) {
      const idx = trailCursor;
      trailCursor = (trailCursor + 1) % MAX_TRAILS;
      const t = trails[idx];
      t.active = true;
      t.x = x;
      t.y = y;
      t.z = z;
      t.scale = scale;
      t.age = 0;
      t.maxLife = 0.24;
      tempColor.set(colorHex);
      trailInstanced.setColorAt(idx, tempColor);
    }

    // ----------------------------------------------------------------------------
    // 9A. DISTINCT CHARACTER DANMAKU PATTERNS + SPELL CARD FULL-ARENA BARRAGES
    // ----------------------------------------------------------------------------
    let patternTick = 0;

    let currentSpellIndex = 0;

    const SPELL_CARDS = [

    const spellFlashEl = document.getElementById('spell-flash');

    function triggerSpellCard() {
      const sc = SPELL_CARDS[currentSpellIndex];
      currentSpellIndex = (currentSpellIndex + 1) % SPELL_CARDS.length;
      spellCardTimer = 4.6;

      // Screen-wide color flash
      spellFlashEl.style.background = `radial-gradient(circle, ${sc.flashColor} 0%, transparent 75%)`;
      spellFlashEl.style.opacity = '0.78';
      setTimeout(() => {

      // Update & slide in stylized Spell Card Banner
      spellBannerEmojiEl.textContent = sc.emoji;
      spellBannerCasterEl.textContent = sc.casterName;
      spellBannerTitleEl.textContent = sc.title;
      spellBannerInnerEl.style.setProperty('--spell-glow', sc.glow);
      spellBannerEl.classList.add('is-active');

      // Excite the casting Fumo + Referee Fumo!
      const caster = fumos.find(f => f.id === sc.casterId);
      if (caster) caster.squeeze(1.25);
      const ref = fumos.find(f => f.id === 'aya_referee');
      if (ref) ref.squeeze(0.9);

      spellAccentLight.color.set(sc.lightColor);
      soundFX.playSpellCardDeclare();
    }

    function emitDanmakuPatterns(time, dt) {
      patternTick += dt;
      if (patternTick < 0.085) return; // ~12 pattern ticks per second
      patternTick = 0;

      const step = Math.floor(time * 12);

      // 1. Standard Character Danmaku Patterns from each of the 6 Combatant Fumos
      for (let i = 0; i < 6; i++) {
        const f = fumos[i];
        if (f.isDragged || f.ragdollTimer > 0.3) continue; // Don't shoot while being ragdolled!

        const ox = f.pos.x;
        const oy = f.pos.y + 0.72;
        const oz = f.pos.z;
        const baseAim = Math.atan2(-ox, -oz); // Aim toward arena center

        if (f.id === 'marisa' && step % 2 === 0) {
          // Marisa: Rotating 3-way Star Spiral (Gold, Pink, Cyan stars)
          const starCols = ['#fde047', '#f472b6', '#38bdf8', '#a855f7'];
          for (let k = -1; k <= 1; k++) {
            const ang = baseAim + k * 0.34 + Math.sin(time * 2.4) * 0.45;
            const spd = 4.6;
            spawnBullet({
              x: ox + Math.sin(ang) * 0.7, y: oy, z: oz + Math.cos(ang) * 0.7,
              vx: Math.sin(ang) * spd, vz: Math.cos(ang) * spd,
              sx: 1.35, sy: 1.35, sz: 1.35, spinSpeed: 9.0,
              color: starCols[(step + k + 4) % starCols.length],
              ownerId: f.id, bounces: 1
            });
          }
        }

        if (f.id === 'reimu' && step % 3 === 0) {
          // Reimu: Rectangular Crimson & White Ofuda Amulet Fan
          for (let k = -2; k <= 2; k++) {
            const ang = baseAim + k * 0.22 + Math.cos(time * 1.8) * 0.2;
            const spd = 4.2;
            spawnBullet({
              x: ox + Math.sin(ang) * 0.7, y: oy, z: oz + Math.cos(ang) * 0.7,
              vx: Math.sin(ang) * spd, vz: Math.cos(ang) * spd,
              sx: 0.75, sy: 0.45, sz: 1.75, spinSpeed: 0, // Rectangular talisman!
              color: Math.abs(k) % 2 === 0 ? '#ef4444' : '#fff1f2',
              ownerId: f.id, bounces: 1
            });
          }
        }

        if (f.id === 'cirno' && step % 4 === 0) {
          // Cirno: 9-Way Ice Shard Flower Burst!
          for (let k = 0; k < 9; k++) {
            const ang = baseAim + ((k - 4) / 9) * Math.PI * 1.15 + Math.sin(time * 1.5) * 0.3;
            const spd = 3.8 + (k % 2) * 0.9;
            spawnBullet({
              x: ox + Math.sin(ang) * 0.7, y: oy, z: oz + Math.cos(ang) * 0.7,
              vx: Math.sin(ang) * spd, vz: Math.cos(ang) * spd,
              sx: 0.75, sy: 0.75, sz: 1.6, spinSpeed: 3.0,
              color: k % 2 === 0 ? '#38bdf8' : '#e0f2fe',
              ownerId: f.id, bounces: 1
            });
          }
        }

        if (f.id === 'flandre' && step % 3 === 1) {
          // Flandre: Crimson & Rainbow Catastrophe Spiral
          const flanCols = ['#f43f5e', '#fb923c', '#fde047', '#c084fc'];
          for (let k = 0; k < 4; k++) {
            const ang = time * 2.8 + (k * Math.PI) / 2;
            const spd = 4.4;
            spawnBullet({
              x: ox + Math.sin(ang) * 0.7, y: oy, z: oz + Math.cos(ang) * 0.7,
              vx: Math.sin(ang) * spd, vz: Math.cos(ang) * spd,
              sx: 1.25, sy: 1.25, sz: 1.25, spinSpeed: 7.0,
              color: flanCols[(k + step) % flanCols.length],
              ownerId: f.id, bounces: 1
            });
          }
        }

        if (f.id === 'sakuya' && step % 3 === 2) {
          // Sakuya: High-Speed Aimed Silver Throwing Knife Volley
          for (let k = -2; k <= 2; k++) {
            const ang = baseAim + k * 0.14;
            const spd = 5.6 - Math.abs(k) * 0.35;
            spawnBullet({
              x: ox + Math.sin(ang) * 0.7, y: oy, z: oz + Math.cos(ang) * 0.7,
              vx: Math.sin(ang) * spd, vz: Math.cos(ang) * spd,
              sx: 0.45, sy: 0.35, sz: 2.1, spinSpeed: 0, // Sleek knife blade!
              color: k === 0 ? '#60a5fa' : '#f1f5f9',
              ownerId: f.id, bounces: 1
            });
          }
        }

        if (f.id === 'youmu' && step % 3 === 0) {
          // Youmu: Emerald Crescent Sword Slash Wave
          for (let k = -3; k <= 3; k++) {
            const ang = baseAim + k * 0.11 + Math.sin(time * 3.2) * 0.25;
            const spd = 4.9 - Math.abs(k) * 0.15;
            spawnBullet({
              x: ox + Math.sin(ang) * 0.7, y: oy, z: oz + Math.cos(ang) * 0.7,
              vx: Math.sin(ang) * spd, vz: Math.cos(ang) * spd,
              sx: 1.35, sy: 0.4, sz: 1.1, spinSpeed: 6.0,
              color: Math.abs(k) <= 1 ? '#6ee7b7' : '#10b981',
              ownerId: f.id, bounces: 1
            });
          }
        }
      }

      // 2. DRAMATIC FULL-ARENA SPELL CARD CURTAIN (When Spell Card is active!)
      if (spellCardTimer > 0) {
        const activeSpell = SPELL_CARDS[(currentSpellIndex + SPELL_CARDS.length - 1) % SPELL_CARDS.length];
        const petals = 16;
        const spiralOffset = time * 3.6;
        const spellPalette = [activeSpell.lightColor, '#ffffff', '#fde047', '#f472b6', '#38bdf8'];

        for (let p = 0; p < petals; p++) {
          const ang = (p / petals) * Math.PI * 2 + spiralOffset;
          const flowerMod = 1.0 + 0.38 * Math.sin(p * 4 + time * 5.0);
          const spd = 5.4 * flowerMod;
          spawnBullet({
            x: Math.sin(ang) * 0.6,
            y: 1.05 + Math.sin(time * 6 + p) * 0.25,
            z: Math.cos(ang) * 0.6,
            vx: Math.sin(ang) * spd,
            vz: Math.cos(ang) * spd,
            sx: 1.35, sy: 1.35, sz: 1.35,
            spinSpeed: 8.0,
            color: spellPalette[(p + step) % spellPalette.length],
            ownerId: 'spellcard', // Hits ALL Fumos for hilarious arena-wide ragdoll chaos!
            bounces: 2,
            maxLife: 5.2
          });
        }
      }
    }

    function updateBulletsAndTrails(dt, time) {
      if (spellCardTimer > 0) {
        spellCardTimer = Math.max(0, spellCardTimer - dt);
        if (spellCardTimer === 0) {
          spellBannerEl.classList.remove('is-active');
        }
      }

      emitDanmakuPatterns(time, dt);

      let activeBulletCount = 0;

      // 1. Update Active Bullets, Rim Bounces & Fumo Ragdoll Hits
      for (let i = 0; i < MAX_BULLETS; i++) {
        const b = bullets[i];
        if (!b.active) continue;

        b.age += dt;
        if (b.age >= b.maxLife) {
          b.active = false;
          tempMatrix.makeScale(0, 0, 0);
          bulletInstanced.setMatrixAt(i, tempMatrix);
          continue;
        }

        activeBulletCount++;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.z += b.vz * dt;

        // Spawn fading voxel trail behind bullet
        b.trailTick += dt;
        if (b.trailTick >= 0.045) {
          b.trailTick = 0;
          spawnTrailVoxel(b.x, b.y, b.z, b.colorHex, 0.72 * Math.min(b.sx, b.sz));
        }

        // Bounce off the Raised Circular Arena Rim (r = 9.75)
        const r = Math.hypot(b.x, b.z);
        if (r >= 9.75) {
          if (b.bouncesLeft > 0) {
            b.bouncesLeft--;
            const nx = b.x / r;
            const nz = b.z / r;
            b.x = nx * 9.70;
            b.z = nz * 9.70;
            const dot = b.vx * nx + b.vz * nz;
            b.vx -= 2.0 * dot * nx;
            b.vz -= 2.0 * dot * nz;
            b.yaw = Math.atan2(b.vx, b.vz);
          } else {
            b.active = false;
            tempMatrix.makeScale(0, 0, 0);
            bulletInstanced.setMatrixAt(i, tempMatrix);
            continue;
          }
        }

        // Check Collision against Fumo Plushies!
        // Any Fumo that is thrown/airborne, near the center, or hit during a Spell Card gets knocked around!
        for (let fIdx = 0; fIdx < 6; fIdx++) {
          const f = fumos[fIdx];
          if (f.id === b.ownerId && b.bouncesLeft > 0) continue; // Don't self-hit on initial shot

          // Fumos on their home perimeter post only get knocked around if they were thrown/moved,
          // OR if a bounced bullet / Spell Card hits them!
          const distFromHome = Math.hypot(f.pos.x - f.homePos.x, f.pos.z - f.homePos.z);
          const isVulnerable = (distFromHome > 0.75) || !f.isGrounded || (b.ownerId === 'spellcard') || (f.ragdollTimer > 0);
          if (!isVulnerable) continue;

          const dx = b.x - f.pos.x;
          const dy = b.y - (f.pos.y + 0.65);
          const dz = b.z - f.pos.z;
          if (dx * dx + dy * dy + dz * dz < 0.72 * 0.72) {
            f.applyBulletImpulse({ x: b.vx, y: b.vy, z: b.vz }, b.colorHex);
            totalBonkCount++;
            if (hudHitCountEl) hudHitCountEl.textContent = String(totalBonkCount);

            b.active = false;
            tempMatrix.makeScale(0, 0, 0);
            bulletInstanced.setMatrixAt(i, tempMatrix);
            break;
          }
        }

        if (!b.active) continue;

        // Smooth fade-out scale in final 0.4s of bullet life
        const lifeLeft = b.maxLife - b.age;
        const fade = lifeLeft < 0.4 ? (lifeLeft / 0.4) : 1.0;

        tempPos.set(b.x, b.y, b.z);
        if (b.spinSpeed > 0.01) {
          tempEuler.set(b.age * b.spinSpeed, b.yaw + b.age * b.spinSpeed, 0);
        } else {
          tempEuler.set(0, b.yaw, 0);
        }
        tempQuat.setFromEuler(tempEuler);
        tempScale.set(b.sx * fade, b.sy * fade, b.sz * fade);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        bulletInstanced.setMatrixAt(i, tempMatrix);
      }

      bulletInstanced.instanceMatrix.needsUpdate = true;
      if (bulletInstanced.instanceColor) bulletInstanced.instanceColor.needsUpdate = true;
      if (hudBulletCountEl) hudBulletCountEl.textContent = String(activeBulletCount);

      // 2. Update Fading Voxel Bullet Trails
      for (let i = 0; i < MAX_TRAILS; i++) {
        const t = trails[i];
        if (!t.active) continue;
        t.age += dt;
        if (t.age >= t.maxLife) {
          t.active = false;
          tempMatrix.makeScale(0, 0, 0);
          trailInstanced.setMatrixAt(i, tempMatrix);
          continue;
        }
        const s = t.scale * (1.0 - t.age / t.maxLife);
        tempPos.set(t.x, t.y, t.z);
        tempQuat.identity();
        tempScale.set(s, s, s);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        trailInstanced.setMatrixAt(i, tempMatrix);
      }
      trailInstanced.instanceMatrix.needsUpdate = true;
      if (trailInstanced.instanceColor) trailInstanced.instanceColor.needsUpdate = true;
    }

    // ============================================================================
    // 10. POINTER INTERACTION: RAYCASTING, SQUEEZE, PICK UP, DRAG & THROW
    // ============================================================================
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    const dragPlane = new THREE.Plane();
    const dragHitPoint = new THREE.Vector3();
    const dragOffset = new THREE.Vector3();

    let hoveredFumo = null;
    let selectedFumo = null;
    let isDraggingFumo = false;
    let pointerDownScreen = new THREE.Vector2();
    let dragHistory = [];

    const tooltipEl = document.getElementById('fumo-tooltip');
    const tooltipEmojiEl = document.getElementById('tooltip-emoji');
    const tooltipTextEl = document.getElementById('tooltip-text');
    const badgeEl = document.getElementById('fumo-badge');
    const badgeDotEl = document.getElementById('fumo-badge-dot');
    const badgeNameEl = document.getElementById('fumo-badge-name');
    const badgeStatusEl = document.getElementById('fumo-badge-status');

    function updatePointerNDC(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function pickFumoUnderPointer() {
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(allFumoRaycastMeshes, false);
      if (hits.length > 0 && hits[0].object.userData.fumo) {
        return { fumo: hits[0].object.userData.fumo, point: hits[0].point };
      }
      return null;
    }

    function updateUIBadge(fumo, statusText) {
      if (!fumo) {
        badgeEl.classList.add('hidden');
        badgeEl.classList.remove('flex');
        return;
      }
      badgeEl.classList.remove('hidden');
      badgeEl.classList.add('flex');
      badgeDotEl.style.backgroundColor = fumo.accentColor;
      badgeNameEl.textContent = fumo.name;
      badgeStatusEl.textContent = statusText;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      recordInteraction();
      updatePointerNDC(e);
      pointerDownScreen.set(e.clientX, e.clientY);

      const hit = pickFumoUnderPointer();
      if (hit) {
        selectedFumo = hit.fumo;
        isDraggingFumo = false;
        controls.enabled = false;

        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        dragPlane.setFromNormalAndCoplanarPoint(camDir.negate(), selectedFumo.pos);

        if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
          dragOffset.subVectors(selectedFumo.pos, dragHitPoint);
        } else {
          dragOffset.set(0, 0, 0);
        }

        dragHistory = [{ pos: selectedFumo.pos.clone(), time: performance.now() }];
        updateUIBadge(selectedFumo, 'Selected');
      }
    });

    window.addEventListener('pointermove', (e) => {
      updatePointerNDC(e);

      if (selectedFumo) {
        recordInteraction();
        const moveDist = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);

        if (!isDraggingFumo && moveDist > 6) {
          isDraggingFumo = true;
          selectedFumo.isDragged = true;
          selectedFumo.isGrounded = false;
          selectedFumo.squashVel += 3.2;
          soundFX.playPickup();
          updateUIBadge(selectedFumo, 'Throw into the Danmaku!');
        }

        if (isDraggingFumo) {
          raycaster.setFromCamera(pointerNDC, camera);
          if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
            const targetPos = dragHitPoint.clone().add(dragOffset);
            const r = Math.hypot(targetPos.x, targetPos.z);
            if (r > 9.4) {
              targetPos.x = (targetPos.x / r) * 9.4;
              targetPos.z = (targetPos.z / r) * 9.4;
            }
            targetPos.y = THREE.MathUtils.clamp(targetPos.y, 0.25, 11.0);

            const prevPos = selectedFumo.pos.clone();
            selectedFumo.pos.lerp(targetPos, 0.55);

            const deltaMove = selectedFumo.pos.clone().sub(prevPos);
            selectedFumo.headRollVel -= deltaMove.x * 16.0;
            selectedFumo.headPitchVel += deltaMove.z * 16.0 - deltaMove.y * 10.0;
            selectedFumo.limbRollVel -= deltaMove.x * 22.0;
            selectedFumo.roll = THREE.MathUtils.lerp(selectedFumo.roll, THREE.MathUtils.clamp(-deltaMove.x * 1.4, -0.45, 0.45), 0.3);
            selectedFumo.pitch = THREE.MathUtils.lerp(selectedFumo.pitch, THREE.MathUtils.clamp(deltaMove.z * 1.4, -0.45, 0.45), 0.3);

            const now = performance.now();
            dragHistory.push({ pos: selectedFumo.pos.clone(), time: now });
            while (dragHistory.length > 6) dragHistory.shift();
          }
          tooltipEl.style.opacity = '0';
          renderer.domElement.style.cursor = 'grabbing';
          return;
        }
      }

      const hit = pickFumoUnderPointer();
      if (hit) {
        hoveredFumo = hit.fumo;
        renderer.domElement.style.cursor = 'grab';
        tooltipEmojiEl.textContent = hoveredFumo.emoji;
        tooltipTextEl.textContent = hoveredFumo.name;
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = `${e.clientX + 14}px`;
        tooltipEl.style.top = `${e.clientY - 18}px`;
      } else {
        hoveredFumo = null;
        renderer.domElement.style.cursor = 'default';
        tooltipEl.style.opacity = '0';
      }
    });

    window.addEventListener('pointerup', () => {
      if (!selectedFumo) return;
      controls.enabled = true;
      recordInteraction();

      if (!isDraggingFumo) {
        selectedFumo.squeeze(1.0);
        updateUIBadge(selectedFumo, 'Squeezed! ᗜˬᗜ');
      } else {
        selectedFumo.isDragged = false;
        selectedFumo.ragdollTimer = 2.4; // Make vulnerable to comedic bullet ragdoll hits!
        const now = performance.now();
        while (dragHistory.length > 1 && now - dragHistory[0].time > 140) {
          dragHistory.shift();
        }
        if (dragHistory.length >= 2) {
          const first = dragHistory[0];
          const last = dragHistory[dragHistory.length - 1];
          const dtSec = Math.max(0.016, (last.time - first.time) / 1000);
          const throwVel = last.pos.clone().sub(first.pos).divideScalar(dtSec);
          if (throwVel.length() > 20) throwVel.setLength(20);
          selectedFumo.vel.copy(throwVel);

          const speed = throwVel.length();
          selectedFumo.angVel.set(
            throwVel.z * 0.65 + (Math.random() - 0.5) * speed * 0.4,
            (Math.random() - 0.5) * speed * 0.5,
            -throwVel.x * 0.65 + (Math.random() - 0.5) * speed * 0.4
          );
        } else {
          selectedFumo.vel.set(0, 0, 0);
        }
        updateUIBadge(selectedFumo, 'Thrown into Danmaku!');
      }

      selectedFumo = null;
      isDraggingFumo = false;
      renderer.domElement.style.cursor = hoveredFumo ? 'grab' : 'default';
    });

    // ============================================================================
    // 11. DAY / NIGHT SMOOTH INTERPOLATION (~2 SECONDS) & HUB INTEGRATION
    // ============================================================================
    const STORAGE_MODE_KEY = 'voxel_fumo_danmaku_mode';
    let isNightMode = false;
    let dayNightProgress = 0.0; // 0.0 = Day, 1.0 = Night
    let dayNightTarget = 0.0;

    const daySkyColor = new THREE.Color('#7cc4ff');
    const nightSkyColor = new THREE.Color('#070817');

    const daySunLightCol = new THREE.Color('#fff1d0');
    const nightMoonLightCol = new THREE.Color('#64748b');

    const dayHemiSky = new THREE.Color('#fff8eb');
    const nightHemiSky = new THREE.Color('#1e1b4b');
    const dayHemiGround = new THREE.Color('#6c8ebf');
    const nightHemiGround = new THREE.Color('#090a19');

    const dayCloudCol = new THREE.Color('#ffffff');
    const nightCloudCol = new THREE.Color('#312e81');

    function notifyParentMode() {
      const modeStr = isNightMode ? 'night' : 'day';
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'modeChanged', mode: modeStr }, '*');
        }
      } catch (e) {}
    }

    function setDayNightMode(night, { immediate = false, playSound = true } = {}) {
      isNightMode = Boolean(night);
      dayNightTarget = isNightMode ? 1.0 : 0.0;
      if (immediate) {
        dayNightProgress = dayNightTarget;
      }
      document.body.classList.toggle('night-ui', isNightMode);

      try {
        localStorage.setItem(STORAGE_MODE_KEY, isNightMode ? 'night' : 'day');
      } catch (e) {}

      if (playSound) {
        soundFX.playPickup();
      }
      notifyParentMode();
    }

    function toggleDayNight() {
      setDayNightMode(!isNightMode, { immediate: false, playSound: true });
    }

    function updateDayNightTransition(dt) {
      if (Math.abs(dayNightProgress - dayNightTarget) > 0.0005) {
        const step = dt * 0.52; // ~2 seconds transition
        if (dayNightProgress < dayNightTarget) {
          dayNightProgress = Math.min(dayNightTarget, dayNightProgress + step);
        } else {
          dayNightProgress = Math.max(dayNightTarget, dayNightProgress - step);
        }
      }

      const t = dayNightProgress < 0.5
        ? 4 * dayNightProgress * dayNightProgress * dayNightProgress
        : 1 - Math.pow(-2 * dayNightProgress + 2, 3) / 2;

      // 1. Sky Background, Fog & Cosmic Galaxy Starfield
      scene.background.lerpColors(daySkyColor, nightSkyColor, t);
      scene.fog.color.copy(scene.background);
      scene.fog.density = THREE.MathUtils.lerp(0.0068, 0.0095, t);
      starMat.opacity = THREE.MathUtils.lerp(0.0, 0.96, t);

      // 2. Clouds & Giant Moon/Sun
      cloudMat.color.lerpColors(dayCloudCol, nightCloudCol, t);
      cloudMat.opacity = THREE.MathUtils.lerp(0.92, 0.45, t);

      // 3. Directional Sun -> Moon Light & Hemisphere Bounce
      sunDirLight.color.lerpColors(daySunLightCol, nightMoonLightCol, t);
      sunDirLight.intensity = THREE.MathUtils.lerp(1.35, 0.35, t);

      hemiLight.color.lerpColors(dayHemiSky, nightHemiSky, t);
      hemiLight.groundColor.lerpColors(dayHemiGround, nightHemiGround, t);
      hemiLight.intensity = THREE.MathUtils.lerp(0.78, 0.24, t);

      // 4. Dynamic Platform & Bullet Glow Lights
      arenaCenterLight.intensity = THREE.MathUtils.lerp(0.25, 1.85, t);
      spellAccentLight.intensity = THREE.MathUtils.lerp(0.20, 1.55, t) + (spellCardTimer > 0 ? 1.2 : 0);

      // 5. Emissive Strengths (Bullets, Inscribed Rune Circle, Crystal Wings)
      bulletMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.65, 2.25, t);
      runeEmissiveMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.45, 2.1, t);
      translucentIceMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.25, 1.15, t);
      crystalWingMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.35, 1.45, t);

      // 6. UnrealBloomPass Strength
      if (bloomPass) {
        bloomPass.strength = THREE.MathUtils.lerp(0.18, 0.82, t) + (spellCardTimer > 0 ? 0.25 : 0);
        bloomPass.threshold = THREE.MathUtils.lerp(0.82, 0.52, t);
      }
    }

    // Button & Keyboard Event Listeners
    document.getElementById('btn-spell-card').addEventListener('click', () => {
      recordInteraction();
      triggerSpellCard();
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      fumos.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 45));
      updateUIBadge(null, '');
    });

    document.getElementById('btn-squeeze-all').addEventListener('click', () => {
      fumos.forEach((f, idx) => setTimeout(() => f.squeeze(1.05), idx * 55));
    });

    const btnSound = document.getElementById('btn-sound');
    const iconSoundOn = document.getElementById('icon-sound-on');
    const iconSoundOff = document.getElementById('icon-sound-off');
    btnSound.addEventListener('click', () => {
      soundFX.enabled = !soundFX.enabled;
      iconSoundOn.classList.toggle('hidden', !soundFX.enabled);
      iconSoundOff.classList.toggle('hidden', soundFX.enabled);
      if (soundFX.enabled) soundFX.playPickup();
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      const key = e.key.toLowerCase();
      if (key === 'n') {
        e.preventDefault();
        toggleDayNight();
      } else if (key === 'r') {
        fumos.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 45));
      } else if (key === ' ' || key === 'c') {
        e.preventDefault();
        triggerSpellCard();
      } else if (key === 's') {
        fumos.forEach((f, idx) => setTimeout(() => f.squeeze(1.05), idx * 55));
      } else if (key === 'm') {
        btnSound.click();
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================================
    // 12. MAIN ANIMATION LOOP, PAUSE / RESUME & HUB MESSAGE LISTENER
    // ============================================================================
    let prevTime = performance.now();
    let isPaused = false;
    let rafId = null;

    function animate(now) {
      if (isPaused) return;
      rafId = requestAnimationFrame(animate);

      const dt = Math.min(0.033, Math.max(0.001, (now - prevTime) / 1000));
      prevTime = now;
      const elapsed = now * 0.001;

      if (!selectedFumo && (now - lastUserInteractionTime > 4500)) {
        controls.autoRotate = true;
      }

      controls.update();
      updateDayNightTransition(dt);
      updateEnvironmentProps(elapsed, dt);
      updateBulletsAndTrails(dt, elapsed);
      updatePopParticles(dt);

      for (let i = 0; i < fumos.length; i++) {
        fumos[i].updatePhysics(dt, elapsed);
      }
      resolveFumoToFumoCollisions();

      // Cycle center arena light hue gently with the danmaku
      arenaCenterLight.color.setHSL((elapsed * 0.09) % 1.0, 0.85, 0.6);

      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    function pauseRenderLoop() {
      if (isPaused) return;
      isPaused = true;
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    function resumeRenderLoop() {
      if (!isPaused) return;
      isPaused = false;
      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    }

    // Listen for messages from the parent scene browser hub
    window.addEventListener('message', (e) => {
      const data = e.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'toggleMode') {
        toggleDayNight();
      } else if (data.type === 'pause') {
        pauseRenderLoop();
      } else if (data.type === 'resume') {
        resumeRenderLoop();
      }
    });

    window.onload = function () {
      let initialNight = false;
      try {
        const saved = localStorage.getItem(STORAGE_MODE_KEY);
        if (saved === 'night') initialNight = true;
      } catch (e) {}

      setDayNightMode(initialNight, { immediate: true, playSound: false });
      updateDayNightTransition(0);

      // Initial welcoming bounce on all fumos
      fumos.forEach((f, idx) => {
        setTimeout(() => {
          f.squash = 0.78;
          f.squashVel = 2.0;
          f.headPitchVel = 4.0;
        }, 120 + idx * 70);
      });

      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    };
  </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Danmaku Showdown — Touhou Fumo Voxel Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Three.js r128 + OrbitControls + Post-Processing (UnrealBloomPass) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background-color: #0b0c1e;
    }
    h1, .font-display {
      font-family: 'Fredoka', sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.80);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.70);
      box-shadow: 0 10px 28px -6px rgba(20, 15, 45, 0.18), 0 2px 6px rgba(20, 15, 45, 0.08);
      transition: background 0.5s ease, color 0.5s ease, border-color 0.5s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    body.night-ui .glass-panel {
      background: rgba(20, 19, 42, 0.80);
      border-color: rgba(155, 135, 245, 0.30);
      color: #f3f0ff;
      box-shadow: 0 10px 30px -6px rgba(0, 0, 0, 0.65), 0 0 18px rgba(130, 110, 255, 0.18);
    }
    .ui-btn {
      cursor: pointer;
    }
    .ui-btn:hover {
      transform: translateY(-2px) scale(1.03);
    }
    .ui-btn:active {
      transform: translateY(1px) scale(0.97);
    }
    #fumo-tooltip {
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    kbd {
      font-family: 'Fredoka', sans-serif;
      display: inline-block;
      padding: 1px 6px;
      font-size: 0.75rem;
      line-height: 1.2;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.08);
      border-bottom: 2px solid rgba(0, 0, 0, 0.18);
    }
    body.night-ui kbd {
      background: rgba(255, 255, 255, 0.14);
      border-bottom-color: rgba(255, 255, 255, 0.28);
    }

    /* Dramatic Spell Card Button */
    .spell-btn {
      background: linear-gradient(135deg, rgba(225, 29, 72, 0.92), rgba(124, 58, 237, 0.92));
      color: #ffffff !important;
      border: 1.5px solid rgba(255, 228, 230, 0.75) !important;
      box-shadow: 0 10px 30px -4px rgba(225, 29, 72, 0.55), 0 0 22px rgba(168, 85, 247, 0.45);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, filter 0.2s ease;
    }
    .spell-btn:hover {
      transform: translateY(-3px) scale(1.05);
      filter: brightness(1.1);
      box-shadow: 0 14px 36px -4px rgba(225, 29, 72, 0.75), 0 0 30px rgba(236, 72, 153, 0.65);
    }
    .spell-btn:active {
      transform: translateY(1px) scale(0.97);
    }

    /* Screen-wide Spell Card Flash */
    #spell-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 40;
      opacity: 0;
      mix-blend-mode: screen;
      transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Stylized Touhou Spell Card Declaration Banner */
    #spell-banner {
      position: fixed;
      top: 76px;
      right: -520px;
      z-index: 35;
      pointer-events: none;
      transition: right 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
      opacity: 0;
    }
    #spell-banner.is-active {
      right: 16px;
      opacity: 1;
    }
    .spell-banner-card {
      background: linear-gradient(90deg, rgba(15, 12, 34, 0.92) 0%, rgba(45, 18, 65, 0.92) 100%);
      border-left: 5px solid #f43f5e;
      border-top: 1px solid rgba(255, 255, 255, 0.28);
      border-bottom: 1px solid rgba(255, 255, 255, 0.28);
      border-right: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55), 0 0 28px var(--spell-glow, rgba(244, 63, 94, 0.5));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="text-slate-800">
  <div id="canvas-container"></div>

  <!-- Screen-Wide Color Flash Overlay -->
  <div id="spell-flash"></div>

  <!-- Stylized Touhou Spell Card Banner -->
  <div id="spell-banner">
    <div id="spell-banner-inner" class="spell-banner-card rounded-2xl px-5 py-3 text-white flex items-center gap-3.5 min-w-[290px] sm:min-w-[350px]">
      <div id="spell-banner-emoji" class="text-3xl leading-none select-none filter drop-shadow">🌟</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between gap-2 text-[10px] uppercase tracking-widest text-rose-300 font-bold">
          <span id="spell-banner-caster">Marisa Kirisame</span>
          <span>SPELL CARD BONUS ★ 99,990</span>
        </div>
        <div id="spell-banner-title" class="font-display text-base sm:text-lg font-bold tracking-wide text-amber-200 truncate">
          Love Sign "Master Spark"
        </div>
      </div>
    </div>
  </div>

  <!-- Top-Right Controls: Active Fumo / Graze Badge, Squeeze All, Reset, Sound (Top-Left kept 100% clear for Hub) -->
  <div class="fixed top-4 right-4 z-20 flex items-center gap-2.5">
    <!-- Active / Hovered Fumo Indicator -->
    <div id="fumo-badge" class="glass-panel rounded-2xl px-3.5 py-2.5 text-xs font-semibold hidden items-center gap-2 transition-all">
      <span id="fumo-badge-dot" class="w-2.5 h-2.5 rounded-full inline-block bg-rose-500"></span>
      <span id="fumo-badge-name">Marisa Kirisame</span>
      <span id="fumo-badge-status" class="opacity-70 ml-1">Firing</span>
    </div>

    <!-- Live Bullet / Hit Counter Pill -->
    <div class="glass-panel rounded-2xl px-3.5 py-2.5 hidden lg:flex items-center gap-2 text-xs font-semibold">
      <span class="text-rose-500 font-display">弾</span>
      <span id="hud-bullet-count" class="font-mono font-bold">0</span>
      <span class="opacity-60">•</span>
      <span class="text-amber-500 font-display">BONKS</span>
      <span id="hud-hit-count" class="font-mono font-bold">0</span>
    </div>

    <!-- Squeeze All Button -->
    <button id="btn-squeeze-all" title="Squeeze All Fumos! (S)"
      class="glass-panel ui-btn rounded-2xl px-3.5 py-2.5 flex items-center gap-2 text-xs sm:text-sm font-semibold">
      <span class="text-base leading-none">ᗜˬᗜ</span>
      <span class="hidden md:inline">Squeeze All</span>
    </button>

    <!-- Reset Fumos Button -->
    <button id="btn-reset" title="Return Fumos to Arena Posts (R)"
      class="glass-panel ui-btn rounded-2xl px-3.5 py-2.5 flex items-center gap-2 text-xs sm:text-sm font-semibold">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      <span class="hidden sm:inline">Reset</span>
    </button>

    <!-- Sound Toggle Button -->
    <button id="btn-sound" title="Toggle Plush & Danmaku Sound Effects (M)"
      class="glass-panel ui-btn rounded-2xl p-2.5 flex items-center justify-center">
      <svg id="icon-sound-on" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
      <svg id="icon-sound-off" class="w-5 h-5 hidden opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
    </button>
  </div>

  <!-- Floating Cursor Tooltip for Hovered Fumo -->
  <div id="fumo-tooltip" class="fixed z-30 opacity-0 px-3 py-1.5 rounded-xl glass-panel text-xs font-semibold flex items-center gap-2 shadow-lg">
    <span id="tooltip-emoji">🌟</span>
    <span id="tooltip-text">Marisa Fumo</span>
  </div>

  <!-- Bottom Center: SPELL CARD BUTTON + HUD Hints -->
  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center gap-2.5 w-max max-w-[94vw] pointer-events-none">
    <!-- Spell Card Trigger Button -->
    <button id="btn-spell-card" type="button"
      class="spell-btn pointer-events-auto rounded-full px-6 py-2.5 flex items-center gap-2.5 text-sm sm:text-base font-display font-bold tracking-wide cursor-pointer">
      <span class="text-lg leading-none">✨</span>
      <span>SPELL CARD!</span>
      <span id="spell-btn-sub" class="text-xs font-sans font-semibold opacity-90 bg-black/25 px-2 py-0.5 rounded-full">Space</span>
    </button>

    <!-- Bottom HUD Hints -->
    <div class="glass-panel rounded-2xl px-4 py-1.5 text-xs font-semibold flex flex-wrap items-center justify-center gap-x-4 gap-y-1 opacity-90">
      <span>🖱️ <b>Click Fumo:</b> Squeeze</span>
      <span>✋ <b>Throw into Bullets:</b> Ragdoll Knockback!</span>
      <span>🔄 <b>Drag Sky:</b> Orbit</span>
      <span class="hidden sm:inline"><kbd>Space</kbd> Spell Card</span>
      <span class="hidden md:inline"><kbd>R</kbd> Reset</span>
    </div>
  </div>

  <script>
    // ============================================================================
    // 1. PROCEDURAL WEB AUDIO SYNTHESIZER (Plush Squeaks, Ragdoll Bonks & Spell Chimes)
    // ============================================================================
    class PlushSoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.lastBonkTime = 0;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playSqueeze(pitchMultiplier = 1.0) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sine';
          const baseFreq = (520 + Math.random() * 80) * pitchMultiplier;
          osc1.frequency.setValueAtTime(baseFreq, now);
          osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.48, now + 0.085);
          osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.15, now + 0.16);

          gain1.gain.setValueAtTime(0.001, now);
          gain1.gain.linearRampToValueAtTime(0.11, now + 0.025);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.17);

          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.18);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(baseFreq * 1.1, now + 0.11);
          osc2.frequency.exponentialRampToValueAtTime(baseFreq * 1.65, now + 0.21);

          gain2.gain.setValueAtTime(0.001, now + 0.11);
          gain2.gain.linearRampToValueAtTime(0.08, now + 0.13);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start(now + 0.11);
          osc2.stop(now + 0.25);
        } catch (e) {}
      }

      playBounce(intensity = 0.5) {
        if (!this.enabled || intensity < 0.08) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const vol = Math.min(0.14, intensity * 0.12);

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const startFreq = 115 + Math.min(80, intensity * 35);
          osc.frequency.setValueAtTime(startFreq, now);
          osc.frequency.exponentialRampToValueAtTime(42, now + 0.09);

          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        } catch (e) {}
      }

      playBulletBonk() {
        if (!this.enabled) return;
        const nowMs = performance.now();
        if (nowMs - this.lastBonkTime < 55) return; // Rate limit rapid bullet hits
        this.lastBonkTime = nowMs;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          const f = 320 + Math.random() * 240;
          osc.frequency.setValueAtTime(f, now);
          osc.frequency.exponentialRampToValueAtTime(f * 0.45, now + 0.065);
          gain.gain.setValueAtTime(0.065, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.075);
        } catch (e) {}
      }

      playSpellCardDeclare() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          // Iconic dramatic Touhou-style ascending chord chime
          const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = idx % 2 === 0 ? 'triangle' : 'sine';
            const t0 = now + idx * 0.055;
            osc.frequency.setValueAtTime(freq, t0);
            osc.frequency.exponentialRampToValueAtTime(freq * 1.03, t0 + 0.38);
            gain.gain.setValueAtTime(0.001, t0);
            gain.gain.linearRampToValueAtTime(0.08, t0 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.45);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t0);
            osc.stop(t0 + 0.46);
          });
        } catch (e) {}
      }

      playPickup() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(440, now + 0.09);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.05, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        } catch (e) {}
      }
    }

    const soundFX = new PlushSoundEngine();

    // ============================================================================
    // 2. COLOR & VOXEL HELPER UTILITIES
    // ============================================================================
    const tempColor = new THREE.Color();
    const tempMatrix = new THREE.Matrix4();
    const tempPos = new THREE.Vector3();
    const tempQuat = new THREE.Quaternion();
    const tempScale = new THREE.Vector3();
    const tempEuler = new THREE.Euler();

    function voxelHash(x, y, z) {
      let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
      return n - Math.floor(n);
    }

    function varyColor(hexOrString, x, y, z, variance = 0.035, seamDarken = 0) {
      tempColor.set(hexOrString);
      const h = voxelHash(x, y, z);
      const delta = (h - 0.5) * 2 * variance - seamDarken;
      tempColor.offsetHSL(0, (h - 0.5) * 0.03, delta);
      return tempColor.clone();
    }

    function createSoftVoxelGeometry(size = 1) {
      const s = size * 0.985;
      return new THREE.BoxGeometry(s, s, s);
    }

    function buildVoxelInstancedMesh(voxels, unitSize, material, castShadow = true, receiveShadow = true) {
      if (!voxels || voxels.length === 0) return null;
      const geom = createSoftVoxelGeometry(unitSize);
      const mesh = new THREE.InstancedMesh(geom, material, voxels.length);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = receiveShadow;

      for (let i = 0; i < voxels.length; i++) {
        const v = voxels[i];
        tempPos.set(v.x * unitSize, v.y * unitSize, v.z * unitSize);
        if (v.rx || v.ry || v.rz) {
          tempEuler.set(v.rx || 0, v.ry || 0, v.rz || 0);
          tempQuat.setFromEuler(tempEuler);
        } else {
          tempQuat.identity();
        }
        tempScale.set(v.sx || 1, v.sy || 1, v.sz || 1);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        mesh.setMatrixAt(i, tempMatrix);
        mesh.setColorAt(i, v.color instanceof THREE.Color ? v.color : new THREE.Color(v.color));
      }
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      return mesh;
    }

    // ============================================================================
    // 3. SCENE, CAMERA, RENDERER & POST-PROCESSING SETUP
    // ============================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#7cc4ff');
    scene.fog = new THREE.FogExp2('#7cc4ff', 0.0072);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.5, 180);
    camera.position.set(0.0, 15.5, 24.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    // Post-Processing Composer with UnrealBloomPass
    let composer = null;
    let bloomPass = null;
    try {
      const renderPass = new THREE.RenderPass(scene, camera);
      bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.22, // strength (interpolated between Day 0.22 and Night 0.85)
        0.55, // radius
        0.78  // threshold
      );
      composer = new THREE.EffectComposer(renderer);
      composer.addPass(renderPass);
      composer.addPass(bloomPass);
    } catch (err) {
      composer = null;
    }

    // OrbitControls with smooth damping and gentle idle auto-rotation
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0.0, 2.2, 0.0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.minPolarAngle = Math.PI * 0.06;
    controls.minDistance = 9;
    controls.maxDistance = 48;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.45;

    let lastUserInteractionTime = performance.now();
    const recordInteraction = () => {
      lastUserInteractionTime = performance.now();
      controls.autoRotate = false;
    };
    controls.addEventListener('start', recordInteraction);

    // ============================================================================
    // 4. LIGHTING SETUP (Capped Dynamic Lights for Performance)
    // ============================================================================
    // 1. Hemisphere Sky/Ground Light
    const hemiLight = new THREE.HemisphereLight(0xfff8eb, 0x6c8ebf, 0.78);
    hemiLight.position.set(0, 30, 0);
    scene.add(hemiLight);

    // 2. Main Sun / Moon Directional Light (Casts soft shadows on the arena)
    const sunDirLight = new THREE.DirectionalLight(0xfff1d0, 1.35);
    sunDirLight.position.set(16, 24, 14);
    sunDirLight.castShadow = true;
    sunDirLight.shadow.mapSize.width = 2048;
    sunDirLight.shadow.mapSize.height = 2048;
    sunDirLight.shadow.camera.near = 4;
    sunDirLight.shadow.camera.far = 65;
    const dCam = 15.0;
    sunDirLight.shadow.camera.left = -dCam;
    sunDirLight.shadow.camera.right = dCam;
    sunDirLight.shadow.camera.top = dCam;
    sunDirLight.shadow.camera.bottom = -dCam;
    sunDirLight.shadow.bias = -0.0006;
    sunDirLight.shadow.radius = 2.2;
    scene.add(sunDirLight);

    // 3. Center Rune Circle & Bullet Glow PointLight (Lights up the platform & fumos at night!)
    const arenaCenterLight = new THREE.PointLight(0xec4899, 0.35, 22, 1.4);
    arenaCenterLight.position.set(0, 2.8, 0);
    scene.add(arenaCenterLight);

    // 4. Rim / Spell Card Dynamic Accent PointLight
    const spellAccentLight = new THREE.PointLight(0x38bdf8, 0.25, 26, 1.5);
    spellAccentLight.position.set(0, 6.5, 0);
    scene.add(spellAccentLight);

    // Shared Materials
    const plushMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.92,
      metalness: 0.02
    });

    const arenaStoneMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.78,
      metalness: 0.08
    });

    const glossyPropMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.25,
      metalness: 0.22
    });

    const runeEmissiveMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: new THREE.Color(0x60a5fa),
      emissiveIntensity: 0.55,
      roughness: 0.2
    });

    const translucentIceMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.86,
      roughness: 0.15,
      metalness: 0.05,
      transmission: 0.35,
      emissive: new THREE.Color(0x38bdf8),
      emissiveIntensity: 0.35
    });

    const crystalWingMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.2,
      metalness: 0.1,
      emissive: new THREE.Color(0xffffff),
      emissiveIntensity: 0.45
    });

    const bulletMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: new THREE.Color(0xffffff),
      emissiveIntensity: 0.85,
      roughness: 0.15
    });

    const trailMaterial = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.65
    });

    // ============================================================================
    // 5. FLOATING SKY ARENA, RUNE CIRCLE, SCOREBOARD PILLARS, FLOATING ISLANDS & CLOUDS
    // ============================================================================
    const RV = 0.28; // 1 Arena Voxel = 0.28 world units
    const ARENA_RADIUS = 10.6; // World units (approx 38 arena voxels radius)
    const ARENA_RIM_INNER = 9.9;
    const furnitureColliders = [];

    function addCollider(minX, minY, minZ, maxX, maxY, maxZ, name = 'prop') {
      furnitureColliders.push({
        min: new THREE.Vector3(minX, minY, minZ),
        max: new THREE.Vector3(maxX, maxY, maxZ),
        name
      });
    }

    const arenaSolidVoxels = [];
    const arenaRuneVoxels = [];
    const arenaGlossyVoxels = [];

    function pushVoxel(list, rx, ry, rz, colorHex, variance = 0.03, sx = 1, sy = 1, sz = 1) {
      list.push({
        x: rx,
        y: ry,
        z: rz,
        color: varyColor(colorHex, rx, ry, rz, variance),
        sx, sy, sz
      });
    }

    // ----------------------------------------------------------------------------
    // 5A. CIRCULAR FLOATING ARENA PLATFORM WITH INSCRIBED RUNE CIRCLE & RAISED RIM
    // ----------------------------------------------------------------------------
    function buildFloatingArena() {
      const gridR = 38; // 38 * 0.28 = 10.64 world radius

      for (let x = -gridR; x <= gridR; x++) {
        for (let z = -gridR; z <= gridR; z++) {
          const r = Math.hypot(x, z);
          if (r > gridR + 0.4) continue;

          const angle = Math.atan2(z, x);

          // 1. Inscribed Glowing Rune Circle Pattern on Top Surface (Y = 0)
          const isOuterRuneRing = Math.abs(r - 32.5) < 0.72 || Math.abs(r - 28.0) < 0.55;
          const isInnerRuneRing = Math.abs(r - 14.5) < 0.65 || Math.abs(r - 6.0) < 0.55;

          // Octagram / Hexagram star chords inside the circle (r <= 28)
          let isStarLine = false;
          if (r <= 28.2 && r >= 6.0) {
            for (let k = 0; k < 6; k++) {
              const a = (k * Math.PI) / 3;
              const distToChord = Math.abs(x * Math.cos(a) + z * Math.sin(a) - 14.0);
              if (distToChord < 0.52) {
                isStarLine = true;
                break;
              }
            }
          }
          // 8 radial rune spokes & arcane glyphs
          const spokeAngle = ((angle + Math.PI * 2) % (Math.PI / 4));
          const isRadialSpoke = (r >= 6.0 && r <= 32.5) && (spokeAngle < 0.045 || spokeAngle > (Math.PI / 4 - 0.045));
          const isRuneGlyph = (r > 28.8 && r < 31.8) && (Math.floor((angle + Math.PI) * 12) % 2 === 0) && (Math.round(r) === 30);

          const isRune = isOuterRuneRing || isInnerRuneRing || isStarLine || isRadialSpoke || isRuneGlyph;

          if (isRune && r < 35.2) {
            const runeCol = (Math.abs(r - 14.5) < 0.8 || isRuneGlyph) ? '#f472b6' : '#38bdf8';
            pushVoxel(arenaRuneVoxels, x, -0.35, z, runeCol, 0.015, 1, 0.75, 1);
          } else {
            // Alternating dark slate & mystic indigo stone tiles
            const tileCheck = (Math.floor((x + 40) / 3) + Math.floor((z + 40) / 3)) % 2 === 0;
            const ringTint = r > 33 ? '#334155' : (tileCheck ? '#1e293b' : '#263449');
            pushVoxel(arenaSolidVoxels, x, -0.5, z, ringTint, 0.025);
          }

          // 2. Raised Arena Rim (r from 35.2 to 38.2)
          if (r >= 35.2) {
            const rimHeight = r >= 36.5 ? 2 : 1;
            for (let ry = 1; ry <= rimHeight; ry++) {
              // Glowing energy bumper strip along inner rim at ry === 1
              if (ry === 1 && r < 36.4 && (Math.floor((angle + Math.PI) * 8) % 2 === 0)) {
                pushVoxel(arenaRuneVoxels, x, ry - 0.3, z, '#fb7185', 0.01, 1, 0.8, 1);
              } else {
                const rimCol = ry === 2 ? '#cbd5e1' : '#475569';
                pushVoxel(arenaSolidVoxels, x, ry - 0.3, z, rimCol, 0.02);
              }
            }
            // 8 Ornate Corner Lantern Pillars along the rim
            for (let p = 0; p < 8; p++) {
              const pa = (p * Math.PI) / 4 + Math.PI / 8;
              const px = Math.cos(pa) * 36.8;
              const pz = Math.sin(pa) * 36.8;
              if (Math.hypot(x - px, z - pz) < 1.35) {
                pushVoxel(arenaSolidVoxels, x, 2.7, z, '#94a3b8', 0.02);
                pushVoxel(arenaRuneVoxels, x, 3.7, z, p % 2 === 0 ? '#fde047' : '#38bdf8', 0.01);
                pushVoxel(arenaSolidVoxels, x, 4.5, z, '#334155', 0.02, 1.2, 0.6, 1.2);
              }
            }
          }

          // 3. Tapered Rocky Cliff Underbelly beneath the floating arena
          if (r > 34 || ((Math.abs(x) + Math.abs(z)) % 2 === 0)) {
            const depth = Math.max(1, Math.floor((1 - Math.pow(r / gridR, 1.65)) * 12 + voxelHash(x, 0, z) * 3.5));
            for (let dy = 1; dy <= depth; dy++) {
              // Only shell of underbelly to keep instance count lean
              if (dy === depth || r > 35.5 || dy === 2) {
                const rockCol = dy > 6 ? '#334155' : '#475569';
                pushVoxel(arenaSolidVoxels, x, -0.5 - dy, z, rockCol, 0.04);
              }
            }
          }
        }
      }

      // --------------------------------------------------------------------------
      // 5B. TWO SCOREBOARD PILLARS & REFEREE PODIUM AT BACK EDGE OF ARENA
      // --------------------------------------------------------------------------
      // Left Scoreboard Pillar (rx -16..-8, rz -38..-36, ry 2..18)
      for (let x = -16; x <= -8; x++) {
        for (let y = 2; y <= 18; y++) {
          const isFrame = (x === -16 || x === -8 || y === 2 || y === 18);
          if (isFrame) {
            pushVoxel(arenaSolidVoxels, x, y, -37, '#b91c1c', 0.02); // Hakurei red pillar frame
          } else {
            // Dark scoreboard LED matrix
            pushVoxel(arenaGlossyVoxels, x, y, -37, '#0f172a', 0.01);
            // Glowing pixel-art score bars & hearts/stars on front face (z = -36.3)
            if (y === 16 && x >= -15 && x <= -9) {
              pushVoxel(arenaRuneVoxels, x, y, -36.4, '#fde047', 0.01, 0.85, 0.7, 0.4); // HI-SCORE bar
            } else if (y === 13 && x >= -15 && x <= -10) {
              pushVoxel(arenaRuneVoxels, x, y, -36.4, '#fb7185', 0.01, 0.85, 0.7, 0.4); // PLAYER hearts
            } else if (y === 10 && x >= -15 && x <= -11) {
              pushVoxel(arenaRuneVoxels, x, y, -36.4, '#38bdf8', 0.01, 0.85, 0.7, 0.4); // SPELL stars
            } else if (y === 7 && x >= -15 && x <= -9) {
              pushVoxel(arenaRuneVoxels, x, y, -36.4, '#ef4444', 0.01, 0.85, 0.7, 0.4); // POWER MAX bar
            }
          }
        }
      }
      addCollider(-16 * RV, 0, -38 * RV, -8 * RV, 18.5 * RV, -35.5 * RV, 'scoreboard_left');

      // Right Scoreboard Pillar (rx 8..16, rz -38..-36, ry 2..18)
      for (let x = 8; x <= 16; x++) {
        for (let y = 2; y <= 18; y++) {
          const isFrame = (x === 8 || x === 16 || y === 2 || y === 18);
          if (isFrame) {
            pushVoxel(arenaSolidVoxels, x, y, -37, '#b91c1c', 0.02);
          } else {
            pushVoxel(arenaGlossyVoxels, x, y, -37, '#0f172a', 0.01);
            if (y === 16 && x >= 9 && x <= 15) {
              pushVoxel(arenaRuneVoxels, x, y, -36.4, '#a855f7', 0.01, 0.85, 0.7, 0.4);
            } else if (y === 13 && (x % 2 === 1)) {
              pushVoxel(arenaRuneVoxels, x, y, -36.4, '#4ade80', 0.01, 0.85, 0.7, 0.4);
            } else if (y === 9 && x >= 9 && x <= 14) {
              pushVoxel(arenaRuneVoxels, x, y, -36.4, '#fde047', 0.01, 0.85, 0.7, 0.4);
            }
          }
        }
      }
      addCollider(8 * RV, 0, -38 * RV, 16 * RV, 18.5 * RV, -35.5 * RV, 'scoreboard_right');

      // Center Back Referee Podium Pillar (rx -3..3, rz -38..-33, ry 1..11 -> top at Y = 11.5 * 0.28 = 3.22)
      for (let x = -3; x <= 3; x++) {
        for (let z = -38; z <= -33; z++) {
          for (let y = 1; y <= 11; y++) {
            if (x > -3 && x < 3 && z > -38 && z < -33 && y < 11) continue;
            const col = (y === 11) ? '#e63946' : ((y === 10) ? '#fde047' : '#334155');
            pushVoxel(arenaSolidVoxels, x, y, z, col, 0.02);
          }
        }
      }
      addCollider(-3.2 * RV, 0, -38.2 * RV, 3.2 * RV, 11.5 * RV, -32.8 * RV, 'referee_podium');
    }

    buildFloatingArena();

    const arenaGroup = new THREE.Group();
    scene.add(arenaGroup);

    const arenaSolidMesh = buildVoxelInstancedMesh(arenaSolidVoxels, RV, arenaStoneMaterial, true, true);
    const arenaRuneMesh = buildVoxelInstancedMesh(arenaRuneVoxels, RV, runeEmissiveMaterial, false, true);
    const arenaGlossyMesh = buildVoxelInstancedMesh(arenaGlossyVoxels, RV, glossyPropMaterial, true, true);

    if (arenaSolidMesh) arenaGroup.add(arenaSolidMesh);
    if (arenaRuneMesh) arenaGroup.add(arenaRuneMesh);
    if (arenaGlossyMesh) arenaGroup.add(arenaGlossyMesh);

    // ----------------------------------------------------------------------------
    // 5C. DRIFTING ROCK ISLANDS WITH TINY SHRINES & FLOATING TORII GATES
    // ----------------------------------------------------------------------------
    const floatingIslands = [];

    function createFloatingIsland(cfg) {
      const group = new THREE.Group();
      const voxSolid = [];
      const voxGlow = [];
      const rad = cfg.radius || 7;

      // 1. Rocky tapered island base + lush green grass top
      for (let x = -rad; x <= rad; x++) {
        for (let z = -rad; z <= rad; z++) {
          const r = Math.hypot(x, z);
          if (r > rad + 0.3) continue;
          // Grass top layer
          const grassCol = r > rad - 1.2 ? '#4ade80' : '#22c55e';
          pushVoxel(voxSolid, x, 0, z, grassCol, 0.04);

          // Tapered rock underbelly
          const depth = Math.max(1, Math.floor((1 - Math.pow(r / rad, 1.5)) * (rad * 1.1) + voxelHash(x, 2, z) * 2));
          for (let dy = 1; dy <= depth; dy++) {
            if (dy === depth || r > rad - 1.2) {
              pushVoxel(voxSolid, x, -dy, z, dy > 3 ? '#475569' : '#64748b', 0.04);
            }
          }
        }
      }

      // 2. Crimson Voxel Torii Gate on the Island
      if (cfg.hasTorii) {
        for (let y = 1; y <= 10; y++) {
          pushVoxel(voxSolid, -3, y, 2, y <= 2 ? '#1e293b' : '#dc2626', 0.02);
          pushVoxel(voxSolid, 3, y, 2, y <= 2 ? '#1e293b' : '#dc2626', 0.02);
        }
        for (let x = -5; x <= 5; x++) {
          pushVoxel(voxSolid, x, 8, 2, '#dc2626', 0.02); // Lower crossbar (Nuki)
          pushVoxel(voxSolid, x, 10, 2, '#dc2626', 0.02); // Upper lintel (Kasagi)
          pushVoxel(voxSolid, x, 11, 2, '#1e293b', 0.02, 1, 0.6, 1.2); // Black top cap
        }
        // Gold center plaque
        pushVoxel(voxGlow, 0, 9, 2.2, '#fde047', 0.01, 0.9, 1.1, 0.4);
      }

      // 3. Tiny Voxel Shrine Building & Cherry Blossom Tree
      if (cfg.hasShrine) {
        // Shrine wooden walls & red pillars
        for (let x = -3; x <= 3; x++) {
          for (let z = -4; z <= 0; z++) {
            for (let y = 1; y <= 4; y++) {
              const isCorner = (Math.abs(x) === 3 && (z === -4 || z === 0));
              const col = isCorner ? '#dc2626' : '#fef3c7';
              pushVoxel(voxSolid, x, y, z, col, 0.02);
            }
          }
        }
        // Curved tile shrine roof
        for (let ry = 0; ry <= 3; ry++) {
          const rxMax = 4 - ry;
          for (let x = -rxMax; x <= rxMax; x++) {
            for (let z = -5 + ry * 0.5; z <= 1 - ry * 0.5; z++) {
              pushVoxel(voxSolid, x, 5 + ry, z, '#334155', 0.03);
            }
          }
        }
        // Glowing paper lanterns flanking shrine entrance
        pushVoxel(voxGlow, -2.5, 2.5, 0.8, '#fde047', 0.01, 0.8, 1.2, 0.8);
        pushVoxel(voxGlow, 2.5, 2.5, 0.8, '#fde047', 0.01, 0.8, 1.2, 0.8);
      }

      if (cfg.hasSakura) {
        // Sakura tree trunk & pink blossom canopy
        for (let y = 1; y <= 6; y++) {
          pushVoxel(voxSolid, cfg.sakuraX || 3, y, -2, '#5c3a21', 0.02);
        }
        for (let x = -3; x <= 3; x++) {
          for (let y = -2; y <= 2; y++) {
            for (let z = -3; z <= 3; z++) {
              if (Math.hypot(x, y * 1.2, z) <= 3.1) {
                pushVoxel(voxSolid, (cfg.sakuraX || 3) + x, 7 + y, -2 + z, (x + y + z) % 2 === 0 ? '#fbcfe8' : '#f472b6', 0.03);
              }
            }
          }
        }
      }

      const mSolid = buildVoxelInstancedMesh(voxSolid, RV * 1.15, arenaStoneMaterial, true, true);
      const mGlow = buildVoxelInstancedMesh(voxGlow, RV * 1.15, runeEmissiveMaterial, false, false);
      if (mSolid) group.add(mSolid);
      if (mGlow) group.add(mGlow);

      group.position.copy(cfg.pos);
      group.rotation.y = cfg.rotY || 0;
      scene.add(group);

      floatingIslands.push({
        group,
        basePos: cfg.pos.clone(),
        bobSpeed: cfg.bobSpeed || 1.1,
        bobAmp: cfg.bobAmp || 0.45,
        phase: cfg.phase || 0
      });
    }

    // Spawn 4 Scenic Floating Islands & Floating Torii Gates around the Arena
    createFloatingIsland({
      pos: new THREE.Vector3(-18.5, 2.5, -15.0),
      radius: 7,
      hasShrine: true,
      hasTorii: true,
      hasSakura: true,
      sakuraX: 4,
      rotY: 0.65,
      bobSpeed: 0.9,
      phase: 0.0
    });

    createFloatingIsland({
      pos: new THREE.Vector3(19.0, 3.8, -13.5),
      radius: 6,
      hasTorii: true,
      hasSakura: true,
      sakuraX: -2,
      rotY: -0.6,
      bobSpeed: 1.15,
      phase: 1.8
    });

    createFloatingIsland({
      pos: new THREE.Vector3(-20.0, -1.5, 11.0),
      radius: 5,
      hasTorii: true,
      rotY: 1.9,
      bobSpeed: 1.05,
      phase: 3.1
    });

    createFloatingIsland({
      pos: new THREE.Vector3(18.5, -0.8, 12.5),
      radius: 6,
      hasShrine: true,
      hasSakura: true,
      sakuraX: -3,
      rotY: -2.1,
      bobSpeed: 0.95,
      phase: 4.5
    });

    // ----------------------------------------------------------------------------
    // 5D. GIANT VOXEL MOON, LAYERED DRIFTING CLOUDS & NIGHT GALAXY STARFIELD
    // ----------------------------------------------------------------------------
    // Giant Voxel Moon / Sun in the sky behind the arena
    const moonGroup = new THREE.Group();
    const moonVoxels = [];
    for (let x = -9; x <= 9; x++) {
      for (let y = -9; y <= 9; y++) {
        for (let z = -9; z <= 9; z++) {
          const d = Math.sqrt(x * x + y * y + z * z);
          if (d <= 9.0 && d >= 7.6) {
            const isCrater = ((x * 3 + y * 5 + z * 7) % 13 === 0);
            moonVoxels.push({
              x, y, z,
              color: new THREE.Color(isCrater ? '#fde68a' : '#fef9c3')
            });
          }
        }
      }
    }
    const moonMat = new THREE.MeshBasicMaterial({ color: 0xfffbeb });
    const moonMesh = buildVoxelInstancedMesh(moonVoxels, 0.62, moonMat, false, false);
    if (moonMesh) moonGroup.add(moonMesh);
    moonGroup.position.set(0, 18.5, -46.0);
    scene.add(moonGroup);

    // Layered Drifting Voxel Clouds around and below the arena
    const cloudMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.95,
      metalness: 0.0,
      transparent: true,
      opacity: 0.90
    });
    const cloudClusters = [];
    for (let c = 0; c < 14; c++) {
      const cGroup = new THREE.Group();
      const cVox = [];
      const w = 4 + (c % 4);
      const l = 3 + (c % 3);
      for (let x = -w; x <= w; x++) {
        for (let z = -l; z <= l; z++) {
          for (let y = -1; y <= 1; y++) {
            const d = (x * x) / (w * w) + (z * z) / (l * l) + (y * y) * 0.6;
            if (d <= 1.05) {
              cVox.push({ x, y, z, color: new THREE.Color('#ffffff') });
            }
          }
        }
      }
      const cm = buildVoxelInstancedMesh(cVox, 0.55, cloudMat, false, false);
      if (cm) cGroup.add(cm);
      const angle = (c / 14) * Math.PI * 2;
      const dist = 17 + (c % 3) * 9;
      const baseY = -5.5 + (c % 4) * 4.2;
      cGroup.position.set(Math.cos(angle) * dist, baseY, Math.sin(angle) * dist);
      scene.add(cGroup);
      cloudClusters.push({ group: cGroup, angle, dist, baseY, speed: 0.04 + (c % 3) * 0.018 });
    }

    // Cosmic Night Sky Starfield & Diagonal Galaxy Band (Fades in smoothly during Night Mode)
    const STAR_COUNT = 420;
    const starGeom = new THREE.BoxGeometry(0.22, 0.22, 0.22);
    const starMat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.0 // 0 in Day, 0.95 in Night
    });
    const starMesh = new THREE.InstancedMesh(starGeom, starMat, STAR_COUNT);
    const galaxyPalette = ['#ffffff', '#93c5fd', '#f9a8d4', '#c4b5fd', '#fde047', '#67e8f9'];
    for (let i = 0; i < STAR_COUNT; i++) {
      const isGalaxyBand = i < 240;
      let theta = Math.random() * Math.PI * 2;
      let phi = Math.random() * Math.PI * 0.48;
      if (isGalaxyBand) {
        // Concentrate along a diagonal cosmic Milky Way band across the sky dome
        const bandT = (Math.random() - 0.5) * Math.PI * 1.6;
        theta = bandT;
        phi = Math.PI * 0.24 + Math.sin(bandT) * 0.18 + (Math.random() - 0.5) * 0.14;
      }
      const r = 58 + Math.random() * 18;
      tempPos.set(
        r * Math.sin(phi) * Math.cos(theta),
        Math.max(-8, r * Math.cos(phi)),
        r * Math.sin(phi) * Math.sin(theta)
      );
      tempQuat.identity();
      const s = isGalaxyBand ? (0.7 + Math.random() * 1.6) : (0.5 + Math.random() * 1.1);
      tempScale.set(s, s, s);
      tempMatrix.compose(tempPos, tempQuat, tempScale);
      starMesh.setMatrixAt(i, tempMatrix);
      starMesh.setColorAt(i, new THREE.Color(galaxyPalette[i % galaxyPalette.length]));
    }
    starMesh.instanceMatrix.needsUpdate = true;
    if (starMesh.instanceColor) starMesh.instanceColor.needsUpdate = true;
    scene.add(starMesh);

    // ----------------------------------------------------------------------------
    // 5E. FLOATING POWER-UP ITEMS (Red [P] Power Blocks & Blue [点] Point Blocks)
    // ----------------------------------------------------------------------------
    const powerItems = [];

    function createFloatingPowerItems() {
      for (let i = 0; i < 10; i++) {
        const isPower = (i % 2 === 0);
        const itemGroup = new THREE.Group();
        const itemVox = [];
        const baseCol = isPower ? '#ef4444' : '#3b82f6';
        for (let x = -2; x <= 2; x++) {
          for (let y = -2; y <= 2; y++) {
            const isBorder = (Math.abs(x) === 2 || Math.abs(y) === 2);
            // Simple 'P' or '点' square emblem in white in center
            const isLetter = isPower
              ? (x === -1 || (y >= 0 && Math.abs(x) <= 1 && (y === 1 || y === 0 || x === 1)))
              : (Math.abs(x) <= 1 && Math.abs(y) <= 1 && (x === 0 || y === 0));
            const col = isBorder ? '#ffffff' : (isLetter ? '#ffffff' : baseCol);
            itemVox.push({ x, y, z: 0, color: new THREE.Color(col) });
          }
        }
        const m = buildVoxelInstancedMesh(itemVox, 0.085, crystalWingMaterial, true, false);
        if (m) itemGroup.add(m);

        const ang = (i / 10) * Math.PI * 2 + 0.3;
        const rad = 5.4 + (i % 3) * 1.6;
        const pos = new THREE.Vector3(Math.cos(ang) * rad, 1.4 + (i % 2) * 0.8, Math.sin(ang) * rad);
        itemGroup.position.copy(pos);
        scene.add(itemGroup);

        powerItems.push({
          group: itemGroup,
          basePos: pos.clone(),
          angle: ang,
          radius: rad,
          isPower,
          phase: i * 0.9
        });
      }
    }
    createFloatingPowerItems();

    function updateEnvironmentProps(time, dt) {
      // 1. Bob Floating Islands
      for (let i = 0; i < floatingIslands.length; i++) {
        const isl = floatingIslands[i];
        isl.group.position.y = isl.basePos.y + Math.sin(time * isl.bobSpeed + isl.phase) * isl.bobAmp;
      }

      // 2. Drift Clouds slowly around the sky arena
      for (let i = 0; i < cloudClusters.length; i++) {
        const cl = cloudClusters[i];
        cl.angle += cl.speed * dt;
        cl.group.position.x = Math.cos(cl.angle) * cl.dist;
        cl.group.position.z = Math.sin(cl.angle) * cl.dist;
        cl.group.position.y = cl.baseY + Math.sin(time * 0.8 + i) * 0.3;
        cl.group.rotation.y = -cl.angle;
      }

      // 3. Spin & Bob Floating Red [P] and Blue [点] Power Items
      for (let i = 0; i < powerItems.length; i++) {
        const item = powerItems[i];
        item.angle += 0.18 * dt;
        item.group.position.x = Math.cos(item.angle) * item.radius;
        item.group.position.z = Math.sin(item.angle) * item.radius;
        item.group.position.y = item.basePos.y + Math.sin(time * 2.6 + item.phase) * 0.28;
        item.group.rotation.y = time * 2.2 + item.phase;
      }

      // 4. Slowly rotate Giant Moon
      moonGroup.rotation.y = time * 0.08;
    }

    // ============================================================================
    // 6. SQUEEZE POP & HIT SPARK PARTICLES
    // ============================================================================
    const POP_MAX = 96;
    const popParticles = [];
    const popGeom = new THREE.BoxGeometry(0.12, 0.12, 0.12);
    const popMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const popMesh = new THREE.InstancedMesh(popGeom, popMat, POP_MAX);
    for (let i = 0; i < POP_MAX; i++) {
      popParticles.push({ active: false, pos: new THREE.Vector3(), vel: new THREE.Vector3(), life: 0, maxLife: 1, color: new THREE.Color('#ff85a1') });
      tempMatrix.makeScale(0, 0, 0);
      popMesh.setMatrixAt(i, tempMatrix);
    }
    scene.add(popMesh);

    function spawnSqueezeParticles(origin, accentHex, count = 10) {
      const palette = [accentHex, '#ff85a1', '#fde047', '#ffffff'];
      let spawned = 0;
      for (let i = 0; i < POP_MAX && spawned < count; i++) {
        const p = popParticles[i];
        if (!p.active) {
          p.active = true;
          p.life = 0;
          p.maxLife = 0.42 + Math.random() * 0.25;
          p.pos.copy(origin).add(new THREE.Vector3(0, 0.85, 0));
          const angle = (spawned / count) * Math.PI * 2 + Math.random() * 0.4;
          const speed = 2.4 + Math.random() * 2.5;
          p.vel.set(Math.cos(angle) * speed, 2.5 + Math.random() * 2.5, Math.sin(angle) * speed);
          p.color.set(palette[spawned % palette.length]);
          popMesh.setColorAt(i, p.color);
          spawned++;
        }
      }
      if (popMesh.instanceColor) popMesh.instanceColor.needsUpdate = true;
    }

    function updatePopParticles(dt) {
      let dirty = false;
      for (let i = 0; i < POP_MAX; i++) {
        const p = popParticles[i];
        if (!p.active) continue;
        dirty = true;
        p.life += dt;
        if (p.life >= p.maxLife) {
          p.active = false;
          tempMatrix.makeScale(0, 0, 0);
          popMesh.setMatrixAt(i, tempMatrix);
          continue;
        }
        p.vel.y -= 8.0 * dt;
        p.pos.addScaledVector(p.vel, dt);
        const s = 1.0 - (p.life / p.maxLife);
        tempQuat.setFromEuler(new THREE.Euler(p.life * 8, p.life * 6, 0));
        tempScale.set(s, s, s);
        tempMatrix.compose(p.pos, tempQuat, tempScale);
        popMesh.setMatrixAt(i, tempMatrix);
      }
      if (dirty) popMesh.instanceMatrix.needsUpdate = true;
    }

    // ============================================================================
    // 7. TOUHOU FUMO VOXEL PLUSHIE BUILDER & RAGDOLL SOFT-BODY PHYSICS CLASS
    // (Built with the exact hollow spherical shell head, ᗜˬᗜ face & proportions!)
    // ============================================================================
    const allFumoRaycastMeshes = [];
    const fumos = [];

    class VoxelFumo {
      constructor(config) {
        this.id = config.id;
        this.name = config.name;
        this.emoji = config.emoji || '🎀';
        this.accentColor = config.accentColor || '#ef4444';
        this.scaleFactor = config.scale || 1.0;
        this.FV = 0.082 * this.scaleFactor; // Fine voxel size per fumo block
        this.radius = 0.85 * this.scaleFactor;
        this.pitchAudio = config.pitchAudio || 1.0;
        this.isReferee = Boolean(config.isReferee);
        this.hoverHeight = config.hoverHeight || 0.0;

        this.homePos = config.homePos.clone();
        this.homeYaw = config.homeYaw || 0;

        this.pos = this.homePos.clone();
        this.vel = new THREE.Vector3();
        this.yaw = this.homeYaw;
        this.pitch = 0;
        this.roll = 0;
        this.angVel = new THREE.Vector3();
        this.isGrounded = true;
        this.isDragged = false;
        this.ragdollTimer = 0.0; // Active when thrown or knocked around by bullets!

        // Soft-Body Spring States
        this.squash = 1.0;
        this.squashVel = 0.0;

        this.headPitch = 0.0;
        this.headRoll = 0.0;
        this.headPitchVel = 0.0;
        this.headRollVel = 0.0;

        this.limbPitch = 0.0;
        this.limbRoll = 0.0;
        this.limbPitchVel = 0.0;
        this.limbRollVel = 0.0;

        // Scene Hierarchy
        this.root = new THREE.Group();
        this.squashGroup = new THREE.Group();
        this.root.add(this.squashGroup);

        this.headPivot = new THREE.Group();
        this.headPivot.position.set(0, 7.2 * this.FV, 0);
        this.squashGroup.add(this.headPivot);

        this.leftArmPivot = new THREE.Group();
        this.leftArmPivot.position.set(-4.2 * this.FV, 6.2 * this.FV, 0.5 * this.FV);
        this.squashGroup.add(this.leftArmPivot);

        this.rightArmPivot = new THREE.Group();
        this.rightArmPivot.position.set(4.2 * this.FV, 6.2 * this.FV, 0.5 * this.FV);
        this.squashGroup.add(this.rightArmPivot);

        this.leftLegPivot = new THREE.Group();
        this.leftLegPivot.position.set(-2.3 * this.FV, 1.8 * this.FV, 3.2 * this.FV);
        this.squashGroup.add(this.leftLegPivot);

        this.rightLegPivot = new THREE.Group();
        this.rightLegPivot.position.set(2.3 * this.FV, 1.8 * this.FV, 3.2 * this.FV);
        this.squashGroup.add(this.rightLegPivot);

        this.wingsPivot = new THREE.Group();
        this.wingsPivot.position.set(0, 4.8 * this.FV, -3.5 * this.FV);
        this.squashGroup.add(this.wingsPivot);

        this.buildCharacterVoxels(config);
        this.syncTransform(0);
        scene.add(this.root);
      }

      buildCharacterVoxels(cfg) {
        const bodyVoxels = [];
        const headVoxels = [];
        const leftArmVoxels = [];
        const rightArmVoxels = [];
        const leftLegVoxels = [];
        const rightLegVoxels = [];
        const wingSolidVoxels = [];
        const wingGlowVoxels = [];

        const skinBase = '#ffe5d4';
        const blushCol = '#ff9ebb';
        const smileCol = '#4a2525';

        const addPlushVoxel = (arr, x, y, z, col, isSeam = false, sx = 1, sy = 1, sz = 1) => {
          const seamDarken = (isSeam && ((Math.abs(x + y + z) % 2) === 0)) ? 0.055 : 0;
          arr.push({
            x, y, z, sx, sy, sz,
            color: varyColor(col, x + this.id.length * 7, y, z, 0.04, seamDarken)
          });
        };

        // ------------------------------------------------------------------
        // 1. STUBBY SITTING TORSO (Local y: 0..7, x: -4..4, z: -3..3)
        // ------------------------------------------------------------------
        for (let y = 0; y <= 7; y++) {
          const rMax = (y === 0 || y === 7) ? 3.4 : 4.2 - (y * 0.12);
          for (let x = -4; x <= 4; x++) {
            for (let z = -3; z <= 3; z++) {
              const dist = Math.hypot(x, z * 1.15);
              if (dist > rMax) continue;

              const isSideSeam = (z === 0 && Math.abs(x) >= rMax - 0.9);
              let col = cfg.outfitMain;

              if (y === 1 && z >= 1) col = '#ffffff';
              if (cfg.hasWhiteApron && z >= 1 && Math.abs(x) <= 2 && y <= 5) {
                col = '#fcfcfc';
              }
              if (y >= 5 && z >= 2 && Math.abs(x) <= 2) {
                col = '#ffffff';
                if (Math.abs(x) <= 1 && y === 5) col = cfg.tieColor || '#ef4444';
              }
              if (this.id === 'flandre' && z >= 2 && Math.abs(x) === 1 && y === 4) {
                col = '#fde047';
              }
              if (this.id === 'youmu' && y >= 3 && y <= 5 && z >= 2 && Math.abs(x) <= 1) {
                col = '#065f46'; // Youmu green vest front
              }

              addPlushVoxel(bodyVoxels, x, y + 0.5, z, col, isSideSeam);
            }
          }
        }

        // ------------------------------------------------------------------
        // 2. SHORT DANGLING ARMS + CHARACTER WEAPONS / PROPS IN HANDS
        // ------------------------------------------------------------------
        for (const side of [-1, 1]) {
          const targetArr = side === -1 ? leftArmVoxels : rightArmVoxels;
          for (let y = -3; y <= 0; y++) {
            for (let x = -1; x <= 1; x++) {
              for (let z = -1; z <= 1; z++) {
                if (Math.abs(x) === 1 && Math.abs(z) === 1 && y === -3) continue;
                let col = cfg.sleeveColor || '#ffffff';
                if (y === -3) col = skinBase;
                else if (this.id === 'reimu' && y === -1) col = '#e63946';
                addPlushVoxel(targetArr, x * 0.85 + side * 0.4, y, z * 0.85, col, x === 0);
              }
            }
          }
        }

        // ------------------------------------------------------------------
        // 3. SHORT SITTING / DANGLING LEGS WITH SHOES
        // ------------------------------------------------------------------
        for (const side of [-1, 1]) {
          const targetArr = side === -1 ? leftLegVoxels : rightLegVoxels;
          for (let z = 0; z <= 4; z++) {
            for (let x = -1; x <= 1; x++) {
              for (let y = -1; y <= 1; y++) {
                if (Math.abs(x) === 1 && Math.abs(y) === 1) continue;
                let col = '#ffffff';
                if (z === 0) col = skinBase;
                if (z >= 3) col = cfg.shoeColor || '#2b2d42';
                if (z === 4 && y === 1 && x === 0) col = '#ffffff';
                addPlushVoxel(targetArr, x * 0.9, y * 0.9, z * 0.9, col, y === 0);
              }
            }
          }
        }

        // ------------------------------------------------------------------
        // 4. OVERSIZED ROUND FUMO HEAD, ICONIC 'ᗜˬᗜ' FACE, HAIR & HATS
        // ------------------------------------------------------------------
        for (let y = 0; y <= 12; y++) {
          for (let x = -7; x <= 7; x++) {
            for (let z = -6; z <= 6; z++) {
              const dy = (y - 6.0) * 1.05;
              const dx = x * 0.94;
              const dz = z * 1.02;
              const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
              if (dist > 6.4 || dist < 4.5) continue;

              let col = skinBase;
              const isHeadSeam = (z === 0 && Math.abs(x) >= 5);

              const isBackOrTop = (z <= 1) || (y >= 9) || (Math.abs(x) >= 5 && z <= 3);
              const isForeheadBangs = (z >= 4 && y >= 7 && (Math.abs(x) !== 2 || y >= 8));
              const isSideLocks = (Math.abs(x) >= 5 && z >= 2 && y >= 2);

              if (isBackOrTop || isForeheadBangs || isSideLocks) {
                col = cfg.hairColor;
              } else if (z >= 5) {
                if ((Math.abs(x) === 3 || Math.abs(x) === 2) && y >= 4 && y <= 6) {
                  if (y === 6) col = '#1f141e';
                  else if (y === 5 && Math.abs(x) === 2) col = '#ffffff';
                  else col = cfg.eyeColor;
                } else if (Math.abs(x) === 4 && y === 3) {
                  col = blushCol;
                } else if (y === 2 && Math.abs(x) <= 1) {
                  col = (x === 0) ? '#e07a7a' : smileCol;
                }
              }

              addPlushVoxel(headVoxels, x, y, z, col, isHeadSeam);
            }
          }
        }

        // ------------------------------------------------------------------
        // 5. CHARACTER-SPECIFIC HAIR, HATS, WINGS & DANMAKU WEAPONS
        // ------------------------------------------------------------------
        if (this.id === 'reimu') {
          // Side hair tubes wrapped in white with red ribbons
          for (const side of [-1, 1]) {
            for (let y = -1; y <= 5; y++) {
              const tubeCol = (y === 5) ? '#e63946' : ((y >= 1 && y <= 4) ? '#ffffff' : cfg.hairColor);
              addPlushVoxel(headVoxels, side * 6.8, y, 2.2, tubeCol);
              addPlushVoxel(headVoxels, side * 6.8, y, 3.0, tubeCol);
            }
          }
          // Huge Iconic Red Hakurei Bow on Top-Back of Head
          for (let bx = -7; bx <= 7; bx++) {
            const wingHeight = Math.min(4, Math.floor(Math.abs(bx) * 0.7) + 1);
            for (let by = -wingHeight; by <= wingHeight; by++) {
              addPlushVoxel(headVoxels, bx, 12.2 + by * 0.75, -1.5 - Math.abs(bx) * 0.15, '#d90429');
            }
          }
          // Holding Wooden Gohei Purification Rod with White Paper Streamers (Right Arm)
          for (let gz = 0; gz <= 9; gz++) {
            addPlushVoxel(rightArmVoxels, 0.8, -2.5 + gz * 0.35, gz * 0.9, '#8d5b3c', false, 0.65, 0.65, 0.95);
          }
          // Zig-zag white shide paper streamers at tip of Gohei
          for (let s = 0; s < 4; s++) {
            addPlushVoxel(rightArmVoxels, -0.4 - s * 0.5, 0.2 - s * 0.7, 7.5 + (s % 2) * 0.7, '#ffffff');
            addPlushVoxel(rightArmVoxels, 2.0 + s * 0.5, 0.2 - s * 0.7, 7.5 + (s % 2) * 0.7, '#ffffff');
          }
          // Floating Ofuda Amulets orbiting her left hand
          for (let a = 0; a < 3; a++) {
            const ax = -2.2 - a * 1.4;
            const ay = -1.0 + a * 1.8;
            addPlushVoxel(leftArmVoxels, ax, ay, 3.5, '#ffffff', false, 0.9, 1.5, 0.3);
            addPlushVoxel(leftArmVoxels, ax, ay, 3.7, '#dc2626', false, 0.5, 1.1, 0.2);
          }
        }

        if (this.id === 'marisa') {
          // Left side blonde braid with white ribbon
          for (let y = -1; y <= 5; y++) {
            addPlushVoxel(headVoxels, -6.6, y, 2.8, y === 0 ? '#ffffff' : cfg.hairColor);
          }
          // Iconic Oversized Black Witch Hat
          for (let hx = -10; hx <= 10; hx++) {
            for (let hz = -10; hz <= 10; hz++) {
              const r = Math.hypot(hx, hz);
              if (r <= 10.2 && r >= 4.2) {
                const brimY = 10.2 - hz * 0.22 + Math.sin(Math.atan2(hz, hx) * 4) * 0.4;
                addPlushVoxel(headVoxels, hx, brimY, hz - 1.2, '#22222b');
              }
            }
          }
          for (let ch = 0; ch <= 9; ch++) {
            const coneR = Math.max(0.8, 5.2 - ch * 0.52);
            for (let hx = -6; hx <= 6; hx++) {
              for (let hz = -6; hz <= 6; hz++) {
                const r = Math.hypot(hx, hz);
                if (r <= coneR && r >= coneR - 1.3) {
                  const isRibbon = (ch === 1 || ch === 2);
                  addPlushVoxel(headVoxels, hx, 10.8 + ch * 0.9 - hz * 0.18, hz - 1.5 - ch * 0.28, isRibbon ? '#f8f9fa' : '#22222b');
                }
              }
            }
          }
          for (let bx = -3; bx <= 3; bx++) {
            addPlushVoxel(headVoxels, bx, 11.8, 3.8, '#ffffff');
            if (Math.abs(bx) >= 1) addPlushVoxel(headVoxels, bx, 12.6, 3.8, '#ffffff');
          }
          // Riding her Voxel Witch Broom beneath her torso!
          for (let bz = -10; bz <= 8; bz++) {
            addPlushVoxel(bodyVoxels, 0, -0.6, bz, '#8d5b3c', false, 0.95, 0.95, 1.05);
          }
          // Straw broom bristles at the back (bz -14..-9)
          for (let bz = -14; bz <= -9; bz++) {
            const spread = ( -8 - bz ) * 0.45;
            for (let bx = -2; bx <= 2; bx++) {
              for (let by = -1; by <= 1; by++) {
                const bCol = (bz === -9) ? '#dc2626' : '#eab308';
                addPlushVoxel(bodyVoxels, bx * spread * 0.5, -0.6 + by * spread * 0.4, bz, bCol, false, 0.9, 0.9, 1.0);
              }
            }
          }
          // Holding her glowing Mini-Hakkero in her right hand!
          for (let hx = -1; hx <= 1; hx++) {
            for (let hy = -1; hy <= 1; hy++) {
              const isCore = (hx === 0 && hy === 0);
              addPlushVoxel(rightArmVoxels, 0.8 + hx * 0.75, -2.2 + hy * 0.75, 2.8, isCore ? '#38bdf8' : '#f59e0b', false, 0.8, 0.8, 0.7);
            }
          }
        }

        if (this.id === 'cirno') {
          // Big Blue Bow behind head
          for (let bx = -6; bx <= 6; bx++) {
            const h = Math.min(3, Math.floor(Math.abs(bx) * 0.65) + 1);
            for (let by = -h; by <= h; by++) {
              addPlushVoxel(headVoxels, bx, 10.5 + by * 0.75, -4.8, '#1d4ed8');
            }
          }
          // 6 Glowing Translucent Icicle Wings
          const wingAngles = [0.45, 0.05, -0.35];
          for (const side of [-1, 1]) {
            for (let w = 0; w < 3; w++) {
              const ang = wingAngles[w];
              for (let r = 1; r <= 7; r++) {
                const wx = side * (1.2 + Math.cos(ang) * r * 1.05);
                const wy = 1.0 + Math.sin(ang) * r * 1.05;
                const wz = -0.5 - r * 0.15;
                wingGlowVoxels.push({
                  x: wx, y: wy, z: wz,
                  color: varyColor(r > 5 ? '#e0f2fe' : '#38bdf8', wx, wy, wz, 0.02),
                  sx: 1.1, sy: 0.85, sz: 0.6
                });
              }
            }
          }
        }

        if (this.id === 'flandre') {
          // Blonde side ponytail with red ribbon
          for (let py = 2; py <= 7; py++) {
            addPlushVoxel(headVoxels, -7.2 - (7 - py) * 0.3, py, 0.5, py === 6 ? '#e63946' : cfg.hairColor);
          }
          // Puffy Mob Cap with Red Ribbon
          for (let hx = -7; hx <= 7; hx++) {
            for (let hz = -7; hz <= 5; hz++) {
              const r = Math.hypot(hx, hz);
              if (r <= 6.8 && r >= 4.8) {
                addPlushVoxel(headVoxels, hx, 11.2, hz, '#ffe5ec');
                addPlushVoxel(headVoxels, hx, 12.1, hz * 0.85, '#e63946');
                addPlushVoxel(headVoxels, hx * 0.8, 12.9, hz * 0.75, '#ffe5ec');
              }
            }
          }
          // Iconic Rainbow Crystal Prism Wings on Black Branch Frame
          const crystalColors = ['#38bdf8', '#3b82f6', '#a855f7', '#ec4899', '#f97316', '#fde047', '#4ade80', '#ef4444'];
          for (const side of [-1, 1]) {
            for (let rx = 1; rx <= 9; rx++) {
              const branchY = 2.5 + (rx <= 4 ? rx * 0.45 : (4 * 0.45 - (rx - 4) * 0.35));
              wingSolidVoxels.push({
                x: side * rx, y: branchY, z: -0.5,
                color: new THREE.Color('#1e1b24'),
                sx: 0.9, sy: 0.65, sz: 0.65
              });
              if (rx % 2 === 0 && rx <= 8) {
                const cIdx = (side === -1 ? (rx / 2 - 1) : (3 + rx / 2));
                const cHex = crystalColors[cIdx % 8];
                for (let cy = -2; cy <= 0; cy++) {
                  const width = (cy === -1) ? 1.35 : 0.75;
                  wingGlowVoxels.push({
                    x: side * (rx + 0.3),
                    y: branchY - 1.1 + cy * 0.95,
                    z: -0.5,
                    color: new THREE.Color(cHex),
                    sx: width, sy: 0.95, sz: 0.75
                  });
                }
              }
            }
          }
          // Holding the Flame-Shaped Sword Lævateinn in her right hand!
          for (let s = 0; s <= 11; s++) {
            const waveX = Math.sin(s * 0.9) * 0.85;
            const flameCol = s < 2 ? '#fbbf24' : (s % 2 === 0 ? '#ef4444' : '#f97316');
            addPlushVoxel(rightArmVoxels, 1.2 + waveX, -2.2 + s * 0.55, 2.0 + s * 0.75, flameCol, false, 1.1, 0.9, 1.1);
          }
        }

        if (this.id === 'sakuya') {
          // Twin silver side braids with green ribbons
          for (const side of [-1, 1]) {
            for (let y = -2; y <= 5; y++) {
              const col = (y <= -1) ? '#22c55e' : cfg.hairColor;
              addPlushVoxel(headVoxels, side * 6.5, y, 3.2, col);
            }
          }
          // Crisp White Ruffled Maid Headband
          for (let hx = -6; hx <= 6; hx++) {
            addPlushVoxel(headVoxels, hx, 11.8, 1.8 - Math.abs(hx) * 0.15, Math.abs(hx) === 6 ? '#22c55e' : '#ffffff');
            addPlushVoxel(headVoxels, hx, 12.5, 1.5 - Math.abs(hx) * 0.15, '#ffffff');
          }
          // Fanned-Out Floating Silver Throwing Knives in front of both hands!
          for (let k = -3; k <= 3; k++) {
            if (k === 0) continue;
            const ang = k * 0.28;
            for (let r = 1; r <= 4; r++) {
              const kx = Math.sin(ang) * (2.5 + r * 0.9);
              const kz = 3.2 + Math.cos(ang) * (1.2 + r * 0.9);
              const kCol = r === 1 ? '#3b82f6' : '#e2e8f0'; // Blue hilt + silver blade
              addPlushVoxel(bodyVoxels, kx, 4.2 + Math.abs(k) * 0.25, kz, kCol, false, 0.55, 0.35, 1.1);
            }
          }
        }

        if (this.id === 'youmu') {
          // Black ribbon headband on left side of her silver bob
          for (let bx = -6; bx <= -2; bx++) {
            addPlushVoxel(headVoxels, bx, 11.4, 2.2, '#18181b');
            if (bx <= -4) addPlushVoxel(headVoxels, bx - 0.5, 12.4, 1.8, '#18181b');
          }
          // Two Swords: Long Katana (Roukanken) in right hand + Short Wakizashi (Hakurouken) on left
          for (let s = 0; s <= 11; s++) {
            const col = s <= 2 ? '#1e293b' : (s === 3 ? '#facc15' : '#f1f5f9');
            addPlushVoxel(rightArmVoxels, 1.2, -2.5 + s * 0.65, 1.5 + s * 0.75, col, false, 0.5, 0.85, 0.85);
          }
          for (let s = 0; s <= 7; s++) {
            const col = s <= 1 ? '#065f46' : (s === 2 ? '#facc15' : '#e2e8f0');
            addPlushVoxel(leftArmVoxels, -1.2, -2.5 + s * 0.55, 1.5 + s * 0.65, col, false, 0.5, 0.8, 0.8);
          }
          // Floating White Ghost Orb (Myon) hovering beside her!
          for (let gx = -2; gx <= 2; gx++) {
            for (let gy = -2; gy <= 2; gy++) {
              for (let gz = -2; gz <= 2; gz++) {
                if (Math.hypot(gx, gy, gz) <= 2.2) {
                  wingGlowVoxels.push({
                    x: -6.5 + gx * 0.8,
                    y: 4.5 + gy * 0.8,
                    z: 2.0 + gz * 0.8,
                    color: new THREE.Color('#f0fdf4'),
                    sx: 0.9, sy: 0.9, sz: 0.9

                }
              }
            }
          }
          // Swirling ghost tail
          for (let t = 1; t <= 4; t++) {
            wingGlowVoxels.push({
              x: -6.5 - t * 0.7,
              y: 4.5 + t * 0.6,
              z: 2.0 - t * 0.6,
              color: new THREE.Color('#ccfbf1'),
              sx: 1.1 - t * 0.18, sy: 1.1 - t * 0.18, sz: 1.1 - t * 0.18

        }

        if (this.id === 'aya_referee') {
          // Tiny Red Crow Tengu Tokin Hat on forehead/top
          for (let hx = -2; hx <= 2; hx++) {
            for (let hz = -1; hz <= 2; hz++) {
              addPlushVoxel(headVoxels, hx, 12.2, hz + 2.0, '#dc2626');
              addPlushVoxel(headVoxels, hx * 0.7, 13.1, hz * 0.7 + 2.0, '#dc2626');
            }
          }
          // Black Crow Wings
          for (const side of [-1, 1]) {
            for (let wx = 1; wx <= 5; wx++) {
              for (let wy = 0; wy <= 3 - wx * 0.4; wy++) {
                wingSolidVoxels.push({
                  x: side * wx, y: wy + 1, z: -0.5,
                  color: new THREE.Color('#18181b')
                });
              }
            }
          }
          // Referee Flag in Right Hand!
          for (let fy = 0; fy <= 7; fy++) {
            addPlushVoxel(rightArmVoxels, 1.0, -2.0 + fy * 0.8, 2.5, '#cbd5e1', false, 0.45, 0.9, 0.45);

          for (let fx = 1; fx <= 4; fx++) {
            for (let fy = 4; fy <= 7; fy++) {
              const flagCol = ((fx + fy) % 2 === 0) ? '#ef4444' : '#ffffff';
              addPlushVoxel(rightArmVoxels, 1.0 + fx * 0.8, -2.0 + fy * 0.8, 2.5, flagCol, false, 0.85, 0.85, 0.35);
            }

        const registerPart = (voxels, parent, mat = plushMaterial) => {
          const m = buildVoxelInstancedMesh(voxels, this.FV, mat, true, true);
          if (m) {
            m.userData.fumo = this;
            parent.add(m);
            allFumoRaycastMeshes.push(m);
          }
          return m;
        };

        registerPart(bodyVoxels, this.squashGroup);
        registerPart(headVoxels, this.headPivot);
        registerPart(leftArmVoxels, this.leftArmPivot);
        registerPart(rightArmVoxels, this.rightArmPivot);
        registerPart(leftLegVoxels, this.leftLegPivot);
        registerPart(rightLegVoxels, this.rightLegPivot);
        registerPart(wingSolidVoxels, this.wingsPivot);
        if (wingGlowVoxels.length > 0) {
          const wMat = (this.id === 'cirno') ? translucentIceMaterial : crystalWingMaterial;
          registerPart(wingGlowVoxels, this.wingsPivot, wMat);
        }
      }

      squeeze(strength = 1.0) {
        this.squash = Math.max(0.50, this.squash - 0.42 * strength);
        this.squashVel = -3.6 * strength;
        this.headPitchVel += (Math.random() - 0.5) * 14 * strength;
        this.headRollVel += (Math.random() > 0.5 ? 1 : -1) * 11 * strength;
        this.limbPitch = -0.65 * strength;
        this.limbPitchVel = -6.0 * strength;
        spawnSqueezeParticles(this.pos, this.accentColor, 10);
        soundFX.playSqueeze(this.pitchAudio);
      }

      // Apply comedic ragdoll impulse when hit by a danmaku bullet!
      applyBulletImpulse(bVel, bColorHex) {
        if (this.isDragged) return;
        this.ragdollTimer = Math.max(this.ragdollTimer, 1.35);
        this.isGrounded = false;
        this.vel.x += bVel.x * 0.42 + (Math.random() - 0.5) * 2.5;
        this.vel.z += bVel.z * 0.42 + (Math.random() - 0.5) * 2.5;
        this.vel.y = Math.min(9.5, Math.max(2.6, this.vel.y + 2.8));

        // Clamp horizontal knockback speed so Fumo stays inside the arena rim
        const hSpd = Math.hypot(this.vel.x, this.vel.z);
        if (hSpd > 11.5) {
          this.vel.x = (this.vel.x / hSpd) * 11.5;
          this.vel.z = (this.vel.z / hSpd) * 11.5;
        }

        // Comedic ragdoll tumble torque + soft squish
        this.angVel.x += (Math.random() - 0.5) * 14.0 + bVel.z * 0.6;
        this.angVel.y += (Math.random() - 0.5) * 12.0;
        this.angVel.z += (Math.random() - 0.5) * 14.0 - bVel.x * 0.6;

        this.squash = 0.64;
        this.squashVel = -4.2;
        this.headPitchVel += (Math.random() - 0.5) * 18.0;
        this.headRollVel += (Math.random() - 0.5) * 18.0;

        spawnSqueezeParticles(this.pos, bColorHex || this.accentColor, 5);
        soundFX.playBulletBonk();
      }

      resetToHome() {
        this.pos.copy(this.homePos);
        this.vel.set(0, 0, 0);
        this.yaw = this.homeYaw;
        this.pitch = 0;
        this.roll = 0;
        this.angVel.set(0, 0, 0);
        this.ragdollTimer = 0.0;
        this.isGrounded = true;
        this.isDragged = false;
        this.squeeze(0.75);
      }

      updatePhysics(dt, time) {
        if (this.ragdollTimer > 0) {
          this.ragdollTimer = Math.max(0, this.ragdollTimer - dt);
        }

        // 1. Squash & Stretch Elastic Spring
        const squashStiff = 210.0;
        const squashDamp = 11.5;
        const squashForce = (1.0 - this.squash) * squashStiff - this.squashVel * squashDamp;
        this.squashVel += squashForce * dt;
        this.squash += this.squashVel * dt;
        this.squash = THREE.MathUtils.clamp(this.squash, 0.45, 1.55);

        // 2. Head Wobble Spring
        const headStiff = 140.0;
        const headDamp = 7.5;
        const idleHeadBob = Math.sin(time * 2.4 + this.homePos.x) * 0.03;
        this.headPitchVel += ((idleHeadBob - this.headPitch) * headStiff - this.headPitchVel * headDamp) * dt;
        this.headRollVel += ((0 - this.headRoll) * headStiff - this.headRollVel * headDamp) * dt;
        this.headPitch = THREE.MathUtils.clamp(this.headPitch + this.headPitchVel * dt, -0.55, 0.55);
        this.headRoll = THREE.MathUtils.clamp(this.headRoll + this.headRollVel * dt, -0.55, 0.55);

        // 3. Dangling Limb Springs
        const targetLimbPitch = (this.isDragged || !this.isGrounded || this.hoverHeight > 0.1) ? 0.52 : 0.0;
        const limbStiff = 120.0;
        const limbDamp = 8.0;
        this.limbPitchVel += ((targetLimbPitch - this.limbPitch) * limbStiff - this.limbPitchVel * limbDamp) * dt;
        this.limbRollVel += ((0 - this.limbRoll) * limbStiff - this.limbRollVel * limbDamp) * dt;
        this.limbPitch = THREE.MathUtils.clamp(this.limbPitch + this.limbPitchVel * dt, -0.8, 0.9);
        this.limbRoll = THREE.MathUtils.clamp(this.limbRoll + this.limbRollVel * dt, -0.6, 0.6);

        // 4. Rigid-Body / Hover / Ragdoll Motion when NOT dragged
        if (!this.isDragged) {
          this.vel.y -= 22.0 * dt;
          this.vel.multiplyScalar(Math.pow(0.985, dt * 60));
          this.pos.addScaledVector(this.vel, dt);

          this.yaw += this.angVel.y * dt;
          this.pitch += this.angVel.x * dt;
          this.roll += this.angVel.z * dt;
          this.angVel.multiplyScalar(Math.pow(0.92, dt * 60));

          this.isGrounded = false;

          // Target resting floor height (hovering fumos float slightly when not ragdolling)
          const hoverOffset = (this.ragdollTimer <= 0.05 && this.hoverHeight > 0)
            ? this.hoverHeight + Math.sin(time * 2.6 + this.homePos.x) * 0.15
            : 0.0;

          if (this.pos.y < hoverOffset) {
            const impact = -this.vel.y;
            this.pos.y = hoverOffset;
            if (impact > 2.0) {
              this.vel.y = impact * 0.44;
              this.squashVel -= Math.min(9.0, impact * 0.95);
              this.headPitchVel += (Math.random() - 0.5) * impact * 2.0;
              this.headRollVel += (Math.random() - 0.5) * impact * 2.0;
              soundFX.playBounce(impact * 0.08);
            } else {
              this.vel.y = 0;
              this.isGrounded = true;
            }
            this.vel.x *= 0.80;
            this.vel.z *= 0.80;
          }

          // Circular Raised Arena Rim Collision (Keep all Fumos inside the floating arena!)
          const maxR = this.isReferee ? 10.2 : 9.15;
          const distFromCenter = Math.hypot(this.pos.x, this.pos.z);
          if (distFromCenter > maxR && distFromCenter > 0.001) {
            const nx = this.pos.x / distFromCenter;
            const nz = this.pos.z / distFromCenter;
            this.pos.x = nx * maxR;
            this.pos.z = nz * maxR;
            const vn = this.vel.x * nx + this.vel.z * nz;
            if (vn > 0) {
              this.vel.x -= 1.55 * vn * nx;
              this.vel.z -= 1.55 * vn * nz;
              if (vn > 2.0) {
                this.squashVel -= Math.min(6.0, vn * 0.6);
                soundFX.playBounce(vn * 0.06);
              }
            }
          }

          // Podium / Scoreboard Colliders
          const r = this.radius * 0.72;
          const centerY = this.pos.y + r;
          for (let i = 0; i < furnitureColliders.length; i++) {
            const box = furnitureColliders[i];
            const cx = THREE.MathUtils.clamp(this.pos.x, box.min.x, box.max.x);
            const cy = THREE.MathUtils.clamp(centerY, box.min.y, box.max.y);
            const cz = THREE.MathUtils.clamp(this.pos.z, box.min.z, box.max.z);

            const dx = this.pos.x - cx;
            const dy = centerY - cy;
            const dz = this.pos.z - cz;
            const distSq = dx * dx + dy * dy + dz * dz;

            if (distSq < r * r) {
              const dist = Math.sqrt(distSq);
              if (centerY >= box.max.y - 0.25 && this.vel.y <= 0.5) {
                const impact = -this.vel.y;
                this.pos.y = box.max.y;
                if (impact > 2.0) {
                  this.vel.y = impact * 0.38;
                  this.squashVel -= Math.min(8.5, impact * 0.85);
                  soundFX.playBounce(impact * 0.08);
                } else {
                  this.vel.y = 0;
                  this.isGrounded = true;
                }
                this.vel.x *= 0.80;
                this.vel.z *= 0.80;
              } else if (dist > 0.0001) {
                const nx = dx / dist;
                const ny = dy / dist;
                const nz = dz / dist;
                const pen = r - dist;
                this.pos.x += nx * pen;
                this.pos.y = Math.max(0, this.pos.y + ny * pen);
                this.pos.z += nz * pen;
              }
            }
          }

          // Self-righting plushie torque when resting so it flops upright after ragdolling
          if (this.isGrounded && this.ragdollTimer < 0.4) {
            this.pitch = THREE.MathUtils.lerp(this.pitch, 0, Math.min(1, dt * 8.5));
            this.roll = THREE.MathUtils.lerp(this.roll, 0, Math.min(1, dt * 8.5));
            this.angVel.multiplyScalar(0.75);
            // Gently face the center of the arena when firing
            if (!this.isReferee && this.vel.lengthSq() < 0.08) {
              const targetYaw = Math.atan2(-this.pos.x, -this.pos.z);
              let diff = targetYaw - this.yaw;
              while (diff > Math.PI) diff -= Math.PI * 2;
              while (diff < -Math.PI) diff += Math.PI * 2;
              this.yaw += diff * Math.min(1, dt * 2.5);
            }
          }
        }

        this.syncTransform(time);
      }

      syncTransform(time) {
        this.root.position.copy(this.pos);
        this.root.rotation.order = 'YXZ';
        this.root.rotation.set(this.pitch, this.yaw, this.roll);

        const sy = this.squash;
        const sxz = 1.0 / Math.sqrt(Math.max(0.35, sy));
        this.squashGroup.scale.set(sxz, sy, sxz);

        this.headPivot.rotation.set(this.headPitch, 0, this.headRoll);

        // Referee waves her flag excitedly!
        const refWave = this.isReferee ? Math.sin(time * 6.5) * 0.55 : 0;
        this.leftArmPivot.rotation.set(this.limbPitch, 0, 0.18 + Math.abs(this.limbPitch) * 0.35 + this.limbRoll);
        this.rightArmPivot.rotation.set(this.limbPitch - refWave, 0, -0.18 - Math.abs(this.limbPitch) * 0.35 + this.limbRoll + refWave * 0.5);
        this.leftLegPivot.rotation.set(this.limbPitch * 1.15, 0.08, this.limbRoll * 0.5);
        this.rightLegPivot.rotation.set(this.limbPitch * 1.15, -0.08, this.limbRoll * 0.5);

        const wingFlutter = Math.sin(time * 4.2 + this.homePos.x) * 0.07 + (1.0 - this.squash) * 0.35;
        this.wingsPivot.rotation.x = wingFlutter;
      }
    }

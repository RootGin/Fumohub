    fumoConfigs.forEach(cfg => {
      fumos.push(new VoxelFumo(cfg));
    });

    function resolveFumoToFumoCollisions() {
      for (let i = 0; i < fumos.length; i++) {
        for (let j = i + 1; j < fumos.length; j++) {
          const a = fumos[i];
          const b = fumos[j];
          if (a.ridingBroom || b.ridingBroom) continue;
          const minDist = (a.radius + b.radius) * 0.78;
          const dx = b.pos.x - a.pos.x;
          const dy = (b.pos.y + b.radius * 0.6) - (a.pos.y + a.radius * 0.6);
          const dz = b.pos.z - a.pos.z;
          const distSq = dx * dx + dy * dy + dz * dz;

          if (distSq < minDist * minDist && distSq > 0.0001) {
            const dist = Math.sqrt(distSq);
            const nx = dx / dist;
            const ny = dy / dist;
            const nz = dz / dist;
            const overlap = (minDist - dist) * 0.5;

            if (!a.isDragged) {
              a.pos.x -= nx * overlap;
              a.pos.z -= nz * overlap;
            }
            if (!b.isDragged) {
              b.pos.x += nx * overlap;
              b.pos.z += nz * overlap;
            }

            const rvx = b.vel.x - a.vel.x;
            const rvy = b.vel.y - a.vel.y;
            const rvz = b.vel.z - a.vel.z;
            const vn = rvx * nx + rvy * ny + rvz * nz;
            if (vn < 0) {
              const imp = -vn * 0.68;
              if (!a.isDragged) {
                a.vel.x -= imp * nx;
                a.vel.y -= imp * ny;
                a.vel.z -= imp * nz;
                a.squashVel -= Math.min(5.0, imp * 0.6);
              }
              if (!b.isDragged) {
                b.vel.x += imp * nx;
                b.vel.y += imp * ny;
                b.vel.z += imp * nz;
                b.squashVel -= Math.min(5.0, imp * 0.6);
              }
              if (imp > 1.5) soundFX.playBounce(imp * 0.07);
            }
          }
        }
      }
    }

    // ============================================================================
    // 11. POINTER INTERACTION: SQUEEZE, DRAG TO LANDMARKS & THROW
    // ============================================================================
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    const dragPlane = new THREE.Plane();
    const dragHitPoint = new THREE.Vector3();
    const dragOffset = new THREE.Vector3();

    let hoveredFumo = null;
    let selectedFumo = null;
    let isDraggingFumo = false;
    let pointerDownScreen = new THREE.Vector2();
    let dragHistory = [];

    const tooltipEl = document.getElementById('fumo-tooltip');
    const tooltipEmojiEl = document.getElementById('tooltip-emoji');
    const tooltipTextEl = document.getElementById('tooltip-text');
    const badgeEl = document.getElementById('fumo-badge');
    const badgeDotEl = document.getElementById('fumo-badge-dot');
    const badgeNameEl = document.getElementById('fumo-badge-name');
    const badgeStatusEl = document.getElementById('fumo-badge-status');

    function updatePointerNDC(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function pickFumoUnderPointer() {
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(allFumoRaycastMeshes, false);
      if (hits.length > 0 && hits[0].object.userData.fumo) {
        return { fumo: hits[0].object.userData.fumo, point: hits[0].point };
      }
      return null;
    }

    function updateUIBadge(fumo, statusText) {
      if (!fumo) {
        badgeEl.classList.add('hidden');
        badgeEl.classList.remove('flex');
        return;
      }
      badgeEl.classList.remove('hidden');
      badgeEl.classList.add('flex');
      badgeDotEl.style.backgroundColor = fumo.accentColor;
      badgeNameEl.textContent = fumo.name.split(' (')[0];
      badgeStatusEl.textContent = statusText;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      recordInteraction();
      updatePointerNDC(e);
      pointerDownScreen.set(e.clientX, e.clientY);

      const hit = pickFumoUnderPointer();
      if (hit) {
        selectedFumo = hit.fumo;
        isDraggingFumo = false;
        controls.enabled = false;

        const worldFumoPos = selectedFumo.pos.clone().add(islandMasterGroup.position);
        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        dragPlane.setFromNormalAndCoplanarPoint(camDir.negate(), worldFumoPos);

        if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
          dragOffset.subVectors(selectedFumo.pos, dragHitPoint);
        } else {
          dragOffset.set(0, 0, 0);
        }

        dragHistory = [{ pos: selectedFumo.pos.clone(), time: performance.now() }];
        updateUIBadge(selectedFumo, selectedFumo.homeLandmark);
      }
    });

    window.addEventListener('pointermove', (e) => {
      updatePointerNDC(e);

      if (selectedFumo) {
        recordInteraction();
        const moveDist = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);

        if (!isDraggingFumo && moveDist > 6) {
          isDraggingFumo = true;
          selectedFumo.isDragged = true;
          selectedFumo.ridingBroom = false;
          selectedFumo.isGrounded = false;
          selectedFumo.squashVel += 3.2;
          soundFX.playPickup();
          updateUIBadge(selectedFumo, 'Drop on any Landmark for a Reaction!');
        }

        if (isDraggingFumo) {
          raycaster.setFromCamera(pointerNDC, camera);
          if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
            const targetPos = dragHitPoint.clone().add(dragOffset);
            targetPos.x = THREE.MathUtils.clamp(targetPos.x, -9.5, 9.5);
            targetPos.z = THREE.MathUtils.clamp(targetPos.z, -9.5, 9.5);
            const minTerrainY = getIslandSurfaceY(targetPos.x, targetPos.z) + 0.35;
            targetPos.y = THREE.MathUtils.clamp(targetPos.y, minTerrainY, 12.0);

            const prevPos = selectedFumo.pos.clone();
            selectedFumo.pos.lerp(targetPos, 0.55);

            const deltaMove = selectedFumo.pos.clone().sub(prevPos);
            selectedFumo.headRollVel -= deltaMove.x * 16.0;
            selectedFumo.headPitchVel += deltaMove.z * 16.0 - deltaMove.y * 10.0;
            selectedFumo.limbRollVel -= deltaMove.x * 22.0;
            selectedFumo.roll = THREE.MathUtils.lerp(selectedFumo.roll, THREE.MathUtils.clamp(-deltaMove.x * 1.4, -0.45, 0.45), 0.3);
            selectedFumo.pitch = THREE.MathUtils.lerp(selectedFumo.pitch, THREE.MathUtils.clamp(deltaMove.z * 1.4, -0.45, 0.45), 0.3);

            // Check if hovering over a landmark to preview its name in the badge
            let nearLandmark = null;
            for (const lm of LANDMARKS) {
              if (Math.hypot(selectedFumo.pos.x - lm.pos.x, selectedFumo.pos.z - lm.pos.z) <= lm.radius) {
                nearLandmark = lm;
                break;
              }
            }
            if (nearLandmark) {
              updateUIBadge(selectedFumo, `Drop at ${nearLandmark.name}!`);
            }

            const now = performance.now();
            dragHistory.push({ pos: selectedFumo.pos.clone(), time: now });
            while (dragHistory.length > 6) dragHistory.shift();
          }
          tooltipEl.style.opacity = '0';
          renderer.domElement.style.cursor = 'grabbing';
          return;
        }
      }

      const hit = pickFumoUnderPointer();
      if (hit) {
        hoveredFumo = hit.fumo;
        renderer.domElement.style.cursor = 'grab';
        tooltipEmojiEl.textContent = hoveredFumo.emoji;
        tooltipTextEl.textContent = hoveredFumo.name;
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = `${e.clientX + 14}px`;
        tooltipEl.style.top = `${e.clientY - 18}px`;
      } else {
        hoveredFumo = null;
        renderer.domElement.style.cursor = 'default';
        tooltipEl.style.opacity = '0';
      }
    });

    window.addEventListener('pointerup', () => {
      if (!selectedFumo) return;
      controls.enabled = true;
      recordInteraction();

      if (!isDraggingFumo) {
        selectedFumo.squeeze(1.0);
        updateUIBadge(selectedFumo, 'Squeezed! ᗜˬᗜ');
      } else {
        selectedFumo.isDragged = false;
        const now = performance.now();
        while (dragHistory.length > 1 && now - dragHistory[0].time > 140) {
          dragHistory.shift();
        }

        let throwVel = new THREE.Vector3();
        if (dragHistory.length >= 2) {
          const first = dragHistory[0];
          const last = dragHistory[dragHistory.length - 1];
          const dtSec = Math.max(0.016, (last.time - first.time) / 1000);
          throwVel.subVectors(last.pos, first.pos).divideScalar(dtSec);
          if (throwVel.length() > 20) throwVel.setLength(20);
        }

        // Check if dropped near the flying broom first!
        if (selectedFumo.pos.distanceTo(flyingBroomGroup.position) < 1.8 && throwVel.length() < 6.0) {
          selectedFumo.ridingBroom = true;
          selectedFumo.squeeze(0.9);
          updateUIBadge(selectedFumo, 'Riding the Flying Witch Broom! 🧹🌟');
        } else {
          // Check if dropped onto any of the 7 Landmarks with gentle release
          let matchedLandmark = null;
          if (throwVel.length() < 8.5) {
            for (const lm of LANDMARKS) {
              if (Math.hypot(selectedFumo.pos.x - lm.pos.x, selectedFumo.pos.z - lm.pos.z) <= lm.radius) {
                matchedLandmark = lm;
                break;
              }
            }
          }

          if (matchedLandmark) {
            selectedFumo.pos.x = matchedLandmark.pos.x + (Math.random() - 0.5) * 0.4;
            selectedFumo.pos.z = matchedLandmark.pos.z + (Math.random() - 0.5) * 0.4;
            selectedFumo.pos.y = getIslandSurfaceY(selectedFumo.pos.x, selectedFumo.pos.z) + 0.15;
            selectedFumo.triggerLandmarkReaction(matchedLandmark);
          } else {
            selectedFumo.vel.copy(throwVel);
            const speed = throwVel.length();
            selectedFumo.angVel.set(
              throwVel.z * 0.65 + (Math.random() - 0.5) * speed * 0.4,
              (Math.random() - 0.5) * speed * 0.5,
              -throwVel.x * 0.65 + (Math.random() - 0.5) * speed * 0.4
            );
            updateUIBadge(selectedFumo, 'Tumbling across Gensokyo!');
          }
        }
      }

      selectedFumo = null;
      isDraggingFumo = false;
      renderer.domElement.style.cursor = hoveredFumo ? 'grab' : 'default';
    });

    // ============================================================================
    // 12. DAY / NIGHT SMOOTH INTERPOLATION (~2 SECONDS) & HUB INTEGRATION
    // ============================================================================
    const STORAGE_MODE_KEY = 'voxel_gensokyo_map_mode';
    let isNightMode = false;
    let dayNightProgress = 0.0; // 0.0 = Day, 1.0 = Night
    let dayNightTarget = 0.0;

    // Starry Sky Field for Night Mode
    const STAR_COUNT = 160;
    const starGeom = new THREE.BoxGeometry(0.18, 0.18, 0.18);
    const starMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.0 });
    const starMesh = new THREE.InstancedMesh(starGeom, starMat, STAR_COUNT);
    for (let i = 0; i < STAR_COUNT; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI * 0.44 + 0.05;
      const r = 55 + Math.random() * 15;
      tempPos.set(
        r * Math.sin(phi) * Math.cos(theta),
        r * Math.cos(phi),
        r * Math.sin(phi) * Math.sin(theta)
      );
      tempQuat.identity();
      const s = 0.6 + Math.random() * 1.1;
      tempScale.set(s, s, s);
      tempMatrix.compose(tempPos, tempQuat, tempScale);
      starMesh.setMatrixAt(i, tempMatrix);
    }
    scene.add(starMesh);

    const daySkyColor = new THREE.Color('#bde0fe');
    const nightSkyColor = new THREE.Color('#090b1a');

    const daySunLightCol = new THREE.Color('#fff2d6');
    const nightMoonLightCol = new THREE.Color('#6b8afd');

    const dayHemiSky = new THREE.Color('#fff9eb');
    const nightHemiSky = new THREE.Color('#1f244d');
    const dayHemiGround = new THREE.Color('#8ecae6');
    const nightHemiGround = new THREE.Color('#0c0f24');

    function notifyParentMode() {
      const modeStr = isNightMode ? 'night' : 'day';
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'modeChanged', mode: modeStr }, '*');
        }
      } catch (e) {}
    }

    function setDayNightMode(night, { immediate = false, playSound = true } = {}) {
      isNightMode = Boolean(night);
      dayNightTarget = isNightMode ? 1.0 : 0.0;
      if (immediate) {
        dayNightProgress = dayNightTarget;
      }
      document.body.classList.toggle('night-ui', isNightMode);

      try {
        localStorage.setItem(STORAGE_MODE_KEY, isNightMode ? 'night' : 'day');
      } catch (e) {}

      if (playSound) soundFX.playPickup();
      notifyParentMode();
    }

    function toggleDayNight() {
      setDayNightMode(!isNightMode, { immediate: false, playSound: true });
    }

    function updateDayNightTransition(dt) {
      if (Math.abs(dayNightProgress - dayNightTarget) > 0.0005) {
        const step = dt * 0.52; // ~2 seconds full transition
        if (dayNightProgress < dayNightTarget) {
          dayNightProgress = Math.min(dayNightTarget, dayNightProgress + step);
        } else {
          dayNightProgress = Math.max(dayNightTarget, dayNightProgress - step);
        }
      }

      const t = dayNightProgress < 0.5
        ? 4 * dayNightProgress * dayNightProgress * dayNightProgress
        : 1 - Math.pow(-2 * dayNightProgress + 2, 3) / 2;

      scene.background.lerpColors(daySkyColor, nightSkyColor, t);
      scene.fog.color.copy(scene.background);

      sunDirLight.color.lerpColors(daySunLightCol, nightMoonLightCol, t);
      sunDirLight.intensity = THREE.MathUtils.lerp(1.32, 0.42, t);

      hemiLight.color.lerpColors(dayHemiSky, nightHemiSky, t);
      hemiLight.groundColor.lerpColors(dayHemiGround, nightHemiGround, t);
      hemiLight.intensity = THREE.MathUtils.lerp(0.72, 0.28, t);

      // Night Landmark Point Lights
      mansionLight.intensity = THREE.MathUtils.lerp(0.05, 1.45, t);
      villageLight.intensity = THREE.MathUtils.lerp(0.05, 1.35, t);
      shrineLight.intensity = THREE.MathUtils.lerp(0.05, 1.25, t);
      sakuraLight.intensity = THREE.MathUtils.lerp(0.12, 1.15, t);

      // Emissive Materials & Starfield
      warmWindowMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.22, 2.35, t);
      scarletGlowMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.28, 2.55, t);
      spiritGlowMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.35, 1.95, t);
      translucentIceMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.22, 0.85, t);
      waterMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.15, 0.45, t);
      cloudMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.04, 0.22, t);
      starMat.opacity = THREE.MathUtils.lerp(0.0, 0.9, t);

      if (bloomPass) {
        bloomPass.strength = THREE.MathUtils.lerp(0.16, 0.72, t);
        bloomPass.threshold = THREE.MathUtils.lerp(0.84, 0.60, t);
      }
    }

    // Button & Keyboard Event Listeners
    document.getElementById('btn-reset').addEventListener('click', () => {
      fumos.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 45));
      updateUIBadge(null, '');
    });

    document.getElementById('btn-squeeze-all').addEventListener('click', () => {
      fumos.forEach((f, idx) => setTimeout(() => f.squeeze(1.05), idx * 55));
    });

    const btnSound = document.getElementById('btn-sound');
    const iconSoundOn = document.getElementById('icon-sound-on');
    const iconSoundOff = document.getElementById('icon-sound-off');
    btnSound.addEventListener('click', () => {
      soundFX.enabled = !soundFX.enabled;
      iconSoundOn.classList.toggle('hidden', !soundFX.enabled);
      iconSoundOff.classList.toggle('hidden', soundFX.enabled);
      if (soundFX.enabled) soundFX.playPickup();
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      const key = e.key.toLowerCase();
      if (key === 'n') {
        e.preventDefault();
        toggleDayNight();
      } else if (key === 'r') {
        fumos.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 45));
      } else if (key === ' ') {
        e.preventDefault();
        fumos.forEach((f, idx) => setTimeout(() => f.squeeze(1.05), idx * 55));
      } else if (key === 'm') {
        btnSound.click();
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================================
    // 13. MAIN ANIMATION LOOP, PAUSE / RESUME & HUB MESSAGE LISTENER
    // ============================================================================
    let prevTime = performance.now();
    let isPaused = false;
    let rafId = null;

    function animate(now) {
      if (isPaused) return;
      rafId = requestAnimationFrame(animate);

      const dt = Math.min(0.033, Math.max(0.001, (now - prevTime) / 1000));
      prevTime = now;
      const elapsed = now * 0.001;

      if (!selectedFumo && (now - lastUserInteractionTime > 4500)) {
        controls.autoRotate = true;
      }

      controls.update();
      updateDayNightTransition(dt);
      updateEnvironmentEffects(elapsed, dt);
      updatePopParticles(dt);

      for (let i = 0; i < fumos.length; i++) {
        fumos[i].updatePhysics(dt, elapsed);
      }
      resolveFumoToFumoCollisions();

      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    function pauseRenderLoop() {
      if (isPaused) return;
      isPaused = true;
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    function resumeRenderLoop() {
      if (!isPaused) return;
      isPaused = false;
      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    }

    // Lifecycle management: Day/Night sync, pause/resume on tab visibility, and WebGL resource cleanup on destroy
    const _sceneLifecycle = new FumoSceneLifecycle({
      renderer,
      scene,
      composer: typeof composer !== 'undefined' ? composer : null,
      audio: typeof soundFX !== 'undefined' ? soundFX : (typeof audio !== 'undefined' ? audio : null),
      onToggleMode: typeof toggleDayNight === 'function' ? toggleDayNight : null,
      onSetMode: (mode) => {
        if (typeof setDayNightMode === 'function') {
          setDayNightMode(mode === 'night', { immediate: false });
        } else if (typeof toggleDayNight === 'function') {
          const isNight = document.body.classList.contains('night-ui');
          if (isNight !== (mode === 'night')) toggleDayNight();
        }
      },
      onPause: typeof pauseRenderLoop === 'function' ? pauseRenderLoop : (typeof pauseScene === 'function' ? pauseScene : null),
      onResume: typeof resumeRenderLoop === 'function' ? resumeRenderLoop : (typeof resumeScene === 'function' ? resumeScene : null)
    });

    window.onload = function () {
      let initialNight = false;
      try {
        const saved = localStorage.getItem(STORAGE_MODE_KEY);
        if (saved === 'night') initialNight = true;
      } catch (e) {}

      setDayNightMode(initialNight, { immediate: true, playSound: false });
      updateDayNightTransition(0);

      fumos.forEach((f, idx) => {
        setTimeout(() => {
          f.squash = 0.78;
          f.squashVel = 2.0;
          f.headPitchVel = 4.0;
        }, 120 + idx * 65);
      });

      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    };
  </script>
</body>
</html>

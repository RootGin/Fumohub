    function handleFumoOrBubbleClick(fumo) {
      if (fumo.role === 'staff') {
        selectedStaff = fumo;
        fumo.squeeze(0.85);
        updateDispatchUI();
      } else if (fumo.role === 'guest') {
        // Dispatch selected staff (or nearest idle staff) to serve this guest!
        const attendant = (selectedStaff && selectedStaff.taskState === 'idle')
          ? selectedStaff
          : (staffFumos.find(s => s.taskState === 'idle') || selectedStaff || staffFumos[0]);

        if (attendant) {
          selectedStaff = attendant;
          attendant.targetGuest = fumo;
          attendant.taskState = 'walking_to_guest';
          attendant.squeeze(0.75);
          dispatchTextEl.textContent = `${attendant.name.split(' (')[0]} serving ${fumo.name.split(' (')[0]}!`;
          if (fumo.moodEl) fumo.moodEl.classList.add('is-being-served');
        }
        fumo.squeeze(0.95);
      } else {
        fumo.squeeze(1.0);
      }
    }

    // ============================================================================
    // 10. POINTER RAYCASTING: SQUEEZE, DRAG, THROW & CAMERA ISOLATION
    // ============================================================================
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    const dragPlane = new THREE.Plane();
    const dragHitPoint = new THREE.Vector3();
    const dragOffset = new THREE.Vector3();

    let hoveredFumo = null;
    let pointerDownFumo = null;
    let isDraggingFumo = false;
    let pointerDownScreen = new THREE.Vector2();
    let dragHistory = [];

    const tooltipEl = document.getElementById('fumo-tooltip');
    const tooltipEmojiEl = document.getElementById('tooltip-emoji');
    const tooltipTextEl = document.getElementById('tooltip-text');

    function updatePointerNDC(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function pickInteractiveUnderPointer() {
      raycaster.setFromCamera(pointerNDC, camera);
      const interactiveList = [...allFumoRaycastMeshes, boilerValveMesh, bellHitMesh];
      const hits = raycaster.intersectObjects(interactiveList, false);
      if (hits.length > 0) {
        return hits[0];
      }
      return null;
    }

    const onPointerDown = (e) => {
      if (e.button !== 0) return;
      recordInteraction();
      updatePointerNDC(e);
      pointerDownScreen.set(e.clientX, e.clientY);

      const hit = pickInteractiveUnderPointer();
      if (!hit) return;

      if (hit.object.userData.isBoilerValve) {
        cycleBoilerTemperature();
        return;
      }
      if (hit.object.userData.isFrontDeskBell) {
        ringFrontDeskBell();
        return;
      }

      if (hit.object.userData.fumo) {
        pointerDownFumo = hit.object.userData.fumo;
        isDraggingFumo = false;
        // Immediately lock OrbitControls so dragging a Fumo never rotates the camera
        controls.enabled = false;

        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        dragPlane.setFromNormalAndCoplanarPoint(camDir.negate(), pointerDownFumo.pos);

        if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
          dragOffset.subVectors(pointerDownFumo.pos, dragHitPoint);
        } else {
          dragOffset.set(0, 0, 0);
        }
        dragHistory = [{ pos: pointerDownFumo.pos.clone(), time: performance.now() }];
      }
    };

    const onPointerMove = (e) => {
      updatePointerNDC(e);

      if (pointerDownFumo) {
        recordInteraction();
        const moveDist = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);

        if (!isDraggingFumo && moveDist > 6) {
          isDraggingFumo = true;
          pointerDownFumo.isDragged = true;
          pointerDownFumo.isGrounded = false;
          pointerDownFumo.taskState = 'idle';
          pointerDownFumo.squashVel += 3.0;
          soundFX.playPickup();
        }

        if (isDraggingFumo) {
          raycaster.setFromCamera(pointerNDC, camera);
          if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
            const targetPos = dragHitPoint.clone().add(dragOffset);
            targetPos.x = THREE.MathUtils.clamp(targetPos.x, -8.5, 8.5);
            targetPos.y = THREE.MathUtils.clamp(targetPos.y, 0.35, 10.5);
            targetPos.z = THREE.MathUtils.clamp(targetPos.z, -8.5, 8.5);

            const prevPos = pointerDownFumo.pos.clone();
            pointerDownFumo.pos.lerp(targetPos, 0.55);

            const deltaMove = pointerDownFumo.pos.clone().sub(prevPos);
            pointerDownFumo.headRollVel -= deltaMove.x * 16.0;
            pointerDownFumo.headPitchVel += deltaMove.z * 16.0 - deltaMove.y * 10.0;
            pointerDownFumo.limbRollVel -= deltaMove.x * 22.0;
            pointerDownFumo.roll = THREE.MathUtils.lerp(pointerDownFumo.roll, THREE.MathUtils.clamp(-deltaMove.x * 1.4, -0.45, 0.45), 0.3);
            pointerDownFumo.pitch = THREE.MathUtils.lerp(pointerDownFumo.pitch, THREE.MathUtils.clamp(deltaMove.z * 1.4, -0.45, 0.45), 0.3);

            const now = performance.now();
            dragHistory.push({ pos: pointerDownFumo.pos.clone(), time: now });
            while (dragHistory.length > 6) dragHistory.shift();
          }
          tooltipEl.style.opacity = '0';
          renderer.domElement.style.cursor = 'grabbing';
          return;
        }
      }

      const hit = pickInteractiveUnderPointer();
      if (hit) {
        renderer.domElement.style.cursor = 'pointer';
        if (hit.object.userData.isBoilerValve) {
          tooltipEmojiEl.textContent = '♨️';
          tooltipTextEl.textContent = 'Boiler Valve — Click to change bath temperature!';
        } else if (hit.object.userData.isFrontDeskBell) {
          tooltipEmojiEl.textContent = '🔔';
          tooltipTextEl.textContent = 'Boat Bell — Click or press S to summon staff!';
        } else if (hit.object.userData.fumo) {
          hoveredFumo = hit.object.userData.fumo;
          renderer.domElement.style.cursor = 'grab';
          tooltipEmojiEl.textContent = hoveredFumo.emoji;
          tooltipTextEl.textContent = hoveredFumo.name;
        }
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = `${e.clientX + 14}px`;
        tooltipEl.style.top = `${e.clientY - 18}px`;
      } else {
        hoveredFumo = null;
        renderer.domElement.style.cursor = 'default';
        tooltipEl.style.opacity = '0';
      }
    };

    const onPointerUp = () => {
      if (!pointerDownFumo) return;
      controls.enabled = true;
      recordInteraction();

      if (!isDraggingFumo) {
        handleFumoOrBubbleClick(pointerDownFumo);
      } else {
        pointerDownFumo.isDragged = false;
        const now = performance.now();
        while (dragHistory.length > 1 && now - dragHistory[0].time > 140) {
          dragHistory.shift();
        }
        if (dragHistory.length >= 2) {
          const first = dragHistory[0];
          const last = dragHistory[dragHistory.length - 1];
          const dtSec = Math.max(0.016, (last.time - first.time) / 1000);
          const throwVel = last.pos.clone().sub(first.pos).divideScalar(dtSec);
          if (throwVel.length() > 21) throwVel.setLength(21);
          pointerDownFumo.vel.copy(throwVel);

          const speed = throwVel.length();
          pointerDownFumo.angVel.set(
            throwVel.z * 0.65 + (Math.random() - 0.5) * speed * 0.4,
            (Math.random() - 0.5) * speed * 0.5,
            -throwVel.x * 0.65 + (Math.random() - 0.5) * speed * 0.4
          );
        } else {
          pointerDownFumo.vel.set(0, 0, 0);
        }
      }

      pointerDownFumo = null;
      isDraggingFumo = false;
      renderer.domElement.style.cursor = hoveredFumo ? 'grab' : 'default';
    };

    renderer.domElement.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);

    // ============================================================================
    // 11. DAY / NIGHT MODE TRANSITION (~2 SECONDS) & HUB SYNC
    // ============================================================================
    let currentMode = 'day'; // 'day' | 'night'
    let dayNightProgress = 0.0;
    let dayNightTarget = 0.0;

    const daySkyCol = new THREE.Color('#c8e6ff');
    const nightSkyCol = new THREE.Color('#090d1c');
    const daySunCol = new THREE.Color('#ffeed4');
    const nightMoonCol = new THREE.Color('#6488ea');
    const dayHemiSky = new THREE.Color('#fff5e4');
    const nightHemiSky = new THREE.Color('#1e2442');
    const dayHemiGround = new THREE.Color('#8d6e63');
    const nightHemiGround = new THREE.Color('#0f1322');

    function notifyParentModeChanged() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'modeChanged', mode: currentMode }, '*');
        }
      } catch (e) {}
    }

    function applyModeState(newMode, immediate = false) {
      currentMode = (newMode === 'night') ? 'night' : 'day';
      dayNightTarget = (currentMode === 'night') ? 1.0 : 0.0;
      if (immediate) {
        dayNightProgress = dayNightTarget;
      }
      document.body.classList.toggle('night-ui', currentMode === 'night');
      try {
        localStorage.setItem(STORAGE_MODE_KEY, currentMode);
      } catch (e) {}
      notifyParentModeChanged();
    }

    function flipDayNightMode() {
      applyModeState(currentMode === 'day' ? 'night' : 'day', false);
    }

    function updateDayNightInterpolation(dt) {
      if (Math.abs(dayNightProgress - dayNightTarget) > 0.0005) {
        const step = dt * 0.52; // ~2 seconds transition
        if (dayNightProgress < dayNightTarget) {
          dayNightProgress = Math.min(dayNightTarget, dayNightProgress + step);
        } else {
          dayNightProgress = Math.max(dayNightTarget, dayNightProgress - step);
        }
      }

      const t = dayNightProgress < 0.5
        ? 4 * dayNightProgress * dayNightProgress * dayNightProgress
        : 1 - Math.pow(-2 * dayNightProgress + 2, 3) / 2;

      scene.background.lerpColors(daySkyCol, nightSkyCol, t);
      scene.fog.color.copy(scene.background);
      scene.fog.density = THREE.MathUtils.lerp(0.010, 0.016, t);

      mainDirLight.color.lerpColors(daySunCol, nightMoonCol, t);
      mainDirLight.intensity = THREE.MathUtils.lerp(1.32, 0.38, t);

      hemiLight.color.lerpColors(dayHemiSky, nightHemiSky, t);
      hemiLight.groundColor.lerpColors(dayHemiGround, nightHemiGround, t);
      hemiLight.intensity = THREE.MathUtils.lerp(0.72, 0.25, t);

      engawaLight.intensity = THREE.MathUtils.lerp(0.15, 1.55, t);
      poolGlowLight.intensity = THREE.MathUtils.lerp(0.22, 1.15, t);
      boilerLight.intensity = THREE.MathUtils.lerp(0.35, 1.25, t);

      lanternEmissiveMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.3, 2.2, t);
      shojiEmissiveMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.15, 1.45, t);
      waterMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.18, 0.65, t);
      iceMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.25, 0.85, t);
      crystalWingMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.3, 1.25, t);
      leafMat.emissiveIntensity = THREE.MathUtils.lerp(0.05, 0.85, t);

      steamMat.color.lerpColors(new THREE.Color('#ffffff'), new THREE.Color('#fde68a'), t * 0.65);

      if (bloomPass) {
        bloomPass.strength = THREE.MathUtils.lerp(0.16, 0.72, t);
        bloomPass.threshold = THREE.MathUtils.lerp(0.84, 0.58, t);
      }
    }

    // ============================================================================
    // 12. HUD BUTTONS, KEYBOARD SHORTCUTS & LIFECYCLE MANAGEMENT
    // ============================================================================
    const btnBell = document.getElementById('btn-bell');
    const btnBoiler = document.getElementById('btn-boiler');
    const btnReset = document.getElementById('btn-reset');
    const btnMute = document.getElementById('btn-mute');
    const iconSoundOn = document.getElementById('icon-sound-on');
    const iconSoundOff = document.getElementById('icon-sound-off');

    function syncMuteUI() {
      iconSoundOn.classList.toggle('hidden', !soundFX.enabled);
      iconSoundOff.classList.toggle('hidden', soundFX.enabled);
    }
    syncMuteUI();

    function toggleMute() {
      soundFX.enabled = !soundFX.enabled;
      syncMuteUI();
      try {
        localStorage.setItem(STORAGE_MUTE_KEY, String(!soundFX.enabled));
      } catch (e) {}
      if (soundFX.enabled) soundFX.playPickup();
    }

    const onResetClick = () => {
      fumos.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 35));
    };

    btnBell.addEventListener('click', ringFrontDeskBell);
    btnBoiler.addEventListener('click', cycleBoilerTemperature);
    btnReset.addEventListener('click', onResetClick);
    btnMute.addEventListener('click', toggleMute);

    const onKeyDown = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      const key = e.key.toLowerCase();
      if (key === 'n') {
        e.preventDefault();
        flipDayNightMode();
      } else if (key === 's') {
        e.preventDefault();
        ringFrontDeskBell();
      } else if (key === 'm') {
        e.preventDefault();
        toggleMute();
      } else if (key === 'r') {
        e.preventDefault();
        onResetClick();
      }
    };
    window.addEventListener('keydown', onKeyDown);

    const onWindowResize = () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    };
    window.addEventListener('resize', onWindowResize);

    // ============================================================================
    // 13. MAIN RENDER LOOP & PROCEDURAL AMBIENT SOUNDSCAPE
    // ============================================================================
    let prevTime = performance.now();
    let isPaused = false;
    let rafId = null;
    let kotoTimer = 1.8;
    let cricketTimer = 2.5;
    let streamTimer = 1.2;

    function animate(now) {
      if (isPaused) return;
      rafId = requestAnimationFrame(animate);

      const dt = Math.min(0.033, Math.max(0.001, (now - prevTime) / 1000));
      prevTime = now;
      const elapsed = now * 0.001;

      if (!pointerDownFumo && (now - lastUserInteractionTime > 4500)) {
        controls.autoRotate = true;
      }

      controls.update();
      updateDayNightInterpolation(dt);
      updateAnimatedWater(elapsed, dt);

      // 1. Rhythmic Shishi-Odoshi Bamboo Water Spout
      const prevCycle = shishiCycle;
      shishiCycle = (elapsed * 0.22) % 1.0;
      if (shishiCycle < 0.78) {
        shishiArmPivot.rotation.z = THREE.MathUtils.lerp(0.18, -0.15, shishiCycle / 0.78);
      } else if (shishiCycle < 0.88) {
        shishiArmPivot.rotation.z = -0.68; // Tips over to pour water!
      } else {
        shishiArmPivot.rotation.z = 0.18;  // Snaps back against stone!
      }
      if (prevCycle < 0.88 && shishiCycle >= 0.88) {
        soundFX.playShishiOdoshi();
        spawnWaterRipple(3.4, -0.8, 0.95);
      }

      // 2. Floating Wooden Washtub Gentle Drift & Bob
      washtubGroup.position.x = 1.2 + Math.sin(elapsed * 0.45) * 0.45;
      washtubGroup.position.z = 2.2 + Math.cos(elapsed * 0.38) * 0.35;
      washtubGroup.position.y = 0.68 + Math.sin(elapsed * 2.4) * 0.035;
      washtubGroup.rotation.y = elapsed * 0.18;
      washtubGroup.rotation.z = Math.sin(elapsed * 1.9) * 0.06;

      // 3. Rising Steam Puffs (Scaled by Boiler Temperature)
      const steamFactor = TEMP_LEVELS[currentTempIndex].steamFactor;
      const activeSteamCount = Math.floor(STEAM_COUNT * Math.min(1, steamFactor));
      for (let i = 0; i < STEAM_COUNT; i++) {
        if (i >= activeSteamCount) {
          tempMatrix.makeScale(0, 0, 0);
          steamMesh.setMatrixAt(i, tempMatrix);
          continue;
        }
        const sp = steamPuffs[i];
        sp.y += sp.speed * steamFactor * dt;
        const heightNorm = (sp.y - sp.baseY) / (sp.maxH * steamFactor);
        if (heightNorm >= 1.0) {
          sp.y = sp.baseY;
          sp.x = THREE.MathUtils.lerp(sp.pool.minX + 0.3, sp.pool.maxX - 0.3, Math.random());
          sp.z = THREE.MathUtils.lerp(sp.pool.minZ + 0.3, sp.pool.maxZ - 0.3, Math.random());
        }
        const s = Math.sin(Math.min(1, Math.max(0, heightNorm)) * Math.PI) * (0.75 + 0.55 * steamFactor);
        tempPos.set(
          sp.x + Math.sin(elapsed * 1.1 + sp.phase) * 0.18,
          sp.y,
          sp.z + Math.cos(elapsed * 0.9 + sp.phase) * 0.18
        );
        tempQuat.setFromEuler(tempEuler.set(elapsed * 0.4, sp.phase, 0));
        tempScale.set(s, s, s);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        steamMesh.setMatrixAt(i, tempMatrix);
      }
      steamMesh.instanceMatrix.needsUpdate = true;

      // 4. Falling Autumn Leaves & Night Fireflies
      for (let i = 0; i < LEAF_COUNT; i++) {
        const lf = leafData[i];
        if (lf.isFirefly) {
          if (dayNightProgress < 0.25) {
            tempMatrix.makeScale(0, 0, 0);
            leafMesh.setMatrixAt(i, tempMatrix);
            continue;
          }
          const fx = lf.x + Math.sin(elapsed * 1.2 + lf.phase) * 1.2;
          const fy = 1.2 + Math.abs(Math.sin(elapsed * 0.8 + lf.phase)) * 2.8;
          const fz = lf.z + Math.cos(elapsed * 1.1 + lf.phase) * 1.2;
          const glowScale = (0.5 + 0.5 * Math.sin(elapsed * 4.2 + lf.phase)) * dayNightProgress * 0.9;
          tempPos.set(fx, fy, fz);
          tempQuat.identity();
          tempScale.set(glowScale, glowScale, glowScale);
          tempMatrix.compose(tempPos, tempQuat, tempScale);
          leafMesh.setMatrixAt(i, tempMatrix);
        } else {
          lf.y -= lf.vy * dt;
          if (lf.y < 0.2) {
            lf.y = 8.5;
            lf.x = -7 + Math.random() * 15;
            lf.z = -7 + Math.random() * 16;
          }
          tempPos.set(
            lf.x + Math.sin(elapsed * 1.5 + lf.phase) * 0.45,
            lf.y,
            lf.z + Math.cos(elapsed * 1.2 + lf.phase) * 0.45
          );
          tempQuat.setFromEuler(tempEuler.set(elapsed * 1.8 + lf.phase, elapsed, lf.phase));
          tempScale.set(1, 1, 1);
          tempMatrix.compose(tempPos, tempQuat, tempScale);
          leafMesh.setMatrixAt(i, tempMatrix);
        }
      }
      leafMesh.instanceMatrix.needsUpdate = true;

      // 5. Pop / Splash / Heart Particles
      let popDirty = false;
      for (let i = 0; i < POP_MAX; i++) {
        const p = popParticles[i];
        if (!p.active) continue;
        popDirty = true;
        p.life += dt;
        if (p.life >= p.maxLife) {
          p.active = false;
          tempMatrix.makeScale(0, 0, 0);
          popMesh.setMatrixAt(i, tempMatrix);
          continue;
        }
        p.vel.y -= 7.8 * dt;
        p.pos.addScaledVector(p.vel, dt);
        const s = 1.0 - (p.life / p.maxLife);
        tempQuat.setFromEuler(tempEuler.set(p.life * 7, p.life * 5, 0));
        tempScale.set(s, s, s);
        tempMatrix.compose(p.pos, tempQuat, tempScale);
        popMesh.setMatrixAt(i, tempMatrix);
      }
      if (popDirty) popMesh.instanceMatrix.needsUpdate = true;

      // 6. Update Fumo Physics & Selection Ring
      for (let i = 0; i < fumos.length; i++) {
        fumos[i].updatePhysics(dt, elapsed);
      }
      if (selectedStaff) {
        selectionRing.visible = true;
        selectionRing.position.set(selectedStaff.pos.x, selectedStaff.pos.y + 0.04, selectedStaff.pos.z);
        selectionRing.rotation.z = elapsed * 1.5;
      } else {
        selectionRing.visible = false;
      }

      // 7. Procedural Ambient Soundscape (Koto Plucks, Stream Bubbling & Night Crickets)
      kotoTimer -= dt;
      if (kotoTimer <= 0) {
        soundFX.playKotoPluck();
        kotoTimer = 1.4 + Math.random() * 2.4;
      }
      streamTimer -= dt;
      if (streamTimer <= 0) {
        soundFX.playPourWater(0.28);
        streamTimer = 2.2 + Math.random() * 1.8;
      }
      if (dayNightProgress > 0.6) {
        cricketTimer -= dt;
        if (cricketTimer <= 0) {
          soundFX.playCricket();
          cricketTimer = 2.8 + Math.random() * 3.2;
        }
      }

      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    function pauseRenderLoop() {
      if (isPaused) return;
      isPaused = true;
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    function resumeRenderLoop() {
      if (!isPaused) return;
      isPaused = false;
      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    }

    function disposeScene() {
      pauseRenderLoop();
      renderer.domElement.removeEventListener('pointerdown', onPointerDown);
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('resize', onWindowResize);
      btnBell.removeEventListener('click', ringFrontDeskBell);
      btnBoiler.removeEventListener('click', cycleBoilerTemperature);
      btnReset.removeEventListener('click', onResetClick);
      btnMute.removeEventListener('click', toggleMute);
    }

    // ============================================================================
    // 14. SHARED `FumoSceneLifecycle` REGISTRATION & STARTUP
    // ============================================================================
    let initialMode = 'day';
    try {
      const savedMode = localStorage.getItem(STORAGE_MODE_KEY);
      if (savedMode === 'night' || savedMode === 'day') initialMode = savedMode;
    } catch (e) {}

    applyModeState(initialMode, true);
    updateDayNightInterpolation(0);

    if (typeof FumoSceneLifecycle !== 'undefined') {
      new FumoSceneLifecycle({
        renderer,
        scene,
        composer,
        audio: soundFX,
        onToggleMode: () => {
          flipDayNightMode();
        },
        onSetMode: (mode) => {
          applyModeState(mode, false);
        },
        onPause: () => {
          pauseRenderLoop();
        },
        onResume: () => {
          resumeRenderLoop();
        },
        onDispose: () => {
          disposeScene();
        }
      });
    } else {
      // Direct message fallback (ensures messages work even before or without fumo-core)
      window.addEventListener('message', (e) => {
        const data = e.data;
        if (!data || typeof data !== 'object') return;
        if (data.type === 'toggleMode') {
          flipDayNightMode();
        } else if (data.type === 'setMode' && (data.mode === 'day' || data.mode === 'night')) {
          applyModeState(data.mode, false);
        } else if (data.type === 'pause') {
          pauseRenderLoop();
        } else if (data.type === 'resume') {
          resumeRenderLoop();
        }
      });
    }

    // Welcoming soft bounce on load
    fumos.forEach((f, idx) => {
      setTimeout(() => {
        f.squash = 0.8;
        f.squashVel = 1.8;
      }, 90 + idx * 45);
    });

    prevTime = performance.now();
    rafId = requestAnimationFrame(animate);
  </script>
</body>
</html>

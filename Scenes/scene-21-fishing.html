<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Kappa River Fishing Spot — Touhou Fumo Voxel Diorama</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Shared Hub Stylesheet -->
  <link rel="stylesheet" href="../Shared/fumo-scene.css" />

  <!-- Three.js r128 + Post-Processing Addons FIRST -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <!-- Shared Fumo Core Library SECOND (reads THREE at load time) -->
  <script src="../Shared/fumo-core.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background-color: #101b2b;
    }
    h1, h2, .font-display {
      font-family: 'Fredoka', sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 10px 28px -6px rgba(15, 32, 55, 0.2), 0 2px 6px rgba(15, 32, 55, 0.08);
      transition: background 0.45s ease, color 0.45s ease, border-color 0.45s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: #1e293b;
    }
    body.night-ui .glass-panel {
      background: rgba(18, 25, 46, 0.84);
      border-color: rgba(110, 175, 255, 0.28);
      color: #eef6ff;
      box-shadow: 0 10px 30px -6px rgba(0, 0, 0, 0.6), 0 0 18px rgba(56, 189, 248, 0.16);
    }
    .ui-btn {
      cursor: pointer;
    }
    .ui-btn:hover {
      transform: translateY(-2px) scale(1.03);
    }
    .ui-btn:active {
      transform: translateY(1px) scale(0.97);
    }
    #fumo-tooltip {
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    kbd {
      font-family: 'Fredoka', sans-serif;
      display: inline-block;
      padding: 1px 6px;
      font-size: 0.72rem;
      line-height: 1.2;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.09);
      border-bottom: 2px solid rgba(0, 0, 0, 0.2);
    }
    body.night-ui kbd {
      background: rgba(255, 255, 255, 0.14);
      border-bottom-color: rgba(255, 255, 255, 0.28);
    }
    @keyframes pulse-exclamation {
      0%, 100% { transform: translate(-50%, -100%) scale(1); }
      50% { transform: translate(-50%, -112%) scale(1.14); }
    }
    .bite-badge {
      animation: pulse-exclamation 0.35s infinite ease-in-out;
    }
  </style>
</head>
<body class="text-slate-800">
  <div id="canvas-container"></div>

  <!-- Floating 3D-tracked Bobber Bite / Tension Mini-Game Overlay -->
  <div id="fishing-overlay" class="fixed z-30 pointer-events-none hidden" style="left: 50%; top: 50%;">
    <!-- Bite Prompt -->
    <div id="bite-alert" class="bite-badge hidden glass-panel rounded-2xl px-3.5 py-1.5 border-2 border-amber-400 text-center shadow-xl">
      <div class="font-display font-bold text-sm text-rose-500 tracking-wide">❗ BITE! CLICK WATER!</div>
    </div>

    <!-- Wobbling Tension Reel-In Mini-Game -->
    <div id="tension-game" class="hidden glass-panel rounded-2xl p-3 w-56 -translate-x-1/2 -translate-y-full shadow-2xl pointer-events-auto">
      <div class="flex items-center justify-between text-xs font-bold mb-1">
        <span id="reel-fish-label" class="font-display text-sky-500">🐟 Hooked! Hold/Click!</span>
        <span id="reel-progress-pct" class="font-mono">0%</span>
      </div>
      <!-- Tension Zone Track -->
      <div class="relative w-full h-4 bg-slate-900/30 rounded-full overflow-hidden border border-white/30 mb-1.5">
        <!-- Moving Sweet Spot -->
        <div id="tension-sweetspot" class="absolute top-0 bottom-0 bg-emerald-400/55 border-x-2 border-emerald-300 rounded" style="left: 35%; width: 32%;"></div>
        <!-- Player Tension Marker -->
        <div id="tension-marker" class="absolute top-0 bottom-0 w-2.5 bg-amber-300 rounded-full shadow-md border border-slate-900" style="left: 50%;"></div>
      </div>
      <!-- Catch Progress Bar -->
      <div class="w-full h-2 bg-slate-900/25 rounded-full overflow-hidden">
        <div id="reel-progress-bar" class="h-full bg-gradient-to-r from-sky-400 to-emerald-400 transition-all duration-75" style="width: 30%;"></div>
      </div>
      <div class="text-[10px] opacity-75 text-center mt-1 font-semibold">
        Hold / Click to raise tension into green zone!
      </div>
    </div>
  </div>

  <!-- Floating Cursor Tooltip for Hovered Fumo or Water -->
  <div id="fumo-tooltip" class="fixed z-30 opacity-0 px-3 py-1.5 rounded-xl glass-panel text-xs font-semibold flex items-center gap-2 shadow-lg">
    <span id="tooltip-emoji">🥒</span>
    <span id="tooltip-text">Nitori Fumo</span>
  </div>

  <!-- Fish Book Collection Modal (Opens from Bottom-Right Counter) -->
  <div id="fish-book-modal" class="fixed bottom-20 right-4 z-30 w-80 sm:w-96 glass-panel rounded-3xl p-4 hidden flex-col gap-3 shadow-2xl">
    <div class="flex items-center justify-between border-b border-current/10 pb-2">
      <div class="flex items-center gap-2">
        <span class="text-xl">📖</span>
        <div>
          <h2 class="font-display font-bold text-sm sm:text-base leading-tight">Kappa River Fish Book</h2>
          <p class="text-[11px] opacity-75 font-semibold">Rare species appear at Dusk & Night!</p>
        </div>
      </div>
      <button id="btn-close-book" class="ui-btn rounded-xl px-2.5 py-1 text-xs font-bold bg-black/10 hover:bg-black/20">✕</button>
    </div>
    <div id="fish-book-grid" class="grid grid-cols-2 gap-2 max-h-64 overflow-y-auto pr-1"></div>
    <div class="flex items-center justify-between text-[11px] opacity-80 pt-1 border-t border-current/10 font-semibold">
      <span id="total-catches-stat">Total Basket Catches: 0</span>
      <span>Yuyuko is very happy ᗜˬᗜ</span>
    </div>
  </div>

  <!-- BOTTOM-RIGHT HUD (Strict Hub Rule: ZERO UI in Top-Left!) -->
  <div class="fixed bottom-4 right-4 z-20 flex flex-col items-end gap-2 max-w-[96vw]">
    <!-- Status & Toast Row -->
    <div class="flex flex-wrap items-center justify-end gap-2">
      <!-- Catch / Action Toast Pill -->
      <div id="catch-toast" class="glass-panel rounded-2xl px-3.5 py-1.5 text-xs font-bold hidden items-center gap-2 border-2 border-emerald-400/70">
        <span id="catch-toast-icon">✨</span>
        <span id="catch-toast-text">Caught a Golden Carp!</span>
      </div>

      <!-- Active Fumo / Fishing State Indicator -->
      <div id="fumo-badge" class="glass-panel rounded-2xl px-3.5 py-1.5 text-xs font-semibold flex items-center gap-2">
        <span id="fumo-badge-dot" class="w-2.5 h-2.5 rounded-full inline-block bg-cyan-500"></span>
        <span id="fumo-badge-name">Click Pond to Cast</span>
        <span id="fumo-badge-status" class="opacity-70 ml-1">Idle</span>
      </div>
    </div>

    <!-- Primary Controls Bar (Bottom-Right) -->
    <div class="flex flex-wrap items-center justify-end gap-2">
      <!-- Bait Selector Button (F Key) -->
      <button id="btn-bait" title="Switch Fishing Bait (Shortcut: F)"
        class="glass-panel ui-btn rounded-2xl px-3 py-2 flex items-center gap-2 text-xs font-semibold">
        <span id="bait-icon" class="text-base leading-none">🥒</span>
        <div class="text-left leading-tight">
          <div class="text-[10px] opacity-65 font-bold uppercase tracking-wider">Bait <kbd>F</kbd></div>
          <div id="bait-name" class="font-display font-semibold text-xs">Kappa Cucumber</div>
        </div>
      </button>

      <!-- Fish Book Collection Counter Button -->
      <button id="btn-fish-book" title="Open Fish Collection Book (Shortcut: B)"
        class="glass-panel ui-btn rounded-2xl px-3.5 py-2 flex items-center gap-2 text-xs font-semibold">
        <span class="text-base leading-none">🐟</span>
        <div class="text-left leading-tight">
          <div class="text-[10px] opacity-65 font-bold uppercase tracking-wider">Fish Book</div>
          <div id="fish-counter-text" class="font-display font-semibold text-xs">0 / 8 Caught</div>
        </div>
      </button>

      <!-- Squeeze All Fumos Button -->
      <button id="btn-squeeze-all" title="Squeeze All Fumos! (Shortcut: Space)"
        class="glass-panel ui-btn rounded-2xl px-3 py-2.5 flex items-center gap-1.5 text-xs font-semibold">
        <span class="text-sm leading-none">✨</span>
        <span class="hidden sm:inline">Squeeze</span>
      </button>

      <!-- Reset Fumos Button -->
      <button id="btn-reset" title="Return Fumos to Cozy Spots (Shortcut: R)"
        class="glass-panel ui-btn rounded-2xl px-3 py-2.5 flex items-center gap-1.5 text-xs font-semibold">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        <span class="hidden md:inline">Reset</span>
      </button>

      <!-- Sound / Mute Toggle Button (M Key) -->
      <button id="btn-sound" title="Toggle Sound & Lo-Fi River Audio (Shortcut: M)"
        class="glass-panel ui-btn rounded-2xl p-2.5 flex items-center justify-center">
        <svg id="icon-sound-on" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <svg id="icon-sound-off" class="w-4 h-4 hidden opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>
    </div>
  </div>

  <script>
    // ============================================================================
    // 1. SHARED CORE INTEGRATION & EXTENDED SYNTHESIZED SOUND ENGINE
    // ============================================================================
    const _voxelHash = typeof voxelHash === 'function' ? voxelHash : function(x, y, z) {
      let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
      return n - Math.floor(n);
    };

    const _tempCol = new THREE.Color();
    const _varyColor = typeof varyColor === 'function' ? varyColor : function(hexOrString, x, y, z, variance = 0.035, seamDarken = 0) {
      _tempCol.set(hexOrString);
      const h = _voxelHash(x, y, z);
      const delta = (h - 0.5) * 2 * variance - seamDarken;
      _tempCol.offsetHSL(0, (h - 0.5) * 0.03, delta);
      return _tempCol.clone();
    };

    const _createSoftVoxelGeometry = typeof createSoftVoxelGeometry === 'function' ? createSoftVoxelGeometry : function(size = 1) {
      const s = size * 0.985;
      return new THREE.BoxGeometry(s, s, s);
    };

    const _getOptimalPixelRatio = typeof getOptimalPixelRatio === 'function' ? getOptimalPixelRatio : function() {
      return Math.min(window.devicePixelRatio || 1, 2);
    };

    const BaseSoundEngine = typeof PlushSoundEngine !== 'undefined' ? PlushSoundEngine : class {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playSqueeze(pitchMultiplier = 1.0) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sine';
          const baseFreq = (520 + Math.random() * 80) * pitchMultiplier;
          osc1.frequency.setValueAtTime(baseFreq, now);
          osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.48, now + 0.085);
          osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.15, now + 0.16);
          gain1.gain.setValueAtTime(0.001, now);
          gain1.gain.linearRampToValueAtTime(0.11, now + 0.025);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.18);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(baseFreq * 1.1, now + 0.11);
          osc2.frequency.exponentialRampToValueAtTime(baseFreq * 1.65, now + 0.21);
          gain2.gain.setValueAtTime(0.001, now + 0.11);
          gain2.gain.linearRampToValueAtTime(0.08, now + 0.13);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start(now + 0.11);
          osc2.stop(now + 0.25);
        } catch (e) {}
      }
      playBounce(intensity = 0.5) {
        if (!this.enabled || intensity < 0.08) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const vol = Math.min(0.14, intensity * 0.12);
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(115 + Math.min(80, intensity * 35), now);
          osc.frequency.exponentialRampToValueAtTime(42, now + 0.09);
          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        } catch (e) {}
      }
      playPickup() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(440, now + 0.09);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.05, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        } catch (e) {}
      }
    };

    class FishingSoundEngine extends BaseSoundEngine {
      constructor() {
        super();
        this.ambientStarted = false;
        this.waterfallGain = null;
        this.lofiTimer = null;
        this.lofiStep = 0;
        this.isPausedState = false;
      }

      ensureAmbient() {
        if (!this.enabled || this.isPausedState) return;
        try {
          this.init();
          if (!this.ctx) return;

          if (!this.ambientStarted) {
            this.ambientStarted = true;
            const bufferSize = this.ctx.sampleRate * 2;
            const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            for (let i = 0; i < bufferSize; i++) {
              const white = Math.random() * 2 - 1;
              b0 = 0.99886 * b0 + white * 0.0555179;
              b1 = 0.99332 * b1 + white * 0.0750759;
              b2 = 0.96900 * b2 + white * 0.1538520;
              b3 = 0.86650 * b3 + white * 0.3104856;
              b4 = 0.55000 * b4 + white * 0.5329522;
              b5 = -0.7616 * b5 - white * 0.0168980;
              output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.04;
              b6 = white * 0.115926;
            }

            const whiteNoise = this.ctx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            whiteNoise.loop = true;

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 520;
            filter.Q.value = 0.7;

            this.waterfallGain = this.ctx.createGain();
            this.waterfallGain.gain.value = 0.055;

            whiteNoise.connect(filter);
            filter.connect(this.waterfallGain);
            this.waterfallGain.connect(this.ctx.destination);
            whiteNoise.start(0);

            this.startLofiLoop();
          }

          if (this.waterfallGain) {
            this.waterfallGain.gain.setTargetAtTime(0.055, this.ctx.currentTime, 0.2);
          }
        } catch (e) {}
      }

      startLofiLoop() {
        if (this.lofiTimer) clearInterval(this.lofiTimer);
        const scale = [293.66, 349.23, 392.00, 440.00, 523.25, 587.33, 698.46];
        const bassNotes = [146.83, 174.61, 196.00, 130.81];

        this.lofiTimer = setInterval(() => {
          if (!this.enabled || this.isPausedState || !this.ctx || this.ctx.state !== 'running') return;
          try {
            const now = this.ctx.currentTime;
            if (this.lofiStep % 4 === 0) {
              const bFreq = bassNotes[(this.lofiStep / 4) % bassNotes.length];
              const bOsc = this.ctx.createOscillator();
              const bGain = this.ctx.createGain();
              bOsc.type = 'sine';
              bOsc.frequency.setValueAtTime(bFreq, now);
              bGain.gain.setValueAtTime(0.001, now);
              bGain.gain.linearRampToValueAtTime(0.032, now + 0.08);
              bGain.gain.exponentialRampToValueAtTime(0.001, now + 1.6);
              bOsc.connect(bGain);
              bGain.connect(this.ctx.destination);
              bOsc.start(now);
              bOsc.stop(now + 1.65);
            }

            if (Math.random() < 0.72) {
              const note = scale[(this.lofiStep * 2 + Math.floor(Math.random() * 3)) % scale.length];
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(note, now);
              gain.gain.setValueAtTime(0.001, now);
              gain.gain.linearRampToValueAtTime(0.022, now + 0.02);
              gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.75);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now);
              osc.stop(now + 0.8);
            }
            this.lofiStep++;
          } catch (e) {}
        }, 460);
      }

      syncMuteState() {
        if (!this.ctx || !this.waterfallGain) return;
        try {
          const target = (this.enabled && !this.isPausedState) ? 0.055 : 0.0001;
          this.waterfallGain.gain.setTargetAtTime(target, this.ctx.currentTime, 0.1);
        } catch (e) {}
      }

      playBobberPlop() {
        if (!this.enabled) return;
        try {
          this.ensureAmbient();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(580, now + 0.09);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.11, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        } catch (e) {}
      }

      playWaterSplash(intensity = 1.0) {
        if (!this.enabled) return;
        try {
          this.ensureAmbient();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(340, now + 0.18);
          gain.gain.setValueAtTime(Math.min(0.14, 0.09 * intensity), now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.24);
        } catch (e) {}
      }

      playNibble() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(360, now);
          osc.frequency.exponentialRampToValueAtTime(480, now + 0.05);
          gain.gain.setValueAtTime(0.04, now);

    const tempMatrix = new THREE.Matrix4();

    function buildVoxelInstancedMesh(voxels, unitSize, material, castShadow = true, receiveShadow = true) {
      if (!voxels || voxels.length === 0) return null;
      const geom = _createSoftVoxelGeometry(unitSize);
      const mesh = new THREE.InstancedMesh(geom, material, voxels.length);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = receiveShadow;

      for (let i = 0; i < voxels.length; i++) {
        const v = voxels[i];
        tempPos.set(v.x * unitSize, v.y * unitSize, v.z * unitSize);
        if (v.rx || v.ry || v.rz) {
          tempEuler.set(v.rx || 0, v.ry || 0, v.rz || 0);
          tempQuat.setFromEuler(tempEuler);
        } else {
          tempQuat.identity();
        }
        tempScale.set(v.sx || 1, v.sy || 1, v.sz || 1);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        mesh.setMatrixAt(i, tempMatrix);
        mesh.setColorAt(i, v.color instanceof THREE.Color ? v.color : new THREE.Color(v.color));
      }
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      return mesh;
    }

    function pushBox(list, x0, y0, z0, x1, y1, z1, colorFnOrHex, variance = 0.03) {
      for (let x = x0; x <= x1; x++) {

          for (let z = z0; z <= z1; z++) {
            if (x > x0 && x < x1 && y > y0 && y < y1 && z > z0 && z < z1) continue;

    // Heightmap for every grid cell (gx, gz) in [-38..37]
    function getBankGridHeight(gx, gz) {
      // Diorama outer stone containment rim on front & right pond edges so water is enclosed
      if (gx >= 36 || gz >= 36) {
        if (gx <= -19) return 3;
        if (gx <= -14 && gz >= 14) return 2;
        if (gx >= 29 && gz >= -16 && gz <= 6) return 3;
        return 0; // Neat mossy stone retaining wall at water level along front/right diorama border
      }

      // Back-Right Mountain Cliff for the Waterfall (gx >= 8, gz <= -18)
      if (gx >= 8 && gz <= -18) {
        const distFromCorner = Math.hypot(38 - gx, -38 - gz);
        if (gx >= 18 && gx <= 25 && gz >= -36 && gz <= -18) {
          if (gz <= -28) return 22; // Upper waterfall pool ledge
          return -5; // Plunge pool riverbed
        }
        if (distFromCorner < 24) {
          return Math.max(4, Math.min(26, Math.floor(26 - distFromCorner * 0.9)));
        }
      }

      // Left grassy bank (where Nitori's Kappa Bait Hut & Drying Rack stand: gx <= -19)
      if (gx <= -19) {
        return 3; // Top at Y = 1.0
      }

      // Back grassy bank (left of waterfall: gz <= -24 and gx < 12)
      if (gz <= -24 && gx < 12) {
        return 3;
      }

      // Front-left stepped bank slope (gx <= -14, gz >= 14)
      if (gx <= -14 && gz >= 14) {
        return 2; // Top at Y = 0.75
      }

      // Right rock outcrop where Marisa fishes with her Mini-Hakkero (gx >= 29, gz -16..6)
      if (gx >= 29 && gz >= -16 && gz <= 6) {
        return 3; // Top at Y = 1.0
      }

      // Otherwise it's the underwater riverbed basin!
      const pebbleBump = ((Math.abs(gx * 7 + gz * 13) % 7 === 0) && gx < 33 && gz < 33) ? 1 : 0;
      return -5 + pebbleBump; // Riverbed at gy = -5..-4
    }

    function buildMountainRiverScene() {
      const MIN_BASE_Y = -8; // Solid diorama foundation base at gy = -8 (Y = -2.0)

      // Pre-compute heightmap table for fast neighbor lookups
      const heightMap = {};
      for (let gx = -38; gx <= 37; gx++) {

          // Find lowest neighbor height within a 2-voxel radius so EVERY riverbank wall,
          // cliff step, and underwater drop-off is 100% filled with zero hollow gaps!
          let minNeighborY = topY;
          for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
              const nh = heightMap[`${gx + dx},${gz + dz}`];
              if (nh !== undefined && nh < minNeighborY) {
                minNeighborY = nh;
              }
            }
          }

          const isOuterBoundary = (gx === -38 || gx === 37 || gz === -38 || gz === 37);

          for (let gy = MIN_BASE_Y; gy <= topY; gy++) {
            // Fill the outer diorama walls, the bottom foundation slab, the riverbed,
            // and ALL exposed vertical/stepped riverbank walls down past the lowest neighbor!
            const isExposedOrStructural =
              isOuterBoundary ||
              gy === MIN_BASE_Y ||
              gy >= minNeighborY - 2 ||
              gy <= -5;

            if (!isExposedOrStructural) continue;

            let col = '#6b472e'; // Rich earthy soil wall

                // Mossy stone retaining wall along the pond edge

                // Mountain cliff rock & alpine moss cap

              } else {

    const FISH_SPECIES = [

      for (let z = -2; z <= 2; z++) {

      return buildVoxelInstancedMesh(fVoxels, U, mat, false, false);

    function updateSwimmingFish(time, dt) {
      for (let i = 0; i < swimmingFish.length; i++) {
        const f = swimmingFish[i];
        f.angle += f.speed * dt * 0.65;
        let tx = f.cx + Math.cos(f.angle) * f.radius;
        let tz = f.cz + Math.sin(f.angle * 1.3) * f.radius;

        if (fishingState.phase === 'waiting' || fishingState.phase === 'bite') {
          const distToBobber = Math.hypot(tx - fishingState.bobberPos.x, tz - fishingState.bobberPos.z);
          if (distToBobber < 3.2) {
            tx = THREE.MathUtils.lerp(tx, fishingState.bobberPos.x + Math.cos(time * 3 + i) * 0.45, 0.45);
            tz = THREE.MathUtils.lerp(tz, fishingState.bobberPos.z + Math.sin(time * 3 + i) * 0.45, 0.45);
          }
        }

        const dx = tx - f.mesh.position.x;
        const dz = tz - f.mesh.position.z;
        f.mesh.position.set(tx, f.depth + Math.sin(time * 2 + f.wigglePhase) * 0.05, tz);
        if (Math.hypot(dx, dz) > 0.001) {
          const targetYaw = Math.atan2(dx, dz);
          f.mesh.rotation.y = targetYaw + Math.sin(time * 9.0 + f.wigglePhase) * 0.16;
        }
      }

      const catX = 2.0 + Math.sin(time * 0.38) * 4.2;
      const catZ = 0.8 + Math.sin(time * 0.76) * 3.6;
      const catDx = Math.cos(time * 0.38) * 4.2 * 0.38;
      const catDz = Math.cos(time * 0.76) * 3.6 * 0.76;
      giantCatfishMesh.position.set(catX, POND_FLOOR_Y + 0.32, catZ);
      giantCatfishMesh.rotation.y = Math.atan2(catDx, catDz) + Math.sin(time * 4.5) * 0.1;
    }

    // ============================================================================
    // 7. DRAGONFLIES (DAY), FIREFLIES (NIGHT), RIPPLES & POP PARTICLES
    // ============================================================================
    const CRITTERS_COUNT = 28;
    const critterData = [];
    const critterGeom = new THREE.BoxGeometry(0.11, 0.06, 0.16);
    const critterMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
    const critterMesh = new THREE.InstancedMesh(critterGeom, critterMat, CRITTERS_COUNT);
    for (let i = 0; i < CRITTERS_COUNT; i++) {
      critterData.push({
        cx: -6 + Math.random() * 14,
        cy: 0.6 + Math.random() * 3.5,
        cz: -6 + Math.random() * 14,
        phase: Math.random() * Math.PI * 2,
        speed: 1.2 + Math.random() * 1.5,
        radius: 0.8 + Math.random() * 2.2
      });
    }
    scene.add(critterMesh);

    function updateCritters(time, nightFactor) {
      for (let i = 0; i < CRITTERS_COUNT; i++) {
        const c = critterData[i];
        const t = time * c.speed + c.phase;
        const x = c.cx + Math.cos(t) * c.radius;
        const y = c.cy + Math.sin(t * 1.7) * 0.35;
        const z = c.cz + Math.sin(t * 0.9) * c.radius;
        tempPos.set(x, y, z);
        tempEuler.set(0, -t, Math.sin(time * 18 + i) * 0.25);
        tempQuat.setFromEuler(tempEuler);

        const pulse = nightFactor > 0.4
          ? (0.5 + 0.6 * Math.max(0, Math.sin(time * 3.5 + c.phase)))
          : 1.0;
        tempScale.set(pulse, pulse, pulse);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        critterMesh.setMatrixAt(i, tempMatrix);

        if (nightFactor > 0.45) {
          _tempCol.set(i % 3 === 0 ? '#fde047' : '#a3e635');
        } else {
          _tempCol.set(i % 2 === 0 ? '#38bdf8' : '#fb7185');
        }
        critterMesh.setColorAt(i, _tempCol);
      }
      critterMesh.instanceMatrix.needsUpdate = true;
      if (critterMesh.instanceColor) critterMesh.instanceColor.needsUpdate = true;
    }

    const RIPPLE_MAX = 24;
    const ripples = [];
    const rippleGeom = new THREE.RingGeometry(0.18, 0.26, 16);
    rippleGeom.rotateX(-Math.PI / 2);
    const rippleMat = new THREE.MeshBasicMaterial({
      color: 0xe0f2fe,
      transparent: true,
      opacity: 0.7,
      side: THREE.DoubleSide
    });
    const rippleInstanced = new THREE.InstancedMesh(rippleGeom, rippleMat, RIPPLE_MAX);
    for (let i = 0; i < RIPPLE_MAX; i++) {
      ripples.push({ active: false, pos: new THREE.Vector3(), life: 0, maxLife: 1.0, maxScale: 3.0 });
      tempMatrix.makeScale(0, 0, 0);
      rippleInstanced.setMatrixAt(i, tempMatrix);
    }
    scene.add(rippleInstanced);

    function spawnWaterRipple(wx, wz, maxScale = 3.2) {
      for (let i = 0; i < RIPPLE_MAX; i++) {
        const r = ripples[i];
        if (!r.active) {
          r.active = true;
          r.life = 0;
          r.maxLife = 0.85;
          r.maxScale = maxScale;
          r.pos.set(wx, WATER_SURFACE_Y + 0.04, wz);
          break;
        }
      }
      lilyPads.forEach(lp => {
        if (Math.hypot(lp.baseX - wx, lp.baseZ - wz) < 3.5) {
          lp.hopTimer = 0.42;
        }
      });
    }

    function updateWaterRipples(dt) {
      let dirty = false;
      for (let i = 0; i < RIPPLE_MAX; i++) {
        const r = ripples[i];
        if (!r.active) continue;
        dirty = true;
        r.life += dt;
        if (r.life >= r.maxLife) {
          r.active = false;
          tempMatrix.makeScale(0, 0, 0);
          rippleInstanced.setMatrixAt(i, tempMatrix);
          continue;
        }
        const prog = r.life / r.maxLife;
        const s = 0.3 + prog * r.maxScale;
        tempQuat.identity();
        tempScale.set(s, 1, s * (1 - prog * 0.1));
        tempMatrix.compose(r.pos, tempQuat, tempScale);
        rippleInstanced.setMatrixAt(i, tempMatrix);
      }
      if (dirty) rippleInstanced.instanceMatrix.needsUpdate = true;
    }

    const POP_MAX = 64;
    const popParticles = [];
    const popGeom = new THREE.BoxGeometry(0.11, 0.11, 0.11);
    const popMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const popMesh = new THREE.InstancedMesh(popGeom, popMat, POP_MAX);
    for (let i = 0; i < POP_MAX; i++) {
      popParticles.push({ active: false, pos: new THREE.Vector3(), vel: new THREE.Vector3(), life: 0, maxLife: 1, color: new THREE.Color('#ff85a1') });
      tempMatrix.makeScale(0, 0, 0);
      popMesh.setMatrixAt(i, tempMatrix);
    }
    scene.add(popMesh);

    function spawnBurstParticles(origin, palette, count = 12, upwardBoost = 2.6) {
      let spawned = 0;
      for (let i = 0; i < POP_MAX && spawned < count; i++) {
        const p = popParticles[i];
        if (!p.active) {
          p.active = true;
          p.life = 0;
          p.maxLife = 0.45 + Math.random() * 0.25;
          p.pos.copy(origin).add(new THREE.Vector3(0, 0.5, 0));
          const angle = (spawned / count) * Math.PI * 2 + Math.random() * 0.3;
          const speed = 1.8 + Math.random() * 2.2;
          p.vel.set(Math.cos(angle) * speed, upwardBoost + Math.random() * 2.2, Math.sin(angle) * speed);
          p.color.set(palette[spawned % palette.length]);
          popMesh.setColorAt(i, p.color);
          spawned++;
        }
      }
      if (popMesh.instanceColor) popMesh.instanceColor.needsUpdate = true;
    }

    function updatePopParticles(dt) {
      let dirty = false;
      for (let i = 0; i < POP_MAX; i++) {
        const p = popParticles[i];
        if (!p.active) continue;
        dirty = true;
        p.life += dt;
        if (p.life >= p.maxLife) {
          p.active = false;
          tempMatrix.makeScale(0, 0, 0);
          popMesh.setMatrixAt(i, tempMatrix);
          continue;
        }
        p.vel.y -= 8.5 * dt;
        p.pos.addScaledVector(p.vel, dt);
        const s = 1.0 - (p.life / p.maxLife);
        tempEuler.set(p.life * 8, p.life * 6, 0);
        tempQuat.setFromEuler(tempEuler);
        tempScale.set(s, s, s);
        tempMatrix.compose(p.pos, tempQuat, tempScale);
        popMesh.setMatrixAt(i, tempMatrix);
      }
      if (dirty) popMesh.instanceMatrix.needsUpdate = true;
    }

    // ============================================================================
    // 8. TOUHOU FUMO VOXEL PLUSHIE BUILDER & SOFT-BODY + WATER BUOYANCY PHYSICS
    // ============================================================================
    const allFumoRaycastMeshes = [];
    const fumos = [];

    class VoxelFumo {
      constructor(config) {
        this.id = config.id;
        this.name = config.name;
        this.emoji = config.emoji || '🎀';
        this.accentColor = config.accentColor || '#ef4444';
        this.scaleFactor = config.scale || 1.0;
        this.FV = 0.082 * this.scaleFactor;
        this.radius = 0.85 * this.scaleFactor;
        this.pitchAudio = config.pitchAudio || 1.0;
        this.isSleeping = Boolean(config.isSleeping);
        this.followsRowboat = Boolean(config.followsRowboat);

        this.homePos = config.homePos.clone();
        this.homeYaw = config.homeYaw || 0;

        this.pos = this.homePos.clone();
        this.vel = new THREE.Vector3();
        this.yaw = this.homeYaw;
        this.pitch = 0;
        this.roll = 0;
        this.angVel = new THREE.Vector3();
        this.isGrounded = true;
        this.isFloatingInPond = false;
        this.isDragged = false;

        this.squash = 1.0;
        this.squashVel = 0.0;
        this.headPitch = 0.0;
        this.headRoll = 0.0;
        this.headPitchVel = 0.0;
        this.headRollVel = 0.0;
        this.limbPitch = 0.0;
        this.limbRoll = 0.0;
        this.limbPitchVel = 0.0;
        this.limbRollVel = 0.0;

        this.root = new THREE.Group();
        this.squashGroup = new THREE.Group();
        this.root.add(this.squashGroup);

        this.headPivot = new THREE.Group();
        this.headPivot.position.set(0, 7.2 * this.FV, 0);
        this.squashGroup.add(this.headPivot);

        this.leftArmPivot = new THREE.Group();
        this.leftArmPivot.position.set(-4.2 * this.FV, 6.2 * this.FV, 0.5 * this.FV);
        this.squashGroup.add(this.leftArmPivot);

        this.rightArmPivot = new THREE.Group();
        this.rightArmPivot.position.set(4.2 * this.FV, 6.2 * this.FV, 0.5 * this.FV);
        this.squashGroup.add(this.rightArmPivot);

        this.leftLegPivot = new THREE.Group();
        this.leftLegPivot.position.set(-2.3 * this.FV, 1.8 * this.FV, 3.2 * this.FV);
        this.squashGroup.add(this.leftLegPivot);

        this.rightLegPivot = new THREE.Group();
        this.rightLegPivot.position.set(2.3 * this.FV, 1.8 * this.FV, 3.2 * this.FV);
        this.squashGroup.add(this.rightLegPivot);

        this.wingsPivot = new THREE.Group();
        this.wingsPivot.position.set(0, 4.8 * this.FV, -3.5 * this.FV);
        this.squashGroup.add(this.wingsPivot);

        this.buildCharacterVoxels(config);
        this.syncTransform(0);
        scene.add(this.root);
      }

      buildCharacterVoxels(cfg) {
        const bodyVoxels = [];
        const headVoxels = [];
        const leftArmVoxels = [];
        const rightArmVoxels = [];
        const leftLegVoxels = [];
        const rightLegVoxels = [];
        const wingSolidVoxels = [];
        const wingGlowVoxels = [];

        const skinBase = '#ffe5d4';
        const blushCol = '#ff9ebb';
        const smileCol = '#4a2525';

        const addPlushVoxel = (arr, x, y, z, col, isSeam = false, sx = 1, sy = 1, sz = 1) => {
          const seamDarken = (isSeam && ((Math.abs(x + y + z) % 2) === 0)) ? 0.055 : 0;
          arr.push({
            x, y, z, sx, sy, sz,
            color: _varyColor(col, x + this.id.length * 7, y, z, 0.04, seamDarken)
          });
        };

        // 1. STUBBY SITTING TORSO
        for (let y = 0; y <= 7; y++) {
          const rMax = (y === 0 || y === 7) ? 3.4 : 4.2 - (y * 0.12);
          for (let x = -4; x <= 4; x++) {
            for (let z = -3; z <= 3; z++) {
              const dist = Math.hypot(x, z * 1.15);
              if (dist > rMax) continue;

              const isSideSeam = (z === 0 && Math.abs(x) >= rMax - 0.9);
              let col = cfg.outfitMain;

              if (y === 1 && z >= 1) col = '#ffffff';
              if (cfg.hasWhiteApron && z >= 1 && Math.abs(x) <= 2 && y <= 5) {
                col = '#fcfcfc';
              }
              if (y >= 5 && z >= 2 && Math.abs(x) <= 2) {
                col = '#ffffff';
                if (Math.abs(x) <= 1 && y === 5) col = cfg.tieColor || '#ef4444';
              }
              if (this.id === 'yuyuko' && z >= 2 && x === 0 && y >= 2 && y <= 5) {
                col = '#fbcfe8';
              }

              addPlushVoxel(bodyVoxels, x, y + 0.5, z, col, isSideSeam);
            }
          }
        }

        // 2. SHORT DANGLING ARMS
        for (const side of [-1, 1]) {
          const targetArr = side === -1 ? leftArmVoxels : rightArmVoxels;
          for (let y = -3; y <= 0; y++) {
            for (let x = -1; x <= 1; x++) {
              for (let z = -1; z <= 1; z++) {
                if (Math.abs(x) === 1 && Math.abs(z) === 1 && y === -3) continue;
                let col = cfg.sleeveColor || '#ffffff';
                if (y === -3) col = skinBase;
                else if (this.id === 'reimu' && y === -1) col = '#e63946';
                addPlushVoxel(targetArr, x * 0.85 + side * 0.4, y, z * 0.85, col, x === 0);
              }
            }
          }
        }

        // 3. SHORT SITTING / DANGLING LEGS WITH SHOES
        for (const side of [-1, 1]) {
          const targetArr = side === -1 ? leftLegVoxels : rightLegVoxels;
          for (let z = 0; z <= 4; z++) {
            for (let x = -1; x <= 1; x++) {
              for (let y = -1; y <= 1; y++) {
                if (Math.abs(x) === 1 && Math.abs(y) === 1) continue;
                let col = '#ffffff';
                if (z === 0) col = skinBase;
                if (z >= 3) col = cfg.shoeColor || '#2b2d42';
                if (z === 4 && y === 1 && x === 0) col = '#ffffff';
                addPlushVoxel(targetArr, x * 0.9, y * 0.9, z * 0.9, col, y === 0);
              }
            }
          }
        }

        // 4. OVERSIZED ROUND FUMO HEAD & ICONIC 'ᗜˬᗜ' FACE
        for (let y = 0; y <= 12; y++) {
          for (let x = -7; x <= 7; x++) {
            for (let z = -6; z <= 6; z++) {
              const dy = (y - 6.0) * 1.05;
              const dx = x * 0.94;
              const dz = z * 1.02;
              const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
              if (dist > 6.4 || dist < 4.5) continue;

              let col = skinBase;
              const isHeadSeam = (z === 0 && Math.abs(x) >= 5);

              const isBackOrTop = (z <= 1) || (y >= 9) || (Math.abs(x) >= 5 && z <= 3);
              const isForeheadBangs = (z >= 4 && y >= 7 && (Math.abs(x) !== 2 || y >= 8));
              const isSideLocks = (Math.abs(x) >= 5 && z >= 2 && y >= 2);

              if (isBackOrTop || isForeheadBangs || isSideLocks) {
                col = cfg.hairColor;
              } else if (z >= 5) {
                if ((Math.abs(x) === 3 || Math.abs(x) === 2) && y >= 4 && y <= 6) {
                  if (this.isSleeping) {
                    col = (y === 5) ? '#1f141e' : skinBase;
                  } else if (y === 6) {
                    col = '#1f141e';
                  } else if (y === 5 && Math.abs(x) === 2) {
                    col = '#ffffff';
                  } else {
                    if (this.id === 'kogasa') {
                      col = (x < 0) ? '#e11d48' : '#0284c7';
                    } else {
                      col = cfg.eyeColor;
                    }
                  }
                } else if (Math.abs(x) === 4 && y === 3) {
                  col = blushCol;
                } else if (y === 2 && Math.abs(x) <= 1) {
                  col = (x === 0) ? '#e07a7a' : smileCol;
                }
              }

              addPlushVoxel(headVoxels, x, y, z, col, isHeadSeam);
            }
          }
        }

        // 5. CHARACTER-SPECIFIC HATS, ACCESSORIES, PROPS & UNEXPECTED SPOTS
        if (this.id === 'nitori') {
          for (const side of [-1, 1]) {
            addPlushVoxel(headVoxels, side * 6.5, 4, 1.5, '#facc15', false, 1.2, 1.2, 1.2);
            for (let py = 0; py <= 3; py++) {
              addPlushVoxel(headVoxels, side * 7.2, py, 1.5, cfg.hairColor);
            }
          }
          for (let hx = -6; hx <= 6; hx++) {
            for (let hz = -6; hz <= 7; hz++) {
              const r = Math.hypot(hx, hz - 0.5);
              if (r <= 6.5) {
                const isVisor = (hz >= 5);
                addPlushVoxel(headVoxels, hx, isVisor ? 10.2 : 11.2, hz, isVisor ? '#15803d' : '#22c55e');
                if (!isVisor && r <= 5.2) addPlushVoxel(headVoxels, hx, 12.1, hz, '#4ade80');
              }
            }
          }
          for (let bx = -3; bx <= 3; bx++) {
            for (let by = -2; by <= 3; by++) {
              for (let bz = -3; bz <= 0; bz++) {
                const packCol = (by === 2) ? '#eab308' : ((Math.abs(bx) === 3) ? '#15803d' : '#16a34a');
                wingSolidVoxels.push({ x: bx, y: by, z: bz, color: _varyColor(packCol, bx, by, bz, 0.03) });
              }
            }
          }
          wingSolidVoxels.push({ x: 2.5, y: 4.2, z: -1.5, color: new THREE.Color('#94a3b8'), sx: 0.7, sy: 1.8, sz: 0.7 });
          wingSolidVoxels.push({ x: -2.2, y: 4.0, z: -1.5, color: new THREE.Color('#15803d'), sx: 0.8, sy: 1.6, sz: 0.8 });
        }

        if (this.id === 'reimu') {
          for (const side of [-1, 1]) {
            for (let y = -1; y <= 5; y++) {
              const tubeCol = (y === 5) ? '#e63946' : ((y >= 1 && y <= 4) ? '#ffffff' : cfg.hairColor);
              addPlushVoxel(headVoxels, side * 6.8, y, 2.2, tubeCol);
              addPlushVoxel(headVoxels, side * 6.8, y, 3.0, tubeCol);
            }
          }
          for (let bx = -7; bx <= 7; bx++) {
            const wingHeight = Math.min(4, Math.floor(Math.abs(bx) * 0.7) + 1);
            for (let by = -wingHeight; by <= wingHeight; by++) {
              addPlushVoxel(headVoxels, bx, 12.2 + by * 0.75, -1.5 - Math.abs(bx) * 0.15, '#d90429');
            }
          }
        }

        if (this.id === 'marisa') {
          for (let y = -1; y <= 5; y++) {
            addPlushVoxel(headVoxels, -6.6, y, 2.8, y === 0 ? '#ffffff' : cfg.hairColor);
          }
          for (let hx = -10; hx <= 10; hx++) {
            for (let hz = -10; hz <= 10; hz++) {
              const r = Math.hypot(hx, hz);
              if (r <= 10.2 && r >= 4.2) {
                const brimY = 10.2 - hz * 0.22 + Math.sin(Math.atan2(hz, hx) * 4) * 0.4;
                addPlushVoxel(headVoxels, hx, brimY, hz - 1.2, '#22222b');
              }
            }
          }
          for (let ch = 0; ch <= 9; ch++) {
            const coneR = Math.max(0.8, 5.2 - ch * 0.52);
            for (let hx = -6; hx <= 6; hx++) {
              for (let hz = -6; hz <= 6; hz++) {
                const r = Math.hypot(hx, hz);
                if (r <= coneR && r >= coneR - 1.3) {
                  const isRibbon = (ch === 1 || ch === 2);
                  addPlushVoxel(headVoxels, hx, 10.8 + ch * 0.9 - hz * 0.18, hz - 1.5 - ch * 0.28, isRibbon ? '#f8f9fa' : '#22222b');
                }
              }
            }
          }
          for (let bx = -3; bx <= 3; bx++) {
            addPlushVoxel(headVoxels, bx, 11.8, 3.8, '#ffffff');
            if (Math.abs(bx) >= 1) addPlushVoxel(headVoxels, bx, 12.6, 3.8, '#ffffff');
          }
          for (let hx = -1; hx <= 1; hx++) {
            for (let hy = -1; hy <= 1; hy++) {
              const isCore = (hx === 0 && hy === 0);
              addPlushVoxel(rightArmVoxels, 0.8 + hx * 0.7, -3.2 + hy * 0.7, 2.2, isCore ? '#38bdf8' : '#eab308');
            }
          }
        }

        if (this.id === 'cirno') {
          for (let bx = -6; bx <= 6; bx++) {
            const h = Math.min(3, Math.floor(Math.abs(bx) * 0.65) + 1);
            for (let by = -h; by <= h; by++) {
              addPlushVoxel(headVoxels, bx, 10.5 + by * 0.75, -4.8, '#1d4ed8');
            }
          }
          const wingAngles = [0.45, 0.05, -0.35];
          for (const side of [-1, 1]) {
            for (let w = 0; w < 3; w++) {
              const ang = wingAngles[w];
              for (let r = 1; r <= 7; r++) {
                const wx = side * (1.2 + Math.cos(ang) * r * 1.05);
                const wy = 1.0 + Math.sin(ang) * r * 1.05;
                const wz = -0.5 - r * 0.15;
                wingGlowVoxels.push({
                  x: wx, y: wy, z: wz,
                  color: _varyColor(r > 5 ? '#e0f2fe' : '#38bdf8', wx, wy, wz, 0.02),
                  sx: 1.1, sy: 0.85, sz: 0.6
                });
              }
            }
          }
        }

        if (this.id === 'kogasa') {
          for (let uy = -3; uy <= 11; uy++) {
            addPlushVoxel(leftArmVoxels, -1.8, uy, 2.2, '#a16207', false, 0.55, 1, 0.55);
          }
          for (let ux = -4; ux <= 4; ux++) {
            for (let uz = -4; uz <= 4; uz++) {
              const r = Math.hypot(ux, uz);
              if (r <= 4.4) {
                const canopyY = 11.5 - r * 0.35;
                let uCol = '#9333ea';
                if (uz >= 2 && Math.abs(ux) <= 1 && r <= 3.2) uCol = (ux === 0 && uz === 3) ? '#0f172a' : '#ffffff';
                addPlushVoxel(leftArmVoxels, -1.8 + ux * 0.8, canopyY, 2.2 + uz * 0.8, uCol);
              }
            }
          }
          addPlushVoxel(leftArmVoxels, -1.8, 9.2, 5.2, '#f43f5e', false, 1.1, 1.6, 0.7);
        }

        if (this.id === 'yuyuko') {
          for (let hx = -6; hx <= 6; hx++) {
            for (let hz = -6; hz <= 5; hz++) {
              const r = Math.hypot(hx, hz);
              if (r <= 6.4 && r >= 4.2) {
                addPlushVoxel(headVoxels, hx, 11.2, hz, '#bae6fd');
                if (r <= 5.4) addPlushVoxel(headVoxels, hx, 12.1, hz, '#e0f2fe');
              }
            }
          }

          for (let fx = -4; fx <= 4; fx++) {

            const fCol = (fx >= 2) ? '#64748b' : (Math.abs(fx) <= 1 ? '#fb8500' : '#f97316');

          }
          addPlushVoxel(headVoxels, -5.0, 13.8, 0.5, '#fb8500', false, 0.8, 1.6, 0.7);
          addPlushVoxel(headVoxels, -5.0, 12.4, 0.5, '#fb8500', false, 0.8, 1.6, 0.7);

        if (this.id === 'komachi_boat') {

        const registerPart = (voxels, parent, mat = plushMaterial) => {
          const m = buildVoxelInstancedMesh(voxels, this.FV, mat, true, true);
          if (m) {
            m.userData.fumo = this;

        registerPart(bodyVoxels, this.squashGroup);
        registerPart(headVoxels, this.headPivot);
        registerPart(leftArmVoxels, this.leftArmPivot);
        registerPart(rightArmVoxels, this.rightArmPivot);
        registerPart(leftLegVoxels, this.leftLegPivot);
        registerPart(rightLegVoxels, this.rightLegPivot);

        if (wingGlowVoxels.length > 0) {
          registerPart(wingGlowVoxels, this.wingsPivot, translucentIceMaterial);

      }

      squeeze(strength = 1.0) {
        this.squash = Math.max(0.52, this.squash - 0.42 * strength);
        this.squashVel = -3.5 * strength;
        this.headPitchVel += (Math.random() - 0.5) * 14 * strength;
        this.headRollVel += (Math.random() > 0.5 ? 1 : -1) * 11 * strength;
        this.limbPitch = -0.65 * strength;
        this.limbPitchVel = -6.0 * strength;
        spawnBurstParticles(this.pos, [this.accentColor, '#ff85a1', '#fde047', '#ffffff'], 12, 2.5);
        soundFX.playSqueeze(this.pitchAudio);
      }

      resetToHome() {
        this.pos.copy(this.homePos);
        this.vel.set(0, 0, 0);
        this.yaw = this.homeYaw;
        this.pitch = 0;
        this.roll = 0;
        this.angVel.set(0, 0, 0);
        this.isGrounded = true;
        this.isFloatingInPond = false;
        this.isDragged = false;
        this.squeeze(0.75);
      }

      updatePhysics(dt, time) {
        const squashStiff = 210.0;
        const squashDamp = 11.5;
        const squashForce = (1.0 - this.squash) * squashStiff - this.squashVel * squashDamp;
        this.squashVel += squashForce * dt;
        this.squash = THREE.MathUtils.clamp(this.squash + this.squashVel * dt, 0.45, 1.55);

        const headStiff = 140.0;
        const headDamp = 7.5;
        const idleHeadBob = Math.sin(time * 2.2 + this.homePos.x) * (this.isSleeping ? 0.06 : 0.025);
        this.headPitchVel += ((idleHeadBob - this.headPitch) * headStiff - this.headPitchVel * headDamp) * dt;
        this.headRollVel += ((0 - this.headRoll) * headStiff - this.headRollVel * headDamp) * dt;
        this.headPitch = THREE.MathUtils.clamp(this.headPitch + this.headPitchVel * dt, -0.55, 0.55);
        this.headRoll = THREE.MathUtils.clamp(this.headRoll + this.headRollVel * dt, -0.55, 0.55);

        const targetLimbPitch = (this.isDragged || (!this.isGrounded && !this.isFloatingInPond)) ? 0.58 : 0.0;
        const limbStiff = 120.0;
        const limbDamp = 8.0;
        this.limbPitchVel += ((targetLimbPitch - this.limbPitch) * limbStiff - this.limbPitchVel * limbDamp) * dt;
        this.limbRollVel += ((0 - this.limbRoll) * limbStiff - this.limbRollVel * limbDamp) * dt;
        this.limbPitch = THREE.MathUtils.clamp(this.limbPitch + this.limbPitchVel * dt, -0.8, 0.9);
        this.limbRoll = THREE.MathUtils.clamp(this.limbRoll + this.limbRollVel * dt, -0.6, 0.6);

        if (!this.isDragged) {
          if (this.followsRowboat && this.pos.distanceTo(this.homePos) < 0.7 && this.vel.lengthSq() < 0.2) {
            this.pos.x = rowboatGroup.position.x;
            this.pos.z = rowboatGroup.position.z;
            this.pos.y = rowboatGroup.position.y + 0.16;
            this.roll = rowboatGroup.rotation.z;
            this.pitch = rowboatGroup.rotation.x;
            this.isGrounded = true;
            this.syncTransform(time);
            return;
          }

          this.vel.y -= 24.0 * dt;
          this.vel.multiplyScalar(Math.pow(0.985, dt * 60));

          const prevY = this.pos.y;
          this.pos.addScaledVector(this.vel, dt);

          this.yaw += this.angVel.y * dt;
          this.pitch += this.angVel.x * dt;
          this.roll += this.angVel.z * dt;
          this.angVel.multiplyScalar(Math.pow(0.92, dt * 60));

          this.isGrounded = false;
          this.isFloatingInPond = false;

          const r = this.radius * 0.72;
          const centerY = this.pos.y + r;

          for (let i = 0; i < furnitureColliders.length; i++) {
            const box = furnitureColliders[i];
            const cx = THREE.MathUtils.clamp(this.pos.x, box.min.x, box.max.x);
            const cy = THREE.MathUtils.clamp(centerY, box.min.y, box.max.y);
            const cz = THREE.MathUtils.clamp(this.pos.z, box.min.z, box.max.z);

            const dx = this.pos.x - cx;
            const dy = centerY - cy;
            const dz = this.pos.z - cz;
            const distSq = dx * dx + dy * dy + dz * dz;

            if (distSq < r * r) {
              const dist = Math.sqrt(distSq);
              if (centerY >= box.max.y - 0.28 && this.vel.y <= 0.6) {
                const impact = -this.vel.y;
                this.pos.y = box.max.y;
                if (impact > 2.2) {
                  this.vel.y = impact * 0.36;
                  this.squashVel -= Math.min(8.5, impact * 0.85);
                  this.headPitchVel += (Math.random() - 0.5) * impact * 1.8;
                  soundFX.playBounce(impact * 0.08);
                } else {
                  this.vel.y = 0;
                  this.isGrounded = true;
                }
                this.vel.x *= 0.80;
                this.vel.z *= 0.80;
              } else if (dist > 0.0001) {
                const nx = dx / dist;
                const ny = dy / dist;
                const nz = dz / dist;
                const pen = r - dist;
                this.pos.x += nx * pen;
                this.pos.y += ny * pen;
                this.pos.z += nz * pen;

                const vn = this.vel.x * nx + this.vel.y * ny + this.vel.z * nz;
                if (vn < 0) {
                  const imp = -vn;
                  this.vel.x -= 1.38 * vn * nx;
                  this.vel.y -= 1.38 * vn * ny;
                  this.vel.z -= 1.38 * vn * nz;
                  if (imp > 2.0) {
                    this.squashVel -= Math.min(6.0, imp * 0.55);
                    soundFX.playBounce(imp * 0.06);
                  }
                }
              }
            }
          }

          if (!this.isGrounded && isPointInPond(this.pos.x, this.pos.z)) {
            const floatTargetY = WATER_SURFACE_Y - 0.14 + Math.sin(time * 2.8 + this.homePos.x) * 0.06;
            if (prevY > WATER_SURFACE_Y + 0.05 && this.pos.y <= WATER_SURFACE_Y + 0.05 && this.vel.y < -1.5) {
              const splashPower = Math.min(2.0, -this.vel.y * 0.15);
              spawnWaterRipple(this.pos.x, this.pos.z, 2.8 + splashPower);
              spawnBurstParticles(
                new THREE.Vector3(this.pos.x, WATER_SURFACE_Y, this.pos.z),
                ['#e0f2fe', '#7dd3fc', '#38bdf8', '#ffffff'],
                14,
                2.2 + splashPower
              );
              soundFX.playWaterSplash(splashPower);
              this.squashVel -= Math.min(7.5, -this.vel.y * 0.6);
            }

            if (this.pos.y < floatTargetY + 0.25) {
              this.isFloatingInPond = true;
              const depth = floatTargetY - this.pos.y;
              this.vel.y += (depth * 42.0 + 24.0) * dt;
              this.vel.y *= Math.pow(0.86, dt * 60);
              this.vel.x *= Math.pow(0.91, dt * 60);
              this.vel.z *= Math.pow(0.91, dt * 60);

              if (Math.random() < dt * 1.4) {
                spawnWaterRipple(this.pos.x, this.pos.z, 1.4);
              }
            }
          }

          if (this.pos.y < POND_FLOOR_Y) {
            this.pos.y = POND_FLOOR_Y;
            this.vel.y = 0;
            this.isGrounded = true;
          }

          const minBound = -8.9;
          const maxBound = 8.9;
          if (this.pos.x < minBound) { this.pos.x = minBound; this.vel.x = Math.abs(this.vel.x) * 0.48; }
          if (this.pos.x > maxBound) { this.pos.x = maxBound; this.vel.x = -Math.abs(this.vel.x) * 0.48; }
          if (this.pos.z < minBound) { this.pos.z = minBound; this.vel.z = Math.abs(this.vel.z) * 0.48; }
          if (this.pos.z > maxBound) { this.pos.z = maxBound; this.vel.z = -Math.abs(this.vel.z) * 0.48; }

          if (this.isGrounded || this.isFloatingInPond) {
            const floatTilt = this.isFloatingInPond ? Math.sin(time * 2.4 + this.homePos.z) * 0.12 : 0;
            this.pitch = THREE.MathUtils.lerp(this.pitch, floatTilt, Math.min(1, dt * 8.5));
            this.roll = THREE.MathUtils.lerp(this.roll, -floatTilt * 0.8, Math.min(1, dt * 8.5));
            this.angVel.multiplyScalar(0.75);
          }
        }

        this.syncTransform(time);
      }

      syncTransform(time) {
        this.root.position.copy(this.pos);
        this.root.rotation.order = 'YXZ';
        this.root.rotation.set(this.pitch, this.yaw, this.roll);

        const sy = this.squash;
        const sxz = 1.0 / Math.sqrt(Math.max(0.35, sy));
        this.squashGroup.scale.set(sxz, sy, sxz);

        this.headPivot.rotation.set(this.headPitch, 0, this.headRoll);

        this.leftArmPivot.rotation.set(this.limbPitch, 0, 0.18 + Math.abs(this.limbPitch) * 0.35 + this.limbRoll);
        this.rightArmPivot.rotation.set(this.limbPitch, 0, -0.18 - Math.abs(this.limbPitch) * 0.35 + this.limbRoll);
        this.leftLegPivot.rotation.set(this.limbPitch * 1.15, 0.08, this.limbRoll * 0.5);
        this.rightLegPivot.rotation.set(this.limbPitch * 1.15, -0.08, this.limbRoll * 0.5);

        const wingFlutter = Math.sin(time * 3.8 + this.homePos.x) * 0.06 + (1.0 - this.squash) * 0.35;
        this.wingsPivot.rotation.x = wingFlutter;
      }
    }

    function resolveFumoToFumoCollisions() {
      for (let i = 0; i < fumos.length; i++) {
        for (let j = i + 1; j < fumos.length; j++) {
          const a = fumos[i];
          const b = fumos[j];
          const minDist = (a.radius + b.radius) * 0.78;
          const dx = b.pos.x - a.pos.x;
          const dy = (b.pos.y + b.radius * 0.6) - (a.pos.y + a.radius * 0.6);
          const dz = b.pos.z - a.pos.z;
          const distSq = dx * dx + dy * dy + dz * dz;

          if (distSq < minDist * minDist && distSq > 0.0001) {
            const dist = Math.sqrt(distSq);
            const nx = dx / dist;
            const ny = dy / dist;
            const nz = dz / dist;
            const overlap = (minDist - dist) * 0.5;

            if (!a.isDragged) {
              a.pos.x -= nx * overlap;
              a.pos.y += -ny * overlap;
              a.pos.z -= nz * overlap;
            }
            if (!b.isDragged) {
              b.pos.x += nx * overlap;
              b.pos.y += ny * overlap;
              b.pos.z += nz * overlap;
            }

            const rvx = b.vel.x - a.vel.x;
            const rvy = b.vel.y - a.vel.y;
            const rvz = b.vel.z - a.vel.z;
            const vn = rvx * nx + rvy * ny + rvz * nz;
            if (vn < 0) {
              const imp = -vn * 0.68;
              if (!a.isDragged) {
                a.vel.x -= imp * nx;
                a.vel.y -= imp * ny;
                a.vel.z -= imp * nz;
                a.squashVel -= Math.min(5.0, imp * 0.6);
              }
              if (!b.isDragged) {
                b.vel.x += imp * nx;
                b.vel.y += imp * ny;
                b.vel.z += imp * nz;
                b.squashVel -= Math.min(5.0, imp * 0.6);
              }
              if (imp > 1.5) soundFX.playBounce(imp * 0.07);
            }
          }
        }
      }
    }

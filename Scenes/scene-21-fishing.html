        }
      }
      const pool = [FISH_SPECIES[0], FISH_SPECIES[1], FISH_SPECIES[2], FISH_SPECIES[3]];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function castFishingLine(targetPoint) {
      fishingState.phase = 'casting';
      fishingState.castStart.copy(ROD_TIP_POS);
      fishingState.bobberPos.set(
        THREE.MathUtils.clamp(targetPoint.x, -4.0, 8.2),
        WATER_SURFACE_Y,
        THREE.MathUtils.clamp(targetPoint.z, -5.0, 8.0)
      );
      fishingState.timer = 0;
      bobberGroup.visible = true;
      fishingLine.visible = true;
      fishingOverlayEl.classList.add('hidden');
      soundFX.playPickup();
      updateUIBadge(fumos[1], 'Casting Line...');
    }

    function startReelingMiniGame() {
      fishingState.phase = 'reeling';
      fishingState.hookedSpecies = selectHookedFish();
      fishingState.tension = 0.50;
      fishingState.tensionVel = 0;
      fishingState.sweetCenter = 0.50;
      fishingState.sweetPhase = Math.random() * Math.PI * 2;
      fishingState.reelProgress = 0.32;
      fishingState.isHoldingReel = false;

      biteAlertEl.classList.add('hidden');
      tensionGameEl.classList.remove('hidden');
      fishingOverlayEl.classList.remove('hidden');
      reelFishLabelEl.textContent = `${fishingState.hookedSpecies.emoji} Reeling ${fishingState.hookedSpecies.name.split(' ')[0]}!`;

      spawnWaterRipple(fishingState.bobberPos.x, fishingState.bobberPos.z, 3.0);
      soundFX.playWaterSplash(0.8);
      updateUIBadge(fumos[1], 'Reeling In! Hold Click!');
    }

    function completeFishCatch() {
      const sp = fishingState.hookedSpecies;
      fishingState.phase = 'idle';
      bobberGroup.visible = false;
      fishingLine.visible = false;
      fishingOverlayEl.classList.add('hidden');
      tensionGameEl.classList.add('hidden');

      caughtCounts[sp.id] = (caughtCounts[sp.id] || 0) + 1;
      totalFishCaught++;
      updateFishBookUI();

      const caughtMesh = createVoxelFishMesh(sp, 1.35);
      scene.add(caughtMesh);
      flyingCatch = {
        mesh: caughtMesh,
        startPos: fishingState.bobberPos.clone(),
        endPos: BASKET_TARGET_POS.clone(),
        t: 0,
        species: sp
      };

      fumos[1].squeeze(0.85);
      setTimeout(() => fumos[5].squeeze(1.1), 350);

      soundFX.playCatchJingle(Boolean(sp.glows || sp.id === 'giant_catfish'));
      showToast(sp.emoji, `Caught ${sp.name}! (${sp.rarity})`);
      updateUIBadge(fumos[5], `Caught ${sp.name}!`);
    }

    function updateFishingSystem(dt, time) {
      if (flyingCatch) {
        flyingCatch.t += dt * 1.45;
        if (flyingCatch.t >= 1.0) {
          scene.remove(flyingCatch.mesh);
          spawnBurstParticles(BASKET_TARGET_POS, ['#fde047', '#f472b6', '#38bdf8', '#ffffff'], 14, 2.8);
          flyingCatch = null;
        } else {
          const p = flyingCatch.t;
          flyingCatch.mesh.position.lerpVectors(flyingCatch.startPos, flyingCatch.endPos, p);
          flyingCatch.mesh.position.y += Math.sin(p * Math.PI) * 3.8;
          flyingCatch.mesh.rotation.y = p * Math.PI * 6;
          flyingCatch.mesh.rotation.z = Math.sin(p * Math.PI * 4) * 0.5;
        }
      }

      if (fishingState.phase === 'idle') return;

      fishingState.timer += dt;
      let currBobberPos = new THREE.Vector3();

      if (fishingState.phase === 'casting') {
        const p = Math.min(1.0, fishingState.timer / 0.42);
        currBobberPos.lerpVectors(fishingState.castStart, fishingState.bobberPos, p);
        currBobberPos.y += Math.sin(p * Math.PI) * 2.4;
        bobberGroup.position.copy(currBobberPos);

        if (p >= 1.0) {
          fishingState.phase = 'waiting';
          fishingState.timer = 0;
          fishingState.nextNibbleTime = 1.0 + Math.random() * 1.2;
          spawnWaterRipple(fishingState.bobberPos.x, fishingState.bobberPos.z, 2.4);
          soundFX.playBobberPlop();
          updateUIBadge(fumos[1], 'Waiting for Bite...');
        }
      } else if (fishingState.phase === 'waiting') {
        const nibbleDip = (fishingState.timer > fishingState.nextNibbleTime - 0.18 && fishingState.timer < fishingState.nextNibbleTime)
          ? -0.14
          : 0;
        currBobberPos.copy(fishingState.bobberPos);
        currBobberPos.y = WATER_SURFACE_Y + Math.sin(time * 3.5) * 0.04 + nibbleDip;
        bobberGroup.position.copy(currBobberPos);

        if (fishingState.timer >= fishingState.nextNibbleTime) {
          if (Math.random() < 0.45 && fishingState.timer < 3.2) {
            soundFX.playNibble();
            spawnWaterRipple(currBobberPos.x, currBobberPos.z, 1.3);
            fishingState.nextNibbleTime = fishingState.timer + 1.1 + Math.random() * 1.0;
          } else {
            fishingState.phase = 'bite';
            fishingState.biteTimeRemaining = 2.1;
            soundFX.playBiteAlert();
            spawnWaterRipple(currBobberPos.x, currBobberPos.z, 2.8);
            biteAlertEl.classList.remove('hidden');
            tensionGameEl.classList.add('hidden');
            fishingOverlayEl.classList.remove('hidden');
            updateUIBadge(fumos[1], '❗ BITE! Click Water Now!');
          }
        }
      } else if (fishingState.phase === 'bite') {
        fishingState.biteTimeRemaining -= dt;
        currBobberPos.copy(fishingState.bobberPos);
        currBobberPos.y = WATER_SURFACE_Y - 0.22 + Math.sin(time * 24) * 0.08;
        bobberGroup.position.copy(currBobberPos);

        if (fishingState.biteTimeRemaining <= 0) {
          fishingState.phase = 'idle';
          bobberGroup.visible = false;
          fishingLine.visible = false;
          fishingOverlayEl.classList.add('hidden');
          showToast('💨', 'The fish nibbled the bait and swam away!');
          updateUIBadge(fumos[1], 'Fish Escaped');
          return;
        }
      } else if (fishingState.phase === 'reeling') {
        fishingState.sweetPhase += dt * 2.1;
        fishingState.sweetCenter = 0.5 + Math.sin(fishingState.sweetPhase) * 0.26;

        const pullAccel = fishingState.isHoldingReel ? 1.35 : -1.05;
        const fishJitter = Math.sin(time * 11.0) * 0.35;
        fishingState.tensionVel += (pullAccel + fishJitter) * dt;
        fishingState.tensionVel *= Math.pow(0.82, dt * 60);
        fishingState.tension = THREE.MathUtils.clamp(fishingState.tension + fishingState.tensionVel * dt, 0.04, 0.96);

        const inSweetSpot = Math.abs(fishingState.tension - fishingState.sweetCenter) <= 0.19;
        if (inSweetSpot) {
          fishingState.reelProgress += dt * 0.48;
          fishingState.clickSoundCooldown -= dt;
          if (fishingState.clickSoundCooldown <= 0) {
            soundFX.playReelClick(0.9 + fishingState.reelProgress * 0.4);
            fishingState.clickSoundCooldown = 0.11;
          }
        } else {
          fishingState.reelProgress = Math.max(0.05, fishingState.reelProgress - dt * 0.18);
        }

        tensionSweetspotEl.style.left = `${(fishingState.sweetCenter - 0.16) * 100}%`;
        tensionMarkerEl.style.left = `calc(${fishingState.tension * 100}% - 5px)`;
        const pct = Math.min(100, Math.round(fishingState.reelProgress * 100));
        reelProgressBarEl.style.width = `${pct}%`;
        reelProgressPctEl.textContent = `${pct}%`;

        currBobberPos.lerpVectors(fishingState.bobberPos, new THREE.Vector3(0.2, WATER_SURFACE_Y, 2.8), fishingState.reelProgress * 0.65);
        currBobberPos.x += Math.sin(time * 18) * 0.12;
        currBobberPos.y = WATER_SURFACE_Y + Math.sin(time * 14) * 0.06;
        bobberGroup.position.copy(currBobberPos);

        if (Math.random() < dt * 5) {
          spawnWaterRipple(currBobberPos.x, currBobberPos.z, 1.6);
        }

        if (fishingState.reelProgress >= 1.0) {
          completeFishCatch();
          return;
        }
      }

      if (!fishingOverlayEl.classList.contains('hidden')) {
        const screenVec = currBobberPos.clone().add(new THREE.Vector3(0, 0.45, 0));
        screenVec.project(camera);
        const sx = (screenVec.x * 0.5 + 0.5) * window.innerWidth;
        const sy = (-(screenVec.y * 0.5) + 0.5) * window.innerHeight;
        fishingOverlayEl.style.left = `${THREE.MathUtils.clamp(sx, 120, window.innerWidth - 120)}px`;
        fishingOverlayEl.style.top = `${THREE.MathUtils.clamp(sy, 90, window.innerHeight - 90)}px`;
      }

      const posAttr = fishingLine.geometry.attributes.position;
      const sag = (fishingState.phase === 'reeling' || fishingState.phase === 'bite') ? 0.05 : 0.45;
      for (let i = 0; i <= 16; i++) {
        const u = i / 16;
        const lx = THREE.MathUtils.lerp(ROD_TIP_POS.x, currBobberPos.x, u);
        const ly = THREE.MathUtils.lerp(ROD_TIP_POS.y, currBobberPos.y + 0.15, u) - Math.sin(u * Math.PI) * sag;
        const lz = THREE.MathUtils.lerp(ROD_TIP_POS.z, currBobberPos.z, u);
        posAttr.setXYZ(i, lx, ly, lz);
      }
      posAttr.needsUpdate = true;
    }

    const fishCounterTextEl = document.getElementById('fish-counter-text');
    const fishBookModalEl = document.getElementById('fish-book-modal');
    const fishBookGridEl = document.getElementById('fish-book-grid');
    const totalCatchesStatEl = document.getElementById('total-catches-stat');

    function updateFishBookUI() {
      const uniqueCaught = FISH_SPECIES.filter(s => caughtCounts[s.id] > 0).length;
      fishCounterTextEl.textContent = `${uniqueCaught} / ${FISH_SPECIES.length} Caught`;
      totalCatchesStatEl.textContent = `Total Basket Catches: ${totalFishCaught}`;

      fishBookGridEl.innerHTML = '';
      FISH_SPECIES.forEach(sp => {
        const count = caughtCounts[sp.id] || 0;
        const card = document.createElement('div');
        card.className = `rounded-2xl p-2.5 border text-xs flex items-center gap-2.5 ${
          count > 0 ? 'bg-emerald-500/15 border-emerald-400/40' : 'bg-black/10 border-current/10 opacity-60'
        }`;
        card.innerHTML = `
          <div class="text-xl leading-none">${count > 0 ? sp.emoji : '❔'}</div>
          <div class="min-w-0 flex-1 leading-tight">
            <div class="font-display font-bold truncate">${count > 0 ? sp.name : '???'}</div>
            <div class="text-[10px] opacity-75">${sp.rarity} • ×${count}</div>
          </div>
        `;
        fishBookGridEl.appendChild(card);
      });
    }
    updateFishBookUI();

    function switchBait() {
      currentBaitIndex = (currentBaitIndex + 1) % BAIT_TYPES.length;
      const b = BAIT_TYPES[currentBaitIndex];
      document.getElementById('bait-icon').textContent = b.icon;
      document.getElementById('bait-name').textContent = b.name;
      soundFX.playPickup();
      showToast(b.icon, `Switched Bait: ${b.name} (${b.desc})`);
    }

    // ============================================================================
    // 11. POINTER INTERACTION: FUMO DRAG/THROW, SQUEEZE & WATER FISHING CAST
    // ============================================================================
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    const dragPlane = new THREE.Plane();
    const dragHitPoint = new THREE.Vector3();
    const dragOffset = new THREE.Vector3();

    let hoveredFumo = null;
    let selectedFumo = null;
    let isDraggingFumo = false;
    let pointerDownScreen = new THREE.Vector2();
    let pointerDownOnWater = null;
    let dragHistory = [];

    const tooltipEl = document.getElementById('fumo-tooltip');
    const tooltipEmojiEl = document.getElementById('tooltip-emoji');
    const tooltipTextEl = document.getElementById('tooltip-text');
    const badgeDotEl = document.getElementById('fumo-badge-dot');
    const badgeNameEl = document.getElementById('fumo-badge-name');
    const badgeStatusEl = document.getElementById('fumo-badge-status');

    function updateUIBadge(fumo, statusText) {
      if (!fumo) {
        badgeDotEl.style.backgroundColor = '#06b6d4';
        badgeNameEl.textContent = 'Click Pond to Cast';
        badgeStatusEl.textContent = 'Ready';
        return;
      }
      badgeDotEl.style.backgroundColor = fumo.accentColor;
      badgeNameEl.textContent = fumo.name.split(' (')[0];
      badgeStatusEl.textContent = statusText;
    }

    function updatePointerNDC(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function pickFumoUnderPointer() {
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(allFumoRaycastMeshes, false);
      if (hits.length > 0 && hits[0].object.userData.fumo) {
        return { fumo: hits[0].object.userData.fumo, point: hits[0].point };
      }
      return null;
    }

    function pickWaterUnderPointer() {
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects([waterHitPlane, waterMesh], false);
      if (hits.length > 0 && isPointInPond(hits[0].point.x, hits[0].point.z)) {
        return hits[0].point;
      }
      return null;
    }

    const onPointerDown = (e) => {
      if (e.button !== 0) return;
      recordInteraction();

      if (fishingState.phase === 'reeling') {
        fishingState.isHoldingReel = true;
        return;
      }

      updatePointerNDC(e);
      pointerDownScreen.set(e.clientX, e.clientY);
      pointerDownOnWater = null;

      const hitFumo = pickFumoUnderPointer();
      if (hitFumo) {
        selectedFumo = hitFumo.fumo;
        isDraggingFumo = false;
        controls.enabled = false;

        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        dragPlane.setFromNormalAndCoplanarPoint(camDir.negate(), selectedFumo.pos);

        if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
          dragOffset.subVectors(selectedFumo.pos, dragHitPoint);
        } else {
          dragOffset.set(0, 0, 0);
        }

        dragHistory = [{ pos: selectedFumo.pos.clone(), time: performance.now() }];
        updateUIBadge(selectedFumo, 'Selected');
        return;
      }

      const waterPt = pickWaterUnderPointer();
      if (waterPt) {
        pointerDownOnWater = waterPt.clone();
      }
    };

    const onPointerMove = (e) => {
      updatePointerNDC(e);

      if (selectedFumo) {
        recordInteraction();
        const moveDist = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);

        if (!isDraggingFumo && moveDist > 6) {
          isDraggingFumo = true;
          selectedFumo.isDragged = true;
          selectedFumo.isGrounded = false;
          selectedFumo.isFloatingInPond = false;
          selectedFumo.squashVel += 3.2;
          soundFX.playPickup();
          updateUIBadge(selectedFumo, 'Dragging — Toss into Pond!');
        }

        if (isDraggingFumo) {
          raycaster.setFromCamera(pointerNDC, camera);
          if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
            const targetPos = dragHitPoint.clone().add(dragOffset);
            targetPos.x = THREE.MathUtils.clamp(targetPos.x, -8.8, 8.8);
            targetPos.y = THREE.MathUtils.clamp(targetPos.y, 0.2, 11.5);
            targetPos.z = THREE.MathUtils.clamp(targetPos.z, -8.8, 8.8);

            const prevPos = selectedFumo.pos.clone();
            selectedFumo.pos.lerp(targetPos, 0.55);

            const deltaMove = selectedFumo.pos.clone().sub(prevPos);
            selectedFumo.headRollVel -= deltaMove.x * 16.0;
            selectedFumo.headPitchVel += deltaMove.z * 16.0 - deltaMove.y * 10.0;
            selectedFumo.limbRollVel -= deltaMove.x * 22.0;
            selectedFumo.roll = THREE.MathUtils.lerp(selectedFumo.roll, THREE.MathUtils.clamp(-deltaMove.x * 1.4, -0.45, 0.45), 0.3);
            selectedFumo.pitch = THREE.MathUtils.lerp(selectedFumo.pitch, THREE.MathUtils.clamp(deltaMove.z * 1.4, -0.45, 0.45), 0.3);

            const now = performance.now();
            dragHistory.push({ pos: selectedFumo.pos.clone(), time: now });
            while (dragHistory.length > 6) dragHistory.shift();
          }
          tooltipEl.style.opacity = '0';
          renderer.domElement.style.cursor = 'grabbing';
          return;
        }
      }

      const hitFumo = pickFumoUnderPointer();
      if (hitFumo) {
        hoveredFumo = hitFumo.fumo;
        renderer.domElement.style.cursor = 'grab';
        tooltipEmojiEl.textContent = hoveredFumo.emoji;
        tooltipTextEl.textContent = hoveredFumo.name;
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = `${e.clientX + 14}px`;
        tooltipEl.style.top = `${e.clientY - 18}px`;
      } else {
        hoveredFumo = null;
        const waterPt = pickWaterUnderPointer();
        if (waterPt) {
          renderer.domElement.style.cursor = 'pointer';
          tooltipEmojiEl.textContent = '🎣';
          tooltipTextEl.textContent = fishingState.phase === 'bite' ? 'CLICK TO HOOK FISH!' : 'Click Water to Cast Line';
          tooltipEl.style.opacity = '1';
          tooltipEl.style.left = `${e.clientX + 14}px`;
          tooltipEl.style.top = `${e.clientY - 18}px`;
        } else {
          renderer.domElement.style.cursor = 'default';
          tooltipEl.style.opacity = '0';
        }
      }
    };

    const onPointerUp = (e) => {
      fishingState.isHoldingReel = false;

      if (selectedFumo) {
        controls.enabled = true;
        recordInteraction();

        if (!isDraggingFumo) {
          selectedFumo.squeeze(1.0);
          updateUIBadge(selectedFumo, 'Squeezed! ᗜˬᗜ');
        } else {
          selectedFumo.isDragged = false;
          const now = performance.now();
          while (dragHistory.length > 1 && now - dragHistory[0].time > 140) {
            dragHistory.shift();
          }
          if (dragHistory.length >= 2) {
            const first = dragHistory[0];
            const last = dragHistory[dragHistory.length - 1];
            const dtSec = Math.max(0.016, (last.time - first.time) / 1000);
            const throwVel = last.pos.clone().sub(first.pos).divideScalar(dtSec);
            if (throwVel.length() > 22) throwVel.setLength(22);
            selectedFumo.vel.copy(throwVel);

            const speed = throwVel.length();
            selectedFumo.angVel.set(
              throwVel.z * 0.65 + (Math.random() - 0.5) * speed * 0.4,
              (Math.random() - 0.5) * speed * 0.5,
              -throwVel.x * 0.65 + (Math.random() - 0.5) * speed * 0.4
            );
          } else {
            selectedFumo.vel.set(0, 0, 0);
          }
          updateUIBadge(selectedFumo, 'Tossed!');
        }

        selectedFumo = null;
        isDraggingFumo = false;
        renderer.domElement.style.cursor = hoveredFumo ? 'grab' : 'default';
        return;
      }

      if (pointerDownOnWater) {
        const moveDist = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);
        if (moveDist < 7) {
          if (fishingState.phase === 'bite') {
            startReelingMiniGame();
          } else if (fishingState.phase === 'idle' || fishingState.phase === 'waiting') {
            castFishingLine(pointerDownOnWater);
          }
        }
        pointerDownOnWater = null;
      }
    };

    renderer.domElement.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);

    // ============================================================================
    // 12. DAY / NIGHT SMOOTH INTERPOLATION (~2 SECONDS) & HUB MODE COMPLIANCE
    // ============================================================================
    let isNightMode = false;
    let dayNightProgress = 0.0;
    let dayNightTarget = 0.0;

    const daySkyColor = new THREE.Color('#a8d8ff');
    const duskSkyColor = new THREE.Color('#f99f76');
    const nightSkyColor = new THREE.Color('#091024');

    const daySunLightCol = new THREE.Color('#ffefd2');
    const duskSunLightCol = new THREE.Color('#ff9254');
    const nightMoonLightCol = new THREE.Color('#6b93e6');

    const dayHemiSky = new THREE.Color('#fff6e5');
    const nightHemiSky = new THREE.Color('#1e294a');
    const dayHemiGround = new THREE.Color('#5c7a62');
    const nightHemiGround = new THREE.Color('#0c1324');

    function postModeToParent() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'modeChanged', mode: isNightMode ? 'night' : 'day' }, '*');
        }
      } catch (e) {}
    }

    function onSetMode(mode) {
      const targetNight = (mode === 'night');
      if (targetNight === isNightMode) return;
      isNightMode = targetNight;
      dayNightTarget = isNightMode ? 1.0 : 0.0;
      document.body.classList.toggle('night-ui', isNightMode);
      try {
        localStorage.setItem(STORAGE_MODE_KEY, isNightMode ? 'night' : 'day');
      } catch (e) {}
      postModeToParent();
    }

    function onToggleMode() {
      onSetMode(isNightMode ? 'day' : 'night');
      soundFX.playPickup();
    }

    function updateDayNightTransition(dt) {
      if (Math.abs(dayNightProgress - dayNightTarget) > 0.0005) {
        const step = dt * 0.52;
        if (dayNightProgress < dayNightTarget) {
          dayNightProgress = Math.min(dayNightTarget, dayNightProgress + step);
        } else {
          dayNightProgress = Math.max(dayNightTarget, dayNightProgress - step);
        }
      }

      const t = dayNightProgress < 0.5
        ? 4 * dayNightProgress * dayNightProgress * dayNightProgress
        : 1 - Math.pow(-2 * dayNightProgress + 2, 3) / 2;

      if (t < 0.5) {
        scene.background.lerpColors(daySkyColor, duskSkyColor, t * 2);
        sunDirLight.color.lerpColors(daySunLightCol, duskSunLightCol, t * 2);
      } else {
        scene.background.lerpColors(duskSkyColor, nightSkyColor, (t - 0.5) * 2);
        sunDirLight.color.lerpColors(duskSunLightCol, nightMoonLightCol, (t - 0.5) * 2);
      }
      scene.fog.color.copy(scene.background);

      sunDirLight.intensity = THREE.MathUtils.lerp(0.96, 0.34, t);
      hemiLight.color.lerpColors(dayHemiSky, nightHemiSky, t);
      hemiLight.groundColor.lerpColors(dayHemiGround, nightHemiGround, t);
      hemiLight.intensity = THREE.MathUtils.lerp(0.52, 0.24, t);

      stoneLanternLight.intensity = THREE.MathUtils.lerp(0.05, 1.55, t);
      hutLanternLight.intensity = THREE.MathUtils.lerp(0.05, 1.45, t);
      pondGlowLight.intensity = THREE.MathUtils.lerp(0.08, 1.15, t);

      lanternEmissiveMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.30, 2.35, t);
      glowingFishMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.25, 1.85, t);
      translucentIceMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.16, 0.78, t);
      waterMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.10, 0.40, t);
      subsurfaceWaterMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.08, 0.32, t);

      if (bloomPass) {
        bloomPass.strength = THREE.MathUtils.lerp(0.10, 0.68, t);
        bloomPass.threshold = THREE.MathUtils.lerp(0.88, 0.60, t);
      }
    }

    // ============================================================================
    // 13. UI BUTTONS & KEYBOARD LISTENERS (No 1-9 Keys, N for Mode, F for Bait, M for Mute)
    // ============================================================================
    const btnSound = document.getElementById('btn-sound');
    const iconSoundOn = document.getElementById('icon-sound-on');
    const iconSoundOff = document.getElementById('icon-sound-off');

    function syncSoundButtonUI() {
      iconSoundOn.classList.toggle('hidden', !soundFX.enabled);
      iconSoundOff.classList.toggle('hidden', soundFX.enabled);
    }
    syncSoundButtonUI();

    function toggleMute() {
      soundFX.enabled = !soundFX.enabled;
      syncSoundButtonUI();
      soundFX.syncMuteState();
      try {
        localStorage.setItem(STORAGE_MUTE_KEY, soundFX.enabled ? 'false' : 'true');
      } catch (e) {}
      if (soundFX.enabled) {
        soundFX.ensureAmbient();
        soundFX.playPickup();
      }
    }

    btnSound.addEventListener('click', toggleMute);
    document.getElementById('btn-bait').addEventListener('click', switchBait);

    document.getElementById('btn-fish-book').addEventListener('click', () => {
      fishBookModalEl.classList.toggle('hidden');
      fishBookModalEl.classList.toggle('flex');
      soundFX.playPickup();
    });

    document.getElementById('btn-close-book').addEventListener('click', () => {
      fishBookModalEl.classList.add('hidden');
      fishBookModalEl.classList.remove('flex');
    });

    document.getElementById('btn-squeeze-all').addEventListener('click', () => {
      fumos.forEach((f, idx) => setTimeout(() => f.squeeze(1.05), idx * 50));
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      fumos.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 45));
      updateUIBadge(null, 'Reset');
    });

    const onKeyDown = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      const key = e.key.toLowerCase();
      if (key === 'n') {
        e.preventDefault();
        onToggleMode();
      } else if (key === 'f') {
        e.preventDefault();
        switchBait();
      } else if (key === 'm') {
        e.preventDefault();
        toggleMute();
      } else if (key === 'b') {
        e.preventDefault();
        document.getElementById('btn-fish-book').click();
      } else if (key === 'r') {
        e.preventDefault();
        fumos.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 45));
      } else if (key === ' ') {
        e.preventDefault();
        if (fishingState.phase === 'bite') {
          startReelingMiniGame();
        } else if (fishingState.phase === 'reeling') {
          fishingState.isHoldingReel = true;
        } else {
          fumos.forEach((f, idx) => setTimeout(() => f.squeeze(1.05), idx * 50));
        }
      }
    };

    const onKeyUp = (e) => {
      if (e.key === ' ') {
        fishingState.isHoldingReel = false;
      }
    };

    const onResize = () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    };

    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    window.addEventListener('resize', onResize);

    // ============================================================================
    // 14. MAIN ANIMATION LOOP & FumoSceneLifecycle REGISTRATION
    // ============================================================================
    let prevTime = performance.now();
    let isPaused = false;
    let rafId = null;

    function updateWaterAndBoats(time, dt) {
      if (waterMesh) {
        for (let i = 0; i < waterSurfaceData.length; i++) {
          const w = waterSurfaceData[i];
          if (w.isWaterfall) {
            const dropOffset = ((time * 5.5 + w.phase) % 1.0) * 0.45;
            tempPos.set(w.x * RV, (w.baseY - dropOffset) * RV, (w.z + dropOffset * 0.35) * RV);
            tempQuat.identity();
            const foamPulse = 0.88 + Math.sin(time * 12 + w.phase) * 0.18;
            tempScale.set(w.sx * foamPulse, w.sy, w.sz * foamPulse);
          } else {
            const waveY = Math.sin(time * 2.2 + w.phase) * 0.08;
            tempPos.set(w.x * RV, (w.baseY + waveY) * RV, w.z * RV);
            tempQuat.identity();
            tempScale.set(w.sx, w.sy, w.sz);
          }
          tempMatrix.compose(tempPos, tempQuat, tempScale);
          waterMesh.setMatrixAt(i, tempMatrix);
        }
        waterMesh.instanceMatrix.needsUpdate = true;
      }

      for (let i = 0; i < lilyPads.length; i++) {
        const lp = lilyPads[i];
        lp.group.position.y = WATER_SURFACE_Y + 0.03 + Math.sin(time * 2.0 + lp.phase) * 0.025;
        lp.group.rotation.z = Math.sin(time * 1.5 + lp.phase) * 0.03;
        if (lp.hopTimer > 0) {
          lp.hopTimer = Math.max(0, lp.hopTimer - dt);
          const hopNorm = lp.hopTimer / 0.42;
          lp.frogGroup.position.y = Math.sin(hopNorm * Math.PI) * 0.48;
        } else {
          lp.frogGroup.position.y = 0;
        }
      }

      rowboatGroup.position.y = WATER_SURFACE_Y + 0.08 + Math.sin(time * 1.8) * 0.04;
      rowboatGroup.rotation.z = Math.sin(time * 1.4) * 0.045;
      rowboatGroup.rotation.x = Math.cos(time * 1.1) * 0.03;
    }

    function animate(now) {
      if (isPaused) return;
      rafId = requestAnimationFrame(animate);

      const dt = Math.min(0.033, Math.max(0.001, (now - prevTime) / 1000));
      prevTime = now;
      const elapsed = now * 0.001;

      if (!selectedFumo && fishingState.phase === 'idle' && (now - lastUserInteractionTime > 4800)) {
        controls.autoRotate = true;
      }

      controls.update();
      updateDayNightTransition(dt);
      updateWaterAndBoats(elapsed, dt);
      updateSwimmingFish(elapsed, dt);
      updateCritters(elapsed, dayNightProgress);
      updateWaterRipples(dt);
      updatePopParticles(dt);
      updateFishingSystem(dt, elapsed);

      for (let i = 0; i < fumos.length; i++) {
        fumos[i].updatePhysics(dt, elapsed);
      }
      resolveFumoToFumoCollisions();

      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    function onPause() {
      if (isPaused) return;
      isPaused = true;
      soundFX.isPausedState = true;
      soundFX.syncMuteState();
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    function onResume() {
      if (!isPaused) return;
      isPaused = false;
      soundFX.isPausedState = false;
      soundFX.syncMuteState();
      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    }

    function onDispose() {
      isPaused = true;
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      renderer.domElement.removeEventListener('pointerdown', onPointerDown);
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('keyup', onKeyUp);
      window.removeEventListener('resize', onResize);
      soundFX.dispose();
    }

    let lifecycle = null;
    if (typeof FumoSceneLifecycle !== 'undefined') {
      lifecycle = new FumoSceneLifecycle({
        renderer,
        scene,
        composer,
        audio: soundFX,
        onToggleMode,
        onSetMode,
        onPause,
        onResume,
        onDispose
      });
    }

    (function initScene() {
      let initialMode = 'day';
      try {
        const savedMode = localStorage.getItem(STORAGE_MODE_KEY);
        if (savedMode === 'night') initialMode = 'night';
      } catch (e) {}

      if (initialMode === 'night') {
        isNightMode = true;
        dayNightProgress = 1.0;
        dayNightTarget = 1.0;
        document.body.classList.add('night-ui');
      }
      updateDayNightTransition(0);
      postModeToParent();

      fumos.forEach((f, idx) => {
        setTimeout(() => {
          f.squash = 0.78;
          f.squashVel = 2.0;
          f.headPitchVel = 4.0;
        }, 120 + idx * 65);
      });

      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>

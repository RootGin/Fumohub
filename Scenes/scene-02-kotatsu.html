          for (let hx = -6; hx <= 6; hx++) {
            for (let hz = -6; hz <= 4; hz++) {
              if (Math.hypot(hx, hz) <= 6.2 && Math.hypot(hx, hz) >= 4.2) {
                addPlushVoxel(headVoxels, hx, 11.0, hz, '#15803d');
              }
            }
          }
        }

        if (this.id === 'shinmyoumaru') {
          // Tiny Miracle Mallet / Bowl Hat on the sleeping Mikan-Bowl Fumo!
          for (let hx = -5; hx <= 5; hx++) {
            for (let hz = -5; hz <= 5; hz++) {
              const r = Math.hypot(hx, hz);
              if (r <= 5.2) {
                addPlushVoxel(headVoxels, hx, 11.4, hz, r >= 4.0 ? '#fbbf24' : '#dc2626');
              }
            }
          }
        }

        const registerPart = (voxels, parent, mat = plushMaterial) => {
          const m = buildVoxelInstancedMesh(voxels, this.FV, mat, true, true);
          if (m) {
            m.userData.fumo = this;
            parent.add(m);
            allFumoRaycastMeshes.push(m);
          }
          return m;
        };

        registerPart(bodyVoxels, this.squashGroup);
        registerPart(headVoxels, this.headPivot);
        registerPart(leftArmVoxels, this.leftArmPivot);
        registerPart(rightArmVoxels, this.rightArmPivot);
        registerPart(leftLegVoxels, this.leftLegPivot);
        registerPart(rightLegVoxels, this.rightLegPivot);
        registerPart(wingSolidVoxels, this.wingsPivot);
        if (wingGlowVoxels.length > 0) {
          registerPart(wingGlowVoxels, this.wingsPivot, translucentIceMaterial);
        }
        if (companionVoxels.length > 0) {
          registerPart(companionVoxels, this.companionPivot, translucentIceMaterial);
        }
      }

      squeeze(strength = 1.0) {
        this.squash = Math.max(0.52, this.squash - 0.42 * strength);
        this.squashVel = -3.5 * strength;
        this.headPitchVel += (Math.random() - 0.5) * 14 * strength;
        this.headRollVel += (Math.random() > 0.5 ? 1 : -1) * 11 * strength;
        this.limbPitch = -0.65 * strength;
        this.limbPitchVel = -6.0 * strength;
        spawnSqueezeParticles(this.pos, this.accentColor);
        soundFX.playSqueeze(this.pitchAudio);
      }

      resetToHome() {
        this.pos.copy(this.homePos);
        this.vel.set(0, 0, 0);
        this.yaw = this.homeYaw;
        this.pitch = 0;
        this.roll = 0;
        this.angVel.set(0, 0, 0);
        this.isGrounded = true;
        this.isDragged = false;
        this.squeeze(0.75);
      }

      updatePhysics(dt, time) {
        const squashStiff = 210.0;
        const squashDamp = 11.5;
        const squashForce = (1.0 - this.squash) * squashStiff - this.squashVel * squashDamp;
        this.squashVel += squashForce * dt;
        this.squash += this.squashVel * dt;
        this.squash = THREE.MathUtils.clamp(this.squash, 0.45, 1.55);

        const headStiff = 140.0;
        const headDamp = 7.5;
        const idleHeadBob = Math.sin(time * 2.2 + this.homePos.x) * 0.028;
        this.headPitchVel += ((idleHeadBob - this.headPitch) * headStiff - this.headPitchVel * headDamp) * dt;
        this.headRollVel += ((0 - this.headRoll) * headStiff - this.headRollVel * headDamp) * dt;
        this.headPitch = THREE.MathUtils.clamp(this.headPitch + this.headPitchVel * dt, -0.55, 0.55);
        this.headRoll = THREE.MathUtils.clamp(this.headRoll + this.headRollVel * dt, -0.55, 0.55);

        const targetLimbPitch = (this.isDragged || !this.isGrounded) ? 0.58 : 0.0;
        const limbStiff = 120.0;
        const limbDamp = 8.0;
        this.limbPitchVel += ((targetLimbPitch - this.limbPitch) * limbStiff - this.limbPitchVel * limbDamp) * dt;
        this.limbRollVel += ((0 - this.limbRoll) * limbStiff - this.limbRollVel * limbDamp) * dt;
        this.limbPitch = THREE.MathUtils.clamp(this.limbPitch + this.limbPitchVel * dt, -0.8, 0.9);
        this.limbRoll = THREE.MathUtils.clamp(this.limbRoll + this.limbRollVel * dt, -0.6, 0.6);

        if (!this.isDragged) {
          this.vel.y -= 24.0 * dt;
          this.vel.multiplyScalar(Math.pow(0.985, dt * 60));

          this.pos.addScaledVector(this.vel, dt);

          this.yaw += this.angVel.y * dt;
          this.pitch += this.angVel.x * dt;
          this.roll += this.angVel.z * dt;
          this.angVel.multiplyScalar(Math.pow(0.92, dt * 60));

          this.isGrounded = false;

          if (this.pos.y < 0) {
            const impact = -this.vel.y;
            this.pos.y = 0;
            if (impact > 1.8) {
              this.vel.y = impact * 0.42;
              this.squashVel -= Math.min(9.0, impact * 0.95);
              this.headPitchVel += (Math.random() - 0.5) * impact * 2.0;
              this.headRollVel += (Math.random() - 0.5) * impact * 2.0;
              soundFX.playBounce(impact * 0.08);
            } else {
              this.vel.y = 0;
              this.isGrounded = true;
            }
            this.vel.x *= 0.82;
            this.vel.z *= 0.82;
          }

          const minBound = -8.2;
          const maxBound = 9.25;
          if (this.pos.x < minBound) {
            this.pos.x = minBound;
            const imp = Math.abs(this.vel.x);
            this.vel.x = imp * 0.48;
            if (imp > 2.0) { this.squashVel -= imp * 0.5; soundFX.playBounce(imp * 0.06); }
          } else if (this.pos.x > maxBound) {
            this.pos.x = maxBound;
            this.vel.x = -Math.abs(this.vel.x) * 0.48;
          }
          if (this.pos.z < minBound) {
            this.pos.z = minBound;
            const imp = Math.abs(this.vel.z);
            this.vel.z = imp * 0.48;
            if (imp > 2.0) { this.squashVel -= imp * 0.5; soundFX.playBounce(imp * 0.06); }
          } else if (this.pos.z > maxBound) {
            this.pos.z = maxBound;
            this.vel.z = -Math.abs(this.vel.z) * 0.48;
          }

          const r = this.radius * 0.72;
          const centerY = this.pos.y + r;

          for (let i = 0; i < furnitureColliders.length; i++) {
            const box = furnitureColliders[i];
            // Allow fumos on the tatami floor to tuck their legs under the kotatsu blanket rim!
            if (box.name === 'kotatsu_table' && this.pos.y < 0.65 && this.vel.y <= 0.5) {
              continue;
            }

            const cx = THREE.MathUtils.clamp(this.pos.x, box.min.x, box.max.x);
            const cy = THREE.MathUtils.clamp(centerY, box.min.y, box.max.y);
            const cz = THREE.MathUtils.clamp(this.pos.z, box.min.z, box.max.z);

            const dx = this.pos.x - cx;
            const dy = centerY - cy;
            const dz = this.pos.z - cz;
            const distSq = dx * dx + dy * dy + dz * dz;

            if (distSq < r * r) {
              const dist = Math.sqrt(distSq);
              if (centerY >= box.max.y - 0.25 && this.vel.y <= 0.5) {
                const impact = -this.vel.y;
                this.pos.y = box.max.y;
                if (impact > 2.0) {
                  this.vel.y = impact * 0.38;
                  this.squashVel -= Math.min(8.5, impact * 0.85);
                  this.headPitchVel += (Math.random() - 0.5) * impact * 1.8;
                  soundFX.playBounce(impact * 0.08);
                } else {
                  this.vel.y = 0;
                  this.isGrounded = true;
                }
                this.vel.x *= 0.80;
                this.vel.z *= 0.80;
              } else if (dist > 0.0001) {
                const nx = dx / dist;
                const ny = dy / dist;
                const nz = dz / dist;
                const pen = r - dist;
                this.pos.x += nx * pen;
                this.pos.y = Math.max(0, this.pos.y + ny * pen);
                this.pos.z += nz * pen;

                const vn = this.vel.x * nx + this.vel.y * ny + this.vel.z * nz;
                if (vn < 0) {
                  const imp = -vn;
                  this.vel.x -= 1.42 * vn * nx;
                  this.vel.y -= 1.42 * vn * ny;
                  this.vel.z -= 1.42 * vn * nz;
                  if (imp > 2.0) {
                    this.squashVel -= Math.min(6.0, imp * 0.55);
                    soundFX.playBounce(imp * 0.06);
                  }
                }
              }
            }
          }

          if (this.isGrounded) {
            this.pitch = THREE.MathUtils.lerp(this.pitch, 0, Math.min(1, dt * 9.5));
            this.roll = THREE.MathUtils.lerp(this.roll, 0, Math.min(1, dt * 9.5));
            this.angVel.multiplyScalar(0.75);
          }
        }

        // Knock Mikan oranges if a Fumo bumps into them!
        for (let m = 0; m < mikans.length; m++) {
          const mk = mikans[m];
          const dx = mk.pos.x - this.pos.x;
          const dy = mk.pos.y - (this.pos.y + this.radius * 0.5);
          const dz = mk.pos.z - this.pos.z;
          const d = Math.hypot(dx, dy, dz);
          if (d < this.radius + mk.radius) {
            mk.vel.x += (dx / Math.max(0.1, d)) * 4.5 + this.vel.x * 0.5;
            mk.vel.y = Math.max(mk.vel.y, 1.8);
            mk.vel.z += (dz / Math.max(0.1, d)) * 4.5 + this.vel.z * 0.5;
          }
        }

        this.syncTransform(time);
      }

      syncTransform(time) {
        this.root.position.copy(this.pos);
        this.root.rotation.order = 'YXZ';
        this.root.rotation.set(this.pitch, this.yaw, this.roll);

        const sy = this.squash;
        const sxz = 1.0 / Math.sqrt(Math.max(0.35, sy));
        this.squashGroup.scale.set(sxz, sy, sxz);

        this.headPivot.rotation.set(this.headPitch, 0, this.headRoll);

        this.leftArmPivot.rotation.set(this.limbPitch, 0, 0.18 + Math.abs(this.limbPitch) * 0.35 + this.limbRoll);
        this.rightArmPivot.rotation.set(this.limbPitch, 0, -0.18 - Math.abs(this.limbPitch) * 0.35 + this.limbRoll);
        this.leftLegPivot.rotation.set(this.limbPitch * 1.15, 0.08, this.limbRoll * 0.5);
        this.rightLegPivot.rotation.set(this.limbPitch * 1.15, -0.08, this.limbRoll * 0.5);

        const wingFlutter = Math.sin(time * 3.8 + this.homePos.x) * 0.06 + (1.0 - this.squash) * 0.35;
        this.wingsPivot.rotation.x = wingFlutter;

        // Bob Youmu's floating ghost orb (Myon)
        if (this.id === 'youmu') {
          this.companionPivot.position.y = Math.sin(time * 3.2) * 0.14;
          this.companionPivot.rotation.y = Math.sin(time * 1.5) * 0.18;
        }
      }
    }

    function resolveFumoToFumoCollisions() {
      for (let i = 0; i < fumos.length; i++) {
        for (let j = i + 1; j < fumos.length; j++) {
          const a = fumos[i];
          const b = fumos[j];
          const minDist = (a.radius + b.radius) * 0.78;
          const dx = b.pos.x - a.pos.x;
          const dy = (b.pos.y + b.radius * 0.6) - (a.pos.y + a.radius * 0.6);
          const dz = b.pos.z - a.pos.z;
          const distSq = dx * dx + dy * dy + dz * dz;

          if (distSq < minDist * minDist && distSq > 0.0001) {
            const dist = Math.sqrt(distSq);
            const nx = dx / dist;
            const ny = dy / dist;
            const nz = dz / dist;
            const overlap = (minDist - dist) * 0.5;

            if (!a.isDragged) {
              a.pos.x -= nx * overlap;
              a.pos.y = Math.max(0, a.pos.y - ny * overlap);
              a.pos.z -= nz * overlap;
            }
            if (!b.isDragged) {
              b.pos.x += nx * overlap;
              b.pos.y = Math.max(0, b.pos.y + ny * overlap);
              b.pos.z += nz * overlap;
            }

            const rvx = b.vel.x - a.vel.x;
            const rvy = b.vel.y - a.vel.y;
            const rvz = b.vel.z - a.vel.z;
            const vn = rvx * nx + rvy * ny + rvz * nz;
            if (vn < 0) {
              const imp = -vn * 0.68;
              if (!a.isDragged) {
                a.vel.x -= imp * nx;
                a.vel.y -= imp * ny;
                a.vel.z -= imp * nz;
                a.squashVel -= Math.min(5.0, imp * 0.6);
              }
              if (!b.isDragged) {
                b.vel.x += imp * nx;
                b.vel.y += imp * ny;
                b.vel.z += imp * nz;
                b.squashVel -= Math.min(5.0, imp * 0.6);
              }
              if (imp > 1.5) soundFX.playBounce(imp * 0.07);
            }
          }
        }
      }
    }

    const raycaster = new THREE.Raycaster();

    const dragPlane = new THREE.Plane();
    const dragHitPoint = new THREE.Vector3();
    const dragOffset = new THREE.Vector3();

    let hoveredFumo = null;
    let hoveredMikan = null;
    let selectedFumo = null;
    let isDraggingFumo = false;
    let pointerDownScreen = new THREE.Vector2();

    function updatePointerNDC(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function pickInteractiveUnderPointer() {
      raycaster.setFromCamera(pointerNDC, camera);
      const fHits = raycaster.intersectObjects(allFumoRaycastMeshes, false);
      if (fHits.length > 0 && fHits[0].object.userData.fumo) {
        return { type: 'fumo', fumo: fHits[0].object.userData.fumo, point: fHits[0].point };
      }
      const mHits = raycaster.intersectObjects(allMikanMeshes, false);
      if (mHits.length > 0 && mHits[0].object.userData.mikan) {
        return { type: 'mikan', mikan: mHits[0].object.userData.mikan, point: mHits[0].point };
      }
      return null;
    }

    function updateUIBadge(fumo, statusText) {
      if (!fumo) {
        badgeEl.classList.add('hidden');
        badgeEl.classList.remove('flex');
        return;
      }
      badgeEl.classList.remove('hidden');
      badgeEl.classList.add('flex');
      badgeDotEl.style.backgroundColor = fumo.accentColor;
      badgeNameEl.textContent = fumo.name;
      badgeStatusEl.textContent = statusText;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      recordInteraction();
      updatePointerNDC(e);
      pointerDownScreen.set(e.clientX, e.clientY);

      const hit = pickInteractiveUnderPointer();
      if (hit && hit.type === 'mikan') {
        // Click a Mikan orange to roll it off the Kotatsu table!
        const pushDir = hit.mikan.pos.clone().sub(new THREE.Vector3(0.5, 2.2, 0.5)).normalize();
        pushDir.x = (pushDir.x || 0.7) * 4.2;
        pushDir.z = (pushDir.z || 0.7) * 4.2;
        pushDir.y = 2.0;
        hit.mikan.nudge(pushDir);
        return;
      }

      if (hit && hit.type === 'fumo') {
        selectedFumo = hit.fumo;
        isDraggingFumo = false;
        controls.enabled = false;

        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        dragPlane.setFromNormalAndCoplanarPoint(camDir.negate(), selectedFumo.pos);

        if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
          dragOffset.subVectors(selectedFumo.pos, dragHitPoint);
        } else {
          dragOffset.set(0, 0, 0);
        }

        dragHistory = [{ pos: selectedFumo.pos.clone(), time: performance.now() }];
        updateUIBadge(selectedFumo, 'Selected');
      }
    });

    window.addEventListener('pointermove', (e) => {
      updatePointerNDC(e);

      if (selectedFumo) {
        recordInteraction();
        const moveDist = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);

        if (!isDraggingFumo && moveDist > 6) {
          isDraggingFumo = true;
          selectedFumo.isDragged = true;
          selectedFumo.isGrounded = false;
          selectedFumo.squashVel += 3.2;
          soundFX.playPickup();
          updateUIBadge(selectedFumo, 'Dragging — Release to Throw!');
        }

        if (isDraggingFumo) {
          raycaster.setFromCamera(pointerNDC, camera);
          if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
            const targetPos = dragHitPoint.clone().add(dragOffset);
            targetPos.x = THREE.MathUtils.clamp(targetPos.x, -8.0, 9.0);
            targetPos.y = THREE.MathUtils.clamp(targetPos.y, 0.15, 10.2);
            targetPos.z = THREE.MathUtils.clamp(targetPos.z, -8.0, 9.0);

            const prevPos = selectedFumo.pos.clone();
            selectedFumo.pos.lerp(targetPos, 0.55);

            const deltaMove = selectedFumo.pos.clone().sub(prevPos);
            selectedFumo.headRollVel -= deltaMove.x * 16.0;
            selectedFumo.headPitchVel += deltaMove.z * 16.0 - deltaMove.y * 10.0;
            selectedFumo.limbRollVel -= deltaMove.x * 22.0;
            selectedFumo.roll = THREE.MathUtils.lerp(selectedFumo.roll, THREE.MathUtils.clamp(-deltaMove.x * 1.4, -0.45, 0.45), 0.3);
            selectedFumo.pitch = THREE.MathUtils.lerp(selectedFumo.pitch, THREE.MathUtils.clamp(deltaMove.z * 1.4, -0.45, 0.45), 0.3);

            const now = performance.now();
            dragHistory.push({ pos: selectedFumo.pos.clone(), time: now });
            while (dragHistory.length > 6) dragHistory.shift();
          }
          tooltipEl.style.opacity = '0';
          renderer.domElement.style.cursor = 'grabbing';
          return;
        }
      }

      const hit = pickInteractiveUnderPointer();
      if (hit && hit.type === 'fumo') {
        hoveredFumo = hit.fumo;
        hoveredMikan = null;
        renderer.domElement.style.cursor = 'grab';
        tooltipEmojiEl.textContent = hoveredFumo.emoji;
        tooltipTextEl.textContent = hoveredFumo.name;
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = `${e.clientX + 14}px`;
        tooltipEl.style.top = `${e.clientY - 18}px`;
      } else if (hit && hit.type === 'mikan') {
        hoveredFumo = null;
        hoveredMikan = hit.mikan;
        renderer.domElement.style.cursor = 'pointer';
        tooltipEmojiEl.textContent = '🍊';
        tooltipTextEl.textContent = 'Sweet Mikan — Click to Roll!';
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = `${e.clientX + 14}px`;
        tooltipEl.style.top = `${e.clientY - 18}px`;
      } else {
        hoveredFumo = null;
        hoveredMikan = null;
        renderer.domElement.style.cursor = 'default';
        tooltipEl.style.opacity = '0';
      }
    });

    window.addEventListener('pointerup', () => {
      if (!selectedFumo) return;
      controls.enabled = true;
      recordInteraction();

      if (!isDraggingFumo) {
        selectedFumo.squeeze(1.0);
        updateUIBadge(selectedFumo, 'Squeezed! ᗜˬᗜ');
      } else {
        selectedFumo.isDragged = false;
        const now = performance.now();
        while (dragHistory.length > 1 && now - dragHistory[0].time > 140) {
          dragHistory.shift();
        }
        if (dragHistory.length >= 2) {
          const first = dragHistory[0];
          const last = dragHistory[dragHistory.length - 1];
          const dtSec = Math.max(0.016, (last.time - first.time) / 1000);
          const throwVel = last.pos.clone().sub(first.pos).divideScalar(dtSec);
          if (throwVel.length() > 22) throwVel.setLength(22);
          selectedFumo.vel.copy(throwVel);

          const speed = throwVel.length();
          selectedFumo.angVel.set(
            throwVel.z * 0.65 + (Math.random() - 0.5) * speed * 0.4,
            (Math.random() - 0.5) * speed * 0.5,
            -throwVel.x * 0.65 + (Math.random() - 0.5) * speed * 0.4
          );
        } else {
          selectedFumo.vel.set(0, 0, 0);
        }
        updateUIBadge(selectedFumo, 'Thrown!');
      }

      selectedFumo = null;
      isDraggingFumo = false;
      renderer.domElement.style.cursor = hoveredFumo ? 'grab' : 'default';
    });

    // ============================================================================
    // 12. DAY / NIGHT SMOOTH INTERPOLATION (~2 SECONDS) & HUB INTEGRATION
    // ============================================================================
    const STORAGE_MODE_KEY = 'voxel_fumo_kotatsu_mode';
    let isNightMode = true; // Default to cozy snowy night warmth
    let dayNightProgress = 1.0; // 0.0 = Day, 1.0 = Night
    let dayNightTarget = 1.0;

    // Day: Bright, cold, overcast winter afternoon
    // Night: Deep blue moonlit snow outside + warm orange kotatsu & paper lantern glow inside
    const daySkyColor = new THREE.Color('#cfdce8');
    const nightSkyColor = new THREE.Color('#0c1226');

    const dayWindowLightCol = new THREE.Color('#eaf2fb');
    const nightWindowLightCol = new THREE.Color('#6090e8');

    const dayHemiSky = new THREE.Color('#eef4fa');
    const nightHemiSky = new THREE.Color('#1e294a');
    const dayHemiGround = new THREE.Color('#bba78c');
    const nightHemiGround = new THREE.Color('#14111c');

    const dayShojiEmissive = new THREE.Color('#dbeafe');
    const nightShojiEmissive = new THREE.Color('#3b5998');

    function notifyParentMode() {
      const modeStr = isNightMode ? 'night' : 'day';
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'modeChanged', mode: modeStr }, '*');
        }
      } catch (e) {}
    }

    function setDayNightMode(night, { immediate = false, playSound = true } = {}) {
      isNightMode = Boolean(night);
      dayNightTarget = isNightMode ? 1.0 : 0.0;
      if (immediate) {
        dayNightProgress = dayNightTarget;
      }
      document.body.classList.toggle('night-ui', isNightMode);

      try {
        localStorage.setItem(STORAGE_MODE_KEY, isNightMode ? 'night' : 'day');
      } catch (e) {}

      if (playSound) {
        soundFX.playPickup();
      }
      notifyParentMode();
    }

    function toggleDayNight() {
      setDayNightMode(!isNightMode, { immediate: false, playSound: true });
    }

    function updateDayNightTransition(dt, elapsed) {
      if (Math.abs(dayNightProgress - dayNightTarget) > 0.0005) {
        const step = dt * 0.52; // ~2 seconds smooth transition
        if (dayNightProgress < dayNightTarget) {
          dayNightProgress = Math.min(dayNightTarget, dayNightProgress + step);
        } else {
          dayNightProgress = Math.max(dayNightTarget, dayNightProgress - step);
        }
      }

      const t = dayNightProgress < 0.5
        ? 4 * dayNightProgress * dayNightProgress * dayNightProgress
        : 1 - Math.pow(-2 * dayNightProgress + 2, 3) / 2;

      // 1. Sky & Fog
      scene.background.lerpColors(daySkyColor, nightSkyColor, t);
      scene.fog.color.copy(scene.background);

      // 2. Window & Shoji Directional Light (Overcast Daylight -> Blue Moonlight on Snow)
      windowDirLight.color.lerpColors(dayWindowLightCol, nightWindowLightCol, t);
      windowDirLight.intensity = THREE.MathUtils.lerp(1.25, 0.42, t);

      // 3. Hemisphere Bounce
      hemiLight.color.lerpColors(dayHemiSky, nightHemiSky, t);
      hemiLight.groundColor.lerpColors(dayHemiGround, nightHemiGround, t);
      hemiLight.intensity = THREE.MathUtils.lerp(0.75, 0.24, t);

      // 4. Gently Flickering Kotatsu Heater Glow + Paper Lantern + TV Glow
      const heaterFlicker = 0.88 + 0.12 * Math.sin(elapsed * 7.5) * Math.cos(elapsed * 4.3);
      kotatsuHeaterLight.intensity = THREE.MathUtils.lerp(0.55, 2.25, t) * heaterFlicker;
      roomLanternLight.intensity = THREE.MathUtils.lerp(0.12, 1.45, t);
      tvGlowLight.intensity = THREE.MathUtils.lerp(0.18, 0.95, t);

      // 5. Emissive Materials
      shojiPaperMaterial.emissive.lerpColors(dayShojiEmissive, nightShojiEmissive, t);
      shojiPaperMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.28, 0.14, t);
      warmEmissiveMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.25, 2.25, t);
      heaterEmissiveMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.85, 2.65, t) * heaterFlicker;
      tvScreenEmissiveMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.35, 1.45, t);
      translucentIceMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.22, 0.82, t);

      // 6. UnrealBloomPass Strength
      if (bloomPass) {
        bloomPass.strength = THREE.MathUtils.lerp(0.14, 0.68, t);
        bloomPass.threshold = THREE.MathUtils.lerp(0.85, 0.62, t);
      }
    }

    // UI Button & Keyboard Listeners
    document.getElementById('btn-roll-mikan').addEventListener('click', () => {
      const m = mikans[Math.floor(Math.random() * mikans.length)];
      m.nudge();
    });

    document.getElementById('btn-squeeze-all').addEventListener('click', () => {
      fumos.forEach((f, idx) => setTimeout(() => f.squeeze(1.05), idx * 50));
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      fumos.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 40));
      mikans.forEach(m => m.resetToHome());
      updateUIBadge(null, '');
    });

    const btnSound = document.getElementById('btn-sound');
    const iconSoundOn = document.getElementById('icon-sound-on');
    const iconSoundOff = document.getElementById('icon-sound-off');
    btnSound.addEventListener('click', () => {
      soundFX.enabled = !soundFX.enabled;
      iconSoundOn.classList.toggle('hidden', !soundFX.enabled);
      iconSoundOff.classList.toggle('hidden', soundFX.enabled);
      if (soundFX.enabled) soundFX.playPickup();
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      const key = e.key.toLowerCase();
      if (key === 'n') {
        e.preventDefault();
        toggleDayNight();
      } else if (key === 'r') {
        fumos.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 40));
        mikans.forEach(m => m.resetToHome());
      } else if (key === ' ') {
        e.preventDefault();
        fumos.forEach((f, idx) => setTimeout(() => f.squeeze(1.05), idx * 50));
      } else if (key === 'o') {
        const m = mikans[Math.floor(Math.random() * mikans.length)];
        m.nudge();
      } else if (key === 'm') {
        btnSound.click();
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================================
    // 13. MAIN ANIMATION LOOP, PAUSE / RESUME & HUB MESSAGE LISTENER
    // ============================================================================
    let prevTime = performance.now();
    let isPaused = false;
    let rafId = null;

    function animate(now) {
      if (isPaused) return;
      rafId = requestAnimationFrame(animate);

      const dt = Math.min(0.033, Math.max(0.001, (now - prevTime) / 1000));
      prevTime = now;
      const elapsed = now * 0.001;

      if (!selectedFumo && (now - lastUserInteractionTime > 4500)) {
        controls.autoRotate = true;
      }

      controls.update();
      updateDayNightTransition(dt, elapsed);
      updateHangingNoren(elapsed);
      updateTVScreen(elapsed);
      updateSnowfallAndAccumulation(elapsed, dt);
      updateCurlingSteam(elapsed, dt);
      updatePopParticles(dt);

      for (let i = 0; i < fumos.length; i++) {
        fumos[i].updatePhysics(dt, elapsed);
      }
      resolveFumoToFumoCollisions();

      for (let i = 0; i < mikans.length; i++) {
        mikans[i].update(dt);
      }

      updateKotatsuBlanketCloth(dt, elapsed);

      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    function pauseRenderLoop() {
      if (isPaused) return;
      isPaused = true;
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    function resumeRenderLoop() {
      if (!isPaused) return;
      isPaused = false;
      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    }

    window.addEventListener('message', (e) => {
      const data = e.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'toggleMode') {
        toggleDayNight();
      } else if (data.type === 'pause') {
        pauseRenderLoop();
      } else if (data.type === 'resume') {
        resumeRenderLoop();
      }
    });

    window.onload = function () {
      let initialNight = true;
      try {
        const saved = localStorage.getItem(STORAGE_MODE_KEY);
        if (saved === 'day') initialNight = false;
        else if (saved === 'night') initialNight = true;
      } catch (e) {}

      setDayNightMode(initialNight, { immediate: true, playSound: false });
      updateDayNightTransition(0, 0);

      fumos.forEach((f, idx) => {
        setTimeout(() => {
          f.squash = 0.78;
          f.squashVel = 2.0;
          f.headPitchVel = 4.0;
        }, 120 + idx * 65);
      });

      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    };
  </script>
</body>

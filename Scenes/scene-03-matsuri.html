<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Touhou Fumo Summer Festival (Matsuri) — Interactive 3D Voxel Diorama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Three.js r128 + OrbitControls + Post-Processing (UnrealBloomPass) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background-color: #120d24;
      color: #1e293b;
    }
    .font-display {
      font-family: 'Fredoka', sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    /* HUD Layout Utilities (Zero external CSS library warnings) */
    .hud-top-right {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .hud-bottom-center {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      width: max-content;
      max-width: 95vw;
    }
    .glass-panel {
      background: rgba(255, 248, 238, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.68);
      box-shadow: 0 10px 28px -6px rgba(45, 20, 15, 0.22), 0 2px 6px rgba(45, 20, 15, 0.1);
      transition: background 0.5s ease, color 0.5s ease, border-color 0.5s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: #1e293b;
    }
    body.night-ui .glass-panel {
      background: rgba(24, 19, 44, 0.82);
      border-color: rgba(255, 165, 110, 0.28);
      color: #fff5eb;
      box-shadow: 0 10px 30px -6px rgba(0, 0, 0, 0.6), 0 0 18px rgba(255, 130, 80, 0.16);
    }
    .pill-panel {
      border-radius: 16px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      border: none;
      font-family: inherit;
    }
    .icon-btn {
      border-radius: 16px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ui-btn {
      cursor: pointer;
    }
    .ui-btn:hover {
      transform: translateY(-2px) scale(1.03);
    }
    .ui-btn:active {
      transform: translateY(1px) scale(0.97);
    }
    .firework-btn {
      background: linear-gradient(135deg, rgba(255, 107, 107, 0.94), rgba(255, 159, 67, 0.94)) !important;
      color: #ffffff !important;
      border: 1px solid rgba(255, 230, 190, 0.65) !important;
      box-shadow: 0 6px 20px rgba(255, 107, 107, 0.42);
    }
    body.night-ui .firework-btn {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.94), rgba(245, 158, 11, 0.94)) !important;
      box-shadow: 0 6px 24px rgba(244, 63, 94, 0.55), 0 0 16px rgba(251, 191, 36, 0.35);
    }
    .badge-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
      background: #f43f5e;
      flex-shrink: 0;
    }
    .badge-status {
      opacity: 0.72;
      margin-left: 4px;
    }
    #fumo-tooltip {
      position: fixed;
      z-index: 30;
      opacity: 0;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    kbd {
      font-family: 'Fredoka', sans-serif;
      display: inline-block;
      padding: 1px 6px;
      font-size: 11px;
      line-height: 1.2;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.10);
      border-bottom: 2px solid rgba(0, 0, 0, 0.20);
    }
    body.night-ui kbd {
      background: rgba(255, 255, 255, 0.14);
      border-bottom-color: rgba(255, 255, 255, 0.28);
    }
    .firework-btn kbd {
      background: rgba(255, 255, 255, 0.22);
      border-bottom-color: rgba(255, 255, 255, 0.35);
      color: #ffffff;
    }
    .hidden {
      display: none !important;
    }
    @media (max-width: 640px) {
      .hide-sm {
        display: none !important;
      }
    }
    @media (max-width: 900px) {
      .hide-md {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Top-Right Controls: Active Fumo Badge, Squeeze All, Reset, Sound (Top-Left kept completely clear for Hub) -->
  <div class="hud-top-right">
    <!-- Active / Hovered Fumo Indicator -->
    <div id="fumo-badge" class="glass-panel pill-panel hidden">
      <span id="fumo-badge-dot" class="badge-dot"></span>
      <span id="fumo-badge-name">Reimu Hakurei</span>
      <span id="fumo-badge-status" class="badge-status">Scooping Goldfish</span>
    </div>

    <!-- Squeeze All Button -->
    <button id="btn-squeeze-all" title="Squeeze All Fumos! (Space)" class="glass-panel pill-panel ui-btn">
      <span style="font-size: 15px; line-height: 1;">✨</span>
      <span class="hide-md">Squeeze All</span>
    </button>

    <!-- Reset Fumos Button -->
    <button id="btn-reset" title="Return Fumos to Festival Spots (R)" class="glass-panel pill-panel ui-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      <span class="hide-sm">Reset</span>
    </button>

    <!-- Sound Toggle Button -->
    <button id="btn-sound" title="Toggle Festival & Plush Sound Effects (M)" class="glass-panel icon-btn ui-btn">
      <svg id="icon-sound-on" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
      <svg id="icon-sound-off" class="hidden" style="opacity: 0.6;" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
    </button>
  </div>

  <!-- Floating Cursor Tooltip for Hovered Fumo / Water Tank -->
  <div id="fumo-tooltip" class="glass-panel">
    <span id="tooltip-emoji">🏮</span>
    <span id="tooltip-text">Reimu Fumo</span>
  </div>

  <!-- Bottom Center HUD: Fireworks Button & Concise Controls -->
  <div class="hud-bottom-center">
    <button id="btn-fireworks" title="Launch a Voxel Firework Shell! (F)" class="glass-panel pill-panel firework-btn ui-btn font-display">
      <span style="font-size: 16px; line-height: 1;">🎆</span>
      <span>Fireworks</span>
      <kbd class="hide-sm">F</kbd>
    </button>

    <div class="glass-panel pill-panel hide-sm" style="pointer-events: none; font-size: 12px; gap: 14px;">
      <span>🖱️ <b>Click Fumo:</b> Squeeze</span>
      <span>✋ <b>Drag:</b> Throw</span>
      <span>🐟 <b>Click Tank:</b> Ripple</span>
      <span class="hide-md"><kbd>Space</kbd> Squeeze All</span>
    </div>
  </div>

  <script>
    // ============================================================================
    // 1. PROCEDURAL WEB AUDIO SYNTHESIZER (Unlocked strictly on User Gesture)
    // ============================================================================
    class MatsuriSoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.unlocked = false;
      }

      // Called ONLY inside pointerdown / keydown user-gesture listeners
      unlock() {
        this.unlocked = true;
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      canPlay() {
        return this.enabled && this.unlocked && this.ctx && this.ctx.state === 'running';
      }

      playSqueeze(pitchMultiplier = 1.0) {
        if (!this.canPlay()) return;
        try {
          const now = this.ctx.currentTime;

          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sine';
          const baseFreq = (520 + Math.random() * 80) * pitchMultiplier;
          osc1.frequency.setValueAtTime(baseFreq, now);
          osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.48, now + 0.085);
          osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.15, now + 0.16);

          gain1.gain.setValueAtTime(0.001, now);
          gain1.gain.linearRampToValueAtTime(0.11, now + 0.025);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.17);

          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.18);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(baseFreq * 1.1, now + 0.11);
          osc2.frequency.exponentialRampToValueAtTime(baseFreq * 1.65, now + 0.21);

          gain2.gain.setValueAtTime(0.001, now + 0.11);
          gain2.gain.linearRampToValueAtTime(0.08, now + 0.13);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start(now + 0.11);
          osc2.stop(now + 0.25);
        } catch (e) {}
      }

      playBounce(intensity = 0.5) {
        if (!this.canPlay() || intensity < 0.08) return;
        try {
          const now = this.ctx.currentTime;
          const vol = Math.min(0.14, intensity * 0.12);

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const startFreq = 115 + Math.min(80, intensity * 35);
          osc.frequency.setValueAtTime(startFreq, now);
          osc.frequency.exponentialRampToValueAtTime(42, now + 0.09);

          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        } catch (e) {}
      }

      playPickup() {
        if (!this.canPlay()) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(440, now + 0.09);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.05, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        } catch (e) {}
      }

      playSplash(big = false) {
        if (!this.canPlay()) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(big ? 210 : 360, now);
          osc.frequency.exponentialRampToValueAtTime(big ? 580 : 720, now + (big ? 0.14 : 0.08));
          gain.gain.setValueAtTime(big ? 0.12 : 0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + (big ? 0.16 : 0.09));
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + (big ? 0.17 : 0.1));
        } catch (e) {}
      }

      playFireworkLaunch() {
        if (!this.canPlay()) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(340, now);
          osc.frequency.exponentialRampToValueAtTime(1180, now + 0.45);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.045, now + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.46);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.48);
        } catch (e) {}
      }

      playFireworkBurst() {
        if (!this.canPlay()) return;
        try {
          const now = this.ctx.currentTime;

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(32, now + 0.38);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.40);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.42);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(1420 + Math.random() * 400, now + 0.05);
          osc2.frequency.exponentialRampToValueAtTime(880, now + 0.28);
          gain2.gain.setValueAtTime(0.04, now + 0.05);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.30);
          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start(now + 0.05);
          osc2.stop(now + 0.32);
        } catch (e) {}
      }
    }

    const soundFX = new MatsuriSoundEngine();
    window.addEventListener('pointerdown', () => soundFX.unlock(), { passive: true });
    window.addEventListener('keydown', () => soundFX.unlock(), { passive: true });

    // ============================================================================
    // 2. COLOR & VOXEL HELPER UTILITIES
    // ============================================================================
    const tempColor = new THREE.Color();
    const tempMatrix = new THREE.Matrix4();
    const tempPos = new THREE.Vector3();
    const tempQuat = new THREE.Quaternion();
    const tempScale = new THREE.Vector3();
    const tempEuler = new THREE.Euler();

    function voxelHash(x, y, z) {
      let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
      return n - Math.floor(n);
    }

    function varyColor(hexOrString, x, y, z, variance = 0.035, seamDarken = 0) {
      tempColor.set(hexOrString);
      const h = voxelHash(x, y, z);
      const delta = (h - 0.5) * 2 * variance - seamDarken;
      tempColor.offsetHSL(0, (h - 0.5) * 0.03, delta);
      return tempColor.clone();
    }

    function createSoftVoxelGeometry(size = 1) {
      const s = size * 0.985;
      return new THREE.BoxGeometry(s, s, s);
    }

    // Helper that ALWAYS populates instanceColor so Three.js r128 never hits null instanceColor
    function createColoredInstancedMesh(geom, material, count, defaultHex = '#ffffff', castShadow = false, receiveShadow = false) {
      const mesh = new THREE.InstancedMesh(geom, material, count);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = receiveShadow;
      const col = new THREE.Color(defaultHex);
      tempMatrix.identity();
      for (let i = 0; i < count; i++) {
        mesh.setMatrixAt(i, tempMatrix);
        mesh.setColorAt(i, col);
      }
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      return mesh;
    }

    function buildVoxelInstancedMesh(voxels, unitSize, material, castShadow = true, receiveShadow = true) {
      if (!voxels || voxels.length === 0) return null;
      const geom = createSoftVoxelGeometry(unitSize);
      const mesh = new THREE.InstancedMesh(geom, material, voxels.length);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = receiveShadow;

      for (let i = 0; i < voxels.length; i++) {
        const v = voxels[i];
        tempPos.set(v.x * unitSize, v.y * unitSize, v.z * unitSize);
        if (v.rx || v.ry || v.rz) {
          tempEuler.set(v.rx || 0, v.ry || 0, v.rz || 0);
          tempQuat.setFromEuler(tempEuler);
        } else {
          tempQuat.identity();
        }
        tempScale.set(v.sx || 1, v.sy || 1, v.sz || 1);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        mesh.setMatrixAt(i, tempMatrix);
        mesh.setColorAt(i, v.color instanceof THREE.Color ? v.color : new THREE.Color(v.color));
      }
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      return mesh;
    }

    // ============================================================================
    // 3. SCENE, CAMERA, RENDERER & POST-PROCESSING SETUP
    // ============================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#f7a361');
    scene.fog = new THREE.FogExp2('#f7a361', 0.0072);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.5, 140);
    camera.position.set(18.5, 12.8, 22.0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    let composer = null;
    let bloomPass = null;
    try {
      const renderPass = new THREE.RenderPass(scene, camera);
      bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.18,
        0.55,
        0.82
      );
      composer = new THREE.EffectComposer(renderer);
      composer.addPass(renderPass);
      composer.addPass(bloomPass);
    } catch (err) {
      composer = null;
    }

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(-0.5, 3.2, 0.5);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI * 0.475;
    controls.minPolarAngle = Math.PI * 0.06;
    controls.minDistance = 9;
    controls.maxDistance = 42;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 0.42;

    let lastUserInteractionTime = performance.now();
    const recordInteraction = () => {
      lastUserInteractionTime = performance.now();
      controls.autoRotate = false;
    };
    controls.addEventListener('start', recordInteraction);

    // ============================================================================
    // 4. LIGHTING SYSTEM (Capped Dynamic Lights; Lanterns Use Emissive + Bloom)
    // ============================================================================
    const hemiLight = new THREE.HemisphereLight(0xffd6a5, 0x8d6e63, 0.72);
    hemiLight.position.set(0, 25, 0);
    scene.add(hemiLight);

    const mainDirLight = new THREE.DirectionalLight(0xffb76b, 1.35);
    mainDirLight.position.set(-22, 11.5, 14);
    mainDirLight.target.position.set(0, 1, 0);
    scene.add(mainDirLight.target);
    mainDirLight.castShadow = true;
    mainDirLight.shadow.mapSize.width = 2048;
    mainDirLight.shadow.mapSize.height = 2048;
    mainDirLight.shadow.camera.near = 2;
    mainDirLight.shadow.camera.far = 52;
    const dCam = 16.5;
    mainDirLight.shadow.camera.left = -dCam;
    mainDirLight.shadow.camera.right = dCam;
    mainDirLight.shadow.camera.top = dCam;
    mainDirLight.shadow.camera.bottom = -dCam;
    mainDirLight.shadow.bias = -0.0006;
    mainDirLight.shadow.radius = 2.2;
    scene.add(mainDirLight);

    const yaguraLight = new THREE.PointLight(0xff9e44, 0.08, 22, 1.5);
    yaguraLight.position.set(0.0, 6.8, 0.5);
    yaguraLight.castShadow = true;
    yaguraLight.shadow.mapSize.width = 1024;
    yaguraLight.shadow.mapSize.height = 1024;
    yaguraLight.shadow.bias = -0.001;
    scene.add(yaguraLight);

    const yataiStallLight = new THREE.PointLight(0xffaa4c, 0.05, 19, 1.5);
    yataiStallLight.position.set(-2.5, 4.2, -5.2);
    scene.add(yataiStallLight);

    const streamGlowLight = new THREE.PointLight(0xff8c42, 0.05, 14, 1.6);
    streamGlowLight.position.set(9.2, 2.2, 1.5);
    scene.add(streamGlowLight);

    const fireworkLight = new THREE.PointLight(0xffffff, 0.0, 48, 1.2);
    fireworkLight.position.set(0, 14, -4);
    scene.add(fireworkLight);

    // Shared Materials
    const plushMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.92,
      metalness: 0.02
    });

    const solidWorldMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.84,
      metalness: 0.05
    });

    const glossyWorldMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.24,
      metalness: 0.14
    });

    const translucentWaterMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.78,
      roughness: 0.12,
      metalness: 0.05,
      transmission: 0.38,
      emissive: new THREE.Color(0x0284c7),
      emissiveIntensity: 0.18
    });

    const crystalWingMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.2,
      metalness: 0.1,
      emissive: new THREE.Color(0xffffff),
      emissiveIntensity: 0.35
    });

    const lanternRedEmissiveMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: new THREE.Color(0xff4d29),
      emissiveIntensity: 0.06,
      roughness: 0.45
    });

    const lanternWhiteEmissiveMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: new THREE.Color(0xffb74d),
      emissiveIntensity: 0.08,
      roughness: 0.4
    });

    const stallSignEmissiveMat = new THREE.MeshStandardMaterial({

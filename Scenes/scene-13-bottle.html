      starMesh.setMatrixAt(i, tempMatrix);
    }
    scene.add(starMesh);

    // Occasional Shooting Star at Night
    const shootingStarMat = new THREE.MeshBasicMaterial({ color: 0xe0f2fe, transparent: true, opacity: 0 });
    const shootingStarMesh = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.08, 0.08), shootingStarMat);
    scene.add(shootingStarMesh);
    const shootingStar = { active: false, timer: 2.5, t: 0, start: new THREE.Vector3(), dir: new THREE.Vector3() };

    // 10D. Rotating Volumetric Lighthouse Beam (Visible at Night!)
    const lighthouseBeamPivot = new THREE.Group();
    lighthouseBeamPivot.position.set(-8.5, 7.6, -7.5);
    scene.add(lighthouseBeamPivot);

    const beamGeom = new THREE.ConeGeometry(2.2, 22, 16, 1, true);
    beamGeom.translate(0, -11, 0);
    beamGeom.rotateX(-Math.PI / 2);
    const beamMat = new THREE.MeshBasicMaterial({
      color: 0xfef08a,
      transparent: true,
      opacity: 0.0,
      side: THREE.DoubleSide,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const beamMesh = new THREE.Mesh(beamGeom, beamMat);
    lighthouseBeamPivot.add(beamMesh);

    // ============================================================================
    // 11. PARTICLE SYSTEMS: FROST SPARKLES, WATER DRIPS, SPLASHES, SAND PUFFS & RINGS
    // ============================================================================
    // 11A. Continuous Frost Sparkles Drifting Off Cirno's Bottle
    const FROST_COUNT = 55;
    const frostData = [];
    const frostGeom = new THREE.BoxGeometry(0.075, 0.075, 0.075);
    const frostMat = new THREE.MeshBasicMaterial({ color: 0xe0f2fe, transparent: true, opacity: 0.85 });
    const frostMesh = new THREE.InstancedMesh(frostGeom, frostMat, FROST_COUNT);
    for (let i = 0; i < FROST_COUNT; i++) {
      frostData.push({
        ox: (Math.random() - 0.5) * 1.4,
        oy: Math.random() * 1.9,
        oz: (Math.random() - 0.5) * 1.4,
        speed: 0.35 + Math.random() * 0.45,
        phase: Math.random() * Math.PI * 2
      });
    }
    scene.add(frostMesh);

    function updateFrostSparkles(time, dt) {
      for (let i = 0; i < FROST_COUNT; i++) {
        const f = frostData[i];
        f.oy += f.speed * dt;
        if (f.oy > 2.2) f.oy = 0.1;
        const wx = cirnoBottle.pos.x + f.ox + Math.sin(time * 2.4 + f.phase) * 0.15;
        const wy = cirnoBottle.pos.y + f.oy;
        const wz = cirnoBottle.pos.z + f.oz + Math.cos(time * 2.1 + f.phase) * 0.15;
        const s = (1.0 - f.oy / 2.2) * (0.6 + 0.4 * Math.sin(time * 5.0 + f.phase));
        tempPos.set(wx, wy, wz);
        tempQuat.setFromEuler(tempEuler.set(time * 2, time * 3, 0));
        tempScale.set(s, s, s);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        frostMesh.setMatrixAt(i, tempMatrix);
      }
      frostMesh.instanceMatrix.needsUpdate = true;
      cirnoBottleLight.position.set(cirnoBottle.pos.x, cirnoBottle.pos.y + 0.9, cirnoBottle.pos.z);
    }

    // 11B. Burst Particles (Water Splashes, Sand Puffs, Ice Sparkles, Boat Wake & Drips)
    const PARTICLE_MAX = 140;
    const particles = [];
    const partGeom = new THREE.BoxGeometry(0.11, 0.11, 0.11);
    const partMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const partMesh = new THREE.InstancedMesh(partGeom, partMat, PARTICLE_MAX);
    for (let i = 0; i < PARTICLE_MAX; i++) {
      particles.push({
        active: false,
        pos: new THREE.Vector3(),
        vel: new THREE.Vector3(),
        life: 0,
        maxLife: 1,
        gravity: 9.8,
        color: new THREE.Color('#ffffff')
      });
      tempMatrix.makeScale(0, 0, 0);
      partMesh.setMatrixAt(i, tempMatrix);
    }
    scene.add(partMesh);

    function spawnBurstParticles(origin, type, count = 14, accentHex = '#38bdf8') {
      let spawned = 0;
      for (let i = 0; i < PARTICLE_MAX && spawned < count; i++) {
        const p = particles[i];
        if (!p.active) {
          p.active = true;
          p.life = 0;
          p.maxLife = 0.45 + Math.random() * 0.35;
          p.pos.copy(origin).add(new THREE.Vector3((Math.random() - 0.5) * 0.4, 0.35, (Math.random() - 0.5) * 0.4));
          const ang = (spawned / count) * Math.PI * 2 + Math.random() * 0.4;
          const spd = 1.6 + Math.random() * 2.4;
          p.vel.set(Math.cos(ang) * spd, 2.2 + Math.random() * 2.6, Math.sin(ang) * spd);
          p.gravity = type === 'ice' ? 4.5 : 11.5;

          if (type === 'sand') {
            p.color.set(spawned % 2 === 0 ? '#ebd098' : '#d4b475');
          } else if (type === 'splash') {
            p.color.set(spawned % 2 === 0 ? '#ffffff' : '#7dd3fc');
          } else {
            const cols = [accentHex, '#e0f2fe', '#ffffff', '#fde047'];
            p.color.set(cols[spawned % cols.length]);
          }
          partMesh.setColorAt(i, p.color);
          spawned++;
        }
      }
      if (partMesh.instanceColor) partMesh.instanceColor.needsUpdate = true;
    }

    function spawnWaterDrip(origin) {
      for (let i = 0; i < PARTICLE_MAX; i++) {
        const p = particles[i];
        if (!p.active) {
          p.active = true;
          p.life = 0;
          p.maxLife = 0.55;
          p.pos.set(origin.x + (Math.random() - 0.5) * 0.65, origin.y + 0.1, origin.z + (Math.random() - 0.5) * 0.65);
          p.vel.set((Math.random() - 0.5) * 0.4, -0.8, (Math.random() - 0.5) * 0.4);
          p.gravity = 14.0;
          p.color.set('#bae6fd');
          partMesh.setColorAt(i, p.color);
          if (partMesh.instanceColor) partMesh.instanceColor.needsUpdate = true;
          break;
        }
      }
    }

    function spawnWakeParticle(x, y, z) {
      for (let i = 0; i < PARTICLE_MAX; i++) {
        const p = particles[i];
        if (!p.active) {
          p.active = true;
          p.life = 0;
          p.maxLife = 0.65;
          p.pos.set(x + (Math.random() - 0.5) * 0.25, y, z + (Math.random() - 0.5) * 0.25);
          p.vel.set((Math.random() - 0.5) * 0.5, 0.3, (Math.random() - 0.5) * 0.5);
          p.gravity = 1.2;
          p.color.set('#ffffff');
          partMesh.setColorAt(i, p.color);
          if (partMesh.instanceColor) partMesh.instanceColor.needsUpdate = true;
          break;
        }
      }
    }

    // Expanding Water Splash Rings
    const splashRings = [];
    const ringGeom = new THREE.RingGeometry(0.35, 0.52, 24);
    ringGeom.rotateX(-Math.PI / 2);
    for (let r = 0; r < 6; r++) {
      const rMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, side: THREE.DoubleSide });
      const rMesh = new THREE.Mesh(ringGeom, rMat);
      rMesh.visible = false;
      scene.add(rMesh);
      splashRings.push({ mesh: rMesh, mat: rMat, active: false, life: 0, maxScale: 2.0 });
    }

    function spawnSplashRing(x, z, scale = 1.4) {
      for (let i = 0; i < splashRings.length; i++) {
        const sr = splashRings[i];
        if (!sr.active) {
          sr.active = true;
          sr.life = 0;
          sr.maxScale = scale;
          sr.mesh.position.set(x, 0.16, z);
          sr.mesh.visible = true;
          break;
        }
      }
    }

    function updateParticlesAndRings(dt, time) {
      let dirty = false;
      for (let i = 0; i < PARTICLE_MAX; i++) {
        const p = particles[i];
        if (!p.active) continue;
        dirty = true;
        p.life += dt;
        if (p.life >= p.maxLife) {
          p.active = false;
          tempMatrix.makeScale(0, 0, 0);
          partMesh.setMatrixAt(i, tempMatrix);
          continue;
        }
        p.vel.y -= p.gravity * dt;
        p.pos.addScaledVector(p.vel, dt);
        const s = 1.0 - (p.life / p.maxLife);
        tempQuat.setFromEuler(tempEuler.set(p.life * 6, p.life * 5, 0));
        tempScale.set(s, s, s);
        tempMatrix.compose(p.pos, tempQuat, tempScale);
        partMesh.setMatrixAt(i, tempMatrix);
      }
      if (dirty) partMesh.instanceMatrix.needsUpdate = true;

      for (let i = 0; i < splashRings.length; i++) {
        const sr = splashRings[i];
        if (!sr.active) continue;
        sr.life += dt * 1.65;
        if (sr.life >= 1.0) {
          sr.active = false;
          sr.mesh.visible = false;
          continue;
        }
        const s = 0.4 + sr.life * sr.maxScale;
        sr.mesh.scale.set(s, 1, s);
        const wInfo = getWaveInfo(sr.mesh.position.x, sr.mesh.position.z, time);
        sr.mesh.position.y = wInfo.height + 0.04;
        sr.mat.opacity = (1.0 - sr.life) * 0.75;
      }
    }

    // ============================================================================
    // 12. POINTER INTERACTION: CLICK TO SQUEEZE, DRAG TO LIFT & THROW
    // ============================================================================
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    const dragPlane = new THREE.Plane();
    const dragHitPoint = new THREE.Vector3();
    const dragOffset = new THREE.Vector3();

    let hoveredTarget = null;
    let selectedTarget = null;
    let isDraggingTarget = false;
    let pointerDownScreen = new THREE.Vector2();
    let dragHistory = [];

    const tooltipEl = document.getElementById('fumo-tooltip');
    const tooltipEmojiEl = document.getElementById('tooltip-emoji');
    const tooltipTextEl = document.getElementById('tooltip-text');
    const badgeEl = document.getElementById('fumo-badge');
    const badgeDotEl = document.getElementById('fumo-badge-dot');
    const badgeNameEl = document.getElementById('fumo-badge-name');
    const badgeStatusEl = document.getElementById('fumo-badge-status');

    function updatePointerNDC(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function pickInteractiveTarget() {
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(allInteractiveMeshes, false);
      if (hits.length > 0 && hits[0].object.userData.fumo) {
        return { target: hits[0].object.userData.fumo, point: hits[0].point };
      }
      return null;
    }

    function updateUIBadge(target, statusText) {
      if (!target) {
        badgeEl.classList.add('hidden');
        badgeEl.classList.remove('flex');
        return;
      }
      badgeEl.classList.remove('hidden');
      badgeEl.classList.add('flex');
      badgeDotEl.style.backgroundColor = target.accentColor || '#38bdf8';
      badgeNameEl.textContent = target.name;
      badgeStatusEl.textContent = statusText;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      recordInteraction();
      updatePointerNDC(e);
      pointerDownScreen.set(e.clientX, e.clientY);

      const hit = pickInteractiveTarget();
      if (hit) {
        selectedTarget = hit.target;
        isDraggingTarget = false;
        controls.enabled = false;

        if (selectedTarget instanceof VoxelFumo) {
          const camDir = new THREE.Vector3();
          camera.getWorldDirection(camDir);
          dragPlane.setFromNormalAndCoplanarPoint(camDir.negate(), selectedTarget.pos);
          if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
            dragOffset.subVectors(selectedTarget.pos, dragHitPoint);
          } else {
            dragOffset.set(0, 0, 0);
          }
          dragHistory = [{ pos: selectedTarget.pos.clone(), time: performance.now() }];
        }
        updateUIBadge(selectedTarget, 'Selected');
      }
    });

    window.addEventListener('pointermove', (e) => {
      updatePointerNDC(e);

      if (selectedTarget && (selectedTarget instanceof VoxelFumo)) {
        recordInteraction();
        const moveDist = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);

        if (!isDraggingTarget && moveDist > 6) {
          isDraggingTarget = true;
          selectedTarget.isDragged = true;
          selectedTarget.isGrounded = false;
          selectedTarget.isInWater = false;
          selectedTarget.squashVel += 3.0;
          soundFX.playPickup();
          updateUIBadge(selectedTarget, 'Dragging — Release to Toss!');
        }

        if (isDraggingTarget) {
          raycaster.setFromCamera(pointerNDC, camera);
          if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
            const targetPos = dragHitPoint.clone().add(dragOffset);
            targetPos.x = THREE.MathUtils.clamp(targetPos.x, -9.2, 9.5);
            targetPos.y = THREE.MathUtils.clamp(targetPos.y, 0.35, 9.5);
            targetPos.z = THREE.MathUtils.clamp(targetPos.z, -8.8, 8.8);

            const prevPos = selectedTarget.pos.clone();
            selectedTarget.pos.lerp(targetPos, 0.55);

            const deltaMove = selectedTarget.pos.clone().sub(prevPos);
            selectedTarget.headRollVel -= deltaMove.x * 16.0;
            selectedTarget.headPitchVel += deltaMove.z * 16.0 - deltaMove.y * 10.0;
            selectedTarget.limbRollVel -= deltaMove.x * 22.0;
            selectedTarget.roll = THREE.MathUtils.lerp(selectedTarget.roll, THREE.MathUtils.clamp(-deltaMove.x * 1.4, -0.48, 0.48), 0.3);
            selectedTarget.pitch = THREE.MathUtils.lerp(selectedTarget.pitch, THREE.MathUtils.clamp(deltaMove.z * 1.4, -0.48, 0.48), 0.3);

            const now = performance.now();
            dragHistory.push({ pos: selectedTarget.pos.clone(), time: now });
            while (dragHistory.length > 6) dragHistory.shift();
          }
          tooltipEl.style.opacity = '0';
          renderer.domElement.style.cursor = 'grabbing';
          return;
        }
      }

      const hit = pickInteractiveTarget();
      if (hit) {
        hoveredTarget = hit.target;
        renderer.domElement.style.cursor = 'grab';
        tooltipEmojiEl.textContent = hoveredTarget.emoji;
        tooltipTextEl.textContent = hoveredTarget.name;
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = `${e.clientX + 14}px`;
        tooltipEl.style.top = `${e.clientY - 18}px`;
      } else {
        hoveredTarget = null;
        renderer.domElement.style.cursor = 'default';
        tooltipEl.style.opacity = '0';
      }
    });

    window.addEventListener('pointerup', () => {
      if (!selectedTarget) return;
      controls.enabled = true;
      recordInteraction();

      if (!isDraggingTarget) {
        selectedTarget.squeeze(1.0);
        updateUIBadge(selectedTarget, 'Squeezed! ᗜˬᗜ');
      } else if (selectedTarget instanceof VoxelFumo) {
        selectedTarget.isDragged = false;
        const now = performance.now();
        while (dragHistory.length > 1 && now - dragHistory[0].time > 140) {
          dragHistory.shift();
        }
        if (dragHistory.length >= 2) {
          const first = dragHistory[0];
          const last = dragHistory[dragHistory.length - 1];
          const dtSec = Math.max(0.016, (last.time - first.time) / 1000);
          const throwVel = last.pos.clone().sub(first.pos).divideScalar(dtSec);
          if (throwVel.length() > 20) throwVel.setLength(20);
          selectedTarget.vel.copy(throwVel);

          const speed = throwVel.length();
          selectedTarget.angVel.set(
            throwVel.z * 0.6 + (Math.random() - 0.5) * speed * 0.35,
            (Math.random() - 0.5) * speed * 0.45,
            -throwVel.x * 0.6 + (Math.random() - 0.5) * speed * 0.35
          );
        } else {
          selectedTarget.vel.set(0, 0, 0);
        }
        updateUIBadge(selectedTarget, 'Tossed!');
      }

      selectedTarget = null;
      isDraggingTarget = false;
      renderer.domElement.style.cursor = hoveredTarget ? 'grab' : 'default';
    });

    // ============================================================================
    // 13. DAY / NIGHT SMOOTH INTERPOLATION (~2 SECONDS) & HUB INTEGRATION
    // ============================================================================
    const STORAGE_MODE_KEY = 'voxel_cirno_beach_mode';
    let isNightMode = false;
    let dayNightProgress = 0.0; // 0.0 = Day, 1.0 = Night
    let dayNightTarget = 0.0;

    const daySkyCol = new THREE.Color('#7dd3fc');
    const nightSkyCol = new THREE.Color('#070b19');

    const daySunCol = new THREE.Color('#fff2cc');
    const nightMoonCol = new THREE.Color('#93c5fd');

    const dayHemiSky = new THREE.Color('#fff9eb');
    const nightHemiSky = new THREE.Color('#1e293b');
    const dayHemiGround = new THREE.Color('#38bdf8');
    const nightHemiGround = new THREE.Color('#090d16');

    const dayOrbCol = new THREE.Color('#fef08a');
    const nightOrbCol = new THREE.Color('#e0f2fe');

    const dayCloudCol = new THREE.Color('#ffffff');
    const nightCloudCol = new THREE.Color('#334155');

    function notifyParentMode() {
      const modeStr = isNightMode ? 'night' : 'day';
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'modeChanged', mode: modeStr }, '*');
        }
      } catch (e) {}
    }

    function setDayNightMode(night, { immediate = false, playSound = true } = {}) {
      isNightMode = Boolean(night);
      dayNightTarget = isNightMode ? 1.0 : 0.0;
      if (immediate) {
        dayNightProgress = dayNightTarget;
      }
      document.body.classList.toggle('night-ui', isNightMode);

      try {
        localStorage.setItem(STORAGE_MODE_KEY, isNightMode ? 'night' : 'day');
      } catch (e) {}

      if (playSound) {
        soundFX.playPickup();
      }
      notifyParentMode();
    }

    function toggleDayNight() {
      setDayNightMode(!isNightMode, { immediate: false, playSound: true });
    }

    function updateDayNightTransition(dt, time) {
      if (Math.abs(dayNightProgress - dayNightTarget) > 0.0005) {
        const step = dt * 0.52; // ~2 seconds transition
        if (dayNightProgress < dayNightTarget) {
          dayNightProgress = Math.min(dayNightTarget, dayNightProgress + step);
        } else {
          dayNightProgress = Math.max(dayNightTarget, dayNightProgress - step);
        }
      }

      const t = dayNightProgress < 0.5
        ? 4 * dayNightProgress * dayNightProgress * dayNightProgress
        : 1 - Math.pow(-2 * dayNightProgress + 2, 3) / 2;

      // 1. Sky & Fog
      scene.background.lerpColors(daySkyCol, nightSkyCol, t);
      scene.fog.color.copy(scene.background);

      // 2. Sun / Moon Light & Horizon Orb
      sunDirLight.color.lerpColors(daySunCol, nightMoonCol, t);
      sunDirLight.intensity = THREE.MathUtils.lerp(1.32, 0.42, t);
      celestialMat.color.lerpColors(dayOrbCol, nightOrbCol, t);
      cloudMat.color.lerpColors(dayCloudCol, nightCloudCol, t);

      // 3. Hemisphere Bounce Light
      hemiLight.color.lerpColors(dayHemiSky, nightHemiSky, t);
      hemiLight.groundColor.lerpColors(dayHemiGround, nightHemiGround, t);
      hemiLight.intensity = THREE.MathUtils.lerp(0.72, 0.24, t);

      // 4. Night Point Lights (Pier Lantern, Campfire Flicker, Cirno Bottle Cold Glow)
      pierLanternLight.intensity = THREE.MathUtils.lerp(0.05, 1.55, t);
      const fireFlicker = 0.85 + 0.3 * Math.sin(time * 11.0) * Math.cos(time * 7.3);
      campfireLight.intensity = THREE.MathUtils.lerp(0.05, 1.35 * fireFlicker, t);
      cirnoBottleLight.intensity = THREE.MathUtils.lerp(0.12, 1.25, t);

      // 5. Emissive Materials, Stars, Lighthouse Beam & Bloom
      warmEmissiveMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.3, 2.4, t);
      translucentIceMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.25, 1.15, t);
      bottleGlassMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.05, 0.38, t);
      waterMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.06, 0.24, t);

      starMat.opacity = THREE.MathUtils.lerp(0.0, 0.92, t);
      beamMat.opacity = THREE.MathUtils.lerp(0.0, 0.16, t);

      if (bloomPass) {
        bloomPass.strength = THREE.MathUtils.lerp(0.18, 0.72, t);
        bloomPass.threshold = THREE.MathUtils.lerp(0.84, 0.58, t);
      }

      // 6. Rotating Lighthouse Beam & Occasional Night Shooting Stars
      lighthouseBeamPivot.rotation.y = time * 0.65;

      if (t > 0.6) {
        shootingStar.timer -= dt;
        if (!shootingStar.active && shootingStar.timer <= 0) {
          shootingStar.active = true;
          shootingStar.t = 0;
          shootingStar.timer = 4.0 + Math.random() * 5.0;
          shootingStar.start.set(-10 + Math.random() * 20, 16 + Math.random() * 6, -24 - Math.random() * 8);
          shootingStar.dir.set(14, -7, 4);
        }
        if (shootingStar.active) {
          shootingStar.t += dt * 1.8;
          if (shootingStar.t >= 1.0) {
            shootingStar.active = false;
            shootingStarMat.opacity = 0;
          } else {
            shootingStarMesh.position.copy(shootingStar.start).addScaledVector(shootingStar.dir, shootingStar.t);
            shootingStarMesh.rotation.z = -0.45;
            shootingStarMat.opacity = Math.sin(shootingStar.t * Math.PI) * 0.95;
          }
        }
      } else {
        shootingStarMat.opacity = 0;
      }

      return t;
    }

    // ============================================================================
    // 14. UI BUTTONS, KEYBOARD CONTROLS & HUB MESSAGE HANDLERS
    // ============================================================================
    document.getElementById('btn-squeeze-all').addEventListener('click', () => {
      fumos.forEach((f, idx) => setTimeout(() => f.squeeze(1.05), idx * 65));
      crabs[0].squeeze();
    });

    document.getElementById('btn-wave-surge').addEventListener('click', () => {
      waveSurgeBoost = 0.85;
      soundFX.playSplash(0.85);
      spawnSplashRing(cirnoBottle.pos.x, cirnoBottle.pos.z, 2.2);
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      fumos.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 60));
      boatState.pos.copy(boatState.homePos);
      boatState.yaw = 2.3;
      boatState.speed = 0;
      updateUIBadge(null, '');
    });

    const btnSound = document.getElementById('btn-sound');
    const iconSoundOn = document.getElementById('icon-sound-on');
    const iconSoundOff = document.getElementById('icon-sound-off');
    btnSound.addEventListener('click', () => {
      soundFX.enabled = !soundFX.enabled;
      iconSoundOn.classList.toggle('hidden', !soundFX.enabled);
      iconSoundOff.classList.toggle('hidden', soundFX.enabled);
      if (soundFX.enabled) soundFX.playPickup();
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      const key = e.key.toLowerCase();

      if (key === 'n') {
        e.preventDefault();
        toggleDayNight();
      } else if (key === 'r') {
        document.getElementById('btn-reset').click();
      } else if (key === ' ') {
        e.preventDefault();
        document.getElementById('btn-squeeze-all').click();
      } else if (key === 'm') {
        btnSound.click();
      } else if (key === 'arrowup' || key === 'w') {
        boatState.keys.up = true;
      } else if (key === 'arrowdown' || key === 's') {
        boatState.keys.down = true;
      } else if (key === 'arrowleft' || key === 'a') {
        boatState.keys.left = true;
      } else if (key === 'arrowright' || key === 'd') {
        boatState.keys.right = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'arrowup' || key === 'w') boatState.keys.up = false;
      if (key === 'arrowdown' || key === 's') boatState.keys.down = false;
      if (key === 'arrowleft' || key === 'a') boatState.keys.left = false;
      if (key === 'arrowright' || key === 'd') boatState.keys.right = false;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================================
    // 15. MAIN ANIMATION LOOP, PAUSE / RESUME & HUB INTEGRATION
    // ============================================================================
    let prevTime = performance.now();
    let isPaused = false;
    let rafId = null;

    function animate(now) {
      if (isPaused) return;
      rafId = requestAnimationFrame(animate);

      const dt = Math.min(0.033, Math.max(0.001, (now - prevTime) / 1000));
      prevTime = now;
      const elapsed = now * 0.001;

      if (!selectedTarget && (now - lastUserInteractionTime > 4500)) {
        controls.autoRotate = true;
      }

      // Decay wave surge boost smoothly
      if (waveSurgeBoost > 0.001) {
        waveSurgeBoost *= Math.pow(0.45, dt);
      } else {
        waveSurgeBoost = 0;
      }

      controls.update();
      const nightMix = updateDayNightTransition(dt, elapsed);

      // Drift voxel clouds slowly across the horizon
      for (let i = 0; i < clouds.length; i++) {
        const c = clouds[i];
        c.group.position.x += c.speed * dt;
        if (c.group.position.x > 22) c.group.position.x = -22;
      }

      updateOceanWaves(elapsed, nightMix);
      updatePalmFrondsAndWetSand(elapsed);
      updateSailboat(dt, elapsed);
      updateAmbientLife(elapsed);

      for (let i = 0; i < fumos.length; i++) {
        fumos[i].updatePhysics(dt, elapsed);
      }

      updateFrostSparkles(elapsed, dt);
      updateParticlesAndRings(dt, elapsed);

      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    function pauseRenderLoop() {
      if (isPaused) return;
      isPaused = true;
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    function resumeRenderLoop() {
      if (!isPaused) return;
      isPaused = false;
      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    }

    // Lifecycle management: Day/Night sync, pause/resume on tab visibility, and WebGL resource cleanup on destroy
    const _sceneLifecycle = new FumoSceneLifecycle({
      renderer,
      scene,
      composer: typeof composer !== 'undefined' ? composer : null,
      audio: typeof soundFX !== 'undefined' ? soundFX : (typeof audio !== 'undefined' ? audio : null),
      onToggleMode: typeof toggleDayNight === 'function' ? toggleDayNight : null,
      onSetMode: (mode) => {
        if (typeof setDayNightMode === 'function') {
          setDayNightMode(mode === 'night', { immediate: false });
        } else if (typeof toggleDayNight === 'function') {
          const isNight = document.body.classList.contains('night-ui');
          if (isNight !== (mode === 'night')) toggleDayNight();
        }
      },
      onPause: typeof pauseRenderLoop === 'function' ? pauseRenderLoop : (typeof pauseScene === 'function' ? pauseScene : null),
      onResume: typeof resumeRenderLoop === 'function' ? resumeRenderLoop : (typeof resumeScene === 'function' ? resumeScene : null)
    });

    window.onload = function () {
      let initialNight = false;
      try {
        const saved = localStorage.getItem(STORAGE_MODE_KEY);
        if (saved === 'night') initialNight = true;
      } catch (e) {}

      setDayNightMode(initialNight, { immediate: true, playSound: false });
      updateDayNightTransition(0, 0);

      // Welcoming gentle splash & squish on load
      setTimeout(() => {
        cirnoBottle.squash = 0.78;
        cirnoBottle.squashVel = 2.2;
        spawnSplashRing(cirnoBottle.pos.x, cirnoBottle.pos.z, 1.5);
      }, 180);

      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    };
  </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Gensokyo Fumo Kart GP — Voxel Arcade Diorama</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Three.js r128 + OrbitControls + Post-Processing (UnrealBloomPass) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background-color: #121324;
    }
    .font-display {
      font-family: 'Fredoka', sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 10px 28px -6px rgba(20, 15, 45, 0.22), 0 2px 6px rgba(20, 15, 45, 0.1);
      color: #1e293b;
      transition: background 0.5s ease, color 0.5s ease, border-color 0.5s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    body.night-ui .glass-panel {
      background: rgba(20, 22, 44, 0.82);
      border-color: rgba(145, 135, 235, 0.3);
      color: #f3f0ff;
      box-shadow: 0 10px 30px -6px rgba(0, 0, 0, 0.6), 0 0 18px rgba(120, 110, 255, 0.18);
    }
    .ui-btn {
      cursor: pointer;
    }
    .ui-btn:hover {
      transform: translateY(-2px) scale(1.03);
    }
    .ui-btn:active {
      transform: translateY(1px) scale(0.97);
    }
    #fumo-tooltip {
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    kbd {
      font-family: 'Fredoka', sans-serif;
      display: inline-block;
      padding: 1px 6px;
      font-size: 0.72rem;
      line-height: 1.25;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.09);
      border-bottom: 2px solid rgba(0, 0, 0, 0.2);
    }
    body.night-ui kbd {
      background: rgba(255, 255, 255, 0.15);
      border-bottom-color: rgba(255, 255, 255, 0.3);
    }
    @keyframes pulsePop {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .item-ready {
      animation: pulsePop 1.1s infinite ease-in-out;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Top-Right Banner: Race Event Status & Podium Banner (Top-Left kept strictly empty for Hub) -->
  <div class="fixed top-4 right-4 z-20 flex flex-col items-end gap-2 pointer-events-none">
    <div id="race-banner" class="glass-panel rounded-2xl px-4 py-2 text-xs sm:text-sm font-semibold flex items-center gap-2.5 pointer-events-auto">
      <span id="banner-icon" class="text-lg leading-none">🏁</span>
      <span id="banner-text" class="font-display tracking-wide">Gensokyo Fumo GP — Drive with Arrow Keys!</span>
    </div>

    <div id="podium-panel" class="glass-panel rounded-2xl px-5 py-3.5 hidden flex-col items-center gap-2 pointer-events-auto text-center">
      <div class="text-xs uppercase tracking-widest opacity-75 font-bold">🏆 Race Complete! Final Podium 🏆</div>
      <div id="podium-results" class="font-display text-sm sm:text-base font-bold flex items-center gap-3"></div>
      <button id="btn-play-again" class="ui-btn mt-1 px-4 py-1.5 rounded-xl bg-rose-500 text-white font-display text-xs sm:text-sm shadow-md">
        Race Again (R)
      </button>
    </div>
  </div>

  <!-- Floating Tooltip for Hovered Fumo / Kart -->
  <div id="fumo-tooltip" class="fixed z-30 opacity-0 px-3 py-1.5 rounded-xl glass-panel text-xs font-semibold flex items-center gap-2 shadow-lg">
    <span id="tooltip-emoji">🏎️</span>
    <span id="tooltip-text">Reimu Kart</span>
  </div>

  <!-- Bottom-Right HUD: Position, Lap, Timer, Item Box, Camera & Mute Controls -->
  <div class="fixed bottom-4 right-4 z-20 flex flex-col items-end gap-2.5 max-w-[96vw]">
    <!-- Main Race Telemetry Card -->
    <div class="glass-panel rounded-2xl p-3 sm:px-4 sm:py-3 flex items-center gap-3 sm:gap-4">
      <!-- Position Indicator -->
      <div class="flex flex-col items-center justify-center min-w-[54px] px-2 py-1 rounded-xl bg-amber-500/15 border border-amber-500/30">
        <span class="text-[10px] uppercase font-bold tracking-wider opacity-75">POS</span>
        <div class="font-display font-bold text-xl sm:text-2xl leading-none text-amber-500" id="hud-pos">1<span class="text-xs align-top">st</span></div>
      </div>

      <!-- Lap & Timer -->
      <div class="flex flex-col gap-0.5">
        <div class="flex items-center gap-2">
          <span class="text-[11px] uppercase font-bold opacity-70">LAP</span>
          <span id="hud-lap" class="font-display font-bold text-sm sm:text-base">1 / 3</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-[11px] uppercase font-bold opacity-70">TIME</span>
          <span id="hud-timer" class="font-mono font-bold text-xs sm:text-sm tabular-nums">00:00.00</span>
        </div>
      </div>

      <!-- Held Item Slot -->
      <button id="btn-use-item" title="Use Item (E)" class="ui-btn relative w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-indigo-500/15 border-2 border-indigo-400/40 flex flex-col items-center justify-center">
        <span id="hud-item-icon" class="text-xl sm:text-2xl leading-none">🎲</span>
        <span id="hud-item-label" class="text-[9px] font-bold uppercase tracking-tighter opacity-75 mt-0.5">Empty</span>
        <kbd class="absolute -top-1.5 -right-1.5 text-[10px] px-1 py-0">E</kbd>
      </button>
    </div>

    <!-- Utility Bar: Controls Hint, Camera Mode, Restart, Mute -->
    <div class="flex flex-wrap items-center justify-end gap-2">
      <div class="glass-panel rounded-xl px-3 py-1.5 text-[11px] font-semibold hidden md:flex items-center gap-2.5 opacity-90">
        <span><kbd>↑↓←→</kbd> Drive</span>
        <span><kbd>Space</kbd> Drift/Boost</span>
        <span><kbd>E</kbd> Item</span>
        <span><kbd>T</kbd> Auto-Drive</span>
        <span><kbd>N</kbd> Day/Night</span>
        <span>🖱️ Squeeze/Throw Fumo</span>
      </div>

      <!-- Auto-Drive Toggle Button (T) -->
      <button id="btn-autodrive" title="Toggle Auto-Drive (T)" class="glass-panel ui-btn rounded-xl px-3 py-2 text-xs font-semibold flex items-center gap-1.5">
        <span id="autodrive-icon">🤖</span>
        <span id="autodrive-label">Auto-Drive: ON</span>
        <kbd class="hidden sm:inline-block">T</kbd>
      </button>

      <!-- Day / Night Toggle Button (N) -->
      <button id="btn-mode" title="Toggle Day / Night Mode (N)" class="glass-panel ui-btn rounded-xl px-3 py-2 text-xs font-semibold flex items-center gap-1.5">
        <span id="mode-icon">🌙</span>
        <span id="mode-label">Night</span>
        <kbd class="hidden sm:inline-block">N</kbd>
      </button>

      <!-- Camera View Toggle (Orbit Diorama vs Kart Chase) -->
      <button id="btn-cam" title="Switch Camera View (C)" class="glass-panel ui-btn rounded-xl px-3 py-2 text-xs font-semibold flex items-center gap-1.5">
        <span id="cam-icon">🎥</span>
        <span id="cam-label">Orbit Cam</span>
        <kbd class="hidden sm:inline-block">C</kbd>
      </button>

      <!-- Restart Race Button -->
      <button id="btn-restart" title="Restart Race (R)" class="glass-panel ui-btn rounded-xl px-3 py-2 text-xs font-semibold flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        <span class="hidden sm:inline">Restart</span>
        <kbd class="hidden sm:inline-block">R</kbd>
      </button>

      <!-- Mute Toggle Button (Bottom-Right) -->
      <button id="btn-mute" title="Toggle Audio (M)" class="glass-panel ui-btn rounded-xl p-2 flex items-center justify-center">
        <svg id="icon-sound-on" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <svg id="icon-sound-off" class="w-4 h-4 hidden opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>
    </div>
  </div>

  <script>
    // ============================================================================
    // 1. WEB AUDIO SYNTHESIZER (Engine, Drift, Items, Squeeze, & Chiptune BGM)
    // ============================================================================
    const STORAGE_MUTE_KEY = 'gensokyo_fumo_kart_mute';
    const STORAGE_MODE_KEY = 'gensokyo_fumo_kart_mode';

    class KartAudioEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.isPaused = false;
        this.unlocked = false;

        // Continuous engine & drift nodes
        this.engineOsc = null;
        this.engineGain = null;
        this.driftOsc = null;
        this.driftGain = null;

        // Chiptune sequencer state
        this.bgmNoteIndex = 0;
        this.bgmAccumulator = 0;
        this.finalLapMultiplier = 1.0;

        try {
          const savedMute = localStorage.getItem(STORAGE_MUTE_KEY);
          if (savedMute === 'true') this.muted = true;
        } catch (e) {}
      }

      unlock() {
        if (this.unlocked && this.ctx) {
          if (!this.isPaused && this.ctx.state === 'suspended') {
            try { this.ctx.resume(); } catch (e) {}
          }
          return;
        }
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          this.ctx = new AudioCtx();
          if (this.ctx.state === 'suspended') {
            this.ctx.resume();
          }

          // Continuous Kart Engine Oscillator
          this.engineOsc = this.ctx.createOscillator();
          this.engineGain = this.ctx.createGain();
          this.engineOsc.type = 'sawtooth';
          this.engineOsc.frequency.value = 65;
          this.engineGain.gain.value = 0.0001;

          // Lowpass filter to warm up the engine buzz
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 340;

          this.engineOsc.connect(filter);
          filter.connect(this.engineGain);
          this.engineGain.connect(this.ctx.destination);
          this.engineOsc.start();

          // Continuous Drift Screech Oscillator
          this.driftOsc = this.ctx.createOscillator();
          this.driftGain = this.ctx.createGain();
          this.driftOsc.type = 'triangle';
          this.driftOsc.frequency.value = 380;
          this.driftGain.gain.value = 0.0001;
          this.driftOsc.connect(this.driftGain);
          this.driftGain.connect(this.ctx.destination);
          this.driftOsc.start();

          this.unlocked = true;
        } catch (e) {}
      }

      setMuted(mute) {
        this.muted = Boolean(mute);
        try {
          localStorage.setItem(STORAGE_MUTE_KEY, this.muted ? 'true' : 'false');
        } catch (e) {}
        if (this.muted && this.engineGain && this.ctx) {
          try {
            this.engineGain.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.03);
            this.driftGain.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.03);
          } catch (e) {}
        }
      }

      suspend() {
        this.isPaused = true;
        if (this.ctx && this.ctx.state === 'running') {
          try { this.ctx.suspend(); } catch (e) {}
        }
      }

      resume() {
        this.isPaused = false;
        if (this.ctx && this.ctx.state === 'suspended') {
          try { this.ctx.resume(); } catch (e) {}
        }
      }

      updateContinuous(dt, speedRatio, isDrifting, driftLevel) {
        if (!this.unlocked || !this.ctx || this.isPaused) return;
        try {
          const now = this.ctx.currentTime;
          if (this.muted) {
            this.engineGain.gain.setTargetAtTime(0.0001, now, 0.04);
            this.driftGain.gain.setTargetAtTime(0.0001, now, 0.04);
            return;
          }

          // 1. Engine pitch tied to player kart speed
          const targetFreq = 58 + Math.abs(speedRatio) * 145 + (driftLevel * 18);
          const targetVol = 0.018 + Math.min(0.025, Math.abs(speedRatio) * 0.022);
          this.engineOsc.frequency.setTargetAtTime(targetFreq, now, 0.05);
          this.engineGain.gain.setTargetAtTime(targetVol, now, 0.05);

          // 2. Drift screech
          if (isDrifting && Math.abs(speedRatio) > 0.25) {
            const screechPitch = 320 + driftLevel * 110 + Math.sin(now * 28) * 25;
            this.driftOsc.frequency.setTargetAtTime(screechPitch, now, 0.03);
            this.driftGain.gain.setTargetAtTime(0.026, now, 0.03);
          } else {
            this.driftGain.gain.setTargetAtTime(0.0001, now, 0.04);
          }

          // 3. Upbeat Touhou-style Chiptune Loop (speeds up in Final Lap!)
          const stepDuration = 0.145 / this.finalLapMultiplier;
          this.bgmAccumulator += dt;
          if (this.bgmAccumulator >= stepDuration) {
            this.bgmAccumulator -= stepDuration;
            this.playChiptuneStep();
          }
        } catch (e) {}
      }

      playChiptuneStep() {
        if (this.muted || !this.ctx) return;
        try {
          // Energetic Gensokyo pentatonic/melodic arcade sequence (MIDI notes)
          const melody = [
            69, 72, 76, 81, 79, 76, 72, 74,
            76, 79, 81, 84, 83, 79, 76, 72,
            65, 69, 72, 77, 76, 72, 69, 71,
            72, 76, 79, 83, 81, 76, 74, 71
          ];
          const bass = [
            45, 45, 57, 45, 48, 48, 60, 48,
            41, 41, 53, 41, 43, 43, 55, 43
          ];

          const idx = this.bgmNoteIndex % melody.length;
          const bIdx = this.bgmNoteIndex % bass.length;
          this.bgmNoteIndex++;

          const now = this.ctx.currentTime;
          const mNote = melody[idx];
          const mFreq = 440 * Math.pow(2, (mNote - 69) / 12);

          // Lead square wave
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(mFreq, now);
          gain.gain.setValueAtTime(0.014, now);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.11);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.12);

          // Bass triangle wave on even steps
          if (idx % 2 === 0) {
            const bNote = bass[bIdx];
            const bFreq = 440 * Math.pow(2, (bNote - 69) / 12);
            const bOsc = this.ctx.createOscillator();
            const bGain = this.ctx.createGain();
            bOsc.type = 'triangle';
            bOsc.frequency.setValueAtTime(bFreq, now);
            bGain.gain.setValueAtTime(0.022, now);
            bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
            bOsc.connect(bGain);
            bGain.connect(this.ctx.destination);
            bOsc.start(now);
            bOsc.stop(now + 0.19);
          }
        } catch (e) {}
      }

      // Cute double-chirp plushie squeeze sound
      playSqueeze(pitchMultiplier = 1.0) {
        if (this.muted) return;
        try {
          this.unlock();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sine';
          const baseFreq = (540 + Math.random() * 70) * pitchMultiplier;
          osc1.frequency.setValueAtTime(baseFreq, now);
          osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.48, now + 0.08);
          osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.15, now + 0.15);

          gain1.gain.setValueAtTime(0.001, now);
          gain1.gain.linearRampToValueAtTime(0.095, now + 0.02);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.17);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(baseFreq * 1.1, now + 0.1);
          osc2.frequency.exponentialRampToValueAtTime(baseFreq * 1.65, now + 0.2);

          gain2.gain.setValueAtTime(0.001, now + 0.1);
          gain2.gain.linearRampToValueAtTime(0.075, now + 0.12);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start(now + 0.1);
          osc2.stop(now + 0.23);
        } catch (e) {}
      }

      // Soft bump / wall squish thud
      playBump(intensity = 0.6) {
        if (this.muted || intensity < 0.08) return;
        try {
          this.unlock();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const vol = Math.min(0.12, intensity * 0.1);
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(125 + Math.min(70, intensity * 30), now);
          osc.frequency.exponentialRampToValueAtTime(42, now + 0.09);
          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        } catch (e) {}
      }

      // Item Box Pickup Arpeggio
      playItemPickup() {
        if (this.muted) return;
        try {
          this.unlock();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.055);
            gain.gain.setValueAtTime(0.07, now + i * 0.055);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.055 + 0.12);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.055);
            osc.stop(now + i * 0.055 + 0.13);
          });
        } catch (e) {}
      }

      // Turbo Boost Whoosh
      playBoost() {
        if (this.muted) return;
        try {
          this.unlock();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(680, now + 0.18);
          osc.frequency.exponentialRampToValueAtTime(260, now + 0.38);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.085, now + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.39);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.4);
        } catch (e) {}
      }
    }

    const soundFX = new KartAudioEngine();

    // ============================================================================
    // 2. COLOR & VOXEL HELPER UTILITIES
    // ============================================================================
    const tempColor = new THREE.Color();
    const tempMatrix = new THREE.Matrix4();
    const tempPos = new THREE.Vector3();
    const tempQuat = new THREE.Quaternion();
    const tempScale = new THREE.Vector3();
    const tempEuler = new THREE.Euler();

    function voxelHash(x, y, z) {
      let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
      return n - Math.floor(n);
    }

    function varyColor(hexOrString, x, y, z, variance = 0.035, seamDarken = 0) {
      tempColor.set(hexOrString);
      const h = voxelHash(x, y, z);
      const delta = (h - 0.5) * 2 * variance - seamDarken;
      tempColor.offsetHSL(0, (h - 0.5) * 0.03, delta);
      return tempColor.clone();
    }

    function createSoftVoxelGeometry(size = 1) {
      const s = size * 0.985;
      return new THREE.BoxGeometry(s, s, s);
    }

    function buildVoxelInstancedMesh(voxels, unitSize, material, castShadow = true, receiveShadow = true) {
      if (!voxels || voxels.length === 0) return null;
      const geom = createSoftVoxelGeometry(unitSize);
      const mesh = new THREE.InstancedMesh(geom, material, voxels.length);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = receiveShadow;

      for (let i = 0; i < voxels.length; i++) {
        const v = voxels[i];
        tempPos.set(v.x * unitSize, v.y * unitSize, v.z * unitSize);
        if (v.rotY !== undefined) {
          tempEuler.set(v.rotX || 0, v.rotY || 0, v.rotZ || 0);
          tempQuat.setFromEuler(tempEuler);
        } else {
          tempQuat.identity();
        }
        tempScale.set(v.sx || 1, v.sy || 1, v.sz || 1);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        mesh.setMatrixAt(i, tempMatrix);
        mesh.setColorAt(i, v.color instanceof THREE.Color ? v.color : new THREE.Color(v.color));
      }
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      return mesh;
    }

    // ============================================================================
    // 3. SCENE, CAMERA, RENDERER & POST-PROCESSING SETUP
    // ============================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#bde0fe');
    scene.fog = new THREE.FogExp2('#bde0fe', 0.0065);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.5, 180);
    camera.position.set(0, 25, 36);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    let composer = null;
    let bloomPass = null;
    try {
      const renderPass = new THREE.RenderPass(scene, camera);
      bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.18,
        0.55,
        0.82
      );
      composer = new THREE.EffectComposer(renderer);
      composer.addPass(renderPass);
      composer.addPass(bloomPass);
    } catch (err) {
      composer = null;
    }

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.8, 1.0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI * 0.47;
    controls.minPolarAngle = Math.PI * 0.08;
    controls.minDistance = 10;
    controls.maxDistance = 64;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 0.38;

    let cameraMode = 'orbit'; // 'orbit' | 'chase'
    let lastUserInteractionTime = performance.now();
    const recordInteraction = () => {
      lastUserInteractionTime = performance.now();
      controls.autoRotate = false;
    };
    controls.addEventListener('start', recordInteraction);

    // ============================================================================
    // 4. LIGHTING & MATERIALS (Capped Dynamic Lights for Performance)
    // ============================================================================
    const hemiLight = new THREE.HemisphereLight(0xfff9eb, 0x8d99ae, 0.72);
    hemiLight.position.set(0, 35, 0);
    scene.add(hemiLight);

    // Primary Sun / Moon Directional Light
    const sunDirLight = new THREE.DirectionalLight(0xfff2d6, 1.28);
    sunDirLight.position.set(-24, 32, 22);
    sunDirLight.castShadow = true;
    sunDirLight.shadow.mapSize.width = 2048;
    sunDirLight.shadow.mapSize.height = 2048;
    sunDirLight.shadow.camera.near = 4;
    sunDirLight.shadow.camera.far = 90;
    const sCam = 30;
    sunDirLight.shadow.camera.left = -sCam;
    sunDirLight.shadow.camera.right = sCam;
    sunDirLight.shadow.camera.top = sCam;
    sunDirLight.shadow.camera.bottom = -sCam;
    sunDirLight.shadow.bias = -0.0006;
    scene.add(sunDirLight);

    // Cave Lava Glow PointLight
    const lavaLight = new THREE.PointLight(0xff5400, 0.4, 22, 1.6);
    lavaLight.position.set(-2, 2.8, -17);
    scene.add(lavaLight);

    // Shrine Arch & Lantern Warm PointLight
    const shrineLight = new THREE.PointLight(0xffaa44, 0.2, 22, 1.5);
    shrineLight.position.set(2, 4.5, 15.5);
    scene.add(shrineLight);

    // Snowy / Mansion Neon Accent PointLight
    const neonTrackLight = new THREE.PointLight(0x38bdf8, 0.2, 22, 1.5);
    neonTrackLight.position.set(-19, 3.5, -2);
    scene.add(neonTrackLight);

    // Shared Materials
    const plushMaterial = new THREE.MeshStandardMaterial({ roughness: 0.9, metalness: 0.02 });
    const solidMaterial = new THREE.MeshStandardMaterial({ roughness: 0.8, metalness: 0.06 });
    const glossyMaterial = new THREE.MeshStandardMaterial({ roughness: 0.28, metalness: 0.18 });
    const translucentIceMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.84,
      roughness: 0.15,
      metalness: 0.05,
      transmission: 0.35,
      emissive: new THREE.Color(0x38bdf8),
      emissiveIntensity: 0.3
    });
    const crystalWingMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.2,
      metalness: 0.1,
      emissive: new THREE.Color(0xffffff),
      emissiveIntensity: 0.35
    });
    const neonEmissiveMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: new THREE.Color(0xffaa33),
      emissiveIntensity: 0.45,
      roughness: 0.2
    });
    const boostPadMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: new THREE.Color(0x00f5d4),
      emissiveIntensity: 0.65,
      roughness: 0.2
    });
    const lavaEmissiveMaterial = new THREE.MeshStandardMaterial({
      color: 0xff6d00,
      emissive: new THREE.Color(0xff4800),
      emissiveIntensity: 0.85,
      roughness: 0.25
    });

    // ============================================================================
    // 5. GENSOKYO TRACK SPLINE & 5-BIOME VOXEL DIORAMA BUILDER
    // ============================================================================
    // Closed counter-clockwise circuit passing through 5 distinct Gensokyo biomes:
    // 1. Hakurei Shrine & Grandstand Straight (South, +Z)
    // 2. Bamboo Forest of the Lost (East, +X)
    // 3. Lava-Lit Subterranean Cave (North, -Z)
    // 4. Snowy Misty Lake & Ramp (Northwest/West, -X)
    // 5. Scarlet Devil Mansion Garden (Southwest, -X/+Z)
    const trackControlPoints = [
      new THREE.Vector3(-4.0, 0.6, 15.0),  // 0: Start/Finish Straight West
      new THREE.Vector3(5.0,  0.6, 15.0),  // 1: Start/Finish Straight East
      new THREE.Vector3(14.5, 0.6, 13.5),  // 2: Turn 1 into Bamboo Forest
      new THREE.Vector3(20.5, 1.3, 6.5),   // 3: Bamboo Forest Climb
      new THREE.Vector3(21.0, 1.8, -2.5),  // 4: Bamboo Bridge Ramp Crest
      new THREE.Vector3(16.5, 0.9, -11.5), // 5: Entering Lava Cave
      new THREE.Vector3(7.0,  0.5, -16.5), // 6: Lava Cave East
      new THREE.Vector3(-3.5, 0.4, -17.0), // 7: Lava Cave Deep Center
      new THREE.Vector3(-13.5,0.9, -14.0), // 8: Exiting Cave into Snow Biome
      new THREE.Vector3(-20.5,1.6, -6.5),  // 9: Snowy Mountain Curve
      new THREE.Vector3(-21.0,1.2, 2.5),   // 10: Scarlet Mansion Garden Entry
      new THREE.Vector3(-14.5,0.6, 11.5)   // 11: Mansion Chicane to Main Straight
    ];

    const trackCurve = new THREE.CatmullRomCurve3(trackControlPoints, true, 'centripetal', 0.5);
    const TRACK_SAMPLES = 360;
    const TRACK_HALF_WIDTH = 2.65;
    const trackSamples = [];

    for (let i = 0; i < TRACK_SAMPLES; i++) {
      const t = i / TRACK_SAMPLES;
      const pt = trackCurve.getPointAt(t);
      const tan = trackCurve.getTangentAt(t).normalize();
      const up = new THREE.Vector3(0, 1, 0);
      const right = new THREE.Vector3().crossVectors(tan, up).normalize();
      trackSamples.push({ t, pt, tan, right });
    }

    function getTrackSampleAt(t) {
      const normT = ((t % 1) + 1) % 1;
      const idx = Math.floor(normT * TRACK_SAMPLES) % TRACK_SAMPLES;
      return trackSamples[idx];
    }

    function findClosestTrackSample(pos) {
      let bestIdx = 0;
      let bestDistSq = Infinity;
      for (let i = 0; i < TRACK_SAMPLES; i++) {
        const p = trackSamples[i].pt;
        const dx = pos.x - p.x;
        const dz = pos.z - p.z;
        const dSq = dx * dx + dz * dz;
        if (dSq < bestDistSq) {
          bestDistSq = dSq;
          bestIdx = i;
        }
      }
      return trackSamples[bestIdx];
    }

    // Special Track Zones: Boost Pads & Ramps
    const boostPadZones = [0.16, 0.48, 0.74, 0.92];
    const rampZones = [0.31, 0.68];

    // Voxel Lists for World & Biomes
    const worldUnit = 0.35;
    const solidWorldVoxels = [];
    const glossyWorldVoxels = [];
    const neonWorldVoxels = [];
    const boostWorldVoxels = [];
    const lavaWorldVoxels = [];
    const iceWorldVoxels = [];

    function addWorldVoxel(list, wx, wy, wz, hex, variance = 0.03, sx = 1, sy = 1, sz = 1, rotY = 0) {
      list.push({
        x: wx / worldUnit,
        y: wy / worldUnit,
        z: wz / worldUnit,
        color: varyColor(hex, wx * 3, wy * 3, wz * 3, variance),
        sx, sy, sz, rotY
      });
    }

    function buildGensokyoCircuitAndBiomes() {
      // 1. Base Island Diorama Plinth
      for (let gx = -76; gx <= 76; gx += 2) {
        for (let gz = -64; gz <= 64; gz += 2) {
          const wx = gx * worldUnit;
          const wz = gz * worldUnit;
          const dist = Math.hypot(wx * 0.82, wz * 0.95);
          if (dist > 25.5) continue;

          // Determine biome ground color by angle / quadrant
          let groundHex = '#52b788'; // Lush Gensokyo grass
          if (wz < -7 && Math.abs(wx) < 15) {
            groundHex = '#2b262d'; // Volcanic basalt floor (Lava cave)
          } else if (wx < -8 && wz < 4) {
            groundHex = '#e2eafc'; // Snowy Misty Lake
          } else if (wx < -6 && wz >= 4) {
            groundHex = '#386641'; // Scarlet Mansion manicured lawn
          } else if (wx > 9) {
            groundHex = '#2d6a4f'; // Deep Bamboo forest moss
          }

          addWorldVoxel(solidWorldVoxels, wx, -0.25, wz, groundHex, 0.035, 2.02, 1.2, 2.02);
          if (dist > 23.6) {
            addWorldVoxel(solidWorldVoxels, wx, -0.8, wz, '#5c3d28', 0.03, 2.02, 2.0, 2.02);
          }
        }
      }

      // 2. Track Road Surface, Curbs, Checkered Start Line, Ramps & Boost Pads
      const roadSteps = 320;
      for (let i = 0; i < roadSteps; i++) {
        const t = i / roadSteps;
        const sample = getTrackSampleAt(t);
        const angle = Math.atan2(sample.tan.x, sample.tan.z);

        const isStartLine = Math.abs(t - 0.02) < 0.008;
        const isBoost = boostPadZones.some(bz => Math.abs(t - bz) < 0.014);
        const isRamp = rampZones.some(rz => Math.abs(t - rz) < 0.015);

        // Road surface tiles across width
        for (let w = -7; w <= 7; w++) {
          const offset = w * 0.36;
          const px = sample.pt.x + sample.right.x * offset;
          const pz = sample.pt.z + sample.right.z * offset;
          let py = sample.pt.y - 0.15;

          if (isRamp) {
            py += 0.22;
          }

          if (Math.abs(w) === 7) {
            // Track Curb Blocks (Alternating Red/White or Neon Cyan/Gold in Cave/Snow)
            const curbStripe = (Math.floor(i / 2) % 2 === 0);
            let curbHex = curbStripe ? '#ef4444' : '#f8fafc';
            if (t > 0.42 && t < 0.60) curbHex = curbStripe ? '#ff6d00' : '#3a2e39';
            else if (t >= 0.60 && t < 0.80) curbHex = curbStripe ? '#38bdf8' : '#f8fafc';

            const targetList = (curbStripe && (t > 0.42 && t < 0.80)) ? neonWorldVoxels : solidWorldVoxels;
            addWorldVoxel(targetList, px, py + 0.18, pz, curbHex, 0.02, 1.15, 0.9, 1.35, angle);
          } else {
            let roadHex = '#3b3e4a';
            if (t >= 0.22 && t <= 0.38) roadHex = '#7f5539'; // Wooden bamboo boardwalk
            else if (t >= 0.60 && t <= 0.78) roadHex = '#90e0ef'; // Packed glacier road
            else if (t >= 0.80 && t <= 0.95) roadHex = '#593d3b'; // Mansion cobblestone

            if (isStartLine) {
              const check = ((w + i) % 2 === 0);
              roadHex = check ? '#ffffff' : '#111827';
              addWorldVoxel(glossyWorldVoxels, px, py + 0.04, pz, roadHex, 0.01, 1.1, 0.7, 1.3, angle);
            } else if (isBoost && Math.abs(w) <= 4 && ((i + Math.abs(w)) % 2 === 0)) {
              addWorldVoxel(boostWorldVoxels, px, py + 0.06, pz, '#00f5d4', 0.01, 1.05, 0.75, 1.25, angle);
            } else if (isRamp && Math.abs(w) <= 5) {
              addWorldVoxel(glossyWorldVoxels, px, py + 0.05, pz, '#f59e0b', 0.02, 1.1, 0.85, 1.3, angle);
            } else if (i % 2 === 0) {
              addWorldVoxel(solidWorldVoxels, px, py, pz, roadHex, 0.025, 1.15, 0.65, 2.2, angle);
            }
          }
        }

        // Support pillars under elevated bridge sections
        if (sample.pt.y > 0.85 && i % 8 === 0) {
          for (const side of [-1, 1]) {
            const sx = sample.pt.x + sample.right.x * side * 2.2;
            const sz = sample.pt.z + sample.right.z * side * 2.2;
            for (let y = 0; y < sample.pt.y; y += 0.35) {
              addWorldVoxel(solidWorldVoxels, sx, y, sz, '#6c462c', 0.02, 1.1, 1.1, 1.1);
            }
          }
        }
      }

      // 3. BIOME 1: HAKUREI SHRINE, START/FINISH ARCH, GRANDSTAND, TOWER & HAY BALES
      // Start/Finish Arch at t = 0.02 (around X = -0.5, Z = 15.0)
      const startSample = getTrackSampleAt(0.02);
      const archAngle = Math.atan2(startSample.tan.x, startSample.tan.z);
      for (const side of [-1, 1]) {
        const px = startSample.pt.x + startSample.right.x * side * 3.1;
        const pz = startSample.pt.z + startSample.right.z * side * 3.1;
        for (let y = 0.4; y <= 4.8; y += 0.35) {
          addWorldVoxel(solidWorldVoxels, px, y, pz, y < 1.2 ? '#f8fafc' : '#dc2626', 0.02, 1.3, 1.05, 1.3);
        }
      }
      // Arch top crossbeams & checkered banner + glowing race lights
      for (let s = -3.6; s <= 3.6; s += 0.35) {
        const bx = startSample.pt.x + startSample.right.x * s;
        const bz = startSample.pt.z + startSample.right.z * s;
        addWorldVoxel(solidWorldVoxels, bx, 4.9, bz, '#dc2626', 0.02, 1.2, 1.1, 1.4, archAngle);
        addWorldVoxel(solidWorldVoxels, bx, 5.3, bz, '#1e293b', 0.02, 1.3, 0.9, 1.6, archAngle);
        if (Math.abs(s) <= 2.6) {
          const check = (Math.floor((s + 4) * 3) % 2 === 0);
          addWorldVoxel(glossyWorldVoxels, bx, 4.3, bz, check ? '#ffffff' : '#1e293b', 0.01, 1.05, 1.1, 0.6, archAngle);
        }
        if (Math.abs(s) < 1.5 && Math.abs(s * 2 - Math.round(s * 2)) < 0.2) {
          addWorldVoxel(neonWorldVoxels, bx, 3.85, bz, '#fbbf24', 0.01, 0.8, 0.8, 0.8);
        }
      }

      // Traditional Red Torii Gate slightly further down the straight (t = 0.09)
      const toriiSample = getTrackSampleAt(0.09);
      const toriiAngle = Math.atan2(toriiSample.tan.x, toriiSample.tan.z);
      for (const side of [-1, 1]) {
        const tx = toriiSample.pt.x + toriiSample.right.x * side * 3.2;
        const tz = toriiSample.pt.z + toriiSample.right.z * side * 3.2;
        for (let y = 0.4; y <= 4.6; y += 0.35) {
          addWorldVoxel(solidWorldVoxels, tx, y, tz, y < 1.0 ? '#2b2d42' : '#e63946', 0.02, 1.25, 1.05, 1.25);
        }
      }
      for (let s = -4.0; s <= 4.0; s += 0.35) {
        const bx = toriiSample.pt.x + toriiSample.right.x * s;
        const bz = toriiSample.pt.z + toriiSample.right.z * s;
        const curveUp = Math.pow(s / 4.0, 2) * 0.35;
        addWorldVoxel(solidWorldVoxels, bx, 4.7 + curveUp, bz, '#1f2937', 0.02, 1.2, 0.7, 1.3, toriiAngle);
        addWorldVoxel(solidWorldVoxels, bx, 4.4 + curveUp, bz, '#e63946', 0.02, 1.15, 0.8, 1.15, toriiAngle);
        if (Math.abs(s) <= 3.3) {
          addWorldVoxel(solidWorldVoxels, bx, 3.7, bz, '#e63946', 0.02, 1.05, 0.7, 1.0, toriiAngle);
        }
      }

      // Grandstand on the inside of the main straight (X in [-3.5, 4.5], Z in [9.2, 11.6])
      for (let x = -3.5; x <= 4.5; x += 0.35) {
        for (let tier = 0; tier < 3; tier++) {
          const z = 11.2 - tier * 0.75;
          const y = 0.5 + tier * 0.55;
          addWorldVoxel(solidWorldVoxels, x, y, z, tier % 2 === 0 ? '#9c6644' : '#7f5539', 0.02, 1.05, 1.4, 1.8);
        }
        // Grandstand awning roof
        addWorldVoxel(solidWorldVoxels, x, 3.3, 10.2, Math.floor(x * 2) % 2 === 0 ? '#e63946' : '#f8fafc', 0.02, 1.05, 0.5, 4.2);
      }
      for (const gx of [-3.4, 4.4]) {
        for (let y = 0.5; y <= 3.2; y += 0.35) {
          addWorldVoxel(solidWorldVoxels, gx, y, 9.8, '#5c3d28', 0.02, 0.9, 1.05, 0.9);
        }
      }

      // Race Control Tower (X = -5.5, Z = 11.0, top at Y = 4.35 for the Checkered-Flag Fumo!)
      for (let y = 0.4; y <= 4.0; y += 0.35) {
        for (let dx = -0.9; dx <= 0.9; dx += 0.45) {
          for (let dz = -0.9; dz <= 0.9; dz += 0.45) {
            if (Math.abs(dx) < 0.8 && Math.abs(dz) < 0.8 && y < 3.6) continue;
            const col = (y > 2.8 && y < 3.6) ? '#38bdf8' : '#e2e8f0';
            addWorldVoxel(solidWorldVoxels, -5.5 + dx, y, 11.0 + dz, col, 0.02, 1.25, 1.05, 1.25);
          }
        }
      }
      // Tower roof platform at Y = 4.35
      for (let dx = -1.1; dx <= 1.1; dx += 0.35) {
        for (let dz = -1.1; dz <= 1.1; dz += 0.35) {
          addWorldVoxel(solidWorldVoxels, -5.5 + dx, 4.2, 11.0 + dz, '#334155', 0.02, 1.05, 0.6, 1.05);
        }
      }

      // Golden Hay Bales near Turn 1 (X = 11.5, Z = 10.2, top at Y = 1.25 for the Napping Fumo!)
      for (let dx = -0.9; dx <= 0.9; dx += 0.35) {
        for (let dz = -0.7; dz <= 0.7; dz += 0.35) {
          addWorldVoxel(solidWorldVoxels, 11.5 + dx, 0.55, 10.2 + dz, '#eab308', 0.04, 1.05, 1.4, 1.05);
          addWorldVoxel(solidWorldVoxels, 11.5 + dx, 1.05, 10.2 + dz, '#facc15', 0.04, 1.05, 1.2, 1.05);
        }
      }

      // Winner's Podium (1st, 2nd, 3rd blocks at X in [-1.5, 1.5], Z = 6.2)
      const podiumSpecs = [
        { x: 0.0,  z: 6.2, h: 1.55, col: '#fbbf24' }, // 1st Gold
        { x: -1.6, z: 6.2, h: 1.15, col: '#cbd5e1' }, // 2nd Silver
        { x: 1.6,  z: 6.2, h: 0.90, col: '#d97706' }  // 3rd Bronze
      ];
      podiumSpecs.forEach(p => {
        for (let dx = -0.6; dx <= 0.6; dx += 0.35) {
          for (let dz = -0.6; dz <= 0.6; dz += 0.35) {
            addWorldVoxel(glossyWorldVoxels, p.x + dx, p.h * 0.5, p.z + dz, p.col, 0.02, 1.05, p.h / worldUnit, 1.05);
          }
        }
      });

      // Blooming Sakura Trees around Shrine
      const sakuraSpots = [[7.5, 18.8], [-8.5, 18.5], [0.5, 3.2]];
      sakuraSpots.forEach(([sx, sz]) => {
        for (let y = 0.4; y <= 2.8; y += 0.35) {
          addWorldVoxel(solidWorldVoxels, sx, y, sz, '#5c3d28', 0.03, 1.2, 1.1, 1.2);
        }
        for (let lx = -1.8; lx <= 1.8; lx += 0.45) {
          for (let ly = 2.4; ly <= 4.4; ly += 0.45) {
            for (let lz = -1.8; lz <= 1.8; lz += 0.45) {
              if (Math.hypot(lx, ly - 3.3, lz) <= 1.95) {
                addWorldVoxel(solidWorldVoxels, sx + lx, ly, sz + lz, (lx + lz > 0) ? '#ffb3c6' : '#ff8fab', 0.04, 1.3, 1.3, 1.3);
              }
            }
          }
        }
      });

      // 4. BIOME 2: BAMBOO FOREST OF THE LOST (East Sector)
      const bambooCoords = [
        [15.5, 8.5], [17.0, 5.0], [16.2, 1.0], [16.5, -3.5], [14.8, -6.5],
        [23.8, 9.0], [24.5, 4.5], [24.8, 0.5], [24.2, -4.0], [22.5, -8.5],
        [13.5, 4.0], [14.0, -1.0], [23.0, 12.0]
      ];
      bambooCoords.forEach(([bx, bz], idx) => {
        const stalkH = 4.5 + (idx % 3) * 1.1;
        for (let y = 0.4; y <= stalkH; y += 0.38) {
          const isNode = Math.abs((y * 2.5) % 1) < 0.25;
          addWorldVoxel(solidWorldVoxels, bx, y, bz, isNode ? '#a3e635' : '#4d7c0f', 0.025, 0.95, 1.05, 0.95);
        }
        // Bamboo leaves at top
        addWorldVoxel(solidWorldVoxels, bx + 0.4, stalkH, bz, '#65a30d', 0.03, 1.8, 0.5, 0.8);
        addWorldVoxel(solidWorldVoxels, bx - 0.4, stalkH - 0.4, bz + 0.3, '#84cc16', 0.03, 1.6, 0.5, 0.8);
        // Glowing bamboo shoot lantern at base
        if (idx % 2 === 0) {
          addWorldVoxel(neonWorldVoxels, bx - 0.45, 0.6, bz + 0.45, '#bef264', 0.01, 0.75, 1.2, 0.75);
        }
      });

      // 5. BIOME 3: LAVA-LIT SUBTERRANEAN CAVE (North Sector, Z < -11)
      // Volcanic rock arches & glowing magma pools
      for (let x = -11.0; x <= 11.0; x += 0.6) {
        for (let z = -21.5; z <= -12.0; z += 0.6) {
          const dTrack = Math.abs(z - (-16.6));
          // Glowing lava pools flanking the cave road
          if (dTrack > 3.1 && dTrack < 5.2) {
            addWorldVoxel(lavaWorldVoxels, x, 0.12, z, (Math.floor(x + z) % 2 === 0) ? '#ff5400' : '#ff9e00', 0.03, 1.75, 0.6, 1.75);
          }
          // Cave rock walls & stalactite arches
          if (dTrack >= 4.8 && dTrack <= 6.2 && Math.abs(x) < 9.5) {
            const wallH = 3.6 + Math.sin(x * 0.7) * 1.2;
            for (let y = 0.4; y <= wallH; y += 0.55) {
              addWorldVoxel(solidWorldVoxels, x, y, z, '#2b262d', 0.04, 1.75, 1.6, 1.75);
            }
          }
        }
      }
      // Overhead Cave Archway across the track at X = -2.0 and X = 4.0
      for (const archX of [-3.5, 3.5]) {
        for (let z = -20.5; z <= -12.8; z += 0.5) {
          const distFromCenter = Math.abs(z - (-16.6));
          const archY = 4.8 - Math.pow(distFromCenter / 4.2, 2) * 2.8;
          if (archY > 1.2) {
            addWorldVoxel(solidWorldVoxels, archX, archY, z, '#3a2e39', 0.04, 2.2, 1.6, 1.5);
            if (distFromCenter < 2.2) {
              addWorldVoxel(neonWorldVoxels, archX, archY - 0.55, z, '#ff6d00', 0.02, 0.7, 1.1, 0.7);
            }
          }
        }
      }

      // 6. BIOME 4: SNOWY MISTY LAKE & GLACIER PINES (Northwest Sector)
      const snowPines = [
        [-15.5, -9.5], [-16.0, -3.5], [-24.2, -10.5], [-24.8, -4.5], [-24.5, 0.5], [-15.8, -15.5]
      ];
      snowPines.forEach(([px, pz], idx) => {
        for (let y = 0.4; y <= 1.8; y += 0.35) {
          addWorldVoxel(solidWorldVoxels, px, y, pz, '#5c3d28', 0.02, 1.0, 1.1, 1.0);
        }
        for (let tier = 0; tier < 3; tier++) {
          const rad = 1.6 - tier * 0.42;
          const ty = 1.8 + tier * 0.95;
          addWorldVoxel(solidWorldVoxels, px, ty, pz, '#1b4332', 0.03, rad * 2.4, 1.4, rad * 2.4);
          addWorldVoxel(solidWorldVoxels, px, ty + 0.32, pz, '#f8fafc', 0.02, rad * 2.1, 0.65, rad * 2.1);
        }
        // Giant glowing ice crystals near snow pines
        if (idx % 2 === 0) {
          addWorldVoxel(iceWorldVoxels, px + 1.2, 1.1, pz + 0.6, '#38bdf8', 0.02, 1.1, 3.2, 1.1, 0.4);
          addWorldVoxel(iceWorldVoxels, px + 0.8, 0.8, pz + 1.1, '#7dd3fc', 0.02, 0.9, 2.2, 0.9, -0.3);
        }
      });

      // 7. BIOME 5: SCARLET DEVIL MANSION GARDEN (Southwest Sector)
      const gardenPillars = [
        [-18.5, 7.5], [-15.0, 14.5], [-11.5, 7.5], [-22.5, 4.5]
      ];
      gardenPillars.forEach(([gx, gz]) => {
        for (let y = 0.4; y <= 3.2; y += 0.35) {
          addWorldVoxel(solidWorldVoxels, gx, y, gz, y === 3.2 ? '#e2e8f0' : '#991b1b', 0.025, 1.35, 1.05, 1.35);
        }
        // Scarlet lantern on top of pillar
        addWorldVoxel(neonWorldVoxels, gx, 3.65, gz, '#fb7185', 0.01, 1.0, 1.2, 1.0);
      });
      // Manicured Rose Hedges
      const hedgeRows = [[-16.8, 5.8], [-13.2, 9.2], [-19.5, 9.8]];
      hedgeRows.forEach(([hx, hz]) => {
        for (let s = -1.2; s <= 1.2; s += 0.4) {
          addWorldVoxel(solidWorldVoxels, hx + s, 0.75, hz, '#14532d', 0.03, 1.2, 2.2, 1.2);
          if (Math.abs(s) < 0.9) {
            addWorldVoxel(solidWorldVoxels, hx + s, 1.25, hz + 0.25, '#e11d48', 0.02, 0.55, 0.55, 0.55);
          }
        }
      });

      // 8. Tire Barriers & Banners at Key Corners
      const barrierT = [0.19, 0.21, 0.39, 0.41, 0.59, 0.61, 0.79, 0.81, 0.95];
      barrierT.forEach((bt, idx) => {
        const s = getTrackSampleAt(bt);
        const side = (idx % 2 === 0) ? 1 : -1;
        const bx = s.pt.x + s.right.x * side * 3.15;
        const bz = s.pt.z + s.right.z * side * 3.15;
        const col = (idx % 2 === 0) ? '#ef4444' : '#f8fafc';
        addWorldVoxel(solidWorldVoxels, bx, s.pt.y + 0.25, bz, '#1f2937', 0.02, 1.3, 0.9, 1.3);
        addWorldVoxel(solidWorldVoxels, bx, s.pt.y + 0.6, bz, col, 0.02, 1.25, 0.9, 1.25);
      });
    }

    buildGensokyoCircuitAndBiomes();

    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    const solidWorldMesh = buildVoxelInstancedMesh(solidWorldVoxels, worldUnit, solidMaterial, true, true);
    const glossyWorldMesh = buildVoxelInstancedMesh(glossyWorldVoxels, worldUnit, glossyMaterial, true, true);
    const neonWorldMesh = buildVoxelInstancedMesh(neonWorldVoxels, worldUnit, neonEmissiveMaterial, false, false);
    const boostWorldMesh = buildVoxelInstancedMesh(boostWorldVoxels, worldUnit, boostPadMaterial, false, true);
    const lavaWorldMesh = buildVoxelInstancedMesh(lavaWorldVoxels, worldUnit, lavaEmissiveMaterial, false, false);
    const iceWorldMesh = buildVoxelInstancedMesh(iceWorldVoxels, worldUnit, translucentIceMaterial, true, true);

    if (solidWorldMesh) worldGroup.add(solidWorldMesh);
    if (glossyWorldMesh) worldGroup.add(glossyWorldMesh);
    if (neonWorldMesh) worldGroup.add(neonWorldMesh);
    if (boostWorldMesh) worldGroup.add(boostWorldMesh);
    if (lavaWorldMesh) worldGroup.add(lavaWorldMesh);
    if (iceWorldMesh) worldGroup.add(iceWorldMesh);

    // Starry Night Sky Dome for Night Mode
    const STAR_COUNT = 240;
    const starGeom = new THREE.BoxGeometry(0.18, 0.18, 0.18);
    const starMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.0, depthWrite: false });
    const starMesh = new THREE.InstancedMesh(starGeom, starMat, STAR_COUNT);
    const starPos = new THREE.Vector3();
    const starQuat = new THREE.Quaternion();
    const starScale = new THREE.Vector3();
    const starMatrix = new THREE.Matrix4();
    for (let i = 0; i < STAR_COUNT; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI * 0.42 + 0.08;
      const rad = 65 + Math.random() * 20;
      starPos.set(
        Math.cos(theta) * Math.cos(phi) * rad,
        Math.sin(phi) * rad + 6,
        Math.sin(theta) * Math.cos(phi) * rad
      );
      starQuat.identity();
      const s = 0.7 + Math.random() * 1.3;
      starScale.set(s, s, s);
      starMatrix.compose(starPos, starQuat, starScale);
      starMesh.setMatrixAt(i, starMatrix);
      const starCols = ['#ffffff', '#fef08a', '#bae6fd', '#fbcfe8'];
      starMesh.setColorAt(i, new THREE.Color(starCols[i % starCols.length]));
    }
    starMesh.instanceMatrix.needsUpdate = true;
    starMesh.instanceColor.needsUpdate = true;
    starMesh.visible = false;
    scene.add(starMesh);

    // ============================================================================
    // 6. SPINNING RAINBOW ITEM BOXES ON THE TRACK
    // ============================================================================
    const itemBoxTSpots = [0.12, 0.12, 0.28, 0.28, 0.45, 0.45, 0.64, 0.64, 0.85, 0.85];
    const itemBoxes = [];
    const itemBoxGeom = new THREE.BoxGeometry(0.68, 0.68, 0.68);
    const itemBoxMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: new THREE.Color(0xfbbf24),
      emissiveIntensity: 0.55,
      roughness: 0.15,
      metalness: 0.2,
      transparent: true,
      opacity: 0.88
    });
    const itemBoxInstanced = new THREE.InstancedMesh(itemBoxGeom, itemBoxMat, itemBoxTSpots.length);
    scene.add(itemBoxInstanced);

    const rainbowColors = ['#ff4d6d', '#fbbf24', '#38bdf8', '#4ade80', '#c084fc'];
    itemBoxTSpots.forEach((t, idx) => {
      const s = getTrackSampleAt(t);
      const laneOffset = (idx % 2 === 0) ? -1.05 : 1.05;
      const pos = s.pt.clone().addScaledVector(s.right, laneOffset);
      pos.y += 0.62;
      itemBoxes.push({
        pos,
        cooldown: 0,
        phase: idx * 0.8
      });
      itemBoxInstanced.setColorAt(idx, new THREE.Color(rainbowColors[idx % rainbowColors.length]));
    });
    if (itemBoxInstanced.instanceColor) itemBoxInstanced.instanceColor.needsUpdate = true;

    function updateItemBoxes(elapsed, dt) {
      for (let i = 0; i < itemBoxes.length; i++) {
        const box = itemBoxes[i];
        if (box.cooldown > 0) {
          box.cooldown = Math.max(0, box.cooldown - dt);
          tempMatrix.makeScale(0, 0, 0);
          itemBoxInstanced.setMatrixAt(i, tempMatrix);
        } else {
          tempPos.set(box.pos.x, box.pos.y + Math.sin(elapsed * 3.2 + box.phase) * 0.14, box.pos.z);
          tempEuler.set(elapsed * 1.8 + box.phase, elapsed * 2.4 + box.phase, elapsed * 1.1);
          tempQuat.setFromEuler(tempEuler);
          tempScale.set(1, 1, 1);
          tempMatrix.compose(tempPos, tempQuat, tempScale);
          itemBoxInstanced.setMatrixAt(i, tempMatrix);
        }
      }
      itemBoxInstanced.instanceMatrix.needsUpdate = true;
    }

    // ============================================================================
    // 7. POOLED PARTICLE SYSTEM (Drift Sparks, Squeeze Pop, Confetti, Explosions)
    // ============================================================================
    const MAX_PARTICLES = 240;
    const particles = [];
    const particleGeom = new THREE.BoxGeometry(0.14, 0.14, 0.14);
    const particleMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const particleMesh = new THREE.InstancedMesh(particleGeom, particleMat, MAX_PARTICLES);
    for (let i = 0; i < MAX_PARTICLES; i++) {
      particles.push({
        active: false,
        pos: new THREE.Vector3(),
        vel: new THREE.Vector3(),
        life: 0,
        maxLife: 1,
        gravity: 9.0,
        scale: 1,
        color: new THREE.Color('#ffffff')
      });
      tempMatrix.makeScale(0, 0, 0);
      particleMesh.setMatrixAt(i, tempMatrix);
    }
    scene.add(particleMesh);

    function emitParticle(origin, vel, colorHex, maxLife = 0.45, scale = 1.0, gravity = 9.0) {
      for (let i = 0; i < MAX_PARTICLES; i++) {
        const p = particles[i];
        if (!p.active) {
          p.active = true;
          p.pos.copy(origin);
          p.vel.copy(vel);
          p.life = 0;
          p.maxLife = maxLife;
          p.scale = scale;
          p.gravity = gravity;
          p.color.set(colorHex);
          particleMesh.setColorAt(i, p.color);
          if (particleMesh.instanceColor) particleMesh.instanceColor.needsUpdate = true;
          return;
        }
      }
    }

    function spawnSqueezeSparkles(origin, accentHex) {
      const palette = [accentHex, '#ff85a1', '#fde047', '#ffffff'];
      for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2 + Math.random() * 0.3;
        const speed = 2.4 + Math.random() * 2.2;
        emitParticle(
          origin.clone().add(new THREE.Vector3(0, 0.85, 0)),
          new THREE.Vector3(Math.cos(angle) * speed, 2.8 + Math.random() * 2.2, Math.sin(angle) * speed),
          palette[i % palette.length],
          0.5,
          1.1,
          8.5
        );
      }
    }

    function updateParticles(dt) {
      let dirty = false;
      for (let i = 0; i < MAX_PARTICLES; i++) {
        const p = particles[i];
        if (!p.active) continue;
        dirty = true;
        p.life += dt;
        if (p.life >= p.maxLife) {
          p.active = false;
          tempMatrix.makeScale(0, 0, 0);
          particleMesh.setMatrixAt(i, tempMatrix);
          continue;
        }
        p.vel.y -= p.gravity * dt;
        p.pos.addScaledVector(p.vel, dt);
        if (p.pos.y < 0.1) {
          p.pos.y = 0.1;
          p.vel.y = Math.abs(p.vel.y) * 0.4;
        }
        const s = p.scale * (1.0 - (p.life / p.maxLife));
        tempEuler.set(p.life * 9, p.life * 7, 0);
        tempQuat.setFromEuler(tempEuler);
        tempScale.set(s, s, s);
        tempMatrix.compose(p.pos, tempQuat, tempScale);
        particleMesh.setMatrixAt(i, tempMatrix);
      }
      if (dirty) particleMesh.instanceMatrix.needsUpdate = true;
    }

    // ============================================================================
    // 8. VOXEL FUMO BUILDER (Authentic 'ᗜˬᗜ' Plushies + Kart Builder)
    // ============================================================================
    const allInteractiveMeshes = [];
    const allFumos = [];

    class VoxelFumo {
      constructor(config) {
        this.id = config.id;
        this.name = config.name;
        this.emoji = config.emoji || '🎀';
        this.accentColor = config.accentColor || '#ef4444';
        this.scaleFactor = config.scale || 1.0;
        this.FV = 0.064 * this.scaleFactor; // Scaled to fit karts & diorama
        this.pitchAudio = config.pitchAudio || 1.0;
        this.role = config.role || 'spectator'; // 'driver' | 'spectator' | 'flag' | 'napping' | 'drone'
        this.kart = null;

        this.homePos = (config.homePos || new THREE.Vector3()).clone();
        this.homeYaw = config.homeYaw || 0;
        this.pos = this.homePos.clone();
        this.vel = new THREE.Vector3();
        this.yaw = this.homeYaw;
        this.pitch = config.initialPitch || 0;
        this.roll = config.initialRoll || 0;
        this.angVel = new THREE.Vector3();
        this.isGrounded = true;
        this.isDragged = false;

        // Soft-body spring states
        this.squash = 1.0;
        this.squashVel = 0.0;
        this.headPitch = 0.0;
        this.headRoll = 0.0;
        this.headPitchVel = 0.0;
        this.headRollVel = 0.0;
        this.limbPitch = 0.0;
        this.limbRoll = 0.0;
        this.limbPitchVel = 0.0;
        this.limbRollVel = 0.0;

        this.root = new THREE.Group();
        this.squashGroup = new THREE.Group();
        this.root.add(this.squashGroup);

        this.headPivot = new THREE.Group();
        this.headPivot.position.set(0, 7.2 * this.FV, 0);
        this.squashGroup.add(this.headPivot);

        this.leftArmPivot = new THREE.Group();
        this.leftArmPivot.position.set(-4.2 * this.FV, 6.2 * this.FV, 0.5 * this.FV);
        this.squashGroup.add(this.leftArmPivot);

        this.rightArmPivot = new THREE.Group();
        this.rightArmPivot.position.set(4.2 * this.FV, 6.2 * this.FV, 0.5 * this.FV);
        this.squashGroup.add(this.rightArmPivot);

        this.leftLegPivot = new THREE.Group();
        this.leftLegPivot.position.set(-2.3 * this.FV, 1.8 * this.FV, 3.2 * this.FV);
        this.squashGroup.add(this.leftLegPivot);

        this.rightLegPivot = new THREE.Group();
        this.rightLegPivot.position.set(2.3 * this.FV, 1.8 * this.FV, 3.2 * this.FV);
        this.squashGroup.add(this.rightLegPivot);

        this.wingsPivot = new THREE.Group();
        this.wingsPivot.position.set(0, 4.8 * this.FV, -3.5 * this.FV);
        this.squashGroup.add(this.wingsPivot);

        this.buildCharacterVoxels(config);
        allFumos.push(this);

        if (this.role !== 'driver') {
          scene.add(this.root);
          this.syncTransform(0);
        }
      }

      buildCharacterVoxels(cfg) {
        const bodyVoxels = [];
        const headVoxels = [];
        const leftArmVoxels = [];
        const rightArmVoxels = [];
        const leftLegVoxels = [];
        const rightLegVoxels = [];
        const wingSolidVoxels = [];
        const wingGlowVoxels = [];

        const skinBase = '#ffe5d4';
        const blushCol = '#ff9ebb';
        const smileCol = '#4a2525';

        const addPlushVoxel = (arr, x, y, z, col, isSeam = false) => {
          const seamDarken = (isSeam && ((Math.abs(x + y + z) % 2) === 0)) ? 0.055 : 0;
          arr.push({
            x, y, z,
            color: varyColor(col, x + this.id.length * 7, y, z, 0.04, seamDarken)
          });
        };

        // 1. STUBBY SITTING TORSO
        for (let y = 0; y <= 7; y++) {
          const rMax = (y === 0 || y === 7) ? 3.4 : 4.2 - (y * 0.12);
          for (let x = -4; x <= 4; x++) {
            for (let z = -3; z <= 3; z++) {
              const dist = Math.hypot(x, z * 1.15);
              if (dist > rMax) continue;

              const isSideSeam = (z === 0 && Math.abs(x) >= rMax - 0.9);
              let col = cfg.outfitMain;

              if (y === 1 && z >= 1) col = '#ffffff';
              if (cfg.hasWhiteApron && z >= 1 && Math.abs(x) <= 2 && y <= 5) {
                col = '#fcfcfc';
              }
              if (y >= 5 && z >= 2 && Math.abs(x) <= 2) {
                col = '#ffffff';
                if (Math.abs(x) <= 1 && y === 5) col = cfg.tieColor || '#ef4444';
              }
              if (this.id === 'remilia' && z >= 2 && x === 0 && y >= 2 && y <= 6) {
                col = '#d90429';
              }
              if (this.id === 'flandre' && z >= 2 && Math.abs(x) === 1 && y === 4) {
                col = '#fde047';
              }
              if (this.id === 'nitori' && z >= 2 && Math.abs(x) <= 1 && y >= 2 && y <= 4) {
                col = '#38bdf8'; // Kappa front pocket detail
              }

              addPlushVoxel(bodyVoxels, x, y + 0.5, z, col, isSideSeam);
            }
          }
        }

        // 2. SHORT DANGLING ARMS (+ Optional Checkered Flag in Right Hand!)
        for (const side of [-1, 1]) {
          const targetArr = side === -1 ? leftArmVoxels : rightArmVoxels;
          for (let y = -3; y <= 0; y++) {
            for (let x = -1; x <= 1; x++) {
              for (let z = -1; z <= 1; z++) {
                if (Math.abs(x) === 1 && Math.abs(z) === 1 && y === -3) continue;
                let col = cfg.sleeveColor || '#ffffff';
                if (y === -3) col = skinBase;
                else if (this.id === 'reimu' && y === -1) col = '#e63946';
                addPlushVoxel(targetArr, x * 0.85 + side * 0.4, y, z * 0.85, col, x === 0);
              }
            }
          }
        }

        if (this.role === 'flag') {
          // Voxel Checkered Flag held up by the Tower Fumo!
          for (let fy = -2; fy <= 9; fy++) {
            addPlushVoxel(rightArmVoxels, 0.8, fy, 1.5, '#cbd5e1');
          }
          for (let fx = 1; fx <= 6; fx++) {
            for (let fy = 4; fy <= 9; fy++) {
              const check = ((fx + fy) % 2 === 0);
              addPlushVoxel(rightArmVoxels, 0.8 + fx * 0.9, fy, 1.5, check ? '#ffffff' : '#111827');
            }
          }
        }

        // 3. SHORT SITTING / DANGLING LEGS WITH SHOES
        for (const side of [-1, 1]) {
          const targetArr = side === -1 ? leftLegVoxels : rightLegVoxels;
          for (let z = 0; z <= 4; z++) {
            for (let x = -1; x <= 1; x++) {
              for (let y = -1; y <= 1; y++) {
                if (Math.abs(x) === 1 && Math.abs(y) === 1) continue;
                let col = '#ffffff';
                if (z === 0) col = skinBase;
                if (z >= 3) col = cfg.shoeColor || '#2b2d42';
                if (z === 4 && y === 1 && x === 0) col = '#ffffff';
                addPlushVoxel(targetArr, x * 0.9, y * 0.9, z * 0.9, col, y === 0);
              }
            }
          }
        }

        // 4. OVERSIZED ROUND FUMO HEAD, ICONIC 'ᗜˬᗜ' FACE, HAIR & HATS
        for (let y = 0; y <= 12; y++) {
          for (let x = -7; x <= 7; x++) {
            for (let z = -6; z <= 6; z++) {
              const dy = (y - 6.0) * 1.05;
              const dx = x * 0.94;
              const dz = z * 1.02;
              const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
              if (dist > 6.4 || dist < 4.5) continue;

              let col = skinBase;
              const isHeadSeam = (z === 0 && Math.abs(x) >= 5);

              const isBackOrTop = (z <= 1) || (y >= 9) || (Math.abs(x) >= 5 && z <= 3);
              const isForeheadBangs = (z >= 4 && y >= 7 && (Math.abs(x) !== 2 || y >= 8));
              const isSideLocks = (Math.abs(x) >= 5 && z >= 2 && y >= 2);

              if (isBackOrTop || isForeheadBangs || isSideLocks) {
                col = cfg.hairColor;
              } else if (z >= 5) {
                if ((Math.abs(x) === 3 || Math.abs(x) === 2) && y >= 4 && y <= 6) {
                  if (y === 6) col = '#1f141e';
                  else if (y === 5 && Math.abs(x) === 2) col = '#ffffff';
                  else col = cfg.eyeColor;
                } else if (Math.abs(x) === 4 && y === 3) {
                  col = blushCol;
                } else if (y === 2 && Math.abs(x) <= 1) {
                  col = (x === 0) ? '#e07a7a' : smileCol;
                }
              }

              addPlushVoxel(headVoxels, x, y, z, col, isHeadSeam);
            }
          }
        }

        // Character-Specific Accessories:
        if (this.id === 'reimu') {
          for (const side of [-1, 1]) {
            for (let y = -1; y <= 5; y++) {
              const tubeCol = (y === 5) ? '#e63946' : ((y >= 1 && y <= 4) ? '#ffffff' : cfg.hairColor);
              addPlushVoxel(headVoxels, side * 6.8, y, 2.2, tubeCol);
              addPlushVoxel(headVoxels, side * 6.8, y, 3.0, tubeCol);
            }
          }
          for (let bx = -7; bx <= 7; bx++) {
            const wingHeight = Math.min(4, Math.floor(Math.abs(bx) * 0.7) + 1);
            for (let by = -wingHeight; by <= wingHeight; by++) {
              addPlushVoxel(headVoxels, bx, 12.2 + by * 0.75, -1.5 - Math.abs(bx) * 0.15, '#d90429');
            }
          }
        }

        if (this.id === 'cirno') {
          for (let bx = -6; bx <= 6; bx++) {
            const h = Math.min(3, Math.floor(Math.abs(bx) * 0.65) + 1);
            for (let by = -h; by <= h; by++) {
              addPlushVoxel(headVoxels, bx, 10.5 + by * 0.75, -4.8, '#1d4ed8');
            }
          }
          const wingAngles = [0.45, 0.05, -0.35];
          for (const side of [-1, 1]) {
            for (let w = 0; w < 3; w++) {
              const ang = wingAngles[w];
              for (let r = 1; r <= 7; r++) {
                const wx = side * (1.2 + Math.cos(ang) * r * 1.05);
                const wy = 1.0 + Math.sin(ang) * r * 1.05;
                const wz = -0.5 - r * 0.15;
                wingGlowVoxels.push({
                  x: wx, y: wy, z: wz,
                  color: varyColor(r > 5 ? '#e0f2fe' : '#38bdf8', wx, wy, wz, 0.02),
                  sx: 1.1, sy: 0.85, sz: 0.6
                });
              }
            }
          }
        }

        if (this.id === 'marisa') {
          for (let y = -1; y <= 5; y++) {
            addPlushVoxel(headVoxels, -6.6, y, 2.8, y === 0 ? '#ffffff' : cfg.hairColor);
          }
          for (let hx = -10; hx <= 10; hx++) {
            for (let hz = -10; hz <= 10; hz++) {
              const r = Math.hypot(hx, hz);
              if (r <= 10.2 && r >= 4.2) {
                const brimY = 10.2 - hz * 0.22 + Math.sin(Math.atan2(hz, hx) * 4) * 0.4;
                addPlushVoxel(headVoxels, hx, brimY, hz - 1.2, '#22222b');
              }
            }
          }
          for (let ch = 0; ch <= 8; ch++) {
            const coneR = Math.max(0.8, 5.2 - ch * 0.55);
            for (let hx = -6; hx <= 6; hx++) {
              for (let hz = -6; hz <= 6; hz++) {
                const r = Math.hypot(hx, hz);
                if (r <= coneR && r >= coneR - 1.3) {
                  const isRibbon = (ch === 1 || ch === 2);
                  addPlushVoxel(headVoxels, hx, 10.8 + ch * 0.9 - hz * 0.18, hz - 1.5 - ch * 0.28, isRibbon ? '#f8f9fa' : '#22222b');
                }
              }
            }
          }
          for (let bx = -3; bx <= 3; bx++) {
            addPlushVoxel(headVoxels, bx, 11.8, 3.8, '#ffffff');
          }
        }

        if (this.id === 'flandre') {
          for (let py = 2; py <= 7; py++) {
            addPlushVoxel(headVoxels, -7.2 - (7 - py) * 0.3, py, 0.5, py === 6 ? '#e63946' : cfg.hairColor);
          }
          for (let hx = -7; hx <= 7; hx++) {
            for (let hz = -7; hz <= 5; hz++) {
              const r = Math.hypot(hx, hz);
              if (r <= 6.8 && r >= 4.8) {
                addPlushVoxel(headVoxels, hx, 11.2, hz, '#ffe5ec');
                addPlushVoxel(headVoxels, hx, 12.1, hz * 0.85, '#e63946');
                addPlushVoxel(headVoxels, hx * 0.8, 12.9, hz * 0.75, '#ffe5ec');
              }
            }
          }
          const crystalColors = ['#38bdf8', '#3b82f6', '#a855f7', '#ec4899', '#f97316', '#fde047', '#4ade80', '#ef4444'];
          for (const side of [-1, 1]) {
            for (let rx = 1; rx <= 9; rx++) {
              const branchY = 2.5 + (rx <= 4 ? rx * 0.45 : (4 * 0.45 - (rx - 4) * 0.35));
              wingSolidVoxels.push({
                x: side * rx, y: branchY, z: -0.5,
                color: new THREE.Color('#1e1b24'),
                sx: 0.9, sy: 0.65, sz: 0.65
              });
              if (rx % 2 === 0 && rx <= 8) {
                const cIdx = (side === -1 ? (rx / 2 - 1) : (3 + rx / 2));
                const cHex = crystalColors[cIdx % 8];
                for (let cy = -2; cy <= 0; cy++) {
                  const width = (cy === -1) ? 1.35 : 0.75;
                  wingGlowVoxels.push({
                    x: side * (rx + 0.3),
                    y: branchY - 1.1 + cy * 0.95,
                    z: -0.5,
                    color: new THREE.Color(cHex),
                    sx: width, sy: 0.95, sz: 0.75
                  });
                }
              }
            }
          }
        }

        if (this.id === 'sakuya') {
          for (const side of [-1, 1]) {
            for (let y = -2; y <= 5; y++) {
              const col = (y <= -1) ? '#22c55e' : cfg.hairColor;
              addPlushVoxel(headVoxels, side * 6.5, y, 3.2, col);
            }
          }
          for (let hx = -6; hx <= 6; hx++) {
            addPlushVoxel(headVoxels, hx, 11.8, 1.8 - Math.abs(hx) * 0.15, Math.abs(hx) === 6 ? '#22c55e' : '#ffffff');
            addPlushVoxel(headVoxels, hx, 12.5, 1.5 - Math.abs(hx) * 0.15, '#ffffff');
          }
        }

        if (this.id === 'youmu') {
          // Black half-phantom ribbon on right side of silver bob
          for (let bx = -5; bx <= -2; bx++) {
            for (let by = 9; by <= 12; by++) {
              addPlushVoxel(headVoxels, bx, by, 2.2, '#1e293b');
            }
          }
          // Floating white Myon phantom puff beside her!
          for (let mx = -1; mx <= 1; mx++) {
            for (let my = -1; my <= 1; my++) {
              for (let mz = -1; mz <= 1; mz++) {
                if (Math.hypot(mx, my, mz) <= 1.5) {
                  wingGlowVoxels.push({
                    x: 6.2 + mx * 0.9, y: 4.5 + my * 0.9, z: 1.5 + mz * 0.9,
                    color: new THREE.Color('#f8fafc')
                  });
                }
              }
            }
          }
        }

        if (this.id === 'nitori') {
          // Twin side ponytails with yellow ties
          for (const side of [-1, 1]) {
            for (let py = 1; py <= 5; py++) {
              addPlushVoxel(headVoxels, side * 6.8, py, 1.0, py === 4 ? '#facc15' : cfg.hairColor);
            }
          }
          // Green Kappa Cap with yellow bill & dome button
          for (let hx = -7; hx <= 7; hx++) {
            for (let hz = -6; hz <= 7; hz++) {
              const r = Math.hypot(hx, hz);
              if (r <= 6.8 && r >= 4.2) {
                addPlushVoxel(headVoxels, hx, 10.8, hz, hz >= 5 ? '#facc15' : '#22c55e');
                if (r <= 5.6) addPlushVoxel(headVoxels, hx, 11.8, hz, '#16a34a');
              }
            }
          }
          addPlushVoxel(headVoxels, 0, 12.7, 0, '#facc15');

          // Huge Kappa-Tech Backpack with twin brass gears & cyan energy core!
          for (let bx = -4; bx <= 4; bx++) {
            for (let by = -2; by <= 5; by++) {
              for (let bz = -4; bz <= 0; bz++) {
                let bCol = '#475569';
                if (Math.abs(bx) === 4 || by === 5) bCol = '#64748b';
                if (bz === -4 && Math.abs(bx) <= 1 && by >= 0 && by <= 3) {
                  wingGlowVoxels.push({
                    x: bx, y: by, z: bz - 0.3,
                    color: new THREE.Color('#22d3ee')
                  });
                  continue;
                }
                wingSolidVoxels.push({
                  x: bx, y: by, z: bz,
                  color: varyColor(bCol, bx, by, bz, 0.03)
                });
              }
            }
          }
          // Twin side turbines on the huge backpack
          for (const side of [-1, 1]) {
            for (let ty = -1; ty <= 4; ty++) {
              wingSolidVoxels.push({
                x: side * 5.2, y: ty, z: -2.0,
                color: new THREE.Color(ty === 4 ? '#f59e0b' : '#334155'),
                sx: 1.4, sy: 1.0, sz: 1.4
              });
            }
          }
        }

        if (this.id === 'remilia') {
          for (let hx = -8; hx <= 8; hx++) {
            for (let hz = -7; hz <= 6; hz++) {
              const r = Math.hypot(hx, hz);
              if (r <= 7.4 && r >= 4.5) {
                addPlushVoxel(headVoxels, hx, 11.0, hz, '#ffc2d1');
                if (r <= 6.4) addPlushVoxel(headVoxels, hx, 12.0, hz, '#d90429');
              }
            }
          }
        }

        if (this.id === 'suwako') {
          for (let hx = -7; hx <= 7; hx++) {
            for (let hz = -6; hz <= 6; hz++) {
              const r = Math.hypot(hx, hz);
              if (r <= 6.8 && r >= 4.2) {
                addPlushVoxel(headVoxels, hx, 10.8, hz, '#a3b18a');
              }
            }
          }
          for (const side of [-1, 1]) {
            addPlushVoxel(headVoxels, side * 3.5, 12.4, 3.2, '#ffffff');
            addPlushVoxel(headVoxels, side * 3.5, 12.4, 3.8, '#1e293b');
          }
        }

        if (this.role === 'drone') {
          // Quad-rotor voxel camera drone frame carrying the Fumo!
          for (let arm = -10; arm <= 10; arm++) {
            wingSolidVoxels.push({ x: arm, y: -3.5, z: arm, color: new THREE.Color('#1e293b') });
            wingSolidVoxels.push({ x: arm, y: -3.5, z: -arm, color: new THREE.Color('#1e293b') });
          }
          for (const sx of [-10, 10]) {
            for (const sz of [-10, 10]) {
              wingGlowVoxels.push({ x: sx, y: -2.8, z: sz, color: new THREE.Color('#38bdf8'), sx: 3.5, sy: 0.4, sz: 3.5 });
            }
          }
        }

        const registerPart = (voxels, parent, mat = plushMaterial) => {
          const m = buildVoxelInstancedMesh(voxels, this.FV, mat, true, true);
          if (m) {
            m.userData.fumo = this;
            parent.add(m);
            allInteractiveMeshes.push(m);
          }
          return m;
        };

        registerPart(bodyVoxels, this.squashGroup);
        registerPart(headVoxels, this.headPivot);
        registerPart(leftArmVoxels, this.leftArmPivot);
        registerPart(rightArmVoxels, this.rightArmPivot);
        registerPart(leftLegVoxels, this.leftLegPivot);
        registerPart(rightLegVoxels, this.rightLegPivot);
        registerPart(wingSolidVoxels, this.wingsPivot);
        if (wingGlowVoxels.length > 0) {
          const wMat = (this.id === 'cirno') ? translucentIceMaterial : crystalWingMaterial;
          registerPart(wingGlowVoxels, this.wingsPivot, wMat);
        }
      }

      squeeze(strength = 1.0) {
        this.squash = Math.max(0.5, this.squash - 0.44 * strength);
        this.squashVel = -3.8 * strength;
        this.headPitchVel += (Math.random() - 0.5) * 15 * strength;
        this.headRollVel += (Math.random() > 0.5 ? 1 : -1) * 12 * strength;
        this.limbPitch = -0.65 * strength;
        this.limbPitchVel = -6.0 * strength;
        const worldPos = new THREE.Vector3();
        this.root.getWorldPosition(worldPos);
        spawnSqueezeSparkles(worldPos, this.accentColor);
        soundFX.playSqueeze(this.pitchAudio);
      }

      updateSpringsAndPhysics(dt, elapsed) {
        // 1. Volume-Preserving Squash & Stretch Spring
        const squashStiff = 210.0;
        const squashDamp = 11.0;
        this.squashVel += ((1.0 - this.squash) * squashStiff - this.squashVel * squashDamp) * dt;
        this.squash = THREE.MathUtils.clamp(this.squash + this.squashVel * dt, 0.45, 1.55);

        // 2. Oversized Head Wobble Spring
        const headStiff = 145.0;
        const headDamp = 7.2;
        const idleBob = Math.sin(elapsed * 2.5 + this.homePos.x) * 0.03;
        this.headPitchVel += ((idleBob - this.headPitch) * headStiff - this.headPitchVel * headDamp) * dt;
        this.headRollVel += ((0 - this.headRoll) * headStiff - this.headRollVel * headDamp) * dt;
        this.headPitch = THREE.MathUtils.clamp(this.headPitch + this.headPitchVel * dt, -0.55, 0.55);
        this.headRoll = THREE.MathUtils.clamp(this.headRoll + this.headRollVel * dt, -0.55, 0.55);

        // 3. Dangling Limb Springs
        const targetLimb = (this.isDragged || !this.isGrounded) ? 0.58 : 0.0;
        this.limbPitchVel += ((targetLimb - this.limbPitch) * 120.0 - this.limbPitchVel * 8.0) * dt;
        this.limbRollVel += ((0 - this.limbRoll) * 120.0 - this.limbRollVel * 8.0) * dt;
        this.limbPitch = THREE.MathUtils.clamp(this.limbPitch + this.limbPitchVel * dt, -0.8, 0.9);
        this.limbRoll = THREE.MathUtils.clamp(this.limbRoll + this.limbRollVel * dt, -0.6, 0.6);

        // If this fumo is a standalone spectator / tower / napping / drone fumo:
        if (this.role !== 'driver') {
          if (this.role === 'drone' && !this.isDragged) {
            // Orbit smoothly overhead filming the race!
            const droneAngle = elapsed * 0.45;
            this.pos.set(Math.cos(droneAngle) * 9.5, 6.2 + Math.sin(elapsed * 2.2) * 0.35, Math.sin(droneAngle) * 7.5);
            this.yaw = -droneAngle + Math.PI;
          } else if (!this.isDragged) {
            // Cheering bounce for grandstand spectators
            if (this.role === 'spectator' && this.isGrounded && Math.sin(elapsed * 4.5 + this.homePos.x * 3) > 0.92) {
              this.vel.y = 3.2;
              this.isGrounded = false;
              this.squashVel -= 2.2;
            }
            if (this.role === 'flag' && this.isGrounded) {
              this.rightArmPivot.rotation.z = -0.7 + Math.sin(elapsed * 6.5) * 0.45;
            }

            this.vel.y -= 22.0 * dt;
            this.vel.multiplyScalar(Math.pow(0.98, dt * 60));
            this.pos.addScaledVector(this.vel, dt);

            this.yaw += this.angVel.y * dt;
            this.pitch += this.angVel.x * dt;
            this.roll += this.angVel.z * dt;
            this.angVel.multiplyScalar(Math.pow(0.92, dt * 60));

            // Floor / Home perch landing
            const nearHomeXZ = Math.hypot(this.pos.x - this.homePos.x, this.pos.z - this.homePos.z) < 1.6;
            const supportY = nearHomeXZ ? this.homePos.y : 0.35;

            if (this.pos.y <= supportY) {
              const impact = -this.vel.y;
              this.pos.y = supportY;
              if (impact > 1.8) {
                this.vel.y = impact * 0.42;
                this.squashVel -= Math.min(8.0, impact * 0.85);
                soundFX.playBump(impact * 0.08);
              } else {
                this.vel.y = 0;
                this.isGrounded = true;
              }
              this.vel.x *= 0.8;
              this.vel.z *= 0.8;
            }

            if (this.isGrounded) {
              const targetPitch = (this.role === 'napping') ? -1.25 : 0;
              this.pitch = THREE.MathUtils.lerp(this.pitch, targetPitch, Math.min(1, dt * 8));
              this.roll = THREE.MathUtils.lerp(this.roll, 0, Math.min(1, dt * 8));
            }
          }
          this.syncTransform(elapsed);
        } else {
          // Driver inside a kart: sync local squash, head wobble & steering arms
          const sy = this.squash;
          const sxz = 1.0 / Math.sqrt(Math.max(0.35, sy));
          this.squashGroup.scale.set(sxz, sy, sxz);
          this.headPivot.rotation.set(this.headPitch, 0, this.headRoll);
          this.leftArmPivot.rotation.set(-0.45 + this.limbPitch, 0, 0.15 + this.limbRoll);
          this.rightArmPivot.rotation.set(-0.45 + this.limbPitch, 0, -0.15 + this.limbRoll);
          this.leftLegPivot.rotation.set(this.limbPitch * 0.6, 0.08, 0);
          this.rightLegPivot.rotation.set(this.limbPitch * 0.6, -0.08, 0);
          this.wingsPivot.rotation.x = Math.sin(elapsed * 4.2 + this.homePos.x) * 0.07 + (1.0 - this.squash) * 0.35;
        }
      }

      syncTransform(elapsed) {
        this.root.position.copy(this.pos);
        this.root.rotation.order = 'YXZ';
        this.root.rotation.set(this.pitch, this.yaw, this.roll);

        const sy = this.squash;
        const sxz = 1.0 / Math.sqrt(Math.max(0.35, sy));
        this.squashGroup.scale.set(sxz, sy, sxz);
        this.headPivot.rotation.set(this.headPitch, 0, this.headRoll);

        if (this.role !== 'flag') {

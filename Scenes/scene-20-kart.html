          this.leftArmPivot.rotation.set(this.limbPitch, 0, 0.18 + Math.abs(this.limbPitch) * 0.35 + this.limbRoll);
          this.rightArmPivot.rotation.set(this.limbPitch, 0, -0.18 - Math.abs(this.limbPitch) * 0.35 + this.limbRoll);
        }
        this.leftLegPivot.rotation.set(this.limbPitch * 1.15, 0.08, this.limbRoll * 0.5);
        this.rightLegPivot.rotation.set(this.limbPitch * 1.15, -0.08, this.limbRoll * 0.5);
        this.wingsPivot.rotation.x = Math.sin(elapsed * 3.8 + this.homePos.x) * 0.06 + (1.0 - this.squash) * 0.35;
      }
    }

    // ============================================================================
    // 9. VOXEL KART BUILDER & ARCADE RACING CLASS
    // ============================================================================
    const karts = [];

    class VoxelKart {
      constructor(driverConfig, index, isPlayer = false) {
        this.index = index;
        this.isPlayer = isPlayer;
        this.id = driverConfig.id;
        this.name = driverConfig.name;
        this.emoji = driverConfig.emoji;
        this.accentColor = driverConfig.accentColor;

        this.root = new THREE.Group();
        this.squashGroup = new THREE.Group();
        this.root.add(this.squashGroup);

        // Instantiate the Fumo Driver and seat them in the kart!
        driverConfig.role = 'driver';
        this.driver = new VoxelFumo(driverConfig);
        this.driver.kart = this;
        this.driver.root.position.set(0, 0.32, -0.08);
        this.squashGroup.add(this.driver.root);

        this.buildKartVoxels(driverConfig);

        // Frozen Ice Block Cube (visible when hit by an Ice Bullet!)
        const iceCubeGeom = new THREE.BoxGeometry(1.55, 1.75, 1.85);
        this.iceCubeMesh = new THREE.Mesh(iceCubeGeom, translucentIceMaterial);
        this.iceCubeMesh.position.set(0, 0.85, 0);
        this.iceCubeMesh.visible = false;
        this.squashGroup.add(this.iceCubeMesh);

        // Rotating Hakurei Shield Barrier (visible when Shield item is active!)
        this.shieldGroup = new THREE.Group();
        this.shieldGroup.visible = false;
        for (let s = 0; s < 4; s++) {
          const orb = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.28, 0.28), boostPadMaterial);
          const ang = (s / 4) * Math.PI * 2;
          orb.position.set(Math.cos(ang) * 1.15, 0.65, Math.sin(ang) * 1.15);
          this.shieldGroup.add(orb);
        }
        this.squashGroup.add(this.shieldGroup);

        scene.add(this.root);
        this.resetForRace();
      }

      buildKartVoxels(cfg) {
        const KV = 0.085;
        const chassisVoxels = [];
        const lightVoxels = [];

        if (cfg.kartStyle === 'broom') {
          // MARISA'S BROOM-SHAPED KART: Long wooden broom shaft nose, golden star bristles at rear, compact black/gold side pods & wheels!
          for (let z = -8; z <= 10; z++) {
            const r = (z < -4) ? 2.6 : 1.3;
            for (let x = -Math.ceil(r); x <= Math.ceil(r); x++) {
              for (let y = 1; y <= 3; y++) {
                if (Math.hypot(x, y - 2) <= r) {
                  let col = '#7f5539'; // Wooden broom handle
                  if (z <= -4) col = (z === -4) ? '#dc2626' : '#facc15'; // Golden straw bristles & red tie!
                  chassisVoxels.push({ x, y, z, color: varyColor(col, x, y, z, 0.03) });
                }
              }
            }
          }
          // Witch-gold side fenders & seat saddle
          for (let x = -4; x <= 4; x++) {
            for (let z = -3; z <= 3; z++) {
              chassisVoxels.push({ x, y: 2, z, color: varyColor('#1e293b', x, 2, z, 0.02) });
              if (Math.abs(x) === 4) {
                chassisVoxels.push({ x, y: 3, z, color: new THREE.Color('#facc15') });
              }
            }
          }
        } else {
          // STANDARD / KAPPA-TECH / CRYSTAL VOXEL KART CHASSIS
          for (let x = -5; x <= 5; x++) {
            for (let z = -6; z <= 7; z++) {
              for (let y = 1; y <= 4; y++) {
                // Cockpit cutout for the Fumo driver
                if (Math.abs(x) <= 3 && z >= -3 && z <= 2 && y >= 3) continue;
                // Tapered front nose cone
                if (z >= 5 && Math.abs(x) >= 4) continue;
                if (y === 4 && z < 3 && z > -4) continue;

                let col = cfg.kartBodyColor;
                if (y === 1) col = '#1e293b';
                else if (Math.abs(x) === 5 || (y === 3 && Math.abs(x) <= 1 && z >= 3)) {
                  col = cfg.kartTrimColor; // Racing stripe & side skirts
                }
                chassisVoxels.push({ x, y, z, color: varyColor(col, x, y, z, 0.025) });
              }
            }
          }

          // Steering Wheel Column
          chassisVoxels.push({ x: 0, y: 4.5, z: 2.8, color: new THREE.Color('#334155'), sx: 0.7, sy: 2.2, sz: 0.7 });
          chassisVoxels.push({ x: 0, y: 5.4, z: 2.2, color: new THREE.Color('#0f172a'), sx: 2.2, sy: 2.2, sz: 0.5 });

          // Twin Rear Exhaust Pipes
          for (const side of [-1, 1]) {
            chassisVoxels.push({ x: side * 2.5, y: 3.5, z: -6.8, color: new THREE.Color('#94a3b8'), sx: 1.3, sy: 1.3, sz: 2.0 });
          }

          // Extra Kappa-Tech Front Dozer/Gears on Nitori's Kart
          if (this.id === 'nitori') {
            for (let x = -4; x <= 4; x += 2) {
              chassisVoxels.push({ x, y: 2, z: 8, color: new THREE.Color('#f59e0b'), sx: 1.3, sy: 1.5, sz: 1.2 });
            }
          }
        }

        // 4 chunky Voxel Racing Tires
        const wheelPositions = [
          [-5.6, 2.0, 4.5], [5.6, 2.0, 4.5],
          [-5.8, 2.2, -4.2], [5.8, 2.2, -4.2]
        ];
        wheelPositions.forEach(([wx, wy, wz]) => {
          for (let dy = -1; dy <= 1; dy++) {
            for (let dz = -1; dz <= 1; dz++) {
              const isHub = (dy === 0 && dz === 0);
              chassisVoxels.push({
                x: wx, y: wy + dy * 0.9, z: wz + dz * 0.9,
                color: new THREE.Color(isHub ? cfg.kartTrimColor : '#111827'),
                sx: 1.6, sy: 1.0, sz: 1.0
              });
            }
          }
        });

        // Glowing Headlights & Taillights
        for (const side of [-1, 1]) {
          lightVoxels.push({ x: side * 2.5, y: 3.2, z: 7.4, color: new THREE.Color('#fef08a'), sx: 1.2, sy: 0.9, sz: 0.6 });
          lightVoxels.push({ x: side * 3.5, y: 3.0, z: -6.4, color: new THREE.Color('#ef4444'), sx: 1.2, sy: 0.8, sz: 0.6 });
        }

        const cMesh = buildVoxelInstancedMesh(chassisVoxels, KV, glossyMaterial, true, true);
        const lMesh = buildVoxelInstancedMesh(lightVoxels, KV, neonEmissiveMaterial, false, false);
        if (cMesh) {
          cMesh.userData.fumo = this.driver;
          this.squashGroup.add(cMesh);
          allInteractiveMeshes.push(cMesh);
        }
        if (lMesh) {
          lMesh.userData.fumo = this.driver;
          this.squashGroup.add(lMesh);
        }
      }

      resetForRace() {
        // Staggered starting grid just behind the Start/Finish Arch (t around 0.96 .. 0.01)
        const startT = (1.01 - this.index * 0.011) % 1.0;
        const lane = ((this.index % 2 === 0) ? -0.95 : 0.95) * (this.index === 0 ? 0 : 1);
        const sample = getTrackSampleAt(startT);

        this.trackT = startT;
        this.totalProgress = -this.index * 0.011;
        this.lap = 1;
        this.finished = false;
        this.finishRank = 0;

        this.pos = sample.pt.clone().addScaledVector(sample.right, lane);
        this.vel = new THREE.Vector3();
        this.heading = Math.atan2(sample.tan.x, sample.tan.z);
        this.speed = 0;
        this.verticalVel = 0;
        this.heightOffset = 0;

        this.isDrifting = false;
        this.driftDir = 0;
        this.driftCharge = 0;
        this.boostTimer = 0;
        this.freezeTimer = 0;
        this.shieldTimer = 0;
        this.spinAngle = 0;

        this.heldItem = null; // 'mushroom' | 'ice' | 'bomb' | 'shield'
        this.aiTargetLane = (Math.random() - 0.5) * 3.0;
        this.aiLaneTimer = 1.5 + Math.random() * 2.5;
        this.baseAiSpeed = 12.6 + (this.index % 3) * 0.35;

        this.driver.isDragged = false;
        this.driver.squash = 1.0;
        this.driver.squashVel = 0;
        this.syncKartTransform(0);
      }

      syncKartTransform(elapsed) {
        this.root.position.copy(this.pos);
        this.root.position.y += this.heightOffset;

        const driftYawOffset = this.isDrifting ? this.driftDir * 0.32 : 0;
        this.root.rotation.order = 'YXZ';
        this.root.rotation.set(
          this.driver.pitch,
          this.heading + driftYawOffset + this.spinAngle,
          this.driver.roll
        );

        const sy = this.driver.squash;
        const sxz = 1.0 / Math.sqrt(Math.max(0.4, sy));
        this.squashGroup.scale.set(sxz, sy, sxz);

        this.iceCubeMesh.visible = this.freezeTimer > 0;
        this.shieldGroup.visible = this.shieldTimer > 0;
        if (this.shieldTimer > 0) {
          this.shieldGroup.rotation.y = elapsed * 5.5;
        }

    function spawnProjectile(ownerKart, type) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.45, 0.45, 0.45),
        type === 'ice' ? translucentIceMaterial : boostPadMaterial
      );
      const forward = new THREE.Vector3(Math.sin(ownerKart.heading), 0, Math.cos(ownerKart.heading));
      const startPos = ownerKart.pos.clone().addScaledVector(forward, 1.35);
      startPos.y += 0.55;
      mesh.position.copy(startPos);
      projectileGroup.add(mesh);

      activeProjectiles.push({
        type,
        owner: ownerKart,
        mesh,
        pos: startPos,
        vel: forward.multiplyScalar(25.0).add(new THREE.Vector3(0, type === 'bomb' ? 6.5 : 0, 0)),
        life: 0,
        maxLife: 2.6
      });
    }

    function updateProjectiles(dt) {
      for (let i = activeProjectiles.length - 1; i >= 0; i--) {
        const p = activeProjectiles[i];
        p.life += dt;
        if (p.type === 'bomb') {
          p.vel.y -= 14.0 * dt;
        }
        p.pos.addScaledVector(p.vel, dt);

        // Keep ice bullet following track height
        const sample = findClosestTrackSample(p.pos);
        if (p.type === 'ice') {
          p.pos.y = sample.pt.y + 0.45;
        } else if (p.pos.y <= sample.pt.y + 0.25) {
          // Star bomb detonates on impact!
          detonateStarBomb(p.pos, p.owner);
          projectileGroup.remove(p.mesh);
          activeProjectiles.splice(i, 1);
          continue;
        }

        p.mesh.position.copy(p.pos);
        p.mesh.rotation.x += 8 * dt;
        p.mesh.rotation.y += 10 * dt;

        // Trail particles
        emitParticle(
          p.pos,
          new THREE.Vector3((Math.random() - 0.5) * 1.5, 0.8, (Math.random() - 0.5) * 1.5),
          p.type === 'ice' ? '#38bdf8' : '#fde047',
          0.25,
          0.8,
          2.0
        );

        // Check collision with rival karts
        let hitKart = null;
        for (let k = 0; k < karts.length; k++) {
          const target = karts[k];
          if (target === p.owner) continue;
          if (target.pos.distanceTo(p.pos) < 1.35) {
            hitKart = target;
            break;
          }
        }

        if (hitKart) {
          if (p.type === 'ice') {
            if (hitKart.shieldTimer <= 0) {
              hitKart.freezeTimer = 2.2;
              hitKart.speed *= 0.25;
              hitKart.driver.squeeze(1.1);
            }
            spawnSqueezeSparkles(hitKart.pos, '#38bdf8');
          } else {
            detonateStarBomb(p.pos, p.owner);
          }
          projectileGroup.remove(p.mesh);
          activeProjectiles.splice(i, 1);
          continue;
        }

        if (p.life >= p.maxLife) {
          projectileGroup.remove(p.mesh);
          activeProjectiles.splice(i, 1);
        }
      }
    }

    function detonateStarBomb(origin, owner) {
      soundFX.playBump(1.2);
      const starPalette = ['#ff4d6d', '#fde047', '#38bdf8', '#c084fc', '#4ade80'];
      for (let i = 0; i < 24; i++) {
        const ang = (i / 24) * Math.PI * 2;
        const spd = 4.0 + Math.random() * 5.0;
        emitParticle(
          origin,
          new THREE.Vector3(Math.cos(ang) * spd, 4.0 + Math.random() * 4.5, Math.sin(ang) * spd),
          starPalette[i % starPalette.length],
          0.65,
          1.35,
          9.5
        );
      }
      karts.forEach(k => {
        if (k === owner) return;
        const d = k.pos.distanceTo(origin);
        if (d < 3.6 && k.shieldTimer <= 0) {
          k.verticalVel = 7.5;
          k.speed *= 0.3;
          k.driver.squash = 0.55;
          k.driver.squashVel = -4.5;
          k.spinAngle = Math.PI * 2;
        }
      });
    }

    function updateKartRacePhysics(dt, elapsed) {
      if (!raceFinished) {
        raceElapsed += dt;
      }

      // Celebratory confetti shower when race is finished!
      if (raceFinished && Math.random() < 0.45) {
        const confettiColors = ['#ff4d6d', '#fbbf24', '#38bdf8', '#4ade80', '#c084fc'];
        emitParticle(
          new THREE.Vector3((Math.random() - 0.5) * 5.5, 4.8, 6.2 + (Math.random() - 0.5) * 2.5),
          new THREE.Vector3((Math.random() - 0.5) * 2.0, -0.5, (Math.random() - 0.5) * 2.0),
          confettiColors[Math.floor(Math.random() * confettiColors.length)],
          1.4,
          1.2,
          2.5
        );
      }

      karts.forEach(k => {
        // Update driver soft-body springs
        k.driver.updateSpringsAndPhysics(dt, elapsed);

        // If the player is currently dragging this kart with the mouse, let it dangle in the air!
        if (k.driver.isDragged) {
          k.pos.copy(k.driver.pos);
          k.heightOffset = 0;
          k.syncKartTransform(elapsed);
          return;
        }

        // If on podium after race finish, do happy celebratory bounces!
        if (raceFinished) {
          if (Math.sin(elapsed * 5.0 + k.index) > 0.94 && k.heightOffset <= 0.01) {
            k.verticalVel = 4.2;
            k.driver.squashVel -= 3.0;
          }
          k.verticalVel -= 18.0 * dt;
          k.heightOffset = Math.max(0, k.heightOffset + k.verticalVel * dt);
          k.syncKartTransform(elapsed);
          return;
        }

        // Timers
        if (k.boostTimer > 0) k.boostTimer = Math.max(0, k.boostTimer - dt);
        if (k.freezeTimer > 0) k.freezeTimer = Math.max(0, k.freezeTimer - dt);
        if (k.shieldTimer > 0) k.shieldTimer = Math.max(0, k.shieldTimer - dt);
        if (k.spinAngle > 0) {
          k.spinAngle = Math.max(0, k.spinAngle - dt * 11.0);
        }

        const closest = findClosestTrackSample(k.pos);

        // 1. STEERING, ACCELERATION & DRIFT LOGIC
        let steerInput = 0;
        let throttle = 0;

        if (k.isPlayer) {
          const hasManualSteer = keys.left || keys.right;
          const hasManualThrottle = keys.up || keys.down;

          if (hasManualSteer) {
            if (keys.left) steerInput += 1;
            if (keys.right) steerInput -= 1;
          }

          if (hasManualThrottle) {
            if (keys.up) throttle = 1.0;
            else if (keys.down) throttle = -0.6;
          } else if (hasManualSteer) {
            // Turning with Arrow keys / WASD maintains forward speed
            throttle = 1.0;
          } else if (autoDriveEnabled) {
            // Auto-Drive: Reimu Hakurei runs autonomously around the track when idle!
            throttle = 1.0;
          }

          // If player is not manually steering and Auto-Drive is active, guide Reimu along track
          if (!hasManualSteer && autoDriveEnabled) {
            k.aiLaneTimer -= dt;
            if (k.aiLaneTimer <= 0) {
              k.aiTargetLane = (Math.random() - 0.5) * 2.2;
              k.aiLaneTimer = 1.5 + Math.random() * 2.5;
            }

            const lookAheadT = (closest.t + 0.038) % 1.0;
            const targetSample = getTrackSampleAt(lookAheadT);
            const aimPt = targetSample.pt.clone().addScaledVector(targetSample.right, k.aiTargetLane);
            const desiredHeading = Math.atan2(aimPt.x - k.pos.x, aimPt.z - k.pos.z);

            let angleDiff = desiredHeading - k.heading;
            while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
            while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;

            steerInput = THREE.MathUtils.clamp(angleDiff * 2.6, -1, 1);

            // Reimu occasionally uses held item if player hasn't triggered it
            if (k.heldItem && Math.random() < dt * 0.35) {
              activateKartItem(k);
            }
          }

          // Spacebar Drift & Turbo Charge!
          if (keys.space && k.speed > 5.5 && k.heightOffset <= 0.15) {
            if (!k.isDrifting && steerInput !== 0) {
              k.isDrifting = true;
              k.driftDir = steerInput;
              k.verticalVel = 2.6; // Cute arcade hop when starting a drift!
              k.driver.squash = 0.78;
            }
            if (k.isDrifting) {
              k.driftCharge += dt * (steerInput === k.driftDir ? 1.35 : 0.75);
              // Spawn color-changing drift sparks from rear wheels!
              const sparkColor = k.driftCharge > 1.7 ? '#f472b6' : (k.driftCharge > 0.8 ? '#fb923c' : '#38bdf8');
              if (Math.random() < 0.75) {
                const backVec = new THREE.Vector3(-Math.sin(k.heading), 0.15, -Math.cos(k.heading));
                emitParticle(
                  k.pos.clone().addScaledVector(backVec, 0.65),
                  backVec.multiplyScalar(3.5).add(new THREE.Vector3((Math.random() - 0.5) * 2, 1.8, (Math.random() - 0.5) * 2)),
                  sparkColor,
                  0.32,
                  1.05,
                  7.0
                );
              }
            }
          } else if (k.isDrifting) {
            // Released SPACE -> Trigger Drift Boost if charged!
            if (k.driftCharge >= 0.75) {
              const boostPower = k.driftCharge > 1.7 ? 1.45 : 0.9;
              k.boostTimer = Math.max(k.boostTimer, boostPower);
              k.speed = Math.max(k.speed, 18.8);
              k.driver.squash = 0.68;
              k.driver.squashVel = 3.5;
              soundFX.playBoost();
            }
            k.isDrifting = false;
            k.driftCharge = 0;
          }
        } else {
          // AI KART STEERING WITH RUBBER-BANDING
          k.aiLaneTimer -= dt;
          if (k.aiLaneTimer <= 0) {
            k.aiTargetLane = (Math.random() - 0.5) * 2.8;
            k.aiLaneTimer = 1.5 + Math.random() * 2.5;
          }

          const lookAheadT = (closest.t + 0.038) % 1.0;
          const targetSample = getTrackSampleAt(lookAheadT);
          const aimPt = targetSample.pt.clone().addScaledVector(targetSample.right, k.aiTargetLane);
          const desiredHeading = Math.atan2(aimPt.x - k.pos.x, aimPt.z - k.pos.z);

          let angleDiff = desiredHeading - k.heading;
          while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
          while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;

          steerInput = THREE.MathUtils.clamp(angleDiff * 2.6, -1, 1);
          throttle = 1.0;

          // AI Item Usage
          if (k.heldItem && Math.random() < dt * 0.85) {
            activateKartItem(k);
          }
        }

        // Calculate Target Top Speed (with AI rubber-banding relative to player!)
        let maxSpeed = 13.8;
        if (!k.isPlayer) {
          const progressGap = playerKart.totalProgress - k.totalProgress;
          const rubberBand = THREE.MathUtils.clamp(progressGap * 8.5, -2.2, 3.2);
          maxSpeed = k.baseAiSpeed + rubberBand;
        }
        if (k.boostTimer > 0) maxSpeed = 19.6;
        if (k.freezeTimer > 0) maxSpeed = 3.2;

        // Acceleration & Damping
        if (throttle > 0) {
          k.speed = THREE.MathUtils.lerp(k.speed, maxSpeed * throttle, dt * (k.boostTimer > 0 ? 5.5 : 3.2));
        } else if (throttle < 0) {
          k.speed = THREE.MathUtils.lerp(k.speed, maxSpeed * throttle, dt * 3.5);
        } else {
          k.speed *= Math.pow(0.25, dt);
        }

        // Apply Turning & Head Sway
        const turnRate = (k.isDrifting ? 2.55 : 2.15) * (Math.abs(k.speed) > 0.4 ? 1 : 0);
        const effectiveSteer = k.isDrifting ? (steerInput * 0.65 + k.driftDir * 0.55) : steerInput;
        k.heading += effectiveSteer * turnRate * dt;

        // Fumo driver head sways and bobbles with steering & acceleration!
        k.driver.headRollVel += (-effectiveSteer * 5.5 - k.driver.headRoll) * dt * 12;
        k.driver.headPitchVel += ((k.boostTimer > 0 ? -0.32 : 0) - k.driver.headPitch) * dt * 12;
        k.driver.roll = THREE.MathUtils.lerp(k.driver.roll, -effectiveSteer * 0.16, dt * 8);

        // Move Kart Forward
        k.pos.x += Math.sin(k.heading) * k.speed * dt;
        k.pos.z += Math.cos(k.heading) * k.speed * dt;

        // Boost Flame Trail Particles
        if (k.boostTimer > 0 && Math.random() < 0.8) {
          const back = new THREE.Vector3(-Math.sin(k.heading), 0.2, -Math.cos(k.heading));
          emitParticle(
            k.pos.clone().addScaledVector(back, 0.7),
            back.multiplyScalar(4.0),
            Math.random() > 0.5 ? '#00f5d4' : '#fde047',
            0.25,
            1.2,
            1.0
          );
        }

        // 2. TRACK BOUNDARY, CURB WALL BOUNCE, RAMPS & BOOST PADS
        const newSample = findClosestTrackSample(k.pos);

        // Track Progress & Lap Counting
        let deltaT = newSample.t - k.trackT;
        if (deltaT < -0.5) deltaT += 1.0;
        if (deltaT > 0.5) deltaT -= 1.0;
        k.totalProgress += deltaT;
        k.trackT = newSample.t;

        const computedLap = Math.max(1, Math.floor(k.totalProgress + 1.02));
        if (computedLap > k.lap && k.lap < 3) {
          k.lap = computedLap;
          if (k.isPlayer) {
            soundFX.playItemPickup();
            if (k.lap === 3) {
              soundFX.finalLapMultiplier = 1.28; // Speed up chiptune in Final Lap!
              setBanner('🔥', 'FINAL LAP! The Chiptune Tempo Speeds Up!');
            } else {
              setBanner('🏁', `Lap ${k.lap} / 3!`);
            }
          }
        } else if (computedLap > 3 && !k.finished) {
          k.finished = true;
          finishOrder.push(k);
          k.finishRank = finishOrder.length;
          if (k.isPlayer || finishOrder.length >= 3) {
            triggerPodiumCeremony();
          }
        }

        // Lateral Offset from Track Centerline -> Wall / Curb Soft-Body Bounce!
        const toKart = new THREE.Vector3().subVectors(k.pos, newSample.pt);
        const lateralDist = toKart.dot(newSample.right);
        const maxTrackRadius = TRACK_HALF_WIDTH - 0.32;

        if (Math.abs(lateralDist) > maxTrackRadius) {
          const sign = Math.sign(lateralDist);
          const overshoot = Math.abs(lateralDist) - maxTrackRadius;
          k.pos.addScaledVector(newSample.right, -sign * overshoot);

          // Bounce inward and squish kart & driver against the curb/wall!
          k.speed *= 0.82;
          const trackHeading = Math.atan2(newSample.tan.x, newSample.tan.z);
          k.heading = THREE.MathUtils.lerp(k.heading, trackHeading, 0.35);
          if (overshoot > 0.06) {
            k.driver.squash = Math.max(0.58, k.driver.squash - 0.25);
            k.driver.squashVel = -3.2;
            k.driver.headRollVel += sign * 9.5;
            if (k.isPlayer) soundFX.playBump(0.75);
          }
        }

        // Check Boost Pads
        if (boostPadZones.some(bz => Math.abs(k.trackT - bz) < 0.013) && k.boostTimer < 0.4) {
          k.boostTimer = 1.15;
          k.speed = Math.max(k.speed, 19.2);
          k.driver.squash = 0.72;
          if (k.isPlayer) soundFX.playBoost();
        }

        // Check Jump Ramps
        if (rampZones.some(rz => Math.abs(k.trackT - rz) < 0.011) && k.heightOffset <= 0.05 && k.speed > 8.0) {
          k.verticalVel = 6.2;
          k.driver.squash = 1.22;
          if (k.isPlayer) soundFX.playSqueeze(1.1);
        }

        // Vertical Jump Arc & Landing Squish
        if (k.heightOffset > 0 || k.verticalVel !== 0) {
          k.verticalVel -= 20.0 * dt;
          k.heightOffset += k.verticalVel * dt;
          if (k.heightOffset <= 0) {
            const impact = -k.verticalVel;
            k.heightOffset = 0;
            k.verticalVel = 0;
            if (impact > 2.2) {
              k.driver.squash = 0.62;
              k.driver.squashVel = -3.8;
              k.driver.headPitchVel += 8.0;
              if (k.isPlayer) soundFX.playBump(impact * 0.1);
            }
          }
        }

        k.pos.y = newSample.pt.y;

        // 3. ITEM BOX PICKUP CHECK
        for (let b = 0; b < itemBoxes.length; b++) {
          const box = itemBoxes[b];
          if (box.cooldown <= 0 && k.pos.distanceTo(box.pos) < 1.15) {
            box.cooldown = 4.5;
            spawnSqueezeSparkles(box.pos, '#fbbf24');
            if (!k.heldItem) {
              k.heldItem = ITEM_POOL[Math.floor(Math.random() * ITEM_POOL.length)];
              if (k.isPlayer) {
                soundFX.playItemPickup();
                updatePlayerItemHUD();
                setBanner(k.heldItem.icon, `Got ${k.heldItem.label}! Press [E] to use!`);
              }
            }
          }
        }

        k.syncKartTransform(elapsed);
      });

      // 4. KART-TO-KART BUMP & SQUISH COLLISIONS
      for (let i = 0; i < karts.length; i++) {
        for (let j = i + 1; j < karts.length; j++) {
          const a = karts[i];
          const b = karts[j];
          if (a.driver.isDragged || b.driver.isDragged || raceFinished) continue;

          const dx = b.pos.x - a.pos.x;
          const dz = b.pos.z - a.pos.z;
          const distSq = dx * dx + dz * dz;
          const minDist = 1.25;
          if (distSq < minDist * minDist && distSq > 0.0001) {
            const dist = Math.sqrt(distSq);
            const nx = dx / dist;
            const nz = dz / dist;
            const overlap = (minDist - dist) * 0.5;

            a.pos.x -= nx * overlap;
            a.pos.z -= nz * overlap;
            b.pos.x += nx * overlap;
            b.pos.z += nz * overlap;

            // Squish & wobble both drivers on bump!
            a.driver.squash = Math.max(0.65, a.driver.squash - 0.18);
            b.driver.squash = Math.max(0.65, b.driver.squash - 0.18);
            a.driver.headRollVel -= nx * 7.5;
            b.driver.headRollVel += nx * 7.5;

            // Shield knockback
            if (a.shieldTimer > 0 && b.shieldTimer <= 0) {
              b.verticalVel = 4.5;
              b.speed *= 0.5;
            } else if (b.shieldTimer > 0 && a.shieldTimer <= 0) {
              a.verticalVel = 4.5;
              a.speed *= 0.5;
            }

            if (a.isPlayer || b.isPlayer) {
              soundFX.playBump(0.65);
            }
          }
        }
      }

      // 5. UPDATE BOTTOM-RIGHT TELEMETRY HUD
      const standings = [...karts].sort((a, b) => b.totalProgress - a.totalProgress);
      const playerRank = standings.indexOf(playerKart) + 1;
      const suffixes = ['st', 'nd', 'rd', 'th', 'th', 'th', 'th'];
      hudPosEl.innerHTML = `${playerRank}<span class="text-xs align-top">${suffixes[playerRank - 1]}</span>`;
      hudLapEl.textContent = `${Math.min(3, playerKart.lap)} / 3`;
      hudTimerEl.textContent = formatRaceTime(raceElapsed);
    }

    // ============================================================================
    // 13. POINTER INTERACTION: CLICK TO SQUEEZE, DRAG TO THROW ANY FUMO / KART
    // ============================================================================
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    const dragPlane = new THREE.Plane();
    const dragHitPoint = new THREE.Vector3();
    const dragOffset = new THREE.Vector3();

    let hoveredFumo = null;
    let selectedFumo = null;
    let isDraggingFumo = false;
    let pointerDownScreen = new THREE.Vector2();
    let dragHistory = [];

    const tooltipEl = document.getElementById('fumo-tooltip');
    const tooltipEmojiEl = document.getElementById('tooltip-emoji');
    const tooltipTextEl = document.getElementById('tooltip-text');

    function updatePointerNDC(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function pickFumoUnderPointer() {
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(allInteractiveMeshes, false);
      if (hits.length > 0 && hits[0].object.userData.fumo) {
        return hits[0].object.userData.fumo;
      }
      return null;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      soundFX.unlock();
      window.focus();
      if (e.button !== 0) return;
      recordInteraction();
      updatePointerNDC(e);
      pointerDownScreen.set(e.clientX, e.clientY);

      const fumo = pickFumoUnderPointer();
      if (fumo) {
        selectedFumo = fumo;
        isDraggingFumo = false;
        controls.enabled = false; // Dragging a fumo must NOT rotate the camera!

        const worldTarget = fumo.kart ? fumo.kart.pos : fumo.pos;
        fumo.pos.copy(worldTarget);

        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        dragPlane.setFromNormalAndCoplanarPoint(camDir.negate(), worldTarget);

        if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
          dragOffset.subVectors(worldTarget, dragHitPoint);
        } else {
          dragOffset.set(0, 0, 0);
        }

        dragHistory = [{ pos: worldTarget.clone(), time: performance.now() }];
      }
    });

    window.addEventListener('pointermove', (e) => {
      updatePointerNDC(e);

      if (selectedFumo) {
        recordInteraction();
        const moveDist = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);

        if (!isDraggingFumo && moveDist > 6) {
          isDraggingFumo = true;
          selectedFumo.isDragged = true;
          selectedFumo.isGrounded = false;
          selectedFumo.squashVel += 3.5;
          soundFX.playSqueeze(selectedFumo.pitchAudio * 0.9);
        }

        if (isDraggingFumo) {
          raycaster.setFromCamera(pointerNDC, camera);
          if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
            const targetPos = dragHitPoint.clone().add(dragOffset);
            targetPos.x = THREE.MathUtils.clamp(targetPos.x, -23.0, 23.0);
            targetPos.y = THREE.MathUtils.clamp(targetPos.y, 0.6, 12.0);
            targetPos.z = THREE.MathUtils.clamp(targetPos.z, -20.0, 20.0);

            const prevPos = selectedFumo.pos.clone();
            selectedFumo.pos.lerp(targetPos, 0.55);

            const deltaMove = selectedFumo.pos.clone().sub(prevPos);
            selectedFumo.headRollVel -= deltaMove.x * 16.0;
            selectedFumo.headPitchVel += deltaMove.z * 16.0 - deltaMove.y * 10.0;
            selectedFumo.limbRollVel -= deltaMove.x * 20.0;

            const now = performance.now();
            dragHistory.push({ pos: selectedFumo.pos.clone(), time: now });
            while (dragHistory.length > 6) dragHistory.shift();
          }
          tooltipEl.style.opacity = '0';
          renderer.domElement.style.cursor = 'grabbing';
          return;
        }
      }

      const fumo = pickFumoUnderPointer();
      if (fumo) {
        hoveredFumo = fumo;
        renderer.domElement.style.cursor = 'grab';
        tooltipEmojiEl.textContent = fumo.emoji;
        tooltipTextEl.textContent = fumo.name;
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = `${e.clientX + 14}px`;
        tooltipEl.style.top = `${e.clientY - 18}px`;
      } else {
        hoveredFumo = null;
        renderer.domElement.style.cursor = 'default';
        tooltipEl.style.opacity = '0';
      }
    });

    window.addEventListener('pointerup', () => {
      if (!selectedFumo) return;
      controls.enabled = (cameraMode === 'orbit');
      recordInteraction();

      if (!isDraggingFumo) {
        // Click without dragging -> SQUEEZE INTERACTION!
        selectedFumo.squeeze(1.1);
        setBanner(selectedFumo.emoji, `Squeezed ${selectedFumo.name}! ᗜˬᗜ`);
      } else {
        // Released after dragging -> THROW WITH INERTIA & BOUNCE!
        selectedFumo.isDragged = false;
        const now = performance.now();
        while (dragHistory.length > 1 && now - dragHistory[0].time > 140) {
          dragHistory.shift();
        }
        let throwVel = new THREE.Vector3(0, 2, 0);
        if (dragHistory.length >= 2) {
          const first = dragHistory[0];
          const last = dragHistory[dragHistory.length - 1];
          const dtSec = Math.max(0.016, (last.time - first.time) / 1000);
          throwVel = last.pos.clone().sub(first.pos).divideScalar(dtSec);
          if (throwVel.length() > 22) throwVel.setLength(22);
        }

        if (selectedFumo.kart) {
          // Dropped / Thrown Kart lands back onto the track with a big bounce!
          const k = selectedFumo.kart;
          const sample = findClosestTrackSample(selectedFumo.pos);
          k.pos.x = selectedFumo.pos.x;
          k.pos.z = selectedFumo.pos.z;
          k.heightOffset = Math.max(0.5, selectedFumo.pos.y - sample.pt.y);
          k.verticalVel = Math.max(3.5, throwVel.y * 0.5);
          k.speed = Math.min(18, throwVel.length() * 0.7);
          k.trackT = sample.t;
        } else {
          selectedFumo.vel.copy(throwVel);
          selectedFumo.angVel.set(
            throwVel.z * 0.5,
            (Math.random() - 0.5) * 4.0,
            -throwVel.x * 0.5
          );
        }
      }

      selectedFumo = null;
      isDraggingFumo = false;
      renderer.domElement.style.cursor = hoveredFumo ? 'grab' : 'default';
    });

    // ============================================================================
    // 14. DAY / NIGHT SMOOTH INTERPOLATION (~2 SECONDS) & HUB INTEGRATION
    // ============================================================================
    let isNightMode = false;
    let dayNightProgress = 0.0;
    let dayNightTarget = 0.0;

    const daySkyColor = new THREE.Color('#bde0fe');
    const nightSkyColor = new THREE.Color('#090a18');
    const daySunCol = new THREE.Color('#fff2d6');
    const nightMoonCol = new THREE.Color('#64748b');
    const dayHemiSky = new THREE.Color('#fff9eb');
    const nightHemiSky = new THREE.Color('#1e1b4b');
    const dayHemiGround = new THREE.Color('#8d99ae');
    const nightHemiGround = new THREE.Color('#090a14');

    const btnMode = document.getElementById('btn-mode');
    const modeBtnIcon = document.getElementById('mode-icon');
    const modeBtnLabel = document.getElementById('mode-label');

    function isInIframe() {
      try {
        return window.self !== window.top;
      } catch (e) {
        return true;
      }
    }

    function updateModeButtonUI() {
      if (!modeBtnIcon || !modeBtnLabel) return;
      if (isNightMode) {
        modeBtnIcon.textContent = '☀️';
        modeBtnLabel.textContent = 'Day';
        if (btnMode) btnMode.setAttribute('title', 'Switch to Day Mode (N)');
      } else {
        modeBtnIcon.textContent = '🌙';
        modeBtnLabel.textContent = 'Night';
        if (btnMode) btnMode.setAttribute('title', 'Switch to Night Mode (N)');
      }
    }

    if (btnMode) {
      btnMode.addEventListener('click', () => {
        soundFX.unlock();
        toggleDayNight();
      });
    }

    function notifyParentMode() {
      const modeStr = isNightMode ? 'night' : 'day';
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'modeChanged', mode: modeStr }, '*');
        }
      } catch (e) {}
    }

    function setDayNightMode(night, { immediate = false, notifyParent = true } = {}) {
      isNightMode = Boolean(night);
      dayNightTarget = isNightMode ? 1.0 : 0.0;
      if (immediate) {
        dayNightProgress = dayNightTarget;
      }
      document.body.classList.toggle('night-ui', isNightMode);
      try {
        localStorage.setItem(STORAGE_MODE_KEY, isNightMode ? 'night' : 'day');
      } catch (e) {}
      updateModeButtonUI();
      if (notifyParent) {
        notifyParentMode();
      }
    }

    function toggleDayNight() {
      setDayNightMode(!isNightMode, { immediate: false, notifyParent: true });
    }

    function updateDayNightTransition(dt) {
      if (Math.abs(dayNightProgress - dayNightTarget) > 0.0005) {
        const step = dt * 0.52; // ~2 seconds transition
        if (dayNightProgress < dayNightTarget) {
          dayNightProgress = Math.min(dayNightTarget, dayNightProgress + step);
        } else {
          dayNightProgress = Math.max(dayNightTarget, dayNightProgress - step);
        }
      }

      const t = dayNightProgress < 0.5
        ? 4 * dayNightProgress * dayNightProgress * dayNightProgress
        : 1 - Math.pow(-2 * dayNightProgress + 2, 3) / 2;

      scene.background.lerpColors(daySkyColor, nightSkyColor, t);
      scene.fog.color.copy(scene.background);

      sunDirLight.color.lerpColors(daySunCol, nightMoonCol, t);
      sunDirLight.intensity = THREE.MathUtils.lerp(1.3, 0.32, t);

      hemiLight.color.lerpColors(dayHemiSky, nightHemiSky, t);
      hemiLight.groundColor.lerpColors(dayHemiGround, nightHemiGround, t);
      hemiLight.intensity = THREE.MathUtils.lerp(0.72, 0.24, t);

      // Nighttime Neon & Lantern Lights
      lavaLight.intensity = THREE.MathUtils.lerp(0.45, 1.85, t);
      shrineLight.intensity = THREE.MathUtils.lerp(0.15, 1.55, t);
      neonTrackLight.intensity = THREE.MathUtils.lerp(0.15, 1.45, t);

      neonEmissiveMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.35, 2.2, t);
      boostPadMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.55, 2.1, t);
      lavaEmissiveMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.7, 2.4, t);
      translucentIceMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.22, 0.85, t);
      crystalWingMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.3, 1.25, t);

      if (typeof starMat !== 'undefined' && typeof starMesh !== 'undefined') {
        starMat.opacity = THREE.MathUtils.lerp(0.0, 0.95, t);
        starMesh.visible = (t > 0.01);
      }

      if (bloomPass) {
        bloomPass.strength = THREE.MathUtils.lerp(0.16, 0.78, t);
        bloomPass.threshold = THREE.MathUtils.lerp(0.84, 0.58, t);
      }
    }

    // ============================================================================
    // 15. KEYBOARD & HUD BUTTON LISTENERS
    // ============================================================================
    const btnMute = document.getElementById('btn-mute');
    const iconSoundOn = document.getElementById('icon-sound-on');
    const iconSoundOff = document.getElementById('icon-sound-off');

    function syncMuteUI() {
      iconSoundOn.classList.toggle('hidden', soundFX.muted);
      iconSoundOff.classList.toggle('hidden', !soundFX.muted);
    }
    syncMuteUI();

    btnMute.addEventListener('click', () => {
      soundFX.unlock();
      soundFX.setMuted(!soundFX.muted);
      syncMuteUI();
    });

    btnUseItem.addEventListener('click', () => {
      soundFX.unlock();
      activateKartItem(playerKart);
    });

    document.getElementById('btn-restart').addEventListener('click', () => {
      soundFX.unlock();
      restartRace();
    });

    document.getElementById('btn-play-again').addEventListener('click', () => {
      soundFX.unlock();
      restartRace();
    });

    const btnAutoDrive = document.getElementById('btn-autodrive');
    const autoDriveIcon = document.getElementById('autodrive-icon');
    const autoDriveLabel = document.getElementById('autodrive-label');

    function updateAutoDriveUI() {
      if (autoDriveLabel) {
        autoDriveLabel.textContent = autoDriveEnabled ? 'Auto-Drive: ON' : 'Auto-Drive: OFF';
      }
      if (autoDriveIcon) {
        autoDriveIcon.textContent = autoDriveEnabled ? '🤖' : '🎮';
      }
    }

    function toggleAutoDrive() {
      autoDriveEnabled = !autoDriveEnabled;
      updateAutoDriveUI();
      if (autoDriveEnabled) {
        setBanner('🤖', 'Auto-Drive ON: Reimu drives the course autonomously! Use Arrow Keys to override.');
      } else {
        setBanner('🎮', 'Manual Drive ON: Use Arrow Keys or WASD to drive Reimu Hakurei!');
      }
    }
    if (btnAutoDrive) {
      btnAutoDrive.addEventListener('click', () => {
        soundFX.unlock();
        toggleAutoDrive();
      });
    }

    const btnCam = document.getElementById('btn-cam');
    const camLabel = document.getElementById('cam-label');
    function toggleCameraMode() {
      cameraMode = (cameraMode === 'orbit') ? 'chase' : 'orbit';
      controls.enabled = (cameraMode === 'orbit');
      camLabel.textContent = (cameraMode === 'orbit') ? 'Orbit Cam' : 'Chase Cam';
      if (cameraMode === 'orbit') {
        camera.position.set(0, 25, 36);
        controls.target.set(0, 1.8, 1.0);
      }
    }
    btnCam.addEventListener('click', toggleCameraMode);

    window.addEventListener('keydown', (e) => {
      soundFX.unlock();
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;

      const code = e.code;
      const key = e.key.toLowerCase();

      if (code === 'ArrowUp' || key === 'w') { keys.up = true; e.preventDefault(); recordInteraction(); }
      if (code === 'ArrowDown' || key === 's') { keys.down = true; e.preventDefault(); recordInteraction(); }
      if (code === 'ArrowLeft' || key === 'a') { keys.left = true; e.preventDefault(); recordInteraction(); }
      if (code === 'ArrowRight' || key === 'd') { keys.right = true; e.preventDefault(); recordInteraction(); }
      if (code === 'Space') { keys.space = true; e.preventDefault(); recordInteraction(); }

      if (key === 'e') {
        e.preventDefault();
        activateKartItem(playerKart);
      } else if (key === 'r') {
        e.preventDefault();
        restartRace();
      } else if (key === 't') {
        e.preventDefault();
        toggleAutoDrive();
      } else if (key === 'c') {
        e.preventDefault();
        toggleCameraMode();
      } else if (key === 'm') {
        e.preventDefault();
        soundFX.setMuted(!soundFX.muted);
        syncMuteUI();
      } else if (key === 'n') {
        e.preventDefault();
        toggleDayNight();
      }
    });

    window.addEventListener('keyup', (e) => {
      const code = e.code;
      const key = e.key.toLowerCase();
      if (code === 'ArrowUp' || key === 'w') keys.up = false;
      if (code === 'ArrowDown' || key === 's') keys.down = false;
      if (code === 'ArrowLeft' || key === 'a') keys.left = false;
      if (code === 'ArrowRight' || key === 'd') keys.right = false;
      if (code === 'Space') keys.space = false;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================================
    // 16. MAIN ANIMATION LOOP & HUB MESSAGE HANDLERS
    // ============================================================================
    let prevTime = performance.now();
    let isPaused = false;
    let rafId = null;

    function animate(now) {
      if (isPaused) return;
      rafId = requestAnimationFrame(animate);

      const dt = Math.min(0.033, Math.max(0.001, (now - prevTime) / 1000));
      prevTime = now;
      const elapsed = now * 0.001;

      updateDayNightTransition(dt);
      updateItemBoxes(elapsed, dt);
      updateKartRacePhysics(dt, elapsed);
      updateProjectiles(dt);
      updateParticles(dt);

      // Update standalone spectator / flag / napping / drone fumos
      for (let i = 0; i < allFumos.length; i++) {
        if (allFumos[i].role !== 'driver') {
          allFumos[i].updateSpringsAndPhysics(dt, elapsed);
        }
      }

      // Update Continuous Engine, Drift & Chiptune Audio
      const speedRatio = playerKart.speed / 15.0;
      const driftLevel = playerKart.isDrifting ? Math.min(2, Math.floor(playerKart.driftCharge)) : 0;
      soundFX.updateContinuous(dt, speedRatio, playerKart.isDrifting, driftLevel);

      // Camera Update (Diorama Orbit with Idle Auto-Rotate vs Smooth Kart Chase Cam)
      if (cameraMode === 'chase' && !raceFinished) {
        const backVec = new THREE.Vector3(-Math.sin(playerKart.heading), 0, -Math.cos(playerKart.heading));
        const desiredCamPos = playerKart.pos.clone()
          .addScaledVector(backVec, 6.2)
          .add(new THREE.Vector3(0, 3.4, 0));
        camera.position.lerp(desiredCamPos, Math.min(1, dt * 7.5));
        const lookAtPt = playerKart.pos.clone().add(new THREE.Vector3(Math.sin(playerKart.heading) * 2.5, 1.0, Math.cos(playerKart.heading) * 2.5));
        controls.target.lerp(lookAtPt, Math.min(1, dt * 10.0));
        camera.lookAt(controls.target);
      } else {
        if (!selectedFumo && !keys.up && !keys.down && !keys.left && !keys.right && (now - lastUserInteractionTime > 4500)) {
          controls.autoRotate = true;
        }
        controls.update();
      }

      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    function pauseScene() {
      if (isPaused) return;
      isPaused = true;
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      soundFX.suspend();
    }

    function resumeScene() {
      if (!isPaused) return;
      isPaused = false;
      prevTime = performance.now();
      soundFX.resume();
      rafId = requestAnimationFrame(animate);
    }

    let hasExplicitModeSet = false;

    window.addEventListener('message', (e) => {
      const data = e.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'toggleMode') {
        toggleDayNight();
      } else if (data.type === 'setMode' && (data.mode === 'day' || data.mode === 'night')) {
        hasExplicitModeSet = true;
        setDayNightMode(data.mode === 'night', { immediate: false, notifyParent: false });
      } else if (data.type === 'pause') {
        pauseScene();
      } else if (data.type === 'resume') {
        resumeScene();
      }
    });

    window.onload = function () {
      if (!hasExplicitModeSet) {
        let initialNight = false;
        let hasSaved = false;
        try {
          const saved = localStorage.getItem(STORAGE_MODE_KEY);
          if (saved === 'night') {
            initialNight = true;
            hasSaved = true;
          } else if (saved === 'day') {
            initialNight = false;
            hasSaved = true;
          }
        } catch (e) {}

        // In an iframe without explicit saved state, avoid forcing parent mode unless saved
        setDayNightMode(initialNight, {
          immediate: true,
          notifyParent: hasSaved || !isInIframe()
        });
      }
      updateDayNightTransition(0);

      // Welcoming plush bounce on load
      allFumos.forEach((f, idx) => {
        setTimeout(() => {
          f.squash = 0.76;
          f.squashVel = 2.2;
          f.headPitchVel = 4.0;
        }, 100 + idx * 55);
      });

      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    };
  </script>
</body>
</html>

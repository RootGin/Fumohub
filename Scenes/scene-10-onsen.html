<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Youkai Mountain Onsen — Touhou Fumo Voxel Diorama</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Three.js r128 + OrbitControls + Post-Processing (UnrealBloomPass) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background-color: #0b1120;
    }
    h1, .font-display {
      font-family: 'Fredoka', sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 10px 28px -6px rgba(20, 15, 45, 0.18), 0 2px 6px rgba(20, 15, 45, 0.08);
      transition: background 0.5s ease, color 0.5s ease, border-color 0.5s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    body.night-ui .glass-panel {
      background: rgba(18, 25, 46, 0.78);
      border-color: rgba(110, 200, 235, 0.28);
      color: #f0f9ff;
      box-shadow: 0 10px 30px -6px rgba(0, 0, 0, 0.55), 0 0 16px rgba(56, 189, 248, 0.15);
    }
    .ui-btn {
      cursor: pointer;
    }
    .ui-btn:hover {
      transform: translateY(-2px) scale(1.03);
    }
    .ui-btn:active {
      transform: translateY(1px) scale(0.97);
    }
    #fumo-tooltip {
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    kbd {
      font-family: 'Fredoka', sans-serif;
      display: inline-block;
      padding: 1px 6px;
      font-size: 0.75rem;
      line-height: 1.2;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.08);
      border-bottom: 2px solid rgba(0, 0, 0, 0.18);
    }
    body.night-ui kbd {
      background: rgba(255, 255, 255, 0.14);
      border-bottom-color: rgba(255, 255, 255, 0.28);
    }
  </style>
</head>
<body class="text-slate-800">
  <div id="canvas-container"></div>

  <!-- Top-Right Controls: Active Fumo Badge, Squeeze All, Reset, Sound (Top-Left kept clear for Hub) -->
  <div class="fixed top-4 right-4 z-20 flex items-center gap-2.5">
    <!-- Active / Hovered Fumo Indicator -->
    <div id="fumo-badge" class="glass-panel rounded-2xl px-3.5 py-2.5 text-xs font-semibold hidden items-center gap-2 transition-all">
      <span id="fumo-badge-dot" class="w-2.5 h-2.5 rounded-full inline-block bg-sky-400"></span>
      <span id="fumo-badge-name">Momiji Inubashiri</span>
      <span id="fumo-badge-status" class="opacity-70 ml-1">Soaking</span>
    </div>

    <!-- Squeeze All Button -->
    <button id="btn-squeeze-all" title="Squeeze All Fumos! (Space)"
      class="glass-panel ui-btn rounded-2xl px-3.5 py-2.5 flex items-center gap-2 text-xs sm:text-sm font-semibold">
      <span class="text-base leading-none">♨️</span>
      <span class="hidden md:inline">Squeeze All</span>
    </button>

    <!-- Reset Fumos Button -->
    <button id="btn-reset" title="Return Fumos & Ice Block to Cozy Spots (R)"
      class="glass-panel ui-btn rounded-2xl px-3.5 py-2.5 flex items-center gap-2 text-xs sm:text-sm font-semibold">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      <span class="hidden sm:inline">Reset</span>
    </button>

    <!-- Sound Toggle Button -->
    <button id="btn-sound" title="Toggle Plush & Water Sound Effects (M)"
      class="glass-panel ui-btn rounded-2xl p-2.5 flex items-center justify-center">
      <svg id="icon-sound-on" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
      <svg id="icon-sound-off" class="w-5 h-5 hidden opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
    </button>
  </div>

  <!-- Floating Cursor Tooltip for Hovered Fumo -->
  <div id="fumo-tooltip" class="fixed z-30 opacity-0 px-3 py-1.5 rounded-xl glass-panel text-xs font-semibold flex items-center gap-2 shadow-lg">
    <span id="tooltip-emoji">🐺</span>
    <span id="tooltip-text">Momiji Fumo</span>
  </div>

  <!-- Bottom Center HUD Hints -->
  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-20 pointer-events-none w-max max-w-[94vw]">
    <div class="glass-panel rounded-2xl px-4 py-2 text-xs font-semibold flex flex-wrap items-center justify-center gap-x-4 gap-y-1 opacity-90">
      <span>🖱️ <b>Click Fumo:</b> Squeeze</span>
      <span>🌊 <b>Drag & Toss in Pool:</b> Splash & Float</span>
      <span>🔄 <b>Drag Scene:</b> Orbit Camera</span>
      <span class="hidden sm:inline"><kbd>R</kbd> Reset & Refreeze Ice</span>
      <span class="hidden md:inline"><kbd>Space</kbd> Squeeze All</span>
    </div>
  </div>

  <script>
    // ============================================================================
    // 1. PROCEDURAL WEB AUDIO SYNTHESIZER (Squeaks, Bounces & Water Splashes)
    // ============================================================================
    class PlushSoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playSqueeze(pitchMultiplier = 1.0) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sine';
          const baseFreq = (520 + Math.random() * 80) * pitchMultiplier;
          osc1.frequency.setValueAtTime(baseFreq, now);
          osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.48, now + 0.085);
          osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.15, now + 0.16);

          gain1.gain.setValueAtTime(0.001, now);
          gain1.gain.linearRampToValueAtTime(0.11, now + 0.025);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.17);

          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.18);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(baseFreq * 1.1, now + 0.11);
          osc2.frequency.exponentialRampToValueAtTime(baseFreq * 1.65, now + 0.21);

          gain2.gain.setValueAtTime(0.001, now + 0.11);
          gain2.gain.linearRampToValueAtTime(0.08, now + 0.13);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start(now + 0.11);
          osc2.stop(now + 0.25);
        } catch (e) {}
      }

      playBounce(intensity = 0.5) {
        if (!this.enabled || intensity < 0.08) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const vol = Math.min(0.14, intensity * 0.12);

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const startFreq = 115 + Math.min(80, intensity * 35);
          osc.frequency.setValueAtTime(startFreq, now);
          osc.frequency.exponentialRampToValueAtTime(42, now + 0.09);

          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        } catch (e) {}
      }

      playSplash(intensity = 0.7) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const duration = 0.28;
          const bufferSize = Math.floor(this.ctx.sampleRate * duration);
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.09));
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(650, now);
          filter.frequency.exponentialRampToValueAtTime(1250, now + duration);
          filter.Q.value = 1.8;

          const gain = this.ctx.createGain();
          const vol = Math.min(0.18, Math.max(0.04, intensity * 0.14));
          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(now);

          // Cute water droplet "bloop"
          const osc = this.ctx.createOscillator();
          const bGain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(240, now + 0.02);
          osc.frequency.exponentialRampToValueAtTime(580, now + 0.13);
          bGain.gain.setValueAtTime(vol * 0.6, now + 0.02);
          bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.connect(bGain);
          bGain.connect(this.ctx.destination);
          osc.start(now + 0.02);
          osc.stop(now + 0.15);
        } catch (e) {}
      }

      playPickup() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(440, now + 0.09);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.05, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        } catch (e) {}
      }
    }

    const soundFX = new PlushSoundEngine();

    // ============================================================================
    // 2. COLOR & VOXEL HELPER UTILITIES
    // ============================================================================
    const tempColor = new THREE.Color();
    const tempMatrix = new THREE.Matrix4();
    const tempPos = new THREE.Vector3();
    const tempQuat = new THREE.Quaternion();
    const tempScale = new THREE.Vector3();

    function voxelHash(x, y, z) {
      let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
      return n - Math.floor(n);
    }

    function varyColor(hexOrString, x, y, z, variance = 0.035, seamDarken = 0) {
      tempColor.set(hexOrString);
      const h = voxelHash(x, y, z);
      const delta = (h - 0.5) * 2 * variance - seamDarken;
      tempColor.offsetHSL(0, (h - 0.5) * 0.03, delta);
      return tempColor.clone();
    }

    function createSoftVoxelGeometry(size = 1) {
      const s = size * 0.985;
      return new THREE.BoxGeometry(s, s, s);
    }

    function buildVoxelInstancedMesh(voxels, unitSize, material, castShadow = true, receiveShadow = true) {
      if (!voxels || voxels.length === 0) return null;
      const geom = createSoftVoxelGeometry(unitSize);
      const mesh = new THREE.InstancedMesh(geom, material, voxels.length);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = receiveShadow;

      for (let i = 0; i < voxels.length; i++) {
        const v = voxels[i];
        tempPos.set(v.x * unitSize, v.y * unitSize, v.z * unitSize);
        tempQuat.identity();
        tempScale.set(v.sx || 1, v.sy || 1, v.sz || 1);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        mesh.setMatrixAt(i, tempMatrix);
        mesh.setColorAt(i, v.color instanceof THREE.Color ? v.color : new THREE.Color(v.color));
      }
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      return mesh;
    }

    // ============================================================================
    // 3. SCENE, CAMERA, RENDERER & POST-PROCESSING SETUP
    // ============================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#bfe3ff');
    scene.fog = new THREE.FogExp2('#bfe3ff', 0.0085);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.5, 140);
    camera.position.set(16.5, 12.8, 19.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    let composer = null;
    let bloomPass = null;
    try {
      const renderPass = new THREE.RenderPass(scene, camera);
      bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.16,
        0.55,
        0.82
      );
      composer = new THREE.EffectComposer(renderer);
      composer.addPass(renderPass);
      composer.addPass(bloomPass);
    } catch (err) {
      composer = null;
    }

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0.0, 2.2, 0.0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI * 0.47;
    controls.minPolarAngle = Math.PI * 0.08;
    controls.minDistance = 8.5;
    controls.maxDistance = 38;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 0.42;

    let lastUserInteractionTime = performance.now();
    const recordInteraction = () => {
      lastUserInteractionTime = performance.now();
      controls.autoRotate = false;
    };
    controls.addEventListener('start', recordInteraction);

    // ============================================================================
    // 4. LIGHTING & SHARED MATERIALS (Capped Dynamic Lights for Performance)
    // ============================================================================
    // 1. Hemisphere Light (Crisp mountain sky / snow bounce)
    const hemiLight = new THREE.HemisphereLight(0xf0f8ff, 0xa8b8c8, 0.75);
    hemiLight.position.set(0, 25, 0);
    scene.add(hemiLight);

    // 2. Primary Sun / Moon Directional Light (Casts soft shadows)
    const sunDirLight = new THREE.DirectionalLight(0xfff5e0, 1.32);
    sunDirLight.position.set(16, 20, 12);
    sunDirLight.target.position.set(0, 1, 0);
    scene.add(sunDirLight.target);
    sunDirLight.castShadow = true;
    sunDirLight.shadow.mapSize.width = 2048;
    sunDirLight.shadow.mapSize.height = 2048;
    sunDirLight.shadow.camera.near = 2;
    sunDirLight.shadow.camera.far = 52;
    const dCam = 15.5;
    sunDirLight.shadow.camera.left = -dCam;
    sunDirLight.shadow.camera.right = dCam;
    sunDirLight.shadow.camera.top = dCam;
    sunDirLight.shadow.camera.bottom = -dCam;
    sunDirLight.shadow.bias = -0.0006;
    sunDirLight.shadow.radius = 2.5;
    scene.add(sunDirLight);

    // 3. Stone Lantern (Tōrō) Warm PointLight by the pool rocks
    const stoneLanternLight = new THREE.PointLight(0xff9e3d, 0.05, 13, 1.6);
    stoneLanternLight.position.set(-5.75, 2.75, -2.5);
    stoneLanternLight.castShadow = true;
    stoneLanternLight.shadow.mapSize.width = 1024;
    stoneLanternLight.shadow.mapSize.height = 1024;
    stoneLanternLight.shadow.bias = -0.001;
    scene.add(stoneLanternLight);

    // 4. Changing Hut Paper Lanterns Warm PointLight
    const hutLanternLight = new THREE.PointLight(0xffaa44, 0.05, 13, 1.6);
    hutLanternLight.position.set(5.2, 3.8, -2.5);
    scene.add(hutLanternLight);

    // 5. Steaming Onsen Pool Bioluminescent / Mineral Glow PointLight
    const poolGlowLight = new THREE.PointLight(0x38bdf8, 0.1, 14, 1.5);
    poolGlowLight.position.set(-0.8, 1.6, 0.8);
    scene.add(poolGlowLight);

    // Shared Materials
    const plushMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.92,
      metalness: 0.02
    });

    const solidVoxelMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.84,
      metalness: 0.05
    });

    const glossyPropMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.25,
      metalness: 0.12
    });

    const translucentIceMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.86,
      roughness: 0.14,
      metalness: 0.05,
      transmission: 0.35,
      emissive: new THREE.Color(0x38bdf8),
      emissiveIntensity: 0.25
    });

    const poolWaterMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x5eead4,
      transparent: true,
      opacity: 0.78,
      roughness: 0.16,
      metalness: 0.06,
      transmission: 0.28,
      emissive: new THREE.Color(0x0ea5e9),
      emissiveIntensity: 0.18
    });

    const lanternEmissiveMaterial = new THREE.MeshStandardMaterial({
      color: 0xfff3d1,
      emissive: new THREE.Color(0xff9922),
      emissiveIntensity: 0.35,
      roughness: 0.2
    });

    const auroraMaterial = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.0,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    // ============================================================================
    // 5. ONSEN POOL GEOMETRY, COLLIDERS & WORLD LAYOUT
    // ============================================================================
    const RV = 0.25; // 1 Environment Voxel = 0.25 world units
    const WATER_LEVEL = 0.55; // Surface height of the steaming hot spring water
    const POOL_FLOOR_Y = -0.65; // Shallow stone basin floor inside the pool
    const DECK_TOP_Y = 0.50; // Wooden deck & stone terrace height around the pool

    const furnitureColliders = []; // Array of { min: Vector3, max: Vector3, name }

    function addCollider(minX, minY, minZ, maxX, maxY, maxZ, name = 'prop') {
      furnitureColliders.push({
        min: new THREE.Vector3(minX, minY, minZ),
        max: new THREE.Vector3(maxX, maxY, maxZ),
        name
      });
    }

    // Organic shape function for the Hot Spring Pool centered around (-1.0, 0.8) in world units
    // In grid units (rx, rz): center is at (-4, 3), semi-axes ~ (19, 15)
    function getPoolNormalizedRadius(wx, wz) {
      const dx = (wx - (-1.0)) / 4.65;
      const dz = (wz - 0.8) / 3.75;
      const angle = Math.atan2(dz, dx);
      const lobe = 1.0 + 0.09 * Math.sin(angle * 3 + 0.6) + 0.06 * Math.cos(angle * 2 - 0.4);
      return Math.sqrt(dx * dx + dz * dz) / lobe;
    }

    function isInsidePoolWater(wx, wz) {
      return getPoolNormalizedRadius(wx, wz) < 0.96;
    }

    const solidEnvVoxels = [];
    const glossyEnvVoxels = [];
    const lanternVoxels = [];

    function pushVoxel(list, rx, ry, rz, colorHex, variance = 0.03, sx = 1, sy = 1, sz = 1) {
      list.push({
        x: rx,
        y: ry,
        z: rz,
        color: varyColor(colorHex, rx, ry, rz, variance),
        sx, sy, sz
      });
    }

    function pushBoxVoxels(list, x0, y0, z0, x1, y1, z1, colorFnOrHex, variance = 0.03) {
      for (let x = x0; x <= x1; x++) {
        for (let y = y0; y <= y1; y++) {
          for (let z = z0; z <= z1; z++) {
            if (x > x0 && x < x1 && y > y0 && y < y1 && z > z0 && z < z1) continue;
            const c = typeof colorFnOrHex === 'function' ? colorFnOrHex(x, y, z) : colorFnOrHex;
            if (c) pushVoxel(list, x, y, z, c, variance);
          }
        }
      }
    }

    // ----------------------------------------------------------------------------
    // 5A. MOUNTAIN BASE, STONE-RIMMED POOL, WOODEN DECK & PRIVACY FENCE
    // ----------------------------------------------------------------------------
    function buildOnsenPoolAndGround() {
      // Grid rx in [-40..40], rz in [-42..38] -> World X [-10..10], Z [-10.5..9.5]
      for (let rx = -40; rx <= 40; rx++) {
        for (let rz = -42; rz <= 38; rz++) {
          const wx = (rx + 0.5) * RV;
          const wz = (rz + 0.5) * RV;
          const poolR = getPoolNormalizedRadius(wx, wz);
          const isBorder = (rx === -40 || rx === 40 || rz === -42 || rz === 38);

          if (poolR < 0.98) {
            // Inside the Hot Spring Basin: Pebbled volcanic floor at ry = -3 (Y = -0.65)
            const pebbleCol = ((rx + rz) % 3 === 0) ? '#334155' : '#475569';
            pushVoxel(solidEnvVoxels, rx + 0.5, -3.0, rz + 0.5, pebbleCol, 0.04);
            // Sub-wall around pool perimeter
            if (poolR > 0.84) {
              pushVoxel(solidEnvVoxels, rx + 0.5, -2.0, rz + 0.5, '#475569', 0.04);
              pushVoxel(solidEnvVoxels, rx + 0.5, -1.0, rz + 0.5, '#64748b', 0.04);
            }
          } else {
            // Solid foundation rim
            if (isBorder) {
              for (let by = -3; by <= 0; by++) {
                pushVoxel(solidEnvVoxels, rx + 0.5, by + 0.5, rz + 0.5, '#334155', 0.02);
              }
            }

            // Right Side: Warm Hinoki Wooden Deck (rx >= 16, rz in [-26..24])
            const isWoodenDeck = (rx >= 16 && rx <= 38 && rz >= -26 && rz <= 24);
            if (isWoodenDeck) {
              const plankSeam = (rz % 3 === 0) || (rx % 8 === 0);
              const deckCol = plankSeam ? '#7c4d2b' : ((rx % 2 === 0) ? '#b07d4f' : '#a37044');
              pushVoxel(solidEnvVoxels, rx + 0.5, 1.5, rz + 0.5, deckCol, 0.025);
              if (rx === 16 || rx === 38 || rz === -26 || rz === 24) {
                pushVoxel(solidEnvVoxels, rx + 0.5, 0.5, rz + 0.5, '#6e4223', 0.02);
              }
            } else {
              // Stone Terrace & Snow-covered Mountain Ground (top at ry = 1.5 -> Y = 0.50)
              const distFromPool = poolR - 1.0;
              const noise = voxelHash(rx, 0, rz);
              if (distFromPool < 0.28 + noise * 0.08) {
                // Wet slate flagstones around the pool rim
                const stoneCol = ((Math.floor(rx / 2) + Math.floor(rz / 2)) % 2 === 0) ? '#64748b' : '#788799';
                pushVoxel(solidEnvVoxels, rx + 0.5, 1.5, rz + 0.5, stoneCol, 0.04);
              } else {
                // Crisp mountain snow bank!
                pushVoxel(solidEnvVoxels, rx + 0.5, 1.5, rz + 0.5, '#f1f5f9', 0.018);
                if (distFromPool > 0.55 && noise > 0.35) {
                  pushVoxel(solidEnvVoxels, rx + 0.5, 2.2, rz + 0.5, '#f8fafc', 0.015, 1, 0.65, 1);
                }
              }
            }

            // Natural Stone Rim Boulders ringing the Hot Spring Pool (poolR in [0.98..1.24])
            if (poolR >= 0.98 && poolR <= 1.24 && !(rx >= 14 && rx <= 18 && rz >= -4 && rz <= 8)) {
              // Leave a gentle entry step on the right side near the wooden deck
              const boulderHash = voxelHash( Math.floor(rx / 2), 3, Math.floor(rz / 2) );
              const rockHeight = (boulderHash > 0.65) ? 2 : 1;
              for (let rh = 1; rh <= rockHeight; rh++) {
                const rCol = (rh === rockHeight && boulderHash > 0.78)
                  ? '#f8fafc' // Snow dust on taller rim rocks
                  : (boulderHash > 0.4 ? '#64748b' : '#526071');
                pushVoxel(solidEnvVoxels, rx + 0.5, 1.5 + rh, rz + 0.5, rCol, 0.045);
              }
            }
          }
        }
      }

      // Large Scenic Boulders around the Back-Left & Back-Right of Pool
      const boulderClusters = [
        { cx: -25, cz: -14, r: 4.5, h: 6, col: '#526071', snow: true },
        { cx: -29, cz: -6,  r: 3.8, h: 5, col: '#64748b', snow: true },
        { cx: -14, cz: -18, r: 4.2, h: 5, col: '#576574', snow: true },
        { cx: 9,   cz: -16, r: 3.6, h: 4, col: '#64748b', snow: true },
        // Flat camera rock for Aya on the front-left rim (cx: -21, cz: 14 -> X = -5.25, Z = 3.5)
        { cx: -21, cz: 14,  r: 4.2, h: 2.5, col: '#64748b', snow: false },
        // Flat rock on the front-right rim for Momiji's red tokin hat (cx: 11, cz: 15 -> X = 2.75, Z = 3.75)
        { cx: 11,  cz: 15,  r: 3.4, h: 2.0, col: '#6c7a89', snow: false }
      ];

      boulderClusters.forEach((b, idx) => {
        const rCeil = Math.ceil(b.r);
        for (let dx = -rCeil; dx <= rCeil; dx++) {
          for (let dz = -rCeil; dz <= rCeil; dz++) {
            const d = Math.hypot(dx, dz);
            if (d > b.r) continue;
            const localH = Math.max(1, Math.round(b.h * (1 - (d / b.r) * 0.55)));
            for (let y = 2; y <= 1 + localH; y++) {
              const isTop = (y === 1 + localH);
              const col = (isTop && b.snow && d < b.r * 0.7) ? '#f8fafc' : b.col;
              pushVoxel(solidEnvVoxels, b.cx + dx + 0.5, y + 0.5, b.cz + dz + 0.5, col, 0.04);
            }
          }
        }
        addCollider(
          (b.cx - b.r * 0.8) * RV, 0.5, (b.cz - b.r * 0.8) * RV,
          (b.cx + b.r * 0.8) * RV, (2 + b.h) * RV, (b.cz + b.r * 0.8) * RV,
          'boulder_' + idx
        );
      });

      // --- WOODEN PRIVACY FENCE (Takegaki) along Left & Back-Left Perimeter ---
      // Left fence segment: rx = -34, rz from -28 to 20
      for (let rz = -28; rz <= 20; rz++) {
        const isPost = (rz % 8 === 0);
        const topY = isPost ? 15 : 13;
        for (let ry = 2; ry <= topY; ry++) {
          let fCol = isPost ? '#5c3a21' : ((rz % 2 === 0) ? '#8d5b36' : '#9c6740');
          if (ry === 5 || ry === 11) fCol = '#4a2e19'; // Horizontal bamboo tie rails
          pushVoxel(solidEnvVoxels, -34.5, ry + 0.5, rz + 0.5, fCol, 0.03);
        }
        // Snow cap along the top of the fence
        pushVoxel(solidEnvVoxels, -34.5, (topY + 1) + 0.3, rz + 0.5, '#f8fafc', 0.015, 1.1, 0.6, 1.0);
      }
      addCollider(-8.9, 0.5, -7.2, -8.3, 3.8, 5.2, 'privacy_fence_left');

      // Back fence segment: rz = -28, rx from -34 to 14 (with opening for waterfall cliff view)
      for (let rx = -34; rx <= 14; rx++) {
        if (rx >= -10 && rx <= 2) continue; // Scenic opening toward mountain waterfall
        const isPost = (rx % 8 === 0);
        const topY = isPost ? 15 : 13;
        for (let ry = 2; ry <= topY; ry++) {
          let fCol = isPost ? '#5c3a21' : ((rx % 2 === 0) ? '#8d5b36' : '#9c6740');
          if (ry === 5 || ry === 11) fCol = '#4a2e19';
          pushVoxel(solidEnvVoxels, rx + 0.5, ry + 0.5, -28.5, fCol, 0.03);
        }
        pushVoxel(solidEnvVoxels, rx + 0.5, (topY + 1) + 0.3, -28.5, '#f8fafc', 0.015, 1.0, 0.6, 1.1);
      }
      addCollider(-8.6, 0.5, -7.4, 3.6, 3.8, -6.8, 'privacy_fence_back');
    }

    // ----------------------------------------------------------------------------
    // 5B. DISTANT YOUKAI MOUNTAIN PEAKS, CLIFF WATERFALL & BAMBOO WATER SPOUT
    // ----------------------------------------------------------------------------
    const waterfallVoxelsData = [];
    const spoutStreamData = [];

    function buildMountainAndWaterworks() {
      // Distant Mountain Peaks along rz in [-42..-30], rx in [-38..36]
      const peaks = [
        { cx: -22, cz: -37, r: 14, h: 36 },
        { cx: -4,  cz: -36, r: 15, h: 42 }, // Central waterfall cliff peak
        { cx: 16,  cz: -37, r: 13, h: 32 }
      ];

      for (let rx = -38; rx <= 34; rx++) {
        for (let rz = -42; rz <= -30; rz++) {
          let maxH = 0;
          for (const pk of peaks) {
            const dist = Math.hypot((rx - pk.cx) * 0.9, (rz - pk.cz) * 1.3);
            if (dist < pk.r) {
              const ridge = Math.sin(rx * 0.4) * 1.5 + Math.cos(rz * 0.5) * 1.5;
              const h = Math.round(pk.h * Math.pow(1 - dist / pk.r, 1.35) + ridge);
              if (h > maxH) maxH = h;
            }
          }
          if (maxH <= 2) continue;

          // Carve waterfall channel down the center peak (rx in [-6..-2], rz >= -36)
          const isWaterfallChannel = (rx >= -6 && rx <= -2 && rz >= -36);
          const colTop = isWaterfallChannel ? '#38bdf8' : (maxH > 22 ? '#f8fafc' : '#cbd5e1');

          // Build outer visible shell of mountain (top 4 layers + front cliff face)
          for (let ry = Math.max(2, maxH - 4); ry <= maxH; ry++) {
            let mCol = '#475569';
            if (ry >= maxH - 1 && maxH > 18 && !isWaterfallChannel) {
              mCol = '#f8fafc'; // Snow-capped mountain peak!
            } else if (ry >= maxH - 3 && maxH > 14) {
              mCol = '#94a3b8';
            }
            pushVoxel(solidEnvVoxels, rx + 0.5, ry + 0.5, rz + 0.5, mCol, 0.035);
          }
        }
      }

      // Animated Distant Waterfall cascading down the cliff (rx in [-6..-2], ry from 34 down to 3)
      for (let ry = 3; ry <= 34; ry++) {
        for (let rx = -6; rx <= -2; rx++) {
          const rz = -34.5 + (34 - ry) * 0.18;
          waterfallVoxelsData.push({
            baseX: rx + 0.5,
            baseY: ry + 0.5,
            baseZ: rz,
            phase: ry * 0.45 + rx * 0.7
          });
        }
      }

      // --- BAMBOO WATER SPOUT (Kakehi) pouring into the Hot Spring Pool ---
      // Positioned at Back-Left of pool: rx from -22 to -14, rz from -12 to -7, ry = 7..9
      // Two crossed bamboo support legs
      for (let sy = 2; sy <= 9; sy++) {
        pushVoxel(solidEnvVoxels, -20.5, sy + 0.5, -11.5, '#65a30d', 0.03, 0.75, 1.0, 0.75);
        pushVoxel(solidEnvVoxels, -20.5, sy + 0.5, -9.5,  '#65a30d', 0.03, 0.75, 1.0, 0.75);
      }
      // Angled bamboo pipe (kakehi) sloping down toward (-14, 6.8, -9.5) -> World (-3.5, 1.7, -2.375)
      for (let i = 0; i <= 8; i++) {
        const bx = -22.5 + i * 1.0;
        const by = 9.4 - i * 0.28;
        const bz = -10.5 + i * 0.12;
        const isJoint = (i % 3 === 0);
        const bamCol = isJoint ? '#4d7c0f' : '#84cc16';
        pushVoxel(solidEnvVoxels, bx, by, bz, bamCol, 0.025, 1.05, 1.15, 1.15);
      }

      // Animated pouring stream from spout tip (-14.0, 7.0, -9.5) down to water level (ry = 2.2)
      for (let i = 0; i < 14; i++) {
        const t = i / 13;
        spoutStreamData.push({
          t,
          baseX: (-13.8 + t * 2.2) * RV,
          baseY: (7.0 - t * t * 5.0) * RV,
          baseZ: (-9.5 + t * 0.4) * RV,
          phase: i * 0.5
        });
      }
    }

    // ----------------------------------------------------------------------------
    // 5C. WOODEN CHANGING HUT WITH SWAYING NOREN CURTAIN, BENCH & SNOW-DUSTED PINES
    // ----------------------------------------------------------------------------
    const norenCurtainData = [];

    function buildChangingHutAndPines() {
      // Wooden Changing Hut on Right Deck: rx in [23..37], rz in [-23..-3], ry in [2..19]
      // Back wall (rz = -23), Right wall (rx = 37), South wall (rz = -3), Front wall (rx = 23) with Doorway
      for (let ry = 2; ry <= 19; ry++) {
        for (let rx = 23; rx <= 37; rx++) {
          for (let rz = -23; rz <= -3; rz++) {
            const isPerimeter = (rx === 23 || rx === 37 || rz === -23 || rz === -3);
            if (!isPerimeter) continue;

            // Front doorway cutout on rx === 23, rz in [-16..-10], ry in [2..15]
            if (rx === 23 && rz >= -16 && rz <= -10 && ry <= 15) continue;

            const isCornerPost = ((rx === 23 || rx === 37) && (rz === -23 || rz === -3)) ||
                                 (rx === 23 && (rz === -17 || rz === -9));
            let hutCol = '#d4a373'; // Warm plaster / cedar wall
            if (isCornerPost || ry === 2 || ry === 12 || ry === 19) {
              hutCol = '#5c3a21'; // Dark timber framing
            } else if (ry <= 6) {
              hutCol = ((rx + rz) % 2 === 0) ? '#8d5b36' : '#7f4f2b'; // Lower cedar wainscoting
            }
            pushVoxel(solidEnvVoxels, rx + 0.5, ry + 0.5, rz + 0.5, hutCol, 0.025);
          }
        }
      }

      // Warm glowing interior lantern inside the changing hut doorway
      pushBoxVoxels(lanternVoxels, 28, 13, -14, 30, 16, -12, '#fff3b0', 0.01);

      // Pitched Japanese Roof over the Changing Hut (ry = 20..26) with snow layer
      for (let layer = 0; layer <= 6; layer++) {
        const ry = 20 + layer;
        const xMin = 21 + Math.floor(layer * 0.8);
        const xMax = 39 - Math.floor(layer * 0.8);
        const zMin = -25 + Math.floor(layer * 0.4);
        const zMax = -1 - Math.floor(layer * 0.4);
        for (let rx = xMin; rx <= xMax; rx++) {
          for (let rz = zMin; rz <= zMax; rz++) {
            if (rx > xMin && rx < xMax && rz > zMin && rz < zMax && layer < 6) continue;
            const isSnowCap = (layer >= 2 && (rx + rz * 3) % 3 !== 0) || layer === 6;
            const roofCol = isSnowCap ? '#f8fafc' : ((rz % 2 === 0) ? '#334155' : '#1e293b');
            pushVoxel(solidEnvVoxels, rx + 0.5, ry + 0.5, rz + 0.5, roofCol, 0.025);
          }
        }
      }

      // Two Hanging Paper Lanterns (Chōchin) flanking the Hut Entrance (rx = 21.5, rz = -18 & -8)
      for (const lz of [-18.5, -7.5]) {
        pushVoxel(solidEnvVoxels, 21.5, 16.5, lz, '#3a2312', 0.01, 0.5, 1.2, 0.5);
        pushVoxel(solidEnvVoxels, 21.5, 15.5, lz, '#1e293b', 0.01, 1.5, 0.5, 1.5);
        for (let ly = 13; ly <= 14; ly++) {
          pushVoxel(lanternVoxels, 21.5, ly + 0.5, lz, '#ffedd5', 0.01, 1.7, 1.0, 1.7);
        }
        pushVoxel(solidEnvVoxels, 21.5, 12.2, lz, '#1e293b', 0.01, 1.4, 0.5, 1.4);
      }

      // Swaying Indigo Noren Curtain in the Hut Doorway (rx = 22.8, rz in [-16..-10], ry in [10..15])
      for (let rz = -16; rz <= -10; rz++) {
        // Leave vertical slits between panels at rz = -14 and rz = -12
        for (let ry = 10; ry <= 15; ry++) {
          if ((rz === -14 || rz === -12) && ry <= 13) continue;
          // White onsen symbol / wave motif in center of each panel
          const isMotif = (ry === 12 && (rz === -15 || rz === -13 || rz === -11)) ||
                          (ry === 11 && rz === -13);
          const nCol = isMotif ? '#f8fafc' : '#1e3a8a';
          norenCurtainData.push({
            baseX: 22.8,
            baseY: ry + 0.5,
            baseZ: rz + 0.5,
            weight: (15.5 - ry) / 5.5,
            panel: rz < -14 ? 0 : (rz > -12 ? 2 : 1),
            color: varyColor(nCol, 23, ry, rz, 0.025)
          });
        }
      }

      addCollider(5.7, 0.5, -5.8, 9.4, 6.0, -0.7, 'changing_hut');

      // --- WOODEN BENCH ON THE DECK (Sanae sits here! rx in [19..22], rz in [3..15], ry = 2..4 -> top at Y = 1.25) ---
      pushBoxVoxels(solidEnvVoxels, 19, 4, 3, 22, 4, 15, '#c88a51', 0.025); // Bench seat plank
      // Bench legs
      pushBoxVoxels(solidEnvVoxels, 19, 2, 4, 22, 3, 5, '#7c4d2b');
      pushBoxVoxels(solidEnvVoxels, 19, 2, 13, 22, 3, 14, '#7c4d2b');
      // Red felt cloth runner on the bench
      for (let rx = 19; rx <= 22; rx++) {
        for (let rz = 4; rz <= 14; rz++) {
          pushVoxel(solidEnvVoxels, rx + 0.5, 4.65, rz + 0.5, '#d90429', 0.025, 0.95, 0.3, 0.95);
        }
      }
      addCollider(4.7, 0.5, 0.7, 5.8, 1.25, 4.0, 'wooden_bench');

      // --- SNOW-DUSTED PINE TREES (Matsu) framing the Mountain Onsen ---
      const pineTrees = [
        { tx: -34, tz: -32, h: 24, r: 7.5 },
        { tx: -35, tz: 26,  h: 21, r: 6.5 },
        { tx: 30,  tz: -30, h: 23, r: 7.0 },
        { tx: 33,  tz: 26,  h: 19, r: 6.0 }
      ];

      pineTrees.forEach((tree, tIdx) => {
        // Trunk
        for (let ty = 2; ty <= tree.h - 4; ty++) {
          for (let dx = -1; dx <= 1; dx++) {
            for (let dz = -1; dz <= 1; dz++) {
              if (Math.abs(dx) === 1 && Math.abs(dz) === 1) continue;
              pushVoxel(solidEnvVoxels, tree.tx + dx + 0.5, ty + 0.5, tree.tz + dz + 0.5, '#5c3a21', 0.03);
            }
          }
        }
        // Tiered Pine Boughs with Snow Caps
        const tiers = 4;
        for (let t = 0; t < tiers; t++) {
          const tierY = 8 + t * 4;
          const tierR = tree.r * (1 - t * 0.2);
          const rInt = Math.ceil(tierR);
          for (let dx = -rInt; dx <= rInt; dx++) {
            for (let dz = -rInt; dz <= rInt; dz++) {
              const d = Math.hypot(dx, dz);
              if (d > tierR) continue;
              // Foliage layer
              pushVoxel(solidEnvVoxels, tree.tx + dx + 0.5, tierY + 0.5, tree.tz + dz + 0.5, '#1b4332', 0.04);
              pushVoxel(solidEnvVoxels, tree.tx + dx + 0.5, tierY + 1.5, tree.tz + dz + 0.5, '#2d6a4f', 0.04);
              // Snow blanket on top of pine bough
              if (d < tierR * 0.88) {
                pushVoxel(solidEnvVoxels, tree.tx + dx + 0.5, tierY + 2.35, tree.tz + dz + 0.5, '#f8fafc', 0.015, 1, 0.7, 1);
              }
            }
          }
        }
        addCollider(
          (tree.tx - 2) * RV, 0.5, (tree.tz - 2) * RV,
          (tree.tx + 2) * RV, (tree.h) * RV, (tree.tz + 2) * RV,
          'pine_tree_' + tIdx
        );
      });
    }

    // ----------------------------------------------------------------------------
    // 5D. ONSEN PROPS: STONE LANTERN, BUCKET STACK, STOOLS, EGG BASKET, CAMERA, TOKIN
    // ----------------------------------------------------------------------------
    function buildOnsenProps() {
      // 1. Stone Lantern (Tōrō) on the Left Rocks at (rx = -23, rz = -10 -> World X = -5.75, Z = -2.5)
      const lx = -23, lz = -10;
      pushBoxVoxels(solidEnvVoxels, lx - 1, 2, lz - 1, lx + 1, 3, lz + 1, '#64748b'); // Pedestal base
      pushBoxVoxels(solidEnvVoxels, lx, 4, lz, lx, 7, lz, '#788799'); // Stone pillar
      pushBoxVoxels(solidEnvVoxels, lx - 1, 8, lz - 1, lx + 1, 8, lz + 1, '#64748b'); // Firebox platform
      // Glowing firebox core (ry = 9..10)
      pushBoxVoxels(lanternVoxels, lx - 0.5, 9, lz - 0.5, lx + 0.5, 10, lz + 0.5, '#ffea85', 0.01);
      // Stone corner posts of firebox
      for (const cx of [-1, 1]) {
        for (const cz of [-1, 1]) {
          pushVoxel(solidEnvVoxels, lx + cx + 0.5, 9.5, lz + cz + 0.5, '#475569', 0.02, 0.5, 2.0, 0.5);
        }
      }
      // Pagoda umbrella roof (ry = 11..12) + snow cap
      pushBoxVoxels(solidEnvVoxels, lx - 2, 11, lz - 2, lx + 2, 11, lz + 2, '#475569');
      pushBoxVoxels(solidEnvVoxels, lx - 1, 12, lz - 1, lx + 1, 12, lz + 1, '#f8fafc');
      pushVoxel(solidEnvVoxels, lx + 0.5, 13.2, lz + 0.5, '#475569', 0.02, 0.8, 1.0, 0.8); // Finial
      addCollider(-6.3, 0.5, -3.1, -5.1, 3.5, -1.9, 'stone_lantern');

      // 2. Stack of Wooden Onsen Buckets (Oke) & Wooden Bath Stools on the Deck (rx in [25..31], rz in [12..19])
      const buildWoodenBucket = (bx, by, bz) => {
        for (let dx = -1; dx <= 1; dx++) {
          for (let dz = -1; dz <= 1; dz++) {
            const isRim = (Math.abs(dx) === 1 || Math.abs(dz) === 1);
            pushVoxel(solidEnvVoxels, bx + dx, by, bz + dz, '#d4a373', 0.02, 0.9, 0.6, 0.9);
            if (isRim) {
              pushVoxel(solidEnvVoxels, bx + dx, by + 0.7, bz + dz, '#e6b88a', 0.02, 0.85, 0.9, 0.85);
              pushVoxel(solidEnvVoxels, bx + dx, by + 1.1, bz + dz, '#2b2d42', 0.01, 0.9, 0.35, 0.9); // Copper/black hoop band
            }
          }
        }
      };
      // Pyramid stack of 3 wooden buckets on the deck
      buildWoodenBucket(28.5, 2.2, 16.5);
      buildWoodenBucket(28.5, 2.2, 19.5);
      buildWoodenBucket(28.5, 3.6, 18.0);

      // Two low wooden bath stools (koshikake) on the deck
      for (const sz of [9.5, 13.0]) {
        pushVoxel(solidEnvVoxels, 27.5, 2.6, sz, '#c88a51', 0.02, 2.2, 0.6, 1.6);
        pushVoxel(solidEnvVoxels, 26.7, 2.1, sz, '#8d5b36', 0.02, 0.5, 1.0, 1.5);
        pushVoxel(solidEnvVoxels, 28.3, 2.1, sz, '#8d5b36', 0.02, 0.5, 1.0, 1.5);
      }

      // 3. Basket of Onsen Tamago (Eggs boiling in the hot spring near the bamboo spout! rx = -13, rz = -7)
      const ex = -13.0, ez = -6.5;
      for (let dx = -1.5; dx <= 1.5; dx += 1.0) {
        for (let dz = -1.5; dz <= 1.5; dz += 1.0) {
          const isRim = (Math.abs(dx) === 1.5 || Math.abs(dz) === 1.5);
          if (isRim) {
            pushVoxel(solidEnvVoxels, ex + dx, 2.1, ez + dz, '#a16207', 0.03, 0.9, 1.2, 0.9);
          } else {
            // White & cream boiling eggs nestled inside the bamboo basket!

    // ============================================================================
    // 7. RISING STEAM CURLS, WATER RIPPLES, FALLING SNOW & NIGHT AURORA
    // ============================================================================
    // 7A. Rising Steam Particles that curl in the mountain breeze
    const STEAM_COUNT = 75;
    const steamData = [];
    const steamGeom = new THREE.BoxGeometry(0.24, 0.24, 0.24);
    const steamMat = new THREE.MeshBasicMaterial({
      color: 0xf8fafc,
      transparent: true,
      opacity: 0.30,
      depthWrite: false
    });
    const steamMesh = new THREE.InstancedMesh(steamGeom, steamMat, STEAM_COUNT);
    for (let i = 0; i < STEAM_COUNT; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * 3.4;
      steamData.push({
        baseX: -1.0 + Math.cos(angle) * r * 1.15,
        baseZ: 0.8 + Math.sin(angle) * r * 0.9,
        y: WATER_LEVEL + Math.random() * 5.2,
        speedY: 0.45 + Math.random() * 0.35,
        phase: Math.random() * Math.PI * 2,
        scale: 0.65 + Math.random() * 1.25
      });
    }
    scene.add(steamMesh);

    function updateSteamParticles(time, dt) {
      for (let i = 0; i < STEAM_COUNT; i++) {
        const s = steamData[i];
        s.y += s.speedY * dt;
        if (s.y > WATER_LEVEL + 5.4) {
          s.y = WATER_LEVEL + 0.05;
        }
        const heightNorm = (s.y - WATER_LEVEL) / 5.4;
        // Curl in the wind as steam rises
        const curlX = Math.sin(time * 1.1 + s.phase + heightNorm * 3.5) * (0.35 + heightNorm * 0.65) + heightNorm * 0.55;
        const curlZ = Math.cos(time * 0.9 + s.phase + heightNorm * 3.0) * (0.35 + heightNorm * 0.5);
        tempPos.set(s.baseX + curlX, s.y, s.baseZ + curlZ);
        tempQuat.setFromEuler(new THREE.Euler(time * 0.5 + s.phase, time * 0.4, 0));
        const size = s.scale * Math.sin(heightNorm * Math.PI) * 1.35;
        tempScale.set(size, size, size);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        steamMesh.setMatrixAt(i, tempMatrix);
      }
      steamMesh.instanceMatrix.needsUpdate = true;
    }

    // 7B. Expanding Water Ripples when a Fumo splashes in or bobs
    const activeRipples = []; // { x, z, radius, maxRadius, strength }
    const RIPPLE_VOXELS_PER_RING = 20;
    const MAX_RIPPLES = 5;
    const rippleGeom = new THREE.BoxGeometry(0.14, 0.04, 0.14);
    const rippleMat = new THREE.MeshBasicMaterial({
      color: 0xe0f2fe,
      transparent: true,
      opacity: 0.75
    });
    const rippleMesh = new THREE.InstancedMesh(rippleGeom, rippleMat, MAX_RIPPLES * RIPPLE_VOXELS_PER_RING);
    for (let i = 0; i < MAX_RIPPLES * RIPPLE_VOXELS_PER_RING; i++) {
      tempMatrix.makeScale(0, 0, 0);
      rippleMesh.setMatrixAt(i, tempMatrix);
    }
    scene.add(rippleMesh);

    function spawnWaterRipple(wx, wz, maxRadius = 2.4) {
      if (activeRipples.length >= MAX_RIPPLES) {
        activeRipples.shift();
      }
      activeRipples.push({
        x: wx,
        z: wz,
        radius: 0.25,
        maxRadius
      });
    }

    let spoutRippleTimer = 0;
    function updateWaterSurfaceAndRipples(time, dt) {
      // Periodic gentle ripple under the bamboo water spout impact point (-2.85, -2.2)
      spoutRippleTimer += dt;
      if (spoutRippleTimer > 1.1) {
        spoutRippleTimer = 0;
        spawnWaterRipple(-2.85, -2.2, 1.6);
      }

      // Advance active ripple rings
      for (let r = activeRipples.length - 1; r >= 0; r--) {
        const rp = activeRipples[r];
        rp.radius += dt * 1.85;
        if (rp.radius >= rp.maxRadius) {
          activeRipples.splice(r, 1);
        }
      }

      // Update voxel ring instances for ripples
      let idx = 0;
      for (let r = 0; r < MAX_RIPPLES; r++) {
        const rp = activeRipples[r];
        for (let k = 0; k < RIPPLE_VOXELS_PER_RING; k++) {
          if (!rp) {
            tempMatrix.makeScale(0, 0, 0);
            rippleMesh.setMatrixAt(idx++, tempMatrix);
            continue;
          }
          const ang = (k / RIPPLE_VOXELS_PER_RING) * Math.PI * 2 + time * 0.4;
          const rx = rp.x + Math.cos(ang) * rp.radius;
          const rz = rp.z + Math.sin(ang) * rp.radius;
          const fade = Math.max(0, 1.0 - rp.radius / rp.maxRadius);
          if (isInsidePoolWater(rx, rz)) {
            tempPos.set(rx, WATER_LEVEL + 0.035, rz);
            tempQuat.setFromAxisAngle(new THREE.Vector3(0, 1, 0), -ang);
            tempScale.set(fade * 1.2, 1, fade * 1.2);
            tempMatrix.compose(tempPos, tempQuat, tempScale);
          } else {
            tempMatrix.makeScale(0, 0, 0);
          }
          rippleMesh.setMatrixAt(idx++, tempMatrix);
        }
      }
      rippleMesh.instanceMatrix.needsUpdate = true;

      // Animate Pool Water Voxels (gentle waves + interactive ripple displacement)
      if (poolWaterMesh) {
        for (let i = 0; i < poolWaterVoxelsData.length; i++) {
          const w = poolWaterVoxelsData[i];
          let waveY = Math.sin(time * 2.2 + w.wx * 1.3 + w.wz * 1.1) * 0.025;
          for (let r = 0; r < activeRipples.length; r++) {
            const rp = activeRipples[r];
            const d = Math.hypot(w.wx - rp.x, w.wz - rp.z);
            if (Math.abs(d - rp.radius) < 0.35) {
              const fade = 1.0 - rp.radius / rp.maxRadius;
              waveY += Math.cos((d - rp.radius) * 9.0) * 0.055 * fade;
            }
          }
          tempPos.set(w.wx, WATER_LEVEL - 0.04 + waveY, w.wz);
          tempQuat.identity();
          tempScale.set(1, 0.55, 1);
          tempMatrix.compose(tempPos, tempQuat, tempScale);
          poolWaterMesh.setMatrixAt(i, tempMatrix);
        }
        poolWaterMesh.instanceMatrix.needsUpdate = true;
      }

      // Animate Distant Waterfall Voxels
      if (waterfallMesh) {
        for (let i = 0; i < waterfallVoxelsData.length; i++) {
          const wf = waterfallVoxelsData[i];
          const fallOffset = ((time * 7.5 + wf.phase) % 1.0);
          const wy = (wf.baseY - fallOffset) * RV;
          const foamScale = 0.85 + 0.3 * Math.sin(time * 9.0 + wf.phase);
          tempPos.set(wf.baseX * RV, wy, wf.baseZ * RV);
          tempQuat.identity();
          tempScale.set(1.0, foamScale, 0.85);
          tempMatrix.compose(tempPos, tempQuat, tempScale);
          waterfallMesh.setMatrixAt(i, tempMatrix);
        }
        waterfallMesh.instanceMatrix.needsUpdate = true;
      }

      // Animate Bamboo Spout Pouring Stream
      if (spoutStreamMesh) {
        for (let i = 0; i < spoutStreamData.length; i++) {
          const sp = spoutStreamData[i];
          const flow = ((sp.t + time * 1.8) % 1.0);
          const wx = (-13.8 + flow * 2.3) * RV;
          const wy = WATER_LEVEL + (1.0 - flow * flow) * (1.75 - WATER_LEVEL);
          const wz = (-9.5 + flow * 0.5) * RV;
          const s = (0.48 + 0.18 * Math.sin(time * 12 + i)) * RV;
          tempPos.set(wx, wy, wz);
          tempQuat.identity();
          tempScale.set(s, s * 1.35, s);
          tempMatrix.compose(tempPos, tempQuat, tempScale);
          spoutStreamMesh.setMatrixAt(i, tempMatrix);
        }
        spoutStreamMesh.instanceMatrix.needsUpdate = true;
      }

      // Animate Swaying Noren Curtain
      if (norenMesh) {
        for (let i = 0; i < norenCurtainData.length; i++) {
          const n = norenCurtainData[i];
          const breeze = Math.sin(time * 1.8 + n.panel * 1.1 + n.baseY * 0.25) * 0.48 * n.weight;
          tempPos.set((n.baseX - Math.abs(breeze) * 0.6) * RV, n.baseY * RV, (n.baseZ + breeze * 0.25) * RV);
          tempQuat.setFromEuler(new THREE.Euler(0, 0, breeze * 0.35));
          tempScale.set(0.35, 1, 1);
          tempMatrix.compose(tempPos, tempQuat, tempScale);
          norenMesh.setMatrixAt(i, tempMatrix);
        }
        norenMesh.instanceMatrix.needsUpdate = true;
      }
    }

    // 7C. Falling Snowflakes across Youkai Mountain
    const SNOW_COUNT = 160;
    const snowData = [];
    const snowGeom = new THREE.BoxGeometry(0.085, 0.085, 0.085);
    const snowMat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.85
    });
    const snowMesh = new THREE.InstancedMesh(snowGeom, snowMat, SNOW_COUNT);
    for (let i = 0; i < SNOW_COUNT; i++) {
      snowData.push({
        x: -11 + Math.random() * 22,
        y: 0.5 + Math.random() * 13.5,
        z: -11 + Math.random() * 22,
        vy: 0.65 + Math.random() * 0.55,
        phase: Math.random() * Math.PI * 2,
        scale: 0.6 + Math.random() * 0.85
      });
    }
    scene.add(snowMesh);

    function updateFallingSnow(time, dt) {
      for (let i = 0; i < SNOW_COUNT; i++) {
        const s = snowData[i];
        s.y -= s.vy * dt;
        s.x += Math.sin(time * 0.9 + s.phase) * 0.35 * dt;
        s.z += Math.cos(time * 0.7 + s.phase) * 0.25 * dt;
        if (s.y < 0.4) {
          s.y = 13.8;
          s.x = -11 + Math.random() * 22;
          s.z = -11 + Math.random() * 22;
        }
        tempPos.set(s.x, s.y, s.z);
        tempQuat.setFromEuler(new THREE.Euler(time + s.phase, time * 0.8, 0));
        tempScale.set(s.scale, s.scale, s.scale);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        snowMesh.setMatrixAt(i, tempMatrix);
      }
      snowMesh.instanceMatrix.needsUpdate = true;
    }

    // 7D. Night Sky Stars & Faint Shimmering Aurora Borealis Ribbon
    const STAR_COUNT = 120;
    const starGeom = new THREE.BoxGeometry(0.14, 0.14, 0.14);
    const starMat = new THREE.MeshBasicMaterial({
      color: 0xfffbeb,
      transparent: true,
      opacity: 0.0
    });
    const starMesh = new THREE.InstancedMesh(starGeom, starMat, STAR_COUNT);
    for (let i = 0; i < STAR_COUNT; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = 0.15 + Math.random() * 0.85;
      const r = 36 + Math.random() * 12;
      tempPos.set(
        Math.cos(theta) * Math.sin(phi) * r,
        Math.cos(phi) * r + 4,
        Math.sin(theta) * Math.sin(phi) * r - 8
      );
      tempQuat.identity();
      const s = 0.6 + Math.random() * 1.3;
      tempScale.set(s, s, s);
      tempMatrix.compose(tempPos, tempQuat, tempScale);
      starMesh.setMatrixAt(i, tempMatrix);
    }
    starMesh.instanceMatrix.needsUpdate = true;
    scene.add(starMesh);

    // Voxel Aurora Borealis Curtain in the Night Sky behind Youkai Mountain
    const auroraColumns = [];
    for (let ax = -28; ax <= 28; ax++) {
      for (let ay = 0; ay < 5; ay++) {
        auroraColumns.push({
          ix: ax,
          iy: ay,
          baseX: ax * 0.68,
          baseY: 13.5 + ay * 0.85,
          baseZ: -17.5 - Math.abs(ax) * 0.12
        });
      }
    }
    const auroraGeom = new THREE.BoxGeometry(0.55, 0.8, 0.22);
    const auroraMesh = new THREE.InstancedMesh(auroraGeom, auroraMaterial, auroraColumns.length);
    for (let i = 0; i < auroraColumns.length; i++) {
      const c = auroraColumns[i];
      const hue = 0.42 + (c.ix + 28) / 56 * 0.32 + c.iy * 0.04; // Teal -> Emerald -> Violet aurora gradient
      tempColor.setHSL(hue % 1.0, 0.85, 0.62);
      auroraMesh.setColorAt(i, tempColor);
    }
    auroraMesh.instanceColor.needsUpdate = true;
    scene.add(auroraMesh);

    function updateAurora(time) {
      if (auroraMaterial.opacity <= 0.01) return;
      for (let i = 0; i < auroraColumns.length; i++) {
        const c = auroraColumns[i];
        const waveZ = Math.sin(time * 0.8 + c.ix * 0.18) * 1.4;
        const waveY = Math.cos(time * 1.1 + c.ix * 0.22 + c.iy * 0.5) * 0.45;
        tempPos.set(c.baseX, c.baseY + waveY, c.baseZ + waveZ);
        tempQuat.identity();
        const scaleY = 0.75 + 0.45 * Math.sin(time * 1.5 + c.ix * 0.3 + c.iy);
        tempScale.set(1, scaleY, 1);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        auroraMesh.setMatrixAt(i, tempMatrix);
      }
      auroraMesh.instanceMatrix.needsUpdate = true;
    }

    // 7E. Squeeze Pop & Water Splash Droplet Particles
    const POP_MAX = 64;
    const popParticles = [];
    const popGeom = new THREE.BoxGeometry(0.11, 0.11, 0.11);
    const popMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const popMesh = new THREE.InstancedMesh(popGeom, popMat, POP_MAX);
    for (let i = 0; i < POP_MAX; i++) {
      popParticles.push({ active: false, pos: new THREE.Vector3(), vel: new THREE.Vector3(), life: 0, maxLife: 1, color: new THREE.Color('#ff85a1') });
      tempMatrix.makeScale(0, 0, 0);
      popMesh.setMatrixAt(i, tempMatrix);
    }
    scene.add(popMesh);

    function spawnBurstParticles(origin, palette, count = 12, upwardSpeed = 2.6) {
      let spawned = 0;
      for (let i = 0; i < POP_MAX && spawned < count; i++) {
        const p = popParticles[i];
        if (!p.active) {
          p.active = true;
          p.life = 0;
          p.maxLife = 0.45 + Math.random() * 0.25;
          p.pos.copy(origin).add(new THREE.Vector3(0, 0.55, 0));
          const angle = (spawned / count) * Math.PI * 2 + Math.random() * 0.3;
          const speed = 1.8 + Math.random() * 2.2;
          p.vel.set(Math.cos(angle) * speed, upwardSpeed + Math.random() * 2.2, Math.sin(angle) * speed);
          p.color.set(palette[spawned % palette.length]);
          popMesh.setColorAt(i, p.color);
          spawned++;
        }
      }
      if (popMesh.instanceColor) popMesh.instanceColor.needsUpdate = true;
    }

    function updatePopParticles(dt) {
      let dirty = false;
      for (let i = 0; i < POP_MAX; i++) {
        const p = popParticles[i];
        if (!p.active) continue;
        dirty = true;
        p.life += dt;
        if (p.life >= p.maxLife) {
          p.active = false;
          tempMatrix.makeScale(0, 0, 0);
          popMesh.setMatrixAt(i, tempMatrix);
          continue;
        }
        p.vel.y -= 8.5 * dt;
        p.pos.addScaledVector(p.vel, dt);
        const s = 1.0 - (p.life / p.maxLife);
        tempQuat.setFromEuler(new THREE.Euler(p.life * 8, p.life * 6, 0));
        tempScale.set(s, s, s);
        tempMatrix.compose(p.pos, tempQuat, tempScale);
        popMesh.setMatrixAt(i, tempMatrix);
      }
      if (dirty) popMesh.instanceMatrix.needsUpdate = true;
    }

    // ============================================================================
    // 8. TOUHOU FUMO VOXEL PLUSHIE BUILDER & SOFT-BODY + BUOYANCY PHYSICS CLASS
    // ============================================================================
    const allFumoRaycastMeshes = [];
    const fumos = [];

    class VoxelFumo {
      constructor(config) {
        this.id = config.id;
        this.name = config.name;
        this.emoji = config.emoji || '♨️';
        this.accentColor = config.accentColor || '#38bdf8';
        this.scaleFactor = config.scale || 1.0;
        this.FV = 0.082 * this.scaleFactor; // Exact fine voxel size per fumo block
        this.radius = 0.85 * this.scaleFactor;
        this.pitchAudio = config.pitchAudio || 1.0;
        this.mountType = config.mountType || null; // 'iceBlock' | 'kappaTub' | 'floatingBucket' | null
        this.isSleeping = Boolean(config.isSleeping);

        this.homePos = config.homePos.clone();
        this.homeYaw = config.homeYaw || 0;

        this.pos = this.homePos.clone();
        this.vel = new THREE.Vector3();
        this.yaw = this.homeYaw;
        this.pitch = 0;
        this.roll = 0;
        this.angVel = new THREE.Vector3();
        this.isGrounded = true;
        this.isDragged = false;
        this.inWater = isInsidePoolWater(this.pos.x, this.pos.z) && this.pos.y <= WATER_LEVEL + 0.35;

        // Soft-Body Spring States
        this.squash = 1.0;
        this.squashVel = 0.0;

        this.headPitch = 0.0;
        this.headRoll = 0.0;
        this.headPitchVel = 0.0;
        this.headRollVel = 0.0;

        this.limbPitch = 0.0;
        this.limbRoll = 0.0;
        this.limbPitchVel = 0.0;
        this.limbRollVel = 0.0;

        this.root = new THREE.Group();
        this.squashGroup = new THREE.Group();
        this.root.add(this.squashGroup);

        this.headPivot = new THREE.Group();
        this.headPivot.position.set(0, 7.2 * this.FV, 0);
        this.squashGroup.add(this.headPivot);

        this.leftArmPivot = new THREE.Group();
        this.leftArmPivot.position.set(-4.2 * this.FV, 6.2 * this.FV, 0.5 * this.FV);
        this.squashGroup.add(this.leftArmPivot);

        this.rightArmPivot = new THREE.Group();
        this.rightArmPivot.position.set(4.2 * this.FV, 6.2 * this.FV, 0.5 * this.FV);
        this.squashGroup.add(this.rightArmPivot);

        this.leftLegPivot = new THREE.Group();
        this.leftLegPivot.position.set(-2.3 * this.FV, 1.8 * this.FV, 3.2 * this.FV);
        this.squashGroup.add(this.leftLegPivot);

        this.rightLegPivot = new THREE.Group();
        this.rightLegPivot.position.set(2.3 * this.FV, 1.8 * this.FV, 3.2 * this.FV);
        this.squashGroup.add(this.rightLegPivot);

        this.wingsPivot = new THREE.Group();
        this.wingsPivot.position.set(0, 4.8 * this.FV, -3.5 * this.FV);
        this.squashGroup.add(this.wingsPivot);

        this.buildCharacterVoxels(config);
        this.syncTransform(0);
        scene.add(this.root);
      }

      buildCharacterVoxels(cfg) {
        const bodyVoxels = [];
        const headVoxels = [];
        const leftArmVoxels = [];
        const rightArmVoxels = [];
        const leftLegVoxels = [];
        const rightLegVoxels = [];
        const wingSolidVoxels = [];
        const wingGlowVoxels = [];

        const skinBase = '#ffe5d4';
        const blushCol = '#ff9ebb';
        const smileCol = '#4a2525';

        const addPlushVoxel = (arr, x, y, z, col, isSeam = false) => {
          const seamDarken = (isSeam && ((Math.abs(x + y + z) % 2) === 0)) ? 0.055 : 0;
          arr.push({
            x, y, z,
            color: varyColor(col, x + this.id.length * 7, y, z, 0.04, seamDarken)
          });
        };

        // 1. STUBBY SITTING TORSO (Local y: 0..7, x: -4..4, z: -3..3)
        for (let y = 0; y <= 7; y++) {
          const rMax = (y === 0 || y === 7) ? 3.4 : 4.2 - (y * 0.12);
          for (let x = -4; x <= 4; x++) {
            for (let z = -3; z <= 3; z++) {
              const dist = Math.hypot(x, z * 1.15);
              if (dist > rMax) continue;

              const isSideSeam = (z === 0 && Math.abs(x) >= rMax - 0.9);
              let col = cfg.outfitMain;

              if (y === 1 && z >= 1) col = '#ffffff';
              if (cfg.hasWhiteTop && y >= 4) col = '#ffffff';
              if (cfg.frontPanel && z >= 1 && Math.abs(x) <= 2 && y >= 1 && y <= 5) {
                col = cfg.frontPanel;
              }
              if (y >= 5 && z >= 2 && Math.abs(x) <= 2) {
                col = '#ffffff';
                if (Math.abs(x) <= 1 && y === 5) col = cfg.tieColor || '#ef4444';
              }

              addPlushVoxel(bodyVoxels, x, y + 0.5, z, col, isSideSeam);
            }
          }
        }

        // 2. SHORT DANGLING ARMS
        for (const side of [-1, 1]) {
          const targetArr = side === -1 ? leftArmVoxels : rightArmVoxels;
          for (let y = -3; y <= 0; y++) {
            for (let x = -1; x <= 1; x++) {
              for (let z = -1; z <= 1; z++) {
                if (Math.abs(x) === 1 && Math.abs(z) === 1 && y === -3) continue;
                let col = cfg.sleeveColor || '#ffffff';
                if (y === -3) col = skinBase;
                else if (this.id === 'sanae' && y === -1) col = '#38bdf8';
                addPlushVoxel(targetArr, x * 0.85 + side * 0.4, y, z * 0.85, col, x === 0);
              }
            }
          }
        }

        // 3. SHORT SITTING / DANGLING LEGS WITH SHOES
        for (const side of [-1, 1]) {
          const targetArr = side === -1 ? leftLegVoxels : rightLegVoxels;
          for (let z = 0; z <= 4; z++) {
            for (let x = -1; x <= 1; x++) {
              for (let y = -1; y <= 1; y++) {
                if (Math.abs(x) === 1 && Math.abs(y) === 1) continue;
                let col = '#ffffff';
                if (z === 0) col = skinBase;
                if (z >= 3) col = cfg.shoeColor || '#2b2d42';
                if (z === 4 && y === 1 && x === 0) col = '#ffffff';
                addPlushVoxel(targetArr, x * 0.9, y * 0.9, z * 0.9, col, y === 0);
              }
            }
          }
        }

        // 4. OVERSIZED ROUND FUMO HEAD, ICONIC 'ᗜˬᗜ' FACE, HAIR & ACCESSORIES
        for (let y = 0; y <= 12; y++) {
          for (let x = -7; x <= 7; x++) {
            for (let z = -6; z <= 6; z++) {
              const dy = (y - 6.0) * 1.05;
              const dx = x * 0.94;
              const dz = z * 1.02;
              const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
              if (dist > 6.4 || dist < 4.5) continue;

              let col = skinBase;
              const isHeadSeam = (z === 0 && Math.abs(x) >= 5);

              const isBackOrTop = (z <= 1) || (y >= 9) || (Math.abs(x) >= 5 && z <= 3);
              const isForeheadBangs = (z >= 4 && y >= 7 && (Math.abs(x) !== 2 || y >= 8));
              const isSideLocks = (Math.abs(x) >= 5 && z >= 2 && y >= 2);

              if (isBackOrTop || isForeheadBangs || isSideLocks) {
                col = cfg.hairColor;
              } else if (z >= 5) {
                if (this.isSleeping) {
                  // Peaceful sleeping Fumo eyes (ㅡ ㅡ)
                  if ((Math.abs(x) === 3 || Math.abs(x) === 2) && y === 5) {
                    col = '#1f141e';
                  } else if (Math.abs(x) === 4 && y === 3) {
                    col = blushCol;
                  } else if (y === 2 && Math.abs(x) <= 1) {
                    col = (x === 0) ? '#e07a7a' : smileCol;
                  }
                } else {
                  if ((Math.abs(x) === 3 || Math.abs(x) === 2) && y >= 4 && y <= 6) {
                    if (y === 6) col = '#1f141e';
                    else if (y === 5 && Math.abs(x) === 2) col = '#ffffff';
                    else col = cfg.eyeColor;
                  } else if (Math.abs(x) === 4 && y === 3) {
                    col = blushCol;
                  } else if (y === 2 && Math.abs(x) <= 1) {
                    col = (x === 0) ? '#e07a7a' : smileCol;
                  }
                }
              }

              addPlushVoxel(headVoxels, x, y, z, col, isHeadSeam);
            }
          }
        }

        // Character-Specific Details:
        if (this.id === 'momiji') {
          // Fluffy White Wolf Ears on top-sides of head!
          for (const side of [-1, 1]) {
            for (let ey = 0; ey <= 3; ey++) {
              const w = ey < 2 ? 1 : 0;
              for (let ex = -w; ex <= w; ex++) {
                const isInnerEar = (ey === 1 && ex === 0);
                addPlushVoxel(headVoxels, side * 4.2 + ex * 0.8, 11.2 + ey * 0.85, 0.8, isInnerEar ? '#fda4af' : '#f8fafc');
              }
            }
          }
          // Warm Folded Onsen Towel balanced right on top of Momiji's head!
          for (let tx = -3; tx <= 3; tx++) {
            for (let tz = -2; tz <= 3; tz++) {
              addPlushVoxel(headVoxels, tx * 0.85, 12.0, tz * 0.85, '#ffffff');
              addPlushVoxel(headVoxels, tx * 0.8,  12.7, tz * 0.8,  tz === 2 ? '#93c5fd' : '#f8fafc');
            }
          }
        }

        if (this.id === 'aya') {
          // Red Tokin Hat perched on top of Aya's forehead
          for (let tx = -2; tx <= 2; tx++) {
            for (let tz = 0; tz <= 3; tz++) {
              for (let ty = 11; ty <= 13; ty++) {
                if (ty === 13 && (Math.abs(tx) === 2 || tz === 3)) continue;
                addPlushVoxel(headVoxels, tx * 0.75, ty * 0.95, tz * 0.85, '#dc2626');
              }
            }
          }
          // Black Crow Wings on Aya's back
          for (const side of [-1, 1]) {
            for (let wx = 1; wx <= 6; wx++) {
              const topY = 2.2 + Math.sin((wx / 6) * Math.PI) * 2.2;
              for (let wy = -1; wy <= topY; wy++) {
                wingSolidVoxels.push({
                  x: side * wx * 0.95,
                  y: wy,
                  z: -0.6 - wx * 0.12,
                  color: varyColor('#1e293b', wx, wy, 0, 0.03)
                });
              }
            }
          }
        }

        if (this.id === 'nitori') {
          // Blue Twin-Tails tied with yellow bands on both sides
          for (const side of [-1, 1]) {
            for (let ty = 0; ty <= 6; ty++) {
              const col = (ty === 6) ? '#facc15' : cfg.hairColor;
              addPlushVoxel(headVoxels, side * 6.8, ty, 0.5, col);
              addPlushVoxel(headVoxels, side * 7.4, ty - 0.5, 0.0, col);
            }
          }
          // Green Kappa Cap with Front Visor Bill
          for (let hx = -6; hx <= 6; hx++) {
            for (let hz = -6; hz <= 6; hz++) {
              const r = Math.hypot(hx, hz);
              if (r <= 6.2) {
                addPlushVoxel(headVoxels, hx, 11.2, hz, '#22c55e');
                if (r <= 4.8) addPlushVoxel(headVoxels, hx, 12.1, hz, '#16a34a');
              }
            }
          }
          // Cap front visor
          for (let vx = -4; vx <= 4; vx++) {
            for (let vz = 5; vz <= 8; vz++) {
              if (Math.abs(vx) === 4 && vz === 8) continue;
              addPlushVoxel(headVoxels, vx, 9.8, vz, '#15803d');
            }
          }
        }

        if (this.id === 'sanae') {
          // Long flowing green hair locks in front/back + White Snake hairband + Frog hair clip!
          for (const side of [-1, 1]) {
            for (let sy = -2; sy <= 4; sy++) {
              addPlushVoxel(headVoxels, side * 6.2, sy, 2.6, cfg.hairColor);
            }
          }
          // White snake coil ornament along right side of hair
          for (let wy = 4; wy <= 9; wy++) {
            addPlushVoxel(headVoxels, 5.8, wy, 2.8, wy === 9 ? '#ef4444' : '#ffffff');
          }
          // Cute green Frog hair clip on top-left of head
          for (let fx = -4; fx <= -2; fx++) {
            addPlushVoxel(headVoxels, fx, 11.4, 2.8, '#4ade80');
          }
          addPlushVoxel(headVoxels, -3.8, 12.3, 3.2, '#ffffff');
          addPlushVoxel(headVoxels, -2.2, 12.3, 3.2, '#ffffff');
        }

        if (this.id === 'kanako') {
          // Folded warm pink towel on Kanako's head
          for (let tx = -3; tx <= 3; tx++) {
            for (let tz = -2; tz <= 2; tz++) {
              addPlushVoxel(headVoxels, tx * 0.85, 11.8, tz * 0.85, '#ffe4e6');
            }
          }
          // Grand Sacred Shimenawa Rope Ring on Kanako's Back with 4 White Paper Gohei!
          const ringR = 6.2;
          for (let deg = 0; deg < 360; deg += 12) {
            const rad = (deg * Math.PI) / 180;
            const rx = Math.cos(rad) * ringR;
            const ry = 3.5 + Math.sin(rad) * ringR;
            wingSolidVoxels.push({
              x: rx, y: ry, z: -1.4,
              color: varyColor('#b45309', rx, ry, 0, 0.04),
              sx: 1.25, sy: 1.25, sz: 1.15
            });
          }
          // 4 White Zigzag Shide / Gohei hanging from the Shimenawa ring
          const goheiAngles = [0.6, 2.5, 3.9, 5.6];
          for (const ang of goheiAngles) {
            const gx = Math.cos(ang) * ringR;
            const gy = 3.5 + Math.sin(ang) * ringR;
            for (let s = 0; s < 3; s++) {
              wingSolidVoxels.push({
                x: gx + (s % 2 === 0 ? 0.45 : -0.45),
                y: gy - 0.9 - s * 0.85,
                z: -1.1,
                color: new THREE.Color('#ffffff'),
                sx: 0.75, sy: 0.85, sz: 0.35
              });
            }
          }
        }

        if (this.id === 'cirno') {
          // Big Blue Bow behind head
          for (let bx = -6; bx <= 6; bx++) {
            const h = Math.min(3, Math.floor(Math.abs(bx) * 0.65) + 1);
            for (let by = -h; by <= h; by++) {
              addPlushVoxel(headVoxels, bx, 10.5 + by * 0.75, -4.8, '#1d4ed8');
            }
          }
          // 6 Glowing Translucent Ice Shard Wings!
          const wingAngles = [0.45, 0.05, -0.35];
          for (const side of [-1, 1]) {
            for (let w = 0; w < 3; w++) {
              const ang = wingAngles[w];
              for (let r = 1; r <= 7; r++) {
                const wx = side * (1.2 + Math.cos(ang) * r * 1.05);
                const wy = 1.0 + Math.sin(ang) * r * 1.05;
                const wz = -0.5 - r * 0.15;
                wingGlowVoxels.push({
                  x: wx, y: wy, z: wz,
                  color: varyColor(r > 5 ? '#e0f2fe' : '#38bdf8', wx, wy, wz, 0.02),
                  sx: 1.1, sy: 0.85, sz: 0.6
                });
              }
            }
          }
        }

        if (this.id === 'suwako') {
          // Cute Frog Hat with Big Googly Frog Eyes on top of head!
          for (let hx = -7; hx <= 7; hx++) {
            for (let hz = -6; hz <= 6; hz++) {
              const r = Math.hypot(hx, hz);
              if (r <= 6.8 && r >= 4.2) {
                addPlushVoxel(headVoxels, hx, 10.6, hz, '#a3b18a');
                if (r <= 5.6) addPlushVoxel(headVoxels, hx, 11.6, hz, '#a3b18a');
              }
            }
          }
          for (const side of [-1, 1]) {
            addPlushVoxel(headVoxels, side * 3.5, 13.0, 2.5, '#a3b18a');
            addPlushVoxel(headVoxels, side * 3.5, 13.2, 3.3, '#ffffff');
            addPlushVoxel(headVoxels, side * 3.5, 13.2, 3.9, '#1e293b');
          }
        }

        const registerPart = (voxels, parent, mat = plushMaterial) => {
          const m = buildVoxelInstancedMesh(voxels, this.FV, mat, true, true);
          if (m) {
            m.userData.fumo = this;
            parent.add(m);
            allFumoRaycastMeshes.push(m);
          }
          return m;
        };

        registerPart(bodyVoxels, this.squashGroup);
        registerPart(headVoxels, this.headPivot);
        registerPart(leftArmVoxels, this.leftArmPivot);
        registerPart(rightArmVoxels, this.rightArmPivot);
        registerPart(leftLegVoxels, this.leftLegPivot);
        registerPart(rightLegVoxels, this.rightLegPivot);
        registerPart(wingSolidVoxels, this.wingsPivot);
        if (wingGlowVoxels.length > 0) {
          registerPart(wingGlowVoxels, this.wingsPivot, translucentIceMaterial);
        }
      }

      squeeze(strength = 1.0) {
        this.squash = Math.max(0.52, this.squash - 0.42 * strength);
        this.squashVel = -3.5 * strength;
        this.headPitchVel += (Math.random() - 0.5) * 14 * strength;
        this.headRollVel += (Math.random() > 0.5 ? 1 : -1) * 11 * strength;
        this.limbPitch = -0.65 * strength;
        this.limbPitchVel = -6.0 * strength;

        // If Cirno is squeezed, her ice fairy power re-freezes the melting ice block!
        if (this.id === 'cirno') {
          iceMeltScale = 1.0;
        }
        if (this.inWater) {
          spawnWaterRipple(this.pos.x, this.pos.z, 2.2);
        }
        spawnBurstParticles(this.pos, [this.accentColor, '#ff85a1', '#fde047', '#ffffff'], 12, 2.5);
        soundFX.playSqueeze(this.pitchAudio);
      }

      resetToHome() {
        this.pos.copy(this.homePos);
        this.vel.set(0, 0, 0);
        this.yaw = this.homeYaw;
        this.pitch = 0;
        this.roll = 0;
        this.angVel.set(0, 0, 0);
        this.isGrounded = true;
        this.isDragged = false;
        this.inWater = isInsidePoolWater(this.pos.x, this.pos.z) && this.pos.y <= WATER_LEVEL + 0.35;
        this.squeeze(0.75);
      }

      updatePhysics(dt, time) {
        // 1. Squash & Stretch Elastic Spring
        const squashStiff = 210.0;
        const squashDamp = 11.5;
        const squashForce = (1.0 - this.squash) * squashStiff - this.squashVel * squashDamp;
        this.squashVel += squashForce * dt;
        this.squash += this.squashVel * dt;
        this.squash = THREE.MathUtils.clamp(this.squash, 0.45, 1.55);

        // 2. Head Wobble Spring
        const headStiff = 140.0;
        const headDamp = 7.5;
        const idleHeadBob = this.isSleeping
          ? 0.16 + Math.sin(time * 1.4) * 0.04
          : Math.sin(time * 2.2 + this.homePos.x) * 0.025;
        this.headPitchVel += ((idleHeadBob - this.headPitch) * headStiff - this.headPitchVel * headDamp) * dt;
        this.headRollVel += ((0 - this.headRoll) * headStiff - this.headRollVel * headDamp) * dt;
        this.headPitch = THREE.MathUtils.clamp(this.headPitch + this.headPitchVel * dt, -0.55, 0.55);
        this.headRoll = THREE.MathUtils.clamp(this.headRoll + this.headRollVel * dt, -0.55, 0.55);

        // 3. Dangling Limb Springs
        const targetLimbPitch = (this.isDragged || (!this.isGrounded && !this.inWater)) ? 0.58 : 0.0;
        const limbStiff = 120.0;
        const limbDamp = 8.0;
        this.limbPitchVel += ((targetLimbPitch - this.limbPitch) * limbStiff - this.limbPitchVel * limbDamp) * dt;
        this.limbRollVel += ((0 - this.limbRoll) * limbStiff - this.limbRollVel * limbDamp) * dt;
        this.limbPitch = THREE.MathUtils.clamp(this.limbPitch + this.limbPitchVel * dt, -0.8, 0.9);
        this.limbRoll = THREE.MathUtils.clamp(this.limbRoll + this.limbRollVel * dt, -0.6, 0.6);

        // 4. Rigid-Body + Water Buoyancy Motion when NOT dragged
        if (!this.isDragged) {
          const overPool = isInsidePoolWater(this.pos.x, this.pos.z);

          // Determine target float height when soaking or riding a floating mount in the pool
          let targetFloatY = WATER_LEVEL - 0.22 * this.scaleFactor;
          if (this.mountType === 'iceBlock') {
            targetFloatY = WATER_LEVEL + 0.14 * iceMeltScale;
          } else if (this.mountType === 'kappaTub') {
            targetFloatY = WATER_LEVEL + 0.06;
          } else if (this.mountType === 'floatingBucket') {
            targetFloatY = WATER_LEVEL + 0.05;
          }

          const bobOffset = Math.sin(time * 2.1 + this.homePos.x * 1.3 + this.homePos.z) * 0.038;

          if (overPool && this.pos.y <= targetFloatY + 0.18) {
            // Detect splash entry into the hot spring pool!
            if (!this.inWater && this.vel.y < -1.8) {
              const splashPower = Math.min(1.5, Math.abs(this.vel.y) * 0.12);
              spawnWaterRipple(this.pos.x, this.pos.z, 2.8);
              spawnBurstParticles(
                new THREE.Vector3(this.pos.x, WATER_LEVEL, this.pos.z),
                ['#e0f2fe', '#7dd3fc', '#38bdf8', '#ffffff'],
                16,
                3.2
              );
              soundFX.playSplash(splashPower);
              this.squashVel -= Math.min(7.5, Math.abs(this.vel.y) * 0.65);
              this.headPitchVel += (Math.random() - 0.5) * 8.0;
            }
            this.inWater = true;
            this.isGrounded = true;

            // Spring-damped Archimedes buoyancy in the hot spring water
            const depthError = (targetFloatY + bobOffset) - this.pos.y;
            this.vel.y += depthError * 36.0 * dt;
            this.vel.y *= Math.pow(0.12, dt); // Strong vertical water damping
            this.vel.x *= Math.pow(0.22, dt); // Horizontal water drag
            this.vel.z *= Math.pow(0.22, dt);

            this.pos.addScaledVector(this.vel, dt);

            // Gentle water wave rocking
            const waveTiltX = Math.sin(time * 1.9 + this.pos.x) * 0.045;
            const waveTiltZ = Math.cos(time * 1.7 + this.pos.z) * 0.045;
            this.pitch = THREE.MathUtils.lerp(this.pitch, waveTiltX, Math.min(1, dt * 6.5));
            this.roll = THREE.MathUtils.lerp(this.roll, waveTiltZ, Math.min(1, dt * 6.5));
            this.angVel.multiplyScalar(0.75);
          } else {
            this.inWater = false;
            // Standard Gravity in air
            this.vel.y -= 24.0 * dt;
            this.vel.multiplyScalar(Math.pow(0.985, dt * 60));
            this.pos.addScaledVector(this.vel, dt);

            this.yaw += this.angVel.y * dt;
            this.pitch += this.angVel.x * dt;
            this.roll += this.angVel.z * dt;
            this.angVel.multiplyScalar(Math.pow(0.92, dt * 60));

            this.isGrounded = false;

            // Solid Ground / Terrace Collision (Y = DECK_TOP_Y outside pool)
            const groundY = overPool ? POOL_FLOOR_Y : DECK_TOP_Y;
            if (this.pos.y < groundY) {
              const impact = -this.vel.y;
              this.pos.y = groundY;
              if (impact > 1.8) {
                this.vel.y = impact * 0.42;
                this.squashVel -= Math.min(9.0, impact * 0.95);
                this.headPitchVel += (Math.random() - 0.5) * impact * 2.0;
                this.headRollVel += (Math.random() - 0.5) * impact * 2.0;
                soundFX.playBounce(impact * 0.08);
              } else {
                this.vel.y = 0;
                this.isGrounded = true;
              }
              this.vel.x *= 0.80;
              this.vel.z *= 0.80;
            }
          }

          // Scene Perimeter Bounds
          const minX = -8.2, maxX = 8.8;
          const minZ = -6.6, maxZ = 8.6;
          if (this.pos.x < minX) {
            this.pos.x = minX;
            const imp = Math.abs(this.vel.x);
            this.vel.x = imp * 0.48;
            if (imp > 2.0) { this.squashVel -= imp * 0.5; soundFX.playBounce(imp * 0.06); }
          } else if (this.pos.x > maxX) {
            this.pos.x = maxX;
            this.vel.x = -Math.abs(this.vel.x) * 0.48;
          }
          if (this.pos.z < minZ) {
            this.pos.z = minZ;
            const imp = Math.abs(this.vel.z);
            this.vel.z = imp * 0.48;
            if (imp > 2.0) { this.squashVel -= imp * 0.5; soundFX.playBounce(imp * 0.06); }
          } else if (this.pos.z > maxZ) {
            this.pos.z = maxZ;
            this.vel.z = -Math.abs(this.vel.z) * 0.48;
          }

          // Boulders, Bench, Fence & Hut AABB Collisions
          const r = this.radius * 0.72;
          const centerY = this.pos.y + r;

          for (let i = 0; i < furnitureColliders.length; i++) {
            const box = furnitureColliders[i];
            const cx = THREE.MathUtils.clamp(this.pos.x, box.min.x, box.max.x);
            const cy = THREE.MathUtils.clamp(centerY, box.min.y, box.max.y);
            const cz = THREE.MathUtils.clamp(this.pos.z, box.min.z, box.max.z);

            const dx = this.pos.x - cx;
            const dy = centerY - cy;
            const dz = this.pos.z - cz;
            const distSq = dx * dx + dy * dy + dz * dz;

            if (distSq < r * r) {
              const dist = Math.sqrt(distSq);
              if (centerY >= box.max.y - 0.25 && this.vel.y <= 0.5) {
                const impact = -this.vel.y;
                this.pos.y = box.max.y;
                if (impact > 2.0) {
                  this.vel.y = impact * 0.38;
                  this.squashVel -= Math.min(8.5, impact * 0.85);
                  this.headPitchVel += (Math.random() - 0.5) * impact * 1.8;
                  soundFX.playBounce(impact * 0.08);
                } else {
                  this.vel.y = 0;
                  this.isGrounded = true;
                }
                this.vel.x *= 0.80;
                this.vel.z *= 0.80;
              } else if (dist > 0.0001) {
                const nx = dx / dist;
                const ny = dy / dist;
                const nz = dz / dist;
                const pen = r - dist;
                this.pos.x += nx * pen;
                this.pos.y = Math.max(POOL_FLOOR_Y, this.pos.y + ny * pen);
                this.pos.z += nz * pen;

                const vn = this.vel.x * nx + this.vel.y * ny + this.vel.z * nz;
                if (vn < 0) {
                  const imp = -vn;
                  this.vel.x -= 1.42 * vn * nx;
                  this.vel.y -= 1.42 * vn * ny;
                  this.vel.z -= 1.42 * vn * nz;
                  if (imp > 2.0) {
                    this.squashVel -= Math.min(6.0, imp * 0.55);
                    soundFX.playBounce(imp * 0.06);
                  }
                }
              }
            }
          }

          if (this.isGrounded && !this.inWater) {
            this.pitch = THREE.MathUtils.lerp(this.pitch, 0, Math.min(1, dt * 9.5));
            this.roll = THREE.MathUtils.lerp(this.roll, 0, Math.min(1, dt * 9.5));
            this.angVel.multiplyScalar(0.75);
          }
        }

        // Sync Floating Mounts (Ice Block, Kappa Tub, Floating Bucket) when Fumo is riding them in the pool
        if (this.mountType === 'iceBlock' && this.inWater && !this.isDragged) {
          iceBlockPos.x = THREE.MathUtils.lerp(iceBlockPos.x, this.pos.x, dt * 8);
          iceBlockPos.z = THREE.MathUtils.lerp(iceBlockPos.z, this.pos.z, dt * 8);
        } else if (this.mountType === 'kappaTub' && this.inWater && !this.isDragged) {
          kappaTubPos.x = THREE.MathUtils.lerp(kappaTubPos.x, this.pos.x, dt * 8);
          kappaTubPos.z = THREE.MathUtils.lerp(kappaTubPos.z, this.pos.z, dt * 8);
        } else if (this.mountType === 'floatingBucket' && this.inWater && !this.isDragged) {
          floatingBucketPos.x = THREE.MathUtils.lerp(floatingBucketPos.x, this.pos.x, dt * 8);
          floatingBucketPos.z = THREE.MathUtils.lerp(floatingBucketPos.z, this.pos.z, dt * 8);
        }

        this.syncTransform(time);
      }

      syncTransform(time) {
        this.root.position.copy(this.pos);
        this.root.rotation.order = 'YXZ';
        this.root.rotation.set(this.pitch, this.yaw, this.roll);

        const sy = this.squash;
        const sxz = 1.0 / Math.sqrt(Math.max(0.35, sy));
        this.squashGroup.scale.set(sxz, sy, sxz);

        this.headPivot.rotation.set(this.headPitch, 0, this.headRoll);

        this.leftArmPivot.rotation.set(this.limbPitch, 0, 0.18 + Math.abs(this.limbPitch) * 0.35 + this.limbRoll);
        this.rightArmPivot.rotation.set(this.limbPitch, 0, -0.18 - Math.abs(this.limbPitch) * 0.35 + this.limbRoll);
        this.leftLegPivot.rotation.set(this.limbPitch * 1.15, 0.08, this.limbRoll * 0.5);
        this.rightLegPivot.rotation.set(this.limbPitch * 1.15, -0.08, this.limbRoll * 0.5);

        const wingFlutter = Math.sin(time * 3.8 + this.homePos.x) * 0.06 + (1.0 - this.squash) * 0.35;
        this.wingsPivot.rotation.x = wingFlutter;
      }
    }

    function resolveFumoToFumoCollisions() {
      for (let i = 0; i < fumos.length; i++) {
        for (let j = i + 1; j < fumos.length; j++) {
          const a = fumos[i];
          const b = fumos[j];
          const minDist = (a.radius + b.radius) * 0.78;
          const dx = b.pos.x - a.pos.x;
          const dy = (b.pos.y + b.radius * 0.6) - (a.pos.y + a.radius * 0.6);
          const dz = b.pos.z - a.pos.z;
          const distSq = dx * dx + dy * dy + dz * dz;

          if (distSq < minDist * minDist && distSq > 0.0001) {
            const dist = Math.sqrt(distSq);
            const nx = dx / dist;
            const ny = dy / dist;
            const nz = dz / dist;
            const overlap = (minDist - dist) * 0.5;

            if (!a.isDragged) {
              a.pos.x -= nx * overlap;
              a.pos.y = Math.max(POOL_FLOOR_Y, a.pos.y - ny * overlap);
              a.pos.z -= nz * overlap;
            }
            if (!b.isDragged) {
              b.pos.x += nx * overlap;
              b.pos.y = Math.max(POOL_FLOOR_Y, b.pos.y + ny * overlap);
              b.pos.z += nz * overlap;
            }

            const rvx = b.vel.x - a.vel.x;
            const rvy = b.vel.y - a.vel.y;
            const rvz = b.vel.z - a.vel.z;
            const vn = rvx * nx + rvy * ny + rvz * nz;
            if (vn < 0) {
              const imp = -vn * 0.68;
              if (!a.isDragged) {
                a.vel.x -= imp * nx;
                a.vel.y -= imp * ny;
                a.vel.z -= imp * nz;
                a.squashVel -= Math.min(5.0, imp * 0.6);
              }
              if (!b.isDragged) {
                b.vel.x += imp * nx;
                b.vel.y += imp * ny;
                b.vel.z += imp * nz;
                b.squashVel -= Math.min(5.0, imp * 0.6);
              }
              if (imp > 1.5) soundFX.playBounce(imp * 0.07);
            }
          }
        }
      }
    }

    const raycaster = new THREE.Raycaster();

    const dragPlane = new THREE.Plane();
    const dragHitPoint = new THREE.Vector3();
    const dragOffset = new THREE.Vector3();

    let hoveredFumo = null;
    let selectedFumo = null;
    let isDraggingFumo = false;
    let pointerDownScreen = new THREE.Vector2();

    const tooltipEl = document.getElementById('fumo-tooltip');

    function updatePointerNDC(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function pickFumoUnderPointer() {
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(allFumoRaycastMeshes, false);
      if (hits.length > 0 && hits[0].object.userData.fumo) {
        return { fumo: hits[0].object.userData.fumo, point: hits[0].point };
      }
      return null;
    }

    function updateUIBadge(fumo, statusText) {
      if (!fumo) {
        badgeEl.classList.add('hidden');
        badgeEl.classList.remove('flex');
        return;
      }
      badgeEl.classList.remove('hidden');
      badgeEl.classList.add('flex');
      badgeDotEl.style.backgroundColor = fumo.accentColor;
      badgeNameEl.textContent = fumo.name;
      badgeStatusEl.textContent = statusText;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      recordInteraction();
      updatePointerNDC(e);
      pointerDownScreen.set(e.clientX, e.clientY);

      const hit = pickFumoUnderPointer();
      if (hit) {
        selectedFumo = hit.fumo;
        isDraggingFumo = false;
        controls.enabled = false;

        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        dragPlane.setFromNormalAndCoplanarPoint(camDir.negate(), selectedFumo.pos);

        if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
          dragOffset.subVectors(selectedFumo.pos, dragHitPoint);
        } else {
          dragOffset.set(0, 0, 0);
        }

        dragHistory = [{ pos: selectedFumo.pos.clone(), time: performance.now() }];
        updateUIBadge(selectedFumo, 'Selected');
      }
    });

    window.addEventListener('pointermove', (e) => {
      updatePointerNDC(e);

      if (selectedFumo) {
        recordInteraction();
        const moveDist = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);

        if (!isDraggingFumo && moveDist > 6) {
          isDraggingFumo = true;
          selectedFumo.isDragged = true;
          selectedFumo.isGrounded = false;
          selectedFumo.inWater = false;
          selectedFumo.squashVel += 3.2;
          soundFX.playPickup();
          updateUIBadge(selectedFumo, 'Dragging — Toss into Pool!');
        }

        if (isDraggingFumo) {
          raycaster.setFromCamera(pointerNDC, camera);
          if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
            const targetPos = dragHitPoint.clone().add(dragOffset);
            targetPos.x = THREE.MathUtils.clamp(targetPos.x, -8.0, 8.5);
            targetPos.y = THREE.MathUtils.clamp(targetPos.y, 0.4, 10.5);
            targetPos.z = THREE.MathUtils.clamp(targetPos.z, -6.4, 8.4);

            const prevPos = selectedFumo.pos.clone();
            selectedFumo.pos.lerp(targetPos, 0.55);

            const deltaMove = selectedFumo.pos.clone().sub(prevPos);
            selectedFumo.headRollVel -= deltaMove.x * 16.0;
            selectedFumo.headPitchVel += deltaMove.z * 16.0 - deltaMove.y * 10.0;
            selectedFumo.limbRollVel -= deltaMove.x * 22.0;
            selectedFumo.roll = THREE.MathUtils.lerp(selectedFumo.roll, THREE.MathUtils.clamp(-deltaMove.x * 1.4, -0.45, 0.45), 0.3);
            selectedFumo.pitch = THREE.MathUtils.lerp(selectedFumo.pitch, THREE.MathUtils.clamp(deltaMove.z * 1.4, -0.45, 0.45), 0.3);

            const now = performance.now();
            dragHistory.push({ pos: selectedFumo.pos.clone(), time: now });
            while (dragHistory.length > 6) dragHistory.shift();
          }
          tooltipEl.style.opacity = '0';
          renderer.domElement.style.cursor = 'grabbing';
          return;
        }
      }

      const hit = pickFumoUnderPointer();
      if (hit) {
        hoveredFumo = hit.fumo;
        renderer.domElement.style.cursor = 'grab';
        tooltipEmojiEl.textContent = hoveredFumo.emoji;
        tooltipTextEl.textContent = hoveredFumo.name;
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = `${e.clientX + 14}px`;
        tooltipEl.style.top = `${e.clientY - 18}px`;
      } else {
        hoveredFumo = null;
        renderer.domElement.style.cursor = 'default';
        tooltipEl.style.opacity = '0';
      }
    });

    window.addEventListener('pointerup', () => {
      if (!selectedFumo) return;
      controls.enabled = true;
      recordInteraction();

      if (!isDraggingFumo) {
        selectedFumo.squeeze(1.0);
        updateUIBadge(selectedFumo, 'Squeezed! ᗜˬᗜ');
      } else {
        selectedFumo.isDragged = false;
        const now = performance.now();
        while (dragHistory.length > 1 && now - dragHistory[0].time > 140) {
          dragHistory.shift();
        }
        if (dragHistory.length >= 2) {
          const first = dragHistory[0];
          const last = dragHistory[dragHistory.length - 1];
          const dtSec = Math.max(0.016, (last.time - first.time) / 1000);
          const throwVel = last.pos.clone().sub(first.pos).divideScalar(dtSec);
          if (throwVel.length() > 22) throwVel.setLength(22);
          selectedFumo.vel.copy(throwVel);

          const speed = throwVel.length();
          selectedFumo.angVel.set(
            throwVel.z * 0.65 + (Math.random() - 0.5) * speed * 0.4,
            (Math.random() - 0.5) * speed * 0.5,
            -throwVel.x * 0.65 + (Math.random() - 0.5) * speed * 0.4
          );
        } else {
          selectedFumo.vel.set(0, 0, 0);
        }
        updateUIBadge(selectedFumo, 'Tossed!');
      }

      selectedFumo = null;
      isDraggingFumo = false;
      renderer.domElement.style.cursor = hoveredFumo ? 'grab' : 'default';
    });

    // ============================================================================
    // 11. DAY / NIGHT SMOOTH INTERPOLATION (~2 SECONDS) & HUB INTEGRATION
    // ============================================================================
    const STORAGE_MODE_KEY = 'voxel_fumo_onsen_mode';
    let isNightMode = false;
    let dayNightProgress = 0.0; // 0.0 = Day, 1.0 = Night
    let dayNightTarget = 0.0;

    const daySkyColor = new THREE.Color('#bfe3ff');
    const nightSkyColor = new THREE.Color('#070b19');

    const daySunLightCol = new THREE.Color('#fff5e0');
    const nightMoonLightCol = new THREE.Color('#6b8cce');

    const dayHemiSky = new THREE.Color('#f0f8ff');
    const nightHemiSky = new THREE.Color('#1e294a');
    const dayHemiGround = new THREE.Color('#a8b8c8');
    const nightHemiGround = new THREE.Color('#0c1222');

    function notifyParentMode() {
      const modeStr = isNightMode ? 'night' : 'day';
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'modeChanged', mode: modeStr }, '*');
        }
      } catch (e) {}
    }

    function setDayNightMode(night, { immediate = false, playSound = true } = {}) {
      isNightMode = Boolean(night);
      dayNightTarget = isNightMode ? 1.0 : 0.0;
      if (immediate) {
        dayNightProgress = dayNightTarget;
      }
      document.body.classList.toggle('night-ui', isNightMode);

      try {
        localStorage.setItem(STORAGE_MODE_KEY, isNightMode ? 'night' : 'day');
      } catch (e) {}

      if (playSound) {
        soundFX.playPickup();
      }
      notifyParentMode();
    }

    function toggleDayNight() {
      setDayNightMode(!isNightMode, { immediate: false, playSound: true });
    }

    function updateDayNightTransition(dt) {
      if (Math.abs(dayNightProgress - dayNightTarget) > 0.0005) {
        const step = dt * 0.52;
        if (dayNightProgress < dayNightTarget) {
          dayNightProgress = Math.min(dayNightTarget, dayNightProgress + step);
        } else {
          dayNightProgress = Math.max(dayNightTarget, dayNightProgress - step);
        }
      }

      const t = dayNightProgress < 0.5
        ? 4 * dayNightProgress * dayNightProgress * dayNightProgress
        : 1 - Math.pow(-2 * dayNightProgress + 2, 3) / 2;

      // 1. Sky & Fog
      scene.background.lerpColors(daySkyColor, nightSkyColor, t);
      scene.fog.color.copy(scene.background);
      scene.fog.density = THREE.MathUtils.lerp(0.0085, 0.011, t);

      // 2. Sun -> Moon Directional Light
      sunDirLight.color.lerpColors(daySunLightCol, nightMoonLightCol, t);
      sunDirLight.intensity = THREE.MathUtils.lerp(1.32, 0.36, t);

      // 3. Hemisphere Ambient Bounce
      hemiLight.color.lerpColors(dayHemiSky, nightHemiSky, t);
      hemiLight.groundColor.lerpColors(dayHemiGround, nightHemiGround, t);
      hemiLight.intensity = THREE.MathUtils.lerp(0.75, 0.26, t);

      // 4. Night Lanterns & Glowing Pool Water
      stoneLanternLight.intensity = THREE.MathUtils.lerp(0.05, 1.55, t);
      hutLanternLight.intensity = THREE.MathUtils.lerp(0.05, 1.45, t);
      poolGlowLight.intensity = THREE.MathUtils.lerp(0.10, 1.35, t);

      // 5. Emissive Materials, Steam, Stars & Aurora Borealis
      lanternEmissiveMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.25, 2.35, t);
      poolWaterMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.15, 0.88, t);
      translucentIceMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.22, 0.72, t);
      steamMat.opacity = THREE.MathUtils.lerp(0.32, 0.18, t);
      starMat.opacity = THREE.MathUtils.lerp(0.0, 0.92, t);
      auroraMaterial.opacity = THREE.MathUtils.lerp(0.0, 0.34, t);

      // 6. UnrealBloomPass Strength
      if (bloomPass) {
        bloomPass.strength = THREE.MathUtils.lerp(0.15, 0.68, t);
        bloomPass.threshold = THREE.MathUtils.lerp(0.84, 0.60, t);
      }
    }

    // UI Button & Keyboard Listeners
    document.getElementById('btn-reset').addEventListener('click', () => {
      iceMeltScale = 1.0;
      iceBlockPos.set(-2.85, WATER_LEVEL, 1.55);
      kappaTubPos.set(0.85, WATER_LEVEL, 2.05);
      floatingBucketPos.set(1.65, WATER_LEVEL, -0.55);
      fumos.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 45));
      updateUIBadge(null, '');
    });

    document.getElementById('btn-squeeze-all').addEventListener('click', () => {
      fumos.forEach((f, idx) => setTimeout(() => f.squeeze(1.05), idx * 55));
    });

    const btnSound = document.getElementById('btn-sound');
    const iconSoundOn = document.getElementById('icon-sound-on');
    const iconSoundOff = document.getElementById('icon-sound-off');
    btnSound.addEventListener('click', () => {
      soundFX.enabled = !soundFX.enabled;
      iconSoundOn.classList.toggle('hidden', !soundFX.enabled);
      iconSoundOff.classList.toggle('hidden', soundFX.enabled);
      if (soundFX.enabled) soundFX.playPickup();
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      const key = e.key.toLowerCase();
      if (key === 'n') {
        e.preventDefault();
        toggleDayNight();
      } else if (key === 'r') {
        document.getElementById('btn-reset').click();
      } else if (key === ' ') {
        e.preventDefault();
        fumos.forEach((f, idx) => setTimeout(() => f.squeeze(1.05), idx * 55));
      } else if (key === 'm') {
        btnSound.click();
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================================
    // 12. MAIN ANIMATION LOOP, PAUSE / RESUME & HUB MESSAGE LISTENER
    // ============================================================================
    let prevTime = performance.now();
    let isPaused = false;
    let rafId = null;

    function animate(now) {
      if (isPaused) return;
      rafId = requestAnimationFrame(animate);

      const dt = Math.min(0.033, Math.max(0.001, (now - prevTime) / 1000));
      prevTime = now;
      const elapsed = now * 0.001;

      if (!selectedFumo && (now - lastUserInteractionTime > 4500)) {
        controls.autoRotate = true;
      }

      controls.update();
      updateDayNightTransition(dt);
      updateWaterSurfaceAndRipples(elapsed, dt);
      updateFloatingOnsenProps(elapsed, dt);
      updateSteamParticles(elapsed, dt);
      updateFallingSnow(elapsed, dt);
      updateAurora(elapsed);
      updatePopParticles(dt);

      for (let i = 0; i < fumos.length; i++) {
        fumos[i].updatePhysics(dt, elapsed);
      }
      resolveFumoToFumoCollisions();

      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    function pauseRenderLoop() {
      if (isPaused) return;
      isPaused = true;
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    function resumeRenderLoop() {
      if (!isPaused) return;
      isPaused = false;
      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    }

    window.addEventListener('message', (e) => {
      const data = e.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'toggleMode') {
        toggleDayNight();
      } else if (data.type === 'pause') {
        pauseRenderLoop();
      } else if (data.type === 'resume') {
        resumeRenderLoop();
      }
    });

    window.onload = function () {
      let initialNight = false;
      try {
        const saved = localStorage.getItem(STORAGE_MODE_KEY);
        if (saved === 'night') initialNight = true;
      } catch (e) {}

      setDayNightMode(initialNight, { immediate: true, playSound: false });
      updateDayNightTransition(0);

      fumos.forEach((f, idx) => {
        setTimeout(() => {
          f.squash = 0.78;
          f.squashVel = 2.0;
          f.headPitchVel = 4.0;
        }, 120 + idx * 70);
      });

      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    };
  </script>
</body>
</html>

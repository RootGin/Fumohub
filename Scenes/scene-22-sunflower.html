    function resolveFumoToFumoCollisions() {
      for (let i = 0; i < fumos.length; i++) {
        for (let j = i + 1; j < fumos.length; j++) {
          const a = fumos[i];
          const b = fumos[j];
          if (a.ridesBeeIndex >= 0 || b.ridesBeeIndex >= 0) continue;
          const minDist = (a.radius + b.radius) * 0.78;
          const dx = b.pos.x - a.pos.x;
          const dy = (b.pos.y + b.radius * 0.6) - (a.pos.y + a.radius * 0.6);
          const dz = b.pos.z - a.pos.z;
          const distSq = dx * dx + dy * dy + dz * dz;

          if (distSq < minDist * minDist && distSq > 0.0001) {
            const dist = Math.sqrt(distSq);
            const nx = dx / dist, ny = dy / dist, nz = dz / dist;
            const overlap = (minDist - dist) * 0.5;
            if (!a.isDragged) { a.pos.x -= nx * overlap; a.pos.z -= nz * overlap; }
            if (!b.isDragged) { b.pos.x += nx * overlap; b.pos.z += nz * overlap; }

            const rvx = b.vel.x - a.vel.x, rvy = b.vel.y - a.vel.y, rvz = b.vel.z - a.vel.z;
            const vn = rvx * nx + rvy * ny + rvz * nz;
            if (vn < 0) {
              const imp = -vn * 0.68;
              if (!a.isDragged) { a.vel.x -= imp * nx; a.vel.z -= imp * nz; a.squashVel -= Math.min(5, imp * 0.6); }
              if (!b.isDragged) { b.vel.x += imp * nx; b.vel.z += imp * nz; b.squashVel -= Math.min(5, imp * 0.6); }
              if (imp > 1.5) soundFX.playBounce(imp * 0.07);
            }
          }
        }
      }
    }

    // ============================================================================
    // 10. POINTER INTERACTION: FUMO DRAG/THROW, FLOWER CLICK & HOLD-TO-GROW SPROUT
    // ============================================================================
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    const groundCastPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.25);
    const dragPlane = new THREE.Plane();
    const dragHitPoint = new THREE.Vector3();
    const dragOffset = new THREE.Vector3();

    let hoveredFumo = null;
    let selectedFumo = null;
    let isDraggingFumo = false;
    let pointerDownScreen = new THREE.Vector2();
    let dragHistory = [];

    let growingFlower = null;
    let growHoldTime = 0;
    let growSoundCooldown = 0;
    let clickedSunflowerCandidate = null;

    const growMeterEl = document.getElementById('grow-meter');
    const growBarEl = document.getElementById('grow-bar');
    const growHeightTagEl = document.getElementById('grow-height-tag');
    const growLabelEl = document.getElementById('grow-label');
    const growHintEl = document.getElementById('grow-hint');

    const tooltipEl = document.getElementById('fumo-tooltip');
    const tooltipEmojiEl = document.getElementById('tooltip-emoji');
    const tooltipTextEl = document.getElementById('tooltip-text');
    const badgeDotEl = document.getElementById('fumo-badge-dot');
    const badgeNameEl = document.getElementById('fumo-badge-name');
    const badgeStatusEl = document.getElementById('fumo-badge-status');

    function updateUIBadge(fumo, statusText) {
      if (!fumo) {
        badgeDotEl.style.backgroundColor = '#facc15';
        badgeNameEl.textContent = 'Hold Ground to Grow';
        badgeStatusEl.textContent = statusText || 'Click Flowers & Fumos';
        return;
      }
      badgeDotEl.style.backgroundColor = fumo.accentColor;
      badgeNameEl.textContent = fumo.name.split(' (')[0];
      badgeStatusEl.textContent = statusText;
    }

    function updatePointerNDC(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function pickFumoUnderPointer() {
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(allFumoRaycastMeshes, false);
      if (hits.length > 0 && hits[0].object.userData.fumo) {
        return { fumo: hits[0].object.userData.fumo, point: hits[0].point };
      }
      return null;
    }

    function pickSunflowerUnderPointer() {
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(allSunflowerRaycastMeshes, false);
      if (hits.length > 0 && hits[0].object.userData.sunflower) {
        return hits[0].object.userData.sunflower;
      }
      return null;
    }

    function pickGroundUnderPointer() {
      raycaster.setFromCamera(pointerNDC, camera);
      if ( solidWorldMesh ) {
        const hits = raycaster.intersectObject(solidWorldMesh, false);
        if (hits.length > 0 && hits[0].point.y <= 3.0 && Math.abs(hits[0].point.x) < 8.5 && Math.abs(hits[0].point.z) < 8.5) {
          return hits[0].point;
        }
      }
      const pt = new THREE.Vector3();
      if (raycaster.ray.intersectPlane(groundCastPlane, pt)) {
        if (Math.abs(pt.x) < 8.5 && Math.abs(pt.z) < 8.5) return pt;
      }
      return null;
    }

    const onPointerDown = (e) => {
      if (e.button !== 0) return;
      recordInteraction();
      updatePointerNDC(e);
      pointerDownScreen.set(e.clientX, e.clientY);
      clickedSunflowerCandidate = null;

      const hitFumo = pickFumoUnderPointer();
      if (hitFumo) {
        selectedFumo = hitFumo.fumo;
        isDraggingFumo = false;
        controls.enabled = false;

        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        dragPlane.setFromNormalAndCoplanarPoint(camDir.negate(), selectedFumo.pos);
        if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
          dragOffset.subVectors(selectedFumo.pos, dragHitPoint);
        } else {
          dragOffset.set(0, 0, 0);
        }
        dragHistory = [{ pos: selectedFumo.pos.clone(), time: performance.now() }];
        updateUIBadge(selectedFumo, 'Selected');
        return;
      }

      const hitFlower = pickSunflowerUnderPointer();
      if (hitFlower) {
        clickedSunflowerCandidate = hitFlower;
        return;
      }

      const groundPt = pickGroundUnderPointer();
      if (groundPt) {
        growingFlower = new VoxelSunflower(groundPt.x, groundPt.z, { scale: 0.35, heightScale: 0.25 });
        sunflowers.push(growingFlower);
        growHoldTime = 0;
        growSoundCooldown = 0;
        growMeterEl.classList.remove('hidden');
        growMeterEl.style.left = `${e.clientX}px`;
        growMeterEl.style.top = `${e.clientY - 16}px`;
        soundFX.playFlowerPop(0.8);
      }
    };

    const onPointerMove = (e) => {
      updatePointerNDC(e);
      lastCursorMoveTime = performance.now();

      raycaster.setFromCamera(pointerNDC, camera);
      const cursorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -1.8);
      raycaster.ray.intersectPlane(cursorPlane, cursorWorldTarget);

      if (growingFlower) {
        const moveDist = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);
        if (moveDist > 12 && growHoldTime < 0.22) {
          scene.remove(growingFlower.root);
          sunflowers.pop();
          growingFlower = null;
          growMeterEl.classList.add('hidden');
        } else {
          controls.enabled = false;
          growMeterEl.style.left = `${e.clientX}px`;
          growMeterEl.style.top = `${e.clientY - 16}px`;
        }
      }

      if (selectedFumo) {
        recordInteraction();
        const moveDist = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);

        if (!isDraggingFumo && moveDist > 6) {
          isDraggingFumo = true;
          selectedFumo.isDragged = true;
          selectedFumo.isGrounded = false;
          selectedFumo.isStuckHeadFirst = false;
          selectedFumo.ridesBeeIndex = -1;
          selectedFumo.squashVel += 3.2;
          soundFX.playPickup();
          updateUIBadge(selectedFumo, 'Dragging — Release to Throw!');
        }

        if (isDraggingFumo) {
          raycaster.setFromCamera(pointerNDC, camera);
          if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
            const targetPos = dragHitPoint.clone().add(dragOffset);
            targetPos.x = THREE.MathUtils.clamp(targetPos.x, -8.8, 8.8);
            targetPos.y = THREE.MathUtils.clamp(targetPos.y, 0.3, 12.0);
            targetPos.z = THREE.MathUtils.clamp(targetPos.z, -8.8, 8.8);

            const prevPos = selectedFumo.pos.clone();
            selectedFumo.pos.lerp(targetPos, 0.55);

            const deltaMove = selectedFumo.pos.clone().sub(prevPos);
            selectedFumo.headRollVel -= deltaMove.x * 16.0;
            selectedFumo.headPitchVel += deltaMove.z * 16.0 - deltaMove.y * 10.0;
            selectedFumo.limbRollVel -= deltaMove.x * 22.0;
            selectedFumo.roll = THREE.MathUtils.lerp(selectedFumo.roll, THREE.MathUtils.clamp(-deltaMove.x * 1.4, -0.45, 0.45), 0.3);
            selectedFumo.pitch = THREE.MathUtils.lerp(selectedFumo.pitch, THREE.MathUtils.clamp(deltaMove.z * 1.4, -0.45, 0.45), 0.3);

            const now = performance.now();
            dragHistory.push({ pos: selectedFumo.pos.clone(), time: now });
            while (dragHistory.length > 6) dragHistory.shift();
          }
          tooltipEl.style.opacity = '0';
          renderer.domElement.style.cursor = 'grabbing';
          return;
        }
      }

      const hitFumo = pickFumoUnderPointer();
      if (hitFumo) {
        hoveredFumo = hitFumo.fumo;
        renderer.domElement.style.cursor = 'grab';
        tooltipEmojiEl.textContent = hoveredFumo.emoji;
        tooltipTextEl.textContent = hoveredFumo.isStuckHeadFirst ? `${hoveredFumo.name} (Click to Free!)` : hoveredFumo.name;
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = `${e.clientX + 14}px`;
        tooltipEl.style.top = `${e.clientY - 18}px`;
        return;
      }
      hoveredFumo = null;

      const hitFlower = pickSunflowerUnderPointer();
      if (hitFlower) {
        renderer.domElement.style.cursor = 'pointer';
        tooltipEmojiEl.textContent = hitFlower.isLauncher ? '🚀' : '🌻';
        tooltipTextEl.textContent = hitFlower.isLauncher
          ? 'Launcher Sunflower! (Click to Sproing Fumos!)'
          : (hitFlower.isGiantBoss ? 'Giant Bowed Sunflower (Click to Dance!)' : 'Nosy Sunflower (Click to Bloom & Dance!)');
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = `${e.clientX + 14}px`;
        tooltipEl.style.top = `${e.clientY - 18}px`;
      } else {
        renderer.domElement.style.cursor = 'default';
        tooltipEl.style.opacity = '0';
      }
    };

    const onPointerUp = (e) => {
      if (growingFlower) {
        controls.enabled = true;
        growMeterEl.classList.add('hidden');
        const finalHeight = Math.max(0.95, growingFlower.heightScale);
        growingFlower.heightScale = finalHeight;
        growingFlower.root.scale.setScalar(1.0);
        if (finalHeight >= 1.85) {
          growingFlower.isLauncher = true;
          showWorldCallout(growingFlower.getHeadWorldPos(), '🚀 Tall Launcher Sunflower Ready!');
        }
        growingFlower.triggerDanceAndBloom(true);
        incrementStat('flowers', growingFlower.getHeadWorldPos());
        growingFlower = null;
      }

      if (clickedSunflowerCandidate) {
        const moveDist = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);
        if (moveDist < 8) {
          clickedSunflowerCandidate.triggerDanceAndBloom(true);
        }
        clickedSunflowerCandidate = null;
      }

      if (selectedFumo) {
        controls.enabled = true;
        recordInteraction();

        if (!isDraggingFumo) {
          selectedFumo.squeeze(1.0);
          updateUIBadge(selectedFumo, 'Squeezed! ᗜˬᗜ');
        } else {
          selectedFumo.isDragged = false;
          const now = performance.now();
          while (dragHistory.length > 1 && now - dragHistory[0].time > 140) {
            dragHistory.shift();
          }
          if (dragHistory.length >= 2) {
            const first = dragHistory[0];
            const last = dragHistory[dragHistory.length - 1];
            const dtSec = Math.max(0.016, (last.time - first.time) / 1000);
            const throwVel = last.pos.clone().sub(first.pos).divideScalar(dtSec);
            if (throwVel.length() > 22) throwVel.setLength(22);
            selectedFumo.vel.copy(throwVel);

            const speed = throwVel.length();
            selectedFumo.angVel.set(
              throwVel.z * 0.65 + (Math.random() - 0.5) * speed * 0.4,
              (Math.random() - 0.5) * speed * 0.5,
              -throwVel.x * 0.65 + (Math.random() - 0.5) * speed * 0.4
            );
          } else {
            selectedFumo.vel.set(0, 0, 0);
          }
          updateUIBadge(selectedFumo, 'Thrown!');
        }

        selectedFumo = null;
        isDraggingFumo = false;
        renderer.domElement.style.cursor = hoveredFumo ? 'grab' : 'default';
      }
    };

    renderer.domElement.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);

    // ============================================================================
    // 11. SPECIAL ACTIONS: PETAL STORM (P), BEE CONGA (B), WATERING CAN (W)
    // ============================================================================
    function startPetalStorm() {
      petalStormTimer = 5.5;
      sunflowers.forEach((sf, i) => {
        if (i % 2 === 0) sf.triggerDanceAndBloom(false);
      });
      soundFX.playFanfare();
      showToast('🌼', 'Petal Storm! The bees are chasing the swirling petals!');
    }

    function toggleBeeConga() {
      isBeeCongaActive = !isBeeCongaActive;
      document.getElementById('label-conga').textContent = isBeeCongaActive ? 'Conga: ON!' : 'Bee Conga';
      soundFX.playBeeBoing();
      if (isBeeCongaActive && fumos[5]) {
        fumos[5].squeeze(1.0);
        showWorldCallout(fumos[5].pos.clone().add(new THREE.Vector3(0, 1.4, 0)), '🐝 Bee Conga Line!!');
      }
    }

    function triggerYuukaWateringCan() {
      wateringTimer = 2.8;
      if (fumos[0]) {
        fumos[0].squeeze(0.95);
        showWorldCallout(fumos[0].pos.clone().add(new THREE.Vector3(0, 1.5, 0)), '🚿 Watering the Sunflowers!');
      }
      sunflowers.forEach((sf) => {
        sf.heightScale = Math.min(2.2, sf.heightScale + 0.12);
        sf.bloomScale = 1.28;
      });
      fumos.forEach((f, idx) => {
        if (idx !== 0) {
          spawnPollenBurst(f.pos, ['#38bdf8', '#7dd3fc', '#e0f2fe', '#ffffff'], 8);
          f.squeeze(0.65);
        }
      });
      soundFX.playFlowerPop(1.1);
    }

    // ============================================================================
    // 12. DAY / NIGHT SMOOTH INTERPOLATION (~2 SECONDS) & HUB MODE COMPLIANCE
    // ============================================================================
    const daySkyColor = new THREE.Color('#7ccBFF');
    const duskSkyColor = new THREE.Color('#fb923c');
    const nightSkyColor = new THREE.Color('#090d21');

    const daySunLightCol = new THREE.Color('#fff0c4');
    const duskSunLightCol = new THREE.Color('#fdba74');
    const nightMoonLightCol = new THREE.Color('#6b93e6');

    const dayHemiSky = new THREE.Color('#fff9e6');
    const nightHemiSky = new THREE.Color('#1e294a');
    const dayHemiGround = new THREE.Color('#658a4e');
    const nightHemiGround = new THREE.Color('#0c1324');

    function postModeToParent() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'modeChanged', mode: isNightMode ? 'night' : 'day' }, '*');
        }
      } catch (e) {}
    }

    function onSetMode(mode) {
      const targetNight = (mode === 'night');
      if (targetNight === isNightMode) return;
      isNightMode = targetNight;
      dayNightTarget = isNightMode ? 1.0 : 0.0;
      soundFX.isNightState = isNightMode;
      soundFX.syncMuteState();
      document.body.classList.toggle('night-ui', isNightMode);

      if (fumos[0] && !fumos[0].isDragged && fumos[0].nightPos) {
        const dest = isNightMode ? fumos[0].nightPos : fumos[0].homePos;
        fumos[0].pos.copy(dest);
        fumos[0].yaw = isNightMode ? fumos[0].nightYaw : fumos[0].homeYaw;
        fumos[0].squeeze(0.6);
      }

      try {
        localStorage.setItem(STORAGE_MODE_KEY, isNightMode ? 'night' : 'day');
      } catch (e) {}
      postModeToParent();
    }

    function onToggleMode() {
      onSetMode(isNightMode ? 'day' : 'night');
      soundFX.playPickup();
    }

    function updateDayNightTransition(dt) {
      if (Math.abs(dayNightProgress - dayNightTarget) > 0.0005) {
        const step = dt * 0.52;
        if (dayNightProgress < dayNightTarget) {
          dayNightProgress = Math.min(dayNightTarget, dayNightProgress + step);
        } else {
          dayNightProgress = Math.max(dayNightTarget, dayNightProgress - step);
        }
      }

      const t = dayNightProgress < 0.5
        ? 4 * dayNightProgress * dayNightProgress * dayNightProgress
        : 1 - Math.pow(-2 * dayNightProgress + 2, 3) / 2;

      if (t < 0.5) {
        scene.background.lerpColors(daySkyColor, duskSkyColor, t * 2);
        sunDirLight.color.lerpColors(daySunLightCol, duskSunLightCol, t * 2);
      } else {
        scene.background.lerpColors(duskSkyColor, nightSkyColor, (t - 0.5) * 2);
        sunDirLight.color.lerpColors(duskSunLightCol, nightMoonLightCol, (t - 0.5) * 2);
      }
      scene.fog.color.copy(scene.background);

      sunDirLight.intensity = THREE.MathUtils.lerp(1.02, 0.34, t);
      hemiLight.color.lerpColors(dayHemiSky, nightHemiSky, t);
      hemiLight.groundColor.lerpColors(dayHemiGround, nightHemiGround, t);
      hemiLight.intensity = THREE.MathUtils.lerp(0.56, 0.24, t);

      barnLanternLight.intensity = THREE.MathUtils.lerp(0.06, 1.55, t);
      windmillLanternLight.intensity = THREE.MathUtils.lerp(0.06, 1.50, t);
      fenceLanternLight.intensity = THREE.MathUtils.lerp(0.06, 1.45, t);

      lanternEmissiveMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.32, 2.35, t);
      fairyWingMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.25, 0.95, t);

      if (bloomPass) {
        bloomPass.strength = THREE.MathUtils.lerp(0.12, 0.68, t);
        bloomPass.threshold = THREE.MathUtils.lerp(0.86, 0.62, t);
      }
    }

    // ============================================================================
    // 13. UI BUTTONS & KEYBOARD LISTENERS (No 1-9 Keys! P, B, W, N, M, R, Space)
    // ============================================================================
    const btnSound = document.getElementById('btn-sound');
    const iconSoundOn = document.getElementById('icon-sound-on');
    const iconSoundOff = document.getElementById('icon-sound-off');

    function syncSoundButtonUI() {
      iconSoundOn.classList.toggle('hidden', !soundFX.enabled);
      iconSoundOff.classList.toggle('hidden', soundFX.enabled);
    }
    syncSoundButtonUI();

    function toggleMute() {
      soundFX.enabled = !soundFX.enabled;
      syncSoundButtonUI();
      soundFX.syncMuteState();
      try {
        localStorage.setItem(STORAGE_MUTE_KEY, soundFX.enabled ? 'false' : 'true');
      } catch (e) {}
      if (soundFX.enabled) {
        soundFX.ensureAmbient();
        soundFX.playPickup();
      }
    }

    btnSound.addEventListener('click', toggleMute);
    document.getElementById('btn-petal-storm').addEventListener('click', startPetalStorm);
    document.getElementById('btn-bee-conga').addEventListener('click', toggleBeeConga);
    document.getElementById('btn-water').addEventListener('click', triggerYuukaWateringCan);

    document.getElementById('btn-squeeze-all').addEventListener('click', () => {
      fumos.forEach((f, idx) => setTimeout(() => f.squeeze(1.05), idx * 45));
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      fumos.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 40));
      updateUIBadge(null, 'Reset');
    });

    const onKeyDown = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      const key = e.key.toLowerCase();
      if (key === 'n') {
        e.preventDefault();
        onToggleMode();
      } else if (key === 'p') {
        e.preventDefault();
        startPetalStorm();
      } else if (key === 'b') {
        e.preventDefault();
        toggleBeeConga();
      } else if (key === 'w') {
        e.preventDefault();
        triggerYuukaWateringCan();
      } else if (key === 'm') {
        e.preventDefault();
        toggleMute();
      } else if (key === 'r') {
        e.preventDefault();
        fumos.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 40));
      } else if (key === ' ') {
        e.preventDefault();
        fumos.forEach((f, idx) => setTimeout(() => f.squeeze(1.05), idx * 45));
      }
    };

    const onResize = () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    };

    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('resize', onResize);

    // ============================================================================
    // 14. MAIN ANIMATION LOOP & FumoSceneLifecycle REGISTRATION
    // ============================================================================
    let lilyShoutCooldown = 5.0;

    function updateFieldAmbientEvents(elapsed, dt) {
      windmillRotorGroup.rotation.z = -elapsed * 0.75;
      cloudGroups.forEach(cg => {
        cg.group.position.x = cg.baseX + Math.sin(elapsed * cg.speed + cg.phase) * 2.5;
      });

      if (growingFlower) {
        growHoldTime += dt;
        growingFlower.heightScale = Math.min(2.45, 0.35 + growHoldTime * 1.15);
        const s = Math.min(1.05, 0.45 + growHoldTime * 0.45);
        growingFlower.root.scale.set(
          s * (1 + Math.sin(elapsed * 28) * 0.08),
          1.0,
          s * (1 + Math.cos(elapsed * 28) * 0.08)
        );

        const pct = Math.min(100, Math.round((growingFlower.heightScale / 2.2) * 100));
        growBarEl.style.width = `${pct}%`;
        growHeightTagEl.textContent = `${growingFlower.heightScale.toFixed(1)}x`;
        if (growingFlower.heightScale >= 1.85) {
          growLabelEl.textContent = '🚀 LAUNCHER SIZE!';
          growHintEl.textContent = 'Release to pop Launcher!';
        } else {
          growLabelEl.textContent = '🌱 Growing Sprout...';
          growHintEl.textContent = 'Keep holding for Launcher!';
        }

        growSoundCooldown -= dt;
        if (growSoundCooldown <= 0) {
          soundFX.playFlowerPop(0.75 + growingFlower.heightScale * 0.35);
          growSoundCooldown = 0.16;
        }
      }

      if (fumos[1]) {
        const med = fumos[1];
        if (!med.isDragged && med.isGrounded) {
          med.pos.x = med.homePos.x + Math.sin(elapsed * 0.65) * 1.3;
          med.pos.z = med.homePos.z + Math.cos(elapsed * 0.45) * 1.1;
          med.yaw = Math.atan2(Math.cos(elapsed * 0.65), -Math.sin(elapsed * 0.45));
        }
        if (Math.random() < dt * 7.5) {
          spawnPollenBurst(med.pos, ['#f472b6', '#ec4899', '#fbcfe8', '#d946ef'], 2, 1.5, true);
        }
        for (let i = 0; i < sunflowers.length; i++) {
          if (sunflowers[i].pos.distanceTo(med.pos) < 2.2 && Math.random() < dt * 0.9) {
            sunflowers[i].triggerSneeze();
          }
        }
      }

      if (fumos[2]) {
        const lily = fumos[2];
        if (Math.random() < dt * 4.5) {
          spawnPollenBurst(lily.pos.clone().add(new THREE.Vector3(0, 0.9, 0)), ['#fbcfe8', '#ffffff', '#fde047'], 2, 2.0, true);
        }
        lilyShoutCooldown -= dt;
        if (lilyShoutCooldown <= 0) {
          lilyShoutCooldown = 8.5 + Math.random() * 5.0;
          if (!isNightMode) {
            lily.squeeze(0.65);
            showWorldCallout(lily.pos.clone().add(new THREE.Vector3(0, 1.5, 0)), '🌸 SPRING IS HERE!!');
          } else if (fumos[7]) {
            showWorldCallout(fumos[7].pos.clone().add(new THREE.Vector3(0, 1.5, 0)), '💤 Zzz... *snore*');
          }
        }
      }

      if (wateringTimer > 0 && fumos[0]) {
        wateringTimer -= dt;
        if (Math.random() < dt * 25) {
          spawnPollenBurst(
            fumos[0].pos.clone().add(new THREE.Vector3(0.4, 1.1, 0.4)),
            ['#38bdf8', '#7dd3fc', '#bae6fd', '#ffffff'],
            4,
            7.0,
            false
          );
        }
      }

      if (isNightMode && Math.random() < dt * 3.5 && sunflowers.length > 1) {
        const sf = sunflowers[1 + Math.floor(Math.random() * (sunflowers.length - 1))];
        spawnPollenBurst(sf.getHeadWorldPos(), ['#bae6fd', '#e0f2fe', '#fef08a'], 1, -1.2, false);
      }
    }

    function animate(now) {
      if (isPaused) return;
      rafId = requestAnimationFrame(animate);

      const dt = Math.min(0.033, Math.max(0.001, (now - prevTime) / 1000));
      prevTime = now;
      const elapsed = now * 0.001;

      if (!selectedFumo && !growingFlower && (now - lastUserInteractionTime > 4800)) {
        controls.autoRotate = true;
      }

      controls.update();
      updateDayNightTransition(dt);
      updateFieldAmbientEvents(elapsed, dt);

      for (let i = 0; i < sunflowers.length; i++) {
        sunflowers[i].updateTransform(elapsed, dt, dayNightProgress > 0.55);
      }

      updateChonkyBees(elapsed, dt, dayNightProgress > 0.55);
      updateCritters(elapsed, dayNightProgress);
      updateParticles(dt, elapsed);
      updateWorldCallout(dt);

      for (let i = 0; i < fumos.length; i++) {
        fumos[i].updatePhysics(dt, elapsed);
      }
      resolveFumoToFumoCollisions();

      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    function onPause() {
      if (isPaused) return;
      isPaused = true;
      soundFX.isPausedState = true;
      soundFX.syncMuteState();
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    function onResume() {
      if (!isPaused) return;
      isPaused = false;
      soundFX.isPausedState = false;
      soundFX.syncMuteState();
      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    }

    function onDispose() {
      isPaused = true;
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      renderer.domElement.removeEventListener('pointerdown', onPointerDown);
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('resize', onResize);
      soundFX.dispose();
    }

    let lifecycle = null;
    if (typeof FumoSceneLifecycle !== 'undefined') {
      lifecycle = new FumoSceneLifecycle({
        renderer,
        scene,
        composer,
        audio: soundFX,
        onToggleMode,
        onSetMode,
        onPause,
        onResume,
        onDispose
      });
    }

    (function initScene() {
      let initialMode = 'day';
      try {
        const savedMode = localStorage.getItem(STORAGE_MODE_KEY);
        if (savedMode === 'night') initialMode = 'night';
      } catch (e) {}

      if (initialMode === 'night') {
        isNightMode = true;
        dayNightProgress = 1.0;
        dayNightTarget = 1.0;
        soundFX.isNightState = true;
        document.body.classList.add('night-ui');
        if (fumos[0] && fumos[0].nightPos) {
          fumos[0].pos.copy(fumos[0].nightPos);
          fumos[0].yaw = fumos[0].nightYaw;
        }
      }
      updateDayNightTransition(0);
      postModeToParent();

      fumos.forEach((f, idx) => {
        setTimeout(() => {
          f.squash = 0.78;
          f.squashVel = 2.0;
          f.headPitchVel = 4.0;
        }, 100 + idx * 55);
      });

      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>

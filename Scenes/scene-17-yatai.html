            selectedFumo.limbRollVel -= deltaMove.x * 22.0;
            selectedFumo.roll = THREE.MathUtils.lerp(selectedFumo.roll, THREE.MathUtils.clamp(-deltaMove.x * 1.4, -0.45, 0.45), 0.3);
            selectedFumo.pitch = THREE.MathUtils.lerp(selectedFumo.pitch, THREE.MathUtils.clamp(deltaMove.z * 1.4, -0.45, 0.45), 0.3);

            const now = performance.now();
            dragHistory.push({ pos: selectedFumo.pos.clone(), time: now });
            while (dragHistory.length > 6) dragHistory.shift();
          }
          tooltipEl.style.opacity = '0';
          renderer.domElement.style.cursor = 'grabbing';
          return;
        }
      }

      const hit = pickTargetUnderPointer();
      if (hit) {
        if (hit.type === 'fumo') {
          hoveredFumo = hit.fumo;
          hoveredProp = null;
          renderer.domElement.style.cursor = 'grab';
          tooltipEmojiEl.textContent = hoveredFumo.emoji;
          tooltipTextEl.textContent = `${hoveredFumo.name} • Click to Serve/Squeeze`;
        } else if (hit.type === 'grill') {
          hoveredFumo = null;
          hoveredProp = 'grill';
          renderer.domElement.style.cursor = 'pointer';
          tooltipEmojiEl.textContent = '🍢';
          tooltipTextEl.textContent = 'Charcoal Grill • Click to Flip Skewers!';
        } else if (hit.type === 'pot') {
          hoveredFumo = null;
          hoveredProp = 'pot';
          renderer.domElement.style.cursor = 'pointer';
          tooltipEmojiEl.textContent = '🍲';
          tooltipTextEl.textContent = 'Steaming Ramen Pot • Hold Mouse to Fill Bowl!';
        }
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = `${e.clientX + 14}px`;
        tooltipEl.style.top = `${e.clientY - 18}px`;
      } else {
        hoveredFumo = null;
        hoveredProp = null;
        renderer.domElement.style.cursor = 'default';
        tooltipEl.style.opacity = '0';
      }
    });

    window.addEventListener('pointerup', () => {
      if (isHoldingPot) {
        isHoldingPot = false;
        potPillEl.style.opacity = '0';
        controls.enabled = true;
      }

      if (!selectedFumo) return;
      controls.enabled = true;
      recordInteraction();

      if (!isDraggingFumo) {
        // Click without dragging: Squeeze + Serve a steaming bowl if customer!
        if (selectedFumo.role === 'Customer') {
          serveBowlToCustomer(selectedFumo);
        } else {
          selectedFumo.squeeze(1.0);
          updateUIBadge(selectedFumo, 'Squeezed! ᗜˬᗜ');
        }
      } else {
        selectedFumo.isDragged = false;
        const now = performance.now();
        while (dragHistory.length > 1 && now - dragHistory[0].time > 140) {
          dragHistory.shift();
        }
        if (dragHistory.length >= 2) {
          const first = dragHistory[0];
          const last = dragHistory[dragHistory.length - 1];
          const dtSec = Math.max(0.016, (last.time - first.time) / 1000);
          const throwVel = last.pos.clone().sub(first.pos).divideScalar(dtSec);
          if (throwVel.length() > 22) throwVel.setLength(22);
          selectedFumo.vel.copy(throwVel);

          const speed = throwVel.length();
          selectedFumo.angVel.set(
            throwVel.z * 0.65 + (Math.random() - 0.5) * speed * 0.4,
            (Math.random() - 0.5) * speed * 0.5,
            -throwVel.x * 0.65 + (Math.random() - 0.5) * speed * 0.4
          );
        } else {
          selectedFumo.vel.set(0, 0, 0);
        }
        updateUIBadge(selectedFumo, 'Thrown!');
      }

      selectedFumo = null;
      isDraggingFumo = false;
      renderer.domElement.style.cursor = hoveredFumo ? 'grab' : 'default';
    });

    // ============================================================================
    // 11. DAY / NIGHT SMOOTH INTERPOLATION (~2 SECONDS) & HUB INTEGRATION
    // ============================================================================
    let isNightMode = true; // Rainy night default mood
    let dayNightProgress = 1.0; // 0.0 = Day (Drizzly Morning Cleanup), 1.0 = Night (Warm Izakaya Glow)
    let dayNightTarget = 1.0;
    let lightningFlash = 0.0;

    const daySkyColor = new THREE.Color('#7c8b9e');
    const nightSkyColor = new THREE.Color('#080b14');

    const dayDirLightCol = new THREE.Color('#dce4ef');
    const nightDirLightCol = new THREE.Color('#4d70b8');

    const dayHemiSky = new THREE.Color('#b8c4d4');
    const nightHemiSky = new THREE.Color('#202b4d');
    const dayHemiGround = new THREE.Color('#475569');
    const nightHemiGround = new THREE.Color('#141122');

    function notifyParentMode() {
      const modeStr = isNightMode ? 'night' : 'day';
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'modeChanged', mode: modeStr }, '*');
        }
      } catch (e) {}
    }

    function setDayNightMode(night, { immediate = false, playSound = true } = {}) {
      isNightMode = Boolean(night);
      dayNightTarget = isNightMode ? 1.0 : 0.0;
      if (immediate) {
        dayNightProgress = dayNightTarget;
      }
      document.body.classList.toggle('night-ui', isNightMode);
      dayCleanupGroup.visible = !isNightMode;

      try {
        localStorage.setItem(STORAGE_MODE_KEY, isNightMode ? 'night' : 'day');
      } catch (e) {}

      if (playSound) {
        soundFX.playPickup();
      }
      notifyParentMode();
    }

    function toggleDayNight() {
      setDayNightMode(!isNightMode, { immediate: false, playSound: true });
    }

    function updateDayNightTransition(dt, elapsed) {
      if (Math.abs(dayNightProgress - dayNightTarget) > 0.0005) {
        const step = dt * 0.52; // ~2 second smooth transition
        if (dayNightProgress < dayNightTarget) {
          dayNightProgress = Math.min(dayNightTarget, dayNightProgress + step);
        } else {
          dayNightProgress = Math.max(dayNightTarget, dayNightProgress - step);
        }
      }

      const t = dayNightProgress < 0.5
        ? 4 * dayNightProgress * dayNightProgress * dayNightProgress
        : 1 - Math.pow(-2 * dayNightProgress + 2, 3) / 2;

      // Occasional distant lightning flash & thunder during heavy night rain
      if (isHeavyRain && isNightMode && Math.random() < dt * 0.075) {
        lightningFlash = 0.85;
        soundFX.playThunder();
      }
      if (lightningFlash > 0) {
        lightningFlash = Math.max(0, lightningFlash - dt * 2.8);
      }

      // 1. Sky & Fog interpolation
      scene.background.lerpColors(daySkyColor, nightSkyColor, t);
      if (lightningFlash > 0) {
        scene.background.lerp(new THREE.Color('#cbd5e1'), lightningFlash * 0.35);
      }
      scene.fog.color.copy(scene.background);
      scene.fog.density = THREE.MathUtils.lerp(0.014, 0.017, t);

      // 2. Overcast Daylight vs Moonlight + Thunder Flash
      skyDirLight.color.lerpColors(dayDirLightCol, nightDirLightCol, t);
      skyDirLight.intensity = THREE.MathUtils.lerp(1.15, 0.38, t) + lightningFlash * 1.4;

      hemiLight.color.lerpColors(dayHemiSky, nightHemiSky, t);
      hemiLight.groundColor.lerpColors(dayHemiGround, nightHemiGround, t);
      hemiLight.intensity = THREE.MathUtils.lerp(0.78, 0.32, t);

      // 3. Yatai Lanterns, Charcoal Grill & Alley Neon Lights
      const flicker = 1.0 + Math.sin(elapsed * 9.0) * 0.035;
      yataiLanternLight.intensity = THREE.MathUtils.lerp(0.06, 1.65 * flicker, t);
      grillLight.intensity = THREE.MathUtils.lerp(0.15, 1.25 * flicker, t);
      vendingNeonLight.intensity = THREE.MathUtils.lerp(0.08, 1.15, t);
      neonSignLight.intensity = THREE.MathUtils.lerp(0.05, 1.05, t);

      // 4. Emissive Materials & Bloom
      lanternEmissiveMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.12, 2.05, t);
      neonPinkMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.08, 2.35, t);
      neonCyanMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.08, 2.15, t);
      charcoalEmberMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.35, 2.45 * flicker, t);

      if (bloomPass) {
        bloomPass.strength = THREE.MathUtils.lerp(0.14, 0.76, t);
        bloomPass.threshold = THREE.MathUtils.lerp(0.86, 0.56, t);
      }
    }

    // ============================================================================
    // 12. UI BUTTONS, RAIN TOGGLE & KEYBOARD SHORTCUTS
    // ============================================================================
    const btnRain = document.getElementById('btn-rain');
    const rainIconEl = document.getElementById('rain-icon');
    const rainLabelEl = document.getElementById('rain-label');

    function toggleRainMode() {
      isHeavyRain = !isHeavyRain;
      rainIconEl.textContent = isHeavyRain ? '🌧️' : '🌦️';
      rainLabelEl.textContent = isHeavyRain ? 'Heavy Rain' : 'Light Drizzle';
      soundFX.setRainIntensity(isHeavyRain);
      if (isHeavyRain) {
        soundFX.playThunder();
      } else {
        soundFX.playPickup();
      }
    }

    btnRain.addEventListener('click', () => {
      recordInteraction();
      toggleRainMode();
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      recordInteraction();
      fumos.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 45));
      updateUIBadge(null, '');
    });

    const btnMute = document.getElementById('btn-mute');
    const iconSoundOn = document.getElementById('icon-sound-on');
    const iconSoundOff = document.getElementById('icon-sound-off');

    function syncMuteUI() {
      iconSoundOn.classList.toggle('hidden', soundFX.muted);
      iconSoundOff.classList.toggle('hidden', !soundFX.muted);
    }
    syncMuteUI();

    btnMute.addEventListener('click', () => {
      soundFX.unlock();
      soundFX.setMuted(!soundFX.muted);
      syncMuteUI();
      if (!soundFX.muted) soundFX.playPickup();
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      soundFX.unlock();
      const key = e.key.toLowerCase();

      if (key === 'n') {
        e.preventDefault();
        toggleDayNight();
      } else if (key === 'r') {
        e.preventDefault();
        toggleRainMode();
      } else if (key === 'm') {
        e.preventDefault();
        soundFX.setMuted(!soundFX.muted);
        syncMuteUI();
      } else if (key === ' ') {
        e.preventDefault();
        fumos.forEach((f, idx) => setTimeout(() => f.squeeze(1.05), idx * 50));
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================================
    // 13. MAIN RENDER LOOP, PROP ANIMATIONS & HUB MESSAGE HANDLERS
    // ============================================================================
    let prevTime = performance.now();
    let isPaused = false;
    let rafId = null;

    function updateSceneAnimations(elapsed, dt) {
      // 1. Swaying Cloth Noren Curtain (Also lowers slightly in Day closed/cleanup mode)
      if (norenMesh) {
        const dayDrop = (1.0 - dayNightProgress) * 1.1;
        for (let i = 0; i < norenData.length; i++) {
          const n = norenData[i];
          const swayZ = Math.sin(elapsed * 2.1 + n.panel * 0.9 + n.baseX * 0.2) * 0.55 * n.weight;
          tempPos.set(n.baseX * RV, (n.baseY - dayDrop) * RV, (n.baseZ + swayZ) * RV);
          tempQuat.setFromEuler(new THREE.Euler(swayZ * 0.25, 0, 0));
          tempScale.set(1, 1, 1);
          tempMatrix.compose(tempPos, tempQuat, tempScale);
          norenMesh.setMatrixAt(i, tempMatrix);
        }
        norenMesh.instanceMatrix.needsUpdate = true;
      }

      // 2. Swaying Red Paper Lanterns
      for (let i = 0; i < chochinPivots.length; i++) {
        const ch = chochinPivots[i];
        const windStrength = isHeavyRain ? 0.14 : 0.06;
        ch.pivot.rotation.z = Math.sin(elapsed * 2.3 + ch.phase) * windStrength;
        ch.pivot.rotation.x = Math.cos(elapsed * 1.8 + ch.phase) * windStrength * 0.7;
      }

      // 3. Yakitori Skewer Flip Animation
      for (let i = 0; i < skewerPivots.length; i++) {
        const sk = skewerPivots[i];
        sk.currentRotZ = THREE.MathUtils.lerp(sk.currentRotZ, sk.targetRotZ, Math.min(1, dt * 12));
        if (sk.hopTime > 0) {
          sk.hopTime = Math.max(0, sk.hopTime - dt);
        }
        const hopOffset = Math.sin((sk.hopTime / 0.28) * Math.PI) * 0.32;
        sk.group.position.y = sk.baseY + Math.max(0, hopOffset);
        sk.group.rotation.z = sk.currentRotZ;
      }

      // 4. Holding the Ramen Pot to Fill a Bowl
      if (isHoldingPot) {
        potFillProgress += dt * 1.35;
        brothFillMesh.position.y = 0.05 + Math.min(1, potFillProgress) * 0.11;
        const sc = 0.6 + Math.min(1, potFillProgress) * 0.55;
        brothFillMesh.scale.set(sc, 1, sc);
        potBarEl.style.width = `${Math.min(100, Math.round(potFillProgress * 100))}%`;

        if (potFillProgress >= 1.0) {
          potFillProgress = 0.0;
          // Pick a hungry customer to receive the freshly filled bowl!
          const customers = fumos.filter(f => f.role === 'Customer');
          const luckyCustomer = customers[bowlsServedCount % customers.length];
          if (luckyCustomer) {
            serveBowlToCustomer(luckyCustomer);
          }
          spawnBurstParticles(potCenter, ['#fde047', '#fb923c', '#ffffff'], 15, 2.8);
        }
      } else {
        potFillProgress = Math.max(0, potFillProgress - dt * 1.5);
        brothFillMesh.position.y = 0.05 + potFillProgress * 0.11;
      }

      // 5. Voxel Cat Watching the Grill & Voxel Frog Breathing on Bowl
      catHeadPivot.rotation.y = Math.sin(elapsed * 1.7) * 0.22;
      catHeadPivot.rotation.x = THREE.MathUtils.lerp(catHeadPivot.rotation.x, Math.sin(elapsed * 2.5) * 0.08, dt * 5);
      catTailPivot.rotation.z = Math.sin(elapsed * 3.6) * 0.35;

      const throatScale = 1.0 + Math.max(0, Math.sin(elapsed * 4.2)) * 0.45;
      frogThroatMesh.scale.set(throatScale, throatScale, throatScale);
      frogGroup.position.y = 2.76 + Math.max(0, Math.sin(elapsed * 2.1) - 0.85) * 0.35;
    }

    function animate(now) {
      if (isPaused) return;
      rafId = requestAnimationFrame(animate);

      const dt = Math.min(0.033, Math.max(0.001, (now - prevTime) / 1000));
      prevTime = now;
      const elapsed = now * 0.001;

      if (!selectedFumo && !isHoldingPot && (now - lastUserInteractionTime > 4500)) {
        controls.autoRotate = true;
      }

      controls.update();
      updateDayNightTransition(dt, elapsed);
      updateSceneAnimations(elapsed, dt);
      updateRainAndRipples(dt);
      updateSteamPuffs(elapsed, dt, isHoldingPot);
      updateBurstParticles(dt);

      for (let i = 0; i < fumos.length; i++) {
        fumos[i].updatePhysics(dt, elapsed);
      }
      resolveFumoToFumoCollisions();

      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    function pauseRenderLoop() {
      if (isPaused) return;
      isPaused = true;
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      soundFX.pause();
    }

    function resumeRenderLoop() {
      if (!isPaused) return;
      isPaused = false;
      prevTime = performance.now();
      soundFX.resume();
      rafId = requestAnimationFrame(animate);
    }

    // Hub Message Integration
    window.addEventListener('message', (e) => {
      const data = e.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'toggleMode') {
        toggleDayNight();
      } else if (data.type === 'setMode' && (data.mode === 'day' || data.mode === 'night')) {
        setDayNightMode(data.mode === 'night', { immediate: false, playSound: false });
      } else if (data.type === 'pause') {
        pauseRenderLoop();
      } else if (data.type === 'resume') {
        resumeRenderLoop();
      }
    });

    window.onload = function () {
      let initialNight = true;
      try {
        const saved = localStorage.getItem(STORAGE_MODE_KEY);
        if (saved === 'day') initialNight = false;
        else if (saved === 'night') initialNight = true;
      } catch (e) {}

      setDayNightMode(initialNight, { immediate: true, playSound: false });
      updateDayNightTransition(0, 0);

      // Initial welcoming bounce on all Fumos
      fumos.forEach((f, idx) => {
        setTimeout(() => {
          f.squash = 0.78;
          f.squashVel = 2.0;
          f.headPitchVel = 4.0;
        }, 100 + idx * 65);
      });

      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    };
  </script>
</body>

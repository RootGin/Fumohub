        registerPart(rightArmVoxels, this.rightArmPivot);
        registerPart(leftLegVoxels, this.leftLegPivot);
        registerPart(rightLegVoxels, this.rightLegPivot);
        registerPart(wingSolidVoxels, this.wingsPivot);
        if (wingGlowVoxels.length > 0) {
          const wMat = (this.id === 'cirno') ? translucentIceMaterial : crystalWingMaterial;
          registerPart(wingGlowVoxels, this.wingsPivot, wMat);
        }
      }

      squeeze(strength = 1.0) {
        this.wakeUp();
        this.squash = Math.max(0.52, this.squash - 0.42 * strength);
        this.squashVel = -3.5 * strength;
        this.headPitchVel += (Math.random() - 0.5) * 14 * strength;
        this.headRollVel += (Math.random() > 0.5 ? 1 : -1) * 11 * strength;
        this.limbPitch = -0.65 * strength;
        this.limbPitchVel = -6.0 * strength;
        spawnSqueezeParticles(this.pos, this.accentColor);
        soundFX.playSqueeze(this.pitchAudio);
      }

      resetToHome() {
        this.zone = this.initialZone;
        this.pos.copy(this.homePos);
        this.vel.set(0, 0, 0);
        this.yaw = this.homeYaw;
        this.pitch = this.homePitch;
        this.roll = this.homeRoll;
        this.angVel.set(0, 0, 0);
        this.isGrounded = true;
        this.isDragged = false;
        this.isSleeping = false;
        this.sleepTimer = 0.0;
        this.squeeze(0.75);
      }

      updateSoftSprings(dt, time) {
        // 1. Volume-Preserving Squash & Stretch Spring
        const squashStiff = 210.0;
        const squashDamp = 11.5;
        const squashForce = (1.0 - this.squash) * squashStiff - this.squashVel * squashDamp;
        this.squashVel += squashForce * dt;
        this.squash += this.squashVel * dt;
        this.squash = THREE.MathUtils.clamp(this.squash, 0.45, 1.55);

        // 2. Oversized Head Wobble Spring
        const headStiff = 140.0;
        const headDamp = 7.5;
        const idleHeadBob = this.isSleeping ? 0 : Math.sin(time * 2.2 + this.homePos.x) * 0.022;
        this.headPitchVel += ((idleHeadBob - this.headPitch) * headStiff - this.headPitchVel * headDamp) * dt;
        this.headRollVel += ((0 - this.headRoll) * headStiff - this.headRollVel * headDamp) * dt;
        this.headPitch = THREE.MathUtils.clamp(this.headPitch + this.headPitchVel * dt, -0.55, 0.55);
        this.headRoll = THREE.MathUtils.clamp(this.headRoll + this.headRollVel * dt, -0.55, 0.55);

        // 3. Dangling Limb Springs
        const targetLimbPitch = (this.isDragged || !this.isGrounded) ? 0.58 : 0.0;
        const limbStiff = 120.0;
        const limbDamp = 8.0;
        this.limbPitchVel += ((targetLimbPitch - this.limbPitch) * limbStiff - this.limbPitchVel * limbDamp) * dt;
        this.limbRollVel += ((0 - this.limbRoll) * limbStiff - this.limbRollVel * limbDamp) * dt;
        this.limbPitch = THREE.MathUtils.clamp(this.limbPitch + this.limbPitchVel * dt, -0.8, 0.9);
        this.limbRoll = THREE.MathUtils.clamp(this.limbRoll + this.limbRollVel * dt, -0.6, 0.6);
      }

      syncTransform(time) {
        this.root.position.copy(this.pos);
        this.root.rotation.order = 'YXZ';
        this.root.rotation.set(this.pitch, this.yaw, this.roll);

        const sy = this.squash;
        const sxz = 1.0 / Math.sqrt(Math.max(0.35, sy));
        // If stuck against the front glass inside the machine, add a hilarious slight front-to-back squish!
        const glassSquishZ = (this.stuckAgainstGlass && this.zone === 'in_machine' && this.pos.z > 0.55) ? 0.84 : 1.0;
        this.squashGroup.scale.set(sxz, sy, sxz * glassSquishZ);

        this.headPivot.rotation.set(this.headPitch, 0, this.headRoll);

        this.leftArmPivot.rotation.set(this.limbPitch, 0, 0.18 + Math.abs(this.limbPitch) * 0.35 + this.limbRoll);
        this.rightArmPivot.rotation.set(this.limbPitch, 0, -0.18 - Math.abs(this.limbPitch) * 0.35 + this.limbRoll);
        this.leftLegPivot.rotation.set(this.limbPitch * 1.15, 0.08, this.limbRoll * 0.5);
        this.rightLegPivot.rotation.set(this.limbPitch * 1.15, -0.08, this.limbRoll * 0.5);

        const wingFlutter = Math.sin(time * 3.8 + this.homePos.x) * 0.05 + (1.0 - this.squash) * 0.35;
        this.wingsPivot.rotation.x = wingFlutter;
      }
    }

    // ============================================================================
    // 8. SPAWN THE PRIZE PILE (INSIDE CLAW MACHINE) & UNEXPECTED OUTSIDE PLUSHIES
    // ============================================================================
    const fumoConfigs = [
      // --- INSIDE CLAW MACHINE PRIZE PILE (9 Plushies) ---
      {
        id: 'cirno',
        name: 'Cirno (Ice Fairy Fumo)',
        emoji: '❄️',
        accentColor: '#38bdf8',
        hairColor: '#7dd3fc',
        eyeColor: '#0284c7',
        outfitMain: '#2563eb',
        sleeveColor: '#ffffff',
        tieColor: '#ef4444',
        shoeColor: '#1e3a8a',
        hasWhiteApron: false,
        zone: 'in_machine',
        homePos: new THREE.Vector3(0.15, 2.80, -1.65),
        homeYaw: 0.25,
        pitchAudio: 1.15
      },
      {
        id: 'reimu',
        name: 'Reimu Hakurei (Miko Fumo)',
        emoji: '⛩️',
        accentColor: '#ef4444',
        hairColor: '#2b1e23',
        eyeColor: '#991b1b',
        outfitMain: '#dc2626',
        sleeveColor: '#ffffff',
        tieColor: '#facc15',
        shoeColor: '#451a03',
        hasWhiteApron: false,
        zone: 'in_machine',
        homePos: new THREE.Vector3(1.35, 2.80, -1.85),
        homeYaw: -0.45,
        pitchAudio: 1.0
      },

    function triggerClawDrop() {
      if (clawSystem.state !== 'IDLE') return;
      recordInteraction();
      clawSystem.state = 'DROPPING';
      clawSystem.stateTimer = 0;
      clawSystem.gripTarget = null;
      clawSystem.slipAccumulator = 0;
      soundFX.playClawServo(300, 0.12);
      clawStatusTextEl.textContent = 'Dropping claw...';
    }

    // Attempt to grab the closest plushie inside the claw reach when prongs close
    function attemptClawGrab() {
      const tipPos = new THREE.Vector3(clawSystem.x, clawSystem.y - 0.52, clawSystem.z);
      let bestFumo = null;
      let bestDist = 0.92; // Max grab radius

      for (let i = 0; i < fumos.length; i++) {
        const f = fumos[i];
        if (f.zone !== 'in_machine') continue;
        const headCenter = new THREE.Vector3(f.pos.x, f.pos.y + 0.55 * f.scaleFactor, f.pos.z);
        const dist = tipPos.distanceTo(headCenter);
        if (dist < bestDist) {
          bestDist = dist;
          bestFumo = f;
        }
      }

      if (bestFumo) {
        bestFumo.wakeUp();
        // Wake nearby plushies in the pile so the pile shifts as this one is pulled!
        fumos.forEach(other => {
          if (other.zone === 'in_machine' && other.pos.distanceTo(bestFumo.pos) < 1.8) {
            other.wakeUp();
          }
        });

        clawSystem.gripTarget = bestFumo;
        clawSystem.slipAccumulator = 0;
        // Horizontal alignment determines how solid the claw's grip is!
        // Well-centered grabs hold strongly; off-center grabs have lower effective max force and can fumble!
        const horizMisalign = Math.hypot(clawSystem.x - bestFumo.pos.x, clawSystem.z - bestFumo.pos.z);
        clawSystem.gripQuality = THREE.MathUtils.clamp(1.18 - horizMisalign * 1.15, 0.42, 1.15);

        bestFumo.squashVel -= 2.5;
        soundFX.playSqueeze(bestFumo.pitchAudio);
        updateUIBadge(bestFumo, 'Grabbed by Claw!');
        clawStatusTextEl.textContent = `Grabbed ${bestFumo.name}! Lifting...`;
      } else {
        clawStatusTextEl.textContent = 'Missed! Returning claw...';
      }
    }

    // ============================================================================
    // 10. FIXED-STEP STRICTER PHYSICS SOLVER (8 ITERATIONS, SLEEPING, GRIP JOINT)
    // ============================================================================
    const FIXED_DT = 1 / 60;
    const SOLVER_ITERATIONS = 8;
    let physicsAccumulator = 0.0;

    function stepClawAndPhysicsFixed(dt, time) {
      // ----------------------------------------------------------------------
      // A. FIXED-STEP CLAW STATE MACHINE & MOTION
      // ----------------------------------------------------------------------
      clawSystem.stateTimer += dt;
      const moveSpeed = 2.65;

      if (clawSystem.state === 'IDLE') {
        if (clawSystem.inputX !== 0 || clawSystem.inputZ !== 0) {
          recordInteraction();
          clawSystem.x = THREE.MathUtils.clamp(
            clawSystem.x + clawSystem.inputX * moveSpeed * dt,
            CLAW_BOUNDS.minX + 0.25,
            CLAW_BOUNDS.maxX - 0.25
          );
          clawSystem.z = THREE.MathUtils.clamp(
            clawSystem.z + clawSystem.inputZ * moveSpeed * dt,
            CLAW_BOUNDS.minZ + 0.25,
            CLAW_BOUNDS.maxZ - 0.25
          );
        }
        clawSystem.y = THREE.MathUtils.lerp(clawSystem.y, CLAW_BOUNDS.ceilingY, dt * 10);
        clawSystem.openAngle = THREE.MathUtils.lerp(clawSystem.openAngle, 0.58, dt * 10);
      }
      else if (clawSystem.state === 'DROPPING') {
        clawSystem.openAngle = THREE.MathUtils.lerp(clawSystem.openAngle, 0.72, dt * 12);
        clawSystem.y -= 3.1 * dt;

        // Check if claw tips touched a plushie in the pile or reached the prize floor
        let hitPile = false;
        const tipY = clawSystem.y - 0.52;
        for (let i = 0; i < fumos.length; i++) {
          const f = fumos[i];
          if (f.zone !== 'in_machine') continue;
          const hDist = Math.hypot(clawSystem.x - f.pos.x, clawSystem.z - f.pos.z);
          if (hDist < f.radius * 0.92 && tipY <= f.pos.y + f.radius * 1.35) {
            hitPile = true;
            f.wakeUp();
            f.squashVel -= 1.8;
            break;
          }
        }

        if (hitPile || clawSystem.y <= CLAW_BOUNDS.floorY + 0.82) {
          clawSystem.state = 'CLOSING';
          clawSystem.stateTimer = 0;
          soundFX.playClawServo(190, 0.14);
        }
      }
      else if (clawSystem.state === 'CLOSING') {
        clawSystem.openAngle = THREE.MathUtils.lerp(clawSystem.openAngle, 0.12, dt * 9);
        if (clawSystem.stateTimer >= 0.42) {
          attemptClawGrab();
          clawSystem.state = 'ASCENDING';
          clawSystem.stateTimer = 0;
        }
      }
      else if (clawSystem.state === 'ASCENDING') {
        const targetClose = clawSystem.gripTarget ? 0.22 : 0.08;
        clawSystem.openAngle = THREE.MathUtils.lerp(clawSystem.openAngle, targetClose, dt * 10);
        clawSystem.y += 2.65 * dt;

        if (clawSystem.y >= CLAW_BOUNDS.ceilingY) {
          clawSystem.y = CLAW_BOUNDS.ceilingY;
          // Small mechanical stop jolt at top of ascent (tests the spring grip!)
          if (clawSystem.gripTarget) {
            clawSystem.gripTarget.vel.y -= 1.35;
          }
          clawSystem.state = 'RETURNING';
          clawSystem.stateTimer = 0;
          soundFX.playClawServo(260, 0.12);
        }
      }
      else if (clawSystem.state === 'RETURNING') {
        const dx = CLAW_BOUNDS.chuteCenterX - clawSystem.x;
        const dz = CLAW_BOUNDS.chuteCenterZ - clawSystem.z;
        const dist = Math.hypot(dx, dz);
        if (dist > 0.06) {
          const step = Math.min(dist, moveSpeed * 1.05 * dt);
          clawSystem.x += (dx / dist) * step;
          clawSystem.z += (dz / dist) * step;
        } else {
          clawSystem.x = CLAW_BOUNDS.chuteCenterX;
          clawSystem.z = CLAW_BOUNDS.chuteCenterZ;
          clawSystem.state = 'RELEASING';
          clawSystem.stateTimer = 0;
          soundFX.playClawServo(340, 0.12);
        }
      }
      else if (clawSystem.state === 'RELEASING') {
        clawSystem.openAngle = THREE.MathUtils.lerp(clawSystem.openAngle, 0.72, dt * 12);
        if (clawSystem.gripTarget) {
          const dropped = clawSystem.gripTarget;
          dropped.wakeUp();
          dropped.vel.y = Math.min(dropped.vel.y, -0.5);
          clawSystem.gripTarget = null;
          clawStatusTextEl.textContent = 'Dropped into the prize chute!';
        }
        if (clawSystem.stateTimer >= 0.55) {
          clawSystem.state = 'IDLE';
          clawSystem.stateTimer = 0;
          clawStatusTextEl.textContent = 'Arrows / WASD to aim • Space to drop claw';
        }
      }

      // ----------------------------------------------------------------------
      // B. SPRING GRIP JOINT CONSTRAINT (With Maximum Force / Slippage)
      // ----------------------------------------------------------------------
      if (clawSystem.gripTarget) {
        const f = clawSystem.gripTarget;
        f.wakeUp();

        const clawAnchor = new THREE.Vector3(clawSystem.x, clawSystem.y - 0.50, clawSystem.z);
        const fumoAttach = new THREE.Vector3(
          f.pos.x,
          f.pos.y + clawSystem.gripLocalOffset.y * f.scaleFactor,
          f.pos.z
        );

        const stretchVec = clawAnchor.clone().sub(fumoAttach);
        const stretchDist = stretchVec.length();

        // Spring-damper force: F = k * x - c * v
        const springForce = stretchVec.clone()
          .multiplyScalar(clawSystem.gripStiffness)
          .addScaledVector(f.vel, -clawSystem.gripDamping);

        const forceMag = springForce.length();
        const effectiveMaxForce = clawSystem.maxGripForce * clawSystem.gripQuality;

        // Check if tension exceeds grip limit or if plushie was pulled too far from prongs
        if (forceMag > effectiveMaxForce) {
          springForce.multiplyScalar(effectiveMaxForce / forceMag);
          clawSystem.slipAccumulator += (forceMag - effectiveMaxForce) * dt;
        } else {
          clawSystem.slipAccumulator = Math.max(0, clawSystem.slipAccumulator - 4.0 * dt);
        }

        if (stretchDist > 0.82 || clawSystem.slipAccumulator > 2.6) {
          // FUMBLED / SLIPPED FROM CLAW!
          f.vel.y = Math.min(f.vel.y, -1.0);
          f.angVel.set((Math.random() - 0.5) * 4.5, (Math.random() - 0.5) * 3.0, (Math.random() - 0.5) * 4.5);
          f.squashVel -= 2.2;
          soundFX.playBounce(0.6);
          updateUIBadge(f, 'Slipped from Claw!');
          clawStatusTextEl.textContent = `Oh no! ${f.name} slipped from the claw!`;
          clawSystem.gripTarget = null;
        } else {
          // Apply spring acceleration to the grabbed plushie
          f.vel.addScaledVector(springForce, dt);
          f.vel.multiplyScalar(0.92);
          // Dangle swing while carried
          f.limbPitch = 0.65;
          f.headRollVel += (clawAnchor.x - f.pos.x) * 8.0 * dt;
          f.headPitchVel += (clawAnchor.z - f.pos.z) * 8.0 * dt;
          f.pitch = THREE.MathUtils.lerp(f.pitch, THREE.MathUtils.clamp((clawAnchor.z - f.pos.z) * 1.6, -0.35, 0.35), 0.25);
          f.roll = THREE.MathUtils.lerp(f.roll, THREE.MathUtils.clamp(-(clawAnchor.x - f.pos.x) * 1.6, -0.35, 0.35), 0.25);
        }
      }

      // Sync Claw Visual Meshes
      clawSystem.gantryRailZ.position.z = clawSystem.z;
      clawSystem.carriageGroup.position.set(clawSystem.x, 8.35, clawSystem.z);
      clawSystem.clawHeadGroup.position.set(clawSystem.x, clawSystem.y, clawSystem.z);
      const cableLen = Math.max(0.05, 8.35 - clawSystem.y);
      clawSystem.cableMesh.scale.y = cableLen;
      clawSystem.cableMesh.position.set(clawSystem.x, clawSystem.y + cableLen * 0.5, clawSystem.z);
      for (let p = 0; p < 3; p++) {
        clawSystem.prongs[p].rotation.z = clawSystem.openAngle;
      }
      // Tilt control panel joystick with user input
      clawSystem.joystickPivot.rotation.z = THREE.MathUtils.lerp(clawSystem.joystickPivot.rotation.z, -clawSystem.inputX * 0.38, dt * 15);
      clawSystem.joystickPivot.rotation.x = THREE.MathUtils.lerp(clawSystem.joystickPivot.rotation.x, clawSystem.inputZ * 0.38, dt * 15);

      // ----------------------------------------------------------------------
      // C. INTEGRATE VELOCITIES FOR AWAKE PLUSHIES
      // ----------------------------------------------------------------------
      for (let i = 0; i < fumos.length; i++) {
        const f = fumos[i];
        f.updateSoftSprings(dt, time);

        if (f.isDragged) continue;

        if (f.zone === 'chute_falling') {
          // Falling down the prize chute & popping out the front flap into the arcade!
          f.vel.y -= 22.0 * dt;
          f.pos.addScaledVector(f.vel, dt);
          f.yaw += f.angVel.y * dt;
          f.pitch += f.angVel.x * dt;

          if (f.pos.y <= 0.85) {
            // Pop out the front dispense bay into the room!
            f.zone = 'outside';
            f.pos.set(CLAW_BOUNDS.chuteCenterX, 0.9, 2.15);
            f.vel.set((Math.random() - 0.5) * 2.2, 4.5, 5.2 + Math.random() * 1.5);
            f.angVel.set(2.5, (Math.random() - 0.5) * 3.0, 0);
            f.squeeze(1.15);

            prizesWonCount++;
            prizeCountEl.textContent = String(prizesWonCount);
            spawnPrizeWinCelebration(f.pos);
            soundFX.playWinFanfare();
            updateUIBadge(f, 'WON PRIZE! 🎉');
            clawStatusTextEl.textContent = `🎉 You won ${f.name}! Click or drag it in the arcade!`;
          }
          continue;
        }

        // Skip integration if sleeping in the settled prize pile
        if (f.zone === 'in_machine' && f.isSleeping && clawSystem.gripTarget !== f) {
          f.vel.set(0, 0, 0);
          f.angVel.set(0, 0, 0);
          continue;
        }

        // Apply Gravity & Damping
        f.vel.y -= 23.0 * dt;
        f.vel.multiplyScalar(Math.pow(0.982, dt * 60));
        f.pos.addScaledVector(f.vel, dt);

        f.yaw += f.angVel.y * dt;
        f.pitch += f.angVel.x * dt;
        f.roll += f.angVel.z * dt;
        f.angVel.multiplyScalar(Math.pow(0.90, dt * 60));
        f.isGrounded = false;
      }

      // ----------------------------------------------------------------------
      // D. 8-ITERATION STRICTER CONSTRAINT & COLLISION SOLVER
      // ----------------------------------------------------------------------
      for (let iter = 0; iter < SOLVER_ITERATIONS; iter++) {
        // 1. Plushie-to-Plushie Collisions (Pile stacking & outside collisions)
        for (let i = 0; i < fumos.length; i++) {
          for (let j = i + 1; j < fumos.length; j++) {
            const a = fumos[i];
            const b = fumos[j];
            if (a.zone === 'chute_falling' || b.zone === 'chute_falling') continue;
            if (a.zone !== b.zone) continue;
            if (a.isSleeping && b.isSleeping && !a.isDragged && !b.isDragged) continue;

            const minDist = (a.radius + b.radius) * 0.78;
            const dx = b.pos.x - a.pos.x;
            const dy = (b.pos.y + b.radius * 0.58) - (a.pos.y + a.radius * 0.58);
            const dz = b.pos.z - a.pos.z;
            const distSq = dx * dx + dy * dy + dz * dz;

            if (distSq < minDist * minDist && distSq > 0.00001) {
              const dist = Math.sqrt(distSq);
              const nx = dx / dist;
              const ny = dy / dist;
              const nz = dz / dist;
              const overlap = (minDist - dist);

              // Wake sleeping neighbor if hit with noticeable velocity
              const rvx = b.vel.x - a.vel.x;
              const rvy = b.vel.y - a.vel.y;
              const rvz = b.vel.z - a.vel.z;
              const relSpeed = Math.hypot(rvx, rvy, rvz);
              if (relSpeed > 0.35) {
                a.wakeUp();
                b.wakeUp();
              }

              const weightA = (a.isDragged || a.isSleeping) ? 0.0 : (b.isDragged || b.isSleeping ? 1.0 : 0.5);
              const weightB = 1.0 - weightA;

              if (weightA > 0) {
                a.pos.x -= nx * overlap * weightA;
                a.pos.y -= ny * overlap * weightA;
                a.pos.z -= nz * overlap * weightA;
                if (ny < -0.45) a.isGrounded = true;
              }
              if (weightB > 0) {
                b.pos.x += nx * overlap * weightB;
                b.pos.y += ny * overlap * weightB;
                b.pos.z += nz * overlap * weightB;
                if (ny > 0.45) b.isGrounded = true;
              }

              const vn = rvx * nx + rvy * ny + rvz * nz;
              if (vn < 0) {
                const restitution = (iter === 0 && relSpeed > 1.8) ? 0.28 : 0.0;
                const imp = -(1.0 + restitution) * vn;
                if (weightA > 0) {
                  a.vel.x -= imp * nx * weightA;
                  a.vel.y -= imp * ny * weightA;
                  a.vel.z -= imp * nz * weightA;
                  // Tangential friction so pile settles stably
                  a.vel.x *= 0.96;
                  a.vel.z *= 0.96;
                }
                if (weightB > 0) {
                  b.vel.x += imp * nx * weightB;
                  b.vel.y += imp * ny * weightB;
                  b.vel.z += imp * nz * weightB;
                  b.vel.x *= 0.96;
                  b.vel.z *= 0.96;
                }
                if (iter === 0 && imp > 1.8) {
                  a.squashVel -= Math.min(4.0, imp * 0.45);
                  b.squashVel -= Math.min(4.0, imp * 0.45);
                  soundFX.playBounce(imp * 0.06);
                }
              }
            }
          }
        }

        // 2. Boundary & Environment Collisions per Zone
        for (let i = 0; i < fumos.length; i++) {
          const f = fumos[i];
          if (f.isDragged || f.zone === 'chute_falling') continue;

          if (f.zone === 'in_machine') {
            // Check if plushie is over the open Prize Chute Hole!
            const inChuteHole = (
              f.pos.x >= CLAW_BOUNDS.chuteMinX &&
              f.pos.x <= CLAW_BOUNDS.chuteMaxX &&
              f.pos.z >= CLAW_BOUNDS.chuteMinZ &&
              f.pos.z <= CLAW_BOUNDS.chuteMaxZ
            );

            // Chute Interior Guard Wall (height Y = 2.75..3.85) prevents floor plushies from sliding in unless lifted over!
            const guardMaxX = CLAW_BOUNDS.chuteMaxX + 0.12;
            const guardMinZ = CLAW_BOUNDS.chuteMinZ - 0.12;
            if (!inChuteHole && f.pos.y < 3.72) {
              if (f.pos.z > guardMinZ && f.pos.x < guardMaxX + f.radius * 0.45 && f.pos.x > guardMaxX - 0.3) {
                f.pos.x = guardMaxX + f.radius * 0.45;
                if (f.vel.x < 0) f.vel.x *= -0.3;
              }
              if (f.pos.x < guardMaxX && f.pos.z > guardMinZ - f.radius * 0.45 && f.pos.z < guardMinZ + 0.3) {
                f.pos.z = guardMinZ - f.radius * 0.45;
                if (f.vel.z > 0) f.vel.z *= -0.3;
              }
            }

            if (inChuteHole && clawSystem.gripTarget !== f && f.pos.y < 3.65) {
              // Fell into the Prize Chute!
              f.zone = 'chute_falling';
              f.isSleeping = false;
              f.pos.x = CLAW_BOUNDS.chuteCenterX;
              f.pos.z = CLAW_BOUNDS.chuteCenterZ;
              f.vel.set(0, -3.5, 0);
              continue;
            }

            // Prize Deck Floor Collision (Y = 2.75)
            if (!inChuteHole && f.pos.y < CLAW_BOUNDS.floorY) {
              const impact = -f.vel.y;
              f.pos.y = CLAW_BOUNDS.floorY;
              if (iter === 0 && impact > 2.0) {
                f.vel.y = impact * 0.28;
                f.squashVel -= Math.min(7.5, impact * 0.75);
                soundFX.playBounce(impact * 0.07);
              } else {
                f.vel.y = 0;
                f.isGrounded = true;
              }
              f.vel.x *= 0.85;
              f.vel.z *= 0.85;
            }

            // 4 Glass Walls of the Claw Machine
            const rMargin = f.radius * 0.58;
            if (f.pos.x < CLAW_BOUNDS.minX + rMargin) {
              f.pos.x = CLAW_BOUNDS.minX + rMargin;
              if (f.vel.x < 0) f.vel.x *= -0.3;
            } else if (f.pos.x > CLAW_BOUNDS.maxX - rMargin) {
              f.pos.x = CLAW_BOUNDS.maxX - rMargin;
              if (f.vel.x > 0) f.vel.x *= -0.3;
            }
            if (f.pos.z < CLAW_BOUNDS.minZ + rMargin) {
              f.pos.z = CLAW_BOUNDS.minZ + rMargin;
              if (f.vel.z < 0) f.vel.z *= -0.3;
            } else if (f.pos.z > CLAW_BOUNDS.maxZ - rMargin) {
              f.pos.z = CLAW_BOUNDS.maxZ - rMargin;
              if (f.vel.z > 0) f.vel.z *= -0.3;
            }
          }
          else if (f.zone === 'outside') {
            // Arcade Carpet Floor (Y = 0)
            if (f.pos.y < 0) {
              const impact = -f.vel.y;
              f.pos.y = 0;
              if (iter === 0 && impact > 1.8) {
                f.vel.y = impact * 0.40;
                f.squashVel -= Math.min(9.0, impact * 0.90);
                f.headPitchVel += (Math.random() - 0.5) * impact * 2.0;
                soundFX.playBounce(impact * 0.08);
              } else {
                f.vel.y = 0;
                f.isGrounded = true;
              }
              f.vel.x *= 0.84;
              f.vel.z *= 0.84;
            }

            // Room Outer Bounds
            const minB = -9.6;
            const maxB = 9.6;
            if (f.pos.x < minB) { f.pos.x = minB; f.vel.x = Math.abs(f.vel.x) * 0.45; }
            if (f.pos.x > maxB) { f.pos.x = maxB; f.vel.x = -Math.abs(f.vel.x) * 0.45; }
            if (f.pos.z < -9.1) { f.pos.z = -9.1; f.vel.z = Math.abs(f.vel.z) * 0.45; }
            if (f.pos.z > maxB) { f.pos.z = maxB; f.vel.z = -Math.abs(f.vel.z) * 0.45; }

            // Arcade Cabinets, Counter, DDR Pad, Claw Machine Cabinet AABB Collisions
            const r = f.radius * 0.72;
            const centerY = f.pos.y + r;

            for (let k = 0; k < furnitureColliders.length; k++) {
              const box = furnitureColliders[k];
              const cx = THREE.MathUtils.clamp(f.pos.x, box.min.x, box.max.x);
              const cy = THREE.MathUtils.clamp(centerY, box.min.y, box.max.y);
              const cz = THREE.MathUtils.clamp(f.pos.z, box.min.z, box.max.z);

              const dx = f.pos.x - cx;
              const dy = centerY - cy;
              const dz = f.pos.z - cz;
              const distSq = dx * dx + dy * dy + dz * dz;

              if (distSq < r * r) {
                const dist = Math.sqrt(distSq);
                if (centerY >= box.max.y - 0.25 && f.vel.y <= 0.5) {
                  const impact = -f.vel.y;
                  f.pos.y = box.max.y;
                  if (iter === 0 && impact > 2.0) {
                    f.vel.y = impact * 0.36;
                    f.squashVel -= Math.min(8.0, impact * 0.80);
                    soundFX.playBounce(impact * 0.08);
                  } else {
                    f.vel.y = 0;
                    f.isGrounded = true;
                  }
                  f.vel.x *= 0.82;
                  f.vel.z *= 0.82;
                } else if (dist > 0.0001) {
                  const nx = dx / dist;
                  const ny = dy / dist;
                  const nz = dz / dist;
                  const pen = r - dist;
                  f.pos.x += nx * pen;
                  f.pos.y = Math.max(0, f.pos.y + ny * pen);
                  f.pos.z += nz * pen;

                  const vn = f.vel.x * nx + f.vel.y * ny + f.vel.z * nz;
                  if (vn < 0) {
                    const imp = -vn;
                    f.vel.x -= 1.38 * vn * nx;
                    f.vel.y -= 1.38 * vn * ny;
                    f.vel.z -= 1.38 * vn * nz;
                    if (iter === 0 && imp > 2.0) {
                      f.squashVel -= Math.min(5.5, imp * 0.5);
                      soundFX.playBounce(imp * 0.06);
                    }
                  }
                }
              }
            }
          }
        }
      }

      // ----------------------------------------------------------------------
      // E. SELF-RIGHTING TORQUE & PILE SLEEP EVALUATION
      // ----------------------------------------------------------------------
      for (let i = 0; i < fumos.length; i++) {
        const f = fumos[i];
        if (f.isDragged || f.zone === 'chute_falling') continue;

        if (f.isGrounded && clawSystem.gripTarget !== f) {
          const targetPitch = (f.stuckAgainstGlass && f.zone === 'in_machine' && f.pos.z > 0.55) ? 0.28 : 0.0;
          f.pitch = THREE.MathUtils.lerp(f.pitch, targetPitch, Math.min(1, dt * 8.5));
          f.roll = THREE.MathUtils.lerp(f.roll, 0, Math.min(1, dt * 8.5));
          f.angVel.multiplyScalar(0.75);
        }

        // Evaluate Sleeping for settled plushies inside the Claw Machine pile
        if (f.zone === 'in_machine' && clawSystem.gripTarget !== f && f.isGrounded) {
          const linSpdSq = f.vel.lengthSq();
          const angSpdSq = f.angVel.lengthSq();
          if (linSpdSq < 0.012 && angSpdSq < 0.02) {
            f.sleepTimer += dt;
            if (f.sleepTimer >= 0.45) {
              f.isSleeping = true;
              f.vel.set(0, 0, 0);
              f.angVel.set(0, 0, 0);
            }
          } else {
            f.sleepTimer = 0;
            f.isSleeping = false;
          }
        }
      }
    }

    // ============================================================================
    // 11. POINTER INTERACTION (Squeeze Any Fumo; Drag & Throw Outside Fumos)
    // ============================================================================
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    const dragPlane = new THREE.Plane();
    const dragHitPoint = new THREE.Vector3();
    const dragOffset = new THREE.Vector3();

    let hoveredFumo = null;
    let selectedFumo = null;
    let isDraggingFumo = false;
    let pointerDownScreen = new THREE.Vector2();
    let dragHistory = [];

    const tooltipEl = document.getElementById('fumo-tooltip');
    const tooltipEmojiEl = document.getElementById('tooltip-emoji');
    const tooltipTextEl = document.getElementById('tooltip-text');
    const badgeEl = document.getElementById('fumo-badge');
    const badgeDotEl = document.getElementById('fumo-badge-dot');
    const badgeNameEl = document.getElementById('fumo-badge-name');
    const badgeStatusEl = document.getElementById('fumo-badge-status');

    function updatePointerNDC(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function pickFumoUnderPointer() {
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(allFumoRaycastMeshes, false);
      if (hits.length > 0 && hits[0].object.userData.fumo) {
        return { fumo: hits[0].object.userData.fumo, point: hits[0].point };
      }
      return null;
    }

    function updateUIBadge(fumo, statusText) {
      if (!fumo) {
        badgeEl.classList.add('hidden');
        badgeEl.classList.remove('flex');
        return;
      }
      badgeEl.classList.remove('hidden');
      badgeEl.classList.add('flex');
      badgeDotEl.style.backgroundColor = fumo.accentColor;
      badgeNameEl.textContent = fumo.name;
      badgeStatusEl.textContent = statusText;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      recordInteraction();
      updatePointerNDC(e);
      pointerDownScreen.set(e.clientX, e.clientY);

      const hit = pickFumoUnderPointer();
      if (hit) {
        selectedFumo = hit.fumo;
        isDraggingFumo = false;

        // Only lock orbit controls for dragging if the plushie is outside the glass machine!
        if (selectedFumo.zone === 'outside') {
          controls.enabled = false;
          const camDir = new THREE.Vector3();
          camera.getWorldDirection(camDir);
          dragPlane.setFromNormalAndCoplanarPoint(camDir.negate(), selectedFumo.pos);

          if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
            dragOffset.subVectors(selectedFumo.pos, dragHitPoint);
          } else {
            dragOffset.set(0, 0, 0);
          }
          dragHistory = [{ pos: selectedFumo.pos.clone(), time: performance.now() }];
        }
        updateUIBadge(selectedFumo, selectedFumo.zone === 'outside' ? 'Selected' : 'In Claw Machine');
      }
    });

    window.addEventListener('pointermove', (e) => {
      updatePointerNDC(e);

      if (selectedFumo && selectedFumo.zone === 'outside') {
        recordInteraction();
        const moveDist = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);

        if (!isDraggingFumo && moveDist > 6) {
          isDraggingFumo = true;
          selectedFumo.isDragged = true;
          selectedFumo.isGrounded = false;
          selectedFumo.squashVel += 3.2;
          soundFX.playPickup();
          updateUIBadge(selectedFumo, 'Dragging — Release to Throw!');
        }

        if (isDraggingFumo) {
          raycaster.setFromCamera(pointerNDC, camera);
          if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
            const targetPos = dragHitPoint.clone().add(dragOffset);
            targetPos.x = THREE.MathUtils.clamp(targetPos.x, -9.2, 9.2);
            targetPos.y = THREE.MathUtils.clamp(targetPos.y, 0.25, 10.2);
            targetPos.z = THREE.MathUtils.clamp(targetPos.z, -8.8, 9.2);

            const prevPos = selectedFumo.pos.clone();
            selectedFumo.pos.lerp(targetPos, 0.55);

            const deltaMove = selectedFumo.pos.clone().sub(prevPos);
            selectedFumo.headRollVel -= deltaMove.x * 16.0;
            selectedFumo.headPitchVel += deltaMove.z * 16.0 - deltaMove.y * 10.0;
            selectedFumo.limbRollVel -= deltaMove.x * 22.0;
            selectedFumo.roll = THREE.MathUtils.lerp(selectedFumo.roll, THREE.MathUtils.clamp(-deltaMove.x * 1.4, -0.45, 0.45), 0.3);
            selectedFumo.pitch = THREE.MathUtils.lerp(selectedFumo.pitch, THREE.MathUtils.clamp(deltaMove.z * 1.4, -0.45, 0.45), 0.3);

            const now = performance.now();
            dragHistory.push({ pos: selectedFumo.pos.clone(), time: now });
            while (dragHistory.length > 6) dragHistory.shift();
          }
          tooltipEl.style.opacity = '0';
          renderer.domElement.style.cursor = 'grabbing';
          return;
        }
      }

      const hit = pickFumoUnderPointer();
      if (hit) {
        hoveredFumo = hit.fumo;
        renderer.domElement.style.cursor = hoveredFumo.zone === 'outside' ? 'grab' : 'pointer';
        tooltipEmojiEl.textContent = hoveredFumo.emoji;
        tooltipTextEl.textContent = hoveredFumo.zone === 'in_machine'
          ? `${hoveredFumo.name} (Use Claw to Win!)`
          : hoveredFumo.name;
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = `${e.clientX + 14}px`;
        tooltipEl.style.top = `${e.clientY - 18}px`;
      } else {
        hoveredFumo = null;
        renderer.domElement.style.cursor = 'default';
        tooltipEl.style.opacity = '0';
      }
    });

    window.addEventListener('pointerup', () => {
      if (!selectedFumo) return;
      controls.enabled = true;
      recordInteraction();

      if (!isDraggingFumo) {
        // Click without dragging -> Squeeze interaction!
        // (If inside the machine, tapping the glass makes the plushie jiggle & wake up!)
        selectedFumo.squeeze(selectedFumo.zone === 'outside' ? 1.0 : 0.75);
        updateUIBadge(selectedFumo, 'Squeezed! ᗜˬᗜ');
      } else if (selectedFumo.zone === 'outside') {
        selectedFumo.isDragged = false;
        const now = performance.now();
        while (dragHistory.length > 1 && now - dragHistory[0].time > 140) {
          dragHistory.shift();
        }
        if (dragHistory.length >= 2) {
          const first = dragHistory[0];
          const last = dragHistory[dragHistory.length - 1];
          const dtSec = Math.max(0.016, (last.time - first.time) / 1000);
          const throwVel = last.pos.clone().sub(first.pos).divideScalar(dtSec);
          if (throwVel.length() > 22) throwVel.setLength(22);
          selectedFumo.vel.copy(throwVel);

          const speed = throwVel.length();
          selectedFumo.angVel.set(
            throwVel.z * 0.65 + (Math.random() - 0.5) * speed * 0.4,
            (Math.random() - 0.5) * speed * 0.5,
            -throwVel.x * 0.65 + (Math.random() - 0.5) * speed * 0.4
          );
        } else {
          selectedFumo.vel.set(0, 0, 0);
        }
        updateUIBadge(selectedFumo, 'Thrown!');
      }

      selectedFumo = null;
      isDraggingFumo = false;
      renderer.domElement.style.cursor = hoveredFumo ? 'grab' : 'default';
    });

    // ============================================================================
    // 12. CLAW KEYBOARD & ON-SCREEN D-PAD CONTROLS
    // ============================================================================
    const keyState = { left: false, right: false, up: false, down: false };
    const btnLeft = document.getElementById('claw-left');
    const btnRight = document.getElementById('claw-right');
    const btnUp = document.getElementById('claw-up');
    const btnDown = document.getElementById('claw-down');
    const btnDrop = document.getElementById('claw-drop');

    function syncClawInputAxes() {
      clawSystem.inputX = (keyState.right ? 1 : 0) - (keyState.left ? 1 : 0);
      clawSystem.inputZ = (keyState.down ? 1 : 0) - (keyState.up ? 1 : 0);
      btnLeft.classList.toggle('is-pressed', keyState.left);
      btnRight.classList.toggle('is-pressed', keyState.right);
      btnUp.classList.toggle('is-pressed', keyState.up);
      btnDown.classList.toggle('is-pressed', keyState.down);
    }

    function bindHoldButton(btn, dirKey) {
      const startHold = (e) => {
        e.preventDefault();
        recordInteraction();
        keyState[dirKey] = true;
        syncClawInputAxes();
      };
      const endHold = () => {
        if (keyState[dirKey]) {
          keyState[dirKey] = false;
          syncClawInputAxes();
        }
      };
      btn.addEventListener('pointerdown', startHold);
      window.addEventListener('pointerup', endHold);
      btn.addEventListener('pointerleave', endHold);
    }

    bindHoldButton(btnLeft, 'left');
    bindHoldButton(btnRight, 'right');
    bindHoldButton(btnUp, 'up');
    bindHoldButton(btnDown, 'down');

    btnDrop.addEventListener('click', (e) => {
      e.preventDefault();
      triggerClawDrop();
    });

    // ============================================================================
    // 13. DAY / NIGHT SMOOTH INTERPOLATION (~2 SECONDS) & HUB INTEGRATION
    // ============================================================================
    const STORAGE_MODE_KEY = 'voxel_fumo_arcade_mode';
    let isNightMode = true; // Arcade looks extra magical at night, and smoothly transitions to sunlit day!
    let dayNightProgress = 1.0; // 0.0 = Day, 1.0 = Night
    let dayNightTarget = 1.0;

    const daySkyColor = new THREE.Color('#cce6ff');
    const nightSkyColor = new THREE.Color('#090718');

    const dayBackdropCol = new THREE.Color('#7ec8ff');
    const nightBackdropCol = new THREE.Color('#06071b');

    const dayWindowLightCol = new THREE.Color('#fff1d0');
    const nightWindowLightCol = new THREE.Color('#5a78d6');

    const dayHemiSky = new THREE.Color('#fff8eb');
    const nightHemiSky = new THREE.Color('#2c1d52');
    const dayHemiGround = new THREE.Color('#b5947b');
    const nightHemiGround = new THREE.Color('#0f0a1c');

    function notifyParentMode() {
      const modeStr = isNightMode ? 'night' : 'day';
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'modeChanged', mode: modeStr }, '*');
        }
      } catch (e) {}
    }

    function setDayNightMode(night, { immediate = false, playSound = true } = {}) {
      isNightMode = Boolean(night);
      dayNightTarget = isNightMode ? 1.0 : 0.0;
      if (immediate) {
        dayNightProgress = dayNightTarget;
      }
      document.body.classList.toggle('night-ui', isNightMode);

      try {
        localStorage.setItem(STORAGE_MODE_KEY, isNightMode ? 'night' : 'day');
      } catch (e) {}

      if (playSound) {
        soundFX.playPickup();
      }
      notifyParentMode();
    }

    function toggleDayNight() {
      setDayNightMode(!isNightMode, { immediate: false, playSound: true });
    }

    function updateDayNightTransition(dt, elapsed) {
      if (Math.abs(dayNightProgress - dayNightTarget) > 0.0005) {
        const step = dt * 0.52; // ~2 seconds full transition
        if (dayNightProgress < dayNightTarget) {
          dayNightProgress = Math.min(dayNightTarget, dayNightProgress + step);
        } else {
          dayNightProgress = Math.max(dayNightTarget, dayNightProgress - step);
        }
      }

      const t = dayNightProgress < 0.5
        ? 4 * dayNightProgress * dayNightProgress * dayNightProgress
        : 1 - Math.pow(-2 * dayNightProgress + 2, 3) / 2;

      // 1. Sky Background & Fog
      scene.background.lerpColors(daySkyColor, nightSkyColor, t);
      scene.fog.color.copy(scene.background);

      // 2. Window Backdrop & Sunbeams
      windowBackdropMat.color.lerpColors(dayBackdropCol, nightBackdropCol, t);
      shaftMat.opacity = THREE.MathUtils.lerp(0.13, 0.02, t);
      dustMat.opacity = THREE.MathUtils.lerp(0.72, 0.35, t);

      // 3. Sunlight vs. Moonlight through Front Window
      windowDirLight.color.lerpColors(dayWindowLightCol, nightWindowLightCol, t);
      windowDirLight.intensity = THREE.MathUtils.lerp(1.45, 0.25, t);

      // 4. Hemisphere Ambient Bounce
      hemiLight.color.lerpColors(dayHemiSky, nightHemiSky, t);
      hemiLight.groundColor.lerpColors(dayHemiGround, nightHemiGround, t);
      hemiLight.intensity = THREE.MathUtils.lerp(0.75, 0.24, t);

      // 5. Arcade Interior Neon & Claw Machine Lights
      const flicker = 0.96 + 0.04 * Math.sin(elapsed * 18.0) * Math.cos(elapsed * 7.3);
      clawInteriorLight.intensity = THREE.MathUtils.lerp(0.65, 1.45, t);
      arcadeRowLight.intensity = THREE.MathUtils.lerp(0.25, 1.15 * flicker, t);
      counterNeonLight.intensity = THREE.MathUtils.lerp(0.25, 1.15, t);

      // 6. Emissive Neon Signs, Screens & Reflective Floor Sheen
      neonPinkMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.32, 1.85 * flicker, t);
      neonCyanMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.32, 1.80, t);
      neonGoldMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.35, 1.65, t);
      screenEmissiveMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.45, 1.55 * flicker, t);
      translucentIceMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.22, 0.85, t);
      crystalWingMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.28, 1.25, t);

      arcadeFloorMaterial.roughness = THREE.MathUtils.lerp(0.72, 0.24, t);
      arcadeFloorMaterial.metalness = THREE.MathUtils.lerp(0.08, 0.32, t);

      // 7. UnrealBloomPass Strength
      if (bloomPass) {
        bloomPass.strength = THREE.MathUtils.lerp(0.14, 0.76, t);
        bloomPass.threshold = THREE.MathUtils.lerp(0.85, 0.58, t);
      }
    }

    // Top-Right Utility Buttons
    document.getElementById('btn-reset').addEventListener('click', () => {
      clawSystem.gripTarget = null;
      clawSystem.state = 'IDLE';
      fumos.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 35));
      updateUIBadge(null, '');
      clawStatusTextEl.textContent = 'Restocked Claw Machine pile!';
    });

    document.getElementById('btn-squeeze-all').addEventListener('click', () => {
      fumos.forEach((f, idx) => setTimeout(() => f.squeeze(1.0), idx * 45));
    });

    const btnSound = document.getElementById('btn-sound');
    const iconSoundOn = document.getElementById('icon-sound-on');
    const iconSoundOff = document.getElementById('icon-sound-off');
    btnSound.addEventListener('click', () => {
      soundFX.enabled = !soundFX.enabled;
      iconSoundOn.classList.toggle('hidden', !soundFX.enabled);
      iconSoundOff.classList.toggle('hidden', soundFX.enabled);
      if (soundFX.enabled) soundFX.playPickup();
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;

      const key = e.key.toLowerCase();
      if (key === 'arrowleft' || key === 'a') {
        e.preventDefault();
        recordInteraction();
        keyState.left = true;
        syncClawInputAxes();
      } else if (key === 'arrowright' || key === 'd') {
        e.preventDefault();
        recordInteraction();
        keyState.right = true;
        syncClawInputAxes();
      } else if (key === 'arrowup' || key === 'w') {
        e.preventDefault();
        recordInteraction();
        keyState.up = true;
        syncClawInputAxes();
      } else if (key === 'arrowdown' || key === 's') {
        e.preventDefault();
        recordInteraction();
        keyState.down = true;
        syncClawInputAxes();
      } else if (key === ' ') {
        e.preventDefault();
        btnDrop.classList.add('is-pressed');
        triggerClawDrop();
      } else if (key === 'n') {
        e.preventDefault();
        toggleDayNight();
      } else if (key === 'r') {
        document.getElementById('btn-reset').click();
      } else if (key === 'm') {
        btnSound.click();
      }
    });

    window.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'arrowleft' || key === 'a') { keyState.left = false; syncClawInputAxes(); }
      else if (key === 'arrowright' || key === 'd') { keyState.right = false; syncClawInputAxes(); }
      else if (key === 'arrowup' || key === 'w') { keyState.up = false; syncClawInputAxes(); }
      else if (key === 'arrowdown' || key === 's') { keyState.down = false; syncClawInputAxes(); }
      else if (key === ' ') { btnDrop.classList.remove('is-pressed'); }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================================
    // 14. MAIN ANIMATION LOOP, PAUSE / RESUME & HUB MESSAGE LISTENER
    // ============================================================================
    let prevTime = performance.now();
    let isPaused = false;
    let rafId = null;

    function animate(now) {
      if (isPaused) return;
      rafId = requestAnimationFrame(animate);

      const frameDt = Math.min(0.05, Math.max(0.001, (now - prevTime) / 1000));
      prevTime = now;
      const elapsed = now * 0.001;

      const isPlayingClaw = (
        clawSystem.state !== 'IDLE' ||
        clawSystem.inputX !== 0 ||
        clawSystem.inputZ !== 0
      );

      if (isPlayingClaw) {
        controls.autoRotate = false;
        lastUserInteractionTime = now;
      } else if (!selectedFumo && (now - lastUserInteractionTime > 5000)) {
        controls.autoRotate = true;
      }

      controls.update();
      updateDayNightTransition(frameDt, elapsed);
      updateArcadeScreens(elapsed);
      updateDustMotes(elapsed, frameDt);
      updatePopParticles(frameDt);

      // Fixed-Timestep Physics & Claw Machine Update
      physicsAccumulator = Math.min(physicsAccumulator + frameDt, FIXED_DT * 3);
      while (physicsAccumulator >= FIXED_DT) {
        stepClawAndPhysicsFixed(FIXED_DT, elapsed);
        physicsAccumulator -= FIXED_DT;
      }

      for (let i = 0; i < fumos.length; i++) {
        fumos[i].syncTransform(elapsed);
      }

      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    function pauseRenderLoop() {
      if (isPaused) return;
      isPaused = true;
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    function resumeRenderLoop() {
      if (!isPaused) return;
      isPaused = false;
      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    }

    // Lifecycle management: Day/Night sync, pause/resume on tab visibility, and WebGL resource cleanup on destroy
    const _sceneLifecycle = new FumoSceneLifecycle({
      renderer,
      scene,
      composer: typeof composer !== 'undefined' ? composer : null,
      audio: typeof soundFX !== 'undefined' ? soundFX : (typeof audio !== 'undefined' ? audio : null),
      onToggleMode: typeof toggleDayNight === 'function' ? toggleDayNight : null,
      onSetMode: (mode) => {
        if (typeof setDayNightMode === 'function') {
          setDayNightMode(mode === 'night', { immediate: false });
        } else if (typeof toggleDayNight === 'function') {
          const isNight = document.body.classList.contains('night-ui');
          if (isNight !== (mode === 'night')) toggleDayNight();
        }
      },
      onPause: typeof pauseRenderLoop === 'function' ? pauseRenderLoop : (typeof pauseScene === 'function' ? pauseScene : null),
      onResume: typeof resumeRenderLoop === 'function' ? resumeRenderLoop : (typeof resumeScene === 'function' ? resumeScene : null)
    });

    window.onload = function () {
      let initialNight = true;
      try {
        const saved = localStorage.getItem(STORAGE_MODE_KEY);
        if (saved === 'day') initialNight = false;
        else if (saved === 'night') initialNight = true;
      } catch (e) {}

      setDayNightMode(initialNight, { immediate: true, playSound: false });
      updateDayNightTransition(0, 0);

      // Initial welcoming bounce on all fumos
      fumos.forEach((f, idx) => {
        setTimeout(() => {
          f.squash = 0.80;
          f.squashVel = 1.8;
          f.headPitchVel = 3.5;
        }, 100 + idx * 55);
      });

      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    };
  </script>
</body>

    // ============================================================================
    // 15. MAIN ANIMATION LOOP, PAUSE / RESUME & HUB MESSAGE LISTENER
    // ============================================================================
    let prevTime = performance.now();
    let isPaused = false;
    let rafId = null;

    function animate(now) {
      if (isPaused) return;
      rafId = requestAnimationFrame(animate);

      const dt = Math.min(0.033, Math.max(0.001, (now - prevTime) / 1000));
      prevTime = now;
      const elapsed = now * 0.001;

      if (!selectedFumo && (now - lastUserInteractionTime > 5000)) {
        controls.autoRotate = true;
      }
      controls.update();

      // 1. Smoothly interpolate train speed & scroll the looping landscape
      currentTrainSpeed = THREE.MathUtils.lerp(currentTrainSpeed, targetTrainSpeed, Math.min(1, dt * 3.5));
      const speedRatio = currentTrainSpeed / MAX_TRAIN_SPEED;

      let tunnelFactor = 0.0;
      for (let i = 0; i < landscapeChunks.length; i++) {
        const chunk = landscapeChunks[i];
        chunk.position.x -= currentTrainSpeed * dt;
        if (chunk.position.x < -LOOP_LENGTH) {
          chunk.position.x += LOOP_LENGTH * NUM_CHUNKS;
        }
        // Check if this chunk's mountain tunnel (local X around -16.2 world units) is passing over the train
        const tunnelWorldX = chunk.position.x - 36 * LV;
        const distToTunnel = Math.abs(tunnelWorldX);
        if (distToTunnel < 12.5) {
          tunnelFactor = Math.max(tunnelFactor, 1.0 - distToTunnel / 12.5);
        }
      }

      soundFX.setTunnelEcho(tunnelFactor);
      tunnelIndicatorEl.classList.toggle('hidden', tunnelFactor < 0.25);

      // 2. Rotate Train Wheels & Emit Chimney Smoke Puffs
      for (let i = 0; i < wheelGroups.length; i++) {
        const w = wheelGroups[i];
        w.group.rotation.z -= (currentTrainSpeed * dt) / Math.max(0.2, w.radius);
      }

      if (currentTrainSpeed > 0.2) {
        smokeSpawnTimer += dt * (2.5 + speedRatio * 9.5);
        if (smokeSpawnTimer >= 1.0) {
          smokeSpawnTimer %= 1.0;
          const chimneyWorld = new THREE.Vector3(54 * TV, 21.8 * TV, 0);
          trainGroup.localToWorld(chimneyWorld);
          spawnSmokePuff(chimneyWorld, false);
        }
      }

      // Update Pooled Smoke & Steam Puffs (drifting backward as train moves forward)
      let smokeDirty = false;
      for (let i = 0; i < SMOKE_MAX; i++) {
        const p = smokePuffs[i];
        if (!p.active) continue;
        smokeDirty = true;
        p.life += dt;
        if (p.life >= p.maxLife) {
          p.active = false;
          tempMatrix.makeScale(0, 0, 0);
          smokeMesh.setMatrixAt(i, tempMatrix);
          continue;
        }
        p.pos.x -= currentTrainSpeed * 0.65 * dt;
        p.pos.addScaledVector(p.vel, dt);
        p.vel.y *= Math.pow(0.96, dt * 60);
        const progress = p.life / p.maxLife;
        const s = p.baseScale * (0.5 + progress * 2.1) * (1.0 - progress * 0.65);
        tempQuat.setFromEuler(new THREE.Euler(p.life * 1.5, p.life * 1.1, 0));
        tempScale.set(s, s, s);
        tempMatrix.compose(p.pos, tempQuat, tempScale);
        smokeMesh.setMatrixAt(i, tempMatrix);
      }
      if (smokeDirty) smokeMesh.instanceMatrix.needsUpdate = true;

      // 3. Gentle Train Sway & Rail-Joint Bumps
      const swayRoll = Math.sin(elapsed * (1.8 + speedRatio * 2.5)) * 0.014 * (0.2 + 0.8 * speedRatio);
      const swayPitch = Math.cos(elapsed * (2.3 + speedRatio * 2.0)) * 0.005 * speedRatio;
      let bumpY = 0;

      railTieBumpAccum += currentTrainSpeed * dt;
      if (railTieBumpAccum >= 4.2) {
        railTieBumpAccum %= 4.2;
        const bumpImpulse = (1.5 + speedRatio * 3.2);
        bumpY = 0.035 * speedRatio;
        const lateral = (Math.random() - 0.5) * 2.2 * speedRatio;
        fumos.forEach(f => f.applyTrainBump(bumpImpulse, lateral));
        servedCups.forEach(c => {
          c.wobbleVelPitch += (Math.random() - 0.5) * bumpImpulse * 3.0;
          c.wobbleVelRoll += lateral * 3.5;
        });
      }

      trainGroup.rotation.x = swayRoll;
      trainGroup.rotation.z = swayPitch;
      trainGroup.position.y = THREE.MathUtils.lerp(trainGroup.position.y, bumpY, 0.35);

      // 4. Update Wobbling Served Teacups on Tables
      for (let i = 0; i < servedCups.length; i++) {
        const cup = servedCups[i];
        cup.wobbleVelPitch += (-160 * cup.wobblePitch - 7.5 * cup.wobbleVelPitch) * dt;
        cup.wobbleVelRoll += (-160 * cup.wobbleRoll - 7.5 * cup.wobbleVelRoll) * dt;
        cup.wobblePitch = THREE.MathUtils.clamp(cup.wobblePitch + cup.wobbleVelPitch * dt, -0.35, 0.35);
        cup.wobbleRoll = THREE.MathUtils.clamp(cup.wobbleRoll + cup.wobbleVelRoll * dt, -0.35, 0.35);
        cup.popScale = THREE.MathUtils.lerp(cup.popScale, 1.0, Math.min(1, dt * 8));

        cup.group.rotation.set(
          cup.wobblePitch + Math.sin(elapsed * 4 + cup.phase) * 0.03 * speedRatio,
          0,
          cup.wobbleRoll + Math.cos(elapsed * 3.5 + cup.phase) * 0.03 * speedRatio
        );
        cup.group.scale.setScalar(cup.popScale);
      }

      // 5. Update Firefly Clouds
      for (let i = 0; i < FIREFLY_COUNT; i++) {
        const ff = fireflyData[i];
        ff.x -= currentTrainSpeed * 0.35 * dt;
        if (ff.x < -22) ff.x += 44;
        const fy = ff.y + Math.sin(elapsed * 2.0 + ff.phase) * 0.45;
        const fz = ff.z + Math.cos(elapsed * 1.6 + ff.phase) * 0.45;
        const pulse = 0.4 + 0.8 * (0.5 + 0.5 * Math.sin(elapsed * 3.5 + ff.phase));
        tempPos.set(ff.x, fy, fz);
        tempQuat.identity();
        tempScale.set(pulse, pulse, pulse);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        fireflyMesh.setMatrixAt(i, tempMatrix);
      }
      fireflyMesh.instanceMatrix.needsUpdate = true;

      // 6. Update Day/Night, Audio Rhythm, Particles & Fumo Physics
      updateDayNightAndTunnel(dt, tunnelFactor);
      soundFX.update(dt, currentTrainSpeed, MAX_TRAIN_SPEED);
      updatePopParticles(dt);

      // Flicker firebox light warmly
      fireboxLight.color.setHSL(0.05 + Math.sin(elapsed * 11) * 0.015, 0.95, 0.55);

      for (let i = 0; i < fumos.length; i++) {
        fumos[i].updatePhysics(dt, elapsed);
      }
      resolveFumoToFumoCollisions();

      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    function pauseRenderLoop() {
      if (isPaused) return;
      isPaused = true;
      soundFX.setPaused(true);
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    function resumeRenderLoop() {
      if (!isPaused) return;
      isPaused = false;
      soundFX.setPaused(false);
      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    }

    // Hub Message Listener
    window.addEventListener('message', (e) => {
      const data = e.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'toggleMode') {
        toggleDayNight();
      } else if (data.type === 'pause') {
        pauseRenderLoop();
      } else if (data.type === 'resume') {
        resumeRenderLoop();
      }
    });

    window.onload = function () {
      let initialNight = true;
      try {
        const saved = localStorage.getItem(STORAGE_MODE_KEY);
        if (saved === 'day') initialNight = false;
        else if (saved === 'night') initialNight = true;
      } catch (e) {}

      setDayNightMode(initialNight, { immediate: true, playSound: false });
      updateDayNightAndTunnel(0, 0);
      updateSpeedGaugeUI();

      // Welcoming gentle plushie bounce on load
      fumos.forEach((f, idx) => {
        setTimeout(() => {
          f.squash = 0.78;
          f.squashVel = 2.0;
          f.headPitchVel = 4.0;
        }, 100 + idx * 60);
      });

      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    };
  </script>
</body>

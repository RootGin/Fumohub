<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Touhou Fumo Voxel Spirit Train — Overnight Journey</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Three.js r128 + OrbitControls + Post-Processing (UnrealBloomPass) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background-color: #0b0d1e;
    }
    h1, .font-display {
      font-family: 'Fredoka', sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.80);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.68);
      box-shadow: 0 10px 28px -6px rgba(20, 15, 45, 0.18), 0 2px 6px rgba(20, 15, 45, 0.08);
      transition: background 0.5s ease, color 0.5s ease, border-color 0.5s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    body.night-ui .glass-panel {
      background: rgba(20, 22, 44, 0.82);
      border-color: rgba(155, 145, 245, 0.28);
      color: #f3f0ff;
      box-shadow: 0 10px 30px -6px rgba(0, 0, 0, 0.6), 0 0 18px rgba(130, 110, 255, 0.16);
    }
    .ui-btn {
      cursor: pointer;
    }
    .ui-btn:hover {
      transform: translateY(-2px) scale(1.03);
    }
    .ui-btn:active {
      transform: translateY(1px) scale(0.97);
    }
    #fumo-tooltip {
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    kbd {
      font-family: 'Fredoka', sans-serif;
      display: inline-block;
      padding: 1px 6px;
      font-size: 0.72rem;
      line-height: 1.2;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.08);
      border-bottom: 2px solid rgba(0, 0, 0, 0.18);
    }
    body.night-ui kbd {
      background: rgba(255, 255, 255, 0.14);
      border-bottom-color: rgba(255, 255, 255, 0.28);
    }
    .speed-bar-fill {
      transition: width 0.15s ease-out, background-color 0.3s ease;
    }
  </style>
</head>
<body class="text-slate-800 night-ui">
  <div id="canvas-container"></div>

  <!-- Top-Right Controls: Active Status Badge, Whistle, Tea Service, Squeeze All, Reset (Top-Left kept completely empty for Hub) -->
  <div class="fixed top-4 right-4 z-20 flex flex-wrap items-center justify-end gap-2 max-w-[72vw]">
    <!-- Active / Hovered Fumo or Prop Indicator -->
    <div id="fumo-badge" class="glass-panel rounded-2xl px-3.5 py-2 text-xs font-semibold hidden items-center gap-2 transition-all">
      <span id="fumo-badge-dot" class="w-2.5 h-2.5 rounded-full inline-block bg-rose-500"></span>
      <span id="fumo-badge-name">Reimu Hakurei</span>
      <span id="fumo-badge-status" class="opacity-70 ml-1">Window Seat</span>
    </div>

    <!-- Blow Steam Whistle Button -->
    <button id="btn-whistle" title="Blow Steam Whistle (W)"
      class="glass-panel ui-btn rounded-2xl px-3.5 py-2 flex items-center gap-1.5 text-xs sm:text-sm font-semibold">
      <span class="text-base leading-none">🚂</span>
      <span class="hidden md:inline">Whistle</span>
    </button>

    <!-- Serve Tea Cart Button -->
    <button id="btn-tea" title="Serve Wobbling Tea Cups (T)"
      class="glass-panel ui-btn rounded-2xl px-3.5 py-2 flex items-center gap-1.5 text-xs sm:text-sm font-semibold">
      <span class="text-base leading-none">🍵</span>
      <span class="hidden md:inline">Serve Tea</span>
    </button>

    <!-- Squeeze All Button -->
    <button id="btn-squeeze-all" title="Squeeze All Fumos! (Space)"
      class="glass-panel ui-btn rounded-2xl px-3.5 py-2 flex items-center gap-1.5 text-xs sm:text-sm font-semibold">
      <span class="text-base leading-none">✨</span>
      <span class="hidden lg:inline">Squeeze All</span>
    </button>

    <!-- Reset Fumos Button -->
    <button id="btn-reset" title="Return Fumos to Train Seats (R)"
      class="glass-panel ui-btn rounded-2xl px-3.5 py-2 flex items-center gap-1.5 text-xs sm:text-sm font-semibold">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      <span class="hidden sm:inline">Reset</span>
    </button>
  </div>

  <!-- Bottom-Right Speed Gauge & Mute Button -->
  <div class="fixed bottom-4 right-4 z-20 flex items-end gap-2.5">
    <!-- Interactive Train Speed Gauge -->
    <div class="glass-panel rounded-2xl px-4 py-2.5 flex flex-col gap-1.5 min-w-[185px]">
      <div class="flex items-center justify-between gap-3">
        <span class="text-[11px] font-bold uppercase tracking-wider opacity-70 flex items-center gap-1">
          <span>⚡</span> Spirit Express
        </span>
        <span id="tunnel-indicator" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-400 hidden">
          TUNNEL ECHO
        </span>
      </div>
      <div class="flex items-baseline justify-between">
        <div class="font-display text-xl font-bold leading-none">
          <span id="speed-value">68</span>
          <span class="text-xs font-semibold opacity-70">km/h</span>
        </div>
        <div class="flex items-center gap-1">
          <button id="btn-speed-down" title="Decrease Train Speed (Down Arrow)"
            class="ui-btn w-6 h-6 rounded-lg bg-black/10 dark:bg-white/10 flex items-center justify-center text-xs font-bold">−</button>
          <button id="btn-speed-up" title="Increase Train Speed (Up Arrow)"
            class="ui-btn w-6 h-6 rounded-lg bg-black/10 dark:bg-white/10 flex items-center justify-center text-xs font-bold">+</button>
        </div>
      </div>
      <div class="w-full h-2 rounded-full bg-black/10 dark:bg-white/15 overflow-hidden">
        <div id="speed-bar" class="speed-bar-fill h-full rounded-full bg-amber-400" style="width: 56%;"></div>
      </div>
      <div class="text-[10px] opacity-70 font-semibold flex justify-between">
        <span><kbd>↑</kbd><kbd>↓</kbd> Speed</span>
        <span id="speed-state-label">Cruising</span>
      </div>
    </div>

    <!-- Mute Toggle Button (Bottom-Right as requested) -->
    <button id="btn-sound" title="Toggle Train & Plush Sound Effects (M)"
      class="glass-panel ui-btn rounded-2xl p-3 flex items-center justify-center">
      <svg id="icon-sound-on" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
      <svg id="icon-sound-off" class="w-5 h-5 hidden opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
    </button>
  </div>

  <!-- Floating Cursor Tooltip for Hovered Fumo / Interactive Prop -->
  <div id="fumo-tooltip" class="fixed z-30 opacity-0 px-3 py-1.5 rounded-xl glass-panel text-xs font-semibold flex items-center gap-2 shadow-lg">
    <span id="tooltip-emoji">🎀</span>
    <span id="tooltip-text">Reimu Fumo</span>
  </div>

  <!-- Bottom Center HUD Hints -->
  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-10 pointer-events-none hidden lg:block">
    <div class="glass-panel rounded-2xl px-4 py-2 text-xs font-semibold flex items-center gap-x-4 opacity-90">
      <span>🖱️ <b>Click Fumo:</b> Squeeze</span>
      <span>✋ <b>Drag:</b> Toss</span>
      <span>🚂 <b>Click Whistle / Tea Cart:</b> Interact</span>
      <span><kbd>↑</kbd><kbd>↓</kbd> Train Speed</span>
    </div>
  </div>

  <script>
    // ============================================================================
    // 1. WEB AUDIO SYNTHESIZER (Chug Rhythm, Steam Whistle, Tunnel Echo, Music Box & Squeaks)
    // ============================================================================
    const STORAGE_MUTE_KEY = 'voxel_spirit_train_muted';
    const STORAGE_MODE_KEY = 'voxel_spirit_train_mode';

    class TrainAndPlushSoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.isPaused = false;
        this.noiseBuffer = null;
        this.masterGain = null;
        this.dryGain = null;
        this.echoDelay = null;
        this.echoFeedback = null;
        this.echoWetGain = null;
        this.tunnelEchoAmount = 0;

        this.chugAccum = 0;
        this.chugStep = 0;
        this.musicAccum = 0;
        this.musicIndex = 0;

        // Gentle Touhou-style pentatonic music-box notes (Hz)
        this.melodyNotes = [
          659.25, 783.99, 880.00, 1046.50, 880.00, 783.99, 659.25, 587.33,
          523.25, 587.33, 659.25, 783.99, 659.25, 587.33, 523.25, 440.00,
          523.25, 659.25, 880.00, 987.77, 1046.50, 880.00, 783.99, 659.25
        ];

        try {
          const savedMute = localStorage.getItem(STORAGE_MUTE_KEY);
          if (savedMute === 'true') this.muted = true;
        } catch (e) {}
      }

      unlock() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            this.ctx = new AudioCtx();

            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = this.muted ? 0.0 : 1.0;
            this.masterGain.connect(this.ctx.destination);

            this.dryGain = this.ctx.createGain();
            this.dryGain.gain.value = 1.0;
            this.dryGain.connect(this.masterGain);

            // Tunnel Echo Delay Network
            this.echoDelay = this.ctx.createDelay(1.0);
            this.echoDelay.delayTime.value = 0.23;
            this.echoFeedback = this.ctx.createGain();
            this.echoFeedback.gain.value = 0.42;
            this.echoWetGain = this.ctx.createGain();
            this.echoWetGain.gain.value = 0.05;

            this.echoDelay.connect(this.echoFeedback);
            this.echoFeedback.connect(this.echoDelay);
            this.echoDelay.connect(this.echoWetGain);
            this.echoWetGain.connect(this.masterGain);

            // Generate 2 seconds of white noise for steam chugs and whistle breath
            const sr = this.ctx.sampleRate;
            this.noiseBuffer = this.ctx.createBuffer(1, sr * 2, sr);
            const data = this.noiseBuffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) {
              data[i] = Math.random() * 2 - 1;
            }
          }
          if (this.ctx && this.ctx.state === 'suspended' && !this.isPaused) {
            this.ctx.resume().catch(() => {});
          }
        } catch (e) {}
      }

      connectOut(node) {
        if (!this.ctx) return;
        node.connect(this.dryGain);
        node.connect(this.echoDelay);
      }

      setMuted(mute) {
        this.muted = Boolean(mute);
        try {
          localStorage.setItem(STORAGE_MUTE_KEY, this.muted ? 'true' : 'false');
        } catch (e) {}
        if (this.ctx && this.masterGain) {
          try {
            this.masterGain.gain.setTargetAtTime(this.muted ? 0.0 : 1.0, this.ctx.currentTime, 0.04);
          } catch (e) {}
        }
      }

      setPaused(paused) {
        this.isPaused = Boolean(paused);
        if (!this.ctx) return;
        try {
          if (this.isPaused && this.ctx.state === 'running') {
            this.ctx.suspend().catch(() => {});
          } else if (!this.isPaused && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        } catch (e) {}
      }

      setTunnelEcho(amount) {
        this.tunnelEchoAmount = amount;
        if (!this.ctx || !this.echoWetGain || !this.echoFeedback) return;
        try {
          const now = this.ctx.currentTime;
          this.echoWetGain.gain.setTargetAtTime(0.05 + amount * 0.48, now, 0.1);
          this.echoFeedback.gain.setTargetAtTime(0.32 + amount * 0.35, now, 0.1);
        } catch (e) {}
      }

      // Rhythmic Steam Chug + Track Joint Clack tied to Train Speed
      playChugStep(speedRatio, isAccent) {
        if (this.muted || this.isPaused || !this.ctx || !this.noiseBuffer) return;
        try {
          const now = this.ctx.currentTime;
          const src = this.ctx.createBufferSource();
          src.buffer = this.noiseBuffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          // In tunnel, resonant lower frequencies bloom
          const baseCutoff = isAccent ? 310 : 220;
          filter.frequency.setValueAtTime(baseCutoff + speedRatio * 140 - this.tunnelEchoAmount * 70, now);
          filter.Q.setValueAtTime(2.6 + this.tunnelEchoAmount * 2.0, now);

          const gain = this.ctx.createGain();
          const vol = (isAccent ? 0.055 : 0.032) * (0.45 + 0.55 * speedRatio);
          const dur = Math.max(0.055, 0.14 - speedRatio * 0.06);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(vol, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + dur);

          src.connect(filter);
          filter.connect(gain);
          this.connectOut(gain);
          src.start(now, Math.random() * 1.2, dur + 0.02);

          // Every 4th beat, play the "clack-clack" of wheels over rail joints
          if (this.chugStep % 4 === 0 || this.chugStep % 4 === 1) {
            const osc = this.ctx.createOscillator();
            const cGain = this.ctx.createGain();
            osc.type = 'triangle';
            const f = (this.chugStep % 4 === 0) ? 145 : 118;
            osc.frequency.setValueAtTime(f + this.tunnelEchoAmount * 45, now);
            osc.frequency.exponentialRampToValueAtTime(38, now + 0.045);

            cGain.gain.setValueAtTime(0.038 * speedRatio, now);
            cGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.connect(cGain);
            this.connectOut(cGain);
            osc.start(now);
            osc.stop(now + 0.055);
          }
        } catch (e) {}
      }

      // Delicate Music Box Note
      playMusicBoxNote(freq) {
        if (this.muted || this.isPaused || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const overtone = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          overtone.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          overtone.frequency.setValueAtTime(freq * 2.0, now);

          const oGain = this.ctx.createGain();
          oGain.gain.setValueAtTime(0.18, now);
          oGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.028, now + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0005, now + 1.15);

          osc.connect(gain);
          overtone.connect(oGain);
          oGain.connect(gain);
          this.connectOut(gain);

          osc.start(now);
          overtone.start(now);
          osc.stop(now + 1.2);
          overtone.stop(now + 0.25);
        } catch (e) {}
      }

      // Rich Dual-Tone Steam Train Whistle
      playWhistle() {
        this.unlock();
        if (this.muted || this.isPaused || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const freqs = [440, 554.37, 659.25]; // Warm A-major / train chord
          freqs.forEach((f, idx) => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = idx === 0 ? 'triangle' : 'sawtooth';
            osc.frequency.setValueAtTime(f * 0.96, now);
            osc.frequency.exponentialRampToValueAtTime(f, now + 0.08);
            osc.frequency.setValueAtTime(f, now + 0.55);
            osc.frequency.exponentialRampToValueAtTime(f * 0.94, now + 0.85);

            const peak = idx === 0 ? 0.055 : 0.025;
            g.gain.setValueAtTime(0.001, now);
            g.gain.linearRampToValueAtTime(peak, now + 0.06);
            g.gain.setValueAtTime(peak, now + 0.52);
            g.gain.exponentialRampToValueAtTime(0.0008, now + 0.88);

            // Low-pass filter to make it warm and brassy
            const lp = this.ctx.createBiquadFilter();
            lp.type = 'lowpass';
            lp.frequency.setValueAtTime(1350, now);

            osc.connect(lp);
            lp.connect(g);
            this.connectOut(g);
            osc.start(now);
            osc.stop(now + 0.9);
          });

          // Steam hiss layer
          if (this.noiseBuffer) {
            const nSrc = this.ctx.createBufferSource();
            nSrc.buffer = this.noiseBuffer;
            const bp = this.ctx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.frequency.setValueAtTime(1600, now);
            const nGain = this.ctx.createGain();
            nGain.gain.setValueAtTime(0.001, now);
            nGain.gain.linearRampToValueAtTime(0.04, now + 0.05);
            nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
            nSrc.connect(bp);
            bp.connect(nGain);
            this.connectOut(nGain);
            nSrc.start(now, 0, 0.88);
          }
        } catch (e) {}
      }

      // Porcelain Teacup Clink Sound
      playTeaServe() {
        this.unlock();
        if (this.muted || this.isPaused || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [1320, 1760].forEach((f, i) => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            const t0 = now + i * 0.07;
            osc.frequency.setValueAtTime(f, t0);
            g.gain.setValueAtTime(0.001, t0);
            g.gain.linearRampToValueAtTime(0.06, t0 + 0.008);
            g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.22);
            osc.connect(g);
            this.connectOut(g);
            osc.start(t0);
            osc.stop(t0 + 0.24);
          });
        } catch (e) {}
      }

      // Cute Double-Chirp Plushie Squeeze Sound
      playSqueeze(pitchMultiplier = 1.0) {
        this.unlock();
        if (this.muted || this.isPaused || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const baseFreq = (520 + Math.random() * 80) * pitchMultiplier;

          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(baseFreq, now);
          osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.48, now + 0.085);
          osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.15, now + 0.16);
          gain1.gain.setValueAtTime(0.001, now);
          gain1.gain.linearRampToValueAtTime(0.10, now + 0.025);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
          osc1.connect(gain1);
          this.connectOut(gain1);
          osc1.start(now);
          osc1.stop(now + 0.18);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(baseFreq * 1.1, now + 0.11);
          osc2.frequency.exponentialRampToValueAtTime(baseFreq * 1.65, now + 0.21);
          gain2.gain.setValueAtTime(0.001, now + 0.11);
          gain2.gain.linearRampToValueAtTime(0.075, now + 0.13);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc2.connect(gain2);
          this.connectOut(gain2);
          osc2.start(now + 0.11);
          osc2.stop(now + 0.25);
        } catch (e) {}
      }

      // Soft Fabric Thud on Bounce
      playBounce(intensity = 0.5) {
        if (this.muted || this.isPaused || intensity < 0.08 || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const vol = Math.min(0.12, intensity * 0.10);
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const startFreq = 115 + Math.min(80, intensity * 35);
          osc.frequency.setValueAtTime(startFreq, now);
          osc.frequency.exponentialRampToValueAtTime(42, now + 0.09);
          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
          osc.connect(gain);
          this.connectOut(gain);
          osc.start(now);
          osc.stop(now + 0.1);
        } catch (e) {}
      }

      playPickup() {
        this.unlock();
        if (this.muted || this.isPaused || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(440, now + 0.09);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.045, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
          osc.connect(gain);
          this.connectOut(gain);
          osc.start(now);
          osc.stop(now + 0.1);
        } catch (e) {}
      }

      update(dt, trainSpeed, maxSpeed) {
        if (!this.ctx || this.muted || this.isPaused) return;
        const speedRatio = THREE.MathUtils.clamp(trainSpeed / maxSpeed, 0, 1);

        // 1. Track Chug Cadence tied directly to train speed
        if (speedRatio > 0.02) {
          const chugsPerSec = 1.6 + speedRatio * 6.8;
          this.chugAccum += dt * chugsPerSec;
          if (this.chugAccum >= 1.0) {
            this.chugAccum %= 1.0;
            this.playChugStep(speedRatio, (this.chugStep % 4 === 0));
            this.chugStep++;
          }
        }

        // 2. Gentle Music-Box Melody
        const noteRate = 1.35 + speedRatio * 0.45;
        this.musicAccum += dt * noteRate;
        if (this.musicAccum >= 1.0) {
          this.musicAccum %= 1.0;
          if (Math.random() < 0.72) {
            const note = this.melodyNotes[this.musicIndex % this.melodyNotes.length];
            this.playMusicBoxNote(note);
            this.musicIndex++;
          }
        }
      }
    }

    function voxelHash(x, y, z) {
      let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
      return n - Math.floor(n);
    }

    function varyColor(hexOrString, x, y, z, variance = 0.035, seamDarken = 0) {
      tempColor.set(hexOrString);
      const h = voxelHash(x, y, z);
      const delta = (h - 0.5) * 2 * variance - seamDarken;
      tempColor.offsetHSL(0, (h - 0.5) * 0.03, delta);
      return tempColor.clone();
    }

    function createSoftVoxelGeometry(size = 1) {
      const s = size * 0.985;
      return new THREE.BoxGeometry(s, s, s);
    }

    function buildVoxelInstancedMesh(voxels, unitSize, material, castShadow = true, receiveShadow = true) {
      if (!voxels || voxels.length === 0) return null;
      const geom = createSoftVoxelGeometry(unitSize);
      const mesh = new THREE.InstancedMesh(geom, material, voxels.length);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = receiveShadow;

      for (let i = 0; i < voxels.length; i++) {
        const v = voxels[i];
        tempPos.set(v.x * unitSize, v.y * unitSize, v.z * unitSize);
        tempQuat.identity();
        tempScale.set(v.sx || 1, v.sy || 1, v.sz || 1);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        mesh.setMatrixAt(i, tempMatrix);
        mesh.setColorAt(i, v.color instanceof THREE.Color ? v.color : new THREE.Color(v.color));
      }
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      return mesh;
    }

    function addTrainCollider(minX, minY, minZ, maxX, maxY, maxZ, name = 'train_part') {

    function pushTV(list, tx, ty, tz, hex, variance = 0.025, sx = 1, sy = 1, sz = 1) {
      list.push({
        x: tx, y: ty, z: tz,
        color: varyColor(hex, tx, ty, tz, variance),
        sx, sy, sz
      });
    }

    function pushTBox(list, x0, y0, z0, x1, y1, z1, colOrFn, variance = 0.025) {
      for (let x = x0; x <= x1; x++) {
        for (let y = y0; y <= y1; y++) {
          for (let z = z0; z <= z1; z++) {
            if (x > x0 && x < x1 && y > y0 && y < y1 && z > z0 && z < z1) continue;
            const c = typeof colOrFn === 'function' ? colOrFn(x, y, z) : colOrFn;
            if (c) pushTV(list, x, y, z, c, variance);
          }
        }
      }
    }

    // ============================================================================
    // 7. SCROLLING MAGICAL COUNTRYSIDE LANDSCAPE (River Bridge, Tunnel, Paddy, Village, Lake, Shrine)
    // Loops seamlessly over LOOP_LENGTH = 96 world units!
    // ============================================================================
    const LV = 0.45; // 1 Landscape Voxel = 0.45 world units
    const LOOP_LENGTH = 96.0;
    const NUM_CHUNKS = 2; // Two 96-unit chunks tiled side by side for seamless wrap
    const landscapeChunks = [];

    function buildSingleLandscapeChunk() {
      const chunkGroup = new THREE.Group();
      const landSolid = [];
      const landWater = [];
      const landLantern = [];

      const pushLV = (arr, x, y, z, col, variance = 0.035, sx = 1, sy = 1, sz = 1) => {
        // World coords inside chunk: x in [-106..106] * LV (~ -48 to +48 world units)
        arr.push({
          x, y, z,
          color: varyColor(col, x, y, z, variance),
          sx, sy, sz
        });
      };

      // Grid X goes from -106 to +106 (213 columns * 0.45 = 95.85 ~ 96.0 units)
      for (let gx = -106; gx <= 106; gx++) {
        const inRiverZone = (gx >= -92 && gx <= -62);
        const inTunnelZone = (gx >= -50 && gx <= -22);
        const inPaddyZone = (gx >= -16 && gx <= 18);
        const inVillageZone = (gx >= 24 && gx <= 56);
        const inLakeZone = (gx >= 60 && gx <= 84);
        const inShrineZone = (gx >= 72 && gx <= 102);

        // 1. RAILROAD TRACK BED, WOODEN TIES & STEEL RAILS (along gz = -3..3, gy = 0)
        if (!inRiverZone) {
          for (let gz = -4; gz <= 4; gz++) {
            pushLV(landSolid, gx, -1, gz, Math.abs(gz) === 4 ? '#475569' : '#64748b', 0.04);
          }
        } else {
          // Arched Red Steel & Stone Bridge over the River!
          pushLV(landSolid, gx, -1, -3, '#991b1b', 0.02);
          pushLV(landSolid, gx, -1, 3, '#991b1b', 0.02);
          if (gx % 4 === 0) {
            for (let by = 0; by <= 5; by++) {
              pushLV(landSolid, gx, by, -4, '#b91c1c', 0.02, 0.7, 1, 0.7);
              pushLV(landSolid, gx, by, 4, '#b91c1c', 0.02, 0.7, 1, 0.7);
            }
            pushLV(landSolid, gx, 5, -4, '#dc2626', 0.02, 4.1, 0.7, 0.7);
            pushLV(landSolid, gx, 5, 4, '#dc2626', 0.02, 4.1, 0.7, 0.7);
          }
          // Stone bridge piers in the river
          if (gx === -86 || gx === -68) {
            for (let py = -6; py <= -1; py++) {
              for (let pz = -4; pz <= 4; pz++) {
                pushLV(landSolid, gx, py, pz, '#64748b', 0.03);
              }
            }
          }
        }

        // Wooden sleepers (ties) & steel rails
        if (gx % 2 === 0) {
          for (let gz = -3; gz <= 3; gz++) {
            pushLV(landSolid, gx, -0.3, gz, '#5c3a21', 0.03, 0.8, 0.45, 1);
          }
        }
        pushLV(landSolid, gx, 0.05, -2.2, '#cbd5e1', 0.01, 1.02, 0.35, 0.35);
        pushLV(landSolid, gx, 0.05, 2.2, '#cbd5e1', 0.01, 1.02, 0.35, 0.35);

        // 2. FOREGROUND & BACKGROUND COUNTRYSIDE TERRAIN
        for (let gz = -38; gz <= 24; gz++) {
          if (gz >= -4 && gz <= 4) continue; // Track corridor

          // ZONE 1: RIVER WITH BRIDGE (gx: -92..-62)
          if (inRiverZone) {
            const riverCenter = -77 + Math.sin(gz * 0.12) * 4;
            const distFromRiver = Math.abs(gx - riverCenter);
            if (distFromRiver < 11) {
              pushLV(landWater, gx, -3.2, gz, distFromRiver > 9 ? '#bae6fd' : '#0284c7', 0.03, 1, 0.6, 1);
              continue;
            }
          }

          // ZONE 3: TERRACED PADDY FIELDS (gx: -16..18, gz < -6 or gz > 6)
          if (inPaddyZone && gz >= -26 && gz <= 18) {
            const stepTier = Math.floor(Math.abs(gz) / 8);
            const terraceY = -1.5 + (gz < 0 ? stepTier * 0.8 : -0.5);
            const isBund = (gx % 8 === 0 || gz % 8 === 0);
            if (isBund) {
              pushLV(landSolid, gx, terraceY + 0.3, gz, '#4d7c0f', 0.04);
            } else {
              pushLV(landWater, gx, terraceY, gz, '#38bdf8', 0.02, 1, 0.4, 1);
              if ((gx % 3 === 0) && (gz % 3 === 0)) {
                pushLV(landSolid, gx, terraceY + 0.5, gz, '#84cc16', 0.04, 0.45, 0.9, 0.45); // Rice shoots
              }
            }
            continue;
          }

          // ZONE 5: MISTY LAKE (gx: 60..84, gz > 5)
          if (inLakeZone && gz >= 6 && gz <= 22) {
            pushLV(landWater, gx, -2.2, gz, '#1d4ed8', 0.025, 1, 0.5, 1);
            if ((gx * 7 + gz * 11) % 29 === 0) {
              pushLV(landSolid, gx, -1.8, gz, '#22c55e', 0.03, 1.3, 0.3, 1.3); // Floating lotus pad
            }
            continue;
          }

          // Default rolling grassy hills
          let baseH = -2;
          if (gz < -8) {
            baseH = -1 + Math.floor(Math.sin(gx * 0.08) * 1.5 + Math.abs(gz + 8) * 0.25);
          } else if (gz > 8) {
            baseH = -2;
          }
          // Shrine Hill rise in background (gx: 74..100, gz < -14)
          if (inShrineZone && gz <= -14) {
            const hillDist = Math.hypot(gx - 87, gz + 25);
            if (hillDist < 14) {
              baseH = Math.max(baseH, Math.floor(11 - hillDist * 0.65));
            }
          }

          if (gz % 2 === 0 && gx % 2 === 0) {
            pushLV(landSolid, gx, baseH, gz, baseH > 3 ? '#15803d' : '#166534', 0.045, 2.02, 1.5, 2.02);
          }
        }

        // 3. ZONE 2: MOUNTAIN TUNNEL ARCH OVER THE TRACKS (gx: -48..-24)
        // Cutaway on front (+Z) side so we still see the train inside the glowing mountain cavern!
        if (gx >= -48 && gx <= -24) {
          const isPortal = (gx === -48 || gx === -24);
          // Back cavern wall (gz = -9..-7) and overhead mountain arch (gy = 12..19)
          for (let gy = -1; gy <= 18; gy++) {
            const wallCol = isPortal ? '#64748b' : '#334155';
            pushLV(landSolid, gx, gy, -8, wallCol, 0.04);
            if (gy >= 13) {
              for (let gz = -7; gz <= (isPortal ? 6 : 2); gz++) {
                const topY = 16 + Math.floor(Math.sin(gx * 0.2 + gz * 0.3) * 1.5);
                if (gy <= topY) {
                  pushLV(landSolid, gx, gy, gz, gy === topY ? '#15803d' : wallCol, 0.045);
                }
              }
            }
          }
          // Front portal stone pillar on +Z at tunnel entrance & exit
          if (isPortal) {
            for (let gy = -1; gy <= 14; gy++) {
              pushLV(landSolid, gx, gy, 6, '#64748b', 0.03, 1.5, 1, 1.5);
            }
            // Sacred Shimenawa rope & glowing spirit talismans (ofuda) on tunnel portals!
            for (let gz = -6; gz <= 5; gz += 2) {
              pushLV(landLantern, gx + (gx === -48 ? -0.6 : 0.6), 13.2, gz, '#fef08a', 0.01, 0.4, 1.1, 0.6);
            }
          }
          // Glowing amber tunnel wall lanterns inside the cavern
          if (gx % 6 === 0) {
            pushLV(landLantern, gx, 6, -6.8, '#ff9e00', 0.01, 0.9, 1.3, 0.9);
          }
        }
      }

      // 4. ZONE 4: LANTERN-LIT VILLAGE & WAYSIDE STATION (gx: 26..54, gz: -22..-8)
      // Wayside wooden station platform right behind the tracks (gx: 28..46, gz: -9..-5)
      for (let x = 28; x <= 46; x++) {
        for (let z = -9; z <= -5; z++) {
          pushLV(landSolid, x, 0.5, z, '#78350f', 0.02);
        }
        // Station awning roof
        for (let z = -9; z <= -6; z++) {
          pushLV(landSolid, x, 5.5, z, '#1e293b', 0.02);
        }
        if (x === 30 || x === 37 || x === 44) {
          for (let y = 1; y <= 5; y++) pushLV(landSolid, x, y, -8, '#451a03');
        }
        // Hanging warm station paper lanterns!
        if (x % 3 === 0) {
          pushLV(landLantern, x, 4.4, -5.8, (x % 6 === 0) ? '#ff4d6d' : '#ffb703', 0.01, 0.85, 1.2, 0.85);
        }
      }

      // Three Cozy Lit Village Houses behind the station
      const houses = [
        { cx: 30, cz: -17, w: 4, d: 3, h: 4, roofCol: '#1e293b' },
        { cx: 41, cz: -20, w: 5, d: 4, h: 5, roofCol: '#7f1d1d' },
        { cx: 51, cz: -16, w: 4, d: 3, h: 4, roofCol: '#1e3a8a' }
      ];
      houses.forEach((hs) => {
        for (let x = hs.cx - hs.w; x <= hs.cx + hs.w; x++) {
          for (let z = hs.cz - hs.d; z <= hs.cz + hs.d; z++) {
            for (let y = 1; y <= hs.h; y++) {
              const isEdge = (Math.abs(x - hs.cx) === hs.w || Math.abs(z - hs.cz) === hs.d);
              if (!isEdge) continue;
              const isGlowingWindow = (z === hs.cz + hs.d && y >= 2 && y <= 3 && Math.abs(x - hs.cx) <= 2 && x !== hs.cx);
              if (isGlowingWindow) {
                pushLV(landLantern, x, y, z, '#fde68a', 0.01);
              } else {
                pushLV(landSolid, x, y, z, '#e2e8f0', 0.02);
              }
            }
            // Gabled tiled roof
            const roofH = hs.h + 1 + (hs.d - Math.abs(z - hs.cz));
            pushLV(landSolid, x, roofH, z, hs.roofCol, 0.025);
          }
        }
      });

      // 5. ZONE 6: HAKUREI SHRINE ON THE HILL (gx: 80..94, gz: -29..-18, gy: 11+)
      // Vermilion Torii Gate on the hill steps (gx: 87, gz: -17)
      for (let y = 6; y <= 13; y++) {
        pushLV(landSolid, 84, y, -17, '#dc2626', 0.01);
        pushLV(landSolid, 90, y, -17, '#dc2626', 0.01);
      }
      for (let x = 83; x <= 91; x++) {
        pushLV(landSolid, x, 13, -17, '#b91c1c', 0.01);
        pushLV(landSolid, x, 11, -17, '#dc2626', 0.01);
      }
      // Shrine Main Hall on hilltop (gx: 83..91, gz: -27..-22, gy: 11..16)
      for (let x = 83; x <= 91; x++) {
        for (let z = -27; z <= -22; z++) {
          for (let y = 11; y <= 15; y++) {
            const isFront = (z === -22 && Math.abs(x - 87) <= 2 && y <= 14);
            if (isFront) {
              pushLV(landLantern, x, y, z, '#fde047', 0.01);
            } else if (x === 83 || x === 91 || z === -27 || z === -22) {
              pushLV(landSolid, x, y, z, '#fef2f2', 0.02);
            }
          }
          const sRoofY = 16 + (3 - Math.abs(z + 24.5));
          pushLV(landSolid, x, sRoofY, z, '#991b1b', 0.02);
        }
      }
      // Stone Lanterns flanking the shrine
      pushLV(landLantern, 82, 12, -20, '#ffb703', 0.01, 0.9, 1.2, 0.9);
      pushLV(landLantern, 92, 12, -20, '#ffb703', 0.01, 0.9, 1.2, 0.9);

      const mSolid = buildVoxelInstancedMesh(landSolid, LV, landscapeMaterial, true, true);
      const mWater = buildVoxelInstancedMesh(landWater, LV, waterMaterial, false, true);
      const mLantern = buildVoxelInstancedMesh(landLantern, LV, warmLanternMaterial, false, false);

      if (mSolid) chunkGroup.add(mSolid);
      if (mWater) chunkGroup.add(mWater);
      if (mLantern) chunkGroup.add(mLantern);

      return chunkGroup;
    }

    for (let c = 0; c < NUM_CHUNKS; c++) {
      const chunk = buildSingleLandscapeChunk();
      chunk.position.x = c * LOOP_LENGTH;
      scene.add(chunk);
      landscapeChunks.push(chunk);
    }

    // ============================================================================
    // 8. SKY STARS, FIREFLY CLOUDS, DRIFTING DAY CLOUDS & CHIMNEY SMOKE PUFFS
    // ============================================================================
    // 8A. Starry Night Sky Dome (Instanced Voxel Stars)
    const STAR_COUNT = 260;
    const starGeom = new THREE.BoxGeometry(0.18, 0.18, 0.18);
    const starMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
    const starMesh = new THREE.InstancedMesh(starGeom, starMat, STAR_COUNT);
    for (let i = 0; i < STAR_COUNT; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI * 0.42 + 0.06;
      const rad = 58 + Math.random() * 18;
      tempPos.set(
        Math.cos(theta) * Math.cos(phi) * rad,
        Math.sin(phi) * rad + 4,
        Math.sin(theta) * Math.cos(phi) * rad - 10
      );
      tempQuat.identity();
      const s = 0.6 + Math.random() * 1.4;
      tempScale.set(s, s, s);
      tempMatrix.compose(tempPos, tempQuat, tempScale);
      starMesh.setMatrixAt(i, tempMatrix);
      const starCols = ['#ffffff', '#fef08a', '#bae6fd', '#fbcfe8'];
      starMesh.setColorAt(i, new THREE.Color(starCols[i % starCols.length]));
    }
    starMesh.instanceMatrix.needsUpdate = true;
    starMesh.instanceColor.needsUpdate = true;
    scene.add(starMesh);

    // 8B. Glowing Firefly Clouds drifting over the countryside
    const FIREFLY_COUNT = 75;
    const fireflyData = [];
    const fireflyGeom = new THREE.BoxGeometry(0.12, 0.12, 0.12);
    const fireflyMat = new THREE.MeshBasicMaterial({ color: 0xd9f99d, transparent: true, opacity: 0.85 });
    const fireflyMesh = new THREE.InstancedMesh(fireflyGeom, fireflyMat, FIREFLY_COUNT);
    for (let i = 0; i < FIREFLY_COUNT; i++) {
      fireflyData.push({
        x: (Math.random() - 0.5) * 44,
        y: 0.6 + Math.random() * 6.5,
        z: (Math.random() > 0.45 ? -1 : 1) * (3.5 + Math.random() * 10),
        phase: Math.random() * Math.PI * 2,
        speed: 0.5 + Math.random() * 0.8
      });
    }
    scene.add(fireflyMesh);

    // 8C. Pooled Chimney Smoke & Steam Whistle Puffs
    const SMOKE_MAX = 90;
    const smokePuffs = [];
    const smokeGeom = new THREE.BoxGeometry(0.32, 0.32, 0.32);
    const smokeMat = new THREE.MeshStandardMaterial({
      color: 0xf8fafc,
      roughness: 0.95,
      transparent: true,
      opacity: 0.78
    });
    const smokeMesh = new THREE.InstancedMesh(smokeGeom, smokeMat, SMOKE_MAX);
    for (let i = 0; i < SMOKE_MAX; i++) {
      smokePuffs.push({
        active: false,
        pos: new THREE.Vector3(),
        vel: new THREE.Vector3(),
        life: 0,
        maxLife: 1,
        baseScale: 1
      });
      tempMatrix.makeScale(0, 0, 0);
      smokeMesh.setMatrixAt(i, tempMatrix);
    }
    scene.add(smokeMesh);

    let smokeSpawnTimer = 0;
    function spawnSmokePuff(worldOrigin, isWhistleSteam = false) {
      for (let i = 0; i < SMOKE_MAX; i++) {
        const p = smokePuffs[i];
        if (!p.active) {
          p.active = true;
          p.life = 0;
          p.maxLife = isWhistleSteam ? (0.8 + Math.random() * 0.5) : (1.8 + Math.random() * 0.9);
          p.pos.copy(worldOrigin).add(new THREE.Vector3(
            (Math.random() - 0.5) * 0.2,
            (Math.random() - 0.5) * 0.15,
            (Math.random() - 0.5) * 0.2
          ));
          p.vel.set(
            (Math.random() - 0.5) * 0.8,
            isWhistleSteam ? (4.2 + Math.random() * 2.5) : (2.2 + Math.random() * 1.4),
            (Math.random() - 0.5) * 0.8
          );
          p.baseScale = isWhistleSteam ? 0.65 : 1.05;
          break;
        }
      }
    }

    function triggerSteamWhistle() {
      soundFX.playWhistle();
      const wWorld = new THREE.Vector3();
      whistleGroup.getWorldPosition(wWorld);
      wWorld.y += 0.7;
      for (let k = 0; k < 14; k++) {
        setTimeout(() => spawnSmokePuff(wWorld, true), k * 35);
      }
      updateUIBadge({ name: 'Spirit Locomotive', accentColor: '#f59e0b' }, 'Whistle Blown! 🚂💨');
    }

    function triggerTeaCartService() {
      soundFX.playTeaServe();
      servedCups.forEach((cup, i) => {
        cup.wobbleVelPitch += (Math.random() > 0.5 ? 1 : -1) * (10 + i * 1.5);
        cup.wobbleVelRoll += (Math.random() - 0.5) * 12;
        cup.popScale = 1.45;
      });
      const cartWorld = new THREE.Vector3();
      teaCartGroup.getWorldPosition(cartWorld);
      spawnSqueezeParticles(cartWorld, '#4ade80');
      updateUIBadge({ name: 'Matcha Tea Service', accentColor: '#4ade80' }, 'Fresh Tea Served! 🍵');
    }

    // ============================================================================
    // 9. SQUEEZE SPARKLE BURST PARTICLES
    // ============================================================================
    const POP_MAX = 56;
    const popParticles = [];
    const popGeom = new THREE.BoxGeometry(0.11, 0.11, 0.11);
    const popMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const popMesh = new THREE.InstancedMesh(popGeom, popMat, POP_MAX);
    for (let i = 0; i < POP_MAX; i++) {
      popParticles.push({ active: false, pos: new THREE.Vector3(), vel: new THREE.Vector3(), life: 0, maxLife: 1, color: new THREE.Color('#ff85a1') });
      tempMatrix.makeScale(0, 0, 0);
      popMesh.setMatrixAt(i, tempMatrix);
    }
    scene.add(popMesh);

    function spawnSqueezeParticles(origin, accentHex) {
      const palette = [accentHex, '#ff85a1', '#fde047', '#ffffff'];
      let spawned = 0;
      for (let i = 0; i < POP_MAX && spawned < 12; i++) {
        const p = popParticles[i];
        if (!p.active) {
          p.active = true;
          p.life = 0;
          p.maxLife = 0.45 + Math.random() * 0.25;
          p.pos.copy(origin).add(new THREE.Vector3(0, 0.85, 0));
          const angle = (spawned / 12) * Math.PI * 2 + Math.random() * 0.3;
          const speed = 2.2 + Math.random() * 2.0;
          p.vel.set(Math.cos(angle) * speed, 2.5 + Math.random() * 2.2, Math.sin(angle) * speed);
          p.color.set(palette[spawned % palette.length]);
          popMesh.setColorAt(i, p.color);
          spawned++;
        }
      }
      if (popMesh.instanceColor) popMesh.instanceColor.needsUpdate = true;
    }

    function updatePopParticles(dt) {
      let dirty = false;
      for (let i = 0; i < POP_MAX; i++) {
        const p = popParticles[i];
        if (!p.active) continue;
        dirty = true;
        p.life += dt;
        if (p.life >= p.maxLife) {
          p.active = false;
          tempMatrix.makeScale(0, 0, 0);
          popMesh.setMatrixAt(i, tempMatrix);
          continue;
        }
        p.vel.y -= 7.5 * dt;
        p.pos.addScaledVector(p.vel, dt);
        const s = 1.0 - (p.life / p.maxLife);
        tempQuat.setFromEuler(new THREE.Euler(p.life * 8, p.life * 6, 0));
        tempScale.set(s, s, s);
        tempMatrix.compose(p.pos, tempQuat, tempScale);
        popMesh.setMatrixAt(i, tempMatrix);
      }
      if (dirty) popMesh.instanceMatrix.needsUpdate = true;
    }

    // ============================================================================
    // 10. TOUHOU FUMO VOXEL PLUSHIE BUILDER & SOFT-BODY PHYSICS CLASS
    // ============================================================================
    const allFumoRaycastMeshes = [];
    const fumos = [];

    class VoxelFumo {
      constructor(config) {
        this.id = config.id;
        this.name = config.name;
        this.role = config.role || 'Passenger';
        this.emoji = config.emoji || '🎀';
        this.accentColor = config.accentColor || '#ef4444';
        this.scaleFactor = config.scale || 1.0;
        this.FV = 0.074 * this.scaleFactor; // Scaled to fit train booths & aisles
        this.radius = 0.72 * this.scaleFactor;
        this.pitchAudio = config.pitchAudio || 1.0;
        this.isAsleep = Boolean(config.isAsleep);
        this.isWaving = Boolean(config.isWaving);

        this.homePos = config.homePos.clone();
        this.homeYaw = config.homeYaw || 0;

        this.pos = this.homePos.clone();
        this.vel = new THREE.Vector3();
        this.yaw = this.homeYaw;
        this.pitch = 0;
        this.roll = 0;
        this.angVel = new THREE.Vector3();
        this.isGrounded = true;
        this.isDragged = false;
        this.isDisplacedFromHome = false;

        // Soft-Body Spring States
        this.squash = 1.0;
        this.squashVel = 0.0;

        this.headPitch = 0.0;
        this.headRoll = 0.0;
        this.headPitchVel = 0.0;
        this.headRollVel = 0.0;

        this.limbPitch = 0.0;
        this.limbRoll = 0.0;
        this.limbPitchVel = 0.0;
        this.limbRollVel = 0.0;

        this.root = new THREE.Group();
        this.squashGroup = new THREE.Group();
        this.root.add(this.squashGroup);

        this.headPivot = new THREE.Group();
        this.headPivot.position.set(0, 7.2 * this.FV, 0);
        this.squashGroup.add(this.headPivot);

        this.leftArmPivot = new THREE.Group();
        this.leftArmPivot.position.set(-4.2 * this.FV, 6.2 * this.FV, 0.5 * this.FV);
        this.squashGroup.add(this.leftArmPivot);

        this.rightArmPivot = new THREE.Group();
        this.rightArmPivot.position.set(4.2 * this.FV, 6.2 * this.FV, 0.5 * this.FV);
        this.squashGroup.add(this.rightArmPivot);

        this.leftLegPivot = new THREE.Group();
        this.leftLegPivot.position.set(-2.3 * this.FV, 1.8 * this.FV, 3.2 * this.FV);
        this.squashGroup.add(this.leftLegPivot);

        this.rightLegPivot = new THREE.Group();
        this.rightLegPivot.position.set(2.3 * this.FV, 1.8 * this.FV, 3.2 * this.FV);
        this.squashGroup.add(this.rightLegPivot);

        this.wingsPivot = new THREE.Group();
        this.wingsPivot.position.set(0, 4.8 * this.FV, -3.5 * this.FV);
        this.squashGroup.add(this.wingsPivot);

        this.buildCharacterVoxels(config);
        this.syncTransform(0);
        trainGroup.add(this.root); // Attached to trainGroup so fumos ride & sway with the train!
      }

      buildCharacterVoxels(cfg) {
        const bodyVoxels = [];
        const headVoxels = [];
        const leftArmVoxels = [];
        const rightArmVoxels = [];
        const leftLegVoxels = [];
        const rightLegVoxels = [];
        const wingSolidVoxels = [];
        const wingGlowVoxels = [];

        const skinBase = '#ffe5d4';
        const blushCol = '#ff9ebb';
        const smileCol = '#4a2525';

        const addPlushVoxel = (arr, x, y, z, col, isSeam = false) => {
          const seamDarken = (isSeam && ((Math.abs(x + y + z) % 2) === 0)) ? 0.055 : 0;
          arr.push({
            x, y, z,
            color: varyColor(col, x + this.id.length * 7, y, z, 0.04, seamDarken)
          });
        };

        // 1. STUBBY SITTING TORSO
        for (let y = 0; y <= 7; y++) {
          const rMax = (y === 0 || y === 7) ? 3.4 : 4.2 - (y * 0.12);
          for (let x = -4; x <= 4; x++) {
            for (let z = -3; z <= 3; z++) {
              const dist = Math.hypot(x, z * 1.15);
              if (dist > rMax) continue;

              const isSideSeam = (z === 0 && Math.abs(x) >= rMax - 0.9);
              let col = cfg.outfitMain;

              if (y === 1 && z >= 1) col = '#ffffff';
              if (cfg.hasWhiteApron && z >= 1 && Math.abs(x) <= 2 && y <= 5) {
                col = '#fcfcfc';
              }
              if (y >= 5 && z >= 2 && Math.abs(x) <= 2) {
                col = '#ffffff';
                if (Math.abs(x) <= 1 && y === 5) col = cfg.tieColor || '#ef4444';
              }
              // Sakuya Conductor gold double-breasted buttons
              if (this.id === 'sakuya' && z >= 2 && Math.abs(x) === 1 && (y === 2 || y === 4)) {
                col = '#eab308';
              }
              // Koishi green diamond buttons & Third Eye on chest
              if (this.id === 'koishi' && z >= 2) {
                if (x === 0 && y === 3) col = '#e11d48'; // Third eye core
                else if (Math.abs(x) <= 1 && y === 3) col = '#a855f7';
              }
              // Okuu red nuclear hexagon core on chest
              if (this.id === 'okuu' && z >= 2 && Math.abs(x) <= 1 && y >= 3 && y <= 5) {
                col = '#dc2626';
              }
              if (this.id === 'remilia' && z >= 2 && x === 0 && y >= 2 && y <= 6) {
                col = '#d90429';
              }
              if (this.id === 'flandre' && z >= 2 && Math.abs(x) === 1 && y === 4) {
                col = '#fde047';
              }

              addPlushVoxel(bodyVoxels, x, y + 0.5, z, col, isSideSeam);
            }
          }
        }

        // 2. SHORT DANGLING ARMS + CHARACTER PROPS IN HANDS
        for (const side of [-1, 1]) {
          const targetArr = side === -1 ? leftArmVoxels : rightArmVoxels;
          for (let y = -3; y <= 0; y++) {
            for (let x = -1; x <= 1; x++) {
              for (let z = -1; z <= 1; z++) {
                if (Math.abs(x) === 1 && Math.abs(z) === 1 && y === -3) continue;
                let col = cfg.sleeveColor || '#ffffff';
                if (y === -3) col = skinBase;
                else if (this.id === 'reimu' && y === -1) col = '#e63946';
                // Okuu's right arm is her iconic Third Leg Control Rod Cannon!
                if (this.id === 'okuu' && side === 1 && y <= -1) col = '#475569';
                addPlushVoxel(targetArr, x * 0.85 + side * 0.4, y, z * 0.85, col, x === 0);
              }
            }
          }
        }

        // Sakuya's Golden Conductor Pocket Watch in right hand
        if (this.id === 'sakuya') {
          addPlushVoxel(rightArmVoxels, 0.5, -3.5, 1.8, '#eab308');
          addPlushVoxel(rightArmVoxels, 0.5, -4.4, 2.2, '#eab308');
          addPlushVoxel(rightArmVoxels, 0.5, -4.4, 2.7, '#ffffff');
        }
        // Aya's Vintage Voxel Camera held in front of her right hand
        if (this.id === 'aya') {
          for (let cx = -2; cx <= 0; cx++) {
            for (let cy = -3; cy <= -1; cy++) {
              addPlushVoxel(rightArmVoxels, cx, cy, 2.2, '#1e293b');
            }
          }
          addPlushVoxel(rightArmVoxels, -1, -2, 3.1, '#94a3b8'); // Camera lens
          addPlushVoxel(rightArmVoxels, 0, -1, 2.9, '#fef08a'); // Flash bulb
        }
        // Okuu's Coal Shovel in left hand
        if (this.id === 'okuu') {
          for (let sz = 1; sz <= 5; sz++) {
            addPlushVoxel(leftArmVoxels, -0.5, -2.5, sz, sz >= 4 ? '#334155' : '#78350f');
          }
          addPlushVoxel(leftArmVoxels, -0.5, -2.0, 5.2, '#ff4d00'); // Glowing coal on shovel!
        }

        // 3. SHORT SITTING / DANGLING LEGS WITH SHOES
        for (const side of [-1, 1]) {
          const targetArr = side === -1 ? leftLegVoxels : rightLegVoxels;
          for (let z = 0; z <= 4; z++) {
            for (let x = -1; x <= 1; x++) {
              for (let y = -1; y <= 1; y++) {
                if (Math.abs(x) === 1 && Math.abs(y) === 1) continue;
                let col = '#ffffff';
                if (z === 0) col = skinBase;
                if (z >= 3) col = cfg.shoeColor || '#2b2d42';
                if (z === 4 && y === 1 && x === 0) col = '#ffffff';
                addPlushVoxel(targetArr, x * 0.9, y * 0.9, z * 0.9, col, y === 0);
              }
            }
          }
        }

        // 4. OVERSIZED ROUND FUMO HEAD, ICONIC 'ᗜˬᗜ' FACE (or sleeping '_ ˬ _'), HAIR & HATS
        for (let y = 0; y <= 12; y++) {
          for (let x = -7; x <= 7; x++) {
            for (let z = -6; z <= 6; z++) {
              const dy = (y - 6.0) * 1.05;
              const dx = x * 0.94;
              const dz = z * 1.02;
              const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
              if (dist > 6.4 || dist < 4.5) continue;

              let col = skinBase;
              const isHeadSeam = (z === 0 && Math.abs(x) >= 5);

              const isBackOrTop = (z <= 1) || (y >= 9) || (Math.abs(x) >= 5 && z <= 3);
              const isForeheadBangs = (z >= 4 && y >= 7 && (Math.abs(x) !== 2 || y >= 8));
              const isSideLocks = (Math.abs(x) >= 5 && z >= 2 && y >= 2);

              if (isBackOrTop || isForeheadBangs || isSideLocks) {
                col = cfg.hairColor;
              } else if (z >= 5) {
                if ((Math.abs(x) === 3 || Math.abs(x) === 2) && y >= 4 && y <= 6) {
                  if (this.isAsleep) {
                    // Closed peaceful sleeping fumo eyes (curved bar at y === 4)
                    if (y === 4) col = '#1f141e';
                  } else {
                    if (y === 6) col = '#1f141e';
                    else if (y === 5 && Math.abs(x) === 2) col = '#ffffff';
                    else col = cfg.eyeColor;
                  }
                } else if (Math.abs(x) === 4 && y === 3) {
                  col = blushCol;
                } else if (y === 2 && Math.abs(x) <= 1) {
                  col = (x === 0) ? '#e07a7a' : smileCol;
                }
              }

              addPlushVoxel(headVoxels, x, y, z, col, isHeadSeam);
            }
          }
        }

        // Character-Specific Headwear, Bows, Parasols & Wings:
        if (this.id === 'reimu') {
          for (const side of [-1, 1]) {
            for (let y = -1; y <= 5; y++) {
              const tubeCol = (y === 5) ? '#e63946' : ((y >= 1 && y <= 4) ? '#ffffff' : cfg.hairColor);
              addPlushVoxel(headVoxels, side * 6.8, y, 2.2, tubeCol);
              addPlushVoxel(headVoxels, side * 6.8, y, 3.0, tubeCol);
            }
          }
          for (let bx = -7; bx <= 7; bx++) {
            const wingHeight = Math.min(4, Math.floor(Math.abs(bx) * 0.7) + 1);
            for (let by = -wingHeight; by <= wingHeight; by++) {
              addPlushVoxel(headVoxels, bx, 12.2 + by * 0.75, -1.5 - Math.abs(bx) * 0.15, '#d90429');
            }
          }
        }

        if (this.id === 'cirno') {
          for (let bx = -6; bx <= 6; bx++) {
            const h = Math.min(3, Math.floor(Math.abs(bx) * 0.65) + 1);
            for (let by = -h; by <= h; by++) {
              addPlushVoxel(headVoxels, bx, 10.5 + by * 0.75, -4.8, '#1d4ed8');
            }
          }
          const wingAngles = [0.45, 0.05, -0.35];
          for (const side of [-1, 1]) {
            for (let w = 0; w < 3; w++) {
              const ang = wingAngles[w];
              for (let r = 1; r <= 7; r++) {
                const wx = side * (1.2 + Math.cos(ang) * r * 1.05);
                const wy = 1.0 + Math.sin(ang) * r * 1.05;
                const wz = -0.5 - r * 0.15;
                wingGlowVoxels.push({
                  x: wx, y: wy, z: wz,
                  color: varyColor(r > 5 ? '#e0f2fe' : '#38bdf8', wx, wy, wz, 0.02),
                  sx: 1.1, sy: 0.85, sz: 0.6
                });
              }
            }
          }

      squeeze(strength = 1.0) {
        this.squash = Math.max(0.52, this.squash - 0.42 * strength);
        this.squashVel = -3.5 * strength;
        this.headPitchVel += (Math.random() - 0.5) * 14 * strength;
        this.headRollVel += (Math.random() > 0.5 ? 1 : -1) * 11 * strength;
        this.limbPitch = -0.65 * strength;
        this.limbPitchVel = -6.0 * strength;

        const worldPos = new THREE.Vector3();
        this.root.getWorldPosition(worldPos);
        spawnSqueezeParticles(worldPos, this.accentColor);
        soundFX.playSqueeze(this.pitchAudio);

      resetToHome() {
        this.pos.copy(this.homePos);
        this.vel.set(0, 0, 0);
        this.yaw = this.homeYaw;
        this.pitch = 0;
        this.roll = 0;
        this.angVel.set(0, 0, 0);
        this.isGrounded = true;
        this.isDragged = false;
        this.isDisplacedFromHome = false;
        this.squeeze(0.75);
      }

      applyTrainBump(bumpImpulse, swayLateral) {
        this.headPitchVel += bumpImpulse * (0.8 + Math.random() * 0.5);
        this.headRollVel += swayLateral * 1.4;
        this.squashVel -= Math.abs(bumpImpulse) * 0.18;
        // Loose / displaced fumos slide a little with train bumps!
        if (this.isDisplacedFromHome && this.isGrounded && !this.isDragged) {
          this.vel.x += (Math.random() - 0.55) * Math.abs(bumpImpulse) * 0.35;
          this.vel.z += swayLateral * 0.25;
        }
      }

      updatePhysics(dt, time) {
        const squashStiff = 210.0;
        const squashDamp = 11.5;
        const squashForce = (1.0 - this.squash) * squashStiff - this.squashVel * squashDamp;
        this.squashVel += squashForce * dt;
        this.squash += this.squashVel * dt;
        this.squash = THREE.MathUtils.clamp(this.squash, 0.45, 1.55);

        const headStiff = 140.0;
        const headDamp = 7.5;
        const idleHeadBob = Math.sin(time * 2.2 + this.homePos.x) * 0.03;
        this.headPitchVel += ((idleHeadBob - this.headPitch) * headStiff - this.headPitchVel * headDamp) * dt;
        this.headRollVel += ((0 - this.headRoll) * headStiff - this.headRollVel * headDamp) * dt;
        this.headPitch = THREE.MathUtils.clamp(this.headPitch + this.headPitchVel * dt, -0.55, 0.55);
        this.headRoll = THREE.MathUtils.clamp(this.headRoll + this.headRollVel * dt, -0.55, 0.55);

        const targetLimbPitch = (this.isDragged || !this.isGrounded) ? 0.58 : 0.0;
        const limbStiff = 120.0;
        const limbDamp = 8.0;
        this.limbPitchVel += ((targetLimbPitch - this.limbPitch) * limbStiff - this.limbPitchVel * limbDamp) * dt;
        this.limbRollVel += ((0 - this.limbRoll) * limbStiff - this.limbRollVel * limbDamp) * dt;
        this.limbPitch = THREE.MathUtils.clamp(this.limbPitch + this.limbPitchVel * dt, -0.8, 0.9);
        this.limbRoll = THREE.MathUtils.clamp(this.limbRoll + this.limbRollVel * dt, -0.6, 0.6);

        if (!this.isDragged) {
          // If resting undisturbed in its special seat/hammock/perch, keep it anchored until tossed
          if (!this.isDisplacedFromHome) {
            this.pos.lerp(this.homePos, Math.min(1, dt * 12));
            this.isGrounded = true;
          } else {
            this.vel.y -= 24.0 * dt;
            this.vel.multiplyScalar(Math.pow(0.985, dt * 60));
            this.pos.addScaledVector(this.vel, dt);

            this.yaw += this.angVel.y * dt;
            this.pitch += this.angVel.x * dt;
            this.roll += this.angVel.z * dt;
            this.angVel.multiplyScalar(Math.pow(0.92, dt * 60));

            this.isGrounded = false;

            // Ground / Track Embankment Floor (Y = 0.25)
            if (this.pos.y < 0.25) {
              const impact = -this.vel.y;
              this.pos.y = 0.25;
              if (impact > 1.8) {
                this.vel.y = impact * 0.42;
                this.squashVel -= Math.min(9.0, impact * 0.95);
                this.headPitchVel += (Math.random() - 0.5) * impact * 2.0;
                this.headRollVel += (Math.random() - 0.5) * impact * 2.0;
                soundFX.playBounce(impact * 0.08);
              } else {
                this.vel.y = 0;
                this.isGrounded = true;
              }
              this.vel.x *= 0.80;
              this.vel.z *= 0.80;
            }

            // Keep inside viewable diorama bounds
            this.pos.x = THREE.MathUtils.clamp(this.pos.x, -13.5, 13.5);
            this.pos.z = THREE.MathUtils.clamp(this.pos.z, -1.45, 4.5);

            // Train Car & Furniture AABB Collisions
            const r = this.radius * 0.72;
            const centerY = this.pos.y + r;

            for (let i = 0; i < trainColliders.length; i++) {
              const box = trainColliders[i];
              const cx = THREE.MathUtils.clamp(this.pos.x, box.min.x, box.max.x);
              const cy = THREE.MathUtils.clamp(centerY, box.min.y, box.max.y);
              const cz = THREE.MathUtils.clamp(this.pos.z, box.min.z, box.max.z);

              const dx = this.pos.x - cx;
              const dy = centerY - cy;
              const dz = this.pos.z - cz;
              const distSq = dx * dx + dy * dy + dz * dz;

              if (distSq < r * r) {
                const dist = Math.sqrt(distSq);
                if (centerY >= box.max.y - 0.22 && this.vel.y <= 0.5) {
                  const impact = -this.vel.y;
                  this.pos.y = box.max.y;
                  if (impact > 2.0) {
                    this.vel.y = impact * 0.38;
                    this.squashVel -= Math.min(8.5, impact * 0.85);
                    this.headPitchVel += (Math.random() - 0.5) * impact * 1.8;
                    soundFX.playBounce(impact * 0.08);
                  } else {
                    this.vel.y = 0;
                    this.isGrounded = true;
                  }
                  this.vel.x *= 0.82;
                  this.vel.z *= 0.82;
                } else if (dist > 0.0001) {
                  const nx = dx / dist;
                  const ny = dy / dist;
                  const nz = dz / dist;
                  const pen = r - dist;
                  this.pos.x += nx * pen;
                  this.pos.y = Math.max(0.25, this.pos.y + ny * pen);
                  this.pos.z += nz * pen;

                  const vn = this.vel.x * nx + this.vel.y * ny + this.vel.z * nz;
                  if (vn < 0) {
                    const imp = -vn;
                    this.vel.x -= 1.42 * vn * nx;
                    this.vel.y -= 1.42 * vn * ny;
                    this.vel.z -= 1.42 * vn * nz;
                    if (imp > 2.0) {
                      this.squashVel -= Math.min(6.0, imp * 0.55);
                      soundFX.playBounce(imp * 0.06);
                    }
                  }
                }
              }
            }

            if (this.isGrounded) {
              this.pitch = THREE.MathUtils.lerp(this.pitch, 0, Math.min(1, dt * 9.5));
              this.roll = THREE.MathUtils.lerp(this.roll, 0, Math.min(1, dt * 9.5));
              this.angVel.multiplyScalar(0.75);
            }
          }
        }

        this.syncTransform(time);
      }

      syncTransform(time) {
        this.root.position.copy(this.pos);
        this.root.rotation.order = 'YXZ';
        this.root.rotation.set(this.pitch, this.yaw, this.roll);

        const sy = this.squash;
        const sxz = 1.0 / Math.sqrt(Math.max(0.35, sy));
        this.squashGroup.scale.set(sxz, sy, sxz);

        this.headPivot.rotation.set(this.headPitch, 0, this.headRoll);

        const waveRight = this.isWaving ? (0.85 + Math.sin(time * 6.5) * 0.45) : 0;
        this.leftArmPivot.rotation.set(this.limbPitch, 0, 0.18 + Math.abs(this.limbPitch) * 0.35 + this.limbRoll);
        this.rightArmPivot.rotation.set(this.limbPitch - waveRight * 0.4, 0, -0.18 - Math.abs(this.limbPitch) * 0.35 + this.limbRoll - waveRight);
        this.leftLegPivot.rotation.set(this.limbPitch * 1.15, 0.08, this.limbRoll * 0.5);
        this.rightLegPivot.rotation.set(this.limbPitch * 1.15, -0.08, this.limbRoll * 0.5);

        const wingFlutter = Math.sin(time * 3.8 + this.homePos.x) * 0.06 + (1.0 - this.squash) * 0.35;
        this.wingsPivot.rotation.x = wingFlutter;
      }
    }

    function resolveFumoToFumoCollisions() {
      for (let i = 0; i < fumos.length; i++) {
        for (let j = i + 1; j < fumos.length; j++) {
          const a = fumos[i];
          const b = fumos[j];
          if (!a.isDisplacedFromHome && !b.isDisplacedFromHome) continue;
          const minDist = (a.radius + b.radius) * 0.78;
          const dx = b.pos.x - a.pos.x;
          const dy = (b.pos.y + b.radius * 0.6) - (a.pos.y + a.radius * 0.6);
          const dz = b.pos.z - a.pos.z;
          const distSq = dx * dx + dy * dy + dz * dz;

          if (distSq < minDist * minDist && distSq > 0.0001) {
            const dist = Math.sqrt(distSq);
            const nx = dx / dist;
            const ny = dy / dist;
            const nz = dz / dist;
            const overlap = (minDist - dist) * 0.5;

            if (!a.isDragged && a.isDisplacedFromHome) {
              a.pos.x -= nx * overlap;
              a.pos.y = Math.max(0.25, a.pos.y - ny * overlap);
              a.pos.z -= nz * overlap;
            }
            if (!b.isDragged && b.isDisplacedFromHome) {
              b.pos.x += nx * overlap;
              b.pos.y = Math.max(0.25, b.pos.y + ny * overlap);
              b.pos.z += nz * overlap;
            }
          }
        }
      }
    }

    // ============================================================================
    // 12. POINTER INTERACTION: FUMOS, STEAM WHISTLE & ROLLING TEA CART
    // ============================================================================
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    const dragPlane = new THREE.Plane();
    const dragHitPoint = new THREE.Vector3();
    const dragOffset = new THREE.Vector3();

    let hoveredFumo = null;
    let hoveredProp = null;
    let selectedFumo = null;
    let isDraggingFumo = false;
    let pointerDownScreen = new THREE.Vector2();
    let dragHistory = [];

    const tooltipEl = document.getElementById('fumo-tooltip');
    const tooltipEmojiEl = document.getElementById('tooltip-emoji');
    const tooltipTextEl = document.getElementById('tooltip-text');
    const badgeEl = document.getElementById('fumo-badge');
    const badgeDotEl = document.getElementById('fumo-badge-dot');
    const badgeNameEl = document.getElementById('fumo-badge-name');
    const badgeStatusEl = document.getElementById('fumo-badge-status');

    function updatePointerNDC(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function pickSceneTarget() {
      raycaster.setFromCamera(pointerNDC, camera);
      const fumoHits = raycaster.intersectObjects(allFumoRaycastMeshes, false);
      const propHits = raycaster.intersectObjects(interactivePropMeshes, false);

      if (fumoHits.length > 0 && propHits.length > 0) {
        if (propHits[0].distance < fumoHits[0].distance) {
          return { type: 'prop', propType: propHits[0].object.userData.interactiveType, label: propHits[0].object.userData.label };
        }
      }
      if (fumoHits.length > 0 && fumoHits[0].object.userData.fumo) {
        return { type: 'fumo', fumo: fumoHits[0].object.userData.fumo, point: fumoHits[0].point };
      }
      if (propHits.length > 0) {
        return { type: 'prop', propType: propHits[0].object.userData.interactiveType, label: propHits[0].object.userData.label };
      }
      return null;
    }

    function updateUIBadge(entity, statusText) {
      if (!entity) {
        badgeEl.classList.add('hidden');
        badgeEl.classList.remove('flex');
        return;
      }
      badgeEl.classList.remove('hidden');
      badgeEl.classList.add('flex');
      badgeDotEl.style.backgroundColor = entity.accentColor || '#f59e0b';
      badgeNameEl.textContent = entity.name;
      badgeStatusEl.textContent = statusText;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      recordInteraction();
      updatePointerNDC(e);
      pointerDownScreen.set(e.clientX, e.clientY);

      const hit = pickSceneTarget();
      if (!hit) return;

      if (hit.type === 'prop') {
        if (hit.propType === 'whistle') {
          triggerSteamWhistle();
        } else if (hit.propType === 'teacart') {
          triggerTeaCartService();
        }
        return;
      }

      if (hit.type === 'fumo') {
        selectedFumo = hit.fumo;
        isDraggingFumo = false;
        controls.enabled = false; // Dragging a fumo must never rotate the camera!

        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        const worldPos = new THREE.Vector3();
        selectedFumo.root.getWorldPosition(worldPos);
        dragPlane.setFromNormalAndCoplanarPoint(camDir.negate(), worldPos);

        if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
          trainGroup.worldToLocal(dragHitPoint);
          dragOffset.subVectors(selectedFumo.pos, dragHitPoint);
        } else {
          dragOffset.set(0, 0, 0);
        }

        dragHistory = [{ pos: selectedFumo.pos.clone(), time: performance.now() }];
        updateUIBadge(selectedFumo, selectedFumo.role);
      }
    });

    window.addEventListener('pointermove', (e) => {
      updatePointerNDC(e);

      if (selectedFumo) {
        recordInteraction();
        const moveDist = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);

        if (!isDraggingFumo && moveDist > 6) {
          isDraggingFumo = true;
          selectedFumo.isDragged = true;
          selectedFumo.isDisplacedFromHome = true;
          selectedFumo.isGrounded = false;
          selectedFumo.squashVel += 3.2;
          soundFX.playPickup();
          updateUIBadge(selectedFumo, 'Dragging — Release to Throw!');
        }

        if (isDraggingFumo) {
          raycaster.setFromCamera(pointerNDC, camera);
          if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
            trainGroup.worldToLocal(dragHitPoint);
            const targetPos = dragHitPoint.clone().add(dragOffset);
            targetPos.x = THREE.MathUtils.clamp(targetPos.x, -13.0, 13.0);
            targetPos.y = THREE.MathUtils.clamp(targetPos.y, 0.4, 11.5);
            targetPos.z = THREE.MathUtils.clamp(targetPos.z, -1.35, 4.2);

            const prevPos = selectedFumo.pos.clone();
            selectedFumo.pos.lerp(targetPos, 0.55);

            const deltaMove = selectedFumo.pos.clone().sub(prevPos);
            selectedFumo.headRollVel -= deltaMove.x * 16.0;
            selectedFumo.headPitchVel += deltaMove.z * 16.0 - deltaMove.y * 10.0;
            selectedFumo.limbRollVel -= deltaMove.x * 22.0;
            selectedFumo.roll = THREE.MathUtils.lerp(selectedFumo.roll, THREE.MathUtils.clamp(-deltaMove.x * 1.4, -0.45, 0.45), 0.3);
            selectedFumo.pitch = THREE.MathUtils.lerp(selectedFumo.pitch, THREE.MathUtils.clamp(deltaMove.z * 1.4, -0.45, 0.45), 0.3);

            const now = performance.now();
            dragHistory.push({ pos: selectedFumo.pos.clone(), time: now });
            while (dragHistory.length > 6) dragHistory.shift();
          }
          tooltipEl.style.opacity = '0';
          renderer.domElement.style.cursor = 'grabbing';
          return;
        }
      }

      const hit = pickSceneTarget();
      if (hit && hit.type === 'fumo') {
        hoveredFumo = hit.fumo;
        hoveredProp = null;
        renderer.domElement.style.cursor = 'grab';
        tooltipEmojiEl.textContent = hoveredFumo.emoji;
        tooltipTextEl.textContent = `${hoveredFumo.name} • ${hoveredFumo.role}`;
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = `${e.clientX + 14}px`;
        tooltipEl.style.top = `${e.clientY - 18}px`;
      } else if (hit && hit.type === 'prop') {
        hoveredFumo = null;
        hoveredProp = hit;
        renderer.domElement.style.cursor = 'pointer';
        tooltipEmojiEl.textContent = hit.propType === 'whistle' ? '🚂' : '🍵';
        tooltipTextEl.textContent = hit.label;
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = `${e.clientX + 14}px`;
        tooltipEl.style.top = `${e.clientY - 18}px`;
      } else {
        hoveredFumo = null;
        hoveredProp = null;
        renderer.domElement.style.cursor = 'default';
        tooltipEl.style.opacity = '0';
      }
    });

    window.addEventListener('pointerup', () => {
      if (!selectedFumo) return;
      controls.enabled = true;
      recordInteraction();

      if (!isDraggingFumo) {
        selectedFumo.squeeze(1.0);
        updateUIBadge(selectedFumo, 'Squeezed! ᗜˬᗜ');
      } else {
        selectedFumo.isDragged = false;
        const now = performance.now();
        while (dragHistory.length > 1 && now - dragHistory[0].time > 140) {
          dragHistory.shift();
        }
        if (dragHistory.length >= 2) {
          const first = dragHistory[0];
          const last = dragHistory[dragHistory.length - 1];
          const dtSec = Math.max(0.016, (last.time - first.time) / 1000);
          const throwVel = last.pos.clone().sub(first.pos).divideScalar(dtSec);
          if (throwVel.length() > 20) throwVel.setLength(20);
          selectedFumo.vel.copy(throwVel);

          const speed = throwVel.length();
          selectedFumo.angVel.set(
            throwVel.z * 0.65 + (Math.random() - 0.5) * speed * 0.4,
            (Math.random() - 0.5) * speed * 0.5,
            -throwVel.x * 0.65 + (Math.random() - 0.5) * speed * 0.4
          );
        } else {
          selectedFumo.vel.set(0, 0, 0);
        }
        updateUIBadge(selectedFumo, 'Tossed!');
      }

      selectedFumo = null;
      isDraggingFumo = false;
      renderer.domElement.style.cursor = (hoveredFumo || hoveredProp) ? 'pointer' : 'default';
    });

    // ============================================================================

    // ============================================================================
    // 14. DAY / NIGHT SMOOTH INTERPOLATION (~2 SECONDS) & HUB INTEGRATION
    // ============================================================================
    let isNightMode = true; // Overnight journey default
    let dayNightProgress = 1.0; // 0.0 = Day, 1.0 = Night
    let dayNightTarget = 1.0;

    const daySkyColor = new THREE.Color('#bfe3ff');
    const nightSkyColor = new THREE.Color('#090c1d');

    const dayDirLightCol = new THREE.Color('#fff2d6');
    const nightDirLightCol = new THREE.Color('#6b8ce8');

    const dayHemiSky = new THREE.Color('#fff8eb');
    const nightHemiSky = new THREE.Color('#1f244d');
    const dayHemiGround = new THREE.Color('#9ab087');
    const nightHemiGround = new THREE.Color('#0c0e1c');

    function notifyParentMode() {
      const modeStr = isNightMode ? 'night' : 'day';
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'modeChanged', mode: modeStr }, '*');
        }
      } catch (e) {}
    }

    function setDayNightMode(night, { immediate = false, playSound = true } = {}) {
      isNightMode = Boolean(night);
      dayNightTarget = isNightMode ? 1.0 : 0.0;
      if (immediate) {
        dayNightProgress = dayNightTarget;
      }
      document.body.classList.toggle('night-ui', isNightMode);

      try {
        localStorage.setItem(STORAGE_MODE_KEY, isNightMode ? 'night' : 'day');
      } catch (e) {}

      if (playSound) {
        soundFX.playPickup();
      }
      notifyParentMode();
    }

    function toggleDayNight() {
      setDayNightMode(!isNightMode, { immediate: false, playSound: true });
    }

    function updateDayNightAndTunnel(dt, tunnelFactor) {
      if (Math.abs(dayNightProgress - dayNightTarget) > 0.0005) {
        const step = dt * 0.52; // ~2 seconds transition
        if (dayNightProgress < dayNightTarget) {
          dayNightProgress = Math.min(dayNightTarget, dayNightProgress + step);
        } else {
          dayNightProgress = Math.max(dayNightTarget, dayNightProgress - step);
        }
      }

      const t = dayNightProgress < 0.5
        ? 4 * dayNightProgress * dayNightProgress * dayNightProgress
        : 1 - Math.pow(-2 * dayNightProgress + 2, 3) / 2;

      // Blend in tunnel darkening when the mountain tunnel passes over the train
      const effNight = Math.min(1.0, t + tunnelFactor * 0.45);

      scene.background.lerpColors(daySkyColor, nightSkyColor, t);
      scene.fog.color.copy(scene.background);
      scene.fog.density = THREE.MathUtils.lerp(0.0065, 0.0095, t);

      mainDirLight.color.lerpColors(dayDirLightCol, nightDirLightCol, t);
      mainDirLight.intensity = THREE.MathUtils.lerp(1.35, 0.34, effNight);

      hemiLight.color.lerpColors(dayHemiSky, nightHemiSky, t);
      hemiLight.groundColor.lerpColors(dayHemiGround, nightHemiGround, t);
      hemiLight.intensity = THREE.MathUtils.lerp(0.72, 0.24, effNight);

      // Train interior & lantern lights glow warmly at night or inside the tunnel
      carriage1Light.intensity = THREE.MathUtils.lerp(0.25, 1.35, effNight);
      diningCarLight.intensity = THREE.MathUtils.lerp(0.25, 1.35, effNight);
      headlampLight.intensity = THREE.MathUtils.lerp(0.20, 1.65, effNight);
      fireboxLight.intensity = THREE.MathUtils.lerp(0.75, 1.85, effNight);

      warmLanternMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.32, 2.1, effNight);
      fireEmberMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.85, 2.4, effNight);
      translucentIceMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.2, 0.8, effNight);
      crystalWingMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.28, 1.25, effNight);

      starMat.opacity = THREE.MathUtils.lerp(0.0, 0.92, t);
      fireflyMat.opacity = THREE.MathUtils.lerp(0.0, 0.88, t);

      if (bloomPass) {
        bloomPass.strength = THREE.MathUtils.lerp(0.14, 0.65, effNight);
        bloomPass.threshold = THREE.MathUtils.lerp(0.85, 0.62, effNight);
      }
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      recordInteraction();

      const key = e.key.toLowerCase();
      if (key === 'n') {
        e.preventDefault();

        e.preventDefault();
        changeTrainSpeed(1.8);

        triggerTeaCartService();

        e.preventDefault();

          const roofOffset = new THREE.Vector3(0, 1.88, 0.1).applyEuler(roverGroup.rotation);
          this.pos.copy(roverState.pos).add(roofOffset);
          this.yaw = roverState.yaw;
          this.pitch = roverState.pitch;
          this.roll = roverState.roll;
          this.isGrounded = true;
          if (Math.abs(roverState.speed) > 0.4) {
            this.headPitchVel += (Math.random() - 0.5) * Math.abs(roverState.speed) * 0.4;
          }
          this.syncTransform(time);
          return;
        }

        // 5. Low Lunar Gravity (1/6g) Ballistic Flight & Multi-Bounce Settling
        if (!this.isDragged) {
          this.vel.y -= LUNAR_GRAVITY * dt;
          // Virtually zero air resistance in vacuum!
          this.vel.x *= Math.pow(0.997, dt * 60);
          this.vel.z *= Math.pow(0.997, dt * 60);

          this.pos.addScaledVector(this.vel, dt);

          this.yaw += this.angVel.y * dt;
          this.pitch += this.angVel.x * dt;
          this.roll += this.angVel.z * dt;
          this.angVel.multiplyScalar(Math.pow(0.96, dt * 60));

          this.isGrounded = false;

          // Check landing on the Rover Roof!
          const dRover = Math.hypot(this.pos.x - roverState.pos.x, this.pos.z - roverState.pos.z);
          const roverRoofY = roverState.pos.y + 1.88;
          if (dRover < 1.15 && this.pos.y >= roverRoofY - 0.35 && this.pos.y <= roverRoofY + 0.35 && this.vel.y <= 0) {
            this.pos.y = roverRoofY;
            this.vel.set(0, 0, 0);
            this.isGrounded = true;
            this.ridingRoverActive = true;
            this.squashVel -= 3.5;
            soundFX.playBounce(0.5);
          }

          // Lunar Surface & Crater Terrain Collision
          const groundY = getLunarSurfaceHeight(this.pos.x, this.pos.z);
          if (this.pos.y <= groundY) {
            const impact = -this.vel.y;
            this.pos.y = groundY;

            // Low gravity + springy plush = multiple lofty bounces before settling!
            if (impact > 0.42) {
              this.vel.y = impact * 0.62;
              this.vel.x *= 0.84;
              this.vel.z *= 0.84;
              this.squashVel -= Math.min(8.0, impact * 1.45);
              this.headPitchVel += (Math.random() - 0.5) * impact * 3.0;
              this.headRollVel += (Math.random() - 0.5) * impact * 3.0;

              // Emit ballistic lunar dust puff & stamp footprints in regolith!
              spawnLunarDustBurst(this.pos, Math.min(18, Math.ceil(impact * 4)), Math.min(1.6, 0.5 + impact * 0.25));
              stampFootprint(this.pos.x, this.pos.z, this.yaw);
              soundFX.playBounce(impact * 0.14);
            } else {
              this.vel.y = 0;
              this.vel.x *= 0.72;
              this.vel.z *= 0.72;
              this.isGrounded = true;
            }
          }

          // Keep inside lunar diorama bounds
          const bound = 10.8;
          if (this.pos.x < -bound) { this.pos.x = -bound; this.vel.x = Math.abs(this.vel.x) * 0.55; }
          if (this.pos.x > bound)  { this.pos.x = bound;  this.vel.x = -Math.abs(this.vel.x) * 0.55; }
          if (this.pos.z < -bound) { this.pos.z = -bound; this.vel.z = Math.abs(this.vel.z) * 0.55; }
          if (this.pos.z > bound)  { this.pos.z = bound;  this.vel.z = -Math.abs(this.vel.z) * 0.55; }

          // Prop & Furniture AABB Collisions
          const r = this.radius * 0.72;
          const centerY = this.pos.y + r;

          for (let i = 0; i < furnitureColliders.length; i++) {
            const box = furnitureColliders[i];
            const cx = THREE.MathUtils.clamp(this.pos.x, box.min.x, box.max.x);
            const cy = THREE.MathUtils.clamp(centerY, box.min.y, box.max.y);
            const cz = THREE.MathUtils.clamp(this.pos.z, box.min.z, box.max.z);

            const dx = this.pos.x - cx;
            const dy = centerY - cy;
            const dz = this.pos.z - cz;
            const distSq = dx * dx + dy * dy + dz * dz;

            if (distSq < r * r) {
              const dist = Math.sqrt(distSq);
              if (centerY >= box.max.y - 0.25 && this.vel.y <= 0.4) {
                const impact = -this.vel.y;
                this.pos.y = box.max.y;
                if (impact > 0.5) {
                  this.vel.y = impact * 0.55;
                  this.squashVel -= Math.min(7.5, impact * 1.2);
                  soundFX.playBounce(impact * 0.12);
                } else {
                  this.vel.y = 0;
                  this.isGrounded = true;
                }
                this.vel.x *= 0.80;
                this.vel.z *= 0.80;
              } else if (dist > 0.0001) {
                const nx = dx / dist;
                const ny = dy / dist;
                const nz = dz / dist;
                const pen = r - dist;
                this.pos.x += nx * pen;
                this.pos.y = Math.max(groundY, this.pos.y + ny * pen);
                this.pos.z += nz * pen;

                const vn = this.vel.x * nx + this.vel.y * ny + this.vel.z * nz;
                if (vn < 0) {
                  const imp = -vn;
                  this.vel.x -= 1.5 * vn * nx;
                  this.vel.y -= 1.5 * vn * ny;
                  this.vel.z -= 1.5 * vn * nz;
                  if (imp > 0.8) {
                    this.squashVel -= Math.min(5.0, imp * 0.7);
                    soundFX.playBounce(imp * 0.1);
                  }
                }
              }
            }
          }

          if (this.isGrounded) {
            this.pitch = THREE.MathUtils.lerp(this.pitch, 0, Math.min(1, dt * 8.5));
            this.roll = THREE.MathUtils.lerp(this.roll, 0, Math.min(1, dt * 8.5));
            this.angVel.multiplyScalar(0.75);
          }
        }

        this.syncTransform(time);
      }

      syncTransform(time) {
        this.root.position.copy(this.pos);
        this.root.rotation.order = 'YXZ';
        this.root.rotation.set(this.pitch, this.yaw, this.roll);

        const sy = this.squash;
        const sxz = 1.0 / Math.sqrt(Math.max(0.35, sy));
        this.squashGroup.scale.set(sxz, sy, sxz);

        this.headPivot.rotation.set(this.headPitch, 0, this.headRoll);

        // Seiran gently swings her mochi mallet when idle!
        const seiranSwing = (this.id === 'seiran' && this.isGrounded && !this.isDragged)
          ? Math.sin(time * 5.2) * 0.35
          : 0;

        this.leftArmPivot.rotation.set(this.limbPitch, 0, 0.18 + Math.abs(this.limbPitch) * 0.35 + this.limbRoll);
        this.rightArmPivot.rotation.set(this.limbPitch + seiranSwing, 0, -0.18 - Math.abs(this.limbPitch) * 0.35 + this.limbRoll);
        this.leftLegPivot.rotation.set(this.limbPitch * 1.15, 0.08, this.limbRoll * 0.5);
        this.rightLegPivot.rotation.set(this.limbPitch * 1.15, -0.08, this.limbRoll * 0.5);

        const wingFlutter = Math.sin(time * 3.2 + this.homePos.x) * 0.07 + (1.0 - this.squash) * 0.35;
        this.wingsPivot.rotation.y = wingFlutter;
      }
    }

    function resolveFumoToFumoCollisions() {
      for (let i = 0; i < fumos.length; i++) {
        for (let j = i + 1; j < fumos.length; j++) {
          const a = fumos[i];
          const b = fumos[j];
          const minDist = (a.radius + b.radius) * 0.78;
          const dx = b.pos.x - a.pos.x;
          const dy = (b.pos.y + b.radius * 0.6) - (a.pos.y + a.radius * 0.6);
          const dz = b.pos.z - a.pos.z;
          const distSq = dx * dx + dy * dy + dz * dz;

          if (distSq < minDist * minDist && distSq > 0.0001) {
            const dist = Math.sqrt(distSq);
            const nx = dx / dist;
            const ny = dy / dist;
            const nz = dz / dist;
            const overlap = (minDist - dist) * 0.5;

            if (!a.isDragged && !a.ridingRoverActive) {
              a.pos.x -= nx * overlap;
              a.pos.z -= nz * overlap;
            }
            if (!b.isDragged && !b.ridingRoverActive) {
              b.pos.x += nx * overlap;
              b.pos.z += nz * overlap;
            }

            const rvx = b.vel.x - a.vel.x;
            const rvy = b.vel.y - a.vel.y;
            const rvz = b.vel.z - a.vel.z;
            const vn = rvx * nx + rvy * ny + rvz * nz;
            if (vn < 0) {
              const imp = -vn * 0.72;
              if (!a.isDragged && !a.ridingRoverActive) {
                a.vel.x -= imp * nx;
                a.vel.y -= imp * ny;
                a.vel.z -= imp * nz;
                a.squashVel -= Math.min(5.0, imp * 0.8);
              }
              if (!b.isDragged && !b.ridingRoverActive) {
                b.vel.x += imp * nx;
                b.vel.y += imp * ny;
                b.vel.z += imp * nz;
                b.squashVel -= Math.min(5.0, imp * 0.8);
              }
              if (imp > 0.9) soundFX.playBounce(imp * 0.1);
            }
          }
        }
      }
    }

    // ============================================================================
    // 10. POINTER INTERACTION: RAYCASTING, SQUEEZE, PICK UP, DRAG & 1/6G THROW
    // ============================================================================
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    const dragPlane = new THREE.Plane();
    const dragHitPoint = new THREE.Vector3();
    const dragOffset = new THREE.Vector3();

    let hoveredFumo = null;
    let selectedFumo = null;
    let isDraggingFumo = false;
    let pointerDownScreen = new THREE.Vector2();
    let dragHistory = [];

    const tooltipEl = document.getElementById('fumo-tooltip');
    const tooltipEmojiEl = document.getElementById('tooltip-emoji');

    function updatePointerNDC(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function pickFumoUnderPointer() {
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(allFumoRaycastMeshes, false);
      if (hits.length > 0 && hits[0].object.userData.fumo) {
        return { fumo: hits[0].object.userData.fumo, point: hits[0].point };
      }
      return null;
    }

    function updateUIBadge(fumo, statusText) {
      if (!fumo) {
        badgeEl.classList.add('hidden');
        badgeEl.classList.remove('flex');
        return;
      }
      badgeEl.classList.remove('hidden');
      badgeEl.classList.add('flex');
      badgeDotEl.style.backgroundColor = fumo.accentColor;
      badgeNameEl.textContent = fumo.name;
      badgeStatusEl.textContent = statusText;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      recordInteraction();
      updatePointerNDC(e);
      pointerDownScreen.set(e.clientX, e.clientY);

      const hit = pickFumoUnderPointer();
      if (hit) {
        selectedFumo = hit.fumo;
        isDraggingFumo = false;
        controls.enabled = false;

        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        dragPlane.setFromNormalAndCoplanarPoint(camDir.negate(), selectedFumo.pos);

        if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
          dragOffset.subVectors(selectedFumo.pos, dragHitPoint);
        } else {
          dragOffset.set(0, 0, 0);
        }

        dragHistory = [{ pos: selectedFumo.pos.clone(), time: performance.now() }];
        updateUIBadge(selectedFumo, 'Selected');
      }
    });

    window.addEventListener('pointermove', (e) => {
      updatePointerNDC(e);

      if (selectedFumo) {
        recordInteraction();
        const moveDist = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);

        if (!isDraggingFumo && moveDist > 6) {
          isDraggingFumo = true;
          selectedFumo.isDragged = true;
          selectedFumo.isGrounded = false;
          selectedFumo.ridingRoverActive = false;
          selectedFumo.squashVel += 3.0;
          soundFX.playPickup();
          updateUIBadge(selectedFumo, '1/6g Lift — Release to Launch!');
        }

        if (isDraggingFumo) {
          raycaster.setFromCamera(pointerNDC, camera);
          if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
            const targetPos = dragHitPoint.clone().add(dragOffset);
            targetPos.x = THREE.MathUtils.clamp(targetPos.x, -10.5, 10.5);
            targetPos.y = THREE.MathUtils.clamp(targetPos.y, 0.35, 12.5);
            targetPos.z = THREE.MathUtils.clamp(targetPos.z, -10.5, 10.5);

            const prevPos = selectedFumo.pos.clone();
            selectedFumo.pos.lerp(targetPos, 0.55);

            const deltaMove = selectedFumo.pos.clone().sub(prevPos);
            selectedFumo.headRollVel -= deltaMove.x * 15.0;
            selectedFumo.headPitchVel += deltaMove.z * 15.0 - deltaMove.y * 10.0;
            selectedFumo.limbRollVel -= deltaMove.x * 20.0;
            selectedFumo.roll = THREE.MathUtils.lerp(selectedFumo.roll, THREE.MathUtils.clamp(-deltaMove.x * 1.4, -0.45, 0.45), 0.3);
            selectedFumo.pitch = THREE.MathUtils.lerp(selectedFumo.pitch, THREE.MathUtils.clamp(deltaMove.z * 1.4, -0.45, 0.45), 0.3);

            const now = performance.now();
            dragHistory.push({ pos: selectedFumo.pos.clone(), time: now });
            while (dragHistory.length > 6) dragHistory.shift();
          }
          tooltipEl.style.opacity = '0';
          renderer.domElement.style.cursor = 'grabbing';
          return;
        }
      }

      const hit = pickFumoUnderPointer();
      if (hit) {
        hoveredFumo = hit.fumo;
        renderer.domElement.style.cursor = 'grab';
        tooltipEmojiEl.textContent = hoveredFumo.emoji;
        tooltipTextEl.textContent = hoveredFumo.name;
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = `${e.clientX + 14}px`;
        tooltipEl.style.top = `${e.clientY - 18}px`;
      } else {
        hoveredFumo = null;
        renderer.domElement.style.cursor = 'default';
        tooltipEl.style.opacity = '0';
      }
    });

    window.addEventListener('pointerup', () => {
      if (!selectedFumo) return;
      controls.enabled = true;
      recordInteraction();

      if (!isDraggingFumo) {
        selectedFumo.squeeze(1.0);
        updateUIBadge(selectedFumo, 'Squeezed! ᗜˬᗜ');
      } else {
        selectedFumo.isDragged = false;
        const now = performance.now();
        while (dragHistory.length > 1 && now - dragHistory[0].time > 140) {
          dragHistory.shift();
        }
        if (dragHistory.length >= 2) {
          const first = dragHistory[0];
          const last = dragHistory[dragHistory.length - 1];
          const dtSec = Math.max(0.016, (last.time - first.time) / 1000);
          // Scale throw velocity for graceful 1/6g lunar arcs with long hangtime
          const throwVel = last.pos.clone().sub(first.pos).divideScalar(dtSec).multiplyScalar(0.58);
          throwVel.y = Math.max(throwVel.y, 2.2); // Gentle upward loft
          if (throwVel.length() > 11.5) throwVel.setLength(11.5);
          selectedFumo.vel.copy(throwVel);

          const speed = throwVel.length();
          selectedFumo.angVel.set(
            throwVel.z * 0.45 + (Math.random() - 0.5) * speed * 0.35,
            (Math.random() - 0.5) * speed * 0.4,
            -throwVel.x * 0.45 + (Math.random() - 0.5) * speed * 0.35
          );
        } else {
          selectedFumo.vel.set(0, 1.2, 0);
        }
        updateUIBadge(selectedFumo, 'Lunar Low-G Arc!');
      }

      selectedFumo = null;
      isDraggingFumo = false;
      renderer.domElement.style.cursor = hoveredFumo ? 'grab' : 'default';
    });

    // ============================================================================
    // 11. DAY / NIGHT SMOOTH INTERPOLATION (~2 SECONDS) & HUB INTEGRATION
    // ============================================================================
    const STORAGE_MODE_KEY = 'voxel_fumo_lunar_mode';
    let isNightMode = false;
    let dayNightProgress = 0.0; // 0.0 = Lunar Day, 1.0 = Lunar Night
    let dayNightTarget = 0.0;

    // Lunar sky is always black starry space, shifting from pitch-black in harsh Day to deep sapphire-black in Earthshine Night
    const daySkyColor = new THREE.Color('#04050a');
    const nightSkyColor = new THREE.Color('#020410');
    const dayFogColor = new THREE.Color('#0c1120');
    const nightFogColor = new THREE.Color('#050b24');

    const daySunColor = new THREE.Color('#ffffff');     // Harsh white lunar sunlight
    const nightEarthshineColor = new THREE.Color('#60a5fa'); // Soft blue Earthshine

    const dayHemiSky = new THREE.Color('#dbeafe');
    const nightHemiSky = new THREE.Color('#1d4ed8');
    const dayHemiGround = new THREE.Color('#1e293b');
    const nightHemiGround = new THREE.Color('#090d1f');

    function notifyParentMode() {
      const modeStr = isNightMode ? 'night' : 'day';
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'modeChanged', mode: modeStr }, '*');
        }
      } catch (e) {}
    }

    function setDayNightMode(night, { immediate = false, playSound = true } = {}) {
      isNightMode = Boolean(night);
      dayNightTarget = isNightMode ? 1.0 : 0.0;
      if (immediate) {
        dayNightProgress = dayNightTarget;
      }
      document.body.classList.toggle('night-ui', isNightMode);

      try {
        localStorage.setItem(STORAGE_MODE_KEY, isNightMode ? 'night' : 'day');
      } catch (e) {}

      if (playSound) {
        soundFX.playPickup();
      }
      notifyParentMode();
    }

    function toggleDayNight() {
      setDayNightMode(!isNightMode, { immediate: false, playSound: true });
    }

    function updateDayNightTransition(dt, elapsed) {
      if (Math.abs(dayNightProgress - dayNightTarget) > 0.0005) {
        const step = dt * 0.52; // ~2 seconds full transition
        if (dayNightProgress < dayNightTarget) {
          dayNightProgress = Math.min(dayNightTarget, dayNightProgress + step);
        } else {
          dayNightProgress = Math.max(dayNightTarget, dayNightProgress - step);
        }
      }

      const t = dayNightProgress < 0.5
        ? 4 * dayNightProgress * dayNightProgress * dayNightProgress
        : 1 - Math.pow(-2 * dayNightProgress + 2, 3) / 2;

      // 1. Sky & Horizon Fog
      scene.background.lerpColors(daySkyColor, nightSkyColor, t);
      scene.fog.color.lerpColors(dayFogColor, nightFogColor, t);
      scene.fog.density = THREE.MathUtils.lerp(0.0045, 0.0085, t);

      // 2. Harsh White Sunlight (Day) -> Soft Blue Earthshine (Night)
      sunDirLight.color.lerpColors(daySunColor, nightEarthshineColor, t);
      sunDirLight.intensity = THREE.MathUtils.lerp(1.95, 0.48, t);
      sunDirLight.shadow.radius = THREE.MathUtils.lerp(0.8, 3.2, t); // Crisp shadows in Day, soft in Night

      // 3. Hemisphere Fill
      hemiLight.color.lerpColors(dayHemiSky, nightHemiSky, t);
      hemiLight.groundColor.lerpColors(dayHemiGround, nightHemiGround, t);
      hemiLight.intensity = THREE.MathUtils.lerp(0.24, 0.42, t);

      // 4. Habitat Dome, Beacon & Rover Headlights
      domeLight.intensity = THREE.MathUtils.lerp(0.25, 1.85, t);
      beaconLight.intensity = THREE.MathUtils.lerp(0.15, 1.25, t);
      roverLight.intensity = THREE.MathUtils.lerp(0.20, 1.65, t);

      // 5. Emissive Materials, Blinking Antenna Beacons & Earth Glow
      emissiveWarmMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.35, 2.35, t);
      emissiveCyanMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.45, 2.15, t);
      domeGlassMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.04, 0.42, t);
      earthMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.32, 0.78, t);

      const blinkPulse = 0.5 + 0.5 * Math.sin(elapsed * 5.5);
      blinkBeaconMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.4, 2.8, t) * (0.35 + 0.65 * blinkPulse);

      // Starfield brightness
      starMat.opacity = THREE.MathUtils.lerp(0.55, 1.0, t);

      // 6. UnrealBloomPass Strength
      if (bloomPass) {
        bloomPass.strength = THREE.MathUtils.lerp(0.18, 0.76, t);
        bloomPass.threshold = THREE.MathUtils.lerp(0.82, 0.58, t);
      }
    }

    // UI Button & Keyboard Controls
    document.getElementById('btn-reset').addEventListener('click', () => {

    btnSound.addEventListener('click', () => {

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      const key = e.key.toLowerCase();

      if (key === 'arrowup' || key === 'w') { driveKeys.up = true; e.preventDefault(); }
      else if (key === 'arrowdown' || key === 's') { driveKeys.down = true; e.preventDefault(); }
      else if (key === 'arrowleft' || key === 'a') { driveKeys.left = true; e.preventDefault(); }
      else if (key === 'arrowright' || key === 'd') { driveKeys.right = true; e.preventDefault(); }
      else if (key === 'n') {
        e.preventDefault();
        toggleDayNight();
      } else if (key === 'r') {
        document.getElementById('btn-reset').click();
      } else if (key === ' ') {
        e.preventDefault();
        fumos.forEach((f, idx) => setTimeout(() => f.squeeze(1.05), idx * 55));
      } else if (key === 'm') {
        btnSound.click();
      }
    });

    window.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'arrowup' || key === 'w') driveKeys.up = false;
      else if (key === 'arrowdown' || key === 's') driveKeys.down = false;
      else if (key === 'arrowleft' || key === 'a') driveKeys.left = false;
      else if (key === 'arrowright' || key === 'd') driveKeys.right = false;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================================
    // 12. MAIN ANIMATION, PAUSE / RESUME & HUB MESSAGE LISTENER
    // ============================================================================
    let prevTime = performance.now();
    let isPaused = false;
    let rafId = null;

    function animate(now) {
      if (isPaused) return;
      rafId = requestAnimationFrame(animate);

      const dt = Math.min(0.033, Math.max(0.001, (now - prevTime) / 1000));
      prevTime = now;
      const elapsed = now * 0.001;

      if (!selectedFumo && !driveKeys.up && !driveKeys.down && !driveKeys.left && !driveKeys.right && (now - lastUserInteractionTime > 4500)) {
        controls.autoRotate = true;
      }

      controls.update();
      updateDayNightTransition(dt, elapsed);
      updateMochiMachine(elapsed);
      updateRover(dt, elapsed);
      updateMeteorsAndSky(elapsed, dt);
      updateBallisticLunarDust(dt);
      updatePopParticles(dt);

      for (let i = 0; i < fumos.length; i++) {
        fumos[i].updatePhysics(dt, elapsed);
      }
      resolveFumoToFumoCollisions();

      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    function pauseRenderLoop() {
      if (isPaused) return;
      isPaused = true;
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    function resumeRenderLoop() {
      if (!isPaused) return;
      isPaused = false;
      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    }

    window.addEventListener('message', (e) => {
      const data = e.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'toggleMode') {
        toggleDayNight();
      } else if (data.type === 'pause') {
        pauseRenderLoop();
      } else if (data.type === 'resume') {
        resumeRenderLoop();
      }
    });

    window.onload = function () {
      let initialNight = false;
      try {
        const saved = localStorage.getItem(STORAGE_MODE_KEY);
        if (saved === 'night') initialNight = true;
      } catch (e) {}

      setDayNightMode(initialNight, { immediate: true, playSound: false });
      updateDayNightTransition(0, 0);

      // Initial welcoming low-G bounce on all lunar fumos
      fumos.forEach((f, idx) => {
        setTimeout(() => {
          f.squash = 0.78;
          f.squashVel = 2.0;
          f.headPitchVel = 4.0;
        }, 120 + idx * 70);
      });

      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    };
  </script>
</body>
</html>

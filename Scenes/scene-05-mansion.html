<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Scarlet Tea Party — Scarlet Devil Mansion Voxel Diorama</title>
  <link rel="stylesheet" href="../Shared/fumo-scene.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Three.js r128 + OrbitControls + Post-Processing (UnrealBloomPass) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="../Shared/fumo-core.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background-color: #160912;
    }
    h1, .font-display {
      font-family: 'Fredoka', sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    .glass-panel {
      background: rgba(255, 245, 247, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 225, 0.7);
      color: #3b121e;
      box-shadow: 0 10px 28px -6px rgba(45, 10, 22, 0.25), 0 2px 6px rgba(45, 10, 22, 0.12);
      transition: background 0.5s ease, color 0.5s ease, border-color 0.5s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    body.night-ui .glass-panel {
      background: rgba(32, 14, 26, 0.82);
      border-color: rgba(225, 90, 130, 0.28);
      color: #ffe8f0;
      box-shadow: 0 10px 30px -6px rgba(0, 0, 0, 0.65), 0 0 18px rgba(225, 45, 95, 0.18);
    }
    .ui-btn {
      cursor: pointer;
    }
    .ui-btn:hover {
      transform: translateY(-2px) scale(1.03);
    }
    .ui-btn:active {
      transform: translateY(1px) scale(0.97);
    }
    #fumo-tooltip {
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    kbd {
      font-family: 'Fredoka', sans-serif;
      display: inline-block;
      padding: 1px 6px;
      font-size: 0.75rem;
      line-height: 1.2;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.08);
      border-bottom: 2px solid rgba(0, 0, 0, 0.18);
    }
    body.night-ui kbd {
      background: rgba(255, 255, 255, 0.14);
      border-bottom-color: rgba(255, 255, 255, 0.28);
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Top-Right Controls: Active Fumo Badge, Bump Table, Squeeze All, Reset, Sound (Top-Left kept completely clear for Hub) -->
  <div class="fixed top-4 right-4 z-20 flex items-center gap-2.5">
    <!-- Active / Hovered Fumo Indicator -->
    <div id="fumo-badge" class="glass-panel rounded-2xl px-3.5 py-2.5 text-xs font-semibold hidden items-center gap-2 transition-all">
      <span id="fumo-badge-dot" class="w-2.5 h-2.5 rounded-full inline-block bg-rose-500"></span>
      <span id="fumo-badge-name">Remilia Scarlet</span>
      <span id="fumo-badge-status" class="opacity-70 ml-1">Sipping Tea</span>
    </div>

    <!-- Bump Banquet Table / Sway Chandelier Button -->
    <button id="btn-bump-table" title="Bump Banquet Table & Sway Chandelier! (B)"
      class="glass-panel ui-btn rounded-2xl px-3.5 py-2.5 flex items-center gap-2 text-xs sm:text-sm font-semibold">
      <span class="text-base leading-none">🫖</span>
      <span class="hidden lg:inline">Bump Table</span>
    </button>

    <!-- Squeeze All Button -->
    <button id="btn-squeeze-all" title="Squeeze All Fumos! (Space)"
      class="glass-panel ui-btn rounded-2xl px-3.5 py-2.5 flex items-center gap-2 text-xs sm:text-sm font-semibold">
      <span class="text-base leading-none">✨</span>
      <span class="hidden md:inline">Squeeze All</span>
    </button>

    <!-- Reset Fumos & Dishes Button -->
    <button id="btn-reset" title="Restore Fumos & Shattered Teacups (R)"
      class="glass-panel ui-btn rounded-2xl px-3.5 py-2.5 flex items-center gap-2 text-xs sm:text-sm font-semibold">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      <span class="hidden sm:inline">Reset Party</span>
    </button>

    <!-- Sound Toggle Button -->
    <button id="btn-sound" title="Toggle Plush & Porcelain Sound Effects (M)"
      class="glass-panel ui-btn rounded-2xl p-2.5 flex items-center justify-center">
      <svg id="icon-sound-on" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
      <svg id="icon-sound-off" class="w-5 h-5 hidden opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
    </button>
  </div>

  <!-- Floating Cursor Tooltip for Hovered Fumo or Breakable Dish -->
  <div id="fumo-tooltip" class="fixed z-30 opacity-0 px-3 py-1.5 rounded-xl glass-panel text-xs font-semibold flex items-center gap-2 shadow-lg">
    <span id="tooltip-emoji">🦇</span>
    <span id="tooltip-text">Remilia Fumo</span>
  </div>

  <!-- Bottom Centered HUD Hints -->
  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-20 pointer-events-none w-max max-w-[94vw]">
    <div class="glass-panel rounded-2xl px-4 py-2 text-xs font-semibold flex flex-wrap items-center justify-center gap-x-4 gap-y-1 opacity-90">
      <span>🖱️ <b>Click Fumo:</b> Squeeze</span>
      <span>✋ <b>Drag & Throw:</b> Knock Dishes & Sway Chandelier</span>
      <span class="hidden sm:inline"><kbd>B</kbd> Bump Table</span>
      <span class="hidden sm:inline"><kbd>R</kbd> Reset Party</span>
      <span class="hidden md:inline"><kbd>Space</kbd> Squeeze All</span>
    </div>
  </div>

  <script>
    // ============================================================================
    // 1. PROCEDURAL WEB AUDIO SYNTHESIZER (Plush Squeaks, Bounces & Porcelain Shatter)
    // ============================================================================
    class PlushSoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playSqueeze(pitchMultiplier = 1.0) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sine';
          const baseFreq = (520 + Math.random() * 80) * pitchMultiplier;
          osc1.frequency.setValueAtTime(baseFreq, now);
          osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.48, now + 0.085);
          osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.15, now + 0.16);

          gain1.gain.setValueAtTime(0.001, now);
          gain1.gain.linearRampToValueAtTime(0.11, now + 0.025);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.17);

          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.18);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(baseFreq * 1.1, now + 0.11);
          osc2.frequency.exponentialRampToValueAtTime(baseFreq * 1.65, now + 0.21);

          gain2.gain.setValueAtTime(0.001, now + 0.11);
          gain2.gain.linearRampToValueAtTime(0.08, now + 0.13);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start(now + 0.11);
          osc2.stop(now + 0.25);
        } catch (e) {}
      }

      playBounce(intensity = 0.5) {
        if (!this.enabled || intensity < 0.08) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const vol = Math.min(0.14, intensity * 0.12);

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const startFreq = 115 + Math.min(80, intensity * 35);
          osc.frequency.setValueAtTime(startFreq, now);
          osc.frequency.exponentialRampToValueAtTime(42, now + 0.09);

          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        } catch (e) {}
      }

      playPickup() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(440, now + 0.09);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.05, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        } catch (e) {}
      }

      playShatter() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const freqs = [1480, 2120, 2790, 3420];
          freqs.forEach((f, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            const t0 = now + idx * 0.018;
            osc.frequency.setValueAtTime(f + (Math.random() - 0.5) * 180, t0);
            osc.frequency.exponentialRampToValueAtTime(f * 0.72, t0 + 0.11);
            gain.gain.setValueAtTime(0.06, t0);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.12);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t0);
            osc.stop(t0 + 0.13);
          });
        } catch (e) {}
      }
    }

    const soundFX = new PlushSoundEngine();

    // ============================================================================
    // 2. COLOR & VOXEL HELPER UTILITIES
    // ============================================================================
    const tempColor = new THREE.Color();
    const tempMatrix = new THREE.Matrix4();
    const tempPos = new THREE.Vector3();
    const tempQuat = new THREE.Quaternion();
    const tempScale = new THREE.Vector3();

    function voxelHash(x, y, z) {
      let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
      return n - Math.floor(n);
    }

    function varyColor(hexOrString, x, y, z, variance = 0.035, seamDarken = 0) {
      tempColor.set(hexOrString);
      const h = voxelHash(x, y, z);
      const delta = (h - 0.5) * 2 * variance - seamDarken;
      tempColor.offsetHSL(0, (h - 0.5) * 0.03, delta);
      return tempColor.clone();
    }

    function createSoftVoxelGeometry(size = 1) {
      const s = size * 0.985;
      return new THREE.BoxGeometry(s, s, s);
    }

    function buildVoxelInstancedMesh(voxels, unitSize, material, castShadow = true, receiveShadow = true) {
      if (!voxels || voxels.length === 0) return null;
      const geom = createSoftVoxelGeometry(unitSize);
      const mesh = new THREE.InstancedMesh(geom, material, voxels.length);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = receiveShadow;

      for (let i = 0; i < voxels.length; i++) {
        const v = voxels[i];
        tempPos.set(v.x * unitSize, v.y * unitSize, v.z * unitSize);
        tempQuat.identity();
        tempScale.set(v.sx || 1, v.sy || 1, v.sz || 1);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        mesh.setMatrixAt(i, tempMatrix);
        mesh.setColorAt(i, v.color instanceof THREE.Color ? v.color : new THREE.Color(v.color));
      }
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      return mesh;
    }

    // ============================================================================
    // 3. SCENE, CAMERA, RENDERER & POST-PROCESSING SETUP
    // ============================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#4a1c2a');
    scene.fog = new THREE.FogExp2('#4a1c2a', 0.0085);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.5, 135);
    camera.position.set(18.5, 13.8, 19.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(getOptimalPixelRatio());
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    let composer = null;
    let bloomPass = null;
    try {
      const renderPass = new THREE.RenderPass(scene, camera);
      bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.24,
        0.55,
        0.78
      );
      composer = new THREE.EffectComposer(renderer);
      composer.addPass(renderPass);
      composer.addPass(bloomPass);
    } catch (err) {
      composer = null;
    }

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0.0, 4.2, -0.5);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.minPolarAngle = Math.PI * 0.08;
    controls.minDistance = 8.5;
    controls.maxDistance = 42;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 0.42;

    let lastUserInteractionTime = performance.now();
    const recordInteraction = () => {
      lastUserInteractionTime = performance.now();
      controls.autoRotate = false;
    };
    controls.addEventListener('start', recordInteraction);

    // ============================================================================
    // 4. LIGHTING SETUP (Capped Dynamic Lights; Emissive + Bloom for Candles)
    // ============================================================================
    const hemiLight = new THREE.HemisphereLight(0xffd6e0, 0x4a1c28, 0.65);
    hemiLight.position.set(0, 22, 0);
    scene.add(hemiLight);

    const windowDirLight = new THREE.DirectionalLight(0xffb5a7, 1.35);
    windowDirLight.position.set(-19, 15, 1);
    windowDirLight.target.position.set(1, 2.5, 0);
    scene.add(windowDirLight.target);
    windowDirLight.castShadow = true;
    windowDirLight.shadow.mapSize.width = 2048;
    windowDirLight.shadow.mapSize.height = 2048;
    windowDirLight.shadow.camera.near = 2;
    windowDirLight.shadow.camera.far = 45;
    const dCam = 15.0;
    windowDirLight.shadow.camera.left = -dCam;
    windowDirLight.shadow.camera.right = dCam;
    windowDirLight.shadow.camera.top = dCam;
    windowDirLight.shadow.camera.bottom = -dCam;
    windowDirLight.shadow.bias = -0.0006;
    windowDirLight.shadow.radius = 2.5;
    scene.add(windowDirLight);

    const chandelierLight = new THREE.PointLight(0xffb74d, 0.3, 24, 1.5);
    chandelierLight.position.set(0.0, 9.2, 0.5);
    chandelierLight.castShadow = true;
    chandelierLight.shadow.mapSize.width = 1024;
    chandelierLight.shadow.mapSize.height = 1024;
    chandelierLight.shadow.bias = -0.001;
    scene.add(chandelierLight);

    const tableCandleLight = new THREE.PointLight(0xff9e3d, 0.25, 13, 1.6);
    tableCandleLight.position.set(0.0, 4.4, 0.5);
    scene.add(tableCandleLight);

    const fireplaceLight = new THREE.PointLight(0xff6b2b, 0.6, 14, 1.6);
    fireplaceLight.position.set(8.2, 2.2, -5.5);
    scene.add(fireplaceLight);

    // Shared Materials
    const plushMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.92,
      metalness: 0.02
    });

    const roomSolidMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.80,
      metalness: 0.06
    });

    const glossyPropMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.22,
      metalness: 0.18
    });

    const goldMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.26,
      metalness: 0.65
    });

    const translucentGlassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.82,
      roughness: 0.14,
      metalness: 0.05,
      transmission: 0.38,
      emissive: new THREE.Color(0xff4d6d),
      emissiveIntensity: 0.35
    });

    const crystalWingMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.18,
      metalness: 0.12,
      emissive: new THREE.Color(0xffffff),
      emissiveIntensity: 0.45
    });

    const warmCandleEmissiveMat = new THREE.MeshStandardMaterial({
      color: 0xfff3d1,
      emissive: new THREE.Color(0xff9f1c),
      emissiveIntensity: 1.2,
      roughness: 0.2
    });

    const translucentIceMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.85,
      roughness: 0.15,
      metalness: 0.05,
      transmission: 0.35,
      emissive: new THREE.Color(0x38bdf8),
      emissiveIntensity: 0.28
    });

    // ============================================================================
    // 5. SCARLET DEVIL MANSION GRAND HALL ARCHITECTURE, FURNITURE & PROPS
    // ============================================================================
    const RV = 0.25; // 1 Room Voxel = 0.25 world units
    const furnitureColliders = [];

    function addCollider(minX, minY, minZ, maxX, maxY, maxZ, name = 'prop') {
      furnitureColliders.push({
        min: new THREE.Vector3(minX, minY, minZ),
        max: new THREE.Vector3(maxX, maxY, maxZ),
        name
      });
    }

    const solidRoomVoxels = [];
    const glossyRoomVoxels = [];
    const goldRoomVoxels = [];
    const glassRoomVoxels = [];
    const candleGlowVoxels = [];

    function pushVoxel(list, rx, ry, rz, colorHex, variance = 0.03, sx = 1, sy = 1, sz = 1) {
      list.push({
        x: rx,
        y: ry,
        z: rz,
        color: varyColor(colorHex, rx, ry, rz, variance),
        sx, sy, sz
      });
    }

    function pushBoxVoxels(list, x0, y0, z0, x1, y1, z1, colorFnOrHex, variance = 0.03) {
      for (let x = x0; x <= x1; x++) {
        for (let y = y0; y <= y1; y++) {
          for (let z = z0; z <= z1; z++) {
            if (x > x0 && x < x1 && y > y0 && y < y1 && z > z0 && z < z1) continue;
            const c = typeof colorFnOrHex === 'function' ? colorFnOrHex(x, y, z) : colorFnOrHex;
            if (c) pushVoxel(list, x, y, z, c, variance);
          }
        }
      }
    }

    // ----------------------------------------------------------------------------
    // 5A. FLOOR, DEEP CRIMSON CARPETS WITH GOLD TRIM, ARCHED WINDOWS & PILLARS
    // ----------------------------------------------------------------------------
    function buildMansionHall() {
      for (let x = -44; x <= 43; x++) {
        for (let z = -44; z <= 43; z++) {
          const isEdge = (x === 43 || z === 43 || x === -44 || z === -44);
          const tileX = Math.floor((x + 44) / 4);
          const tileZ = Math.floor((z + 44) / 4);
          const isChecker = (tileX + tileZ) % 2 === 0;
          const floorCol = isChecker ? '#382229' : '#2c1920';
          pushVoxel(solidRoomVoxels, x + 0.5, -0.5, z + 0.5, floorCol, 0.02);
          if (isEdge) {
            pushVoxel(solidRoomVoxels, x + 0.5, -1.5, z + 0.5, '#1f1016', 0.015);
          }
        }
      }

      // Deep Crimson Grand Hall Carpet with Gold Trim (rx -22..22, rz -36..38)
      for (let x = -22; x <= 22; x++) {
        for (let z = -36; z <= 38; z++) {
          const ax = Math.abs(x);
          const isOuterBorder = (ax === 22 || z === 38 || z === -36);
          const isGoldTrim = (ax === 20 || ax === 21 || z === 36 || z === 37 || z === -35);
          const isInnerMedallion = ((Math.abs(x) + Math.abs(z % 12)) === 5 && ax < 14);
          let rugCol = '#8a1224';
          let targetList = solidRoomVoxels;
          if (isOuterBorder) {
            rugCol = '#590a16';
          } else if (isGoldTrim || isInnerMedallion) {
            rugCol = '#e0ac43';
            targetList = goldRoomVoxels;
          } else if (ax < 10 && ((x + z) % 6 === 0)) {
            rugCol = '#9e192d';
          }
          pushVoxel(targetList, x + 0.5, 0.25, z + 0.5, rugCol, 0.025, 1, 0.5, 1);
        }
      }

      // Left Wall with Two Tall Arched Stained-Glass Windows
      const isInsideArchedWindow = (z, y) => {
        for (const zCenter of [-18, 14]) {
          const dz = z - zCenter;
          if (Math.abs(dz) <= 7) {
            if (y >= 10 && y <= 35) return { hit: true, dz, y, zCenter };
            if (y > 35 && y <= 43) {
              const dy = y - 35;
              if (dz * dz + dy * dy <= 52) return { hit: true, dz, y, zCenter };
            }
          }
        }
        return { hit: false };
      };

      for (let y = 0; y <= 51; y++) {
        for (let z = -44; z <= 43; z++) {
          const winCheck = isInsideArchedWindow(z, y);
          if (winCheck.hit) {
            const { dz } = winCheck;
            const isLeadBar = (dz === 0 || Math.abs(dz) === 4 || y === 18 || y === 27 || y === 35);
            if (isLeadBar) {
              pushVoxel(solidRoomVoxels, -43.3, y + 0.5, z + 0.5, '#1f161d', 0.01, 0.6, 1, 1);
            } else if ((y + z) % 2 === 0) {
              const dy = y - 35;
              const r = Math.hypot(dz, dy);
              let paneCol = '#ff4d6d';
              if (y > 35 && r < 4.2) paneCol = '#ffd166';
              else if (Math.abs(dz) > 4) paneCol = '#9d4edd';
              else if (((Math.floor(y / 4) + Math.floor(z / 4)) % 2) === 0) paneCol = '#e63946';
              else paneCol = '#ff9ebb';
              pushVoxel(glassRoomVoxels, -43.5, y + 0.5, z + 0.5, paneCol, 0.015, 0.35, 1, 1);
            }
            continue;
          }

          let wallCol = '#7a1c2e';
          if (y <= 3) wallCol = '#3b2119';
          else if (y <= 13) wallCol = (z % 4 === 0) ? '#4d2b20' : '#5e3528';
          else if (y === 14) wallCol = '#c99b3b';
          else if (y >= 49) wallCol = '#4d2b20';
          else if (((z + y) % 6 === 0) && ((z - y) % 6 === 0)) wallCol = '#8f2236';

          pushVoxel(solidRoomVoxels, -43.5, y + 0.5, z + 0.5, wallCol, 0.02);
        }
      }

      // Back Wall
      for (let y = 0; y <= 51; y++) {
        for (let x = -43; x <= 43; x++) {
          let wallCol = '#7a1c2e';
          if (y <= 3) wallCol = '#3b2119';
          else if (y <= 13) wallCol = (x % 4 === 0) ? '#4d2b20' : '#5e3528';
          else if (y === 14) wallCol = '#c99b3b';
          else if (y >= 49) wallCol = '#4d2b20';
          else if (((x + y) % 6 === 0) && ((x - y) % 6 === 0)) wallCol = '#8f2236';

          pushVoxel(solidRoomVoxels, x + 0.5, y + 0.5, -43.5, wallCol, 0.02);
        }
      }

      // Fluted Marble Pillars along Left & Back Walls
      const pillarCoords = [
        [-40, -34], [-40, -2], [-40, 30],
        [-28, -40], [28, -40]
      ];
      pillarCoords.forEach(([px, pz]) => {
        pushBoxVoxels(glossyRoomVoxels, px - 2, 0, pz - 2, px + 2, 4, pz + 2, '#d8d2cb');
        pushBoxVoxels(goldRoomVoxels, px - 2, 4, pz - 2, px + 2, 4, pz + 2, '#d4a359');
        for (let y = 5; y <= 45; y++) {
          for (let dx = -1; dx <= 1; dx++) {
            for (let dz = -1; dz <= 1; dz++) {
              const col = (dx === 0 || dz === 0) ? '#ebe6e0' : '#cfc8c0';
              pushVoxel(glossyRoomVoxels, px + dx + 0.5, y + 0.5, pz + dz + 0.5, col, 0.015);
            }
          }
        }
        pushBoxVoxels(goldRoomVoxels, px - 2, 46, pz - 2, px + 2, 47, pz + 2, '#d4a359');
        pushBoxVoxels(glossyRoomVoxels, px - 2, 48, pz - 2, px + 2, 49, pz + 2, '#ebe6e0');
        addCollider((px - 2) * RV, 0, (pz - 2) * RV, (px + 3) * RV, 12.0, (pz + 3) * RV, 'marble_pillar');
      });
    }

    // ----------------------------------------------------------------------------
    // 5B. GRAND STAIRCASE (Back Center: rx -16..16, rz -42..-22)
    // ----------------------------------------------------------------------------
    function buildGrandStaircase() {
      for (let step = 0; step < 12; step++) {
        const z0 = -22 - step;
        const yTop = step + 1;
        for (let x = -11; x <= 11; x++) {
          for (let y = 0; y <= yTop; y++) {
            if (y < yTop - 1 && x > -11 && x < 11) continue;
            const ax = Math.abs(x);
            let col = '#e5dcd3';
            let target = glossyRoomVoxels;
            if (ax <= 6) {
              col = (ax === 6) ? '#e0ac43' : '#9e1428';
              target = (ax === 6) ? goldRoomVoxels : solidRoomVoxels;
            }
            pushVoxel(target, x + 0.5, y + 0.5, z0 + 0.5, col, 0.02);
          }
        }
        for (const sideX of [-11, 11]) {
          if (step % 2 === 0) {
            for (let by = yTop + 1; by <= yTop + 4; by++) {
              pushVoxel(goldRoomVoxels, sideX + 0.5, by + 0.5, z0 + 0.5, '#d4a359', 0.02, 0.7, 1, 0.7);
            }
          }
          pushVoxel(solidRoomVoxels, sideX + 0.5, yTop + 5.2, z0 + 0.5, '#592e1e', 0.02, 1.1, 0.8, 1.2);
        }
      }

      pushBoxVoxels(glossyRoomVoxels, -18, 0, -42, 18, 13, -34, (x, y, z) => {
        if (y === 13) {
          if (Math.abs(x) <= 14 && z >= -40 && z <= -35) return '#8a1224';
          return '#e5dcd3';
        }
        return '#4a2a1e';
      });
      for (let x = -18; x <= 18; x++) {
        if (Math.abs(x) <= 10) continue;
        if (x % 2 === 0) {
          for (let by = 14; by <= 17; by++) {
            pushVoxel(goldRoomVoxels, x + 0.5, by + 0.5, -34.5, '#d4a359', 0.02, 0.7, 1, 0.7);
          }
        }
        pushVoxel(solidRoomVoxels, x + 0.5, 18.2, -34.5, '#592e1e', 0.02);
      }

      addCollider(-2.9, 0.0, -8.5, 2.9, 1.75, -5.5, 'stairs_lower');
      addCollider(-4.5, 0.0, -10.6, 4.5, 3.5, -8.5, 'stairs_landing');
    }

    // ----------------------------------------------------------------------------
    // 5C. GRANDFATHER CLOCK, GOTHIC BOOKSHELVES & ROARING FIREPLACE
    // ----------------------------------------------------------------------------
    let clockPendulumPivot = null;
    const fireEmberVoxels = [];
    let fireEmberMesh = null;

    function buildClockBookshelvesAndFireplace() {
      // 1. GRANDFATHER CLOCK
      pushBoxVoxels(solidRoomVoxels, -36, 0, -42, -31, 5, -37, '#422114');
      for (let y = 6; y <= 21; y++) {
        for (let x = -35; x <= -32; x++) {
          for (let z = -41; z <= -38; z++) {
            if (z === -38 && (x === -34 || x === -33)) continue;
            if (x > -35 && x < -32 && z > -41 && z < -38) continue;
            pushVoxel(solidRoomVoxels, x + 0.5, y + 0.5, z + 0.5, '#542a19', 0.02);
          }
        }
      }
      pushBoxVoxels(solidRoomVoxels, -36, 22, -42, -31, 30, -37, (x, y, z) => {
        if (z === -37 && x >= -35 && x <= -32 && y >= 24 && y <= 28) {
          if ((x === -34 && y >= 26 && y <= 28) || (y === 26 && x === -33)) return '#1e1b24';
          return '#fffdf5';
        }
        return '#422114';
      });
      pushVoxel(goldRoomVoxels, -35.5, 31.5, -37.5, '#e0ac43');
      pushVoxel(goldRoomVoxels, -31.5, 31.5, -37.5, '#e0ac43');
      pushVoxel(goldRoomVoxels, -33.5, 32.2, -39.5, '#e0ac43', 0.02, 1.2, 1.8, 1.2);
      addCollider(-9.1, 0, -10.6, -7.6, 8.0, -9.1, 'grandfather_clock');

      clockPendulumPivot = new THREE.Group();
      clockPendulumPivot.position.set(-33.5 * RV, 20.5 * RV, -39.0 * RV);
      const pendVoxels = [];
      for (let py = -10; py <= 0; py++) {
        pendVoxels.push({ x: 0, y: py, z: 0, color: new THREE.Color('#e0ac43'), sx: 0.45, sy: 1, sz: 0.35 });
      }
      for (let bx = -1; bx <= 1; bx++) {
        for (let by = -12; by <= -10; by++) {
          pendVoxels.push({ x: bx * 0.7, y: by, z: 0.1, color: new THREE.Color('#ffd166'), sx: 0.9, sy: 0.9, sz: 0.6 });
        }
      }
      const pendMesh = buildVoxelInstancedMesh(pendVoxels, RV, goldMaterial, false, false);
      clockPendulumPivot.add(pendMesh);
      scene.add(clockPendulumPivot);

      // 2. TALL GOTHIC BOOKSHELVES
      pushBoxVoxels(solidRoomVoxels, 20, 0, -42, 36, 34, -37, (x, y, z) => {
        const isShelf = (y % 6 === 0) || x === 20 || x === 28 || x === 36 || z === -42;
        if (isShelf) return '#422114';
        if (z === -37) return null;
        return '#2b150c';
      });
      const bookPalette = ['#9d0208', '#3a0ca3', '#2d6a4f', '#b5179e', '#e09f3e', '#1d3557', '#7209b7'];
      for (let shelfY of [1, 7, 13, 19, 25]) {
        for (let x = 21; x <= 35; x++) {
          if (x === 28) continue;
          if ((x + shelfY) % 7 === 0) continue;
          const bCol = bookPalette[(x * 3 + shelfY) % bookPalette.length];
          const bHeight = 3 + ((x + shelfY) % 2);
          for (let by = 0; by < bHeight; by++) {
            pushVoxel(solidRoomVoxels, x + 0.5, shelfY + by + 0.5, -38.0, bCol, 0.03, 0.88, 0.95, 1.4);
          }
        }
      }
      addCollider(5.0, 0, -10.6, 9.1, 8.6, -9.1, 'bookshelves');

      // 3. ROARING GOTHIC FIREPLACE
      pushBoxVoxels(solidRoomVoxels, 31, 0, -28, 41, 20, -12, (x, y, z) => {
        if (x <= 36 && z >= -24 && z <= -16 && y >= 1 && y <= 11) return null;
        if (y === 19 || y === 20 || y === 13) return '#d8d2cb';
        if (x === 31 && (z === -26 || z === -14)) return '#cfc8c0';
        return '#4a3b40';
      }, 0.025);
      pushBoxVoxels(solidRoomVoxels, 33, 21, -25, 41, 46, -15, (x, y, z) => {
        if (x === 33 && y >= 25 && y <= 37 && z >= -23 && z <= -17) {
          if (y === 25 || y === 37 || z === -23 || z === -17) return '#e0ac43';
          const dy = y - 31;
          const dz = z + 20;
          if (dy * dy + dz * dz <= 5) return '#ff4d6d';
          return '#240b15';
        }
        return '#3d2f34';
      });
      pushBoxVoxels(solidRoomVoxels, 34, 1, -23, 36, 2, -17, '#261712');
      for (let fx = 33; fx <= 36; fx++) {
        for (let fz = -23; fz <= -17; fz++) {
          for (let fy = 2; fy <= 7; fy++) {
            if (Math.abs(fz + 20) + (fy - 2) > 5) continue;
            fireEmberVoxels.push({
              baseX: fx + 0.5,
              baseY: fy + 0.5,
              baseZ: fz + 0.5,
              phase: fx * 1.3 + fz * 2.1 + fy * 0.8,
              color: varyColor(fy > 4 ? '#ffd166' : '#ff5400', fx, fy, fz, 0.04)
            });
          }
        }
      }
      fireEmberMesh = buildVoxelInstancedMesh(
        fireEmberVoxels.map(f => ({ x: f.baseX, y: f.baseY, z: f.baseZ, color: f.color })),
        RV,
        warmCandleEmissiveMat,
        false,
        false
      );
      scene.add(fireEmberMesh);

      addCollider(7.7, 0, -7.0, 10.3, 5.2, -3.0, 'fireplace');
    }

    // ----------------------------------------------------------------------------
    // 5D. LONG BANQUET TABLE, LUXURY CHAIRS, TIERED CAKE STAND & TEA PROPS
    // ----------------------------------------------------------------------------
    function buildBanquetTableAndProps() {
      const legCorners = [[-9, -16], [7, -16], [-9, 2], [7, 2], [-9, 19], [7, 19]];
      legCorners.forEach(([lx, lz]) => {
        pushBoxVoxels(solidRoomVoxels, lx, 0, lz, lx + 1, 10, lz + 1, '#4a2518');
        pushBoxVoxels(goldRoomVoxels, lx, 1, lz, lx + 1, 2, lz + 1, '#d4a359');
      });

      for (let x = -10; x <= 9; x++) {
        for (let z = -18; z <= 21; z++) {
          const isEdgeX = (x === -10 || x === 9);
          const isEdgeZ = (z === -18 || z === 21);
          const isRunner = (x >= -3 && x <= 2);
          let topCol = '#fcf8f5';
          if (isRunner) topCol = (Math.abs(x + 0.5) > 2.2) ? '#e0ac43' : '#9e1428';
          pushVoxel(solidRoomVoxels, x + 0.5, 13.5, z + 0.5, topCol, 0.02);

          if (isEdgeX || isEdgeZ) {
            pushVoxel(solidRoomVoxels, x + 0.5, 12.5, z + 0.5, isRunner ? '#9e1428' : '#f4ece6', 0.02);
            if ((x + z) % 2 === 0) {
              pushVoxel(solidRoomVoxels, x + 0.5, 11.6, z + 0.5, '#e0ac43', 0.02, 1, 0.8, 1);
            }
          }
        }
      }
      addCollider(-2.5, 2.7, -4.5, 2.5, 3.5, 5.5, 'banquet_table');

      // 1. Remilia's Grand Throne at Head of Table
      pushBoxVoxels(solidRoomVoxels, -4, 0, -24, 3, 8, -20, (x, y) => (y === 8 ? '#9e1428' : '#422014'));
      pushBoxVoxels(solidRoomVoxels, -4, 9, -24, 3, 24, -23, (x, y) => {
        if (x === -4 || x === 3 || y === 24) return '#e0ac43';
        return '#8a1224';
      });
      addCollider(-1.0, 0, -6.0, 1.0, 2.25, -4.9, 'remilia_throne');

      // 2. Side Chairs
      const sideChairs = [
        { x0: -15, x1: -11, z0: -8, z1: -4, backX: -15 },
        { x0: -15, x1: -11, z0: 8,  z1: 12, backX: -15 },
        { x0: 10,  x1: 14,  z0: 6,  z1: 10, backX: 14 }
      ];
      sideChairs.forEach((ch) => {
        pushBoxVoxels(solidRoomVoxels, ch.x0, 0, ch.z0, ch.x1, 8, ch.z1, (x, y) => (y === 8 ? '#9e1428' : '#4a2518'));
        pushBoxVoxels(solidRoomVoxels, ch.backX, 9, ch.z0, ch.backX, 18, ch.z1, (x, y, z) => {
          if (z === ch.z0 || z === ch.z1 || y === 18) return '#d4a359';
          return '#8a1224';
        });
        addCollider(ch.x0 * RV, 0, ch.z0 * RV, (ch.x1 + 1) * RV, 2.25, (ch.z1 + 1) * RV, 'dining_chair');
      });

      // Three-Tiered Silver & Gold Cake Stand
      for (let y = 14; y <= 22; y++) {
        pushVoxel(goldRoomVoxels, -0.5, y + 0.5, -2.5, '#e0ac43', 0.01, 0.7, 1, 0.7);
      }
      const tiers = [
        { y: 15, r: 3.2 },
        { y: 18, r: 2.4 },
        { y: 21, r: 1.6 }
      ];
      tiers.forEach(({ y, r }) => {
        for (let dx = -3; dx <= 3; dx++) {
          for (let dz = -3; dz <= 3; dz++) {
            const dist = Math.hypot(dx, dz);
            if (dist <= r) {
              pushVoxel(glossyRoomVoxels, -0.5 + dx, y + 0.2, -2.5 + dz, '#f8fafc', 0.01, 1, 0.45, 1);
              if (dist > 0.8 && dist <= r - 0.5 && ((dx + dz) % 2 === 0)) {
                const cakeCol = ((dx * dz) % 2 === 0) ? '#ff8fa3' : '#fde047';
                pushVoxel(solidRoomVoxels, -0.5 + dx, y + 0.8, -2.5 + dz, cakeCol, 0.02, 0.8, 0.8, 0.8);
                pushVoxel(solidRoomVoxels, -0.5 + dx, y + 1.3, -2.5 + dz, '#e63946', 0.01, 0.4, 0.4, 0.4);
              }
            }
          }
        }
      });

      // Twin Golden Candelabras
      for (const cz of [-10, 8]) {
        pushBoxVoxels(goldRoomVoxels, -1, 14, cz - 1, 0, 14, cz, '#e0ac43');
        for (let y = 15; y <= 18; y++) {
          pushVoxel(goldRoomVoxels, -0.5, y + 0.5, cz - 0.5, '#e0ac43', 0.02, 0.65, 1, 0.65);
        }
        for (let bx = -2; bx <= 2; bx++) {
          pushVoxel(goldRoomVoxels, -0.5 + bx, 18.2, cz - 0.5, '#e0ac43', 0.02, 1, 0.5, 0.6);
          if (Math.abs(bx) === 2 || bx === 0) {
            pushVoxel(solidRoomVoxels, -0.5 + bx, 19.2, cz - 0.5, '#fffdf7', 0.01, 0.55, 1.6, 0.55);
            pushVoxel(candleGlowVoxels, -0.5 + bx, 20.5, cz - 0.5, '#ffbe0b', 0.02, 0.45, 0.95, 0.45);
          }
        }
      }

      // Remilia's Crystal Wine Glass of Scarlet Tomato Juice
      pushVoxel(glassRoomVoxels, 2.5, 14.2, -14.5, '#e2e8f0', 0.01, 1.1, 0.35, 1.1);
      pushVoxel(glassRoomVoxels, 2.5, 15.0, -14.5, '#e2e8f0', 0.01, 0.35, 1.3, 0.35);
      pushVoxel(glassRoomVoxels, 2.5, 16.0, -14.5, '#e63946', 0.01, 1.15, 1.2, 1.15);

      // Bowl of White & Pink Sugar Cubes
      pushBoxVoxels(glossyRoomVoxels, -5, 14, -6, -4, 14, -5, '#e2e8f0');
      pushVoxel(solidRoomVoxels, -4.7, 14.8, -5.7, '#ffffff', 0.01, 0.55, 0.55, 0.55);
      pushVoxel(solidRoomVoxels, -4.2, 14.8, -5.3, '#ffc2d1', 0.01, 0.55, 0.55, 0.55);
      pushVoxel(solidRoomVoxels, -4.5, 15.3, -5.5, '#ffffff', 0.01, 0.55, 0.55, 0.55);

      // Platter of Golden Scones with Clotted Cream & Jam
      for (let x = 3; x <= 5; x++) {
        for (let z = 1; z <= 3; z++) {
          pushVoxel(glossyRoomVoxels, x + 0.5, 14.2, z + 0.5, '#f8fafc', 0.01, 1, 0.4, 1);
        }
      }
      for (const [sx, sz] of [[3.6, 1.6], [4.6, 1.8], [4.1, 2.7]]) {
        pushVoxel(solidRoomVoxels, sx, 14.7, sz, '#e09f3e', 0.02, 0.85, 0.65, 0.85);
        pushVoxel(solidRoomVoxels, sx, 15.1, sz, '#fffdf7', 0.01, 0.65, 0.3, 0.65);
        pushVoxel(solidRoomVoxels, sx, 15.3, sz, '#d90429', 0.01, 0.45, 0.25, 0.45);
      }

      // Neat Stack of Porcelain Saucers
      for (let s = 0; s < 5; s++) {
        const col = (s % 2 === 0) ? '#ffffff' : '#bae6fd';
        pushVoxel(glossyRoomVoxels, -5.5, 14.2 + s * 0.45, 2.5, col, 0.01, 1.8, 0.38, 1.8);
      }

      // Patchouli's Stack of Open Grimoires on Table
      pushBoxVoxels(solidRoomVoxels, -8, 14, 8, -5, 15, 11, (x, y) => (y === 15 && x > -8 && x < -5 ? '#fffdf0' : '#5a189a'));

      // GIANT DECORATIVE PORCELAIN TEAPOT at Foot of Table (for Mini Cirno Fumo!)
      for (let x = -3; x <= 2; x++) {
        for (let z = 12; z <= 17; z++) {
          const dx = x + 0.5;
          const dz = z - 14.5;
          const r = Math.hypot(dx, dz);
          if (r <= 3.1) {
            pushVoxel(glossyRoomVoxels, x + 0.5, 14.3, z + 0.5, '#f8fafc', 0.01, 1, 0.6, 1);
            if (r >= 1.9) {
              for (let y = 15; y <= 18; y++) {
                const isGoldRim = (y === 18 || y === 15);
                const list = isGoldRim ? goldRoomVoxels : glossyRoomVoxels;
                const col = isGoldRim ? '#e0ac43' : ((y === 16 && (x + z) % 2 === 0) ? '#3b82f6' : '#ffffff');
                pushVoxel(list, x + 0.5, y + 0.5, z + 0.5, col, 0.01);
              }
            }
          }
        }
      }
      for (let i = 0; i < 3; i++) {
        pushVoxel(glossyRoomVoxels, -0.5, 16.0 + i * 0.8, 18.0 + i * 0.6, '#ffffff', 0.01, 1.1, 0.9, 1.1);
        pushVoxel(goldRoomVoxels, -0.5, 15.5 + i * 0.9, 11.2 - (i === 1 ? 0.5 : 0), '#e0ac43', 0.01, 0.8, 0.9, 0.8);
      }
    }

    buildMansionHall();
    buildGrandStaircase();
    buildClockBookshelvesAndFireplace();
    buildBanquetTableAndProps();

    const roomGroup = new THREE.Group();
    scene.add(roomGroup);

    const solidMesh = buildVoxelInstancedMesh(solidRoomVoxels, RV, roomSolidMaterial, true, true);
    const glossyMesh = buildVoxelInstancedMesh(glossyRoomVoxels, RV, glossyPropMaterial, true, true);
    const goldMesh = buildVoxelInstancedMesh(goldRoomVoxels, RV, goldMaterial, true, true);
    const glassMesh = buildVoxelInstancedMesh(glassRoomVoxels, RV, translucentGlassMaterial, false, true);
    const candleGlowMesh = buildVoxelInstancedMesh(candleGlowVoxels, RV, warmCandleEmissiveMat, false, false);

    if (solidMesh) roomGroup.add(solidMesh);
    if (glossyMesh) roomGroup.add(glossyMesh);
    if (goldMesh) roomGroup.add(goldMesh);
    if (glassMesh) roomGroup.add(glassMesh);
    if (candleGlowMesh) roomGroup.add(candleGlowMesh);

    // ============================================================================
    // 6. SWAYING CRYSTAL CHANDELIER, POURING TEA STREAM, BATS & BREAKABLE DISHES
    // ============================================================================
    const chandelierPivot = new THREE.Group();
    chandelierPivot.position.set(0.0, 13.0, 0.5);
    scene.add(chandelierPivot);

    const chandelierState = {
      angleX: 0,
      angleZ: 0,
      velX: 0,
      velZ: 0
    };

    function buildChandelier() {
      const chGold = [];
      const chCrystal = [];
      const chCandles = [];

      for (let y = 0; y >= -14; y--) {
        chGold.push({ x: 0, y, z: 0, color: new THREE.Color('#e0ac43'), sx: 0.65, sy: 0.95, sz: 0.65 });
      }
      const tiers = [
        { y: -11, r: 5.5, candles: 6 },
        { y: -14, r: 9.0, candles: 8 }
      ];
      tiers.forEach(({ y, r, candles }) => {
        for (let deg = 0; deg < 360; deg += 10) {
          const rad = (deg * Math.PI) / 180;
          const cx = Math.cos(rad) * r;
          const cz = Math.sin(rad) * r;
          chGold.push({ x: cx, y, z: cz, color: new THREE.Color('#e0ac43'), sx: 0.9, sy: 0.7, sz: 0.9 });
          if (deg % 20 === 0) {
            chCrystal.push({ x: cx, y: y - 1.1, z: cz, color: new THREE.Color('#fff0f3'), sx: 0.55, sy: 1.2, sz: 0.55 });
            chCrystal.push({ x: cx * 0.85, y: y - 2.1, z: cz * 0.85, color: new THREE.Color('#ffc2d1'), sx: 0.45, sy: 1.0, sz: 0.45 });
          }
        }
        for (let c = 0; c < candles; c++) {
          const ang = (c / candles) * Math.PI * 2;
          for (let sr = 1; sr < r; sr += 1.2) {
            chGold.push({ x: Math.cos(ang) * sr, y, z: Math.sin(ang) * sr, color: new THREE.Color('#d4a359'), sx: 0.5, sy: 0.4, sz: 0.5 });
          }
          const kx = Math.cos(ang) * r;
          const kz = Math.sin(ang) * r;
          chCandles.push({ x: kx, y: y + 1.1, z: kz, color: new THREE.Color('#fffdf7'), sx: 0.6, sy: 1.4, sz: 0.6 });
          chCandles.push({ x: kx, y: y + 2.2, z: kz, color: new THREE.Color('#ffbe0b'), sx: 0.48, sy: 0.9, sz: 0.48 });
        }
      });

      const mGold = buildVoxelInstancedMesh(chGold, RV, goldMaterial, true, false);
      const mCrys = buildVoxelInstancedMesh(chCrystal, RV, crystalWingMaterial, false, false);
      const mCand = buildVoxelInstancedMesh(chCandles, RV, warmCandleEmissiveMat, false, false);
      if (mGold) chandelierPivot.add(mGold);
      if (mCrys) chandelierPivot.add(mCrys);
      if (mCand) chandelierPivot.add(mCand);
    }
    buildChandelier();

    function bumpChandelier(vx = 0.45, vz = 0.35) {
      chandelierState.velX += vx;
      chandelierState.velZ += vz;
    }

    function updateChandelier(dt, time) {
      const stiff = 6.5;
      const damp = 1.1;
      const windX = Math.sin(time * 1.1) * 0.04;
      const windZ = Math.cos(time * 0.9) * 0.04;
      chandelierState.velX += ((windX - chandelierState.angleX) * stiff - chandelierState.velX * damp) * dt;
      chandelierState.velZ += ((windZ - chandelierState.angleZ) * stiff - chandelierState.velZ * damp) * dt;
      chandelierState.angleX = THREE.MathUtils.clamp(chandelierState.angleX + chandelierState.velX * dt, -0.35, 0.35);
      chandelierState.angleZ = THREE.MathUtils.clamp(chandelierState.angleZ + chandelierState.velZ * dt, -0.35, 0.35);

      chandelierPivot.rotation.x = chandelierState.angleX;
      chandelierPivot.rotation.z = chandelierState.angleZ;

      chandelierLight.position.x = Math.sin(chandelierState.angleZ) * -3.5;
      chandelierLight.position.z = 0.5 + Math.sin(chandelierState.angleX) * 3.5;
    }

    // 6B. SAKUYA'S TEAPOT & FALLING VOXEL TEA STREAM THAT FILLS A TEACUP
    const pouringGroup = new THREE.Group();
    scene.add(pouringGroup);

    const sakuyaPotVoxels = [];
    for (let x = -1; x <= 1; x++) {
      for (let y = -1; y <= 1; y++) {

          sakuyaPotVoxels.push({ x, y, z, color: new THREE.Color(y === 1 ? '#e0ac43' : '#f8fafc') });
        }
      }
    }
    sakuyaPotVoxels.push({ x: -1.8, y: 0.3, z: 0, color: new THREE.Color('#f8fafc'), sx: 0.9, sy: 0.6, sz: 0.6 });
    sakuyaPotVoxels.push({ x: 1.7, y: 0.0, z: 0, color: new THREE.Color('#e0ac43'), sx: 0.5, sy: 1.4, sz: 0.5 });
    const sakuyaPotMesh = buildVoxelInstancedMesh(sakuyaPotVoxels, 0.12, glossyPropMaterial, true, true);
    sakuyaPotMesh.position.set(1.42, 4.58, -2.1);
    sakuyaPotMesh.rotation.z = 0.48;

    const targetCupVoxels = [];
    for (let x = -1; x <= 1; x++) {

        if (Math.abs(x) === 1 || Math.abs(z) === 1) {

    }
    const targetCupMesh = buildVoxelInstancedMesh(targetCupVoxels, 0.13, glossyPropMaterial, true, true);
    targetCupMesh.position.set(0.95, 3.52, -2.1);
    pouringGroup.add(targetCupMesh);

    const teaLevelMesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.24, 0.06, 0.24),
      new THREE.MeshStandardMaterial({ color: 0xb91c1c, emissive: 0x450a0a, roughness: 0.15 })
    );
    teaLevelMesh.position.set(0.95, 3.60, -2.1);
    pouringGroup.add(teaLevelMesh);

    const TEA_DROP_COUNT = 18;
    const teaDrops = [];
    const teaDropGeom = new THREE.BoxGeometry(0.055, 0.085, 0.055);
    const teaDropMat = new THREE.MeshStandardMaterial({
      color: 0xdc2626,
      emissive: 0x7f1d1d,
      emissiveIntensity: 0.4,
      roughness: 0.15
    });
    const teaStreamMesh = new THREE.InstancedMesh(teaDropGeom, teaDropMat, TEA_DROP_COUNT);
    for (let i = 0; i < TEA_DROP_COUNT; i++) {
      teaDrops.push({ progress: i / TEA_DROP_COUNT });
      tempMatrix.identity();
      teaStreamMesh.setMatrixAt(i, tempMatrix);
      teaStreamMesh.setColorAt(i, new THREE.Color('#dc2626'));
    }
    teaStreamMesh.instanceMatrix.needsUpdate = true;
    teaStreamMesh.instanceColor.needsUpdate = true;
    pouringGroup.add(teaStreamMesh);

    let cupFillLevel = 0.0;
    function updateTeaStream(dt, time) {
      sakuyaPotMesh.position.y = 4.58 + Math.sin(time * 2.5) * 0.03;
      sakuyaPotMesh.rotation.z = 0.48 + Math.sin(time * 1.8) * 0.05;

      cupFillLevel = (cupFillLevel + dt * 0.22) % 1.0;
      teaLevelMesh.position.y = 3.56 + cupFillLevel * 0.12;
      const cupScale = 0.75 + cupFillLevel * 0.28;
      teaLevelMesh.scale.set(cupScale, 1, cupScale);

      for (let i = 0; i < TEA_DROP_COUNT; i++) {
        const d = teaDrops[i];
        d.progress = (d.progress + dt * 1.65) % 1.0;
        const p = d.progress;
        const x = THREE.MathUtils.lerp(1.18, 0.95, p) + Math.sin(time * 12 + i) * 0.008;
        const y = THREE.MathUtils.lerp(4.46, 3.62, p * p);
        const z = -2.1 + Math.cos(time * 10 + i) * 0.008;
        tempPos.set(x, y, z);
        tempQuat.identity();
        const s = 0.8 + 0.35 * Math.sin(p * Math.PI);
        tempScale.set(s, 1.0 + p * 0.5, s);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        teaStreamMesh.setMatrixAt(i, tempMatrix);
      }
      teaStreamMesh.instanceMatrix.needsUpdate = true;
    }

    // 6C. FLUTTERING VOXEL BATS AROUND THE CEILING ARCHES
    const BAT_COUNT = 8;

    function createBats() {
      const bodyGeom = new THREE.BoxGeometry(0.16, 0.14, 0.22);
      const wingGeom = new THREE.BoxGeometry(0.28, 0.04, 0.16);
      const batMat = new THREE.MeshStandardMaterial({ color: 0x1e112a, roughness: 0.7 });
      const eyeGeom = new THREE.BoxGeometry(0.04, 0.04, 0.04);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff2a55 });

      for (let i = 0; i < BAT_COUNT; i++) {
        const bRoot = new THREE.Group();
        const body = new THREE.Mesh(bodyGeom, batMat);
        bRoot.add(body);

        const eyeL = new THREE.Mesh(eyeGeom, eyeMat);
        eyeL.position.set(-0.04, 0.02, 0.11);
        const eyeR = new THREE.Mesh(eyeGeom, eyeMat);
        eyeR.position.set(0.04, 0.02, 0.11);
        bRoot.add(eyeL, eyeR);

        const wingL = new THREE.Group();
        wingL.position.set(-0.08, 0.02, 0);
        const wMeshL = new THREE.Mesh(wingGeom, batMat);
        wMeshL.position.x = -0.14;
        wingL.add(wMeshL);

        const wingR = new THREE.Group();
        wingR.position.set(0.08, 0.02, 0);
        const wMeshR = new THREE.Mesh(wingGeom, batMat);
        wMeshR.position.x = 0.14;
        wingR.add(wMeshR);

        bRoot.add(wingL, wingR);
        batGroup.add(bRoot);

        bats.push({
          root: bRoot,
          wingL,
          wingR,
          radiusX: 3.5 + (i % 3) * 1.8,
          radiusZ: 3.2 + ((i + 1) % 3) * 1.6,
          baseY: 8.8 + (i % 4) * 0.65,
          speed: 0.75 + (i % 3) * 0.22,
          phase: (i / BAT_COUNT) * Math.PI * 2
        });
      }
    }
    createBats();

    function updateBats(time) {
      for (let i = 0; i < bats.length; i++) {
        const b = bats[i];
        const t = time * b.speed + b.phase;
        const x = Math.cos(t) * b.radiusX;
        const z = Math.sin(t * 1.3) * b.radiusZ;
        const y = b.baseY + Math.sin(t * 2.4) * 0.45;

        const nextT = t + 0.05;
        const nx = Math.cos(nextT) * b.radiusX;
        const nz = Math.sin(nextT * 1.3) * b.radiusZ;

        b.root.position.set(x, y, z);
        b.root.rotation.y = Math.atan2(nx - x, nz - z);

        const flap = Math.sin(time * 18.0 + b.phase) * 0.68;
        b.wingL.rotation.z = flap;
        b.wingR.rotation.z = -flap;
      }
    }

    // 6D. BREAKABLE TEACUPS & PLATES THAT CAN BE KNOCKED OFF THE TABLE AND SHATTER
    const breakableDishes = [];
    const allDishRaycastMeshes = [];
    const SHARD_MAX = 96;
    const shardData = [];
    const shardGeom = new THREE.BoxGeometry(0.11, 0.08, 0.11);
    const shardMesh = new THREE.InstancedMesh(shardGeom, glossyPropMaterial, SHARD_MAX);
    shardMesh.castShadow = true;
    for (let i = 0; i < SHARD_MAX; i++) {
      const initCol = new THREE.Color('#ffffff');
      shardData.push({
        active: false,
        pos: new THREE.Vector3(),
        vel: new THREE.Vector3(),
        rot: new THREE.Euler(),
        angVel: new THREE.Vector3(),
        color: initCol
      });
      tempMatrix.makeScale(0, 0, 0);
      shardMesh.setMatrixAt(i, tempMatrix);
      shardMesh.setColorAt(i, initCol);
    }
    shardMesh.instanceMatrix.needsUpdate = true;
    shardMesh.instanceColor.needsUpdate = true;
    scene.add(shardMesh);

    function spawnPorcelainShards(origin, accentHex) {
      soundFX.playShatter();
      let spawned = 0;
      for (let i = 0; i < SHARD_MAX && spawned < 14; i++) {
        const s = shardData[i];
        if (!s.active) {
          s.active = true;
          s.pos.copy(origin).add(new THREE.Vector3((Math.random() - 0.5) * 0.2, 0.08, (Math.random() - 0.5) * 0.2));
          const ang = Math.random() * Math.PI * 2;
          const spd = 1.2 + Math.random() * 2.8;
          s.vel.set(Math.cos(ang) * spd, 1.8 + Math.random() * 2.6, Math.sin(ang) * spd);
          s.rot.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
          s.angVel.set((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);
          s.color.set((spawned % 3 === 0) ? accentHex : '#f8fafc');
          shardMesh.setColorAt(i, s.color);
          spawned++;
        }
      }
      if (shardMesh.instanceColor) shardMesh.instanceColor.needsUpdate = true;
    }

    function updatePorcelainShards(dt) {
      let dirty = false;
      for (let i = 0; i < SHARD_MAX; i++) {
        const s = shardData[i];
        if (!s.active) continue;
        dirty = true;
        if (s.pos.y > 0.05 || s.vel.lengthSq() > 0.01) {
          s.vel.y -= 18.0 * dt;
          s.pos.addScaledVector(s.vel, dt);
          s.rot.x += s.angVel.x * dt;
          s.rot.y += s.angVel.y * dt;
          s.rot.z += s.angVel.z * dt;
          if (s.pos.y <= 0.04) {
            s.pos.y = 0.04;
            s.vel.y = -s.vel.y * 0.25;
            s.vel.x *= 0.65;
            s.vel.z *= 0.65;
            s.angVel.multiplyScalar(0.5);
            if (Math.abs(s.vel.y) < 0.3) s.vel.set(0, 0, 0);
          }
        }
        tempQuat.setFromEuler(s.rot);
        tempScale.set(1, 1, 1);
        tempMatrix.compose(s.pos, tempQuat, tempScale);
        shardMesh.setMatrixAt(i, tempMatrix);
      }
      if (dirty) shardMesh.instanceMatrix.needsUpdate = true;
    }

    function createBreakableDishes() {
      const dishSpecs = [
        { pos: new THREE.Vector3(-1.65, 3.52, -3.1), type: 'cup', accent: '#ef4444', name: 'Scarlet Porcelain Teacup' },
        { pos: new THREE.Vector3(-1.65, 3.52, -1.1), type: 'plate', accent: '#f59e0b', name: 'Strawberry Pastry Plate' },
        { pos: new THREE.Vector3(1.65, 3.52, -0.4),  type: 'cup', accent: '#3b82f6', name: 'Maid Blue Teacup' },
        { pos: new THREE.Vector3(-1.65, 3.52, 1.6),  type: 'cup', accent: '#a855f7', name: 'Library Violet Teacup' },
        { pos: new THREE.Vector3(1.65, 3.52, 1.9),   type: 'plate', accent: '#ec4899', name: 'Rose Macaron Plate' },
        { pos: new THREE.Vector3(1.55, 3.52, 4.3),   type: 'cup', accent: '#eab308', name: 'Gold Rim Teacup' }
      ];

      dishSpecs.forEach((spec) => {
        const voxels = [];
        for (let x = -1; x <= 1; x++) {
          for (let z = -1; z <= 1; z++) {
            const isRim = (Math.abs(x) === 1 || Math.abs(z) === 1);
            voxels.push({ x, y: 0, z, color: new THREE.Color(isRim ? spec.accent : '#ffffff'), sx: 1, sy: 0.45, sz: 1 });
            if (spec.type === 'cup' && isRim) {
              voxels.push({ x, y: 0.8, z, color: new THREE.Color('#ffffff'), sx: 0.9, sy: 1.1, sz: 0.9 });
            } else if (spec.type === 'plate' && !isRim) {
              voxels.push({ x: 0, y: 0.65, z: 0, color: new THREE.Color(spec.accent), sx: 1.1, sy: 0.85, sz: 1.1 });
            }
          }
        }
        const mesh = buildVoxelInstancedMesh(voxels, 0.13, glossyPropMaterial, true, true);
        scene.add(mesh);

        const dishObj = {
          name: spec.name,
          accent: spec.accent,
          mesh,
          homePos: spec.pos.clone(),
          pos: spec.pos.clone(),
          vel: new THREE.Vector3(),
          rot: new THREE.Euler(),
          angVel: new THREE.Vector3(),
          isKnocked: false,
          isShattered: false
        };
        mesh.userData.dish = dishObj;
        mesh.position.copy(dishObj.pos);
        breakableDishes.push(dishObj);
        allDishRaycastMeshes.push(mesh);
      });
    }
    createBreakableDishes();

    function knockDish(dish, impulseVec) {
      if (dish.isShattered) return;
      dish.isKnocked = true;
      dish.vel.copy(impulseVec);
      dish.angVel.set((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
      soundFX.playPickup();
    }

    function resetAllDishes() {
      for (let i = 0; i < SHARD_MAX; i++) {
        shardData[i].active = false;
        tempMatrix.makeScale(0, 0, 0);
        shardMesh.setMatrixAt(i, tempMatrix);
      }
      shardMesh.instanceMatrix.needsUpdate = true;

      breakableDishes.forEach((d) => {
        d.isKnocked = false;
        d.isShattered = false;
        d.pos.copy(d.homePos);
        d.vel.set(0, 0, 0);
        d.rot.set(0, 0, 0);
        d.angVel.set(0, 0, 0);
        d.mesh.visible = true;
        d.mesh.position.copy(d.pos);
        d.mesh.rotation.set(0, 0, 0);
      });
    }

    function updateBreakableDishes(dt) {
      breakableDishes.forEach((d) => {
        if (d.isShattered) return;

        for (let i = 0; i < fumos.length; i++) {
          const f = fumos[i];
          const dist = d.pos.distanceTo(f.pos);
          if (dist < f.radius * 0.95) {
            const push = d.pos.clone().sub(f.pos).normalize();
            const spd = Math.max(2.8, f.vel.length() * 0.65);
            knockDish(d, new THREE.Vector3(push.x * spd + (Math.random() - 0.5) * 2, 2.2, push.z * spd));
          }
        }

        if (d.isKnocked) {
          d.vel.y -= 20.0 * dt;
          d.pos.addScaledVector(d.vel, dt);
          d.rot.x += d.angVel.x * dt;
          d.rot.y += d.angVel.y * dt;
          d.rot.z += d.angVel.z * dt;

          if (Math.abs(d.pos.x) < 2.45 && d.pos.z > -4.5 && d.pos.z < 5.5 && d.pos.y < 3.52 && d.pos.y > 3.1) {
            d.pos.y = 3.52;
            d.vel.y = Math.abs(d.vel.y) * 0.35;
            d.vel.x += (d.pos.x >= 0 ? 1 : -1) * 8.0 * dt;
          }

          if (d.pos.y <= 0.18) {
            d.isShattered = true;
            d.mesh.visible = false;
            spawnPorcelainShards(new THREE.Vector3(d.pos.x, 0.08, d.pos.z), d.accent);
          } else {
            d.mesh.position.copy(d.pos);
            d.mesh.rotation.copy(d.rot);
          }
        }
      });
    }

    // 6E. EXTERIOR SCARLET MOON BACKDROP, STAINED GLASS BEAMS & DRIFTING DUST MOTES
    const windowBackdropMat = new THREE.MeshBasicMaterial({ color: 0x3b0d1e });
    const windowBackdrop = new THREE.Mesh(new THREE.PlaneGeometry(18.0, 12.0), windowBackdropMat);

    const shaftGroup = new THREE.Group();

    for (let s = 0; s < 4; s++) {

    });

      });

    dustMesh.instanceMatrix.needsUpdate = true;

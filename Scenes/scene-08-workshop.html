    // ----------------------------------------------------------------------------
    // 5D. STAGE 3: STUFFING STATION WITH FLUFFY CLOUD BIN, HOSE & INFLATING LIMP FUMO
    // (Back-Right: rx 15..38, rz -35..-20, top Y = 3.25)
    // ----------------------------------------------------------------------------
    let inflatingFumoGroup = null;
    let manualPuffBoost = 0;

    function buildStuffingStation() {
      // Stuffing Workbench & Hopper Bin (rx 15..38, rz -35..-20)
      pushBoxVoxels(solidRoomVoxels, 15, 11, -35, 38, 12, -20, (x, y) => y === 11 ? '#5c3b23' : '#a47148', 0.025);
      for (const lx of [16, 36]) {
        for (const lz of [-34, -21]) {
          pushBoxVoxels(solidRoomVoxels, lx, 0, lz, lx + 1, 10, lz + 1, '#5c3b23');
        }
      }
      addCollider(3.75, 0, -8.8, 9.5, 3.25, -5.0, 'stuffing_table');

      // Wooden Stuffing Crate on right side of bench (rx 26..37, rz -34..-23, ry 13..18)
      for (let x = 26; x <= 37; x++) {
        for (let z = -34; z <= -23; z++) {
          for (let y = 13; y <= 17; y++) {
            const isWall = (x === 26 || x === 37 || z === -34 || z === -23);
            if (isWall && (y % 2 === 1)) {
              pushVoxel(solidRoomVoxels, x + 0.5, y + 0.5, z + 0.5, '#8c5836', 0.025);
            }
          }
        }
      }

      // Big Overflowing Pile of Fluffy White Cotton Stuffing inside & spilling out of the crate!
      for (let x = 25; x <= 37; x++) {
        for (let z = -33; z <= -22; z++) {
          const dx = (x - 31.5) / 5.5;
          const dz = (z + 28.0) / 5.5;
          const dome = Math.max(0, 1.0 - (dx * dx + dz * dz));
          const maxH = Math.floor(15 + dome * 7.5 + Math.sin(x * 1.3 + z) * 1.2);
          for (let y = 13; y <= maxH; y++) {
            if (y < maxH - 1 && x > 26 && x < 36 && z > -33 && z < -23) continue;
            pushVoxel(solidRoomVoxels, x + 0.5, y + 0.5, z + 0.5, '#ffffff', 0.018);
          }
        }
      }

      // Pressurized Stuffing Blower Nozzle & Segmented Flexible Hose leading from the cotton bin to rx = 19, rz = -26
      pushBoxVoxels(glossyRoomVoxels, 24, 13, -29, 26, 17, -26, '#38bdf8'); // Blue blower pump unit
      pushVoxel(glossyRoomVoxels, 25.0, 18.0, -27.5, '#facc15', 0.01, 1.4, 1.4, 1.4); // Pressure gauge
      for (let i = 0; i < 8; i++) {
        const hx = 24.0 - i * 0.7;
        const hy = 14.5 + Math.sin(i * 0.7) * 1.1;
        const hz = -27.5 + Math.cos(i * 0.5) * 0.8;
        pushVoxel(glossyRoomVoxels, hx, hy, hz, (i % 2 === 0) ? '#475569' : '#64748b', 0.01, 0.95, 0.95, 0.95);
      }
      // Brass Nozzle tip at rx = 18.8, ry = 14.2, rz = -26.5
      pushVoxel(glossyRoomVoxels, 18.8, 14.2, -26.5, '#eab308', 0.01, 1.2, 0.8, 0.8);

      // Dynamic Limp-to-Puffed Unstuffed Fumo Body on the Stuffing Nozzle!
      // Clicking it or watching it cycle shows it visibly inflate with squash-and-stretch!
      inflatingFumoGroup = new THREE.Group();
      inflatingFumoGroup.position.set(17.5 * RV, 13.0 * RV, -26.5 * RV);

      const infVoxels = [];
      const skinCol = '#ffe5d4';
      const seamCol = '#d4a373';
      // Stubby torso + oversized head shell with visible basting stitch seams
      for (let y = 0; y <= 11; y++) {
        const isHead = y >= 5;
        const rMax = isHead ? 3.8 - Math.abs(y - 8) * 0.45 : 2.8;
        for (let x = -4; x <= 4; x++) {
          for (let z = -4; z <= 4; z++) {
            const d = Math.hypot(x, z);
            if (d > rMax || d < rMax - 1.3) continue;
            const isStitch = ((x === 0 || z === 0) && (y % 2 === 0));
            let col = isStitch ? seamCol : (isHead ? skinCol : '#f472b6');
            // Cute stitched 'ᗜˬᗜ' eyes on front (+Z)
            if (isHead && z >= 2.5 && Math.abs(x) === 2 && (y === 7 || y === 8)) {
              col = '#1e293b';
            }
            infVoxels.push({ x, y: y + 0.5, z, color: varyColor(col, x, y, z, 0.03) });
          }
        }
      }
      const infMesh = buildVoxelInstancedMesh(infVoxels, 0.078, plushMaterial, true, true);
      if (infMesh) {
        infMesh.userData.isStuffingFumo = true;
        inflatingFumoGroup.add(infMesh);
        allFumoRaycastMeshes.push(infMesh);
      }
      scene.add(inflatingFumoGroup);
    }

    function updateInflatingFumo(time, dt) {
      if (!inflatingFumoGroup) return;
      if (manualPuffBoost > 0) {
        manualPuffBoost = Math.max(0, manualPuffBoost - dt * 1.8);
      }
      // Smooth cyclical inflation: limp & flat -> round & puffed up -> gentle pop!
      const cycle = (Math.sin(time * 2.1) * 0.5 + 0.5);
      const puff = Math.min(1.35, 0.35 + cycle * 0.85 + manualPuffBoost * 0.45);
      const sxz = 0.62 + puff * 0.48;
      const sy = 0.42 + puff * 0.65;
      inflatingFumoGroup.scale.set(sxz, sy, sxz);
      inflatingFumoGroup.rotation.z = Math.sin(time * 4.2) * 0.06 * (1.2 - cycle);
      inflatingFumoGroup.rotation.x = (1.0 - cycle) * 0.28;
    }

    // ----------------------------------------------------------------------------
    // 5E. STAGE 4: CENTRAL MOTORIZED CONVEYOR BELT (Center: X [-6.5, 4.25], Z [-1.1, 1.1], top Y = 2.25)
    // Carries fumos from Left to Right (+X) with believable friction & animated slats!
    // ----------------------------------------------------------------------------
    const CONVEYOR_BOUNDS = {
      minX: -6.5,
      maxX: 4.25,
      minZ: -1.15,
      maxZ: 1.15,
      topY: 2.25,
      speed: 1.65 // World units per second toward +X (right into the open shipping box!)
    };

    const conveyorSlats = [];
    let conveyorSlatMesh = null;

    function buildConveyorBelt() {
      // rx from -26 to 17, rz from -4 to 4, ry = 0..8 (top at Y = 2.25)
      // Side guide rails & steel frame
      for (let x = -26; x <= 17; x++) {
        pushVoxel(glossyRoomVoxels, x + 0.5, 8.2, -4.5, '#f59e0b', 0.02, 1, 1.1, 0.7); // Yellow safety rail back
        pushVoxel(glossyRoomVoxels, x + 0.5, 8.2, 4.5, '#f59e0b', 0.02, 1, 1.1, 0.7);  // Yellow safety rail front
        pushVoxel(glossyRoomVoxels, x + 0.5, 7.2, -4.5, '#334155', 0.02);
        pushVoxel(glossyRoomVoxels, x + 0.5, 7.2, 4.5, '#334155', 0.02);
      }
      // Support legs
      for (const lx of [-24, -10, 4, 15]) {
        for (const lz of [-4, 4]) {
          pushBoxVoxels(glossyRoomVoxels, lx, 0, lz, lx + 1, 6, lz, '#1e293b');
        }
      }
      // End rollers
      for (let z = -3; z <= 3; z++) {
        pushVoxel(glossyRoomVoxels, -26.2, 8.0, z + 0.5, '#94a3b8', 0.01, 1.2, 1.2, 1);
        pushVoxel(glossyRoomVoxels, 17.2, 8.0, z + 0.5, '#94a3b8', 0.01, 1.2, 1.2, 1);
      }

      // Animated Conveyor Belt Slats
      for (let i = 0; i < 42; i++) {
        for (let z = -3; z <= 3; z++) {
          const isStripe = (i % 6 === 0);
          conveyorSlats.push({
            slotIndex: i,
            z: z + 0.5,
            color: varyColor(isStripe ? '#475569' : '#1e293b', i, 8, z, 0.02)
          });
        }
      }
      conveyorSlatMesh = buildVoxelInstancedMesh(
        conveyorSlats.map(s => ({ x: -25.5 + s.slotIndex, y: 8.5, z: s.z, color: s.color, sx: 0.92, sy: 0.8, sz: 1 })),
        RV,
        roomSolidMaterial,
        true,
        true
      );
      scene.add(conveyorSlatMesh);

      addCollider(CONVEYOR_BOUNDS.minX, 0, CONVEYOR_BOUNDS.minZ, CONVEYOR_BOUNDS.maxX, CONVEYOR_BOUNDS.topY, CONVEYOR_BOUNDS.maxZ, 'conveyor_belt');
    }

    function updateConveyorBelt(time) {
      if (!conveyorSlatMesh) return;
      const beltLen = 42; // rx -25.5 to +16.5
      const offset = (time * (CONVEYOR_BOUNDS.speed / RV)) % beltLen;

      for (let i = 0; i < conveyorSlats.length; i++) {
        const s = conveyorSlats[i];
        const wrappedX = -25.5 + ((s.slotIndex + offset) % beltLen);
        tempPos.set(wrappedX * RV, 8.5 * RV, s.z * RV);
        tempQuat.identity();
        tempScale.set(0.92, 0.8, 1);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        conveyorSlatMesh.setMatrixAt(i, tempMatrix);
      }
      conveyorSlatMesh.instanceMatrix.needsUpdate = true;
    }

    // ----------------------------------------------------------------------------
    // 5F. STAGE 5: EMBROIDERY DESK & HAT/ACCESSORY SHELF
    // (Front-Left: Embroidery Desk at rx -36..-15, rz 12..26, top Y = 3.0; Hat Shelf at rx -39..-33, rz -5..10)
    // Includes Embroidery Hoop with stitched eyes/mouth, Pin Cushion, Button Jar & Spools!
    // ----------------------------------------------------------------------------
    function buildEmbroideryAndHatShelf() {
      // Embroidery Desk Top (ry = 10..11 -> top at Y = 3.0)
      pushBoxVoxels(solidRoomVoxels, -36, 10, 12, -15, 11, 26, (x, y) => y === 10 ? '#6b4428' : '#b07d52', 0.025);
      for (const lx of [-35, -16]) {
        for (const lz of [13, 25]) {
          pushBoxVoxels(solidRoomVoxels, lx, 0, lz, lx + 1, 9, lz + 1, '#5c3b23');
        }
      }
      addCollider(-9.0, 0, 3.0, -3.75, 3.0, 6.5, 'embroidery_desk');

      // Wooden Circular Embroidery Hoop holding peach plush fabric with stitched 'ᗜˬᗜ' eyes & smile!
      for (let x = -29; x <= -21; x++) {
        for (let z = 15; z <= 23; z++) {
          const dx = x + 25;
          const dz = z - 19;
          const r = Math.hypot(dx, dz);
          if (r <= 4.3 && r >= 3.4) {
            pushVoxel(solidRoomVoxels, x + 0.5, 12.4, z + 0.5, '#d4a373', 0.02, 1, 0.65, 1); // Wooden hoop ring
          } else if (r < 3.4) {
            let fCol = '#ffe5d4'; // taut peach fabric
            // Stitched fumo eyes & tiny smile on hoop!
            if (Math.abs(dx) === 2 && (dz === -1 || dz === 0)) fCol = '#1e293b';
            else if (Math.abs(dx) === 2 && dz === 1) fCol = '#e63946'; // Red iris stitch
            else if (dz === 2 && Math.abs(dx) <= 1) fCol = '#9d0208'; // Stitched smile
            pushVoxel(solidRoomVoxels, x + 0.5, 12.2, z + 0.5, fCol, 0.015, 1, 0.35, 1);
          }
        }
      }
      // Brass tension screw at top of hoop
      pushVoxel(glossyRoomVoxels, -25.0, 12.4, 14.2, '#eab308', 0.01, 1.2, 0.5, 0.8);

      // Tomato Pin Cushion (rx -18, rz 16) with tiny pins sticking out!
      pushVoxel(solidRoomVoxels, -18.0, 12.5, 16.0, '#e63946', 0.02, 2.2, 1.4, 2.2);
      pushVoxel(solidRoomVoxels, -18.0, 13.3, 16.0, '#2a9d8f', 0.02, 0.8, 0.4, 0.8); // Green leaf crown
      // Pins with colorful pearl heads
      pushVoxel(glossyRoomVoxels, -18.5, 13.8, 15.6, '#fde047', 0.01, 0.35, 1.2, 0.35);
      pushVoxel(glossyRoomVoxels, -17.4, 13.7, 16.4, '#38bdf8', 0.01, 0.35, 1.2, 0.35);
      pushVoxel(glossyRoomVoxels, -18.1, 13.9, 16.5, '#f472b6', 0.01, 0.35, 1.2, 0.35);

      // Glass Button Jar filled with colorful buttons (rx -33..-31, rz 15..17)
      pushBoxVoxels(glassVoxels, -33, 12, 15, -31, 15, 17, '#bae6fd');
      pushBoxVoxels(glossyRoomVoxels, -33, 16, 15, -31, 16, 17, '#d97706'); // Brass jar lid
      const btnCols = ['#ef4444', '#3b82f6', '#eab308', '#a855f7', '#10b981'];
      for (let b = 0; b < 8; b++) {
        pushVoxel(solidRoomVoxels, -32.0 + (b % 2 - 0.5) * 0.7, 12.3 + b * 0.35, 16.0, btnCols[b % 5], 0.02, 0.8, 0.4, 0.8);
      }

      // Spools of Thread on Desk (rx -34..-30, rz 21..24)
      const spoolCols = ['#f43f5e', '#38bdf8', '#facc15', '#a855f7', '#4ade80'];
      spoolCols.forEach((sc, idx) => {
        const sx = -34.0 + idx * 1.4;
        const sz = 22.0 + (idx % 2) * 1.5;
        pushVoxel(solidRoomVoxels, sx, 12.6, sz, sc, 0.02, 1.0, 1.5, 1.0);
        pushVoxel(solidRoomVoxels, sx, 13.4, sz, '#d4a373', 0.01, 1.2, 0.3, 1.2);
      });

      // Multi-Tier Hat & Accessory Display Shelf (Against Left Wall between Windows: rx -39..-33, rz -6..3)
      for (const tierY of [6, 13, 20, 27]) {
        pushBoxVoxels(solidRoomVoxels, -39, tierY, -6, -33, tierY, 3, '#8c5836');
      }
      for (const pz of [-6, 3]) {
        pushBoxVoxels(solidRoomVoxels, -39, 0, pz, -33, 28, pz, '#5c3b23');
      }
      addCollider(-9.8, 0, -1.6, -8.1, 7.2, 0.9, 'hat_shelf');

      // Mini Witch Hat on Top Tier (ry 28..31, rz -4..-1)
      pushBoxVoxels(solidRoomVoxels, -37, 28, -4, -34, 28, -1, '#1e1b24');
      pushBoxVoxels(solidRoomVoxels, -36, 29, -3, -35, 31, -2, (x, y) => y === 29 ? '#ffffff' : '#1e1b24');
      // Mini Red Hakurei Bow & Blue Cirno Bow on Middle Tiers
      pushBoxVoxels(solidRoomVoxels, -37, 21, -4, -35, 22, 1, '#e63946');
      pushBoxVoxels(solidRoomVoxels, -37, 14, -4, -35, 15, 1, '#2563eb');
      // Mini Pink Mob Cap on Bottom Tier
      pushBoxVoxels(solidRoomVoxels, -37, 7, -3, -35, 8, 0, '#ffc2d1');
    }

    // ----------------------------------------------------------------------------
    // 5G. STAGE 6: PACKAGING TABLE, TISSUE PAPER, TAGS & INTERACTIVE CLOSING GIFT BOX!
    // (Front-Right & Conveyor Output: rx 14..38, rz -5..26)
    // ----------------------------------------------------------------------------
    let interactiveBoxGroup = null;
    let flapLeftPivot = null;
    let flapRightPivot = null;
    let boxCloseTimer = 0; // > 0 when a Fumo was just tossed into the box!
    let boxSquash = 1.0;
    let boxSquashVel = 0.0;

    const GIFT_BOX_ZONE = {
      center: new THREE.Vector3(5.6, 1.5, 0.0), // Positioned right at the end of the conveyor belt!
      radius: 1.45,
      topY: 1.35
    };

    function buildPackagingStation() {
      // Packaging Table (rx 14..38, rz 8..26, ry 10..11 -> top at Y = 3.0)
      pushBoxVoxels(solidRoomVoxels, 14, 10, 8, 38, 11, 26, (x, y) => y === 10 ? '#6b4428' : '#a47148', 0.025);
      for (const lx of [15, 36]) {
        for (const lz of [9, 25]) {
          pushBoxVoxels(solidRoomVoxels, lx, 0, lz, lx + 1, 9, lz + 1, '#5c3b23');
        }
      }
      addCollider(3.5, 0, 2.0, 9.5, 3.0, 6.5, 'packaging_table');

      // Pastel Tissue Paper Sheets & Red "GIFT / FUMO" Authenticity Tags on Packaging Table
      for (let x = 16; x <= 23; x++) {
        for (let z = 11; z <= 17; z++) {
          pushVoxel(solidRoomVoxels, x + 0.5, 12.2, z + 0.5, (x + z) % 2 === 0 ? '#ffe5ec' : '#fff0f3', 0.015, 1, 0.3, 1);
        }
      }
      // Stack of Tin Badges & Red Gift Tags (rx 17..20, rz 20..23)
      for (let t = 0; t < 3; t++) {
        pushVoxel(glossyRoomVoxels, 18.0 + t * 1.4, 12.3, 21.5, '#dc2626', 0.01, 1.1, 0.35, 1.6);
        pushVoxel(glossyRoomVoxels, 18.0 + t * 1.4, 12.5, 21.5, '#ffffff', 0.01, 0.6, 0.35, 0.8);
      }

      // Cozy Open Box on Packaging Table (rx 26..35, rz 12..21, ry 12..16) where Reimu/Sleeping Fumo rests!
      for (let x = 26; x <= 35; x++) {
        for (let z = 12; z <= 21; z++) {
          pushVoxel(solidRoomVoxels, x + 0.5, 12.2, z + 0.5, '#d4a373', 0.02); // Box floor
          const isWall = (x === 26 || x === 35 || z === 12 || z === 21);
          if (isWall) {
            for (let y = 13; y <= 16; y++) {
              pushVoxel(solidRoomVoxels, x + 0.5, y + 0.5, z + 0.5, '#cb997e', 0.025);
            }
          } else if ((x + z) % 2 === 0) {
            // Soft pink tissue paper lining inside the sleeping box
            pushVoxel(solidRoomVoxels, x + 0.5, 12.8, z + 0.5, '#ffccd5', 0.02, 1, 0.5, 1);
          }
        }
      }
      addCollider(6.5, 3.0, 3.0, 8.8, 3.35, 5.3, 'table_sleeping_box');

      // --- INTERACTIVE SHIPPING BOX AT CONVEYOR OUTPUT (World X = 5.6, Z = 0.0) ---
      // Any Fumo riding off the conveyor belt OR tossed into this box triggers the flaps to close with a bounce!
      interactiveBoxGroup = new THREE.Group();
      interactiveBoxGroup.position.set(GIFT_BOX_ZONE.center.x, 0, GIFT_BOX_ZONE.center.z);

      const boxBodyVoxels = [];
      for (let x = -5; x <= 5; x++) {
        for (let z = -5; z <= 5; z++) {
          // Wooden pallet & cardboard base
          boxBodyVoxels.push({ x, y: 0.5, z, color: varyColor('#8c5836', x, 0, z, 0.02) });
          boxBodyVoxels.push({ x, y: 1.5, z, color: varyColor('#d4a373', x, 1, z, 0.02) });
          const isRim = (Math.abs(x) === 5 || Math.abs(z) === 5);
          if (isRim) {
            for (let y = 2; y <= 6; y++) {
              const isSticker = (z === 5 && Math.abs(x) <= 2 && (y === 4 || y === 5));
              const c = isSticker ? (y === 5 ? '#e63946' : '#ffffff') : '#d4a373';
              boxBodyVoxels.push({ x, y: y + 0.5, z, color: varyColor(c, x, y, z, 0.02) });
            }
          } else {
            // Fluffy white & pink tissue cushion inside box
            boxBodyVoxels.push({ x, y: 2.3, z, color: varyColor('#ffe5ec', x, 2, z, 0.02) });
          }
        }
      }
      const boxMesh = buildVoxelInstancedMesh(boxBodyVoxels, RV, roomSolidMaterial, true, true);
      interactiveBoxGroup.add(boxMesh);

      // Left & Right Animated Cardboard Flaps
      flapLeftPivot = new THREE.Group();
      flapLeftPivot.position.set(-5.0 * RV, 7.0 * RV, 0);
      flapRightPivot = new THREE.Group();
      flapRightPivot.position.set(5.0 * RV, 7.0 * RV, 0);

      const leftFlapVoxels = [];
      const rightFlapVoxels = [];
      for (let fx = 0; fx <= 4; fx++) {
        for (let fz = -5; fz <= 5; fz++) {
          leftFlapVoxels.push({ x: fx + 0.5, y: 0, z: fz, color: varyColor('#cb997e', fx, 7, fz, 0.02), sx: 1, sy: 0.45, sz: 1 });
          rightFlapVoxels.push({ x: -fx - 0.5, y: 0, z: fz, color: varyColor('#cb997e', -fx, 7, fz, 0.02), sx: 1, sy: 0.45, sz: 1 });
        }
      }
      flapLeftPivot.add(buildVoxelInstancedMesh(leftFlapVoxels, RV, roomSolidMaterial, true, true));
      flapRightPivot.add(buildVoxelInstancedMesh(rightFlapVoxels, RV, roomSolidMaterial, true, true));

      interactiveBoxGroup.add(flapLeftPivot, flapRightPivot);
      scene.add(interactiveBoxGroup);

      addCollider(GIFT_BOX_ZONE.center.x - 1.2, 0, GIFT_BOX_ZONE.center.z - 1.2, GIFT_BOX_ZONE.center.x + 1.2, 0.65, GIFT_BOX_ZONE.center.z + 1.2, 'interactive_shipping_box');
    }

    function triggerBoxPackBounce(fumo) {
      if (boxCloseTimer <= 0.1) {
        soundFX.playBoxPack();
        spawnSqueezeParticles(GIFT_BOX_ZONE.center, fumo ? fumo.accentColor : '#f43f5e');
      }
      boxCloseTimer = 2.2; // Keep flaps closed for 2.2 seconds
      boxSquash = 0.68;
      boxSquashVel = -4.2;
    }

    function updateInteractiveBox(dt) {
      if (!interactiveBoxGroup) return;
      if (boxCloseTimer > 0) {
        boxCloseTimer = Math.max(0, boxCloseTimer - dt);
      }

      // Elastic squash & bounce of the cardboard box
      const k = 180.0;
      const d = 10.5;
      boxSquashVel += ((1.0 - boxSquash) * k - boxSquashVel * d) * dt;
      boxSquash = THREE.MathUtils.clamp(boxSquash + boxSquashVel * dt, 0.55, 1.35);
      const sxz = 1.0 / Math.sqrt(boxSquash);
      interactiveBoxGroup.scale.set(sxz, boxSquash, sxz);

      // Flap rotation: open (-2.1 rad) vs closed (0.0 rad)
      const targetFlap = boxCloseTimer > 0 ? 0.05 : 2.15;
      flapLeftPivot.rotation.z = THREE.MathUtils.lerp(flapLeftPivot.rotation.z, targetFlap, Math.min(1, dt * 12));
      flapRightPivot.rotation.z = THREE.MathUtils.lerp(flapRightPivot.rotation.z, -targetFlap, Math.min(1, dt * 12));
    }

    // ----------------------------------------------------------------------------
    // 5H. SLEEPING CAT IN BASKET OF FABRIC SCRAPS & GLOWING VINTAGE HEATER
    // (Front-Center: Heater at X = 0.2, Z = 5.2; Cat Basket at X = -1.6, Z = 4.6)
    // ----------------------------------------------------------------------------
    let sleepingCatGroup = null;

    function buildCatBasketAndHeater() {
      // Vintage Space Heater / Stove at rx = 0..4, rz = 19..22, ry = 0..6
      pushBoxVoxels(glossyRoomVoxels, 0, 0, 19, 4, 6, 22, (x, y, z) => {
        if (z === 22 && x >= 1 && x <= 3 && y >= 1 && y <= 4) return null; // Front grill opening
        return '#7f1d1d'; // Deep vintage enamel red
      }, 0.02);
      // Glowing warm orange heating coils inside
      for (let y = 1; y <= 4; y++) {
        for (let x = 1; x <= 3; x++) {
          pushVoxel(heaterCoilVoxels, x + 0.5, y + 0.5, 21.6, '#ff6b00', 0.01, 0.9, 0.65, 0.5);
        }
      }
      addCollider(-0.1, 0, 4.7, 1.3, 1.75, 5.8, 'space_heater');

      // Woven Wicker Basket of Colorful Fabric Scraps (rx -10..-3, rz 16..22, ry 0..2)
      for (let x = -10; x <= -3; x++) {
        for (let z = 16; z <= 22; z++) {
          const dist = Math.hypot(x + 6.5, z - 19.0);
          if (dist <= 3.8) {
            pushVoxel(solidRoomVoxels, x + 0.5, 0.5, z + 0.5, '#b08968', 0.03);
            if (dist >= 2.7) {
              pushVoxel(solidRoomVoxels, x + 0.5, 1.5, z + 0.5, '#9c6644', 0.03);
              pushVoxel(solidRoomVoxels, x + 0.5, 2.3, z + 0.5, '#7f5539', 0.03, 1, 0.7, 1);
            } else {
              // Colorful felt fabric scraps inside basket
              const scrapColors = ['#ef4444', '#38bdf8', '#fde047', '#f472b6', '#a855f7'];
              const sc = scrapColors[Math.abs(x * 3 + z * 5) % scrapColors.length];
              pushVoxel(solidRoomVoxels, x + 0.5, 1.4, z + 0.5, sc, 0.03, 1, 0.8, 1);
            }
          }
        }
      }
      addCollider(-2.6, 0, 3.9, -0.7, 0.65, 5.6, 'cat_basket');

      // Curled-up Sleeping Voxel Cat (Calico / Ginger & White) breathing gently in the basket!
      sleepingCatGroup = new THREE.Group();
      sleepingCatGroup.position.set(-6.5 * RV, 1.8 * RV, 19.0 * RV);
      const catVoxels = [];
      for (let x = -2; x <= 2; x++) {
        for (let z = -2; z <= 2; z++) {
          if (Math.hypot(x, z) <= 2.2) {
            const c = (x + z > 1) ? '#f97316' : ((x < -1) ? '#1e293b' : '#fffbeb');
            catVoxels.push({ x, y: 0.6, z, color: varyColor(c, x, 1, z, 0.02) });
            if (Math.hypot(x, z) <= 1.6) {
              catVoxels.push({ x, y: 1.4, z, color: varyColor(c, x, 2, z, 0.02) });
            }
          }
        }
      }
      // Cute cat ears & curled tail
      catVoxels.push({ x: 1.2, y: 2.2, z: 1.0, color: new THREE.Color('#f97316'), sx: 0.7, sy: 0.8, sz: 0.7 });
      catVoxels.push({ x: 1.8, y: 2.2, z: 0.2, color: new THREE.Color('#1e293b'), sx: 0.7, sy: 0.8, sz: 0.7 });
      catVoxels.push({ x: -2.1, y: 0.8, z: 0.8, color: new THREE.Color('#f97316'), sx: 0.8, sy: 0.6, sz: 1.5 });

      const catMesh = buildVoxelInstancedMesh(catVoxels, 0.16, plushMaterial, true, true);
      sleepingCatGroup.add(catMesh);
      scene.add(sleepingCatGroup);
    }

    // Build all Workshop stations
    buildWorkshopStructure();
    buildFabricCuttingStation();
    buildSewingStation();
    buildStuffingStation();
    buildConveyorBelt();
    buildEmbroideryAndHatShelf();
    buildPackagingStation();
    buildCatBasketAndHeater();

    const roomGroup = new THREE.Group();
    scene.add(roomGroup);

    const solidMesh = buildVoxelInstancedMesh(solidRoomVoxels, RV, roomSolidMaterial, true, true);
    const glossyMesh = buildVoxelInstancedMesh(glossyRoomVoxels, RV, glossyPropMaterial, true, true);
    const warmBulbMesh = buildVoxelInstancedMesh(warmBulbVoxels, RV, warmBulbMaterial, false, false);
    const heaterCoilMesh = buildVoxelInstancedMesh(heaterCoilVoxels, RV, heaterCoilMaterial, false, false);
    const glassMesh = buildVoxelInstancedMesh(glassVoxels, RV, translucentIceMaterial, false, true);

    if (solidMesh) roomGroup.add(solidMesh);
    if (glossyMesh) roomGroup.add(glossyMesh);
    if (warmBulbMesh) roomGroup.add(warmBulbMesh);
    if (heaterCoilMesh) roomGroup.add(heaterCoilMesh);
    if (glassMesh) roomGroup.add(glassMesh);

    // ============================================================================
    // 6. SWAYING WINDOW CURTAINS, SKY BACKDROP & FLOATING LOOSE STUFFING FLUFF
    // ============================================================================
    const curtainData = [];
    for (let y = 15; y <= 39; y++) {
      for (const zRange of [[-30, -26], [-10, -6], [2, 6], [22, 26]]) {
        for (let z = zRange[0]; z <= zRange[1]; z++) {
          const pleat = Math.sin(z * 1.4) * 0.35;
          const isHem = (y === 15 || y === 39);
          const col = isHem ? '#e07a5f' : ((z % 2 === 0) ? '#fff1e6' : '#fde2e4');
          curtainData.push({
            baseX: -39.3 + pleat,
            baseY: y + 0.5,
            baseZ: z + 0.5,
            weight: (39 - y) / 24,
            color: varyColor(col, -39, y, z, 0.025)
          });
        }
      }
    }
    const curtainMesh = buildVoxelInstancedMesh(
      curtainData.map(c => ({ x: c.baseX, y: c.baseY, z: c.baseZ, color: c.color })),
      RV,
      plushMaterial,
      true,
      true
    );
    roomGroup.add(curtainMesh);

    function updateSwayingCurtain(time) {
      if (!curtainMesh) return;
      for (let i = 0; i < curtainData.length; i++) {
        const c = curtainData[i];
        const waveX = Math.sin(time * 1.5 + c.baseZ * 0.25 + c.baseY * 0.12) * 0.75 * c.weight;
        const waveZ = Math.cos(time * 1.1 + c.baseY * 0.15) * 0.32 * c.weight;
        tempPos.set((c.baseX + Math.max(0, waveX)) * RV, c.baseY * RV, (c.baseZ + waveZ) * RV);
        tempQuat.identity();
        tempScale.set(1, 1, 1);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        curtainMesh.setMatrixAt(i, tempMatrix);
      }
      curtainMesh.instanceMatrix.needsUpdate = true;
    }

    // Exterior Window Backdrop (Sky, Sun & Moon)
    const windowBackdropMat = new THREE.MeshBasicMaterial({ color: 0x80c8ff });
    const windowBackdrop = new THREE.Mesh(new THREE.PlaneGeometry(16.5, 7.5), windowBackdropMat);
    windowBackdrop.position.set(-11.4, 6.6, -0.5);
    windowBackdrop.rotation.y = Math.PI / 2;
    scene.add(windowBackdrop);

    const celestialMat = new THREE.MeshBasicMaterial({ color: 0xfff3b0 });
    const celestialOrb = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.45, 1.45), celestialMat);
    celestialOrb.position.set(-11.0, 7.5, -4.2);
    scene.add(celestialOrb);

    const shaftMat = new THREE.MeshBasicMaterial({
      color: 0xfff2c2,
      transparent: true,
      opacity: 0.10,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide
    });
    const lightShaftGroup = new THREE.Group();
    for (const sz of [-4.5, 3.5]) {
      const shaftGeom = new THREE.PlaneGeometry(12.0, 2.8);
      const shaft = new THREE.Mesh(shaftGeom, shaftMat);
      shaft.position.set(-5.5, 5.0, sz);
      shaft.rotation.z = -0.44;
      shaft.rotation.x = 0.22;
      lightShaftGroup.add(shaft);
    }
    scene.add(lightShaftGroup);

    // ============================================================================
    // 7. FLOATING STUFFING FLUFF, DUST MOTES & SQUEEZE POP PARTICLES
    // ============================================================================
    const DUST_COUNT = 75;
    const dustData = [];
    const dustGeom = new THREE.BoxGeometry(0.065, 0.065, 0.065);
    const dustMat = new THREE.MeshBasicMaterial({
      color: 0xfff8dc,
      transparent: true,
      opacity: 0.65
    });
    const dustMesh = new THREE.InstancedMesh(dustGeom, dustMat, DUST_COUNT);
    for (let i = 0; i < DUST_COUNT; i++) {
      dustData.push({
        x: -9.5 + Math.random() * 19,
        y: 0.6 + Math.random() * 9.5,
        z: -8.5 + Math.random() * 17,
        vx: (Math.random() - 0.5) * 0.22,
        vy: 0.06 + Math.random() * 0.14,
        vz: (Math.random() - 0.5) * 0.22,
        phase: Math.random() * Math.PI * 2,
        scale: 0.6 + Math.random() * 0.9
      });
    }
    scene.add(dustMesh);

    // Loose White Cotton Stuffing Tufts that float up from the Stuffing Station and gently settle!
    const FLUFF_COUNT = 36;
    const fluffData = [];
    const fluffGeom = new THREE.BoxGeometry(0.14, 0.12, 0.14);
    const fluffMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95 });
    const fluffMesh = new THREE.InstancedMesh(fluffGeom, fluffMat, FLUFF_COUNT);
    for (let i = 0; i < FLUFF_COUNT; i++) {
      fluffData.push({
        x: 4.2 + Math.random() * 4.5,
        y: 3.3 + Math.random() * 3.5,
        z: -8.2 + Math.random() * 2.8,
        vy: -0.25 - Math.random() * 0.25,
        phase: Math.random() * Math.PI * 2,
        scale: 0.65 + Math.random() * 0.85
      });
    }
    scene.add(fluffMesh);

    function updateDustAndFluff(time, dt) {
      for (let i = 0; i < DUST_COUNT; i++) {
        const d = dustData[i];
        d.x += (d.vx + Math.sin(time * 0.7 + d.phase) * 0.12) * dt;
        d.y += (d.vy + Math.cos(time * 0.9 + d.phase) * 0.08) * dt;
        d.z += (d.vz + Math.sin(time * 0.6 + d.phase) * 0.12) * dt;
        if (d.y > 10.5) d.y = 0.6;
        if (d.x > 9.5) d.x = -9.5;
        if (d.x < -9.5) d.x = 9.5;

        const twinkle = 0.5 + 0.5 * Math.sin(time * 2.5 + d.phase);
        tempPos.set(d.x, d.y, d.z);
        tempQuat.setFromEuler(new THREE.Euler(time + d.phase, time * 0.7, 0));
        const s = d.scale * (0.6 + 0.4 * twinkle);
        tempScale.set(s, s, s);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        dustMesh.setMatrixAt(i, tempMatrix);
      }
      dustMesh.instanceMatrix.needsUpdate = true;

      // Update floating & settling cotton stuffing tufts
      for (let i = 0; i < FLUFF_COUNT; i++) {
        const f = fluffData[i];
        f.y += f.vy * dt;
        const driftX = f.x + Math.sin(time * 1.4 + f.phase) * 0.35;
        const driftZ = f.z + Math.cos(time * 1.2 + f.phase) * 0.35;
        if (f.y < 3.35) {
          // Respawn puffing out from the stuffing blower nozzle / cotton pile
          f.y = 4.2 + Math.random() * 2.4;
          f.x = 4.2 + Math.random() * 4.5;
          f.z = -8.0 + Math.random() * 2.6;
        }
        tempPos.set(driftX, f.y, driftZ);
        tempQuat.setFromEuler(new THREE.Euler(time * 0.8 + f.phase, time * 0.5, 0));
        tempScale.set(f.scale, f.scale * 0.8, f.scale);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        fluffMesh.setMatrixAt(i, tempMatrix);
      }
      fluffMesh.instanceMatrix.needsUpdate = true;
    }

    // Pop particles when you squeeze a fumo or pack a box
    const POP_MAX = 48;
    const popParticles = [];
    const popGeom = new THREE.BoxGeometry(0.11, 0.11, 0.11);
    const popMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const popMesh = new THREE.InstancedMesh(popGeom, popMat, POP_MAX);
    for (let i = 0; i < POP_MAX; i++) {
      popParticles.push({ active: false, pos: new THREE.Vector3(), vel: new THREE.Vector3(), life: 0, maxLife: 1, color: new THREE.Color('#ff85a1') });
      tempMatrix.makeScale(0, 0, 0);
      popMesh.setMatrixAt(i, tempMatrix);
    }
    scene.add(popMesh);

    function spawnSqueezeParticles(origin, accentHex) {
      const palette = [accentHex, '#ff85a1', '#fde047', '#ffffff'];
      let spawned = 0;
      for (let i = 0; i < POP_MAX && spawned < 12; i++) {
        const p = popParticles[i];
        if (!p.active) {
          p.active = true;
          p.life = 0;
          p.maxLife = 0.45 + Math.random() * 0.25;
          p.pos.copy(origin).add(new THREE.Vector3(0, 0.9, 0));
          const angle = (spawned / 12) * Math.PI * 2 + Math.random() * 0.3;
          const speed = 2.2 + Math.random() * 2.0;
          p.vel.set(Math.cos(angle) * speed, 2.5 + Math.random() * 2.2, Math.sin(angle) * speed);
          p.color.set(palette[spawned % palette.length]);
          popMesh.setColorAt(i, p.color);
          spawned++;
        }
      }
      if (popMesh.instanceColor) popMesh.instanceColor.needsUpdate = true;
    }

    function updatePopParticles(dt) {
      let dirty = false;
      for (let i = 0; i < POP_MAX; i++) {
        const p = popParticles[i];
        if (!p.active) continue;
        dirty = true;
        p.life += dt;
        if (p.life >= p.maxLife) {
          p.active = false;
          tempMatrix.makeScale(0, 0, 0);
          popMesh.setMatrixAt(i, tempMatrix);
          continue;
        }
        p.vel.y -= 7.5 * dt;
        p.pos.addScaledVector(p.vel, dt);
        const s = 1.0 - (p.life / p.maxLife);
        tempQuat.setFromEuler(new THREE.Euler(p.life * 8, p.life * 6, 0));
        tempScale.set(s, s, s);
        tempMatrix.compose(p.pos, tempQuat, tempScale);
        popMesh.setMatrixAt(i, tempMatrix);
      }
      if (dirty) popMesh.instanceMatrix.needsUpdate = true;
    }

    // ============================================================================
    // 8. TOUHOU FUMO VOXEL PLUSHIE BUILDER & SOFT-BODY PHYSICS CLASS
    // ============================================================================
    // const allFumoRaycastMeshes = [];
    // const fumos = [];

    class VoxelFumo {
      constructor(config) {
        this.id = config.id;
        this.name = config.name;
        this.emoji = config.emoji || '🎀';
        this.accentColor = config.accentColor || '#ef4444';
        this.scaleFactor = config.scale || 1.0;
        this.FV = 0.082 * this.scaleFactor;
        this.radius = 0.85 * this.scaleFactor;
        this.pitchAudio = config.pitchAudio || 1.0;
        this.isSleeping = Boolean(config.isSleeping);
        this.isTangled = Boolean(config.isTangled);
        this.isHalfSewn = Boolean(config.isHalfSewn);

        this.homePos = config.homePos.clone();
        this.homeYaw = config.homeYaw || 0;

        this.pos = this.homePos.clone();
        this.vel = new THREE.Vector3();
        this.yaw = this.homeYaw;
        this.pitch = 0;
        this.roll = 0;
        this.angVel = new THREE.Vector3();
        this.isGrounded = true;
        this.isDragged = false;
        this.inBoxCooldown = 0;

        this.squash = 1.0;
        this.squashVel = 0.0;

        this.headPitch = 0.0;
        this.headRoll = 0.0;
        this.headPitchVel = 0.0;
        this.headRollVel = 0.0;

        this.limbPitch = 0.0;
        this.limbRoll = 0.0;
        this.limbPitchVel = 0.0;
        this.limbRollVel = 0.0;

        this.root = new THREE.Group();
        this.squashGroup = new THREE.Group();
        this.root.add(this.squashGroup);

        this.headPivot = new THREE.Group();
        this.headPivot.position.set(0, 7.2 * this.FV, 0);
        this.squashGroup.add(this.headPivot);

        this.leftArmPivot = new THREE.Group();
        this.leftArmPivot.position.set(-4.2 * this.FV, 6.2 * this.FV, 0.5 * this.FV);
        this.squashGroup.add(this.leftArmPivot);

        this.rightArmPivot = new THREE.Group();
        this.rightArmPivot.position.set(4.2 * this.FV, 6.2 * this.FV, 0.5 * this.FV);
        this.squashGroup.add(this.rightArmPivot);

        this.leftLegPivot = new THREE.Group();
        this.leftLegPivot.position.set(-2.3 * this.FV, 1.8 * this.FV, 3.2 * this.FV);
        this.squashGroup.add(this.leftLegPivot);

        this.rightLegPivot = new THREE.Group();
        this.rightLegPivot.position.set(2.3 * this.FV, 1.8 * this.FV, 3.2 * this.FV);
        this.squashGroup.add(this.rightLegPivot);

        this.wingsPivot = new THREE.Group();
        this.wingsPivot.position.set(0, 4.8 * this.FV, -3.5 * this.FV);
        this.squashGroup.add(this.wingsPivot);

        this.buildCharacterVoxels(config);
        this.syncTransform(0);
        scene.add(this.root);
      }

      buildCharacterVoxels(cfg) {
        const bodyVoxels = [];
        const headVoxels = [];
        const leftArmVoxels = [];
        const rightArmVoxels = [];
        const leftLegVoxels = [];
        const rightLegVoxels = [];
        const wingSolidVoxels = [];
        const wingGlowVoxels = [];

        const skinBase = '#ffe5d4';
        const blushCol = '#ff9ebb';
        const smileCol = '#4a2525';

        const addPlushVoxel = (arr, x, y, z, col, isSeam = false) => {
          const seamDarken = (isSeam && ((Math.abs(x + y + z) % 2) === 0)) ? 0.055 : 0;
          arr.push({
            x, y, z,
            color: varyColor(col, x + this.id.length * 7, y, z, 0.04, seamDarken)
          });
        };

        // 1. STUBBY SITTING TORSO
        for (let y = 0; y <= 7; y++) {
          const rMax = (y === 0 || y === 7) ? 3.4 : 4.2 - (y * 0.12);
          for (let x = -4; x <= 4; x++) {
            for (let z = -3; z <= 3; z++) {
              const dist = Math.hypot(x, z * 1.15);
              if (dist > rMax) continue;

              const isSideSeam = (z === 0 && Math.abs(x) >= rMax - 0.9);
              let col = cfg.outfitMain;

              if (this.isHalfSewn && x > 0) {
                col = ((y + z) % 2 === 0) ? '#e2e8f0' : '#cbd5e1'; // Unfinished muslin pattern half!
              } else {
                if (y === 1 && z >= 1) col = '#ffffff';
                if (cfg.hasWhiteApron && z >= 1 && Math.abs(x) <= 2 && y <= 5) {
                  col = '#fcfcfc';
                }
                if (y >= 5 && z >= 2 && Math.abs(x) <= 2) {
                  col = '#ffffff';
                  if (Math.abs(x) <= 1 && y === 5) col = cfg.tieColor || '#ef4444';
                }
                if (this.id === 'remilia' && z >= 2 && x === 0 && y >= 2 && y <= 6) {
                  col = '#d90429';
                }
                if (this.id === 'flandre' && z >= 2 && Math.abs(x) === 1 && y === 4) {
                  col = '#fde047';
                }
              }

              // If tangled in thread, wrap bright rainbow yarn strands around the torso!
              if (this.isTangled && ((y + x) % 3 === 0) && dist >= rMax - 1.1) {
                col = (y % 2 === 0) ? '#f43f5e' : '#38bdf8';
              }

              addPlushVoxel(bodyVoxels, x, y + 0.5, z, col, isSideSeam);
            }
          }
        }

        // Extra visible thread spool & yarn loops if tangled!
        if (this.isTangled) {
          for (let t = -4; t <= 4; t++) {
            addPlushVoxel(bodyVoxels, t, 3.5, 3.3, '#f43f5e');
            addPlushVoxel(bodyVoxels, t * 0.8, 5.2, 3.1, '#38bdf8');
          }
        }

        // 2. SHORT DANGLING ARMS
        for (const side of [-1, 1]) {
          const targetArr = side === -1 ? leftArmVoxels : rightArmVoxels;
          for (let y = -3; y <= 0; y++) {
            for (let x = -1; x <= 1; x++) {
              for (let z = -1; z <= 1; z++) {
                if (Math.abs(x) === 1 && Math.abs(z) === 1 && y === -3) continue;
                let col = cfg.sleeveColor || '#ffffff';
                if (y === -3) col = skinBase;
                else if (this.id === 'reimu' && y === -1) col = '#e63946';
                addPlushVoxel(targetArr, x * 0.85 + side * 0.4, y, z * 0.85, col, x === 0);
              }
            }
          }
        }

        // 3. SHORT SITTING / DANGLING LEGS WITH SHOES
        for (const side of [-1, 1]) {
          const targetArr = side === -1 ? leftLegVoxels : rightLegVoxels;
          for (let z = 0; z <= 4; z++) {
            for (let x = -1; x <= 1; x++) {
              for (let y = -1; y <= 1; y++) {
                if (Math.abs(x) === 1 && Math.abs(y) === 1) continue;
                let col = '#ffffff';
                if (z === 0) col = skinBase;
                if (z >= 3) col = cfg.shoeColor || '#2b2d42';
                if (z === 4 && y === 1 && x === 0) col = '#ffffff';
                addPlushVoxel(targetArr, x * 0.9, y * 0.9, z * 0.9, col, y === 0);
              }
            }
          }
        }

        // 4. OVERSIZED ROUND FUMO HEAD, ICONIC 'ᗜˬᗜ' FACE, HAIR & HATS
        for (let y = 0; y <= 12; y++) {
          for (let x = -7; x <= 7; x++) {
            for (let z = -6; z <= 6; z++) {
              const dy = (y - 6.0) * 1.05;
              const dx = x * 0.94;
              const dz = z * 1.02;
              const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
              if (dist > 6.4 || dist < 4.5) continue;

              let col = skinBase;
              const isHeadSeam = (z === 0 && Math.abs(x) >= 5) || (this.isHalfSewn && x === 0);

              const isBackOrTop = (z <= 1) || (y >= 9) || (Math.abs(x) >= 5 && z <= 3);
              const isForeheadBangs = (z >= 4 && y >= 7 && (Math.abs(x) !== 2 || y >= 8));
              const isSideLocks = (Math.abs(x) >= 5 && z >= 2 && y >= 2);

              if (isBackOrTop || isForeheadBangs || isSideLocks) {
                col = (this.isHalfSewn && x > 1) ? '#cbd5e1' : cfg.hairColor;
              } else if (z >= 5) {
                // Iconic Fumo Face Plane
                if ((Math.abs(x) === 3 || Math.abs(x) === 2) && y >= 4 && y <= 6) {
                  if (this.isSleeping) {
                    // Peaceful closed sleeping fumo eyes (ーˬー)
                    if (y === 5) col = '#1f141e';
                  } else {
                    if (y === 6) col = '#1f141e';
                    else if (y === 5 && Math.abs(x) === 2) col = '#ffffff';
                    else col = cfg.eyeColor;
                  }
                } else if (Math.abs(x) === 4 && y === 3) {
                  col = blushCol;
                } else if (y === 2 && Math.abs(x) <= 1) {
                  col = (x === 0) ? '#e07a7a' : smileCol;
                }
              }

              addPlushVoxel(headVoxels, x, y, z, col, isHeadSeam);
            }
          }
        }

        // If Half-Sewn Prototype Fumo, add a cute tuft of white cotton stuffing peeking out the top seam!
        if (this.isHalfSewn) {
          for (let cx = -1; cx <= 2; cx++) {
            addPlushVoxel(headVoxels, cx, 12.6, 0, '#ffffff');
            addPlushVoxel(headVoxels, cx * 0.8, 13.4, 0.4, '#ffffff');
          }
        }

        if (this.id === 'reimu') {
          for (const side of [-1, 1]) {
            for (let y = -1; y <= 5; y++) {
              const tubeCol = (y === 5) ? '#e63946' : ((y >= 1 && y <= 4) ? '#ffffff' : cfg.hairColor);
              addPlushVoxel(headVoxels, side * 6.8, y, 2.2, tubeCol);
              addPlushVoxel(headVoxels, side * 6.8, y, 3.0, tubeCol);
            }
          }
          for (let bx = -7; bx <= 7; bx++) {
            const wingHeight = Math.min(4, Math.floor(Math.abs(bx) * 0.7) + 1);
            for (let by = -wingHeight; by <= wingHeight; by++) {
              addPlushVoxel(headVoxels, bx, 12.2 + by * 0.75, -1.5 - Math.abs(bx) * 0.15, '#d90429');
            }
          }
        }

        if (this.id === 'cirno') {
          for (let bx = -6; bx <= 6; bx++) {
            const h = Math.min(3, Math.floor(Math.abs(bx) * 0.65) + 1);
            for (let by = -h; by <= h; by++) {
              addPlushVoxel(headVoxels, bx, 10.5 + by * 0.75, -4.8, '#1d4ed8');
            }
          }
          const wingAngles = [0.45, 0.05, -0.35];
          for (const side of [-1, 1]) {
            for (let w = 0; w < 3; w++) {
              const ang = wingAngles[w];
              for (let r = 1; r <= 7; r++) {
                const wx = side * (1.2 + Math.cos(ang) * r * 1.05);
                const wy = 1.0 + Math.sin(ang) * r * 1.05;
                const wz = -0.5 - r * 0.15;
                wingGlowVoxels.push({
                  x: wx, y: wy, z: wz,
                  color: varyColor(r > 5 ? '#e0f2fe' : '#38bdf8', wx, wy, wz, 0.02),
                  sx: 1.1, sy: 0.85, sz: 0.6
                });
              }
            }
          }
        }

        if (this.id === 'marisa') {
          for (let y = -1; y <= 5; y++) {
            addPlushVoxel(headVoxels, -6.6, y, 2.8, y === 0 ? '#ffffff' : cfg.hairColor);
          }
          for (let hx = -10; hx <= 10; hx++) {
            for (let hz = -10; hz <= 10; hz++) {
              const r = Math.hypot(hx, hz);
              if (r <= 10.2 && r >= 4.2) {
                const brimY = 10.2 - hz * 0.22 + Math.sin(Math.atan2(hz, hx) * 4) * 0.4;
                addPlushVoxel(headVoxels, hx, brimY, hz - 1.2, '#22222b');
              }
            }
          }
          for (let ch = 0; ch <= 9; ch++) {
            const coneR = Math.max(0.8, 5.2 - ch * 0.52);
            for (let hx = -6; hx <= 6; hx++) {
              for (let hz = -6; hz <= 6; hz++) {
                const r = Math.hypot(hx, hz);
                if (r <= coneR && r >= coneR - 1.3) {
                  const isRibbon = (ch === 1 || ch === 2);
                  addPlushVoxel(headVoxels, hx, 10.8 + ch * 0.9 - hz * 0.18, hz - 1.5 - ch * 0.28, isRibbon ? '#f8f9fa' : '#22222b');
                }
              }
            }
          }
          for (let bx = -3; bx <= 3; bx++) {
            addPlushVoxel(headVoxels, bx, 11.8, 3.8, '#ffffff');
            if (Math.abs(bx) >= 1) addPlushVoxel(headVoxels, bx, 12.6, 3.8, '#ffffff');
          }
        }

        if (this.id === 'flandre') {
          for (let py = 2; py <= 7; py++) {
            addPlushVoxel(headVoxels, -7.2 - (7 - py) * 0.3, py, 0.5, py === 6 ? '#e63946' : cfg.hairColor);
          }
          for (let hx = -7; hx <= 7; hx++) {
            for (let hz = -7; hz <= 5; hz++) {
              const r = Math.hypot(hx, hz);
              if (r <= 6.8 && r >= 4.8) {
                addPlushVoxel(headVoxels, hx, 11.2, hz, '#ffe5ec');
                addPlushVoxel(headVoxels, hx, 12.1, hz * 0.85, '#e63946');
                addPlushVoxel(headVoxels, hx * 0.8, 12.9, hz * 0.75, '#ffe5ec');
              }
            }
          }
          const crystalColors = ['#38bdf8', '#3b82f6', '#a855f7', '#ec4899', '#f97316', '#fde047', '#4ade80', '#ef4444'];
          for (const side of [-1, 1]) {
            for (let rx = 1; rx <= 9; rx++) {
              const branchY = 2.5 + (rx <= 4 ? rx * 0.45 : (4 * 0.45 - (rx - 4) * 0.35));
              wingSolidVoxels.push({
                x: side * rx, y: branchY, z: -0.5,
                color: new THREE.Color('#1e1b24'),
                sx: 0.9, sy: 0.65, sz: 0.65
              });
              if (rx % 2 === 0 && rx <= 8) {
                const cIdx = (side === -1 ? (rx / 2 - 1) : (3 + rx / 2));
                const cHex = crystalColors[cIdx % 8];
                for (let cy = -2; cy <= 0; cy++) {
                  const width = (cy === -1) ? 1.35 : 0.75;
                  wingGlowVoxels.push({
                    x: side * (rx + 0.3),
                    y: branchY - 1.1 + cy * 0.95,
                    z: -0.5,
                    color: new THREE.Color(cHex),
                    sx: width, sy: 0.95, sz: 0.75
                  });
                }
              }
            }
          }
        }

        if (this.id === 'remilia') {
          for (let hx = -8; hx <= 8; hx++) {
            for (let hz = -7; hz <= 6; hz++) {
              const r = Math.hypot(hx, hz);
              if (r <= 7.4 && r >= 4.5) {
                addPlushVoxel(headVoxels, hx, 11.0, hz, '#ffc2d1');
                if (r <= 6.4) addPlushVoxel(headVoxels, hx, 12.0, hz, '#d90429');
                if (r <= 5.5) addPlushVoxel(headVoxels, hx, 13.0, hz, '#ffe5ec');
              }
            }
          }
          for (const side of [-1, 1]) {
            for (let wx = 1; wx <= 6; wx++) {
              const topY = 2.0 + Math.sin((wx / 6) * Math.PI) * 2.5;
              for (let wy = -1; wy <= topY; wy++) {
                wingSolidVoxels.push({
                  x: side * wx, y: wy, z: -0.6 - wx * 0.15,
                  color: varyColor('#2b193d', wx, wy, 0, 0.03)
                });
              }
            }
          }
        }

        if (this.id === 'sakuya') {
          for (const side of [-1, 1]) {
            for (let y = -2; y <= 5; y++) {
              const col = (y <= -1) ? '#22c55e' : cfg.hairColor;
              addPlushVoxel(headVoxels, side * 6.5, y, 3.2, col);
            }
          }
          for (let hx = -6; hx <= 6; hx++) {
            addPlushVoxel(headVoxels, hx, 11.8, 1.8 - Math.abs(hx) * 0.15, Math.abs(hx) === 6 ? '#22c55e' : '#ffffff');
            addPlushVoxel(headVoxels, hx, 12.5, 1.5 - Math.abs(hx) * 0.15, '#ffffff');
          }
        }

        const registerPart = (voxels, parent, mat = plushMaterial) => {
          const m = buildVoxelInstancedMesh(voxels, this.FV, mat, true, true);
          if (m) {
            m.userData.fumo = this;
            parent.add(m);
            allFumoRaycastMeshes.push(m);
          }
          return m;
        };

        registerPart(bodyVoxels, this.squashGroup);
        registerPart(headVoxels, this.headPivot);
        registerPart(leftArmVoxels, this.leftArmPivot);
        registerPart(rightArmVoxels, this.rightArmPivot);
        registerPart(leftLegVoxels, this.leftLegPivot);
        registerPart(rightLegVoxels, this.rightLegPivot);
        registerPart(wingSolidVoxels, this.wingsPivot);
        if (wingGlowVoxels.length > 0) {
          const wMat = (this.id === 'cirno') ? translucentIceMaterial : crystalWingMaterial;
          registerPart(wingGlowVoxels, this.wingsPivot, wMat);
        }
      }

      squeeze(strength = 1.0) {
        this.squash = Math.max(0.52, this.squash - 0.42 * strength);
        this.squashVel = -3.5 * strength;
        this.headPitchVel += (Math.random() - 0.5) * 14 * strength;
        this.headRollVel += (Math.random() > 0.5 ? 1 : -1) * 11 * strength;
        this.limbPitch = -0.65 * strength;
        this.limbPitchVel = -6.0 * strength;
        spawnSqueezeParticles(this.pos, this.accentColor);
        soundFX.playSqueeze(this.pitchAudio);
      }

      resetToHome() {
        this.pos.copy(this.homePos);
        this.vel.set(0, 0, 0);
        this.yaw = this.homeYaw;
        this.pitch = 0;
        this.roll = 0;
        this.angVel.set(0, 0, 0);
        this.isGrounded = true;
        this.isDragged = false;
        this.squeeze(0.75);
      }

      updatePhysics(dt, time) {
        if (this.inBoxCooldown > 0) {
          this.inBoxCooldown = Math.max(0, this.inBoxCooldown - dt);
        }

        const squashStiff = 210.0;
        const squashDamp = 11.5;
        const squashForce = (1.0 - this.squash) * squashStiff - this.squashVel * squashDamp;
        this.squashVel += squashForce * dt;
        this.squash += this.squashVel * dt;
        this.squash = THREE.MathUtils.clamp(this.squash, 0.45, 1.55);

        const headStiff = 140.0;
        const headDamp = 7.5;
        const idleHeadBob = Math.sin(time * 2.2 + this.homePos.x) * (this.isSleeping ? 0.045 : 0.025);
        this.headPitchVel += ((idleHeadBob - this.headPitch) * headStiff - this.headPitchVel * headDamp) * dt;
        this.headRollVel += ((0 - this.headRoll) * headStiff - this.headRollVel * headDamp) * dt;
        this.headPitch = THREE.MathUtils.clamp(this.headPitch + this.headPitchVel * dt, -0.55, 0.55);
        this.headRoll = THREE.MathUtils.clamp(this.headRoll + this.headRollVel * dt, -0.55, 0.55);

        const targetLimbPitch = (this.isDragged || !this.isGrounded) ? 0.58 : 0.0;
        const limbStiff = 120.0;
        const limbDamp = 8.0;
        this.limbPitchVel += ((targetLimbPitch - this.limbPitch) * limbStiff - this.limbPitchVel * limbDamp) * dt;
        this.limbRollVel += ((0 - this.limbRoll) * limbStiff - this.limbRollVel * limbDamp) * dt;
        this.limbPitch = THREE.MathUtils.clamp(this.limbPitch + this.limbPitchVel * dt, -0.8, 0.9);
        this.limbRoll = THREE.MathUtils.clamp(this.limbRoll + this.limbRollVel * dt, -0.6, 0.6);

        if (!this.isDragged) {
          this.vel.y -= 24.0 * dt;
          this.vel.multiplyScalar(Math.pow(0.985, dt * 60));

          this.pos.addScaledVector(this.vel, dt);

          this.yaw += this.angVel.y * dt;
          this.pitch += this.angVel.x * dt;
          this.roll += this.angVel.z * dt;
          this.angVel.multiplyScalar(Math.pow(0.92, dt * 60));

          this.isGrounded = false;
          let onConveyor = false;

          if (this.pos.y < 0) {
            const impact = -this.vel.y;
            this.pos.y = 0;
            if (impact > 1.8) {
              this.vel.y = impact * 0.42;
              this.squashVel -= Math.min(9.0, impact * 0.95);
              this.headPitchVel += (Math.random() - 0.5) * impact * 2.0;
              this.headRollVel += (Math.random() - 0.5) * impact * 2.0;
              soundFX.playBounce(impact * 0.08);
            } else {
              this.vel.y = 0;
              this.isGrounded = true;
            }
            this.vel.x *= 0.82;
            this.vel.z *= 0.82;
          }

          const minBoundX = -9.6;
          const maxBoundX = 9.6;
          const minBoundZ = -8.6;
          const maxBoundZ = 8.8;
          if (this.pos.x < minBoundX) {
            this.pos.x = minBoundX;
            this.vel.x = Math.abs(this.vel.x) * 0.48;
          } else if (this.pos.x > maxBoundX) {
            this.pos.x = maxBoundX;
            this.vel.x = -Math.abs(this.vel.x) * 0.48;
          }
          if (this.pos.z < minBoundZ) {
            this.pos.z = minBoundZ;
            this.vel.z = Math.abs(this.vel.z) * 0.48;
          } else if (this.pos.z > maxBoundZ) {
            this.pos.z = maxBoundZ;
            this.vel.z = -Math.abs(this.vel.z) * 0.48;
          }

          const r = this.radius * 0.72;
          const centerY = this.pos.y + r;

          for (let i = 0; i < furnitureColliders.length; i++) {
            const box = furnitureColliders[i];
            const cx = THREE.MathUtils.clamp(this.pos.x, box.min.x, box.max.x);
            const cy = THREE.MathUtils.clamp(centerY, box.min.y, box.max.y);
            const cz = THREE.MathUtils.clamp(this.pos.z, box.min.z, box.max.z);

            const dx = this.pos.x - cx;
            const dy = centerY - cy;
            const dz = this.pos.z - cz;
            const distSq = dx * dx + dy * dy + dz * dz;

            if (distSq < r * r) {
              const dist = Math.sqrt(distSq);
              if (centerY >= box.max.y - 0.25 && this.vel.y <= 0.5) {
                const impact = -this.vel.y;
                this.pos.y = box.max.y;
                if (impact > 2.0) {
                  this.vel.y = impact * 0.38;
                  this.squashVel -= Math.min(8.5, impact * 0.85);
                  this.headPitchVel += (Math.random() - 0.5) * impact * 1.8;
                  soundFX.playBounce(impact * 0.08);
                } else {
                  this.vel.y = 0;
                  this.isGrounded = true;
                }

                if (box.name === 'conveyor_belt') {
                  onConveyor = true;
                } else if (box.name === 'interactive_shipping_box' && this.inBoxCooldown <= 0) {
                  // Landed inside the Interactive Shipping Box! Close flaps with a bounce!
                  this.inBoxCooldown = 4.0;
                  triggerBoxPackBounce(this);
                } else {
                  this.vel.x *= 0.80;
                  this.vel.z *= 0.80;
                }
              } else if (dist > 0.0001) {
                const nx = dx / dist;
                const ny = dy / dist;
                const nz = dz / dist;
                const pen = r - dist;
                this.pos.x += nx * pen;
                this.pos.y = Math.max(0, this.pos.y + ny * pen);
                this.pos.z += nz * pen;

                const vn = this.vel.x * nx + this.vel.y * ny + this.vel.z * nz;
                if (vn < 0) {
                  const imp = -vn;
                  this.vel.x -= (1.42) * vn * nx;
                  this.vel.y -= (1.42) * vn * ny;
                  this.vel.z -= (1.42) * vn * nz;
                  if (imp > 2.0) {
                    this.squashVel -= Math.min(6.0, imp * 0.55);
                    soundFX.playBounce(imp * 0.06);
                  }
                }
              }
            }
          }

          // Conveyor Belt Friction: smoothly carry the Fumo along +X toward the shipping box!
          if (onConveyor) {
            this.vel.x = THREE.MathUtils.lerp(this.vel.x, CONVEYOR_BOUNDS.speed, Math.min(1, dt * 8.5));
            this.vel.z = THREE.MathUtils.lerp(this.vel.z, (0 - this.pos.z) * 2.2, Math.min(1, dt * 5.0));
            this.headPitchVel += Math.sin(time * 12) * 0.15;
          }

          // Loop conveyor fumo back to the start of the belt after being packed in the box!
          if (
            this.id === 'halfsewn' &&
            this.inBoxCooldown > 1.8 &&
            this.inBoxCooldown < 2.1 &&
            Math.hypot(this.pos.x - GIFT_BOX_ZONE.center.x, this.pos.z - GIFT_BOX_ZONE.center.z) < 1.5
          ) {
            this.pos.set(-5.8, CONVEYOR_BOUNDS.topY + 0.6, 0.0);
            this.vel.set(0.5, 0, 0);
            this.squash = 0.72;
          }

          if (this.isGrounded) {
            this.pitch = THREE.MathUtils.lerp(this.pitch, 0, Math.min(1, dt * 9.5));
            this.roll = THREE.MathUtils.lerp(this.roll, 0, Math.min(1, dt * 9.5));
            this.angVel.multiplyScalar(0.75);
          }
        }

        this.syncTransform(time);
      }

      syncTransform(time) {
        this.root.position.copy(this.pos);
        this.root.rotation.order = 'YXZ';
        this.root.rotation.set(this.pitch, this.yaw, this.roll);

        const sy = this.squash;
        const sxz = 1.0 / Math.sqrt(Math.max(0.35, sy));
        this.squashGroup.scale.set(sxz, sy, sxz);

        this.headPivot.rotation.set(this.headPitch, 0, this.headRoll);

        this.leftArmPivot.rotation.set(this.limbPitch, 0, 0.18 + Math.abs(this.limbPitch) * 0.35 + this.limbRoll);
        this.rightArmPivot.rotation.set(this.limbPitch, 0, -0.18 - Math.abs(this.limbPitch) * 0.35 + this.limbRoll);
        this.leftLegPivot.rotation.set(this.limbPitch * 1.15, 0.08, this.limbRoll * 0.5);
        this.rightLegPivot.rotation.set(this.limbPitch * 1.15, -0.08, this.limbRoll * 0.5);

        const wingFlutter = Math.sin(time * 3.8 + this.homePos.x) * 0.06 + (1.0 - this.squash) * 0.35;
        this.wingsPivot.rotation.x = wingFlutter;
      }
    }

    function resolveFumoToFumoCollisions() {
      for (let i = 0; i < fumos.length; i++) {
        for (let j = i + 1; j < fumos.length; j++) {
          const a = fumos[i];
          const b = fumos[j];
          const minDist = (a.radius + b.radius) * 0.78;
          const dx = b.pos.x - a.pos.x;
          const dy = (b.pos.y + b.radius * 0.6) - (a.pos.y + a.radius * 0.6);
          const dz = b.pos.z - a.pos.z;
          const distSq = dx * dx + dy * dy + dz * dz;

          if (distSq < minDist * minDist && distSq > 0.0001) {
            const dist = Math.sqrt(distSq);
            const nx = dx / dist;
            const ny = dy / dist;
            const nz = dz / dist;
            const overlap = (minDist - dist) * 0.5;

            if (!a.isDragged) {
              a.pos.x -= nx * overlap;
              a.pos.y = Math.max(0, a.pos.y - ny * overlap);
              a.pos.z -= nz * overlap;
            }
            if (!b.isDragged) {
              b.pos.x += nx * overlap;
              b.pos.y = Math.max(0, b.pos.y + ny * overlap);
              b.pos.z += nz * overlap;
            }

            const rvx = b.vel.x - a.vel.x;
            const rvy = b.vel.y - a.vel.y;
            const rvz = b.vel.z - a.vel.z;
            const vn = rvx * nx + rvy * ny + rvz * nz;
            if (vn < 0) {
              const imp = -vn * 0.68;
              if (!a.isDragged) {
                a.vel.x -= imp * nx;
                a.vel.y -= imp * ny;
                a.vel.z -= imp * nz;
                a.squashVel -= Math.min(5.0, imp * 0.6);
              }
              if (!b.isDragged) {
                b.vel.x += imp * nx;
                b.vel.y += imp * ny;
                b.vel.z += imp * nz;
                b.squashVel -= Math.min(5.0, imp * 0.6);
              }
              if (imp > 1.5) soundFX.playBounce(imp * 0.07);
            }
          }
        }
      }
    }

    // ============================================================================
    // 10. POINTER INTERACTION: RAYCASTING, SQUEEZE, PICK UP, DRAG & THROW
    // ============================================================================
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    const dragPlane = new THREE.Plane();
    const dragHitPoint = new THREE.Vector3();
    const dragOffset = new THREE.Vector3();

    let hoveredFumo = null;
    let selectedFumo = null;
    let isDraggingFumo = false;
    let pointerDownScreen = new THREE.Vector2();
    let dragHistory = [];

    const tooltipEl = document.getElementById('fumo-tooltip');
    const tooltipEmojiEl = document.getElementById('tooltip-emoji');
    const tooltipTextEl = document.getElementById('tooltip-text');
    const badgeEl = document.getElementById('fumo-badge');
    const badgeDotEl = document.getElementById('fumo-badge-dot');
    const badgeNameEl = document.getElementById('fumo-badge-name');
    const badgeStatusEl = document.getElementById('fumo-badge-status');

    function updatePointerNDC(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function pickUnderPointer() {
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(allFumoRaycastMeshes, false);
      if (hits.length > 0) {
        const obj = hits[0].object;
        if (obj.userData.fumo) {
          return { type: 'fumo', fumo: obj.userData.fumo, point: hits[0].point };
        }
        if (obj.userData.isStuffingFumo) {
          return { type: 'stuffing', point: hits[0].point };
        }
      }
      return null;
    }

    function updateUIBadge(fumo, statusText) {
      if (!fumo) {
        badgeEl.classList.add('hidden');
        badgeEl.classList.remove('flex');
        return;
      }
      badgeEl.classList.remove('hidden');
      badgeEl.classList.add('flex');
      badgeDotEl.style.backgroundColor = fumo.accentColor;
      badgeNameEl.textContent = fumo.name;
      badgeStatusEl.textContent = statusText;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      recordInteraction();
      updatePointerNDC(e);
      pointerDownScreen.set(e.clientX, e.clientY);

      const hit = pickUnderPointer();
      if (hit && hit.type === 'stuffing') {
        // Clicked the Limp Unstuffed Fumo at the Stuffing Station -> Puff it up!
        manualPuffBoost = 1.0;
        soundFX.playSqueeze(1.25);
        spawnSqueezeParticles(new THREE.Vector3(17.5 * RV, 14.0 * RV, -26.5 * RV), '#38bdf8');
        return;
      }

      if (hit && hit.type === 'fumo') {
        selectedFumo = hit.fumo;
        isDraggingFumo = false;
        controls.enabled = false;

        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        dragPlane.setFromNormalAndCoplanarPoint(camDir.negate(), selectedFumo.pos);

        if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
          dragOffset.subVectors(selectedFumo.pos, dragHitPoint);
        } else {
          dragOffset.set(0, 0, 0);
        }

        dragHistory = [{ pos: selectedFumo.pos.clone(), time: performance.now() }];
        updateUIBadge(selectedFumo, 'Selected');
      }
    });

    window.addEventListener('pointermove', (e) => {
      updatePointerNDC(e);

      if (selectedFumo) {
        recordInteraction();
        const moveDist = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);

        if (!isDraggingFumo && moveDist > 6) {
          isDraggingFumo = true;
          selectedFumo.isDragged = true;
          selectedFumo.isGrounded = false;
          selectedFumo.squashVel += 3.2;
          soundFX.playPickup();
          updateUIBadge(selectedFumo, 'Dragging — Toss on Belt or Box!');
        }

        if (isDraggingFumo) {
          raycaster.setFromCamera(pointerNDC, camera);
          if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
            const targetPos = dragHitPoint.clone().add(dragOffset);
            targetPos.x = THREE.MathUtils.clamp(targetPos.x, -9.2, 9.2);
            targetPos.y = THREE.MathUtils.clamp(targetPos.y, 0.25, 10.5);
            targetPos.z = THREE.MathUtils.clamp(targetPos.z, -8.4, 8.6);

            const prevPos = selectedFumo.pos.clone();
            selectedFumo.pos.lerp(targetPos, 0.55);

            const deltaMove = selectedFumo.pos.clone().sub(prevPos);
            selectedFumo.headRollVel -= deltaMove.x * 16.0;
            selectedFumo.headPitchVel += deltaMove.z * 16.0 - deltaMove.y * 10.0;
            selectedFumo.limbRollVel -= deltaMove.x * 22.0;
            selectedFumo.roll = THREE.MathUtils.lerp(selectedFumo.roll, THREE.MathUtils.clamp(-deltaMove.x * 1.4, -0.45, 0.45), 0.3);
            selectedFumo.pitch = THREE.MathUtils.lerp(selectedFumo.pitch, THREE.MathUtils.clamp(deltaMove.z * 1.4, -0.45, 0.45), 0.3);

            const now = performance.now();
            dragHistory.push({ pos: selectedFumo.pos.clone(), time: now });
            while (dragHistory.length > 6) dragHistory.shift();
          }
          tooltipEl.style.opacity = '0';
          renderer.domElement.style.cursor = 'grabbing';
          return;
        }
      }

      const hit = pickUnderPointer();
      if (hit && hit.type === 'fumo') {
        hoveredFumo = hit.fumo;
        renderer.domElement.style.cursor = 'grab';
        tooltipEmojiEl.textContent = hoveredFumo.emoji;
        tooltipTextEl.textContent = hoveredFumo.name;
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = `${e.clientX + 14}px`;
        tooltipEl.style.top = `${e.clientY - 18}px`;
      } else if (hit && hit.type === 'stuffing') {
        hoveredFumo = null;
        renderer.domElement.style.cursor = 'pointer';
        tooltipEmojiEl.textContent = '☁️';
        tooltipTextEl.textContent = 'Unstuffed Fumo Shell (Click to Puff!)';
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = `${e.clientX + 14}px`;
        tooltipEl.style.top = `${e.clientY - 18}px`;
      } else {
        hoveredFumo = null;
        renderer.domElement.style.cursor = 'default';
        tooltipEl.style.opacity = '0';
      }
    });

    window.addEventListener('pointerup', () => {
      if (!selectedFumo) return;
      controls.enabled = true;
      recordInteraction();

      if (!isDraggingFumo) {
        selectedFumo.squeeze(1.0);
        updateUIBadge(selectedFumo, 'Squeezed! ᗜˬᗜ');
      } else {
        selectedFumo.isDragged = false;
        const now = performance.now();
        while (dragHistory.length > 1 && now - dragHistory[0].time > 140) {
          dragHistory.shift();
        }
        if (dragHistory.length >= 2) {
          const first = dragHistory[0];
          const last = dragHistory[dragHistory.length - 1];
          const dtSec = Math.max(0.016, (last.time - first.time) / 1000);
          const throwVel = last.pos.clone().sub(first.pos).divideScalar(dtSec);
          if (throwVel.length() > 22) throwVel.setLength(22);
          selectedFumo.vel.copy(throwVel);

          const speed = throwVel.length();
          selectedFumo.angVel.set(
            throwVel.z * 0.65 + (Math.random() - 0.5) * speed * 0.4,
            (Math.random() - 0.5) * speed * 0.5,
            -throwVel.x * 0.65 + (Math.random() - 0.5) * speed * 0.4
          );
        } else {
          selectedFumo.vel.set(0, 0, 0);
        }
        updateUIBadge(selectedFumo, 'Tossed!');
      }

      selectedFumo = null;
      isDraggingFumo = false;
      renderer.domElement.style.cursor = hoveredFumo ? 'grab' : 'default';
    });

    // ============================================================================
    // 11. DAY / NIGHT SMOOTH INTERPOLATION (~2 SECONDS) & HUB INTEGRATION
    // ============================================================================
    const STORAGE_MODE_KEY = 'voxel_fumo_workshop_mode';
    let isNightMode = false;
    let dayNightProgress = 0.0; // 0.0 = Day, 1.0 = Night
    let dayNightTarget = 0.0;

    const daySkyColor = new THREE.Color('#dceeff');
    const nightSkyColor = new THREE.Color('#120f20');

    const dayBackdropCol = new THREE.Color('#82c8ff');
    const nightBackdropCol = new THREE.Color('#090d22');

    const daySunOrbCol = new THREE.Color('#fff5b8');
    const nightMoonOrbCol = new THREE.Color('#dbeafe');

    const dayWindowLightCol = new THREE.Color('#fff2d4');
    const nightWindowLightCol = new THREE.Color('#7aa2f7');

    const dayHemiSky = new THREE.Color('#fff9eb');
    const nightHemiSky = new THREE.Color('#2d294e');
    const dayHemiGround = new THREE.Color('#c7a389');
    const nightHemiGround = new THREE.Color('#141122');

    const dayShaftCol = new THREE.Color('#fff2c2');
    const nightShaftCol = new THREE.Color('#6889d6');

    function notifyParentMode() {
      const modeStr = isNightMode ? 'night' : 'day';
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'modeChanged', mode: modeStr }, '*');
        }
      } catch (e) {}
    }

    function setDayNightMode(night, { immediate = false, playSound = true } = {}) {
      isNightMode = Boolean(night);
      dayNightTarget = isNightMode ? 1.0 : 0.0;
      if (immediate) {
        dayNightProgress = dayNightTarget;
      }
      document.body.classList.toggle('night-ui', isNightMode);

      try {
        localStorage.setItem(STORAGE_MODE_KEY, isNightMode ? 'night' : 'day');
      } catch (e) {}

      if (playSound) {
        soundFX.playPickup();
      }
      notifyParentMode();
    }

    function toggleDayNight() {
      setDayNightMode(!isNightMode, { immediate: false, playSound: true });
    }

    function updateDayNightTransition(dt) {
      if (Math.abs(dayNightProgress - dayNightTarget) > 0.0005) {
        const step = dt * 0.52; // ~2 seconds transition
        if (dayNightProgress < dayNightTarget) {
          dayNightProgress = Math.min(dayNightTarget, dayNightProgress + step);
        } else {
          dayNightProgress = Math.max(dayNightTarget, dayNightProgress - step);
        }
      }

      const t = dayNightProgress < 0.5
        ? 4 * dayNightProgress * dayNightProgress * dayNightProgress
        : 1 - Math.pow(-2 * dayNightProgress + 2, 3) / 2;

      // 1. Background & Fog
      scene.background.lerpColors(daySkyColor, nightSkyColor, t);
      scene.fog.color.copy(scene.background);

      // 2. Window Exterior Sky & Sun/Moon Orb
      windowBackdropMat.color.lerpColors(dayBackdropCol, nightBackdropCol, t);
      celestialMat.color.lerpColors(daySunOrbCol, nightMoonOrbCol, t);
      celestialOrb.position.y = THREE.MathUtils.lerp(7.5, 8.2, t);
      celestialOrb.position.z = THREE.MathUtils.lerp(-4.2, -1.8, t);

      // 3. Window Directional Light (Sunlight -> Moonlight)
      windowDirLight.color.lerpColors(dayWindowLightCol, nightWindowLightCol, t);
      windowDirLight.intensity = THREE.MathUtils.lerp(1.28, 0.34, t);

      // 4. Hemisphere & Fill Lights
      hemiLight.color.lerpColors(dayHemiSky, nightHemiSky, t);
      hemiLight.groundColor.lerpColors(dayHemiGround, nightHemiGround, t);
      hemiLight.intensity = THREE.MathUtils.lerp(0.72, 0.24, t);
      fillLight.intensity = THREE.MathUtils.lerp(0.34, 0.08, t);

      // 5. Night Workshop Cozy Lamps & Heater Glow
      sewingLampLight.intensity = THREE.MathUtils.lerp(0.08, 1.45, t);
      heaterGlowLight.intensity = THREE.MathUtils.lerp(0.12, 1.35, t);
      stringGlowLight.intensity = THREE.MathUtils.lerp(0.06, 0.95, t);
      craftLampLight.intensity = THREE.MathUtils.lerp(0.06, 1.05, t);

      // 6. Emissive Material Strengths & Light Shafts
      warmBulbMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.25, 2.25, t);
      heaterCoilMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.35, 2.15, t);
      translucentIceMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.2, 0.78, t);
      crystalWingMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.28, 1.18, t);

      shaftMat.color.lerpColors(dayShaftCol, nightShaftCol, t);
      shaftMat.opacity = THREE.MathUtils.lerp(0.10, 0.055, t);

      // 7. UnrealBloomPass Strength
      if (bloomPass) {
        bloomPass.strength = THREE.MathUtils.lerp(0.15, 0.70, t);
        bloomPass.threshold = THREE.MathUtils.lerp(0.84, 0.62, t);
      }
    }

    // Button & Keyboard Event Listeners
    document.getElementById('btn-reset').addEventListener('click', () => {
      fumos.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 45));
      updateUIBadge(null, '');
    });

    document.getElementById('btn-squeeze-all').addEventListener('click', () => {
      manualPuffBoost = 1.0;
      fumos.forEach((f, idx) => setTimeout(() => f.squeeze(1.05), idx * 55));
    });

    const btnSound = document.getElementById('btn-sound');
    const iconSoundOn = document.getElementById('icon-sound-on');
    const iconSoundOff = document.getElementById('icon-sound-off');
    btnSound.addEventListener('click', () => {
      soundFX.enabled = !soundFX.enabled;
      iconSoundOn.classList.toggle('hidden', !soundFX.enabled);
      iconSoundOff.classList.toggle('hidden', soundFX.enabled);
      if (soundFX.enabled) soundFX.playPickup();
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      const key = e.key.toLowerCase();
      if (key === 'n') {
        e.preventDefault();
        toggleDayNight();
      } else if (key === 'r') {
        fumos.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 45));
      } else if (key === ' ') {
        e.preventDefault();
        manualPuffBoost = 1.0;
        fumos.forEach((f, idx) => setTimeout(() => f.squeeze(1.05), idx * 55));
      } else if (key === 'm') {
        btnSound.click();
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================================
    // 12. MAIN ANIMATION, PAUSE / RESUME & HUB MESSAGE LISTENER
    // ============================================================================
    let prevTime = performance.now();
    let isPaused = false;
    let rafId = null;

    function animate(now) {
      if (isPaused) return;
      rafId = requestAnimationFrame(animate);

      const dt = Math.min(0.033, Math.max(0.001, (now - prevTime) / 1000));
      prevTime = now;
      const elapsed = now * 0.001;

      if (!selectedFumo && (now - lastUserInteractionTime > 4500)) {
        controls.autoRotate = true;
      }

      controls.update();
      updateDayNightTransition(dt);
      updateSwayingCurtain(elapsed);
      updateConveyorBelt(elapsed);
      updateInflatingFumo(elapsed, dt);
      updateInteractiveBox(dt);
      updateDustAndFluff(elapsed, dt);
      updatePopParticles(dt);

      // Animate Sewing Machine Needles pumping up & down and Thread Spools unwinding!
      for (let i = 0; i < sewingNeedleMeshes.length; i++) {
        const n = sewingNeedleMeshes[i];
        n.group.position.y = n.baseY + Math.sin(elapsed * 22.0 + n.phase) * 0.14;
      }
      for (let i = 0; i < sewingSpoolMeshes.length; i++) {
        sewingSpoolMeshes[i].rotation.y = elapsed * 4.5 + i;
      }

      // Gentle breathing on the sleeping cat in the scrap basket
      if (sleepingCatGroup) {
        const catBreath = 1.0 + Math.sin(elapsed * 2.4) * 0.045;
        sleepingCatGroup.scale.set(1.0, catBreath, 1.0);
      }

      // Update Fumo soft-body & rigid-body physics
      for (let i = 0; i < fumos.length; i++) {
        fumos[i].updatePhysics(dt, elapsed);
      }
      resolveFumoToFumoCollisions();

      // Subtle warm flicker on the space heater at night
      if (isNightMode) {
        heaterGlowLight.intensity = 1.30 + Math.sin(elapsed * 9.0) * 0.08;
      }

      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    function pauseRenderLoop() {
      if (isPaused) return;
      isPaused = true;
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    function resumeRenderLoop() {
      if (!isPaused) return;
      isPaused = false;
      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    }

    // Listen for messages from the parent scene browser hub
    // Lifecycle management: Day/Night sync, pause/resume on tab visibility, and WebGL resource cleanup on destroy
    const _sceneLifecycle = new FumoSceneLifecycle({
      renderer,
      scene,
      composer: typeof composer !== 'undefined' ? composer : null,
      audio: typeof soundFX !== 'undefined' ? soundFX : (typeof audio !== 'undefined' ? audio : null),
      onToggleMode: typeof toggleDayNight === 'function' ? toggleDayNight : null,
      onSetMode: (mode) => {
        if (typeof setDayNightMode === 'function') {
          setDayNightMode(mode === 'night', { immediate: false });
        } else if (typeof toggleDayNight === 'function') {
          const isNight = document.body.classList.contains('night-ui');
          if (isNight !== (mode === 'night')) toggleDayNight();
        }
      },
      onPause: typeof pauseRenderLoop === 'function' ? pauseRenderLoop : (typeof pauseScene === 'function' ? pauseScene : null),
      onResume: typeof resumeRenderLoop === 'function' ? resumeRenderLoop : (typeof resumeScene === 'function' ? resumeScene : null)
    });

    window.onload = function () {
      let initialNight = false;
      try {
        const saved = localStorage.getItem(STORAGE_MODE_KEY);
        if (saved === 'night') initialNight = true;
      } catch (e) {}

      setDayNightMode(initialNight, { immediate: true, playSound: false });
      updateDayNightTransition(0);

      // Initial welcoming gentle bounce on all fumos
      fumos.forEach((f, idx) => {
        setTimeout(() => {
          f.squash = 0.78;
          f.squashVel = 2.0;
          f.headPitchVel = 4.0;
        }, 120 + idx * 70);
      });

      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    };
  </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Touhou Fumo Workshop — Interactive 3D Voxel Diorama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Three.js r128 + OrbitControls + Post-Processing (UnrealBloomPass) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <link rel="stylesheet" href="../Shared/fumo-scene.css">
  <style>
    /* Stand-in utility styles replacing Tailwind CDN */
    .fixed { position: fixed; }
    .top-4 { top: 1rem; }
    .right-4 { right: 1rem; }
    .bottom-4 { bottom: 1rem; }
    .left-1\/2 { left: 50%; }
    .-translate-x-1\/2 { transform: translateX(-50%); }
    .z-20 { z-index: 20; }
    .z-30 { z-index: 30; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .gap-2 { gap: 0.5rem; }
    .gap-2\.5 { gap: 0.625rem; }
    .hidden { display: none !important; }
    .rounded-2xl { border-radius: 1rem; }
    .rounded-xl { border-radius: 0.75rem; }
    .rounded-full { border-radius: 9999px; }
    .px-3\.5 { padding-left: 0.875rem; padding-right: 0.875rem; }
    .py-2\.5 { padding-top: 0.625rem; padding-bottom: 0.625rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .p-2\.5 { padding: 0.625rem; }
    .text-xs { font-size: 0.75rem; }
    .text-sm { font-size: 0.875rem; }
    .font-semibold { font-weight: 600; }
    .pointer-events-none { pointer-events: none; }
    .w-2\.5 { width: 0.625rem; }
    .h-2\.5 { height: 0.625rem; }
    .w-4 { width: 1rem; }
    .h-4 { height: 1rem; }
    .w-5 { width: 1.25rem; }
    .h-5 { height: 1.25rem; }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background-color: #181424;
    }
    h1, .font-display {
      font-family: 'Fredoka', sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 10px 28px -6px rgba(20, 15, 45, 0.18), 0 2px 6px rgba(20, 15, 45, 0.08);
      transition: background 0.5s ease, color 0.5s ease, border-color 0.5s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    body.night-ui .glass-panel {
      background: rgba(28, 23, 44, 0.80);
      border-color: rgba(245, 175, 110, 0.28);
      color: #fff5eb;
      color: #fdf4eb;
      box-shadow: 0 10px 30px -6px rgba(0, 0, 0, 0.58), 0 0 16px rgba(251, 146, 60, 0.14);
    }
    .ui-btn {

    #fumo-tooltip {
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    kbd {
      font-family: 'Fredoka', sans-serif;
      display: inline-block;
      padding: 1px 6px;
      font-size: 0.75rem;
      line-height: 1.2;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.08);
      border-bottom: 2px solid rgba(0, 0, 0, 0.18);
    }
    body.night-ui kbd {
      background: rgba(255, 255, 255, 0.14);
      border-bottom-color: rgba(255, 255, 255, 0.28);
    }
  </style>
</head>
<body class="text-slate-800">
  <div id="canvas-container"></div>

  <!-- Top-Right Controls (Top-Left kept completely clear for Hub Scene Selector & Mode Button) -->
  <div class="fixed top-4 right-4 z-20 flex items-center gap-2.5">
    <!-- Active / Hovered Fumo Status Badge -->

    <button id="btn-reset" title="Return Fumos to Workshop Stations (R)"

    <!-- Sound Toggle Button -->
    <button id="btn-sound" title="Toggle Workshop & Plush Sound Effects (M)"
      class="glass-panel ui-btn rounded-2xl p-2.5 flex items-center justify-center">
      <svg id="icon-sound-on" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
      <svg id="icon-sound-off" class="w-5 h-5 hidden opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
    </button>
  </div>

  <!-- Floating Cursor Tooltip for Hovered Fumo / Station -->
  <div id="fumo-tooltip" class="fixed z-30 opacity-0 px-3 py-1.5 rounded-xl glass-panel text-xs font-semibold flex items-center gap-2 shadow-lg">
    <span id="tooltip-emoji">🎀</span>
    <span id="tooltip-text">Reimu Fumo</span>
  </div>

  <!-- Bottom HUD Hints (Centered to avoid bottom-left Hub hint) -->
  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-20 pointer-events-none w-max max-w-[94vw]">
    <div class="glass-panel rounded-2xl px-4 py-2 text-xs font-semibold flex flex-wrap items-center justify-center gap-x-4 gap-y-1 opacity-90">
      <span>🖱️ <b>Click Fumo:</b> Squeeze</span>
      <span>📦 <b>Toss in Box or Belt:</b> Pack & Ride</span>
      <span>☁️ <b>Click Stuffing Station:</b> Puff Body</span>
      <span class="hidden sm:inline"><kbd>R</kbd> Reset</span>
      <span class="hidden md:inline"><kbd>Space</kbd> Squeeze All</span>
    </div>
  </div>

  <script>
    // ============================================================================
    // 1. PROCEDURAL WEB AUDIO SYNTHESIZER (Plush Squeaks, Box Snap, Puff & Thuds)
    // ============================================================================
    class PlushSoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Cute double-chirp plushie squeeze sound
      playSqueeze(pitchMultiplier = 1.0) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sine';
          const baseFreq = (520 + Math.random() * 80) * pitchMultiplier;
          osc1.frequency.setValueAtTime(baseFreq, now);
          osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.48, now + 0.085);
          osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.15, now + 0.16);

          gain1.gain.setValueAtTime(0.001, now);
          gain1.gain.linearRampToValueAtTime(0.11, now + 0.025);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.17);

          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.18);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(baseFreq * 1.1, now + 0.11);
          osc2.frequency.exponentialRampToValueAtTime(baseFreq * 1.65, now + 0.21);

          gain2.gain.setValueAtTime(0.001, now + 0.11);
          gain2.gain.linearRampToValueAtTime(0.08, now + 0.13);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start(now + 0.11);
          osc2.stop(now + 0.25);
        } catch (e) {}
      }

      // Soft fabric thud when a fumo bounces off workbenches
      playBounce(intensity = 0.5) {
        if (!this.enabled || intensity < 0.08) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const vol = Math.min(0.14, intensity * 0.12);

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const startFreq = 115 + Math.min(80, intensity * 35);
          osc.frequency.setValueAtTime(startFreq, now);
          osc.frequency.exponentialRampToValueAtTime(42, now + 0.09);

          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        } catch (e) {}
      }

      // Gentle whoosh on pickup
      playPickup() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(440, now + 0.09);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.05, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        } catch (e) {}
      }

      // Celebratory cardboard box close & pop chime
      playBoxPack() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const notes = [440, 554.37, 659.25, 880];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.055);
            gain.gain.setValueAtTime(0.001, now + idx * 0.055);
            gain.gain.linearRampToValueAtTime(0.07, now + idx * 0.055 + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.055 + 0.18);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.055);
            osc.stop(now + idx * 0.055 + 0.19);
          });
        } catch (e) {}
      }
    }

    const soundFX = new PlushSoundEngine();

    // ============================================================================
    // 2. COLOR & VOXEL HELPER UTILITIES
    // ============================================================================
    const tempColor = new THREE.Color();
    const tempMatrix = new THREE.Matrix4();
    const tempPos = new THREE.Vector3();
    const tempQuat = new THREE.Quaternion();
    const tempScale = new THREE.Vector3();

    function voxelHash(x, y, z) {
      let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
      return n - Math.floor(n);
    }

    function varyColor(hexOrString, x, y, z, variance = 0.035, seamDarken = 0) {
      tempColor.set(hexOrString);
      const h = voxelHash(x, y, z);
      const delta = (h - 0.5) * 2 * variance - seamDarken;
      tempColor.offsetHSL(0, (h - 0.5) * 0.03, delta);
      return tempColor.clone();
    }

    function createSoftVoxelGeometry(size = 1) {
      const s = size * 0.985;
      return new THREE.BoxGeometry(s, s, s);
    }

    function buildVoxelInstancedMesh(voxels, unitSize, material, castShadow = true, receiveShadow = true) {
      if (!voxels || voxels.length === 0) return null;
      const geom = createSoftVoxelGeometry(unitSize);
      const mesh = new THREE.InstancedMesh(geom, material, voxels.length);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = receiveShadow;

      for (let i = 0; i < voxels.length; i++) {
        const v = voxels[i];
        tempPos.set(v.x * unitSize, v.y * unitSize, v.z * unitSize);
        tempQuat.identity();
        tempScale.set(v.sx || 1, v.sy || 1, v.sz || 1);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        mesh.setMatrixAt(i, tempMatrix);
        mesh.setColorAt(i, v.color instanceof THREE.Color ? v.color : new THREE.Color(v.color));
      }
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      return mesh;
    }

    // ============================================================================
    // 3. SCENE, CAMERA, RENDERER & POST-PROCESSING SETUP
    // ============================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#dceeff');
    scene.fog = new THREE.FogExp2('#dceeff', 0.0075);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.5, 130);
    camera.position.set(18.5, 14.5, 20.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(getOptimalPixelRatio());
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    let composer = null;
    let bloomPass = null;
    try {
      const renderPass = new THREE.RenderPass(scene, camera);
      bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.16,
        0.55,
        0.82
      );
      composer = new THREE.EffectComposer(renderer);
      composer.addPass(renderPass);
      composer.addPass(bloomPass);
    } catch (err) {
      composer = null;
    }

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0.0, 3.6, -0.5);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.minPolarAngle = Math.PI * 0.08;
    controls.minDistance = 8;
    controls.maxDistance = 42;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 0.42;

    let lastUserInteractionTime = performance.now();
    const recordInteraction = () => {
      lastUserInteractionTime = performance.now();
      controls.autoRotate = false;
    };
    controls.addEventListener('start', recordInteraction);

    // ============================================================================
    // 4. LIGHTING & DAY/NIGHT SYSTEM (Capped Dynamic Lights for Performance)
    // ============================================================================
    // 1. Hemisphere Light (Sky / Workshop Floor Bounce)
    const hemiLight = new THREE.HemisphereLight(0xfff9eb, 0xc7a389, 0.72);
    hemiLight.position.set(0, 22, 0);
    scene.add(hemiLight);

    // 2. Main Workshop Window Directional Light (Warm Sunlight -> Cool Moonlight)
    const windowDirLight = new THREE.DirectionalLight(0xfff2d4, 1.28);
    windowDirLight.position.set(-20, 15, -2);
    windowDirLight.target.position.set(1, 2, 0);
    scene.add(windowDirLight.target);
    windowDirLight.castShadow = true;
    windowDirLight.shadow.mapSize.width = 2048;
    windowDirLight.shadow.mapSize.height = 2048;
    windowDirLight.shadow.camera.near = 2;
    windowDirLight.shadow.camera.far = 48;
    const dCam = 15.0;
    windowDirLight.shadow.camera.left = -dCam;
    windowDirLight.shadow.camera.right = dCam;
    windowDirLight.shadow.camera.top = dCam;
    windowDirLight.shadow.camera.bottom = -dCam;
    windowDirLight.shadow.bias = -0.0006;
    windowDirLight.shadow.radius = 2.5;
    scene.add(windowDirLight);

    // 3. Soft Open-Side Fill Directional Light
    const fillLight = new THREE.DirectionalLight(0xffeedd, 0.34);
    fillLight.position.set(15, 12, 15);
    scene.add(fillLight);

    // 4. Sewing Machine Brass Gooseneck Lamp (Casts soft shadows at Night!)
    const sewingLampLight = new THREE.PointLight(0xffaa44, 0.05, 14, 1.5);
    sewingLampLight.position.set(-0.2, 5.2, -6.5);
    sewingLampLight.castShadow = true;
    sewingLampLight.shadow.mapSize.width = 1024;
    sewingLampLight.shadow.mapSize.height = 1024;
    sewingLampLight.shadow.bias = -0.001;
    scene.add(sewingLampLight);

    // 5. Cozy Floor Heater Warm Orange Glow (Near the sleeping cat basket)
    const heaterGlowLight = new THREE.PointLight(0xff5a1f, 0.1, 9.5, 1.7);
    heaterGlowLight.position.set(0.2, 1.2, 5.2);
    scene.add(heaterGlowLight);

    // 6. Overhead String Lights Warm Workshop Glow
    const stringGlowLight = new THREE.PointLight(0xffbe6b, 0.05, 20, 1.4);
    stringGlowLight.position.set(0.0, 10.2, -3.5);
    scene.add(stringGlowLight);

    // 7. Embroidery & Packaging Desk Lamp Glow
    const craftLampLight = new THREE.PointLight(0xffb454, 0.05, 11, 1.6);
    craftLampLight.position.set(-5.8, 4.8, 4.8);
    scene.add(craftLampLight);

    // Shared Materials
    const plushMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.92,
      metalness: 0.02
    });

    const roomSolidMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.82,
      metalness: 0.05
    });

    const glossyPropMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.26,
      metalness: 0.18
    });

    const translucentIceMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.82,
      roughness: 0.15,
      metalness: 0.05,
      transmission: 0.35,
      emissive: new THREE.Color(0x38bdf8),
      emissiveIntensity: 0.25
    });

    const crystalWingMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.2,
      metalness: 0.1,
      emissive: new THREE.Color(0xffffff),
      emissiveIntensity: 0.32
    });

    const warmBulbMaterial = new THREE.MeshStandardMaterial({
      color: 0xfff3d1,
      emissive: new THREE.Color(0xffaa33),
      emissiveIntensity: 0.35,
      roughness: 0.2
    });

    const heaterCoilMaterial = new THREE.MeshStandardMaterial({
      color: 0xffcfb3,
      emissive: new THREE.Color(0xff4d00),
      emissiveIntensity: 0.45,
      roughness: 0.25
    });

    // ============================================================================
    // 5. WORKSHOP ARCHITECTURE, STATIONS, PROPS & COLLIDER REGISTRY
    // ============================================================================
    const allFumoRaycastMeshes = []; // <-- ADD THIS HERE
    const fumos = [];                // <-- ADD THIS HERE

    const RV = 0.25; // 1 Room Voxel = 0.25 world units
    const furnitureColliders = [];
    function addCollider(minX, minY, minZ, maxX, maxY, maxZ, name = 'prop') {
      furnitureColliders.push({
        min: new THREE.Vector3(minX, minY, minZ),
        max: new THREE.Vector3(maxX, maxY, maxZ),
        name
      });
    }

    const solidRoomVoxels = [];
    const glossyRoomVoxels = [];
    const warmBulbVoxels = [];
    const heaterCoilVoxels = [];
    const glassVoxels = [];

    function pushVoxel(list, rx, ry, rz, colorHex, variance = 0.03, sx = 1, sy = 1, sz = 1) {
      list.push({
        x: rx,
        y: ry,
        z: rz,
        color: varyColor(colorHex, rx, ry, rz, variance),
        sx, sy, sz
      });
    }

    function pushBoxVoxels(list, x0, y0, z0, x1, y1, z1, colorFnOrHex, variance = 0.03) {
      for (let x = x0; x <= x1; x++) {
        for (let y = y0; y <= y1; y++) {
          for (let z = z0; z <= z1; z++) {
            if (x > x0 && x < x1 && y > y0 && y < y1 && z > z0 && z < z1) continue;
            const c = typeof colorFnOrHex === 'function' ? colorFnOrHex(x, y, z) : colorFnOrHex;
            if (c) pushVoxel(list, x, y, z, c, variance);
          }
        }
      }
    }

    // ----------------------------------------------------------------------------
    // 5A. WORKSHOP FLOOR, WALLS & LARGE ARCHED ARTISAN WINDOWS
    // ----------------------------------------------------------------------------
    function buildWorkshopStructure() {
      // Floor: rx from -42 to 41, rz from -38 to 37 (21 x 19 world units)
      for (let x = -42; x <= 41; x++) {
        for (let z = -38; z <= 37; z++) {
          const isEdge = (x === 41 || z === 37 || x === -42 || z === -38);
          const plankIndex = Math.floor((x + 42) / 4);
          const plankSeam = ((z + 38 + plankIndex * 7) % 14 === 0) || ((x + 42) % 4 === 0);
          const woodCol = plankSeam ? '#6f482e' : ((plankIndex % 2 === 0) ? '#966543' : '#8a5a3a');
          pushVoxel(solidRoomVoxels, x + 0.5, -0.5, z + 0.5, woodCol, 0.025);
          if (isEdge) {
            pushVoxel(solidRoomVoxels, x + 0.5, -1.5, z + 0.5, '#593820', 0.02);
          }
        }
      }

      // Cozy Artisan Runner Mat in front of the workbenches (rx -28..28, rz -15..18)
      for (let x = -22; x <= 22; x++) {
        for (let z = -12; z <= 14; z++) {
          const isBorder = (Math.abs(x) >= 20 || z <= -10 || z >= 12);
          const isStitch = ((x + z) % 3 === 0);
          let matCol = '#dfd3c3';
          if (isBorder) matCol = isStitch ? '#e07a5f' : '#3d405b';
          else if ((Math.abs(x) + Math.abs(z)) % 7 === 0) matCol = '#f2cc8f';
          pushVoxel(solidRoomVoxels, x + 0.5, 0.22, z + 0.5, matCol, 0.025, 1, 0.45, 1);
        }
      }

      // Left Wall (rx = -42..-41, ry = 0..45, rz = -38..37) with TWO Large Workshop Windows!
      // Window 1: rz from -28 to -8, ry from 16 to 37
      // Window 2: rz from 4 to 24, ry from 16 to 37
      for (let y = 0; y <= 45; y++) {
        for (let z = -38; z <= 37; z++) {
          const inWin1 = (z >= -28 && z <= -8 && y >= 16 && y <= 37);
          const inWin2 = (z >= 4 && z <= 24 && y >= 16 && y <= 37);
          if (inWin1 || inWin2) continue;

          let wallCol = '#f4ece1'; // Warm plaster wall
          if (y <= 2) wallCol = '#5c3b23';
          else if (y <= 13) wallCol = (z % 4 === 0) ? '#b89f86' : '#d0bca7'; // Timber wainscoting
          else if (y === 14) wallCol = '#754c2e';
          else if (y >= 44) wallCol = '#6b4428';
          else if (z === -38 || z === 0 || z === 37) wallCol = '#754c2e'; // Exposed timber beams

          pushVoxel(solidRoomVoxels, -41.5, y + 0.5, z + 0.5, wallCol, 0.02);
        }
      }

      // Window Frames & Mullions for both Workshop Windows
      for (const [z0, z1] of [[-28, -8], [4, 24]]) {
        const zMid = Math.floor((z0 + z1) / 2);
        for (let z = z0 - 1; z <= z1 + 1; z++) {
          pushVoxel(solidRoomVoxels, -40.6, 15.5, z + 0.5, '#6e4528', 0.02, 1.6, 1, 1); // Sill
          pushVoxel(solidRoomVoxels, -40.8, 38.5, z + 0.5, '#6e4528', 0.02, 1.4, 1, 1); // Header
          if (z >= z0 && z <= z1) {
            pushVoxel(solidRoomVoxels, -41.2, 26.5, z + 0.5, '#825434', 0.02); // Crossbar
          }
        }
        for (let y = 16; y <= 38; y++) {
          pushVoxel(solidRoomVoxels, -40.8, y + 0.5, z0 - 0.5, '#6e4528', 0.02);
          pushVoxel(solidRoomVoxels, -40.8, y + 0.5, z1 + 0.5, '#6e4528', 0.02);
          pushVoxel(solidRoomVoxels, -41.2, y + 0.5, zMid + 0.5, '#825434', 0.02);
        }
      }

      // Curtain Rods above both windows
      for (let z = -31; z <= 27; z++) {
        pushVoxel(solidRoomVoxels, -39.4, 40.2, z + 0.5, '#4a2f1b', 0.015, 0.7, 0.7, 1);
      }

      // Back Wall (rz = -38..-37, ry = 0..45, rx = -41..41)
      for (let y = 0; y <= 45; y++) {
        for (let x = -41; x <= 41; x++) {
          let wallCol = '#f4ece1';
          if (y <= 2) wallCol = '#5c3b23';
          else if (y <= 13) wallCol = (x % 4 === 0) ? '#b89f86' : '#d0bca7';
          else if (y === 14) wallCol = '#754c2e';
          else if (y >= 44) wallCol = '#6b4428';
          else if (x === -14 || x === 14 || x === 41) wallCol = '#754c2e'; // Vertical timber pillars

          pushVoxel(solidRoomVoxels, x + 0.5, y + 0.5, -37.5, wallCol, 0.02);
        }
      }

      // Workshop Blueprint & Fumo Anatomy Poster on Back Wall (rx -34..-20, ry 22..36, rz -36.8)
      for (let y = 22; y <= 36; y++) {
        for (let x = -34; x <= -20; x++) {
          const isFrame = (y === 22 || y === 36 || x === -34 || x === -20);
          const dx = x + 27;
          const dy = y - 29;
          const headDist = Math.hypot(dx, dy - 1.8);
          const bodyDist = Math.hypot(dx * 1.2, dy + 3.2);
          let col = '#264653'; // Blueprint teal-blue
          if (isFrame) col = '#6e4528';
          else if (Math.abs(headDist - 3.2) < 0.65 || Math.abs(bodyDist - 2.3) < 0.65) col = '#f1faee'; // White fumo schematic lines
          else if ((x + y) % 4 === 0) col = '#2a5261';
          pushVoxel(solidRoomVoxels, x + 0.5, y + 0.5, -36.8, col, 0.015, 1, 1, 0.35);
        }
      }

      // Overhead Fairy String Lights along Back Wall and Left Wall
      for (let x = -40; x <= 40; x++) {
        const sag = Math.sin(((x + 40) / 20) * Math.PI) * 2.0;
        const y = 42.5 - Math.abs(sag);
        pushVoxel(solidRoomVoxels, x + 0.5, y, -36.7, '#3a3a3a', 0.01, 0.4, 0.4, 0.4);
        if ((x + 40) % 5 === 0) {
          pushVoxel(warmBulbVoxels, x + 0.5, y - 0.65, -36.5, '#ffea85', 0.01, 0.95, 1.15, 0.95);
        }
      }
      for (let z = -36; z <= 35; z++) {
        const sag = Math.sin(((z + 36) / 18) * Math.PI) * 2.0;
        const y = 42.5 - Math.abs(sag);
        pushVoxel(solidRoomVoxels, -40.6, y, z + 0.5, '#3a3a3a', 0.01, 0.4, 0.4, 0.4);
        if ((z + 36) % 5 === 0) {
          pushVoxel(warmBulbVoxels, -40.4, y - 0.65, z + 0.5, '#ffea85', 0.01, 0.95, 1.15, 0.95);
        }
      }
    }

    }

    // ----------------------------------------------------------------------------
    // 5C. STAGE 2: VINTAGE SEWING MACHINES BENCH (Back-Center: rx -13..12, rz -35..-22, top Y = 3.25)
    // Two cast-iron sewing machines, animated needles, spinning thread spools, and half-sewn fumo under needle!

        // Needle head housing on left (mx - 2)

        pushVoxel(glossyRoomVoxels, mx + 3.7, 17.5, -28.5, '#d4a359', 0.01, 0.5, 2.6, 2.6);

        const spoolCol = idx === 0 ? '#ef4444' : '#38bdf8';

      for (let x = -11; x <= -7; x++) {

          const isStitchedSeam = (z === -28 && x % 2 === 0);
          const col = isStitchedSeam ? '#ffffff' : ((x < -9) ? '#e63946' : '#ffe5d4');
          pushVoxel(solidRoomVoxels, x + 0.5, 13.9, z + 0.5, col, 0.03, 1, 0.75, 1);
        }
      }
      // Exposed fluffy white cotton tuft peeking out of the half-sewn seam
      pushVoxel(solidRoomVoxels, -11.2, 14.3, -28.5, '#ffffff', 0.01, 1.3, 1.1, 1.3);

      pushBoxVoxels(glossyRoomVoxels, -2, 13, -33, 0, 13, -31, '#b45309');
      for (let i = 0; i < 6; i++) {
        pushVoxel(glossyRoomVoxels, -1.0, 14.0 + i * 1.1, -32.0 + i * 0.65, '#d97706', 0.01, 0.55, 1.2, 0.55);

    function pickInteractiveEntity() {
      raycaster.setFromCamera(pointerNDC, camera);

      const fumoHits = raycaster.intersectObjects(allFumoRaycastMeshes, false);
      const pumpkinHits = raycaster.intersectObjects(allPumpkinRaycastMeshes, false);
      const orbHits = raycaster.intersectObjects(allGhostOrbMeshes, false);

      let best = null;
      const checkHit = (hits, type) => {
        if (hits.length > 0) {
          if (!best || hits[0].distance < best.distance) {
            best = { type, hit: hits[0], distance: hits[0].distance };
          }
        }
      };

      checkHit(fumoHits, 'fumo');
      checkHit(pumpkinHits, 'pumpkin');
      checkHit(orbHits, 'orb');
      return best;
    }

    function updateUIBadge(fumo, statusText) {

        badgeEl.classList.add('hidden');

      badgeEl.classList.remove('hidden');

      badgeDotEl.style.backgroundColor = fumo.accentColor;

      recordInteraction();
      updatePointerNDC(e);
      pointerDownScreen.set(e.clientX, e.clientY);

      const picked = pickInteractiveEntity();
      if (!picked) return;

      if (picked.type === 'fumo') {
        selectedFumo = picked.hit.object.userData.fumo;
        isDraggingFumo = false;
        controls.enabled = false;

        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        dragPlane.setFromNormalAndCoplanarPoint(camDir.negate(), selectedFumo.pos);

        if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
          dragOffset.subVectors(selectedFumo.pos, dragHitPoint);
        } else {
          dragOffset.set(0, 0, 0);
        }

        dragHistory = [{ pos: selectedFumo.pos.clone(), time: performance.now() }];
        updateUIBadge(selectedFumo, 'Selected');
      } else if (picked.type === 'pumpkin') {
        const pumpkin = picked.hit.object.userData.pumpkin;
        if (pumpkin) {
          pumpkin.chompAndSpitCandy();
        }
      } else if (picked.type === 'orb') {
        const orb = picked.hit.object.userData.ghostOrb;
        if (orb) {
          splitGhostOrb(orb);
        }
      }
    });

    window.addEventListener('pointermove', (e) => {
      updatePointerNDC(e);

      if (selectedFumo) {
        recordInteraction();
        const moveDist = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);

        if (!isDraggingFumo && moveDist > 6) {
          isDraggingFumo = true;
          selectedFumo.isDragged = true;
          selectedFumo.isGrounded = false;
          selectedFumo.squashVel += 3.2;
          soundFX.playPickup();
          updateUIBadge(selectedFumo, 'Dragging — Release to Throw!');
        }

        if (isDraggingFumo) {
          raycaster.setFromCamera(pointerNDC, camera);
          if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
            const targetPos = dragHitPoint.clone().add(dragOffset);
            targetPos.x = THREE.MathUtils.clamp(targetPos.x, -9.2, 9.2);
            targetPos.y = THREE.MathUtils.clamp(targetPos.y, getGroundHeightAt(targetPos.x, targetPos.z) + 0.2, 11.0);
            targetPos.z = THREE.MathUtils.clamp(targetPos.z, -9.2, 9.2);

            const prevPos = selectedFumo.pos.clone();
            selectedFumo.pos.lerp(targetPos, 0.55);

            const deltaMove = selectedFumo.pos.clone().sub(prevPos);
            selectedFumo.headRollVel -= deltaMove.x * 16.0;
            selectedFumo.headPitchVel += deltaMove.z * 16.0 - deltaMove.y * 10.0;
            selectedFumo.limbRollVel -= deltaMove.x * 22.0;
            selectedFumo.roll = THREE.MathUtils.lerp(selectedFumo.roll, THREE.MathUtils.clamp(-deltaMove.x * 1.4, -0.45, 0.45), 0.3);
            selectedFumo.pitch = THREE.MathUtils.lerp(selectedFumo.pitch, THREE.MathUtils.clamp(deltaMove.z * 1.4, -0.45, 0.45), 0.3);

            const now = performance.now();
            dragHistory.push({ pos: selectedFumo.pos.clone(), time: now });
            while (dragHistory.length > 6) dragHistory.shift();
          }
          tooltipEl.style.opacity = '0';
          renderer.domElement.style.cursor = 'grabbing';
          return;
        }
      }

      const picked = pickInteractiveEntity();
      if (picked) {
        if (picked.type === 'fumo') {
          const f = picked.hit.object.userData.fumo;
          renderer.domElement.style.cursor = 'grab';
          tooltipEmojiEl.textContent = f.emoji;
          tooltipTextEl.textContent = f.name;
        } else if (picked.type === 'pumpkin') {
          renderer.domElement.style.cursor = 'pointer';
          tooltipEmojiEl.textContent = '🎃';
          tooltipTextEl.textContent = 'Jack-o\'-Lantern (Click to Chomp Candy!)';
        } else if (picked.type === 'orb') {
          renderer.domElement.style.cursor = 'pointer';
          tooltipEmojiEl.textContent = '👻';
          tooltipTextEl.textContent = 'Ghost Orb (Click to Split!)';
        }
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = `${e.clientX + 14}px`;
        tooltipEl.style.top = `${e.clientY - 18}px`;
      } else {
        renderer.domElement.style.cursor = 'default';
        tooltipEl.style.opacity = '0';
      }
    });

    window.addEventListener('pointerup', () => {
      if (!selectedFumo) return;
      controls.enabled = true;
      recordInteraction();

      if (!isDraggingFumo) {
        selectedFumo.squeeze(1.0);
        updateUIBadge(selectedFumo, 'Squeezed! ᗜˬᗜ');
      } else {
        selectedFumo.isDragged = false;
        const now = performance.now();
        while (dragHistory.length > 1 && now - dragHistory[0].time > 140) {
          dragHistory.shift();
        }
        if (dragHistory.length >= 2) {
          const first = dragHistory[0];
          const last = dragHistory[dragHistory.length - 1];
          const dtSec = Math.max(0.016, (last.time - first.time) / 1000);
          const throwVel = last.pos.clone().sub(first.pos).divideScalar(dtSec);
          if (throwVel.length() > 22) throwVel.setLength(22);
          selectedFumo.vel.copy(throwVel);

          const speed = throwVel.length();
          selectedFumo.angVel.set(
            throwVel.z * 0.65 + (Math.random() - 0.5) * speed * 0.4,
            (Math.random() - 0.5) * speed * 0.5,
            -throwVel.x * 0.65 + (Math.random() - 0.5) * speed * 0.4
          );
        } else {
          selectedFumo.vel.set(0, 0, 0);
        }
        updateUIBadge(selectedFumo, 'Thrown!');
      }

      selectedFumo = null;
      isDraggingFumo = false;
    });

    // ============================================================================
    // 14. DAY / NIGHT SMOOTH INTERPOLATION (~2 SECONDS) & HUB INTEGRATION
    // ============================================================================
    let isNightMode = true;
    let dayNightProgress = 1.0;
    let dayNightTarget = 1.0;

    const daySkyColor = new THREE.Color('#9ea4b8');
    const nightSkyColor = new THREE.Color('#130924');

    const dayMoonCol = new THREE.Color('#d8dce8');
    const nightMoonCol = new THREE.Color('#ff9b42');

    const dayDirLightCol = new THREE.Color('#dce2f0');
    const nightDirLightCol = new THREE.Color('#ff9d5c');

    const dayHemiSky = new THREE.Color('#cfd6e6');
    const nightHemiSky = new THREE.Color('#4c3073');
    const dayHemiGround = new THREE.Color('#645e73');
    const nightHemiGround = new THREE.Color('#1a102b');

    function notifyParentMode() {
      const modeStr = isNightMode ? 'night' : 'day';
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'modeChanged', mode: modeStr }, '*');
        }
      } catch (e) {}
    }

    function setDayNightMode(night, { immediate = false, playSound = true } = {}) {
      isNightMode = Boolean(night);
      dayNightTarget = isNightMode ? 1.0 : 0.0;
      if (immediate) {
        dayNightProgress = dayNightTarget;
      }
      document.body.classList.toggle('night-ui', isNightMode);

      try {
        localStorage.setItem(STORAGE_MODE_KEY, isNightMode ? 'night' : 'day');
      } catch (e) {}

      if (playSound) {
        soundFX.playPickup();
      }
      notifyParentMode();
    }

    function toggleDayNight() {
      setDayNightMode(!isNightMode, { immediate: false, playSound: true });
    }

    function updateDayNightTransition(dt, time) {
      if (Math.abs(dayNightProgress - dayNightTarget) > 0.0005) {
        const step = dt * 0.52;
        if (dayNightProgress < dayNightTarget) {
          dayNightProgress = Math.min(dayNightTarget, dayNightProgress + step);
        } else {
          dayNightProgress = Math.max(dayNightTarget, dayNightProgress - step);
        }
      }

      const t = dayNightProgress < 0.5
        ? 4 * dayNightProgress * dayNightProgress * dayNightProgress
        : 1 - Math.pow(-2 * dayNightProgress + 2, 3) / 2;

      const paradeBoost = ghostParadeTimer > 0 ? 1.55 : 1.0;
      const flicker = 0.92 + 0.08 * Math.sin(time * 11.0) * Math.cos(time * 7.3);

      scene.background.lerpColors(daySkyColor, nightSkyColor, t);
      scene.fog.color.copy(scene.background);
      scene.fog.density = THREE.MathUtils.lerp(0.019, 0.014, t);

      moonMaterial.color.lerpColors(dayMoonCol, nightMoonCol, t);
      const moonScale = THREE.MathUtils.lerp(0.78, 1.08, t);
      moonGroup.scale.set(moonScale, moonScale, moonScale);

      mainDirLight.color.lerpColors(dayDirLightCol, nightDirLightCol, t);
      mainDirLight.intensity = THREE.MathUtils.lerp(1.15, 0.72, t);

      hemiLight.color.lerpColors(dayHemiSky, nightHemiSky, t);
      hemiLight.groundColor.lerpColors(dayHemiGround, nightHemiGround, t);
      hemiLight.intensity = THREE.MathUtils.lerp(0.75, 0.36, t);

      treeLight.intensity = THREE.MathUtils.lerp(0.35, 1.45, t) * paradeBoost;
      manorLight.intensity = THREE.MathUtils.lerp(0.25, 1.35, t) * flicker;
      stairsLight.intensity = THREE.MathUtils.lerp(0.30, 1.45, t) * flicker;

      const petalIntensity = THREE.MathUtils.lerp(0.32, 1.15, t) * paradeBoost;
      sakuraPetalMaterial.emissiveIntensity = petalIntensity;
      fallingSakuraMaterial.emissiveIntensity = petalIntensity;
      shojiGlowMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.28, 1.55, t) * flicker;
      pumpkinFlameMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.55, 2.35, t) * flicker;
      ghostOrbMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.65, 1.85, t) * paradeBoost;
      crystalWingMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.35, 1.15, t);
      translucentIceMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.25, 0.75, t);

      if (bloomPass) {
        bloomPass.strength = THREE.MathUtils.lerp(0.18, 0.76, t) * (ghostParadeTimer > 0 ? 1.2 : 1.0);
        bloomPass.threshold = THREE.MathUtils.lerp(0.82, 0.56, t);
      }
    }

    // ============================================================================
    // 15. UI BUTTONS, KEYBOARD SHORTCUTS & HUB MESSAGE LISTENERS
    // ============================================================================
    document.getElementById('btn-parade').addEventListener('click', () => {
      recordInteraction();
      triggerGhostParade();
    });

    document.getElementById('btn-squeeze-all').addEventListener('click', () => {
      recordInteraction();
      fumos.forEach((f, idx) => setTimeout(() => f.squeeze(1.05), idx * 55));
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      recordInteraction();
      fumos.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 45));
      updateUIBadge(null, '');
    });

    const btnSound = document.getElementById('btn-sound');
    const iconSoundOn = document.getElementById('icon-sound-on');
    const iconSoundOff = document.getElementById('icon-sound-off');

    function syncSoundIcons() {
      iconSoundOn.classList.toggle('hidden', soundFX.muted);
      iconSoundOff.classList.toggle('hidden', !soundFX.muted);
    }
    syncSoundIcons();

    btnSound.addEventListener('click', () => {
      soundFX.unlock();
      soundFX.setMuted(!soundFX.muted);
      syncSoundIcons();
      if (!soundFX.muted) soundFX.playPickup();
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      soundFX.unlock();

      const key = e.key.toLowerCase();
      if (key === 'n') {
        e.preventDefault();
        toggleDayNight();
      } else if (key === 'g') {
        e.preventDefault();
        triggerGhostParade();
      } else if (key === 'r') {
        fumos.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 45));
      } else if (key === ' ') {
        e.preventDefault();
        fumos.forEach((f, idx) => setTimeout(() => f.squeeze(1.05), idx * 55));
      } else if (key === 'm') {
        e.preventDefault();
        btnSound.click();
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================================
    // 16. MAIN ANIMATION LOOP & PAUSE / RESUME LIFECYCLE
    // ============================================================================
    let prevTime = performance.now();
    let isPaused = false;
    let rafId = null;

    function animate(now) {
      if (isPaused) return;
      rafId = requestAnimationFrame(animate);

      const dt = Math.min(0.033, Math.max(0.001, (now - prevTime) / 1000));
      prevTime = now;
      const elapsed = now * 0.001;

      if (!selectedFumo && (now - lastUserInteractionTime > 4500)) {
        controls.autoRotate = true;
      }

      controls.update();
      soundFX.updateScheduler();
      updateDayNightTransition(dt, elapsed);

      const batFlap = Math.sin(elapsed * 6.5) * 0.35;
      batLeftWingPivot.rotation.y = batFlap;
      batRightWingPivot.rotation.y = -batFlap;
      batGroup.rotation.z = Math.sin(elapsed * 2.1) * 0.08;

      for (let i = 0; i < pumpkins.length; i++) {
        pumpkins[i].update(dt, elapsed);
      }
      updateGhostOrbs(dt, elapsed);
      updateFallingPetals(elapsed, dt);
      updatePopParticles(dt);
      updateCandiesAndScooping(dt, elapsed);

      for (let i = 0; i < fumos.length; i++) {
        fumos[i].updatePhysics(dt, elapsed);
      }
      resolveFumoToFumoCollisions();

      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    function pauseRenderLoop() {
      if (isPaused) return;
      isPaused = true;
      soundFX.suspend();
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    function resumeRenderLoop() {
      if (!isPaused) return;
      isPaused = false;
      soundFX.resume();
      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    }

    window.addEventListener('message', (e) => {
      const data = e.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'toggleMode') {
        toggleDayNight();
      } else if (data.type === 'setMode' && (data.mode === 'day' || data.mode === 'night')) {
        setDayNightMode(data.mode === 'night', { immediate: false, playSound: false });
      } else if (data.type === 'pause') {
        pauseRenderLoop();
      } else if (data.type === 'resume') {
        resumeRenderLoop();
      }
    });

    window.onload = function () {
      let initialNight = true;
      try {
        const saved = localStorage.getItem(STORAGE_MODE_KEY);
        if (saved === 'day') initialNight = false;
        else if (saved === 'night') initialNight = true;
      } catch (e) {}

      setDayNightMode(initialNight, { immediate: true, playSound: false });
      updateDayNightTransition(0, 0);

      fumos.forEach((f, idx) => {
        setTimeout(() => {
          f.squash = 0.78;
          f.squashVel = 2.0;
          f.headPitchVel = 4.0;
        }, 120 + idx * 65);
      });

      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    };
  </script>
</body>

    // 7C. Drifting Glowing Fireflies (80 instances)
    const FIREFLY_COUNT = 80;
    const fireflyData = [];
    const fireflyGeom = new THREE.BoxGeometry(0.085, 0.085, 0.085);
    const fireflyMat = new THREE.MeshBasicMaterial({
      color: 0xd9f99d,
      transparent: true,
      opacity: 0.45
    });
    const fireflyMesh = new THREE.InstancedMesh(fireflyGeom, fireflyMat, FIREFLY_COUNT);
    for (let i = 0; i < FIREFLY_COUNT; i++) {
      fireflyData.push({
        x: -9.5 + Math.random() * 19,
        y: 0.6 + Math.random() * 7.5,
        z: -9.5 + Math.random() * 19,
        phase: Math.random() * Math.PI * 2,
        speed: 0.5 + Math.random() * 0.8,
        radius: 0.4 + Math.random() * 0.9
      });
    }
    scene.add(fireflyMesh);

    function updateFireflies(time) {
      for (let i = 0; i < FIREFLY_COUNT; i++) {
        const f = fireflyData[i];
        const px = f.x + Math.sin(time * f.speed + f.phase) * f.radius;
        const py = f.y + Math.sin(time * 1.4 + f.phase * 2.0) * 0.35;
        const pz = f.z + Math.cos(time * f.speed * 0.85 + f.phase) * f.radius;
        const pulse = 0.35 + 0.65 * Math.max(0, Math.sin(time * 3.2 + f.phase * 3.0));
        tempPos.set(px, py, pz);
        tempQuat.setFromEuler(tempEuler.set(time, time * 0.7, 0));
        const s = (0.5 + 0.9 * pulse) * (0.45 + 0.85 * dayNightProgress);
        tempScale.set(s, s, s);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        fireflyMesh.setMatrixAt(i, tempMatrix);
      }
      fireflyMesh.instanceMatrix.needsUpdate = true;
    }

    // 7D. Falling Bamboo Leaves (45 instances)
    const LEAF_COUNT = 45;
    const fallingLeaves = [];
    const leafGeom = new THREE.BoxGeometry(0.18, 0.03, 0.07);
    const leafMat = new THREE.MeshStandardMaterial({ color: 0x74c69d, roughness: 0.8 });
    const fallingLeafMesh = new THREE.InstancedMesh(leafGeom, leafMat, LEAF_COUNT);
    for (let i = 0; i < LEAF_COUNT; i++) {
      fallingLeaves.push({
        x: -9.5 + Math.random() * 19,
        y: Math.random() * 12,
        z: -9.5 + Math.random() * 19,
        vy: 0.65 + Math.random() * 0.55,
        phase: Math.random() * Math.PI * 2
      });
      fallingLeafMesh.setColorAt(i, new THREE.Color(bambooLeafGreens[i % bambooLeafGreens.length]));
    }
    fallingLeafMesh.instanceColor.needsUpdate = true;
    scene.add(fallingLeafMesh);

    function updateFallingLeaves(time, dt) {
      for (let i = 0; i < LEAF_COUNT; i++) {
        const lf = fallingLeaves[i];
        lf.y -= lf.vy * dt;
        lf.x += Math.sin(time * 1.5 + lf.phase) * 0.65 * dt;
        lf.z += Math.cos(time * 1.2 + lf.phase) * 0.45 * dt;
        if (lf.y < 0.05) {
          lf.y = 11.5 + Math.random() * 2.0;
          lf.x = -9.5 + Math.random() * 19;
          lf.z = -9.5 + Math.random() * 19;
        }
        tempPos.set(lf.x, lf.y, lf.z);
        tempEuler.set(time * 1.8 + lf.phase, time * 1.3, Math.sin(time * 2.5 + lf.phase) * 0.6);
        tempQuat.setFromEuler(tempEuler);
        tempScale.set(1, 1, 1);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        fallingLeafMesh.setMatrixAt(i, tempMatrix);
      }
      fallingLeafMesh.instanceMatrix.needsUpdate = true;
    }

    // 7E. Rising Campfire Embers (32 instances)
    const EMBER_COUNT = 32;
    const embers = [];
    const emberGeom = new THREE.BoxGeometry(0.08, 0.08, 0.08);
    const emberMat = new THREE.MeshBasicMaterial({ color: 0xff9e00 });
    const emberMesh = new THREE.InstancedMesh(emberGeom, emberMat, EMBER_COUNT);
    for (let i = 0; i < EMBER_COUNT; i++) {
      embers.push({
        life: Math.random(),
        speed: 0.45 + Math.random() * 0.55,
        angle: Math.random() * Math.PI * 2,
        rad: 0.08 + Math.random() * 0.32
      });
      emberMesh.setColorAt(i, new THREE.Color(i % 2 === 0 ? '#ff6b00' : '#ffd166'));
    }
    emberMesh.instanceColor.needsUpdate = true;
    scene.add(emberMesh);

    function updateCampfireEmbers(time, dt) {
      for (let i = 0; i < EMBER_COUNT; i++) {
        const e = embers[i];
        e.life += e.speed * dt;
        if (e.life >= 1.0) {
          e.life = 0.0;
          e.angle = Math.random() * Math.PI * 2;
        }
        const y = 0.25 + e.life * 3.4;
        const spiral = e.angle + e.life * 4.5 + time;
        const r = e.rad * (1.0 + e.life * 1.2);
        tempPos.set(2.5 + Math.cos(spiral) * r, y, 3.0 + Math.sin(spiral) * r);
        tempQuat.setFromEuler(tempEuler.set(time * 4, time * 3, 0));
        const s = (1.0 - e.life) * 1.15;
        tempScale.set(s, s, s);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        emberMesh.setMatrixAt(i, tempMatrix);
      }
      emberMesh.instanceMatrix.needsUpdate = true;

      // Flicker campfire point light organically
      const flicker = Math.sin(time * 14.0) * 0.12 + Math.sin(time * 23.0) * 0.08 + Math.cos(time * 7.5) * 0.08;
      const baseCampIntensity = THREE.MathUtils.lerp(0.65, 1.95, dayNightProgress);
      campfireLight.intensity = Math.max(0.3, baseCampIntensity + flicker);
      campfireLight.position.x = 2.5 + Math.sin(time * 11.0) * 0.04;
      campfireLight.position.z = 3.0 + Math.cos(time * 13.0) * 0.04;
    }

    // 7F. Animated Expanding Ripples in the Pond
    const RIPPLE_RINGS = 3;
    const SEGMENTS_PER_RING = 16;
    const rippleMesh = new THREE.InstancedMesh(
      new THREE.BoxGeometry(0.16, 0.025, 0.06),
      new THREE.MeshBasicMaterial({ color: 0xccfbf1, transparent: true, opacity: 0.55 }),
      RIPPLE_RINGS * SEGMENTS_PER_RING
    );
    scene.add(rippleMesh);

    const rippleCenters = [
      { x: POND_CENTER_X - 0.6, z: POND_CENTER_Z - 0.3, phase: 0.0 },
      { x: POND_CENTER_X + 0.7, z: POND_CENTER_Z + 0.4, phase: 0.38 },
      { x: POND_CENTER_X, z: POND_CENTER_Z, phase: 0.72 }
    ];

    function triggerPondSplash(wx, wz) {
      rippleCenters[2].x = THREE.MathUtils.clamp(wx, POND_CENTER_X - 1.5, POND_CENTER_X + 1.5);
      rippleCenters[2].z = THREE.MathUtils.clamp(wz, POND_CENTER_Z - 1.2, POND_CENTER_Z + 1.2);
      rippleCenters[2].phase = 0.0;
    }

    function updatePondRipples(time, dt) {
      let idx = 0;
      for (let r = 0; r < RIPPLE_RINGS; r++) {
        const rc = rippleCenters[r];
        rc.phase = (rc.phase + dt * 0.42) % 1.0;
        const rad = 0.25 + rc.phase * 1.55;
        const scale = (1.0 - rc.phase) * 1.1;

        for (let s = 0; s < SEGMENTS_PER_RING; s++) {
          const ang = (s / SEGMENTS_PER_RING) * Math.PI * 2;
          tempPos.set(rc.x + Math.cos(ang) * rad, 0.02, rc.z + Math.sin(ang) * rad);
          tempEuler.set(0, -ang + Math.PI / 2, 0);
          tempQuat.setFromEuler(tempEuler);
          tempScale.set(scale, 1, scale);
          tempMatrix.compose(tempPos, tempQuat, tempScale);
          rippleMesh.setMatrixAt(idx++, tempMatrix);
        }
      }
      rippleMesh.instanceMatrix.needsUpdate = true;
    }

    // Pop particles when you squeeze a Fumo or Bunny Mochi
    const POP_MAX = 48;
    const popParticles = [];
    const popGeom = new THREE.BoxGeometry(0.11, 0.11, 0.11);
    const popMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const popMesh = new THREE.InstancedMesh(popGeom, popMat, POP_MAX);
    for (let i = 0; i < POP_MAX; i++) {
      popParticles.push({ active: false, pos: new THREE.Vector3(), vel: new THREE.Vector3(), life: 0, maxLife: 1, color: new THREE.Color('#ff85a1') });
      tempMatrix.makeScale(0, 0, 0);
      popMesh.setMatrixAt(i, tempMatrix);
    }
    scene.add(popMesh);

    function spawnSqueezeParticles(origin, accentHex) {
      const palette = [accentHex, '#86efac', '#fde047', '#ffffff'];
      let spawned = 0;
      for (let i = 0; i < POP_MAX && spawned < 12; i++) {
        const p = popParticles[i];
        if (!p.active) {
          p.active = true;
          p.life = 0;
          p.maxLife = 0.45 + Math.random() * 0.25;
          p.pos.copy(origin).add(new THREE.Vector3(0, 0.85, 0));
          const angle = (spawned / 12) * Math.PI * 2 + Math.random() * 0.3;
          const speed = 2.2 + Math.random() * 2.0;
          p.vel.set(Math.cos(angle) * speed, 2.5 + Math.random() * 2.2, Math.sin(angle) * speed);
          p.color.set(palette[spawned % palette.length]);
          popMesh.setColorAt(i, p.color);
          spawned++;
        }
      }
      if (popMesh.instanceColor) popMesh.instanceColor.needsUpdate = true;
    }

    function updatePopParticles(dt) {
      let dirty = false;
      for (let i = 0; i < POP_MAX; i++) {
        const p = popParticles[i];
        if (!p.active) continue;
        dirty = true;
        p.life += dt;
        if (p.life >= p.maxLife) {
          p.active = false;
          tempMatrix.makeScale(0, 0, 0);
          popMesh.setMatrixAt(i, tempMatrix);
          continue;
        }
        p.vel.y -= 7.5 * dt;
        p.pos.addScaledVector(p.vel, dt);
        const s = 1.0 - (p.life / p.maxLife);
        tempQuat.setFromEuler(tempEuler.set(p.life * 8, p.life * 6, 0));
        tempScale.set(s, s, s);
        tempMatrix.compose(p.pos, tempQuat, tempScale);
        popMesh.setMatrixAt(i, tempMatrix);
      }
      if (dirty) popMesh.instanceMatrix.needsUpdate = true;
    }

    // ============================================================================
    // 8. TOUHOU FUMO VOXEL PLUSHIE BUILDER & SOFT-BODY PHYSICS CLASS
    // ============================================================================
    const allFumoRaycastMeshes = [];
    const fumos = [];

    class VoxelFumo {
      constructor(config) {
        this.id = config.id;
        this.name = config.name;
        this.emoji = config.emoji || '🎋';
        this.accentColor = config.accentColor || '#ef4444';
        this.scaleFactor = config.scale || 1.0;
        this.FV = 0.082 * this.scaleFactor;
        this.radius = 0.85 * this.scaleFactor;
        this.pitchAudio = config.pitchAudio || 1.0;
        this.isSleeping = Boolean(config.isSleeping);
        this.attachedStalkIdx = config.attachedStalkIdx !== undefined ? config.attachedStalkIdx : null;
        this.currentlyWedgedOnStalk = (this.attachedStalkIdx !== null);

        this.homePos = config.homePos.clone();
        this.homeYaw = config.homeYaw || 0;

        this.pos = this.homePos.clone();
        this.vel = new THREE.Vector3();
        this.yaw = this.homeYaw;
        this.pitch = 0;
        this.roll = 0;
        this.angVel = new THREE.Vector3();
        this.isGrounded = true;
        this.isDragged = false;

        this.squash = 1.0;
        this.squashVel = 0.0;

        this.headPitch = 0.0;
        this.headRoll = 0.0;
        this.headPitchVel = 0.0;
        this.headRollVel = 0.0;

        this.limbPitch = 0.0;
        this.limbRoll = 0.0;
        this.limbPitchVel = 0.0;
        this.limbRollVel = 0.0;

        this.root = new THREE.Group();
        this.squashGroup = new THREE.Group();
        this.root.add(this.squashGroup);

        this.headPivot = new THREE.Group();
        this.headPivot.position.set(0, 7.2 * this.FV, 0);
        this.squashGroup.add(this.headPivot);

        this.leftArmPivot = new THREE.Group();
        this.leftArmPivot.position.set(-4.2 * this.FV, 6.2 * this.FV, 0.5 * this.FV);
        this.squashGroup.add(this.leftArmPivot);

        this.rightArmPivot = new THREE.Group();
        this.rightArmPivot.position.set(4.2 * this.FV, 6.2 * this.FV, 0.5 * this.FV);
        this.squashGroup.add(this.rightArmPivot);

        this.leftLegPivot = new THREE.Group();
        this.leftLegPivot.position.set(-2.3 * this.FV, 1.8 * this.FV, 3.2 * this.FV);
        this.squashGroup.add(this.leftLegPivot);

        this.rightLegPivot = new THREE.Group();
        this.rightLegPivot.position.set(2.3 * this.FV, 1.8 * this.FV, 3.2 * this.FV);
        this.squashGroup.add(this.rightLegPivot);

        this.wingsPivot = new THREE.Group();
        this.wingsPivot.position.set(0, 4.8 * this.FV, -3.5 * this.FV);
        this.squashGroup.add(this.wingsPivot);

        this.buildCharacterVoxels(config);
        this.syncTransform(0);
        scene.add(this.root);
      }

      buildCharacterVoxels(cfg) {
        const bodyVoxels = [];
        const headVoxels = [];
        const leftArmVoxels = [];
        const rightArmVoxels = [];
        const leftLegVoxels = [];
        const rightLegVoxels = [];
        const wingSolidVoxels = [];

        const skinBase = '#ffe5d4';
        const blushCol = '#ff9ebb';
        const smileCol = '#4a2525';

        const addPlushVoxel = (arr, x, y, z, col, isSeam = false) => {
          const seamDarken = (isSeam && ((Math.abs(x + y + z) % 2) === 0)) ? 0.055 : 0;
          arr.push({
            x, y, z,
            color: varyColor(col, x + this.id.length * 7, y, z, 0.04, seamDarken)
          });
        };

        // ------------------------------------------------------------------
        // 1. STUBBY SITTING TORSO (Local y: 0..7, x: -4..4, z: -3..3)
        // ------------------------------------------------------------------
        for (let y = 0; y <= 7; y++) {
          const rMax = (y === 0 || y === 7) ? 3.4 : 4.2 - (y * 0.12);
          for (let x = -4; x <= 4; x++) {
            for (let z = -3; z <= 3; z++) {
              const dist = Math.hypot(x, z * 1.15);
              if (dist > rMax) continue;

              const isSideSeam = (z === 0 && Math.abs(x) >= rMax - 0.9);
              let col = cfg.outfitMain;

              // Character-Accurate Outfit Details:
              if (this.id === 'mokou') {
                // High-waisted red suspender pants (y <= 4) + white collared shirt (y >= 5) + suspenders + white talismans
                if (y >= 5) col = '#f8fafc';
                if (y >= 5 && z >= 2 && Math.abs(x) === 2) col = '#dc2626'; // Red suspenders
                if (y === 5 && z >= 2 && x === 0) col = '#facc15'; // Yellow tie bow at collar
                if (y === 2 && z >= 2 && Math.abs(x) === 2) col = '#ffffff'; // White paper talismans (ofuda) on pants
              } else if (this.id === 'kaguya') {
                // Heian pink-and-white upper kimono blouse (y >= 4) + dark crimson-maroon long skirt (y <= 3) with gold/sakura hem
                if (y >= 4) col = '#fbcfe8';
                if (y >= 5 && z >= 2 && Math.abs(x) <= 1) col = '#ffffff'; // White inner collar
                if (y === 4 && z >= 2 && x === 0) col = '#be123c'; // Bow
                if (y === 1 && z >= 1 && (x % 2 === 0)) col = '#fde047'; // Gold floral motif on skirt
              } else if (this.id === 'reisen') {
                // Pleated white/pink skirt (y <= 1), dark navy lunar blazer (y >= 2), white shirt & red tie
                if (y <= 1) col = '#fce7f3';
                if (y >= 3 && z >= 2 && Math.abs(x) <= 1) col = '#ffffff';
                if (y >= 3 && y <= 5 && z >= 2 && x === 0) col = '#dc2626'; // Red tie
              } else if (this.id === 'tewi') {
                // Pink dress with white frill collar & bright orange carrot necklace pendant!
                if (y === 1 && z >= 1) col = '#ffffff';
                if (y >= 6 && z >= 1) col = '#ffffff'; // White frill collar
                if (y === 4 && z >= 2 && x === 0) col = '#f97316'; // Carrot pendant!
                if (y === 5 && z >= 2 && x === 0) col = '#22c55e'; // Carrot leafy top!
              } else if (this.id === 'keine') {
                // Blue dress with white front tabard/vest & green/gold ribbon
                if (z >= 1 && Math.abs(x) <= 2 && y <= 5) col = '#f8fafc';
                if (y === 5 && z >= 2 && x === 0) col = '#16a34a';
              } else {
                if (y === 1 && z >= 1) col = '#ffffff';
                if (y >= 5 && z >= 2 && Math.abs(x) <= 1) col = cfg.tieColor || '#ef4444';
              }

              addPlushVoxel(bodyVoxels, x, y + 0.5, z, col, isSideSeam);
            }
          }
        }

        // ------------------------------------------------------------------
        // 2. SHORT DANGLING ARMS
        // ------------------------------------------------------------------
        for (const side of [-1, 1]) {
          const targetArr = side === -1 ? leftArmVoxels : rightArmVoxels;
          for (let y = -3; y <= 0; y++) {
            for (let x = -1; x <= 1; x++) {
              for (let z = -1; z <= 1; z++) {
                if (Math.abs(x) === 1 && Math.abs(z) === 1 && y === -3) continue;
                let col = cfg.sleeveColor || '#ffffff';
                if (y === -3) col = skinBase;
                else if (this.id === 'kaguya' && y === -2) col = '#f472b6'; // Pink cuff trim
                addPlushVoxel(targetArr, x * 0.85 + side * 0.4, y, z * 0.85, col, x === 0);
              }
            }
          }
        }

        // ------------------------------------------------------------------
        // 3. SHORT SITTING / DANGLING LEGS WITH SHOES
        // ------------------------------------------------------------------
        for (const side of [-1, 1]) {
          const targetArr = side === -1 ? leftLegVoxels : rightLegVoxels;
          for (let z = 0; z <= 4; z++) {
            for (let x = -1; x <= 1; x++) {
              for (let y = -1; y <= 1; y++) {
                if (Math.abs(x) === 1 && Math.abs(y) === 1) continue;
                let col = '#ffffff';
                if (z === 0) col = skinBase;
                if (z >= 3) col = cfg.shoeColor || '#2b2d42';
                if (z === 4 && y === 1 && x === 0) col = '#ffffff';
                addPlushVoxel(targetArr, x * 0.9, y * 0.9, z * 0.9, col, y === 0);
              }
            }
          }
        }

        // ------------------------------------------------------------------
        // 4. OVERSIZED ROUND FUMO HEAD, ICONIC 'ᗜˬᗜ' FACE, HAIR, EARS & HATS
        // ------------------------------------------------------------------
        for (let y = 0; y <= 12; y++) {
          for (let x = -7; x <= 7; x++) {
            for (let z = -6; z <= 6; z++) {
              const dy = (y - 6.0) * 1.05;
              const dx = x * 0.94;
              const dz = z * 1.02;
              const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
              if (dist > 6.4 || dist < 4.5) continue;

              let col = skinBase;
              const isHeadSeam = (z === 0 && Math.abs(x) >= 5);

              const isBackOrTop = (z <= 1) || (y >= 9) || (Math.abs(x) >= 5 && z <= 3);
              const isForeheadBangs = (z >= 4 && y >= 7 && (Math.abs(x) !== 2 || y >= 8));
              const isSideLocks = (Math.abs(x) >= 5 && z >= 2 && y >= 2);

              if (isBackOrTop || isForeheadBangs || isSideLocks) {
                col = cfg.hairColor;
              } else if (z >= 5) {
                // Iconic Fumo Face Expression Plane
                if ((Math.abs(x) === 3 || Math.abs(x) === 2) && y >= 4 && y <= 6) {
                  if (this.isSleeping) {
                    // Peaceful sleeping Fumo closed eyes (ㅡ ㅡ)
                    if (y === 5) col = '#1f141e';
                  } else {
                    if (y === 6) col = '#1f141e';
                    else if (y === 5 && Math.abs(x) === 2) col = '#ffffff';
                    else col = cfg.eyeColor;
                  }
                } else if (Math.abs(x) === 4 && y === 3) {
                  col = blushCol;
                } else if (y === 2 && Math.abs(x) <= 1) {
                  col = (x === 0) ? '#e07a7a' : smileCol;
                }
              }

              addPlushVoxel(headVoxels, x, y, z, col, isHeadSeam);
            }
          }
        }

        // Character-Specific Hair, Rabbit Ears, Ribbons & Hats:
        if (this.id === 'mokou') {
          // Very long flowing white hair down her back with red ribbon bows & paper talismans!
          for (let hy = -6; hy <= 8; hy++) {
            for (let hx = -5; hx <= 5; hx++) {
              if (Math.abs(hx) <= 4) {
                const isBow = (hy === 7 || hy === 2 || hy === -3) && (Math.abs(hx) === 2 || Math.abs(hx) === 3);
                const isOfuda = (hy === 4 || hy === -1) && hx === 0;
                addPlushVoxel(headVoxels, hx, hy, -5.8 - (8 - hy) * 0.12, isBow ? '#dc2626' : (isOfuda ? '#ffffff' : cfg.hairColor));
              }
            }
          }
          // Big red hair bow on top-back of head
          for (let bx = -5; bx <= 5; bx++) {
            for (let by = -2; by <= 2; by++) {
              if (Math.abs(bx) >= 1 || Math.abs(by) <= 1) {
                addPlushVoxel(headVoxels, bx, 11.5 + by * 0.65, -3.2, '#dc2626');
              }
            }
          }
        }

        if (this.id === 'kaguya') {
          // Very long jet-black hime-cut hair flowing down back & front sidelocks
          for (const side of [-1, 1]) {
            for (let y = -3; y <= 5; y++) {
              addPlushVoxel(headVoxels, side * 6.2, y, 2.8, cfg.hairColor);
              addPlushVoxel(headVoxels, side * 5.8, y, 3.5, cfg.hairColor);
            }
          }
          for (let hy = -6; hy <= 5; hy++) {
            for (let hx = -5; hx <= 5; hx++) {
              addPlushVoxel(headVoxels, hx, hy, -5.8, cfg.hairColor);
            }
          }
          // Center parted pink/gold hair ornament
          addPlushVoxel(headVoxels, 0, 11.5, 2.5, '#f472b6');
        }

        if (this.id === 'reisen') {
          // Long wavy lavender hair locks
          for (const side of [-1, 1]) {
            for (let y = -3; y <= 4; y++) {
              addPlushVoxel(headVoxels, side * 6.4, y, 2.2, cfg.hairColor);
            }
          }
          // Iconic Long Rabbit Ears (Left ear upright with slight bend at tip, Right ear drooping/crumpled!)
          for (const side of [-1, 1]) {
            for (let ey = 0; ey <= 9; ey++) {
              const isDroop = (side === 1 && ey >= 5);
              const earX = side * 3.2 + (isDroop ? (ey - 4) * 0.55 : 0);
              const earY = isDroop ? (12.0 + 4.5 - (ey - 5) * 0.65) : (12.0 + ey * 0.85);
              const earZ = isDroop ? (1.2 + (ey - 4) * 0.45) : 0.8;
              for (let ew = -1; ew <= 1; ew++) {
                const isInnerPink = (ew === 0 && ey >= 2 && ey <= 7);
                addPlushVoxel(headVoxels, earX + ew * 0.65, earY, earZ, isInnerPink ? '#fbcfe8' : cfg.hairColor);
              }
            }
          }
        }

        if (this.id === 'tewi') {
          // Perky upright white rabbit ears with pink inner fluff!
          for (const side of [-1, 1]) {
            for (let ey = 0; ey <= 7; ey++) {
              const earX = side * (2.8 + ey * 0.15);
              const earY = 12.0 + ey * 0.85;
              for (let ew = -1; ew <= 1; ew++) {
                const isPink = (ew === 0 && ey >= 1 && ey <= 5);
                addPlushVoxel(headVoxels, earX + ew * 0.65, earY, 1.0, isPink ? '#f9a8d4' : '#ffffff');
              }
            }
          }
        }

        if (this.id === 'keine') {
          // Long silver-blue hair + Iconic tall blue hexagonal scholar box-hat with gold trim & side talismans!
          for (let hy = -4; hy <= 4; hy++) {
            for (let hx = -4; hx <= 4; hx++) {
              addPlushVoxel(headVoxels, hx, hy, -5.8, cfg.hairColor);
            }
          }
          // Scholar Hat Box on top of head
          for (let ch = 0; ch <= 5; ch++) {
            for (let hx = -5; hx <= 5; hx++) {
              for (let hz = -5; hz <= 5; hz++) {
                const r = Math.max(Math.abs(hx), Math.abs(hz));
                if (r === 5 || (ch === 5 && r <= 5) || (ch === 0 && r === 6)) {
                  const isGold = (ch === 1 || ch === 4);
                  addPlushVoxel(headVoxels, hx, 11.2 + ch * 0.85, hz, isGold ? '#facc15' : '#1e3a8a');
                }
              }
            }
          }
          // Dangling yellow/white side flaps on hat
          for (const side of [-1, 1]) {
            for (let fy = 7; fy <= 11; fy++) {
              addPlushVoxel(headVoxels, side * 5.8, fy, 1.8, fy === 11 ? '#dc2626' : '#fef08a');
            }
          }
        }

        if (this.id === 'mystia') {
          // Brown songbird hat with feather + Dustyrose Bird Wings on back!
          for (let hx = -5; hx <= 5; hx++) {
            for (let hz = -4; hz <= 4; hz++) {
              if (Math.hypot(hx, hz) <= 5.2) {
                addPlushVoxel(headVoxels, hx, 11.4, hz, '#78350f');
                addPlushVoxel(headVoxels, hx * 0.75, 12.3, hz * 0.75, '#92400e');
              }
            }
          }
          // Cute bird wings on back
          for (const side of [-1, 1]) {
            for (let wx = 1; wx <= 6; wx++) {
              for (let wy = 0; wy <= 3; wy++) {
                if (wx + wy <= 7) {
                  wingSolidVoxels.push({
                    x: side * wx, y: wy + wx * 0.25, z: -0.5,
                    color: varyColor(wy === 0 ? '#fce7f3' : '#be185d', wx, wy, 0, 0.03)
                  });
                }
              }
            }
          }
        }

        if (this.id === 'usagi_mortar') {
          // Chibi Moon Rabbit Fumo asleep in the mortar: perky cream bunny ears + cute sleeping bubble!
          for (const side of [-1, 1]) {
            for (let ey = 0; ey <= 6; ey++) {
              addPlushVoxel(headVoxels, side * 2.8, 11.8 + ey * 0.8, 1.0, '#ffffff');
              addPlushVoxel(headVoxels, side * 2.8, 11.8 + ey * 0.8, 1.6, '#fbcfe8');
            }
          }
          // Cute translucent sleep bubble on nose
          addPlushVoxel(headVoxels, 1.6, 3.5, 6.2, '#bae6fd');
        }

        const registerPart = (voxels, parent, mat = plushMaterial) => {
          const m = buildVoxelInstancedMesh(voxels, this.FV, mat, true, true);
          if (m) {
            m.userData.fumo = this;
            parent.add(m);
            allFumoRaycastMeshes.push(m);
          }
          return m;
        };

        registerPart(bodyVoxels, this.squashGroup);
        registerPart(headVoxels, this.headPivot);
        registerPart(leftArmVoxels, this.leftArmPivot);
        registerPart(rightArmVoxels, this.rightArmPivot);
        registerPart(leftLegVoxels, this.leftLegPivot);
        registerPart(rightLegVoxels, this.rightLegPivot);
        registerPart(wingSolidVoxels, this.wingsPivot);
      }

      squeeze(strength = 1.0) {
        this.squash = Math.max(0.52, this.squash - 0.42 * strength);
        this.squashVel = -3.5 * strength;
        this.headPitchVel += (Math.random() - 0.5) * 14 * strength;
        this.headRollVel += (Math.random() > 0.5 ? 1 : -1) * 11 * strength;
        this.limbPitch = -0.65 * strength;
        this.limbPitchVel = -6.0 * strength;
        spawnSqueezeParticles(this.pos, this.accentColor);
        soundFX.playSqueeze(this.pitchAudio);
      }

      resetToHome() {
        this.pos.copy(this.homePos);
        this.vel.set(0, 0, 0);
        this.yaw = this.homeYaw;
        this.pitch = 0;
        this.roll = 0;
        this.angVel.set(0, 0, 0);
        this.isGrounded = true;
        this.isDragged = false;
        this.currentlyWedgedOnStalk = (this.attachedStalkIdx !== null);
        this.squeeze(0.75);
      }

      updatePhysics(dt, time) {
        // 1. Volume-Preserving Squash & Stretch Spring
        const squashStiff = 210.0;
        const squashDamp = 11.5;
        const squashForce = (1.0 - this.squash) * squashStiff - this.squashVel * squashDamp;
        this.squashVel += squashForce * dt;
        this.squash += this.squashVel * dt;
        this.squash = THREE.MathUtils.clamp(this.squash, 0.45, 1.55);

        // 2. Head Wobble Spring
        const headStiff = 140.0;
        const headDamp = 7.5;
        const idleHeadBob = Math.sin(time * (this.isSleeping ? 1.4 : 2.2) + this.homePos.x) * (this.isSleeping ? 0.06 : 0.025);
        this.headPitchVel += ((idleHeadBob - this.headPitch) * headStiff - this.headPitchVel * headDamp) * dt;
        this.headRollVel += ((0 - this.headRoll) * headStiff - this.headRollVel * headDamp) * dt;
        this.headPitch = THREE.MathUtils.clamp(this.headPitch + this.headPitchVel * dt, -0.55, 0.55);
        this.headRoll = THREE.MathUtils.clamp(this.headRoll + this.headRollVel * dt, -0.55, 0.55);

        // 3. Dangling Limb Springs
        const targetLimbPitch = (this.isDragged || !this.isGrounded || this.currentlyWedgedOnStalk) ? 0.58 : 0.0;
        const limbStiff = 120.0;
        const limbDamp = 8.0;
        this.limbPitchVel += ((targetLimbPitch - this.limbPitch) * limbStiff - this.limbPitchVel * limbDamp) * dt;
        this.limbRollVel += ((0 - this.limbRoll) * limbStiff - this.limbRollVel * limbDamp) * dt;
        this.limbPitch = THREE.MathUtils.clamp(this.limbPitch + this.limbPitchVel * dt, -0.8, 0.9);
        this.limbRoll = THREE.MathUtils.clamp(this.limbRoll + this.limbRollVel * dt, -0.6, 0.6);

        // Special Case: Fumo wedged halfway up a swaying bamboo stalk!
        if (this.currentlyWedgedOnStalk && !this.isDragged) {
          const st = bambooStalks[this.attachedStalkIdx];
          if (st) {
            const normY = this.homePos.y / st.height;
            const curve = normY * normY;
            this.pos.x = st.x + st.bendX * curve + 0.25;
            this.pos.y = this.homePos.y;
            this.pos.z = st.z + st.bendZ * curve + 0.25;
            this.roll = -st.bendX * 0.22;
            this.pitch = st.bendZ * 0.22 + 0.18;
            this.isGrounded = true;
            this.syncTransform(time);
            return;
          }
        }

        if (!this.isDragged) {
          this.vel.y -= 24.0 * dt;
          this.vel.multiplyScalar(Math.pow(0.985, dt * 60));
          this.pos.addScaledVector(this.vel, dt);

          this.yaw += this.angVel.y * dt;
          this.pitch += this.angVel.x * dt;
          this.roll += this.angVel.z * dt;
          this.angVel.multiplyScalar(Math.pow(0.92, dt * 60));

          this.isGrounded = false;

          // Ground / Pond Collision (Y = 0)
          if (this.pos.y < 0) {
            const impact = -this.vel.y;
            this.pos.y = 0;

            // Check if landed in the Pond!
            const pondDist = Math.hypot((this.pos.x - POND_CENTER_X) / 3.2, (this.pos.z - POND_CENTER_Z) / 2.6);
            if (pondDist < 1.0 && impact > 1.0) {
              triggerPondSplash(this.pos.x, this.pos.z);
              spawnSqueezeParticles(this.pos, '#38bdf8');
            }

            if (impact > 1.8) {
              this.vel.y = impact * 0.42;
              this.squashVel -= Math.min(9.0, impact * 0.95);
              this.headPitchVel += (Math.random() - 0.5) * impact * 2.0;
              this.headRollVel += (Math.random() - 0.5) * impact * 2.0;
              soundFX.playBounce(impact * 0.08);
            } else {
              this.vel.y = 0;
              this.isGrounded = true;
            }
            this.vel.x *= 0.82;
            this.vel.z *= 0.82;
          }

          // Clearing Bounds
          const minBound = -9.8;
          const maxBound = 9.8;
          if (this.pos.x < minBound) { this.pos.x = minBound; this.vel.x = Math.abs(this.vel.x) * 0.48; }
          else if (this.pos.x > maxBound) { this.pos.x = maxBound; this.vel.x = -Math.abs(this.vel.x) * 0.48; }
          if (this.pos.z < minBound) { this.pos.z = minBound; this.vel.z = Math.abs(this.vel.z) * 0.48; }
          else if (this.pos.z > maxBound) { this.pos.z = maxBound; this.vel.z = -Math.abs(this.vel.z) * 0.48; }

          // Furniture / Hut / Logs / Well / Mortar AABB Collisions
          const r = this.radius * 0.72;
          const centerY = this.pos.y + r;

          for (let i = 0; i < furnitureColliders.length; i++) {
            const box = furnitureColliders[i];
            const cx = THREE.MathUtils.clamp(this.pos.x, box.min.x, box.max.x);
            const cy = THREE.MathUtils.clamp(centerY, box.min.y, box.max.y);
            const cz = THREE.MathUtils.clamp(this.pos.z, box.min.z, box.max.z);

            const dx = this.pos.x - cx;
            const dy = centerY - cy;
            const dz = this.pos.z - cz;
            const distSq = dx * dx + dy * dy + dz * dz;

            if (distSq < r * r) {
              const dist = Math.sqrt(distSq);
              if (centerY >= box.max.y - 0.28 && this.vel.y <= 0.5) {
                const impact = -this.vel.y;
                this.pos.y = box.max.y;
                if (impact > 2.0) {
                  this.vel.y = impact * 0.38;
                  this.squashVel -= Math.min(8.5, impact * 0.85);
                  this.headPitchVel += (Math.random() - 0.5) * impact * 1.8;
                  soundFX.playBounce(impact * 0.08);
                } else {
                  this.vel.y = 0;
                  this.isGrounded = true;
                }
                this.vel.x *= 0.80;
                this.vel.z *= 0.80;
              } else if (dist > 0.0001) {
                const nx = dx / dist;
                const ny = dy / dist;
                const nz = dz / dist;
                const pen = r - dist;
                this.pos.x += nx * pen;
                this.pos.y = Math.max(0, this.pos.y + ny * pen);
                this.pos.z += nz * pen;

                const vn = this.vel.x * nx + this.vel.y * ny + this.vel.z * nz;
                if (vn < 0) {
                  const imp = -vn;
                  this.vel.x -= 1.42 * vn * nx;
                  this.vel.y -= 1.42 * vn * ny;
                  this.vel.z -= 1.42 * vn * nz;
                  if (imp > 2.0) {
                    this.squashVel -= Math.min(6.0, imp * 0.55);
                    soundFX.playBounce(imp * 0.06);
                  }
                }
              }
            }
          }

          if (this.isGrounded) {
            this.pitch = THREE.MathUtils.lerp(this.pitch, 0, Math.min(1, dt * 9.5));
            this.roll = THREE.MathUtils.lerp(this.roll, 0, Math.min(1, dt * 9.5));
            this.angVel.multiplyScalar(0.75);
          }
        }

        this.syncTransform(time);
      }

      syncTransform(time) {
        this.root.position.copy(this.pos);
        this.root.rotation.order = 'YXZ';
        this.root.rotation.set(this.pitch, this.yaw, this.roll);

        const sy = this.squash;
        const sxz = 1.0 / Math.sqrt(Math.max(0.35, sy));
        this.squashGroup.scale.set(sxz, sy, sxz);

        this.headPivot.rotation.set(this.headPitch, 0, this.headRoll);

        this.leftArmPivot.rotation.set(this.limbPitch, 0, 0.18 + Math.abs(this.limbPitch) * 0.35 + this.limbRoll);
        this.rightArmPivot.rotation.set(this.limbPitch, 0, -0.18 - Math.abs(this.limbPitch) * 0.35 + this.limbRoll);
        this.leftLegPivot.rotation.set(this.limbPitch * 1.15, 0.08, this.limbRoll * 0.5);
        this.rightLegPivot.rotation.set(this.limbPitch * 1.15, -0.08, this.limbRoll * 0.5);

        const wingFlutter = Math.sin(time * 3.8 + this.homePos.x) * 0.06 + (1.0 - this.squash) * 0.35;
        this.wingsPivot.rotation.x = wingFlutter;
      }
    }

    // ============================================================================
    // 9. BOUNCY RABBIT-SHAPED MOCHI CLASS (`VoxelBunnyMochi`)
    // Can be clicked to squish/bounce and dragged & thrown around the forest!
    // ============================================================================
    class VoxelBunnyMochi {
      constructor(config) {
        this.id = config.id;
        this.name = config.name;
        this.emoji = '🐇';
        this.accentColor = config.tint || '#fbcfe8';
        this.FV = 0.068;
        this.radius = 0.42;
        this.pitchAudio = 1.48;
        this.currentlyWedgedOnStalk = false;

        this.homePos = config.homePos.clone();
        this.homeYaw = config.homeYaw || 0;
        this.pos = this.homePos.clone();
        this.vel = new THREE.Vector3();
        this.yaw = this.homeYaw;
        this.pitch = 0;
        this.roll = 0;
        this.angVel = new THREE.Vector3();
        this.isGrounded = true;
        this.isDragged = false;

        this.squash = 1.0;
        this.squashVel = 0.0;

        this.root = new THREE.Group();
        this.squashGroup = new THREE.Group();
        this.root.add(this.squashGroup);

        const voxels = [];
        const bodyHex = config.bodyColor || '#fffdf9';
        // Plump round mochi bunny body
        for (let x = -3; x <= 3; x++) {
          for (let y = 0; y <= 4; y++) {
            for (let z = -4; z <= 4; z++) {
              const dist = Math.hypot(x * 1.05, (y - 1.8) * 1.25, z * 0.88);
              if (dist <= 3.4) {
                let col = bodyHex;
                // Red dot bunny eyes at front (z === 3, y === 2, |x| === 1)
                if (z >= 3 && y === 2 && Math.abs(x) === 1) col = '#dc2626';
                voxels.push({ x, y: y + 0.5, z, color: varyColor(col, x, y, z, 0.02) });
              }
            }
          }
        }
        // Cute laid-back mochi bunny ears on top
        for (const side of [-1, 1]) {
          for (let ez = -2; ez <= 1; ez++) {
            voxels.push({
              x: side * 1.2,
              y: 4.8 - ez * 0.25,
              z: ez,
              color: varyColor(ez === 0 ? '#fbcfe8' : bodyHex, side, 5, ez, 0.02)
            });
          }
        }
        // Little round bunny tail
        voxels.push({ x: 0, y: 1.8, z: -4.2, color: new THREE.Color(bodyHex) });

        const mesh = buildVoxelInstancedMesh(voxels, this.FV, plushMaterial, true, true);
        if (mesh) {
          mesh.userData.fumo = this;
          this.squashGroup.add(mesh);
          allFumoRaycastMeshes.push(mesh);
        }

        scene.add(this.root);
      }

      squeeze(strength = 1.0) {
        this.squash = 0.48;
        this.squashVel = -4.5 * strength;
        this.vel.y = Math.max(this.vel.y, 4.2 * strength);
        this.isGrounded = false;
        spawnSqueezeParticles(this.pos, this.accentColor);
        soundFX.playSqueeze(this.pitchAudio);
      }

      resetToHome() {
        this.pos.copy(this.homePos);
        this.vel.set(0, 0, 0);
        this.yaw = this.homeYaw;
        this.pitch = 0;
        this.roll = 0;
        this.angVel.set(0, 0, 0);
        this.isGrounded = true;
        this.isDragged = false;
        this.squeeze(0.6);
      }

      updatePhysics(dt) {
        // Extra-elastic mochi spring!
        const squashStiff = 260.0;
        const squashDamp = 9.0;
        this.squashVel += ((1.0 - this.squash) * squashStiff - this.squashVel * squashDamp) * dt;
        this.squash = THREE.MathUtils.clamp(this.squash + this.squashVel * dt, 0.42, 1.65);

        if (!this.isDragged) {
          this.vel.y -= 23.0 * dt;
          this.vel.multiplyScalar(Math.pow(0.988, dt * 60));
          this.pos.addScaledVector(this.vel, dt);

          this.yaw += this.angVel.y * dt;
          this.pitch += this.angVel.x * dt;
          this.roll += this.angVel.z * dt;
          this.angVel.multiplyScalar(Math.pow(0.93, dt * 60));

          this.isGrounded = false;

          // Super-bouncy floor restitution (0.64) when thrown!
          if (this.pos.y < 0) {
            const impact = -this.vel.y;
            this.pos.y = 0;
            if (impact > 1.2) {
              this.vel.y = impact * 0.64; // Extra bouncy rabbit mochi!
              this.squashVel -= Math.min(11.0, impact * 1.2);
              soundFX.playBounce(impact * 0.09, true);
            } else {
              this.vel.y = 0;
              this.isGrounded = true;
            }
            this.vel.x *= 0.85;
            this.vel.z *= 0.85;
          }

          const minBound = -9.6;
          const maxBound = 9.6;
          if (this.pos.x < minBound) { this.pos.x = minBound; this.vel.x = Math.abs(this.vel.x) * 0.65; }
          else if (this.pos.x > maxBound) { this.pos.x = maxBound; this.vel.x = -Math.abs(this.vel.x) * 0.65; }
          if (this.pos.z < minBound) { this.pos.z = minBound; this.vel.z = Math.abs(this.vel.z) * 0.65; }
          else if (this.pos.z > maxBound) { this.pos.z = maxBound; this.vel.z = -Math.abs(this.vel.z) * 0.65; }

          const r = this.radius * 0.8;
          const centerY = this.pos.y + r;
          for (let i = 0; i < furnitureColliders.length; i++) {
            const box = furnitureColliders[i];
            const cx = THREE.MathUtils.clamp(this.pos.x, box.min.x, box.max.x);
            const cy = THREE.MathUtils.clamp(centerY, box.min.y, box.max.y);
            const cz = THREE.MathUtils.clamp(this.pos.z, box.min.z, box.max.z);
            const dx = this.pos.x - cx;
            const dy = centerY - cy;
            const dz = this.pos.z - cz;
            const distSq = dx * dx + dy * dy + dz * dz;
            if (distSq < r * r) {
              if (centerY >= box.max.y - 0.22 && this.vel.y <= 0.5) {
                const impact = -this.vel.y;
                this.pos.y = box.max.y;
                if (impact > 1.3) {
                  this.vel.y = impact * 0.60;
                  this.squashVel -= Math.min(10.0, impact * 1.1);
                  soundFX.playBounce(impact * 0.08, true);
                } else {
                  this.vel.y = 0;
                  this.isGrounded = true;
                }
                this.vel.x *= 0.82;
                this.vel.z *= 0.82;
              }
            }
          }

          if (this.isGrounded) {
            this.pitch = THREE.MathUtils.lerp(this.pitch, 0, Math.min(1, dt * 10.0));
            this.roll = THREE.MathUtils.lerp(this.roll, 0, Math.min(1, dt * 10.0));
          }
        }

        this.root.position.copy(this.pos);
        this.root.rotation.order = 'YXZ';
        this.root.rotation.set(this.pitch, this.yaw, this.roll);
        const sy = this.squash;
        const sxz = 1.0 / Math.sqrt(Math.max(0.35, sy));
        this.squashGroup.scale.set(sxz, sy, sxz);
      }
    }

    function resolvePlushCollisions() {
      for (let i = 0; i < allInteractables.length; i++) {
        for (let j = i + 1; j < allInteractables.length; j++) {
          const a = allInteractables[i];
          const b = allInteractables[j];
          if (a.currentlyWedgedOnStalk || b.currentlyWedgedOnStalk) continue;

          const minDist = (a.radius + b.radius) * 0.78;
          const dx = b.pos.x - a.pos.x;
          const dy = (b.pos.y + b.radius * 0.6) - (a.pos.y + a.radius * 0.6);
          const dz = b.pos.z - a.pos.z;
          const distSq = dx * dx + dy * dy + dz * dz;

          if (distSq < minDist * minDist && distSq > 0.0001) {
            const dist = Math.sqrt(distSq);
            const nx = dx / dist;
            const ny = dy / dist;
            const nz = dz / dist;
            const overlap = (minDist - dist) * 0.5;

            if (!a.isDragged) {
              a.pos.x -= nx * overlap;
              a.pos.y = Math.max(0, a.pos.y - ny * overlap);
              a.pos.z -= nz * overlap;
            }
            if (!b.isDragged) {
              b.pos.x += nx * overlap;
              b.pos.y = Math.max(0, b.pos.y + ny * overlap);
              b.pos.z += nz * overlap;
            }

            const rvx = b.vel.x - a.vel.x;
            const rvy = b.vel.y - a.vel.y;
            const rvz = b.vel.z - a.vel.z;
            const vn = rvx * nx + rvy * ny + rvz * nz;
            if (vn < 0) {
              const imp = -vn * 0.68;
              if (!a.isDragged) {
                a.vel.x -= imp * nx;
                a.vel.y -= imp * ny;
                a.vel.z -= imp * nz;
                a.squashVel -= Math.min(5.0, imp * 0.6);
              }
              if (!b.isDragged) {
                b.vel.x += imp * nx;
                b.vel.y += imp * ny;
                b.vel.z += imp * nz;
                b.squashVel -= Math.min(5.0, imp * 0.6);
              }
              if (imp > 1.5) soundFX.playBounce(imp * 0.07);
            }
          }
        }
      }
    }

    // ============================================================================
    // 11. POINTER INTERACTION: RAYCASTING, SQUEEZE, PICK UP, DRAG & THROW
    // ============================================================================
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    const dragPlane = new THREE.Plane();
    const dragHitPoint = new THREE.Vector3();
    const dragOffset = new THREE.Vector3();

    let hoveredFumo = null;
    let selectedFumo = null;
    let isDraggingFumo = false;
    let pointerDownScreen = new THREE.Vector2();
    let dragHistory = [];

    const tooltipEl = document.getElementById('fumo-tooltip');
    const tooltipEmojiEl = document.getElementById('tooltip-emoji');
    const tooltipTextEl = document.getElementById('tooltip-text');
    const badgeEl = document.getElementById('fumo-badge');
    const badgeDotEl = document.getElementById('fumo-badge-dot');
    const badgeNameEl = document.getElementById('fumo-badge-name');
    const badgeStatusEl = document.getElementById('fumo-badge-status');

    function updatePointerNDC(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function pickFumoUnderPointer() {
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(allFumoRaycastMeshes, false);
      if (hits.length > 0 && hits[0].object.userData.fumo) {
        return { fumo: hits[0].object.userData.fumo, point: hits[0].point };
      }
      return null;
    }

    function updateUIBadge(fumo, statusText) {
      if (!fumo) {
        badgeEl.classList.add('hidden');
        badgeEl.classList.remove('flex');
        return;
      }
      badgeEl.classList.remove('hidden');
      badgeEl.classList.add('flex');
      badgeDotEl.style.backgroundColor = fumo.accentColor;
      badgeNameEl.textContent = fumo.name;
      badgeStatusEl.textContent = statusText;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      recordInteraction();
      updatePointerNDC(e);
      pointerDownScreen.set(e.clientX, e.clientY);

      const hit = pickFumoUnderPointer();
      if (hit) {
        selectedFumo = hit.fumo;
        isDraggingFumo = false;
        controls.enabled = false;

        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        dragPlane.setFromNormalAndCoplanarPoint(camDir.negate(), selectedFumo.pos);

        if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
          dragOffset.subVectors(selectedFumo.pos, dragHitPoint);
        } else {
          dragOffset.set(0, 0, 0);
        }

        dragHistory = [{ pos: selectedFumo.pos.clone(), time: performance.now() }];
        updateUIBadge(selectedFumo, 'Selected');
      }
    });

    window.addEventListener('pointermove', (e) => {
      updatePointerNDC(e);

      if (selectedFumo) {
        recordInteraction();
        const moveDist = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);

        if (!isDraggingFumo && moveDist > 6) {
          isDraggingFumo = true;
          selectedFumo.isDragged = true;
          selectedFumo.isGrounded = false;
          selectedFumo.currentlyWedgedOnStalk = false; // Unwedge from bamboo stalk if grabbed!
          selectedFumo.squashVel += 3.2;
          soundFX.playPickup();
          updateUIBadge(selectedFumo, 'Dragging — Brush Bamboo or Throw!');
        }

        if (isDraggingFumo) {
          raycaster.setFromCamera(pointerNDC, camera);
          if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
            const targetPos = dragHitPoint.clone().add(dragOffset);
            targetPos.x = THREE.MathUtils.clamp(targetPos.x, -9.4, 9.4);
            targetPos.y = THREE.MathUtils.clamp(targetPos.y, 0.25, 11.5);
            targetPos.z = THREE.MathUtils.clamp(targetPos.z, -9.4, 9.4);

            const prevPos = selectedFumo.pos.clone();
            selectedFumo.pos.lerp(targetPos, 0.55);

            const deltaMove = selectedFumo.pos.clone().sub(prevPos);
            if (selectedFumo.headRollVel !== undefined) {
              selectedFumo.headRollVel -= deltaMove.x * 16.0;
              selectedFumo.headPitchVel += deltaMove.z * 16.0 - deltaMove.y * 10.0;
              selectedFumo.limbRollVel -= deltaMove.x * 22.0;
            }
            selectedFumo.roll = THREE.MathUtils.lerp(selectedFumo.roll, THREE.MathUtils.clamp(-deltaMove.x * 1.4, -0.45, 0.45), 0.3);
            selectedFumo.pitch = THREE.MathUtils.lerp(selectedFumo.pitch, THREE.MathUtils.clamp(deltaMove.z * 1.4, -0.45, 0.45), 0.3);

            const now = performance.now();
            dragHistory.push({ pos: selectedFumo.pos.clone(), time: now });
            while (dragHistory.length > 6) dragHistory.shift();
          }
          tooltipEl.style.opacity = '0';
          renderer.domElement.style.cursor = 'grabbing';
          return;
        }
      }

      const hit = pickFumoUnderPointer();
      if (hit) {
        hoveredFumo = hit.fumo;
        renderer.domElement.style.cursor = 'grab';
        tooltipEmojiEl.textContent = hoveredFumo.emoji;
        tooltipTextEl.textContent = hoveredFumo.name;
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = `${e.clientX + 14}px`;
        tooltipEl.style.top = `${e.clientY - 18}px`;
      } else {
        hoveredFumo = null;
        renderer.domElement.style.cursor = 'default';
        tooltipEl.style.opacity = '0';
      }
    });

    window.addEventListener('pointerup', () => {
      if (!selectedFumo) return;
      controls.enabled = true;
      recordInteraction();

      if (!isDraggingFumo) {
        selectedFumo.squeeze(1.0);
        // If Mystia is squeezed while wedged on the bamboo stalk, make the bamboo stalk wobble too!
        if (selectedFumo.currentlyWedgedOnStalk && selectedFumo.attachedStalkIdx !== null) {
          const st = bambooStalks[selectedFumo.attachedStalkIdx];
          if (st) {
            st.velX += (Math.random() - 0.5) * 8.0;
            st.velZ += (Math.random() - 0.5) * 8.0;
          }
        }
        updateUIBadge(selectedFumo, 'Squeezed! ᗜˬᗜ');
      } else {
        selectedFumo.isDragged = false;
        const now = performance.now();
        while (dragHistory.length > 1 && now - dragHistory[0].time > 140) {
          dragHistory.shift();
        }
        if (dragHistory.length >= 2) {
          const first = dragHistory[0];
          const last = dragHistory[dragHistory.length - 1];
          const dtSec = Math.max(0.016, (last.time - first.time) / 1000);
          const throwVel = last.pos.clone().sub(first.pos).divideScalar(dtSec);
          if (throwVel.length() > 22) throwVel.setLength(22);
          selectedFumo.vel.copy(throwVel);

          const speed = throwVel.length();
          selectedFumo.angVel.set(
            throwVel.z * 0.65 + (Math.random() - 0.5) * speed * 0.4,
            (Math.random() - 0.5) * speed * 0.5,
            -throwVel.x * 0.65 + (Math.random() - 0.5) * speed * 0.4
          );
        } else {
          selectedFumo.vel.set(0, 0, 0);
        }
        updateUIBadge(selectedFumo, 'Thrown!');
      }

      selectedFumo = null;
      isDraggingFumo = false;
      renderer.domElement.style.cursor = hoveredFumo ? 'grab' : 'default';
    });

    // ============================================================================
    // 12. DAY / NIGHT SMOOTH INTERPOLATION (~2 SECONDS) & HUB INTEGRATION
    // ============================================================================
    const STORAGE_MODE_KEY = 'voxel_fumo_bamboo_mode';
    let isNightMode = false;
    let dayNightProgress = 0.0; // 0.0 = Day, 1.0 = Night
    let dayNightTarget = 0.0;

    const daySkyColor = new THREE.Color('#bfe3cd');
    const nightSkyColor = new THREE.Color('#071318');

    const dayCanopyLightCol = new THREE.Color('#fff5d6');
    const nightMoonLightCol = new THREE.Color('#6495ed');

    const dayHemiSky = new THREE.Color('#e6f7ed');
    const nightHemiSky = new THREE.Color('#132a38');
    const dayHemiGround = new THREE.Color('#3b5239');
    const nightHemiGround = new THREE.Color('#081214');

    function notifyParentMode() {
      const modeStr = isNightMode ? 'night' : 'day';
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'modeChanged', mode: modeStr }, '*');
        }
      } catch (e) {}
    }

    function setDayNightMode(night, { immediate = false, playSound = true } = {}) {
      isNightMode = Boolean(night);
      dayNightTarget = isNightMode ? 1.0 : 0.0;
      if (immediate) {
        dayNightProgress = dayNightTarget;
      }
      document.body.classList.toggle('night-ui', isNightMode);

      try {
        localStorage.setItem(STORAGE_MODE_KEY, isNightMode ? 'night' : 'day');
      } catch (e) {}

      if (playSound) {
        soundFX.playPickup();
      }
      notifyParentMode();
    }

    function toggleDayNight() {
      setDayNightMode(!isNightMode, { immediate: false, playSound: true });
    }

    function updateDayNightTransition(dt) {
      if (Math.abs(dayNightProgress - dayNightTarget) > 0.0005) {
        const step = dt * 0.52; // ~2 seconds transition
        if (dayNightProgress < dayNightTarget) {
          dayNightProgress = Math.min(dayNightTarget, dayNightProgress + step);
        } else {
          dayNightProgress = Math.max(dayNightTarget, dayNightProgress - step);
        }
      }

      const t = dayNightProgress < 0.5
        ? 4 * dayNightProgress * dayNightProgress * dayNightProgress
        : 1 - Math.pow(-2 * dayNightProgress + 2, 3) / 2;

      // 1. Sky & Mist Fog
      scene.background.lerpColors(daySkyColor, nightSkyColor, t);
      scene.fog.color.copy(scene.background);
      scene.fog.density = THREE.MathUtils.lerp(0.014, 0.021, t);

      // 2. Canopy Sun -> Moonlight
      canopyDirLight.color.lerpColors(dayCanopyLightCol, nightMoonLightCol, t);
      canopyDirLight.intensity = THREE.MathUtils.lerp(1.32, 0.42, t);

      hemiLight.color.lerpColors(dayHemiSky, nightHemiSky, t);
      hemiLight.groundColor.lerpColors(dayHemiGround, nightHemiGround, t);
      hemiLight.intensity = THREE.MathUtils.lerp(0.72, 0.24, t);

      // 3. Huge Full Moon & Canopy Light Shafts
      moonGroup.position.y = THREE.MathUtils.lerp(11.0, 14.8, t);
      moonCoreMat.opacity = THREE.MathUtils.lerp(0.12, 0.98, t);
      moonHaloMat.opacity = THREE.MathUtils.lerp(0.02, 0.34, t);
      shaftMat.opacity = THREE.MathUtils.lerp(0.10, 0.02, t);

      // 4. Lanterns, Eientei Shoji Doors & Fireflies Glow at Night
      verandaLight.intensity = THREE.MathUtils.lerp(0.15, 1.35, t);
      lanternPathLight.intensity = THREE.MathUtils.lerp(0.12, 1.15, t);
      lanternEmissiveMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.35, 2.35, t);
      shojiEmissiveMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.18, 1.25, t);
      fireEmissiveMaterial.emissiveIntensity = THREE.MathUtils.lerp(1.2, 2.5, t);
      waterMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.15, 0.45, t);

      fireflyMat.opacity = THREE.MathUtils.lerp(0.32, 0.95, t);
      fireflyMat.color.lerpColors(new THREE.Color('#fef08a'), new THREE.Color('#bef264'), t);

      // 5. UnrealBloomPass Strength
      if (bloomPass) {
        bloomPass.strength = THREE.MathUtils.lerp(0.16, 0.72, t);
        bloomPass.threshold = THREE.MathUtils.lerp(0.84, 0.58, t);
      }
    }

    // UI Button & Keyboard Listeners
    document.getElementById('btn-reset').addEventListener('click', () => {
      allInteractables.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 40));
      updateUIBadge(null, '');
    });

    document.getElementById('btn-squeeze-all').addEventListener('click', () => {
      allInteractables.forEach((f, idx) => setTimeout(() => f.squeeze(1.05), idx * 50));
    });

    const btnSound = document.getElementById('btn-sound');
    const iconSoundOn = document.getElementById('icon-sound-on');
    const iconSoundOff = document.getElementById('icon-sound-off');
    btnSound.addEventListener('click', () => {
      soundFX.enabled = !soundFX.enabled;
      iconSoundOn.classList.toggle('hidden', !soundFX.enabled);
      iconSoundOff.classList.toggle('hidden', soundFX.enabled);
      if (soundFX.enabled) soundFX.playPickup();
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      const key = e.key.toLowerCase();
      if (key === 'n') {
        e.preventDefault();
        toggleDayNight();
      } else if (key === 'r') {
        allInteractables.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 40));
      } else if (key === ' ') {
        e.preventDefault();
        allInteractables.forEach((f, idx) => setTimeout(() => f.squeeze(1.05), idx * 50));
      } else if (key === 'm') {
        btnSound.click();
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================================
    // 13. MAIN ANIMATION LOOP, PAUSE / RESUME & HUB MESSAGE LISTENER
    // ============================================================================
    let prevTime = performance.now();
    let isPaused = false;
    let rafId = null;

    function animate(now) {
      if (isPaused) return;
      rafId = requestAnimationFrame(animate);

      const dt = Math.min(0.033, Math.max(0.001, (now - prevTime) / 1000));
      prevTime = now;
      const elapsed = now * 0.001;

      if (!selectedFumo && (now - lastUserInteractionTime > 4500)) {
        controls.autoRotate = true;
      }

      controls.update();
      updateDayNightTransition(dt);
      updateBambooGrove(elapsed, dt, allInteractables);
      updateFireflies(elapsed);
      updateFallingLeaves(elapsed, dt);
      updateCampfireEmbers(elapsed, dt);
      updatePondRipples(elapsed, dt);
      updatePopParticles(dt);

      for (let i = 0; i < fumos.length; i++) {
        fumos[i].updatePhysics(dt, elapsed);
      }
      for (let i = 0; i < bunnyMochis.length; i++) {
        bunnyMochis[i].updatePhysics(dt);
      }
      resolvePlushCollisions();

      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    function pauseRenderLoop() {
      if (isPaused) return;
      isPaused = true;
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    function resumeRenderLoop() {
      if (!isPaused) return;
      isPaused = false;
      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    }

    // Listen for messages from the parent scene browser hub
    // Lifecycle management: Day/Night sync, pause/resume on tab visibility, and WebGL resource cleanup on destroy
    const _sceneLifecycle = new FumoSceneLifecycle({
      renderer,
      scene,
      composer: typeof composer !== 'undefined' ? composer : null,
      audio: typeof soundFX !== 'undefined' ? soundFX : (typeof audio !== 'undefined' ? audio : null),
      onToggleMode: typeof toggleDayNight === 'function' ? toggleDayNight : null,
      onSetMode: (mode) => {
        if (typeof setDayNightMode === 'function') {
          setDayNightMode(mode === 'night', { immediate: false });
        } else if (typeof toggleDayNight === 'function') {
          const isNight = document.body.classList.contains('night-ui');
          if (isNight !== (mode === 'night')) toggleDayNight();
        }
      },
      onPause: typeof pauseRenderLoop === 'function' ? pauseRenderLoop : (typeof pauseScene === 'function' ? pauseScene : null),
      onResume: typeof resumeRenderLoop === 'function' ? resumeRenderLoop : (typeof resumeScene === 'function' ? resumeScene : null)
    });

    window.onload = function () {
      let initialNight = false;
      try {
        const saved = localStorage.getItem(STORAGE_MODE_KEY);
        if (saved === 'night') initialNight = true;
      } catch (e) {}

      setDayNightMode(initialNight, { immediate: true, playSound: false });
      updateDayNightTransition(0);

      // Initial welcoming gentle bounce on all Fumos & Bunny Mochis
      allInteractables.forEach((f, idx) => {
        setTimeout(() => {
          f.squash = 0.78;
          f.squashVel = 2.0;
          if (f.headPitchVel !== undefined) f.headPitchVel = 4.0;
        }, 120 + idx * 65);
      });

      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    };
  </script>
</body>

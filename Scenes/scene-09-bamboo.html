<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Bamboo Forest of the Lost — Touhou Fumo Voxel Diorama</title>
  <link rel="stylesheet" href="../Shared/fumo-scene.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Three.js r128 + OrbitControls + Post-Processing (UnrealBloomPass) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="../Shared/fumo-core.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background-color: #0b1815;
    }
    h1, .font-display {
      font-family: 'Fredoka', sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    .glass-panel {
      background: rgba(242, 250, 244, 0.80);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 10px 28px -6px rgba(10, 30, 20, 0.22), 0 2px 6px rgba(10, 30, 20, 0.1);
      transition: background 0.5s ease, color 0.5s ease, border-color 0.5s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    body.night-ui .glass-panel {
      background: rgba(16, 26, 34, 0.78);
      border-color: rgba(134, 239, 172, 0.24);
      color: #ecfdf5;
      box-shadow: 0 10px 30px -6px rgba(0, 0, 0, 0.6), 0 0 18px rgba(74, 222, 128, 0.12);
    }
    .ui-btn {
      cursor: pointer;
    }
    .ui-btn:hover {
      transform: translateY(-2px) scale(1.03);
    }
    .ui-btn:active {
      transform: translateY(1px) scale(0.97);
    }
    #fumo-tooltip {
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    kbd {
      font-family: 'Fredoka', sans-serif;
      display: inline-block;
      padding: 1px 6px;
      font-size: 0.75rem;
      line-height: 1.2;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.08);
      border-bottom: 2px solid rgba(0, 0, 0, 0.18);
    }
    body.night-ui kbd {
      background: rgba(255, 255, 255, 0.14);
      border-bottom-color: rgba(255, 255, 255, 0.28);
    }
  </style>
</head>
<body class="text-slate-800">
  <div id="canvas-container"></div>

  <!-- Top-Right Controls: Active Fumo Badge, Squeeze All, Toss Mochi, Reset, Sound (Top-Left kept clear for Hub) -->
  <div class="fixed top-4 right-4 z-20 flex items-center gap-2.5">
    <!-- Active / Hovered Fumo Indicator -->
    <div id="fumo-badge" class="glass-panel rounded-2xl px-3.5 py-2.5 text-xs font-semibold hidden items-center gap-2 transition-all">
      <span id="fumo-badge-dot" class="w-2.5 h-2.5 rounded-full inline-block bg-emerald-500"></span>
      <span id="fumo-badge-name">Fujiwara no Mokou</span>
      <span id="fumo-badge-status" class="opacity-70 ml-1">By Campfire</span>
    </div>

    <!-- Squeeze All Button -->
    <button id="btn-squeeze-all" title="Squeeze All Fumos & Bunny Mochi! (Space)"
      class="glass-panel ui-btn rounded-2xl px-3.5 py-2.5 flex items-center gap-2 text-xs sm:text-sm font-semibold">
      <span class="text-base leading-none">🎋</span>
      <span class="hidden md:inline">Squeeze All</span>
    </button>

    <!-- Reset Fumos Button -->
    <button id="btn-reset" title="Return Fumos & Mochi to Cozy Spots (R)"
      class="glass-panel ui-btn rounded-2xl px-3.5 py-2.5 flex items-center gap-2 text-xs sm:text-sm font-semibold">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      <span class="hidden sm:inline">Reset</span>
    </button>

    <!-- Sound Toggle Button -->
    <button id="btn-sound" title="Toggle Forest & Plush Sound Effects (M)"
      class="glass-panel ui-btn rounded-2xl p-2.5 flex items-center justify-center">
      <svg id="icon-sound-on" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
      <svg id="icon-sound-off" class="w-5 h-5 hidden opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
    </button>
  </div>

  <!-- Floating Cursor Tooltip for Hovered Fumo or Rabbit Mochi -->
  <div id="fumo-tooltip" class="fixed z-30 opacity-0 px-3 py-1.5 rounded-xl glass-panel text-xs font-semibold flex items-center gap-2 shadow-lg">
    <span id="tooltip-emoji">🔥</span>
    <span id="tooltip-text">Mokou Fumo</span>
  </div>

  <!-- Bottom HUD Hints (Centered so bottom-left stays clear for Hub hint) -->
  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-20 pointer-events-none w-max max-w-[94vw]">
    <div class="glass-panel rounded-2xl px-4 py-2 text-xs font-semibold flex flex-wrap items-center justify-center gap-x-4 gap-y-1 opacity-90">
      <span>🖱️ <b>Click Fumo / Mochi:</b> Squeeze</span>
      <span>✋ <b>Drag & Throw:</b> Rustle Bamboo & Bounce</span>
      <span>🔄 <b>Drag Forest:</b> Orbit Camera</span>
      <span class="hidden sm:inline"><kbd>R</kbd> Reset</span>
      <span class="hidden md:inline"><kbd>Space</kbd> Squeeze All</span>
    </div>
  </div>

  <script>
    // ============================================================================
    // 1. PROCEDURAL WEB AUDIO SYNTHESIZER (Plush Squeaks, Bamboo Rustle, Splash)
    // ============================================================================
    class PlushSoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.lastRustleTime = 0;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playSqueeze(pitchMultiplier = 1.0) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sine';
          const baseFreq = (520 + Math.random() * 80) * pitchMultiplier;
          osc1.frequency.setValueAtTime(baseFreq, now);
          osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.48, now + 0.085);
          osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.15, now + 0.16);

          gain1.gain.setValueAtTime(0.001, now);
          gain1.gain.linearRampToValueAtTime(0.11, now + 0.025);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.17);

          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.18);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(baseFreq * 1.1, now + 0.11);
          osc2.frequency.exponentialRampToValueAtTime(baseFreq * 1.65, now + 0.21);

          gain2.gain.setValueAtTime(0.001, now + 0.11);
          gain2.gain.linearRampToValueAtTime(0.08, now + 0.13);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start(now + 0.11);
          osc2.stop(now + 0.25);
        } catch (e) {}
      }

      playBounce(intensity = 0.5, isMochi = false) {
        if (!this.enabled || intensity < 0.08) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const vol = Math.min(0.14, intensity * 0.12);

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = isMochi ? 'triangle' : 'sine';
          const startFreq = (isMochi ? 180 : 115) + Math.min(90, intensity * 38);
          osc.frequency.setValueAtTime(startFreq, now);
          osc.frequency.exponentialRampToValueAtTime(isMochi ? 260 : 42, now + 0.095);

          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.11);
        } catch (e) {}
      }

      playBambooClack() {
        if (!this.enabled) return;
        const nowMs = performance.now();
        if (nowMs - this.lastRustleTime < 90) return;
        this.lastRustleTime = nowMs;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          const f = 320 + Math.random() * 180;
          osc.frequency.setValueAtTime(f, now);
          osc.frequency.exponentialRampToValueAtTime(f * 0.65, now + 0.045);
          gain.gain.setValueAtTime(0.035, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.055);
        } catch (e) {}
      }

      playPickup() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(440, now + 0.09);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.05, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        } catch (e) {}
      }
    }

    const soundFX = new PlushSoundEngine();

    // ============================================================================
    // 2. COLOR & VOXEL HELPER UTILITIES
    // ============================================================================
    const tempColor = new THREE.Color();
    const tempMatrix = new THREE.Matrix4();
    const tempPos = new THREE.Vector3();
    const tempQuat = new THREE.Quaternion();
    const tempScale = new THREE.Vector3();
    const tempEuler = new THREE.Euler();

    function voxelHash(x, y, z) {
      let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
      return n - Math.floor(n);
    }

    function varyColor(hexOrString, x, y, z, variance = 0.035, seamDarken = 0) {
      tempColor.set(hexOrString);
      const h = voxelHash(x, y, z);
      const delta = (h - 0.5) * 2 * variance - seamDarken;
      tempColor.offsetHSL(0, (h - 0.5) * 0.03, delta);
      return tempColor.clone();
    }

    function createSoftVoxelGeometry(size = 1) {
      const s = size * 0.985;
      return new THREE.BoxGeometry(s, s, s);
    }

    function buildVoxelInstancedMesh(voxels, unitSize, material, castShadow = true, receiveShadow = true) {
      if (!voxels || voxels.length === 0) return null;
      const geom = createSoftVoxelGeometry(unitSize);
      const mesh = new THREE.InstancedMesh(geom, material, voxels.length);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = receiveShadow;

      for (let i = 0; i < voxels.length; i++) {
        const v = voxels[i];
        tempPos.set(v.x * unitSize, v.y * unitSize, v.z * unitSize);
        if (v.rx || v.ry || v.rz) {
          tempEuler.set(v.rx || 0, v.ry || 0, v.rz || 0);
          tempQuat.setFromEuler(tempEuler);
        } else {
          tempQuat.identity();
        }
        tempScale.set(v.sx || 1, v.sy || 1, v.sz || 1);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        mesh.setMatrixAt(i, tempMatrix);
        mesh.setColorAt(i, v.color instanceof THREE.Color ? v.color : new THREE.Color(v.color));
      }
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      return mesh;
    }

    // ============================================================================
    // 3. SCENE, CAMERA, RENDERER & POST-PROCESSING SETUP
    // ============================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#bfe3cd');
    scene.fog = new THREE.FogExp2('#bfe3cd', 0.014);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.5, 140);
    camera.position.set(18.5, 13.0, 20.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(getOptimalPixelRatio());
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.04;
    container.appendChild(renderer.domElement);

    let composer = null;
    let bloomPass = null;
    try {
      const renderPass = new THREE.RenderPass(scene, camera);
      bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.18,
        0.58,
        0.80
      );
      composer = new THREE.EffectComposer(renderer);
      composer.addPass(renderPass);
      composer.addPass(bloomPass);
    } catch (err) {
      composer = null;
    }

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0.0, 3.0, 0.0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI * 0.475;
    controls.minPolarAngle = Math.PI * 0.08;
    controls.minDistance = 8.5;
    controls.maxDistance = 42;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 0.42;

    let lastUserInteractionTime = performance.now();
    const recordInteraction = () => {
      lastUserInteractionTime = performance.now();
      controls.autoRotate = false;
    };
    controls.addEventListener('start', recordInteraction);

    // ============================================================================
    // 4. LIGHTING SETUP (Capped Dynamic Lights for Performance)
    // ============================================================================
    // 1. Hemisphere Light (Canopy sky / mossy ground bounce)
    const hemiLight = new THREE.HemisphereLight(0xe6f7ed, 0x3b5239, 0.72);
    hemiLight.position.set(0, 25, 0);
    scene.add(hemiLight);

    // 2. Primary Canopy Sun / Moon Directional Light (Dappled forest shadows)
    const canopyDirLight = new THREE.DirectionalLight(0xfff4d6, 1.32);
    canopyDirLight.position.set(-14, 24, -15);
    canopyDirLight.target.position.set(0, 1, 0);
    scene.add(canopyDirLight.target);
    canopyDirLight.castShadow = true;
    canopyDirLight.shadow.mapSize.width = 2048;
    canopyDirLight.shadow.mapSize.height = 2048;
    canopyDirLight.shadow.camera.near = 2;
    canopyDirLight.shadow.camera.far = 55;
    const dCam = 15.5;
    canopyDirLight.shadow.camera.left = -dCam;
    canopyDirLight.shadow.camera.right = dCam;
    canopyDirLight.shadow.camera.top = dCam;
    canopyDirLight.shadow.camera.bottom = -dCam;
    canopyDirLight.shadow.bias = -0.0006;
    canopyDirLight.shadow.radius = 2.5;
    scene.add(canopyDirLight);

    // 3. Campfire Flickering Point Light (Casts cozy shadows from plushies & logs!)
    const campfireLight = new THREE.PointLight(0xff7b29, 0.95, 16, 1.6);
    campfireLight.position.set(2.5, 1.35, 3.0);
    campfireLight.castShadow = true;
    campfireLight.shadow.mapSize.width = 1024;
    campfireLight.shadow.mapSize.height = 1024;
    campfireLight.shadow.bias = -0.001;
    scene.add(campfireLight);

    // 4. Eientei Hut Veranda & Shoji Warm Lantern Light
    const verandaLight = new THREE.PointLight(0xffb454, 0.2, 14, 1.5);
    verandaLight.position.set(-3.2, 3.6, -3.5);
    scene.add(verandaLight);

    // 5. Forest Path Paper Lantern & Firefly Glow Light
    const lanternPathLight = new THREE.PointLight(0xff9e44, 0.15, 13, 1.6);
    lanternPathLight.position.set(0.0, 3.2, 6.8);
    scene.add(lanternPathLight);

    // Shared Materials
    const plushMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.92,
      metalness: 0.02
    });

    const forestSolidMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.85,
      metalness: 0.04
    });

    const bambooMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.55,
      metalness: 0.08
    });

    const waterMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.82,
      roughness: 0.15,
      metalness: 0.08,
      transmission: 0.3,
      emissive: new THREE.Color(0x0d9488),
      emissiveIntensity: 0.18
    });

    const lanternEmissiveMaterial = new THREE.MeshStandardMaterial({
      color: 0xfff5e4,
      emissive: new THREE.Color(0xff9436),
      emissiveIntensity: 0.45,
      roughness: 0.3
    });

    const shojiEmissiveMaterial = new THREE.MeshStandardMaterial({
      color: 0xfff8eb,
      emissive: new THREE.Color(0xffbe6b),
      emissiveIntensity: 0.25,
      roughness: 0.6
    });

    const fireEmissiveMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: new THREE.Color(0xff6b1a),
      emissiveIntensity: 1.6,
      roughness: 0.2
    });

    // ============================================================================
    // 5. FOREST CLEARING, HUT, CAMPFIRE, WELL, POND, MORTAR & PROPS
    // ============================================================================
    const RV = 0.25; // 1 Environment Voxel = 0.25 world units
    const furnitureColliders = [];

    function addCollider(minX, minY, minZ, maxX, maxY, maxZ, name = 'prop') {
      furnitureColliders.push({
        min: new THREE.Vector3(minX, minY, minZ),
        max: new THREE.Vector3(maxX, maxY, maxZ),
        name
      });
    }

    const solidForestVoxels = [];
    const lanternVoxels = [];
    const shojiVoxels = [];
    const waterVoxels = [];
    const fireCoreVoxels = [];

    function pushVoxel(list, rx, ry, rz, colorHex, variance = 0.03, sx = 1, sy = 1, sz = 1, rxRot = 0, ryRot = 0, rzRot = 0) {
      list.push({
        x: rx,
        y: ry,
        z: rz,
        color: varyColor(colorHex, rx, ry, rz, variance),
        sx, sy, sz,
        rx: rxRot, ry: ryRot, rz: rzRot
      });
    }

    function pushBoxVoxels(list, x0, y0, z0, x1, y1, z1, colorFnOrHex, variance = 0.03) {
      for (let x = x0; x <= x1; x++) {
        for (let y = y0; y <= y1; y++) {
          for (let z = z0; z <= z1; z++) {
            if (x > x0 && x < x1 && y > y0 && y < y1 && z > z0 && z < z1) continue;
            const c = typeof colorFnOrHex === 'function' ? colorFnOrHex(x, y, z) : colorFnOrHex;
            if (c) pushVoxel(list, x + 0.5, y + 0.5, z + 0.5, c, variance);
          }
        }
      }
    }

    // ----------------------------------------------------------------------------
    // 5A. MOSSY FOREST FLOOR, WINDING DIRT PATH, STEPPING STONES & POND BASIN
    // ----------------------------------------------------------------------------
    const POND_CENTER_X = -5.5;
    const POND_CENTER_Z = 5.0;

    function buildForestGroundAndPond() {
      // Ground island: rx from -44 to 43, rz from -44 to 43 (22x22 world units)
      for (let x = -44; x <= 43; x++) {
        for (let z = -44; z <= 43; z++) {
          const wx = (x + 0.5) * RV;
          const wz = (z + 0.5) * RV;

          // Pond oval check around (-5.5, 5.0)
          const pdx = (wx - POND_CENTER_X) / 3.2;
          const pdz = (wz - POND_CENTER_Z) / 2.6;
          const pondDist = Math.hypot(pdx, pdz);

          // Winding dirt path from front-center (0, 10.5) curving past campfire to veranda (-2.8, -3.2)
          const pathCenterX = Math.sin(wz * 0.28) * 1.65 - (wz < 0 ? 1.4 : 0.0);
          const distFromPath = Math.abs(wx - pathCenterX);

          const isBorder = (x === -44 || x === 43 || z === -44 || z === 43);

          if (pondDist < 0.96) {
            // Pond deeper bed + translucent water surface
            pushVoxel(solidForestVoxels, x + 0.5, -1.5, z + 0.5, '#1e3a3a', 0.03);
            const waterHex = pondDist < 0.6 ? '#0f766e' : '#14b8a6';
            pushVoxel(waterVoxels, x + 0.5, -0.35, z + 0.5, waterHex, 0.02, 1, 0.7, 1);
            continue;
          } else if (pondDist < 1.14) {
            // Smooth river stones bordering the pond
            const stoneCol = ((x + z) % 2 === 0) ? '#64748b' : '#475569';
            pushVoxel(solidForestVoxels, x + 0.5, -0.3, z + 0.5, stoneCol, 0.04, 1, 1.3, 1);
            continue;
          }

          let groundCol = '#2d5a3c'; // Rich bamboo forest moss
          if (voxelHash(x, 0, z) > 0.62) groundCol = '#366946';
          else if (voxelHash(x, 1, z) < 0.22) groundCol = '#244730';

          // Winding earthen path
          if (distFromPath < 1.45 && wz > -4.2 && wz < 10.8) {
            groundCol = distFromPath < 1.05 ? '#7c583b' : '#634730';
          }

          // Clearing dirt around campfire (2.5, 3.0)
          const campDist = Math.hypot(wx - 2.5, wz - 3.0);
          if (campDist < 2.4) {
            groundCol = campDist < 1.5 ? '#694b35' : '#78553a';
          }

          pushVoxel(solidForestVoxels, x + 0.5, -0.5, z + 0.5, groundCol, 0.035);
          if (isBorder) {
            pushVoxel(solidForestVoxels, x + 0.5, -1.5, z + 0.5, '#3d281a', 0.02);
          }
        }
      }

      // Flat Stepping Stones along the winding path
      const steppingStones = [
        [0.2, 9.6], [1.1, 8.1], [1.4, 6.5], [0.9, 4.9],
        [0.0, 3.3], [-0.9, 1.7], [-1.7, 0.1], [-2.3, -1.5], [-2.7, -2.8]
      ];
      steppingStones.forEach(([sx, sz], idx) => {
        const rx0 = Math.round(sx / RV);
        const rz0 = Math.round(sz / RV);
        for (let dx = -2; dx <= 2; dx++) {
          for (let dz = -1; dz <= 2; dz++) {
            if (Math.abs(dx) === 2 && Math.abs(dz) >= 1) continue;
            const sCol = (idx % 2 === 0) ? '#78828c' : '#6c757d';
            pushVoxel(solidForestVoxels, rx0 + dx + 0.5, 0.15, rz0 + dz + 0.5, sCol, 0.03, 1, 0.35, 1);
          }
        }
      });

      // Voxel Lily Pads & Pink Lotus Flowers floating on the Pond
      const lilyPads = [
        { x: -6.3, z: 4.5, lotus: true },
        { x: -4.6, z: 5.5, lotus: true },
        { x: -5.6, z: 6.1, lotus: false },
        { x: -4.8, z: 4.0, lotus: false }
      ];
      lilyPads.forEach((pad) => {
        const px = Math.round(pad.x / RV);
        const pz = Math.round(pad.z / RV);
        for (let dx = -1; dx <= 1; dx++) {
          for (let dz = -1; dz <= 1; dz++) {
            if (dx === 1 && dz === 1) continue; // Classic notch in lily pad
            pushVoxel(solidForestVoxels, px + dx + 0.5, 0.1, pz + dz + 0.5, '#22c55e', 0.03, 1, 0.3, 1);
          }
        }
        if (pad.lotus) {
          pushVoxel(solidForestVoxels, px + 0.5, 0.5, pz + 0.5, '#f472b6', 0.02, 1.1, 0.7, 1.1);
          pushVoxel(solidForestVoxels, px + 0.5, 0.9, pz + 0.5, '#fbcfe8', 0.02, 0.65, 0.6, 0.65);
        }
      });
    }

    // ----------------------------------------------------------------------------
    // 5B. THATCHED-ROOF EIENTEI-STYLE HUT WITH WOODEN VERANDA & SLIDING SHOJI DOORS
    // ----------------------------------------------------------------------------
    function buildEienteiHut() {
      // Hut located in back-left clearing: X [-8.75, -1.25] -> rx [-35, -5], Z [-9.5, -3.25] -> rz [-38, -13]
      // 1. Stone Foundation & Wooden Veranda (Engawa) Deck (ry = 0..4 -> top surface at Y = 1.25)
      pushBoxVoxels(solidForestVoxels, -35, 0, -38, -5, 3, -13, (x, y, z) => {
        if (y <= 1) return '#57534e'; // Foundation stones
        return '#5c3a21'; // Dark cedar support beams
      }, 0.025);

      // Veranda polished wooden floorboards (ry = 4 -> top at Y = 1.25)
      for (let x = -35; x <= -5; x++) {
        for (let z = -38; z <= -13; z++) {
          const plankCol = (x % 3 === 0) ? '#8d5b38' : '#9c6640';
          pushVoxel(solidForestVoxels, x + 0.5, 4.5, z + 0.5, plankCol, 0.02);
        }
      }
      // Front wooden step up to veranda (rx -18..-11, rz -12..-11, ry 0..2 -> top at Y = 0.65)
      pushBoxVoxels(solidForestVoxels, -18, 0, -12, -11, 2, -11, '#7c4d2d');
      addCollider(-4.5, 0, -3.1, -2.7, 0.65, -2.6, 'veranda_step');
      addCollider(-8.8, 0, -9.5, -1.2, 1.25, -3.2, 'veranda_deck');

      // 2. Hut Walls & Glowing Sliding Shoji Doors (rx -33..-7, rz -36..-19, ry 5..18)
      for (let y = 5; y <= 18; y++) {
        for (let x = -33; x <= -7; x++) {
          for (let z = -36; z <= -19; z++) {
            if (x > -33 && x < -7 && z > -36 && z < -19) continue; // Hollow interior

            // Corner &中间 cedar pillars
            const isPillar = (x === -33 || x === -7 || x === -20) && (z === -36 || z === -19);
            if (isPillar || y === 5 || y >= 17) {
              pushVoxel(solidForestVoxels, x + 0.5, y + 0.5, z + 0.5, '#54341e', 0.02);
              continue;
            }

            // Front Wall (z === -19): Sliding Shoji Paper Screens (rx -29..-11, ry 6..16)
            if (z === -19 && x >= -29 && x <= -11 && y >= 6 && y <= 16) {
              // Wooden shoji lattice bars (`kumiko`)
              const isLattice = (x === -29 || x === -20 || x === -11 || (x + 30) % 3 === 0 || (y - 6) % 3 === 0);
              if (isLattice && y > 7) {
                pushVoxel(solidForestVoxels, x + 0.5, y + 0.5, z + 0.3, '#6e4528', 0.015, 0.45, 0.45, 0.45);
              }
              // Bottom wooden kickplate on shoji door (y <= 7)
              if (y <= 7) {
                pushVoxel(solidForestVoxels, x + 0.5, y + 0.5, z + 0.5, '#7a4d2d', 0.02);
              } else {
                // Warm translucent rice paper panel
                pushVoxel(shojiVoxels, x + 0.5, y + 0.5, z + 0.5, '#fff8e7', 0.015);
              }
              continue;
            }

            // Traditional Japanese plaster & timber wall
            const wallCol = (y <= 8) ? '#6e4528' : '#e8dec8';
            pushVoxel(solidForestVoxels, x + 0.5, y + 0.5, z + 0.5, wallCol, 0.02);
          }
        }
      }
      addCollider(-8.3, 1.25, -9.1, -1.7, 4.75, -4.7, 'hut_body');

      // Front Veranda Eave Support Posts (at z = -14, x = -34 and x = -6)
      for (let y = 5; y <= 18; y++) {
        pushVoxel(solidForestVoxels, -34 + 0.5, y + 0.5, -14 + 0.5, '#54341e', 0.02);
        pushVoxel(solidForestVoxels, -6 + 0.5, y + 0.5, -14 + 0.5, '#54341e', 0.02);
      }

      // 3. Stepped Thatched Roof (`Kayabuki`) with Bamboo Ridge Cap (ry = 19..28 -> Y = 4.75..7.25)
      for (let layer = 0; layer <= 9; layer++) {
        const y = 19 + layer;
        const xMin = -37 + Math.floor(layer * 1.2);
        const xMax = -3 - Math.floor(layer * 1.2);
        const zMin = -40 + Math.floor(layer * 1.1);
        const zMax = -11 - Math.floor(layer * 1.2);

        for (let x = xMin; x <= xMax; x++) {
          for (let z = zMin; z <= zMax; z++) {
            const isOuter = (x <= xMin + 1 || x >= xMax - 1 || z <= zMin + 1 || z >= zMax - 1 || layer === 9);
            if (!isOuter) continue;
            let thatchCol = ((layer + x + z) % 2 === 0) ? '#8a6d46' : '#785d3a';
            if (layer === 9) {
              // Ornamental green bamboo ridge beam & gold tips
              thatchCol = (x === xMin || x === xMax) ? '#eab308' : '#3a7d44';
            }
            pushVoxel(solidForestVoxels, x + 0.5, y + 0.5, z + 0.5, thatchCol, 0.035);
          }
        }
      }
      addCollider(-9.2, 4.75, -10.0, -0.8, 6.8, -2.8, 'hut_roof');

      // 4. Rice Cakes (Dango Skewers) & Green Tea Cup on Wooden Tray on the Veranda (rx -22..-18, rz -17..-14, ry = 5)
      for (let x = -22; x <= -18; x++) {
        for (let z = -17; z <= -14; z++) {
          const isRim = (x === -22 || x === -18 || z === -17 || z === -14);
          pushVoxel(solidForestVoxels, x + 0.5, 5.2, z + 0.5, isRim ? '#4a2c16' : '#6e4528', 0.02, 1, 0.5, 1);
        }
      }
      // Three-color Hanami Dango skewers (Pink, White, Matcha Green) on tray
      const dangoCols = ['#f472b6', '#ffffff', '#4ade80'];
      for (let d = 0; d < 3; d++) {
        pushVoxel(solidForestVoxels, -20.8 + d * 0.75, 5.7, -15.5 + (d - 1) * 0.35, dangoCols[d], 0.01, 0.75, 0.75, 0.75);
      }
      // Matcha teacup on tray
      pushVoxel(solidForestVoxels, -19.0, 5.7, -15.2, '#e2e8f0', 0.01, 0.9, 1.0, 0.9);
      pushVoxel(solidForestVoxels, -19.0, 6.1, -15.2, '#22c55e', 0.01, 0.65, 0.3, 0.65);
    }

    // ----------------------------------------------------------------------------
    // 5C. CAMPFIRE RING WITH LOGS, STONE WELL, MOCHI MORTAR & SMALL PROPS
    // ----------------------------------------------------------------------------
    function buildCampfireWellAndProps() {
      // 1. Campfire Ring at (2.5, 3.0) -> rx = 10, rz = 12
      const cx = 10;
      const cz = 12;
      for (let a = 0; a < 12; a++) {
        const ang = (a / 12) * Math.PI * 2;
        const sx = cx + Math.cos(ang) * 3.2;
        const sz = cz + Math.sin(ang) * 3.2;
        pushVoxel(solidForestVoxels, sx, 0.4, sz, (a % 2 === 0) ? '#64748b' : '#475569', 0.04, 1.3, 0.9, 1.3);
      }
      // Charred firewood logs crisscrossed in fire pit
      for (let i = -2; i <= 2; i++) {
        pushVoxel(solidForestVoxels, cx + i * 0.8, 0.4, cz + i * 0.5, '#3b2314', 0.03, 0.85, 0.7, 0.85);
        pushVoxel(solidForestVoxels, cx + i * 0.8, 0.5, cz - i * 0.6, '#2b1810', 0.03, 0.85, 0.7, 0.85);
      }
      // Glowing fire core voxels
      pushVoxel(fireCoreVoxels, cx, 0.9, cz, '#ff5400', 0.02, 1.8, 1.4, 1.8);
      pushVoxel(fireCoreVoxels, cx + 0.4, 1.5, cz - 0.3, '#ff9e00', 0.02, 1.2, 1.6, 1.2);
      pushVoxel(fireCoreVoxels, cx - 0.3, 1.9, cz + 0.2, '#ffea00', 0.02, 0.85, 1.4, 0.85);

      // Two Cozy Wooden Sitting Logs around the Campfire
      // Log 1 (East of campfire: X = 4.6, Z = 1.6..4.2 -> rx 18..19, rz 6..16, ry 0..2 -> top at Y = 0.75)
      for (let z = 6; z <= 16; z++) {
        for (let x = 17; x <= 19; x++) {
          for (let y = 0; y <= 2; y++) {
            if (y === 2 && (x === 17 || x === 19)) continue;
            const isEnd = (z === 6 || z === 16) && x === 18 && y === 1;
            pushVoxel(solidForestVoxels, x + 0.5, y + 0.5, z + 0.5, isEnd ? '#d4a373' : '#6e472b', 0.03);
          }
        }
      }
      addCollider(4.2, 0, 1.5, 5.0, 0.75, 4.2, 'campfire_log_east');

      // Log 2 (South of campfire: X = 0.8..3.4, Z = 5.0 -> rx 3..13, rz 19..21, ry 0..2 -> top at Y = 0.75)
      for (let x = 3; x <= 13; x++) {
        for (let z = 19; z <= 21; z++) {
          for (let y = 0; y <= 2; y++) {
            if (y === 2 && (z === 19 || z === 21)) continue;
            const isEnd = (x === 3 || x === 13) && z === 20 && y === 1;
            pushVoxel(solidForestVoxels, x + 0.5, y + 0.5, z + 0.5, isEnd ? '#d4a373' : '#6e472b', 0.03);
          }
        }
      }
      addCollider(0.75, 0, 4.7, 3.5, 0.75, 5.5, 'campfire_log_south');

      // Woven Straw Hat (`Kasa`) resting on the South Log (X = 1.3, Z = 5.0 -> rx 5, rz 20)
      for (let hx = -3; hx <= 3; hx++) {
        for (let hz = -3; hz <= 3; hz++) {
          const r = Math.hypot(hx, hz);
          if (r <= 3.2) {
            const hy = 3.0 + (3.2 - r) * 0.55;
            pushVoxel(solidForestVoxels, 5.5 + hx * 0.65, hy, 20.0 + hz * 0.65, r < 1.1 ? '#b08968' : '#e9c46a', 0.03, 0.75, 0.55, 0.75);
          }
        }
      }

      // 2. Traditional Stone Well with Wooden Roof & Bucket (X = 5.5, Z = -3.5 -> rx = 22, rz = -14)
      const wx0 = 22;
      const wz0 = -14;
      for (let y = 0; y <= 4; y++) {
        for (let dx = -4; dx <= 4; dx++) {
          for (let dz = -4; dz <= 4; dz++) {
            const r = Math.hypot(dx, dz);
            if (r <= 4.2 && r >= 2.6) {
              const sCol = ((dx + dz + y) % 2 === 0) ? '#64748b' : '#475569';
              pushVoxel(solidForestVoxels, wx0 + dx + 0.5, y + 0.5, wz0 + dz + 0.5, sCol, 0.035);
            } else if (r < 2.6 && y === 2) {
              pushVoxel(waterVoxels, wx0 + dx + 0.5, y + 0.5, wz0 + dz + 0.5, '#0284c7', 0.02);
            }
          }
        }
      }
      // Well wooden posts, crossbeam, rope & wooden bucket
      for (let y = 5; y <= 13; y++) {
        pushVoxel(solidForestVoxels, wx0 - 3.5, y + 0.5, wz0 + 0.5, '#5c3a21', 0.02);
        pushVoxel(solidForestVoxels, wx0 + 4.5, y + 0.5, wz0 + 0.5, '#5c3a21', 0.02);
      }
      for (let dx = -5; dx <= 5; dx++) {
        pushVoxel(solidForestVoxels, wx0 + dx + 0.5, 13.5, wz0 + 0.5, '#5c3a21', 0.02);
        for (let dz = -3; dz <= 3; dz++) {
          const roofY = 14.5 + (3 - Math.abs(dz)) * 0.65;
          pushVoxel(solidForestVoxels, wx0 + dx + 0.5, roofY, wz0 + dz + 0.5, '#6e472b', 0.025);
        }
      }
      // Rope & hanging wooden water bucket
      for (let y = 7; y <= 13; y++) {
        pushVoxel(solidForestVoxels, wx0 + 0.5, y + 0.5, wz0 + 0.5, '#d4a373', 0.02, 0.35, 1, 0.35);
      }
      pushBoxVoxels(solidForestVoxels, wx0 - 1, 5, wz0 - 1, wx0 + 1, 7, wz0 + 1, '#9c6644');
      addCollider(4.4, 0, -4.6, 6.6, 1.35, -2.4, 'stone_well');

      // 3. Mochi-Pounding Wooden Mortar (`Usu`) & Mallet (`Kine`) at X = -1.5, Z = 1.5 (rx = -6, rz = 6)
      const mx0 = -6;
      const mz0 = 6;
      for (let y = 0; y <= 4; y++) {
        const rOuter = (y === 2) ? 2.7 : 3.2; // Classic carved waist of an Usu mortar
        for (let dx = -3; dx <= 3; dx++) {
          for (let dz = -3; dz <= 3; dz++) {
            const r = Math.hypot(dx, dz);
            if (r > rOuter) continue;
            // Hollow bowl on top layers (y >= 3) so a sleeping Fumo sits inside!
            if (y >= 3 && r < 2.0) {
              if (y === 3) {
                // Soft white pounded mochi cushion inside the mortar!
                pushVoxel(solidForestVoxels, mx0 + dx + 0.5, y + 0.4, mz0 + dz + 0.5, '#fffdf9', 0.015);
              }
              continue;
            }
            const woodCol = (y === 2) ? '#784b2a' : '#9c6644';
            pushVoxel(solidForestVoxels, mx0 + dx + 0.5, y + 0.5, mz0 + dz + 0.5, woodCol, 0.025);
          }
        }
      }
      addCollider(-2.3, 0, 0.7, -0.7, 1.15, 2.3, 'mochi_mortar');

      // Wooden Mallet (`Kine`) leaning against the mortar
      for (let i = 0; i < 7; i++) {
        pushVoxel(solidForestVoxels, mx0 + 3.2 + i * 0.25, 0.6 + i * 0.65, mz0 + 1.5, '#b07d4f', 0.02, 0.55, 0.8, 0.55);
      }
      // Heavy mallet head at bottom
      for (let hx = -1; hx <= 1; hx++) {
        pushVoxel(solidForestVoxels, mx0 + 3.2 + hx * 0.85, 0.8, mz0 + 1.5, '#8c5836', 0.02, 0.95, 1.35, 1.35);
      }

      // 4. Pile of Fresh Carrots near Tewi's Bamboo Hiding Spot (X = 5.6, Z = 6.2 -> rx = 22, rz = 25)
      const carrotSpots = [
        [21.5, 0.4, 24.5, 0.3], [22.6, 0.4, 25.1, -0.4], [21.8, 0.4, 25.8, 0.8],
        [22.1, 0.95, 25.0, -0.1], [22.9, 0.4, 24.2, 0.5], [21.2, 0.9, 25.3, 0.2]
      ];
      carrotSpots.forEach(([cx, cy, cz, yaw]) => {
        pushVoxel(solidForestVoxels, cx, cy, cz, '#f97316', 0.02, 1.9, 0.7, 0.7, 0, yaw, 0);
        pushVoxel(solidForestVoxels, cx + Math.cos(yaw) * 0.9, cy + 0.1, cz - Math.sin(yaw) * 0.9, '#22c55e', 0.02, 0.65, 0.65, 0.65, 0, yaw, 0);
      });

      // 5. Hanging Paper Lanterns (`Chochin`) along Hut Eaves and Bamboo Path Posts
      const addHangingLantern = (worldX, worldY, worldZ, postFromGround = false) => {
        const lx = worldX / RV;
        const ly = worldY / RV;
        const lz = worldZ / RV;
        if (postFromGround) {
          for (let py = 0; py <= ly + 2; py++) {
            pushVoxel(solidForestVoxels, lx - 1.2, py + 0.5, lz, '#3a5a40', 0.02, 0.75, 1, 0.75);
          }
          pushVoxel(solidForestVoxels, lx - 0.6, ly + 2.2, lz, '#3a5a40', 0.02, 2.2, 0.5, 0.5);
        }
        // Cord + top/bottom black lacquer caps + glowing red-and-cream paper body
        pushVoxel(solidForestVoxels, lx, ly + 1.6, lz, '#27272a', 0.01, 0.3, 1.0, 0.3);
        pushVoxel(solidForestVoxels, lx, ly + 1.0, lz, '#18181b', 0.01, 1.3, 0.45, 1.3);
        pushVoxel(lanternVoxels, lx, ly, lz, '#ffedd5', 0.01, 1.75, 1.85, 1.75);
        pushVoxel(solidForestVoxels, lx, ly - 1.0, lz, '#18181b', 0.01, 1.3, 0.45, 1.3);
      };

      // Two lanterns hanging from Eientei veranda eaves
      addHangingLantern(-7.8, 4.1, -3.4, false);
      addHangingLantern(-2.1, 4.1, -3.4, false);
      // Three bamboo-post lanterns guiding the winding forest path
      addHangingLantern(-1.4, 3.1, 8.2, true);
      addHangingLantern(2.2, 3.1, 7.6, true);
      addHangingLantern(7.0, 3.2, -1.2, true);
    }

    buildForestGroundAndPond();
    buildEienteiHut();
    buildCampfireWellAndProps();

    const envGroup = new THREE.Group();
    scene.add(envGroup);

    const solidEnvMesh = buildVoxelInstancedMesh(solidForestVoxels, RV, forestSolidMaterial, true, true);
    const lanternEnvMesh = buildVoxelInstancedMesh(lanternVoxels, RV, lanternEmissiveMaterial, false, false);
    const shojiEnvMesh = buildVoxelInstancedMesh(shojiVoxels, RV, shojiEmissiveMaterial, false, true);
    const waterEnvMesh = buildVoxelInstancedMesh(waterVoxels, RV, waterMaterial, false, true);
    const fireCoreMesh = buildVoxelInstancedMesh(fireCoreVoxels, RV, fireEmissiveMaterial, false, false);

    if (solidEnvMesh) envGroup.add(solidEnvMesh);
    if (lanternEnvMesh) envGroup.add(lanternEnvMesh);
    if (shojiEnvMesh) envGroup.add(shojiEnvMesh);
    if (waterEnvMesh) envGroup.add(waterEnvMesh);
    if (fireCoreMesh) envGroup.add(fireCoreMesh);

    // ============================================================================
    // 6. INTERACTIVE SWAYING BAMBOO GROVE (Travelling Wind Wave + Plush Disturbance!)
    // ============================================================================
    const bambooStalks = [];
    const bambooSegmentInstances = []; // { stalkIdx, segIdx, totalSegs, baseY, height, radiusScale, isRing }
    const bambooLeafInstances = [];    // { stalkIdx, attachY, ox, oy, oz, sx, sy, sz, ry, rz }

    const bambooGreens = ['#2d6a4f', '#40916c', '#52b788', '#386641', '#6a994e'];
    const bambooLeafGreens = ['#74c69d', '#52b788', '#95d5b2', '#40916c'];

    function generateBambooGrove() {
      // Hand-placed inner stalks (including Stalk #0 where Mystia is wedged halfway up!)
      const presetStalks = [
        { x: -7.2, z: 1.5, h: 12.5, r: 1.25, color: '#40916c', special: true }, // Stalk 0: Mystia's perch stalk!
        { x: 6.2, z: 5.5, h: 11.5, r: 1.1, color: '#2d6a4f' },
        { x: 7.4, z: 6.2, h: 13.0, r: 1.15, color: '#52b788' },
        { x: 6.8, z: 4.5, h: 10.5, r: 0.95, color: '#386641' },
        { x: -8.6, z: 2.6, h: 13.5, r: 1.15, color: '#2d6a4f' },
        { x: -7.8, z: 0.2, h: 11.0, r: 1.0, color: '#52b788' },
        { x: 8.2, z: 1.8, h: 12.8, r: 1.15, color: '#40916c' },
        { x: 8.8, z: -4.2, h: 13.5, r: 1.2, color: '#2d6a4f' },
        { x: 3.2, z: -8.6, h: 14.0, r: 1.2, color: '#386641' },
        { x: 1.2, z: -8.8, h: 12.2, r: 1.05, color: '#52b788' }
      ];

      // Procedural dense bamboo ring around the clearing perimeter
      for (let i = 0; i < 62; i++) {
        const ang = (i / 62) * Math.PI * 2 + (voxelHash(i, 2, 9) - 0.5) * 0.08;
        // Leave a slightly wider viewing window on the front-right camera quadrant (ang around 0.45..1.1)
        const inFrontViewCorridor = (ang > 0.42 && ang < 1.08);
        const rad = inFrontViewCorridor
          ? (10.2 + voxelHash(i, 4, 1) * 1.2)
          : (7.4 + voxelHash(i, 7, 3) * 3.4);

        const bx = Math.cos(ang) * rad;
        const bz = Math.sin(ang) * rad;

        // Avoid overlapping the Eientei hut, pond, or path center
        if (bx < -1.0 && bz < -2.6) continue;
        if (Math.hypot(bx - POND_CENTER_X, bz - POND_CENTER_Z) < 3.4) continue;
        if (Math.abs(bx) < 1.8 && bz > 4.0) continue;

        presetStalks.push({
          x: bx,
          z: bz,
          h: (inFrontViewCorridor ? 7.5 : 10.0) + voxelHash(i, 8, 2) * 5.2,
          r: 0.85 + voxelHash(i, 5, 6) * 0.45,
          color: bambooGreens[i % bambooGreens.length]
        });
      }

      presetStalks.forEach((st, sIdx) => {
        const stalk = {
          x: st.x,
          z: st.z,
          height: st.h,
          radius: 0.16 * st.r,
          color: new THREE.Color(st.color),
          bendX: 0,
          bendZ: 0,
          velX: 0,
          velZ: 0,
          phase: sIdx * 0.73
        };
        bambooStalks.push(stalk);

        const numSegs = Math.max(5, Math.floor(st.h / 1.35));
        const segH = st.h / numSegs;

        for (let seg = 0; seg < numSegs; seg++) {
          const taper = 1.0 - (seg / numSegs) * 0.26;
          // Main bamboo internode cylinder block
          bambooSegmentInstances.push({
            stalkIdx: sIdx,
            normY: (seg + 0.5) / numSegs,
            baseY: (seg + 0.5) * segH,
            sx: 0.24 * st.r * taper,
            sy: segH * 0.94,
            sz: 0.24 * st.r * taper,
            color: varyColor(st.color, sIdx, seg, 0, 0.03)
          });
          // Prominent bamboo node ring (`fushi`)
          bambooSegmentInstances.push({
            stalkIdx: sIdx,
            normY: (seg + 1.0) / numSegs,
            baseY: (seg + 0.96) * segH,
            sx: 0.29 * st.r * taper,
            sy: 0.09,
            sz: 0.29 * st.r * taper,
            color: varyColor('#d9ed92', sIdx, seg, 1, 0.04)
          });

          // Feathery bamboo leaf clusters on upper nodes
          if (seg >= Math.floor(numSegs * 0.42)) {
            const leafCount = (seg === numSegs - 1) ? 4 : 2;
            for (let l = 0; l < leafCount; l++) {
              const lang = (sIdx * 1.7 + seg * 2.3 + l * 1.9);
              const reach = 0.42 + (l % 2) * 0.28;
              bambooLeafInstances.push({
                stalkIdx: sIdx,
                normY: (seg + 0.95) / numSegs,
                attachY: (seg + 0.95) * segH,
                ox: Math.cos(lang) * reach,
                oy: 0.08 + (l % 2) * 0.14,
                oz: Math.sin(lang) * reach,
                sx: 0.75,
                sy: 0.11,
                sz: 0.22,
                ry: -lang,
                rz: -0.28 - (l % 2) * 0.15,
                color: varyColor(bambooLeafGreens[(sIdx + seg + l) % bambooLeafGreens.length], sIdx, seg, l, 0.04)
              });
            }
          }
        }
      });
    }

    generateBambooGrove();

    const unitBoxGeom = new THREE.BoxGeometry(1, 1, 1);
    const bambooSegMesh = new THREE.InstancedMesh(unitBoxGeom, bambooMaterial, bambooSegmentInstances.length);
    bambooSegMesh.castShadow = true;
    bambooSegMesh.receiveShadow = true;
    for (let i = 0; i < bambooSegmentInstances.length; i++) {
      bambooSegMesh.setColorAt(i, bambooSegmentInstances[i].color);
    }
    bambooSegMesh.instanceColor.needsUpdate = true;
    scene.add(bambooSegMesh);

    const bambooLeafMesh = new THREE.InstancedMesh(unitBoxGeom, plushMaterial, bambooLeafInstances.length);
    bambooLeafMesh.castShadow = true;
    bambooLeafMesh.receiveShadow = true;
    for (let i = 0; i < bambooLeafInstances.length; i++) {
      bambooLeafMesh.setColorAt(i, bambooLeafInstances[i].color);
    }
    bambooLeafMesh.instanceColor.needsUpdate = true;
    scene.add(bambooLeafMesh);

    function updateBambooGrove(time, dt, interactors) {
      // 1. Update each bamboo stalk's travelling wind wave + physical disturbance from dragged/moving plushies
      for (let i = 0; i < bambooStalks.length; i++) {
        const st = bambooStalks[i];
        // Travelling wind wave across the Bamboo Forest of the Lost
        const windWaveX = Math.sin(time * 1.45 + st.x * 0.24 + st.z * 0.18) * 0.32
                        + Math.sin(time * 2.9 + st.phase) * 0.07;
        const windWaveZ = Math.cos(time * 1.15 + st.z * 0.22 - st.x * 0.14) * 0.22;

        // Spring towards wind target
        const stiff = 26.0;
        const damp = 4.2;
        st.velX += ((windWaveX - st.bendX) * stiff - st.velX * damp) * dt;
        st.velZ += ((windWaveZ - st.bendZ) * stiff - st.velZ * damp) * dt;

        // Check if any dragged or fast-moving Fumo / Mochi disturbs this stalk!
        for (let k = 0; k < interactors.length; k++) {
          const obj = interactors[k];
          if (obj.pos.y > st.height + 0.5) continue;
          const dx = st.x - obj.pos.x;
          const dz = st.z - obj.pos.z;
          const distSq = dx * dx + dz * dz;
          const hitRad = obj.radius + 0.55;
          if (distSq < hitRad * hitRad && distSq > 0.0001) {
            const dist = Math.sqrt(distSq);
            const push = (hitRad - dist) * (obj.isDragged ? 24.0 : 12.0);
            st.velX += (dx / dist) * push * dt;
            st.velZ += (dz / dist) * push * dt;
            if (obj.isDragged || obj.vel.lengthSq() > 3.0) {
              soundFX.playBambooClack();
            }
          }
        }

        st.bendX = THREE.MathUtils.clamp(st.bendX + st.velX * dt, -1.35, 1.35);
        st.bendZ = THREE.MathUtils.clamp(st.bendZ + st.velZ * dt, -1.35, 1.35);
      }

      // 2. Update InstancedMatrices for all bamboo culm segments
      for (let i = 0; i < bambooSegmentInstances.length; i++) {
        const seg = bambooSegmentInstances[i];
        const st = bambooStalks[seg.stalkIdx];
        const curve = seg.normY * seg.normY;
        const slope = 2.0 * seg.normY / st.height;

        const wx = st.x + st.bendX * curve;
        const wz = st.z + st.bendZ * curve;
        tempPos.set(wx, seg.baseY, wz);
        tempEuler.set(st.bendZ * slope, 0, -st.bendX * slope);
        tempQuat.setFromEuler(tempEuler);
        tempScale.set(seg.sx, seg.sy, seg.sz);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        bambooSegMesh.setMatrixAt(i, tempMatrix);
      }
      bambooSegMesh.instanceMatrix.needsUpdate = true;

      // 3. Update InstancedMatrices for bamboo leaf clusters
      for (let i = 0; i < bambooLeafInstances.length; i++) {
        const lf = bambooLeafInstances[i];
        const st = bambooStalks[lf.stalkIdx];
        const curve = lf.normY * lf.normY;
        const flutter = Math.sin(time * 4.2 + i * 0.7) * 0.08;

        tempPos.set(
          st.x + st.bendX * curve + lf.ox,
          lf.attachY + lf.oy,
          st.z + st.bendZ * curve + lf.oz
        );
        tempEuler.set(flutter, lf.ry, lf.rz - st.bendX * 0.12);
        tempQuat.setFromEuler(tempEuler);
        tempScale.set(lf.sx, lf.sy, lf.sz);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        bambooLeafMesh.setMatrixAt(i, tempMatrix);
      }
      bambooLeafMesh.instanceMatrix.needsUpdate = true;
    }

    // ============================================================================
    // 7. HUGE MOON, CANOPY LIGHT SHAFTS, FIREFLIES, LEAVES, EMBERS & POND RIPPLES
    // ============================================================================
    // 7A. Huge Glowing Full Moon in the Sky behind the Bamboo Canopy
    const moonGroup = new THREE.Group();
    moonGroup.position.set(-16.0, 14.5, -24.0);
    scene.add(moonGroup);

    const moonCoreMat = new THREE.MeshBasicMaterial({
      color: 0xfef9c3,
      transparent: true,

    });
    const moonHaloMat = new THREE.MeshBasicMaterial({
      color: 0xbae6fd,
      transparent: true,
      opacity: 0.05,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    // Voxelized Full Moon Disc + Subtle Lunar Mare Rabbit Silhouette!
    for (let mx = -6; mx <= 6; mx++) {
      for (let my = -6; my <= 6; my++) {
        const r = Math.hypot(mx, my);
        if (r <= 6.2) {
          const isRabbitMare = (Math.hypot(mx - 1, my + 1) < 2.2) || (mx === 0 && my >= 1 && my <= 3);
          const mBlock = new THREE.Mesh(
            new THREE.BoxGeometry(0.72, 0.72, 0.45),
            isRabbitMare ? moonHaloMat : moonCoreMat
          );

        }
      }

    const moonOuterHalo = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), moonHaloMat);
    moonOuterHalo.position.set(0, 0, -0.5);
    moonGroup.add(moonOuterHalo);
    moonGroup.lookAt(0, 3, 0);

    // 7B. Soft Green/Golden Canopy Light Shafts & Drifting Mist (Day Mode)
    const shaftMat = new THREE.MeshBasicMaterial({
      color: 0xd9f99d,
      transparent: true,
      opacity: 0.095,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide
    });
    const lightShaftGroup = new THREE.Group();
    const shaftPositions = [
      [-3.5, 6.5, 1.5], [2.2, 6.8, -1.8], [-1.0, 6.5, 5.2], [4.5, 6.5, 2.5]
    ];
    shaftPositions.forEach(([sx, sy, sz], idx) => {
      const sMesh = new THREE.Mesh(new THREE.PlaneGeometry(2.6 + (idx % 2) * 0.8, 14.5), shaftMat);
      sMesh.position.set(sx, sy, sz);

      sMesh.rotation.y = 0.55 + idx * 0.35;

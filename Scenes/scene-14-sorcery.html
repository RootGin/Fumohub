        this.emoji = isSnackNibbler ? '🍡' : '👾';

        this.root = new THREE.Group();
        scene.add(this.root);

        const bodyVox = [];
        const eyeVox = [];
        for (let x = -4; x <= 4; x++) {
          for (let y = 0; y <= 7; y++) {
            for (let z = -4; z <= 4; z++) {
              const r = Math.hypot(x, (y - 3.2) * 0.95, z);
              const lumps = Math.sin(x * 1.3 + y) * 0.45;
              if (r <= 3.8 + lumps && r >= 2.2) {
                const isEye = (z >= 2 && ((x === -2 && y === 4) || (x === 2 && y === 5) || (x === 0 && y === 3) || (x === -1 && y === 2)));
                if (isEye) {
                  eyeVox.push({ x, y, z: z + 0.3, color: new THREE.Color((x + y) % 2 === 0 ? '#facc15' : '#ef4444') });
                } else {
                  bodyVox.push({ x, y, z, color: varyColor('#2e1065', x, y, z, 0.05) });
                }
              }
            }
          }
        }
        const mBody = buildVoxelInstancedMesh(bodyVox, this.unit, plushMaterial, true, true);
        const mEyes = buildVoxelInstancedMesh(eyeVox, this.unit, crimsonCurseMaterial, false, false);
        if (mBody) {
          mBody.userData.curse = this;
          this.root.add(mBody);
          curseRaycastMeshes.push(mBody);
        }
        if (mEyes) {
          mEyes.userData.curse = this;
          this.root.add(mEyes);
          curseRaycastMeshes.push(mEyes);
        }
      }

      exorcise() {
        if (!this.alive) return;
        this.alive = false;
        this.respawnTimer = 4.5 + Math.random() * 2.5;
        this.root.visible = false;
        soundFX.playExorcism(this.pos);
        spawnBurstParticles(this.pos.clone().add(new THREE.Vector3(0, 0.4, 0)), '#c084fc', 18);
        spawnFloatingTalisman(this.pos);
        registerComboHit(350, this.pos, 'EXORCISED!');
      }

      update(dt, time) {
        if (!this.alive) {
          this.respawnTimer -= dt;
          if (this.respawnTimer <= 0) {
            this.alive = true;
            this.pos.copy(this.homePos);
            this.root.visible = true;
            spawnBurstParticles(this.pos, '#9333ea', 8);
          }
          return;
        }

        if (this.isSnackNibbler) {
          // Tiny curse happily nibbling on the dango snack tray!
          this.root.position.set(
            this.homePos.x + Math.sin(time * 8 + this.phase) * 0.05,
            this.homePos.y + Math.abs(Math.sin(time * 7)) * 0.12,
            this.homePos.z
          );
          const s = 1.0 + Math.sin(time * 12) * 0.12;
          this.root.scale.set(s, 1 / Math.sqrt(s), s);
          return;
        }

        // Regular curses scatter and hop/chase around fumos
        const targetFumo = fumos[0]; // Chase or orbit near Reimu/Youmu
        const toTarget = targetFumo.pos.clone().sub(this.pos);
        toTarget.y = 0;
        const dist = toTarget.length();
        if (dist > 2.2) {
          toTarget.normalize();
          this.pos.x += (toTarget.x * 1.1 + Math.sin(time * 2 + this.phase) * 0.8) * dt;
          this.pos.z += (toTarget.z * 1.1 + Math.cos(time * 2 + this.phase) * 0.8) * dt;
          this.root.rotation.y = Math.atan2(toTarget.x, toTarget.z);
        }

        const hop = Math.abs(Math.sin(time * 4.5 + this.phase));
        this.pos.y = domainState.active
          ? (1.5 + Math.sin(time * 2 + this.phase) * 0.5)
          : hop * 0.35;

        this.root.position.copy(this.pos);
        const sq = 0.85 + hop * 0.25;
        this.root.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));

        // Check if any fast-moving Fumo collides with this curse spirit -> Exorcise!
        for (let i = 0; i < fumos.length; i++) {
          const f = fumos[i];
          if (f.pos.distanceTo(this.pos) < f.radius + 0.45 && (f.vel.length() > 2.5 || f.isDragged)) {
            this.exorcise();
            break;
          }
        }
      }
    }

    // Spawn 6 roaming Cursed Spirits + 1 Tiny Curse Nibbling on the Snack Tray
    const curseSpots = [
      new THREE.Vector3(-6.0, 0, -2.5),
      new THREE.Vector3(1.5, 0, 1.5),
      new THREE.Vector3(6.2, 0, -3.5),
      new THREE.Vector3(-2.5, 0, 6.2),
      new THREE.Vector3(4.5, 0, 6.8),
      new THREE.Vector3(-7.0, 0, 4.5)
    ];
    curseSpots.forEach(p => curseSpirits.push(new VoxelCurseSpirit(p, false)));
    // Tiny Curse right next to the spilled dango snack tray at (3.1, 0.15, 6.0)!
    curseSpirits.push(new VoxelCurseSpirit(new THREE.Vector3(2.85, 0.15, 5.95), true));

    // ============================================================================
    // 10. POOLED VISUAL EFFECTS: SHOCKWAVES, CRACK DECALS, LIGHTNING, AFTERIMAGES,
    //     DEBRIS PARTICLES, TALISMANS & SIGNATURE SORCERY ATTACKS
    // ============================================================================
    // 10A. Pooled Expanding Voxel Shockwave Rings
    const shockwaves = [];
    for (let i = 0; i < 6; i++) {
      const ringVox = [];
      for (let r = 0; r < 24; r++) {
        const ang = (r / 24) * Math.PI * 2;
        ringVox.push({ x: Math.cos(ang) * 4, y: 0, z: Math.sin(ang) * 4, color: new THREE.Color('#ffffff') });
      }
      const mesh = buildVoxelInstancedMesh(ringVox, 0.16, neonCursedMaterial, false, false);
      mesh.visible = false;
      scene.add(mesh);
      shockwaves.push({ mesh, active: false, age: 0, maxAge: 0.45, maxScale: 4.0 });
    }

    function spawnShockwaveRing(pos, colorHex = '#c084fc', maxScale = 4.2) {
      for (let i = 0; i < shockwaves.length; i++) {
        const sw = shockwaves[i];
        if (!sw.active) {
          sw.active = true;
          sw.age = 0;
          sw.maxAge = 0.42;
          sw.maxScale = maxScale;
          sw.mesh.position.copy(pos);
          sw.mesh.position.y = Math.max(0.12, pos.y);
          sw.mesh.scale.set(0.2, 1, 0.2);
          sw.mesh.visible = true;
          tempColor.set(colorHex);
          for (let j = 0; j < 24; j++) sw.mesh.setColorAt(j, tempColor);
          if (sw.mesh.instanceColor) sw.mesh.instanceColor.needsUpdate = true;
          break;
        }
      }
    }

    // 10B. Pooled Floor Crater Crack Decals
    const MAX_CRACK_DECALS = 10;
    const crackDecals = [];
    let crackDecalIndex = 0;
    for (let i = 0; i < MAX_CRACK_DECALS; i++) {
      const cVox = [];
      for (let b = 0; b < 6; b++) {
        const ang = (b / 6) * Math.PI * 2;
        for (let r = 1; r <= 4; r++) {
          cVox.push({
            x: Math.cos(ang + (r % 2) * 0.2) * r * 0.85,
            y: 0,
            z: Math.sin(ang + (r % 2) * 0.2) * r * 0.85,
            color: new THREE.Color(r === 1 ? '#f43f5e' : '#1e1b2e'),
            sx: 0.9, sy: 0.25, sz: 0.9
          });
        }
      }
      const mesh = buildVoxelInstancedMesh(cVox, 0.18, crimsonCurseMaterial, false, false);
      mesh.visible = false;
      scene.add(mesh);
      crackDecals.push({ mesh, age: 0, active: false });
    }

    function spawnCrackDecal(pos, scale = 1.0) {
      const cd = crackDecals[crackDecalIndex];
      crackDecalIndex = (crackDecalIndex + 1) % MAX_CRACK_DECALS;
      cd.active = true;
      cd.age = 0;
      cd.mesh.position.set(pos.x, 0.03, pos.z);
      cd.mesh.rotation.y = Math.random() * Math.PI * 2;
      cd.mesh.scale.set(scale, 1, scale);
      cd.mesh.visible = true;
    }

    // 10C. Pooled Voxel Debris & Sparkle Burst Particles + Floating Embers
    const PARTICLE_MAX = 140;
    const particles = [];
    const pGeom = new THREE.BoxGeometry(0.14, 0.14, 0.14);
    const pMesh = new THREE.InstancedMesh(pGeom, neonCursedMaterial, PARTICLE_MAX);
    for (let i = 0; i < PARTICLE_MAX; i++) {
      particles.push({ active: false, pos: new THREE.Vector3(), vel: new THREE.Vector3(), life: 0, maxLife: 1, scale: 1 });
      tempMatrix.makeScale(0, 0, 0);
      pMesh.setMatrixAt(i, tempMatrix);
    }
    scene.add(pMesh);

    function spawnBurstParticles(origin, colorHex, count = 12, speedMult = 1.0) {
      let spawned = 0;
      tempColor.set(colorHex);
      for (let i = 0; i < PARTICLE_MAX && spawned < count; i++) {
        const p = particles[i];
        if (!p.active) {
          p.active = true;
          p.life = 0;
          p.maxLife = 0.4 + Math.random() * 0.35;
          p.pos.copy(origin);
          const ang = Math.random() * Math.PI * 2;
          const spd = (2.0 + Math.random() * 4.5) * speedMult;
          p.vel.set(Math.cos(ang) * spd, (2.2 + Math.random() * 4.0) * speedMult, Math.sin(ang) * spd);
          p.scale = 0.7 + Math.random() * 1.1;
          pMesh.setColorAt(i, tempColor);
          spawned++;
        }
      }
      if (pMesh.instanceColor) pMesh.instanceColor.needsUpdate = true;
    }

    function spawnFloatingTalisman(origin) {
      spawnBurstParticles(origin.clone().add(new THREE.Vector3(0, 0.8, 0)), '#fef08a', 6, 0.65);
    }

    // 10D. Pooled Fast-Moving Fumo Afterimage Ghosts
    const AFTERIMAGE_MAX = 24;
    const afterimages = [];
    const aiGeom = new THREE.BoxGeometry(0.65, 0.85, 0.65);
    const aiMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.42, blending: THREE.AdditiveBlending });
    const aiMesh = new THREE.InstancedMesh(aiGeom, aiMat, AFTERIMAGE_MAX);
    for (let i = 0; i < AFTERIMAGE_MAX; i++) {
      afterimages.push({ active: false, pos: new THREE.Vector3(), life: 0, scale: 1 });
      tempMatrix.makeScale(0, 0, 0);
      aiMesh.setMatrixAt(i, tempMatrix);
    }
    scene.add(aiMesh);

    function spawnAfterimage(pos, colorHex, scale = 1.0) {
      for (let i = 0; i < AFTERIMAGE_MAX; i++) {
        const ai = afterimages[i];
        if (!ai.active) {
          ai.active = true;
          ai.life = 0;
          ai.pos.copy(pos).add(new THREE.Vector3(0, 0.55, 0));
          ai.scale = scale;
          aiMesh.setColorAt(i, new THREE.Color(colorHex));
          if (aiMesh.instanceColor) aiMesh.instanceColor.needsUpdate = true;
          break;
        }
      }
    }

    // 10E. Cursed-Energy Lightning Arcs & Black Flash Red-Black Lightning Bolts
    const lightningGroup = new THREE.Group();
    scene.add(lightningGroup);
    const lightningSegments = [];
    const LIGHTNING_POOL = 36;
    const boltGeom = new THREE.BoxGeometry(0.11, 0.11, 1.0);
    for (let i = 0; i < LIGHTNING_POOL; i++) {
      const mat = new THREE.MeshBasicMaterial({ color: i % 2 === 0 ? 0xa855f7 : 0x38bdf8 });
      const m = new THREE.Mesh(boltGeom, mat);
      m.visible = false;
      lightningGroup.add(m);
      lightningSegments.push({ mesh: m, timer: 0 });
    }

    function spawnLightningArc(pA, pB, colorHex = '#c084fc', duration = 0.12, thickness = 1.0) {
      const steps = 4;
      let prev = pA.clone();
      for (let s = 1; s <= steps; s++) {
        const t = s / steps;
        const next = new THREE.Vector3().lerpVectors(pA, pB, t);
        if (s < steps) {
          next.x += (Math.random() - 0.5) * 0.9;
          next.y += (Math.random() - 0.5) * 0.9;
          next.z += (Math.random() - 0.5) * 0.9;
        }
        const seg = lightningSegments.find(item => item.timer <= 0);
        if (!seg) break;
        seg.timer = duration;
        seg.mesh.visible = true;
        seg.mesh.material.color.set(colorHex);
        const mid = prev.clone().add(next).multiplyScalar(0.5);
        seg.mesh.position.copy(mid);
        seg.mesh.lookAt(next);
        seg.mesh.scale.set(thickness, thickness, prev.distanceTo(next));
        prev = next;
      }
    }

    // 10F. Signature Sorcery Visuals (Marisa Master Spark Beam & Youmu Phantom Slash Arc)
    const marisaBeamGroup = new THREE.Group();
    marisaBeamGroup.visible = false;
    const beamCore = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 14), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    const beamOuter = new THREE.Mesh(
      new THREE.BoxGeometry(1.35, 1.35, 14),
      new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending })
    );
    beamCore.position.z = 7;
    beamOuter.position.z = 7;
    marisaBeamGroup.add(beamCore, beamOuter);
    scene.add(marisaBeamGroup);
    let marisaBeamTimer = 0;

    const youmuSlashGroup = new THREE.Group();
    youmuSlashGroup.visible = false;
    const slashArcVox = [];
    for (let i = -8; i <= 8; i++) {
      const ang = (i / 8) * 1.2;
      slashArcVox.push({
        x: Math.sin(ang) * 3.2,
        y: Math.cos(ang) * 1.2,
        z: Math.cos(ang) * 3.2,
        color: new THREE.Color(Math.abs(i) < 3 ? '#ffffff' : '#2dd4bf'),
        sx: 1.6, sy: 0.35, sz: 1.6
      });
    }
    const slashArcMesh = buildVoxelInstancedMesh(slashArcVox, 0.22, neonCursedMaterial, false, false);
    if (slashArcMesh) youmuSlashGroup.add(slashArcMesh);
    scene.add(youmuSlashGroup);
    let youmuSlashTimer = 0;

    function triggerMarisaMasterSpark() {
      const marisa = fumos.find(f => f.id === 'marisa');
      const flan = fumos.find(f => f.id === 'flandre');
      if (!marisa || !flan) return;
      marisaBeamTimer = 0.75;
      marisaBeamGroup.visible = true;
      marisaBeamGroup.position.copy(marisa.pos).add(new THREE.Vector3(0, 0.85, 0));
      marisaBeamGroup.lookAt(flan.pos.clone().add(new THREE.Vector3(0, 0.85, 0)));
      soundFX.playMarisaBeam(marisa.pos);
      spawnShockwaveRing(marisa.pos, '#38bdf8', 3.2);
      flan.vel.add(new THREE.Vector3(2.5, 4.5, -2.5));
      flan.squashVel -= 5.0;
      registerComboHit(250, flan.pos, 'MASTER SPARK!');
    }

    function triggerYoumuSlashAttack() {
      const youmu = fumos.find(f => f.id === 'youmu');
      const remi = fumos.find(f => f.id === 'remilia');
      if (!youmu || !remi) return;
      youmuSlashTimer = 0.42;
      youmuSlashGroup.visible = true;
      youmuSlashGroup.position.copy(youmu.pos).add(new THREE.Vector3(0, 0.8, 0));
      youmuSlashGroup.lookAt(remi.pos.clone().add(new THREE.Vector3(0, 0.8, 0)));
      soundFX.playYoumuSlash(youmu.pos);
      spawnLightningArc(youmu.pos, remi.pos, '#2dd4bf', 0.25, 1.8);
      remi.vel.add(new THREE.Vector3(2.0, 3.8, 1.5));
      remi.squashVel -= 4.5;
      registerComboHit(200, remi.pos, 'SLASH!');
    }

    function triggerSakuyaKnifeVolley() {
      const sakuya = fumos.find(f => f.id === 'sakuya');
      const flan = fumos.find(f => f.id === 'flandre');
      if (!sakuya || !flan) return;
      soundFX.playSakuyaKnives(sakuya.pos);
      sakuya.squeeze(0.6);
      spawnLightningArc(sakuya.pos.clone().add(new THREE.Vector3(0, 0.9, 0)), flan.pos.clone().add(new THREE.Vector3(0, 0.8, 0)), '#60a5fa', 0.22, 1.5);
      spawnBurstParticles(flan.pos.clone().add(new THREE.Vector3(0, 0.8, 0)), '#60a5fa', 12);
      registerComboHit(180, flan.pos, 'CHECKMATE!');
    }

    // ============================================================================
    // 11. COMBO METER, HIT-STOP, CAMERA SHAKE, SPEED LINES & BLACK FLASH SYSTEM
    // ============================================================================
    let comboCount = 0;
    let totalScore = 0;
    let comboDecayTimer = 0;
    let hitStopFrames = 0;
    let slowMoTimer = 0;
    let cameraShakeIntensity = 0;
    let chromaticSpike = 0;
    let invertFrameTimer = 0;

    const hudScoreEl = document.getElementById('hud-score');
    const hudComboEl = document.getElementById('hud-combo');
    const popupLayer = document.getElementById('popup-layer');
    const whiteFlashEl = document.getElementById('white-flash');
    const blackFlashBanner = document.getElementById('black-flash-banner');
    const speedCanvas = document.getElementById('speed-lines-canvas');
    const speedCtx = speedCanvas.getContext('2d');
    let speedLinesAlpha = 0;

    function resizeSpeedCanvas() {
      speedCanvas.width = window.innerWidth;
      speedCanvas.height = window.innerHeight;
    }
    resizeSpeedCanvas();

    function drawSpeedLines(alpha, isBlackFlash = false) {
      speedLinesAlpha = Math.max(speedLinesAlpha, alpha);
      const w = speedCanvas.width;
      const h = speedCanvas.height;
      const cx = w * 0.5;
      const cy = h * 0.5;
      speedCtx.clearRect(0, 0, w, h);
      const lineCount = isBlackFlash ? 68 : 42;
      for (let i = 0; i < lineCount; i++) {
        const ang = (i / lineCount) * Math.PI * 2 + Math.random() * 0.08;
        const innerR = Math.min(w, h) * (0.26 + Math.random() * 0.14);
        const outerR = Math.max(w, h) * 0.75;
        speedCtx.strokeStyle = isBlackFlash
          ? (i % 2 === 0 ? '#ef4444' : '#000000')
          : 'rgba(255, 255, 255, 0.85)';
        speedCtx.lineWidth = isBlackFlash ? (2 + Math.random() * 5) : (1.5 + Math.random() * 2.5);
        speedCtx.beginPath();
        speedCtx.moveTo(cx + Math.cos(ang) * innerR, cy + Math.sin(ang) * innerR);
        speedCtx.lineTo(cx + Math.cos(ang) * outerR, cy + Math.sin(ang) * outerR);
        speedCtx.stroke();
      }
      speedCanvas.style.opacity = String(speedLinesAlpha);
    }

    function spawnVoxelTextPopup(worldPos, text, bgHex = '#f43f5e') {
      const proj = worldPos.clone().add(new THREE.Vector3(0, 1.3, 0)).project(camera);
      if (proj.z > 1) return;
      const x = (proj.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-proj.y * 0.5 + 0.5) * window.innerHeight;

      const el = document.createElement('div');
      el.className = 'voxel-popup text-xs sm:text-sm';
      el.style.left = `${x + (Math.random() - 0.5) * 36}px`;
      el.style.top = `${y + (Math.random() - 0.5) * 24}px`;
      el.style.backgroundColor = bgHex;
      el.style.color = '#ffffff';
      el.textContent = text;
      popupLayer.appendChild(el);

      requestAnimationFrame(() => {
        el.style.transform = `translate(-50%, -120%) scale(1.08) rotate(${(Math.random() - 0.5) * 14}deg)`;
      });
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translate(-50%, -180%) scale(0.75)';
      }, 520);
      setTimeout(() => el.remove(), 800);
    }

    function registerComboHit(points, worldPos, label = null) {
      comboCount++;
      comboDecayTimer = 4.8;
      const multiplier = 1 + Math.floor(comboCount / 5) * 0.5;
      totalScore += Math.round(points * multiplier);

      hudComboEl.textContent = String(comboCount);
      hudScoreEl.textContent = String(totalScore).padStart(5, '0');
      soundFX.playCombo(comboCount);
      updateJudgeScoreboardCanvas(comboCount, totalScore, label === 'BLACK FLASH!');

      if (label && worldPos) {
        const colors = ['#f43f5e', '#a855f7', '#38bdf8', '#eab308'];
        spawnVoxelTextPopup(worldPos, label, colors[comboCount % colors.length]);
      }
    }

    function triggerAnimeHitFX(contactPos, impactSpeed, accentHex) {
      const words = ['POW!', 'CRACK!', 'BOOM!', 'SMASH!'];
      const word = words[Math.floor(Math.random() * words.length)];
      registerComboHit(180, contactPos, word);

      // 1. 3 to 5 frame Hit-Stop + White Flash Frame
      hitStopFrames = Math.min(5, Math.max(3, Math.floor(impactSpeed * 0.32)));
      whiteFlashEl.style.opacity = '0.38';
      setTimeout(() => { whiteFlashEl.style.opacity = '0'; }, 55);

      // 2. Camera Shake + Chromatic Aberration Spike + Speed Lines
      cameraShakeIntensity = Math.min(0.65, impactSpeed * 0.042);
      chromaticSpike = Math.min(FX_CONFIG.maxChromaticSpike, impactSpeed * 0.0012);
      drawSpeedLines(0.55, false);

      // 3. Expanding Voxel Shockwave Ring + Debris Burst + Crack Decal
      spawnShockwaveRing(contactPos, accentHex, 3.6);
      spawnBurstParticles(contactPos, accentHex, 16, 1.25);
      if (contactPos.y < 0.35) {
        spawnCrackDecal(contactPos, 1.0);
      }
    }

    // BLACK FLASH (Triggered when clicking a fumo right at impact or high-speed collision!)
    function triggerBlackFlash(fumo) {
      const pos = fumo.pos.clone();
      registerComboHit(2500, pos, 'BLACK FLASH!');
      comboCount += 4;
      hudComboEl.textContent = String(comboCount);
      updateJudgeScoreboardCanvas(comboCount, totalScore, true);

      soundFX.playBlackFlash(pos);

      // 6-frame Hit-Stop + Inverted Color Flash Frame + Slow-Motion Beat
      hitStopFrames = 6;
      invertFrameTimer = 0.16;
      slowMoTimer = 0.55;
      cameraShakeIntensity = 1.15;
      chromaticSpike = FX_CONFIG.maxChromaticSpike;

      drawSpeedLines(0.95, true);
      blackFlashBanner.classList.add('active');
      setTimeout(() => blackFlashBanner.classList.remove('active'), 950);

      // Massive Red-Black Shockwave + Huge Crater Decal + Jagged Red-Black Lightning Bolts
      spawnShockwaveRing(pos, '#ef4444', 7.5);
      spawnShockwaveRing(pos, '#111827', 5.8);
      spawnCrackDecal(pos, 2.1);
      spawnBurstParticles(pos, '#ef4444', 28, 1.8);
      spawnBurstParticles(pos, '#111827', 20, 1.5);

      for (let b = 0; b < 6; b++) {
        const ang = (b / 6) * Math.PI * 2;
        const skyPt = pos.clone().add(new THREE.Vector3(Math.cos(ang) * 5.5, 6.5 + Math.random() * 3, Math.sin(ang) * 5.5));
        spawnLightningArc(pos, skyPt, b % 2 === 0 ? '#ef4444' : '#111111', 0.45, 2.8);
      }

      // Launch nearby fumos & exorcise nearby curses in the blast radius
      fumos.forEach(other => {
        if (other !== fumo && !other.isStaticSpectator) {
          const dir = other.pos.clone().sub(pos);
          const d = Math.max(1.0, dir.length());
          if (d < 7.5) {
            dir.normalize();
            other.vel.addScaledVector(dir, 12.0 / d);
            other.vel.y += 6.5;
            other.squashVel -= 7.0;
          }
        }
      });
      curseSpirits.forEach(c => {
        if (c.alive && c.pos.distanceTo(pos) < 6.5) c.exorcise();
      });
    }

    // ============================================================================
    // 12. DOMAIN EXPANSION: "BOUNDARY OF PHANTASM & FLOATING EYES" (Press D or Click Yukari)
    // ============================================================================
    const domainState = {
      active: false,
      timer: 0,
      duration: 7.2,
      domeRadius: 0
    };

    const domainGroup = new THREE.Group();
    domainGroup.visible = false;
    scene.add(domainGroup);

    // Expanding Voxel Barrier Dome
    const domeVoxels = [];
    for (let i = 0; i < 180; i++) {
      const phi = Math.acos(1 - (2 * (i + 0.5)) / 180);
      const theta = Math.PI * (1 + Math.sqrt(5)) * i;
      if (Math.cos(phi) < -0.1) continue;
      const r = 16;
      domeVoxels.push({
        x: r * Math.sin(phi) * Math.cos(theta),
        y: r * Math.cos(phi),
        z: r * Math.sin(phi) * Math.sin(theta),
        color: new THREE.Color(i % 5 === 0 ? '#ef4444' : (i % 2 === 0 ? '#3b0764' : '#1e1b4b')),
        sx: 2.2, sy: 2.2, sz: 2.2
      });
    }
    const domainDomeMesh = buildVoxelInstancedMesh(domeVoxels, 1.0, neonCursedMaterial, false, false);
    if (domainDomeMesh) domainGroup.add(domainDomeMesh);

    // Slowly Rotating Escher-like Checkered Domain Floor + Giant Floating Gap Eyes
    const domainFloorGroup = new THREE.Group();
    domainGroup.add(domainFloorGroup);
    const dFloorVox = [];
    for (let x = -22; x <= 22; x += 2) {
      for (let z = -22; z <= 22; z += 2) {
        if (Math.hypot(x, z) <= 22) {
          const isRed = ((Math.floor(x / 2) + Math.floor(z / 2)) % 2 === 0);
          dFloorVox.push({
            x, y: 0.08, z,
            color: new THREE.Color(isRed ? '#4c0519' : '#1e1b4b'),
            sx: 1.9, sy: 0.25, sz: 1.9
          });
        }
      }
    }
    // Giant Floating Eyes in the Domain Void
    for (let e = 0; e < 12; e++) {
      const ang = (e / 12) * Math.PI * 2;
      const rx = Math.cos(ang) * 13.5;
      const rz = Math.sin(ang) * 13.5;
      const ry = 3.5 + (e % 3) * 2.2;
      dFloorVox.push({ x: rx, y: ry, z: rz, color: new THREE.Color('#fef08a'), sx: 2.4, sy: 1.2, sz: 2.4 });
      dFloorVox.push({ x: rx * 0.96, y: ry, z: rz * 0.96, color: new THREE.Color('#dc2626'), sx: 1.0, sy: 1.3, sz: 1.0 });
    }
    const domainFloorMesh = buildVoxelInstancedMesh(dFloorVox, 0.55, crimsonCurseMaterial, false, false);
    if (domainFloorMesh) domainFloorGroup.add(domainFloorMesh);

    const domainBannerEl = document.getElementById('domain-banner');

    function triggerDomainExpansion() {
      if (domainState.active) return;
      domainState.active = true;
      domainState.timer = 0;
      domainGroup.visible = true;
      domainDomeMesh.scale.set(0.05, 0.05, 0.05);
      domainBannerEl.classList.add('active');
      soundFX.playDomainStart();

      const yukari = fumos.find(f => f.id === 'yukari');
      if (yukari) {
        spawnShockwaveRing(yukari.pos, '#c084fc', 8.5);
        registerComboHit(1000, yukari.pos, 'DOMAIN EXPANSION!');
      }

      // Gently lift all non-static fumos into floating cursed space
      fumos.forEach(f => {
        if (!f.isStaticSpectator) {
          f.vel.y += 4.5 + Math.random() * 2.5;
          f.isGrounded = false;
        }
      });
    }

    function updateDomainExpansion(dt, elapsed) {
      if (!domainState.active) return;
      domainState.timer += dt;

      // Phase 1 (0..1.1s): Dolly camera toward Yukari & expand voxel dome
      if (domainState.timer < 1.1) {
        const p = domainState.timer / 1.1;
        const ease = 1 - Math.pow(1 - p, 3);
        domainDomeMesh.scale.setScalar( THREE.MathUtils.lerp(0.05, 1.0, ease) );
        controls.target.lerp(new THREE.Vector3(0, 2.2, -5.5), dt * 4.5);
      } else {
        controls.target.lerp(new THREE.Vector3(0, 3.2, -1.0), dt * 2.5);
        // Hide outer courtyard architecture while swallowed inside the Gap Void
        courtyardGroup.visible = false;
      }

      domainFloorGroup.rotation.y = elapsed * 0.35;
      domainDomeMesh.rotation.y = -elapsed * 0.15;

      // Collapse Domain at end of duration with a huge shockwave!
      if (domainState.timer >= domainState.duration) {
        domainState.active = false;
        domainGroup.visible = false;
        courtyardGroup.visible = true;
        domainBannerEl.classList.remove('active');
        soundFX.playDomainCollapse();
        cameraShakeIntensity = 0.85;
        chromaticSpike = FX_CONFIG.maxChromaticSpike * 0.8;
        drawSpeedLines(0.75, false);
        spawnShockwaveRing(new THREE.Vector3(0, 1.0, 0), '#c084fc', 11.0);
        fumos.forEach(f => {
          if (!f.isStaticSpectator) {
            f.vel.y = -4.0;
          }
        });
      }
    }

    // ============================================================================
    // 13. FUMO-TO-FUMO COLLISIONS & POINTER INTERACTION (Drag, Throw, Squeeze, Black Flash)
    // ============================================================================
    function resolveFumoToFumoCollisions() {
      for (let i = 0; i < fumos.length; i++) {
        for (let j = i + 1; j < fumos.length; j++) {
          const a = fumos[i];
          const b = fumos[j];
          const minDist = (a.radius + b.radius) * 0.78;
          const dx = b.pos.x - a.pos.x;
          const dy = (b.pos.y + b.radius * 0.6) - (a.pos.y + a.radius * 0.6);
          const dz = b.pos.z - a.pos.z;
          const distSq = dx * dx + dy * dy + dz * dz;

          if (distSq < minDist * minDist && distSq > 0.0001) {
            const dist = Math.sqrt(distSq);
            const nx = dx / dist;
            const ny = dy / dist;
            const nz = dz / dist;
            const overlap = (minDist - dist) * 0.5;

            if (!a.isDragged && !a.isStaticSpectator) {
              a.pos.x -= nx * overlap;
              a.pos.y = Math.max(0, a.pos.y - ny * overlap);
              a.pos.z -= nz * overlap;
            }
            if (!b.isDragged && !b.isStaticSpectator) {
              b.pos.x += nx * overlap;
              b.pos.y = Math.max(0, b.pos.y + ny * overlap);
              b.pos.z += nz * overlap;
            }

            const rvx = b.vel.x - a.vel.x;
            const rvy = b.vel.y - a.vel.y;
            const rvz = b.vel.z - a.vel.z;
            const vn = rvx * nx + rvy * ny + rvz * nz;
            if (vn < 0) {
              const imp = -vn * 0.72;
              if (!a.isDragged && !a.isStaticSpectator) {
                a.vel.x -= imp * nx;
                a.vel.y -= imp * ny;
                a.vel.z -= imp * nz;
                a.lastImpactTime = performance.now();
              }
              if (!b.isDragged && !b.isStaticSpectator) {
                b.vel.x += imp * nx;
                b.vel.y += imp * ny;
                b.vel.z += imp * nz;
                b.lastImpactTime = performance.now();
              }
              if (imp > 2.2) {
                const mid = a.pos.clone().add(b.pos).multiplyScalar(0.5);
                triggerAnimeHitFX(mid, imp * 1.4, a.accentColor);
              }
            }
          }
        }
      }
    }

    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    const dragPlane = new THREE.Plane();
    const dragHitPoint = new THREE.Vector3();
    const dragOffset = new THREE.Vector3();

    let hoveredFumo = null;
    let selectedFumo = null;
    let isDraggingFumo = false;
    let pointerDownScreen = new THREE.Vector2();
    let dragHistory = [];

    const tooltipEl = document.getElementById('fumo-tooltip');
    const tooltipEmojiEl = document.getElementById('tooltip-emoji');
    const tooltipTextEl = document.getElementById('tooltip-text');
    const badgeEl = document.getElementById('fumo-badge');
    const badgeDotEl = document.getElementById('fumo-badge-dot');
    const badgeNameEl = document.getElementById('fumo-badge-name');
    const badgeStatusEl = document.getElementById('fumo-badge-status');

    function updatePointerNDC(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function pickInteractiveTarget() {
      raycaster.setFromCamera(pointerNDC, camera);
      const curseHits = raycaster.intersectObjects(curseRaycastMeshes, false);
      if (curseHits.length > 0 && curseHits[0].object.userData.curse && curseHits[0].object.userData.curse.alive) {
        return { type: 'curse', target: curseHits[0].object.userData.curse };
      }
      const fumoHits = raycaster.intersectObjects(allFumoRaycastMeshes, false);
      if (fumoHits.length > 0 && fumoHits[0].object.userData.fumo) {
        return { type: 'fumo', target: fumoHits[0].object.userData.fumo };
      }
      return null;
    }

    function updateUIBadge(fumo, statusText) {
      if (!fumo) {
        badgeEl.classList.add('hidden');
        badgeEl.classList.remove('flex');
        return;
      }
      badgeEl.classList.remove('hidden');
      badgeEl.classList.add('flex');
      badgeDotEl.style.backgroundColor = fumo.accentColor;
      badgeNameEl.textContent = fumo.name;
      badgeStatusEl.textContent = statusText || fumo.role;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      soundFX.init();
      recordInteraction();
      updatePointerNDC(e);
      pointerDownScreen.set(e.clientX, e.clientY);

      const hit = pickInteractiveTarget();
      if (!hit) return;

      if (hit.type === 'curse') {
        hit.target.exorcise();
        return;
      }

      const fumo = hit.target;
      const now = performance.now();

      // BLACK FLASH CHECK: If clicking a thrown fumo right around impact or while moving fast!
      const timeSinceImpact = now - fumo.lastImpactTime;
      if (timeSinceImpact < 340 || (!fumo.isGrounded && fumo.vel.length() > 6.5)) {
        triggerBlackFlash(fumo);
        updateUIBadge(fumo, 'BLACK FLASH!! 黒閃');
        return;
      }

      selectedFumo = fumo;
      isDraggingFumo = false;
      controls.enabled = false;

      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      dragPlane.setFromNormalAndCoplanarPoint(camDir.negate(), selectedFumo.pos);

      if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
        dragOffset.subVectors(selectedFumo.pos, dragHitPoint);
      } else {
        dragOffset.set(0, 0, 0);
      }

      dragHistory = [{ pos: selectedFumo.pos.clone(), time: now }];
      updateUIBadge(selectedFumo, fumo.role);
    });

    window.addEventListener('pointermove', (e) => {
      updatePointerNDC(e);

      if (selectedFumo) {
        recordInteraction();
        const moveDist = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);

        if (!isDraggingFumo && moveDist > 6) {
          isDraggingFumo = true;
          selectedFumo.isDragged = true;
          selectedFumo.isGrounded = false;
          selectedFumo.squashVel += 3.5;
          soundFX.playPickup(selectedFumo.pos);
          updateUIBadge(selectedFumo, 'Charging Cursed Throw — Release to Launch!');
        }

        if (isDraggingFumo) {
          raycaster.setFromCamera(pointerNDC, camera);
          if (raycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
            const targetPos = dragHitPoint.clone().add(dragOffset);
            targetPos.x = THREE.MathUtils.clamp(targetPos.x, -10.2, 10.2);
            targetPos.y = THREE.MathUtils.clamp(targetPos.y, 0.25, 11.5);
            targetPos.z = THREE.MathUtils.clamp(targetPos.z, -10.2, 10.2);

            const prevPos = selectedFumo.pos.clone();
            selectedFumo.pos.lerp(targetPos, 0.55);

            const deltaMove = selectedFumo.pos.clone().sub(prevPos);
            selectedFumo.headRollVel -= deltaMove.x * 16.0;
            selectedFumo.headPitchVel += deltaMove.z * 16.0 - deltaMove.y * 10.0;
            selectedFumo.limbRollVel -= deltaMove.x * 22.0;
            selectedFumo.roll = THREE.MathUtils.lerp(selectedFumo.roll, THREE.MathUtils.clamp(-deltaMove.x * 1.4, -0.45, 0.45), 0.3);
            selectedFumo.pitch = THREE.MathUtils.lerp(selectedFumo.pitch, THREE.MathUtils.clamp(deltaMove.z * 1.4, -0.45, 0.45), 0.3);

            const now = performance.now();
            dragHistory.push({ pos: selectedFumo.pos.clone(), time: now });
            while (dragHistory.length > 6) dragHistory.shift();
          }
          tooltipEl.style.opacity = '0';
          renderer.domElement.style.cursor = 'grabbing';
          return;
        }
      }

      const hit = pickInteractiveTarget();
      if (hit) {
        hoveredFumo = hit.target;
        renderer.domElement.style.cursor = 'pointer';
        tooltipEmojiEl.textContent = hoveredFumo.emoji || '✨';
        tooltipTextEl.textContent = hoveredFumo.name;
        tooltipEl.style.opacity = '1';
        tooltipEl.style.left = `${e.clientX + 14}px`;
        tooltipEl.style.top = `${e.clientY - 18}px`;
      } else {
        hoveredFumo = null;
        renderer.domElement.style.cursor = 'default';
        tooltipEl.style.opacity = '0';
      }
    });

    window.addEventListener('pointerup', () => {
      if (!selectedFumo) return;
      controls.enabled = true;
      recordInteraction();

      if (!isDraggingFumo) {
        selectedFumo.squeeze(1.0);
        updateUIBadge(selectedFumo, 'Squeezed! ᗜˬᗜ');
      } else {
        selectedFumo.isDragged = false;
        const now = performance.now();
        while (dragHistory.length > 1 && now - dragHistory[0].time > 140) {
          dragHistory.shift();
        }
        if (dragHistory.length >= 2) {
          const first = dragHistory[0];
          const last = dragHistory[dragHistory.length - 1];
          const dtSec = Math.max(0.016, (last.time - first.time) / 1000);
          const throwVel = last.pos.clone().sub(first.pos).divideScalar(dtSec);
          if (throwVel.length() > 25) throwVel.setLength(25);
          selectedFumo.vel.copy(throwVel);

          const speed = throwVel.length();
          soundFX.playThrow(speed, selectedFumo.pos);
          selectedFumo.angVel.set(
            throwVel.z * 0.65 + (Math.random() - 0.5) * speed * 0.4,
            (Math.random() - 0.5) * speed * 0.5,
            -throwVel.x * 0.65 + (Math.random() - 0.5) * speed * 0.4
          );
        } else {
          selectedFumo.vel.set(0, 0, 0);
        }
        updateUIBadge(selectedFumo, 'Launched! Click at Impact for BLACK FLASH!');
      }

      selectedFumo = null;
      isDraggingFumo = false;
      renderer.domElement.style.cursor = hoveredFumo ? 'pointer' : 'default';
    });

    // ============================================================================
    // 14. DAY / NIGHT SMOOTH INTERPOLATION (~2 SECONDS) & HUB INTEGRATION
    // ============================================================================
    let isNightMode = true;
    let dayNightProgress = 1.0; // 0.0 = Overcast Day, 1.0 = Cursed Night
    let dayNightTarget = 1.0;

    const daySkyCol = new THREE.Color('#94a3b8');     // Overcast desaturated cold sky
    const nightSkyCol = new THREE.Color('#090716');   // Deep dark indigo cursed night
    const domainSkyCol = new THREE.Color('#1a0526');  // Abyssal crimson-purple domain void

    const daySunCol = new THREE.Color('#cbd5e1');
    const nightMoonCol = new THREE.Color('#818cf8');

    const dayHemiSky = new THREE.Color('#e2e8f0');
    const nightHemiSky = new THREE.Color('#312e81');
    const dayHemiGround = new THREE.Color('#475569');
    const nightHemiGround = new THREE.Color('#0f0a1c');

    function notifyParentMode() {
      const modeStr = isNightMode ? 'night' : 'day';
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'modeChanged', mode: modeStr }, '*');
        }
      } catch (e) {}
    }

    function setDayNightMode(night, { immediate = false } = {}) {
      isNightMode = Boolean(night);
      soundFX.isNight = isNightMode;
      dayNightTarget = isNightMode ? 1.0 : 0.0;
      if (immediate) {
        dayNightProgress = dayNightTarget;
      }
      try {
        localStorage.setItem(STORAGE_MODE_KEY, isNightMode ? 'night' : 'day');
      } catch (e) {}
      notifyParentMode();
    }

    function toggleDayNight() {
      setDayNightMode(!isNightMode, { immediate: false });
    }

    function updateDayNightTransition(dt) {
      if (Math.abs(dayNightProgress - dayNightTarget) > 0.0005) {
        const step = dt * 0.52;
        if (dayNightProgress < dayNightTarget) {
          dayNightProgress = Math.min(dayNightTarget, dayNightProgress + step);
        } else {
          dayNightProgress = Math.max(dayNightTarget, dayNightProgress - step);
        }
      }

      const t = dayNightProgress < 0.5
        ? 4 * dayNightProgress * dayNightProgress * dayNightProgress
        : 1 - Math.pow(-2 * dayNightProgress + 2, 3) / 2;

      if (domainState.active) {
        scene.background.lerp(domainSkyCol, dt * 5.0);
      } else {
        scene.background.lerpColors(daySkyCol, nightSkyCol, t);
      }
      scene.fog.color.copy(scene.background);

      mainDirLight.color.lerpColors(daySunCol, nightMoonCol, t);
      mainDirLight.intensity = THREE.MathUtils.lerp(1.45, 0.68, t);

      hemiLight.color.lerpColors(dayHemiSky, nightHemiSky, t);
      hemiLight.groundColor.lerpColors(dayHemiGround, nightHemiGround, t);
      hemiLight.intensity = THREE.MathUtils.lerp(0.75, 0.35, t);

      lanternLight.intensity = THREE.MathUtils.lerp(0.35, 1.55, t);
      vendingLight.intensity = THREE.MathUtils.lerp(0.35, 1.35, t);
      clashLight.intensity = THREE.MathUtils.lerp(0.85, 1.85, t) + Math.min(1.2, comboCount * 0.08);

      neonCursedMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.75, 1.75, t) + Math.min(0.8, comboCount * 0.05);
      crimsonCurseMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.85, 1.85, t);
      warmEmberMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.55, 1.95, t);
      translucentIceMaterial.emissiveIntensity = THREE.MathUtils.lerp(0.35, 1.15, t);

      starMat.opacity = THREE.MathUtils.lerp(0.05, 0.88, t);
      moonMat.color.lerpColors(new THREE.Color('#f8fafc'), new THREE.Color('#ff4d6d'), t);

      if (bloomPass) {
        const baseBloom = THREE.MathUtils.lerp(FX_CONFIG.bloomDayStrength, FX_CONFIG.bloomNightStrength, t);
        const domainBoost = domainState.active ? FX_CONFIG.bloomDomainBoost : 0;
        const comboBoost = Math.min(0.35, comboCount * 0.025);
        bloomPass.strength = baseBloom + domainBoost + comboBoost;
        bloomPass.threshold = THREE.MathUtils.lerp(FX_CONFIG.bloomThresholdDay, FX_CONFIG.bloomThresholdNight, t);
      }
    }

    // ============================================================================
    // 15. UI BUTTONS, KEYBOARD SHORTCUTS & HUB MESSAGE LISTENERS
    // ============================================================================
    document.getElementById('btn-domain').addEventListener('click', () => {
      soundFX.init();
      triggerDomainExpansion();
    });

    function triggerAllOutSorceryClash() {
      soundFX.init();
      triggerMarisaMasterSpark();
      setTimeout(() => triggerYoumuSlashAttack(), 160);
      setTimeout(() => triggerSakuyaKnifeVolley(), 320);
      fumos.forEach((f, idx) => {
        if (!f.isStaticSpectator) {
          setTimeout(() => f.squeeze(0.95), idx * 45);
        }
      });
    }

    document.getElementById('btn-barrage').addEventListener('click', triggerAllOutSorceryClash);

    document.getElementById('btn-reset').addEventListener('click', () => {
      soundFX.init();
      fumos.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 35));
      updateUIBadge(null, '');
    });

    const btnMute = document.getElementById('btn-mute');
    const iconSoundOn = document.getElementById('icon-sound-on');
    const iconSoundOff = document.getElementById('icon-sound-off');

    function syncMuteUI() {
      iconSoundOn.classList.toggle('hidden', soundFX.muted);
      iconSoundOff.classList.toggle('hidden', !soundFX.muted);
    }
    syncMuteUI();

    btnMute.addEventListener('click', () => {
      soundFX.init();
      soundFX.setMuted(!soundFX.muted);
      syncMuteUI();
      if (!soundFX.muted) soundFX.playPickup();
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      soundFX.init();
      const key = e.key.toLowerCase();
      if (key === 'n') {
        e.preventDefault();
        toggleDayNight();
      } else if (key === 'd') {
        e.preventDefault();
        triggerDomainExpansion();
      } else if (key === 'r') {
        e.preventDefault();
        fumos.forEach((f, idx) => setTimeout(() => f.resetToHome(), idx * 35));
      } else if (key === ' ') {
        e.preventDefault();
        triggerAllOutSorceryClash();
      } else if (key === 'm') {
        e.preventDefault();
        btnMute.click();
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
      resizeSpeedCanvas();
    });

    // ============================================================================
    // 16. MAIN RENDER, PHYSICS & CHOREOGRAPHED SORCERY BATTLE LOOP
    // ============================================================================
    let prevTime = performance.now();
    let isScenePaused = false;
    let rafId = null;
    let autoBattleTimer = 2.0;

    function animate(now) {
      if (isScenePaused) return;
      rafId = requestAnimationFrame(animate);

      const rawDt = Math.min(0.033, Math.max(0.001, (now - prevTime) / 1000));
      prevTime = now;

      // Hit-Stop Frame Freeze for punchy anime impacts!
      if (hitStopFrames > 0) {
        hitStopFrames--;
        if (composer) composer.render();
        else renderer.render(scene, camera);
        return;
      }

      // Slow-Motion Beat during Black Flash
      let dt = rawDt;
      if (slowMoTimer > 0) {
        slowMoTimer -= rawDt;
        dt = rawDt * 0.28;
      }

      const elapsed = now * 0.001;

      if (!selectedFumo && (now - lastUserInteractionTime > 4800)) {
        controls.autoRotate = true;
      }
      controls.update();

      // Camera Shake Decay
      if (cameraShakeIntensity > 0.002) {
        camera.position.x += (Math.random() - 0.5) * cameraShakeIntensity;
        camera.position.y += (Math.random() - 0.5) * cameraShakeIntensity;
        cameraShakeIntensity *= Math.pow(0.04, rawDt * 4);
      }

      // Speed Lines & Post-Processing Uniforms Decay
      if (speedLinesAlpha > 0.01) {
        speedLinesAlpha = Math.max(0, speedLinesAlpha - rawDt * 3.2);
        speedCanvas.style.opacity = String(speedLinesAlpha);
      }
      if (chromaticSpike > 0.0002) {
        chromaticSpike *= Math.pow(0.05, rawDt * 3.5);
      }
      if (invertFrameTimer > 0) {
        invertFrameTimer = Math.max(0, invertFrameTimer - rawDt);
      }
      if (animeShaderPass) {
        animeShaderPass.uniforms.uChromatic.value = FX_CONFIG.baseChromaticAberration + chromaticSpike;
        animeShaderPass.uniforms.uInvert.value = invertFrameTimer > 0 ? 1.0 : 0.0;
        animeShaderPass.uniforms.uTime.value = elapsed;
      }

      // Combo Decay Timer
      if (comboCount > 0) {
        comboDecayTimer -= rawDt;
        if (comboDecayTimer <= 0) {
          comboCount = 0;
          hudComboEl.textContent = '0';
          updateJudgeScoreboardCanvas(0, totalScore, false);
        }
      }

      updateDayNightTransition(rawDt);
      updateDomainExpansion(dt, elapsed);

      // Update Floating Rubble & Cursed Lightning Arcs between Rubble
      floatingRubbleGroups.forEach((r, idx) => {
        r.group.position.y = r.basePos.y + Math.sin(elapsed * 1.8 + r.phase) * 0.42;
        r.group.rotation.y = elapsed * 0.35 + r.phase;
        r.group.rotation.z = Math.sin(elapsed * 1.2 + r.phase) * 0.15;
        if (Math.random() < 0.03) {
          const nextR = floatingRubbleGroups[(idx + 1) % floatingRubbleGroups.length];
          spawnLightningArc(r.group.position, nextR.group.position, idx % 2 === 0 ? '#a855f7' : '#38bdf8', 0.1, 0.9);
        }
      });

      // Periodic Autonomous Sorcery Clashes (Marisa Beam, Youmu Slash, Sakuya Knives)
      autoBattleTimer -= dt;
      if (autoBattleTimer <= 0) {
        autoBattleTimer = 3.2 + Math.random() * 2.5;
        const roll = Math.random();
        if (roll < 0.34) triggerMarisaMasterSpark();
        else if (roll < 0.68) triggerYoumuSlashAttack();
        else triggerSakuyaKnifeVolley();
      }

      if (marisaBeamTimer > 0) {
        marisaBeamTimer -= dt;
        const s = Math.sin((marisaBeamTimer / 0.75) * Math.PI) * 1.4;
        beamCore.scale.set(s, s, 1);
        beamOuter.scale.set(s * 1.3, s * 1.3, 1);
        if (marisaBeamTimer <= 0) marisaBeamGroup.visible = false;
      }

      if (youmuSlashTimer > 0) {
        youmuSlashTimer -= dt;
        youmuSlashGroup.scale.setScalar(1.0 + (0.42 - youmuSlashTimer) * 2.2);
        if (youmuSlashTimer <= 0) youmuSlashGroup.visible = false;
      }

      // Distant Sky Energy Beam Sweep
      const skySweep = Math.sin(elapsed * 0.45);
      if (skySweep > 0.75) {
        skyBeamMat.opacity = (skySweep - 0.75) * 2.2;
        skyBeamMesh.rotation.z = 0.2 + Math.sin(elapsed * 1.8) * 0.35;
      } else {
        skyBeamMat.opacity = 0;
      }

      // Update Shockwave Rings
      for (let i = 0; i < shockwaves.length; i++) {
        const sw = shockwaves[i];
        if (!sw.active) continue;
        sw.age += dt;
        if (sw.age >= sw.maxAge) {
          sw.active = false;
          sw.mesh.visible = false;
          continue;
        }
        const p = sw.age / sw.maxAge;
        const s = THREE.MathUtils.lerp(0.25, sw.maxScale, 1 - Math.pow(1 - p, 2));
        sw.mesh.scale.set(s, 1.0 - p * 0.85, s);
      }

      // Update Particles
      let pDirty = false;
      for (let i = 0; i < PARTICLE_MAX; i++) {
        const p = particles[i];
        if (!p.active) continue;
        pDirty = true;
        p.life += dt;
        if (p.life >= p.maxLife) {
          p.active = false;
          tempMatrix.makeScale(0, 0, 0);
          pMesh.setMatrixAt(i, tempMatrix);
          continue;
        }
        p.vel.y -= 9.5 * dt;
        p.pos.addScaledVector(p.vel, dt);
        const s = p.scale * (1.0 - p.life / p.maxLife);
        tempEuler.set(p.life * 9, p.life * 7, 0);
        tempQuat.setFromEuler(tempEuler);
        tempScale.set(s, s, s);
        tempMatrix.compose(p.pos, tempQuat, tempScale);
        pMesh.setMatrixAt(i, tempMatrix);
      }
      if (pDirty) pMesh.instanceMatrix.needsUpdate = true;

      // Update Afterimages
      let aiDirty = false;
      for (let i = 0; i < AFTERIMAGE_MAX; i++) {
        const ai = afterimages[i];
        if (!ai.active) continue;
        aiDirty = true;
        ai.life += dt;
        if (ai.life >= 0.22) {
          ai.active = false;
          tempMatrix.makeScale(0, 0, 0);
          aiMesh.setMatrixAt(i, tempMatrix);
          continue;
        }
        const s = ai.scale * (1.0 - ai.life / 0.22);
        tempQuat.identity();
        tempScale.set(s, s, s);
        tempMatrix.compose(ai.pos, tempQuat, tempScale);
        aiMesh.setMatrixAt(i, tempMatrix);
      }
      if (aiDirty) aiMesh.instanceMatrix.needsUpdate = true;

      // Update Lightning Bolts
      for (let i = 0; i < LIGHTNING_POOL; i++) {
        const seg = lightningSegments[i];
        if (seg.timer > 0) {
          seg.timer -= dt;
          if (seg.timer <= 0) seg.mesh.visible = false;
        }
      }

      // Update Fumo Physics & Curse Spirits
      let maxFumoSpeed = 0;
      for (let i = 0; i < fumos.length; i++) {
        fumos[i].updatePhysics(dt, elapsed);
        const spd = fumos[i].vel.length();
        if (spd > maxFumoSpeed) maxFumoSpeed = spd;
      }
      resolveFumoToFumoCollisions();

      for (let i = 0; i < curseSpirits.length; i++) {
        curseSpirits[i].update(dt, elapsed);
      }

      // Update Audio Engine
      soundFX.updateFrame(rawDt, maxFumoSpeed, isDraggingFumo, dayNightProgress, comboCount, domainState.active);

      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    function pauseScene() {
      if (isScenePaused) return;
      isScenePaused = true;
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      soundFX.suspend();
    }

    function resumeScene() {
      if (!isScenePaused) return;
      isScenePaused = false;
      prevTime = performance.now();
      soundFX.resume();
      rafId = requestAnimationFrame(animate);
    }

    // Listen for Parent Hub Messages ({type:'toggleMode'}, {type:'pause'}, {type:'resume'})
    // Lifecycle management: Day/Night sync, pause/resume on tab visibility, and WebGL resource cleanup on destroy
    const _sceneLifecycle = new FumoSceneLifecycle({
      renderer,
      scene,
      composer: typeof composer !== 'undefined' ? composer : null,
      audio: typeof soundFX !== 'undefined' ? soundFX : (typeof audio !== 'undefined' ? audio : null),
      onToggleMode: typeof toggleDayNight === 'function' ? toggleDayNight : null,
      onSetMode: (mode) => {
        if (typeof setDayNightMode === 'function') {
          setDayNightMode(mode === 'night', { immediate: false });
        } else if (typeof toggleDayNight === 'function') {
          const isNight = document.body.classList.contains('night-ui');
          if (isNight !== (mode === 'night')) toggleDayNight();
        }
      },
      onPause: typeof pauseRenderLoop === 'function' ? pauseRenderLoop : (typeof pauseScene === 'function' ? pauseScene : null),
      onResume: typeof resumeRenderLoop === 'function' ? resumeRenderLoop : (typeof resumeScene === 'function' ? resumeScene : null)
    });

    window.onload = function () {
      let initialNight = true;
      try {
        const saved = localStorage.getItem(STORAGE_MODE_KEY);
        if (saved === 'day') initialNight = false;
      } catch (e) {}

      setDayNightMode(initialNight, { immediate: true });
      updateDayNightTransition(0);

      // Initial welcoming battle-ready bounce on all fumos
      fumos.forEach((f, idx) => {
        setTimeout(() => {
          f.squash = 0.76;
          f.squashVel = 2.4;
          f.headPitchVel = 4.5;
        }, 100 + idx * 60);
      });

      prevTime = performance.now();
      rafId = requestAnimationFrame(animate);
    };
  </script>
</body>

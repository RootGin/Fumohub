          const bp = this.ctx.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.setValueAtTime(1200, now + 0.24);
          bp.frequency.exponentialRampToValueAtTime(380, now + 0.95);
          const ng = this.ctx.createGain();
          ng.gain.setValueAtTime(0.001, now + 0.24);
          ng.gain.linearRampToValueAtTime(0.22, now + 0.30);
          ng.gain.exponentialRampToValueAtTime(0.001, now + 0.96);
          src.connect(bp);
          bp.connect(ng);
          ng.connect(out);
          src.start(now + 0.24);
          src.stop(now + 0.98);
          this.releaseVoice(1.0);
        } catch (e) { this.releaseVoice(0.1); }
      }

      playSakuyaKnives(worldPos = null) {
        if (!this.canSpawnVoice()) return;
        try {
          const now = this.ctx.currentTime;
          const out = this.createPanner(worldPos);
          // Metallic ticks + volley whoosh
          for (let i = 0; i < 4; i++) {
            const t = now + i * 0.045;
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(2400 + i * 320, t);
            g.gain.setValueAtTime(0.06, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.035);
            osc.connect(g);
            g.connect(out);
            osc.start(t);
            osc.stop(t + 0.04);
          }
          this.releaseVoice(0.3);
        } catch (e) { this.releaseVoice(0.1); }
      }

      playYoumuSlash(worldPos = null) {
        if (!this.canSpawnVoice()) return;
        try {
          const now = this.ctx.currentTime;
          const out = this.createPanner(worldPos);
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1480 * this.randPitch(), now);
          osc.frequency.exponentialRampToValueAtTime(520, now + 0.18);
          g.gain.setValueAtTime(0.14, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.connect(g);
          g.connect(out);
          osc.start(now);
          osc.stop(now + 0.23);
          this.releaseVoice(0.25);
        } catch (e) { this.releaseVoice(0.1); }
      }

      // 8. DOMAIN EXPANSION AUDIO (Activation Drone + Sub Drop, Muffle Filter, Ticking, Collapse Boom)
      playDomainStart() {
        this.init();
        if (!this.ctx || this.muted) return;
        try {
          const now = this.ctx.currentTime;
          // Muffle outside world sounds
          this.worldFilter.frequency.cancelScheduledValues(now);
          this.worldFilter.frequency.setValueAtTime(16000, now);
          this.worldFilter.frequency.exponentialRampToValueAtTime(620, now + 0.8);

          // Rising ominous drone + heavy sub drop
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(55, now);
          osc.frequency.exponentialRampToValueAtTime(165, now + 1.0);
          osc.frequency.exponentialRampToValueAtTime(34, now + 2.6);
          g.gain.setValueAtTime(0.001, now);
          g.gain.linearRampToValueAtTime(0.32, now + 0.9);
          g.gain.exponentialRampToValueAtTime(0.001, now + 2.8);
          osc.connect(g);
          g.connect(this.compressor); // Bypass muffle filter
          osc.start(now);
          osc.stop(now + 2.9);
        } catch (e) {}
      }

      playDomainTick() {
        if (!this.ctx || this.muted) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1320, now);
          osc.frequency.exponentialRampToValueAtTime(660, now + 0.045);
          g.gain.setValueAtTime(0.06, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.connect(g);
          g.connect(this.compressor);
          osc.start(now);
          osc.stop(now + 0.065);
        } catch (e) {}
      }

      playDomainCollapse() {
        if (!this.ctx || this.muted) return;
        try {
          const now = this.ctx.currentTime;
          // Restore world low-pass filter
          this.worldFilter.frequency.cancelScheduledValues(now);
          this.worldFilter.frequency.exponentialRampToValueAtTime(18000, now + 0.45);

          // Big shattering collapse boom
          this.playImpact(18, new THREE.Vector3(0, 2, 0));
        } catch (e) {}
      }

      // Continuous frame update for Aura Hum, Day/Night crossfade, and Procedural Music Loop
      updateFrame(dt, maxFumoSpeed, isDragging, dayNightT, comboCount, domainActive) {
        if (!this.ctx || this.ctx.state !== 'running' || this.muted) return;
        const now = this.ctx.currentTime;

        // 1. Swell Cursed Aura Hum when holding or throwing a fumo fast
        if (this.auraGain && this.auraOsc1) {
          const speedFactor = THREE.MathUtils.clamp(maxFumoSpeed / 18, 0, 1);
          const targetAura = isDragging ? 0.09 : speedFactor * 0.08;
          this.auraGain.gain.setTargetAtTime( Math.max(0.001, targetAura), now, 0.06 );
          this.auraOsc1.frequency.setTargetAtTime(65 + speedFactor * 55, now, 0.06);
        }

        // 2. Day/Night wind crossfade
        if (this.windGain) {
          const targetWind = THREE.MathUtils.lerp(0.042, 0.016, dayNightT);
          this.windGain.gain.setTargetAtTime(targetWind, now, 0.2);
        }

        // 3. Procedural Sorcery Battle Music Sequencer (16th-note step @ ~128 BPM)
        this.musicTimer += dt;
        const stepDur = 0.135;
        if (this.musicTimer >= stepDur) {
          this.musicTimer -= stepDur;
          this.stepMusic(this.musicStep++, dayNightT, comboCount, domainActive);
        }
      }

      stepMusic(step, dayNightT, comboCount, domainActive) {
        if (!this.ctx || this.muted) return;
        const now = this.ctx.currentTime;
        const s16 = step % 16;

        // During Domain Expansion, play otherworldly eye-ticking every 4 steps
        if (domainActive && s16 % 4 === 0) {
          this.playDomainTick();
        }

        // Dark Jujutsu Pulsing Bassline (D minor / Phrygian: D2, F2, G2, G#2, A2)
        const bassPattern = [73.42, 0, 73.42, 87.31, 0, 73.42, 98.0, 92.5, 73.42, 0, 73.42, 110.0, 0, 98.0, 87.31, 82.41];
        const bassFreq = bassPattern[s16];
        if (bassFreq > 0) {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          const lp = this.ctx.createBiquadFilter();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(this.isNight ? bassFreq * 0.94 : bassFreq, now);
          lp.type = 'lowpass';
          lp.frequency.setValueAtTime(220 + Math.min(450, comboCount * 28), now);
          g.gain.setValueAtTime(0.11, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(lp);
          lp.connect(g);
          g.connect(this.musicGain);
          osc.start(now);
          osc.stop(now + 0.13);
        }

        // Sparse Touhou/Shrine Bell Melody (intensifies with combo)
        if ((s16 === 0 || s16 === 6 || (comboCount >= 3 && s16 === 10) || (comboCount >= 6 && s16 === 14)) && Math.random() < 0.78) {
          const scale = [587.33, 659.25, 698.46, 880.0, 932.33, 1174.66];
          const note = scale[(step * 3) % scale.length];
          const bOsc = this.ctx.createOscillator();
          const bGain = this.ctx.createGain();
          bOsc.type = 'sine';
          bOsc.frequency.setValueAtTime(note, now);
          bGain.gain.setValueAtTime(0.045, now);
          bGain.gain.exponentialRampToValueAtTime(0.0008, now + 0.38);
          bOsc.connect(bGain);
          bGain.connect(this.musicGain);
          bOsc.start(now);
          bOsc.stop(now + 0.4);
        }

        // Crisp Hi-Hat / Taiko Rim Percussion on higher combos
        if (comboCount >= 2 && (s16 % 2 === 0)) {
          const nSrc = this.ctx.createBufferSource();
          nSrc.buffer = this.noiseBuffer;
          const hp = this.ctx.createBiquadFilter();
          hp.type = 'highpass';
          hp.frequency.value = 5500;
          const pGain = this.ctx.createGain();
          pGain.gain.setValueAtTime(s16 % 4 === 0 ? 0.05 : 0.025, now);
          pGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          nSrc.connect(hp);
          hp.connect(pGain);
          pGain.connect(this.musicGain);
          nSrc.start(now);
          nSrc.stop(now + 0.045);
        }

        // Night Cricket / Spirit Shimmer at Night
        if (dayNightT > 0.5 && s16 === 12 && Math.random() < 0.55) {
          const cOsc = this.ctx.createOscillator();
          const cGain = this.ctx.createGain();
          cOsc.type = 'sine';
          cOsc.frequency.setValueAtTime(4200 + Math.random() * 600, now);
          cGain.gain.setValueAtTime(0.015 * dayNightT, now);
          cGain.gain.exponentialRampToValueAtTime(0.0005, now + 0.16);
          cOsc.connect(cGain);
          cGain.connect(this.worldFilter);
          cOsc.start(now);
          cOsc.stop(now + 0.17);
        }
      }
    }

    const soundFX = new SorceryAudioEngine();

    // ============================================================================
    // 2. COLOR & VOXEL HELPER UTILITIES (Matching room.html Fumo Standard)
    // ============================================================================
    const tempColor = new THREE.Color();
    const tempMatrix = new THREE.Matrix4();
    const tempPos = new THREE.Vector3();
    const tempQuat = new THREE.Quaternion();
    const tempScale = new THREE.Vector3();
    const tempEuler = new THREE.Euler();

    function voxelHash(x, y, z) {
      let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
      return n - Math.floor(n);
    }

    function varyColor(hexOrString, x, y, z, variance = 0.035, seamDarken = 0) {
      tempColor.set(hexOrString);
      const h = voxelHash(x, y, z);
      const delta = (h - 0.5) * 2 * variance - seamDarken;
      tempColor.offsetHSL(0, (h - 0.5) * 0.03, delta);
      return tempColor.clone();
    }

    function createSoftVoxelGeometry(size = 1) {
      const s = size * 0.985;
      return new THREE.BoxGeometry(s, s, s);
    }

    function buildVoxelInstancedMesh(voxels, unitSize, material, castShadow = true, receiveShadow = true) {
      if (!voxels || voxels.length === 0) return null;
      const geom = createSoftVoxelGeometry(unitSize);
      const mesh = new THREE.InstancedMesh(geom, material, voxels.length);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = receiveShadow;

      for (let i = 0; i < voxels.length; i++) {
        const v = voxels[i];
        tempPos.set(v.x * unitSize, v.y * unitSize, v.z * unitSize);
        if (v.rx || v.ry || v.rz) {
          tempEuler.set(v.rx || 0, v.ry || 0, v.rz || 0);
          tempQuat.setFromEuler(tempEuler);
        } else {
          tempQuat.identity();
        }
        tempScale.set(v.sx || 1, v.sy || 1, v.sz || 1);
        tempMatrix.compose(tempPos, tempQuat, tempScale);
        mesh.setMatrixAt(i, tempMatrix);
        mesh.setColorAt(i, v.color instanceof THREE.Color ? v.color : new THREE.Color(v.color));
      }
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      return mesh;
    }

    // ============================================================================
    // 3. SCENE, CAMERA, RENDERER & ANIME POST-PROCESSING PIPELINE
    // ============================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#100e20');
    scene.fog = new THREE.FogExp2('#100e20', 0.011);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.5, 160);
    camera.position.set(18.5, 12.2, 21.0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(getOptimalPixelRatio());
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    container.appendChild(renderer.domElement);

    // Custom Post-Processing Shader: Chromatic Aberration + Vignette + Film Grain + Impact Invert
    const AnimePostShader = {
      uniforms: {
        tDiffuse: { value: null },
        uChromatic: { value: FX_CONFIG.baseChromaticAberration },
        uVignette: { value: FX_CONFIG.vignetteStrength },
        uGrain: { value: FX_CONFIG.filmGrainStrength },
        uInvert: { value: 0.0 },
        uTime: { value: 0.0 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float uChromatic;
        uniform float uVignette;
        uniform float uGrain;
        uniform float uInvert;
        uniform float uTime;
        varying vec2 vUv;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
        }

        void main() {
          vec2 dir = vUv - vec2(0.5);
          float dist = length(dir);
          vec2 offset = dir * uChromatic * (0.4 + dist * 1.4);

          float r = texture2D(tDiffuse, vUv + offset).r;
          float g = texture2D(tDiffuse, vUv).g;
          float b = texture2D(tDiffuse, vUv - offset).b;
          vec3 col = vec3(r, g, b);

          // Black Flash Impact Frame Color Inversion
          if (uInvert > 0.01) {
            vec3 inv = vec3(1.0) - col;
            inv = vec3(inv.r * 1.25, inv.g * 0.15, inv.b * 0.25);
            col = mix(col, inv, uInvert);
          }

          // Subtle Film Grain
          float grain = (hash(vUv * 400.0 + uTime * 17.0) - 0.5) * uGrain;
          col += grain;

          // Vignette
          float vig = smoothstep(0.85, 0.28, dist * uVignette * 1.65);
          col *= mix(1.0 - uVignette * 0.75, 1.0, vig);

          gl_FragColor = vec4(col, 1.0);
        }
      `
    };

    let composer = null;
    let bloomPass = null;
    let animeShaderPass = null;
    try {
      const renderPass = new THREE.RenderPass(scene, camera);
      bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        FX_CONFIG.bloomNightStrength,
        FX_CONFIG.bloomRadius,
        FX_CONFIG.bloomThresholdNight
      );
      animeShaderPass = new THREE.ShaderPass(AnimePostShader);
      composer = new THREE.EffectComposer(renderer);
      composer.addPass(renderPass);
      composer.addPass(bloomPass);
      composer.addPass(animeShaderPass);
    } catch (e) {
      composer = null;
    }

    // OrbitControls with smooth damping & idle auto-rotate
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.8, -1.0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.minPolarAngle = Math.PI * 0.06;
    controls.minDistance = 8;
    controls.maxDistance = 44;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 0.45;

    let lastUserInteractionTime = performance.now();
    const recordInteraction = () => {
      lastUserInteractionTime = performance.now();
      controls.autoRotate = false;
    };
    controls.addEventListener('start', recordInteraction);

    // ============================================================================
    // 4. LIGHTING & MATERIALS (Capped Dynamic Lights for High Performance)
    // ============================================================================
    const hemiLight = new THREE.HemisphereLight(0xcbd5e1, 0x334155, 0.55);
    hemiLight.position.set(0, 25, 0);
    scene.add(hemiLight);

    // Primary Sun / Crimson-Indigo Moon Directional Light
    const mainDirLight = new THREE.DirectionalLight(0x818cf8, 1.15);
    mainDirLight.position.set(-18, 22, -14);
    mainDirLight.castShadow = true;
    mainDirLight.shadow.mapSize.width = 2048;
    mainDirLight.shadow.mapSize.height = 2048;
    mainDirLight.shadow.camera.near = 2;
    mainDirLight.shadow.camera.far = 55;
    const dCam = 18;
    mainDirLight.shadow.camera.left = -dCam;
    mainDirLight.shadow.camera.right = dCam;
    mainDirLight.shadow.camera.top = dCam;
    mainDirLight.shadow.camera.bottom = -dCam;
    mainDirLight.shadow.bias = -0.0006;
    scene.add(mainDirLight);

    // Cursed Energy Center Clash Point Light
    const clashLight = new THREE.PointLight(0xa855f7, 1.6, 22, 1.5);
    clashLight.position.set(0, 3.5, 0);
    scene.add(clashLight);

    // Vending Machine & Stone Lanterns Warm/Teal Point Lights
    const lanternLight = new THREE.PointLight(0xff7b29, 1.2, 16, 1.6);
    lanternLight.position.set(-6.5, 3.0, 5.5);
    scene.add(lanternLight);

    const vendingLight = new THREE.PointLight(0x38bdf8, 1.1, 14, 1.6);
    vendingLight.position.set(8.5, 2.5, -5.5);
    scene.add(vendingLight);

    // Shared Materials
    const plushMaterial = new THREE.MeshStandardMaterial({ roughness: 0.91, metalness: 0.03 });
    const courtyardSolidMaterial = new THREE.MeshStandardMaterial({ roughness: 0.85, metalness: 0.06 });
    const glossyPropMaterial = new THREE.MeshStandardMaterial({ roughness: 0.28, metalness: 0.18 });

    const neonCursedMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: new THREE.Color(0xc084fc),
      emissiveIntensity: 1.4,
      roughness: 0.15
    });

    const crimsonCurseMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: new THREE.Color(0xf43f5e),
      emissiveIntensity: 1.5,
      roughness: 0.15
    });

    const translucentIceMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.86,
      roughness: 0.12,
      metalness: 0.05,
      transmission: 0.35,
      emissive: new THREE.Color(0x38bdf8),
      emissiveIntensity: 0.85
    });

    const warmEmberMaterial = new THREE.MeshStandardMaterial({
      color: 0xfff3d1,
      emissive: new THREE.Color(0xff7b29),
      emissiveIntensity: 1.45,
      roughness: 0.2
    });

    // ============================================================================
    // 5. RUINED SORCERY-SCHOOL COURTYARD ARCHITECTURE & PROPS
    // ============================================================================
    const RV = 0.25; // 1 Courtyard Voxel = 0.25 world units
    const furnitureColliders = [];

    function addCollider(minX, minY, minZ, maxX, maxY, maxZ, name = 'prop') {
      furnitureColliders.push({
        min: new THREE.Vector3(minX, minY, minZ),
        max: new THREE.Vector3(maxX, maxY, maxZ),
        name
      });
    }

    const courtyardGroup = new THREE.Group();
    scene.add(courtyardGroup);

    const solidVoxels = [];
    const glossyVoxels = [];
    const neonVoxels = [];
    const crimsonVoxels = [];
    const emberVoxels = [];
    const iceVoxels = [];
    const floatingRubbleGroups = [];

    function pushVox(list, rx, ry, rz, hex, variance = 0.035, sx = 1, sy = 1, sz = 1, rxRot = 0, ryRot = 0, rzRot = 0) {
      list.push({
        x: rx, y: ry, z: rz,
        color: varyColor(hex, rx, ry, rz, variance),
        sx, sy, sz,
        rx: rxRot, ry: ryRot, rz: rzRot
      });
    }

    function pushBox(list, x0, y0, z0, x1, y1, z1, colorFnOrHex, variance = 0.03) {
      for (let x = x0; x <= x1; x++) {
        for (let y = y0; y <= y1; y++) {
          for (let z = z0; z <= z1; z++) {
            if (x > x0 && x < x1 && y > y0 && y < y1 && z > z0 && z < z1) continue;
            const c = typeof colorFnOrHex === 'function' ? colorFnOrHex(x, y, z) : colorFnOrHex;
            if (c) pushVox(list, x + 0.5, y + 0.5, z + 0.5, c, variance);
          }
        }
      }
    }

    function buildRuinedCourtyard() {
      // ----------------------------------------------------------------------
      // 5A. SPLIT STONE PAVEMENT, GLOWING CRATERS & CHALK BARRIER CIRCLES
      // ----------------------------------------------------------------------
      for (let x = -48; x <= 47; x++) {
        for (let z = -48; z <= 47; z++) {
          const distCenter = Math.hypot(x, z);
          // Central Battle Crater & Secondary Crater
          const distCrater1 = Math.hypot(x - 2, z - 2);
          const distCrater2 = Math.hypot(x + 16, z - 12);

          // Fault-line glowing cracks radiating from center
          const angle = Math.atan2(z - 2, x - 2);
          const crackWave = Math.abs(Math.sin(angle * 3.5 + distCrater1 * 0.15));
          const isFaultCrack = (distCrater1 < 22 && crackWave < 0.08 && distCrater1 > 3);

          // Chalk / Cursed Hexagram Barrier Circle around Reimu's zone (x: -14, z: 6)
          const distBarrier = Math.hypot(x + 14, z - 6);
          const isChalkCircle = Math.abs(distBarrier - 9.5) < 0.65 || Math.abs(distBarrier - 6.5) < 0.55;

          if ( isFaultCrack || (distCrater1 < 4.5 && (x + z) % 2 === 0) ) {
            pushVox(neonVoxels, x + 0.5, -0.6, z + 0.5, (x + z) % 3 === 0 ? '#38bdf8' : '#a855f7', 0.02);
            continue;
          }

          if (distCrater2 < 3.5 && (x * z) % 2 === 0) {
            pushVox(crimsonVoxels, x + 0.5, -0.6, z + 0.5, '#f43f5e', 0.02);
            continue;
          }

          let yOff = -0.5;
          if (distCrater1 < 8.5) yOff = -0.85;
          else if (distCrater1 >= 8.5 && distCrater1 <= 10.5 && (x + z) % 3 === 0) yOff = -0.15; // Raised crater rim

          let stoneCol = ((Math.floor(x / 4) + Math.floor(z / 4)) % 2 === 0) ? '#334155' : '#293548';
          if (distCenter > 38) stoneCol = '#1e293b'; // Outer courtyard moss/earth
          if (isChalkCircle) {
            pushVox(neonVoxels, x + 0.5, yOff + 0.1, z + 0.5, '#67e8f9', 0.01, 1, 0.3, 1);
          } else {
            pushVox(solidVoxels, x + 0.5, yOff, z + 0.5, stoneCol, 0.035);
          }
        }
      }

      // Scattered Glowing Paper Ofuda Talismans on the Ground
      const talismanSpots = [
        [-8, 12], [-5, 9], [4, 14], [11, 6], [-18, -4], [7, -11], [-3, -15], [15, 13], [-12, 18]
      ];
      talismanSpots.forEach(([tx, tz], idx) => {
        pushVox(emberVoxels, tx + 0.5, 0.15, tz + 0.5, idx % 2 === 0 ? '#fef08a' : '#fca5a5', 0.01, 1.3, 0.18, 0.75, 0, idx * 0.7, 0);
      });

      // ----------------------------------------------------------------------
      // 5B. TEMPLE-STYLE SORCERY SCHOOL DOJO (Back Wall Z = -44..-32)
      //     Includes Battle-Damaged Hole in Wall (with Peeking Fumo!) & Cracked Roof
      // ----------------------------------------------------------------------
      // Stone foundation platform (rx -36..36, ry 0..3, rz -45..-31 -> top at Y = 1.0)
      pushBox(solidVoxels, -36, 0, -45, 36, 3, -31, (x, y, z) => {
        if (y === 3) return '#475569';
        return '#334155';
      });
      addCollider(-9.0, 0, -11.3, 9.0, 1.0, -7.7, 'temple_platform');

      // Wooden Dojo Walls & Shoji Panels (rx -32..32, ry 4..20, rz -44..-34)
      for (let x = -32; x <= 32; x++) {
        for (let y = 4; y <= 20; y++) {
          // Battle-damaged hole in the right shoji wall around x in [12..18], y in [6..13]
          const distHole = Math.hypot(x - 15, y - 9.5);
          if (distHole < 3.8) continue;

          const isPillar = (x % 8 === 0);
          const isBeam = (y === 4 || y === 12 || y === 20);
          let col = '#e2d9c8'; // Shoji plaster/paper
          if (isPillar || isBeam) col = '#4a2c1d'; // Dark temple timber
          else if (distHole < 4.9) col = '#6b442a'; // Splintered wood rim around wall hole!
          else if (x >= -4 && x <= 4 && y <= 15) {
            // Double wooden dojo entrance doors
            col = (Math.abs(x) === 4 || y === 15) ? '#29170e' : '#5c3722';
          }
          pushVox(solidVoxels, x + 0.5, y + 0.5, -34.5, col, 0.025);
        }
      }
      addCollider(-8.2, 1.0, -11.2, 8.2, 5.5, -8.4, 'temple_wall');

      // Sweeping Curved Dark-Tiled Temple Roof (ry 21..29, with a battle crack on the left!)
      for (let ry = 0; ry <= 8; ry++) {
        const y = 21 + ry;
        const zSpan = 7 - Math.floor(ry * 0.65);
        const xSpan = 35 - Math.floor(ry * 0.5);
        for (let x = -xSpan; x <= xSpan; x++) {
          for (let z = -39 - zSpan; z <= -39 + zSpan; z++) {
            // Battle-damaged roof crater around x = -12..-7
            if (x >= -12 && x <= -7 && z > -38 && ry >= 2 && ry <= 6) {
              if ((x + z + ry) % 4 === 0) {
                pushVox(neonVoxels, x + 0.5, y + 0.5, z + 0.5, '#c084fc', 0.02);
              }
              continue;
            }
            const isRidge = (ry === 8) || (Math.abs(x) === xSpan);
            const tileCol = isRidge ? '#cbd5e1' : ((z % 2 === 0) ? '#1e293b' : '#0f172a');
            pushVox(solidVoxels, x + 0.5, y + 0.5, z + 0.5, tileCol, 0.025);
          }
        }
      }
      // Roof collider so Fumos can sit/bounce on the temple roof! (Top around Y = 6.8)
      addCollider(-8.5, 5.2, -11.2, 8.5, 6.8, -7.8, 'temple_roof');

      // ----------------------------------------------------------------------
      // 5C. COLLAPSED GATE, CRIMSON TORII ARCHES & BELL TOWER
      // ----------------------------------------------------------------------
      // Left Standing Torii Gate (around X = -7.5 -> rx -34..-22, rz -14..-2)
      for (let y = 0; y <= 23; y++) {
        const col = y < 3 ? '#1e293b' : '#dc2626';
        pushBox(solidVoxels, -31, y, -14, -30, y, -13, col, 0.02);
        pushBox(solidVoxels, -31, y, -3, -30, y, -2, col, 0.02);
      }
      // Torii top kasagi & nuki crossbars
      pushBox(solidVoxels, -32, 23, -16, -29, 24, 0, '#b91c1c', 0.02);
      pushBox(solidVoxels, -32, 25, -17, -29, 25, 1, '#1e293b', 0.02);
      pushBox(solidVoxels, -31, 18, -15, -30, 19, -1, '#dc2626', 0.02);
      addCollider(-8.1, 0, -4.2, -7.2, 6.4, 0.2, 'torii_gate');

      // Collapsed / Cracked Second Torii Arch on the Right (rx 26..36, rz 8..20)
      for (let y = 0; y <= 11; y++) {
        pushBox(solidVoxels, 32, y, 8, 33, y, 9, y < 2 ? '#1e293b' : '#b91c1c', 0.02);
      }
      // Fallen broken top beam on the ground
      for (let i = 0; i < 12; i++) {
        pushVox(solidVoxels, 27 + i * 0.7, 1.0 + (i < 4 ? i * 0.4 : 0), 11 + i * 0.6, '#dc2626', 0.03, 1.6, 1.4, 1.6);
      }
      addCollider(6.5, 0, 2.0, 8.8, 1.4, 4.8, 'collapsed_torii');

      // Wooden Bell Tower (Bonsho) in Back-Left Corner (rx -42..-32, rz -30..-20)
      pushBox(solidVoxels, -42, 0, -30, -32, 4, -20, '#475569'); // Stone base
      for (const px of [-41, -33]) {
        for (const pz of [-29, -21]) {
          pushBox(solidVoxels, px, 5, pz, px + 1, 20, pz + 1, '#5c3722');
        }
      }
      // Heavy Bronze Temple Bell hanging in center (rx -38..-35, ry 9..15, rz -26..-24)
      pushBox(glossyVoxels, -38, 9, -26, -35, 15, -24, '#b45309');
      // Bell Tower Roof
      for (let ry = 0; ry <= 4; ry++) {
        pushBox(solidVoxels, -43 + ry, 21 + ry, -31 + ry, -31 - ry, 21 + ry, -19 - ry, '#1e293b');
      }
      addCollider(-10.5, 0, -7.6, -7.8, 5.5, -4.8, 'bell_tower');

      // ----------------------------------------------------------------------
      // 5D. SACRED GNARLED TREE WITH TALISMAN SHIMENAWA ROPE (rx -38..-26, rz 12..24)
      // ----------------------------------------------------------------------
      for (let y = 0; y <= 18; y++) {
        const r = Math.max(1.8, 4.2 - y * 0.14);
        for (let x = -36; x <= -28; x++) {
          for (let z = 14; z <= 22; z++) {
            const d = Math.hypot(x + 32, z - 18);
            if (d <= r) {
              // Sacred Shimenawa Rope + White Paper Shide around trunk at y = 6..7
              let col = '#4a3222';
              if (y === 6 || y === 7) col = '#eab308'; // Golden straw rope
              else if (y === 5 && (x + z) % 3 === 0 && d >= r - 0.9) col = '#f8fafc'; // White shide zigzags
              pushVox(solidVoxels, x + 0.5, y + 0.5, z + 0.5, col, 0.03);
            }
          }
        }
      }
      // Dark purple/indigo cursed-blossom foliage canopy
      for (let x = -40; x <= -24; x++) {
        for (let y = 16; y <= 26; y++) {
          for (let z = 10; z <= 26; z++) {
            const d = Math.hypot((x + 32) * 0.8, (y - 21) * 1.1, (z - 18) * 0.8);
            if (d < 6.2 && d > 4.2 && voxelHash(x, y, z) > 0.25) {
              const leafCol = ((x + y + z) % 5 === 0) ? '#f472b6' : '#312e81';
              pushVox(solidVoxels, x + 0.5, y + 0.5, z + 0.5, leafCol, 0.04);
            }
          }
        }
      }
      addCollider(-9.2, 0, 3.3, -6.8, 4.8, 5.7, 'sacred_tree');

      // ----------------------------------------------------------------------
      // 5E. SMALLER PROPS: STONE LANTERNS, VENDING MACHINE, TRAINING DUMMY,
      //     SNACK TRAY, JUDGE SCOREBOARD PILLAR & CIRNO'S RUBBLE MOUND
      // ----------------------------------------------------------------------
      // 1. Two Stone Lanterns (Toro) at (-26, 22) and (20, -18)
      const lanternCoords = [[-25, 22], [20, -18]];
      lanternCoords.forEach(([lx, lz]) => {
        pushBox(solidVoxels, lx - 1, 0, lz - 1, lx + 1, 1, lz + 1, '#64748b');
        pushBox(solidVoxels, lx, 2, lz, lx, 5, lz, '#94a3b8');
        pushBox(emberVoxels, lx - 0.5, 6, lz - 0.5, lx + 0.5, 7, lz + 0.5, '#ff9e00');
        pushBox(solidVoxels, lx - 1, 8, lz - 1, lx + 1, 9, lz + 1, '#475569');
        addCollider((lx - 1.5) * RV, 0, (lz - 1.5) * RV, (lx + 2.5) * RV, 2.5, (lz + 2.5) * RV, 'stone_lantern');
      });

      // 2. Glowing Beverage Vending Machine (Right Courtyard: rx 32..37, ry 0..12, rz -24..-18)
      pushBox(glossyVoxels, 32, 0, -24, 37, 12, -18, (x, y, z) => {
        if (x === 32 && y >= 4 && y <= 10 && z >= -23 && z <= -19) return null; // Lit display window
        if (x === 32 && y === 2 && z >= -22 && z <= -20) return '#0f172a'; // Drink pickup slot
        return '#e11d48'; // Classic red/white Japanese vending machine
      });
      for (let y = 4; y <= 10; y++) {
        for (let z = -23; z <= -19; z++) {
          const drinkCol = (y % 2 === 0)
            ? ((z % 2 === 0) ? '#38bdf8' : '#4ade80')
            : '#facc15';
          pushVox(neonVoxels, 32.3, y + 0.5, z + 0.5, drinkCol, 0.01);
        }
      }
      addCollider(8.0, 0, -6.1, 9.5, 3.25, -4.4, 'vending_machine');

      // 3. Cracked Straw/Wood Training Dummy (rx -18..-16, rz -18..-16, ry 0..10)
      pushBox(solidVoxels, -17, 0, -17, -17, 9, -17, '#78350f'); // Post
      pushBox(solidVoxels, -18, 4, -18, -16, 8, -16, '#d97706'); // Straw torso
      pushBox(solidVoxels, -20, 6, -17, -14, 6, -17, '#92400e'); // Crossbar arms
      pushBox(solidVoxels, -18, 9, -18, -16, 11, -16, '#fcd34d'); // Dummy head
      pushVox(emberVoxels, -16.8, 10.2, -15.4, '#fef08a', 0.01, 0.8, 1.3, 0.2); // Ofuda stuck on face!
      addCollider(-4.7, 0, -4.7, -3.8, 2.8, -3.8, 'training_dummy');

      // 4. Spilled Snack Tray (Dango Skewers & Matcha Cup) at rx 10..15, rz 22..26 (World X ~3.1, Z ~6.0)
      for (let x = 10; x <= 15; x++) {
        for (let z = 22; z <= 26; z++) {
          const isRim = (x === 10 || x === 15 || z === 22 || z === 26);
          pushVox(solidVoxels, x + 0.5, 0.35, z + 0.5, isRim ? '#7f1d1d' : '#1e1b24', 0.02, 1, 0.6, 1);
        }
      }
      // Three-color Hanami Dango skewers (Pink, White, Green)
      pushVox(solidVoxels, 11.8, 0.9, 23.5, '#f472b6', 0.01, 0.9, 0.9, 0.9);
      pushVox(solidVoxels, 12.6, 0.9, 23.8, '#ffffff', 0.01, 0.9, 0.9, 0.9);
      pushVox(solidVoxels, 13.4, 0.9, 24.1, '#4ade80', 0.01, 0.9, 0.9, 0.9);
      pushVox(glossyVoxels, 14.2, 1.1, 25.0, '#15803d', 0.01, 1.1, 1.4, 1.1); // Matcha cup

      // 5. Cirno's High Rubble Mound & Broken Pillar (World X = -4.25, Z = 1.5 -> rx -21..-13, rz 2..10, top Y = 2.5)
      for (let y = 0; y <= 9; y++) {
        const rad = 4.5 - y * 0.28;
        for (let x = -21; x <= -13; x++) {
          for (let z = 2; z <= 10; z++) {
            if (Math.hypot(x + 17, z - 6) <= rad) {
              const isIce = (y >= 7 && (x + z) % 2 === 0);
              pushVox(isIce ? iceVoxels : solidVoxels, x + 0.5, y + 0.5, z + 0.5, isIce ? '#7dd3fc' : '#475569', 0.035);
            }
          }
        }
      }
      addCollider(-5.2, 0, 0.5, -3.2, 2.5, 2.5, 'cirno_rubble_mound');

      // 6. Daiyousei's Judge Scoreboard Stone Pillar (World X = 6.0, Z = 3.5 -> rx 22..26, rz 12..16, top Y = 2.25)
      pushBox(solidVoxels, 22, 0, 12, 26, 8, 16, '#64748b');
      addCollider(5.4, 0, 2.9, 6.6, 2.25, 4.1, 'judge_pillar');

      // 7. Floating Cursed Rubble Chunks Suspended in Midair
      const floatSpecs = [
        { pos: new THREE.Vector3(-6.2, 5.2, -3.5), size: 3, glow: '#a855f7' },
        { pos: new THREE.Vector3(6.8, 5.8, -1.5), size: 3, glow: '#38bdf8' },
        { pos: new THREE.Vector3(-2.5, 6.8, -6.0), size: 2, glow: '#f43f5e' },
        { pos: new THREE.Vector3(4.5, 4.8, 5.5), size: 2, glow: '#a855f7' }
      ];
      floatSpecs.forEach((spec, idx) => {
        const g = new THREE.Group();
        g.position.copy(spec.pos);
        const vox = [];
        const gVox = [];
        for (let x = -spec.size; x <= spec.size; x++) {
          for (let y = -spec.size; y <= spec.size; y++) {
            for (let z = -spec.size; z <= spec.size; z++) {
              if (Math.hypot(x, y * 1.2, z) <= spec.size + 0.3) {
                if (y === -spec.size || (x === 0 && z === 0)) {
                  pushVox(gVox, x, y, z, spec.glow, 0.02);
                } else {
                  pushVox(vox, x, y, z, '#334155', 0.04);
                }
              }
            }
          }
        }
        const m1 = buildVoxelInstancedMesh(vox, RV, courtyardSolidMaterial, true, true);
        const m2 = buildVoxelInstancedMesh(gVox, RV, neonCursedMaterial, false, false);
        if (m1) g.add(m1);
        if (m2) g.add(m2);
        courtyardGroup.add(g);
        floatingRubbleGroups.push({ group: g, basePos: spec.pos.clone(), phase: idx * 1.7 });
      });
    }

    buildRuinedCourtyard();

    const solidCourtyardMesh = buildVoxelInstancedMesh(solidVoxels, RV, courtyardSolidMaterial, true, true);
    const glossyCourtyardMesh = buildVoxelInstancedMesh(glossyVoxels, RV, glossyPropMaterial, true, true);
    const neonCourtyardMesh = buildVoxelInstancedMesh(neonVoxels, RV, neonCursedMaterial, false, false);
    const crimsonCourtyardMesh = buildVoxelInstancedMesh(crimsonVoxels, RV, crimsonCurseMaterial, false, false);
    const emberCourtyardMesh = buildVoxelInstancedMesh(emberVoxels, RV, warmEmberMaterial, false, false);
    const iceCourtyardMesh = buildVoxelInstancedMesh(iceVoxels, RV, translucentIceMaterial, false, true);

    [solidCourtyardMesh, glossyCourtyardMesh, neonCourtyardMesh, crimsonCourtyardMesh, emberCourtyardMesh, iceCourtyardMesh].forEach(m => {
      if (m) courtyardGroup.add(m);
    });

    // ============================================================================
    // 6. DAIYOUSEI'S LIVE 3D JUDGE SCOREBOARD (Dynamic CanvasTexture Sign)
    // ============================================================================
    const judgeCanvas = document.createElement('canvas');
    judgeCanvas.width = 256;
    judgeCanvas.height = 128;
    const judgeCtx = judgeCanvas.getContext('2d');
    const judgeTex = new THREE.CanvasTexture(judgeCanvas);
    judgeTex.minFilter = THREE.LinearFilter;

    const judgeBoardGroup = new THREE.Group();
    judgeBoardGroup.position.set(6.0, 3.85, 3.5);
    judgeBoardGroup.rotation.y = -0.55;
    scene.add(judgeBoardGroup);

    const boardFrameVoxels = [];
    for (let x = -6; x <= 6; x++) {
      for (let y = -3; y <= 3; y++) {
        if (Math.abs(x) === 6 || Math.abs(y) === 3) {
          pushVox(boardFrameVoxels, x, y, 0, '#eab308', 0.02);
        }
      }
    }
    const boardFrameMesh = buildVoxelInstancedMesh(boardFrameVoxels, 0.14, glossyPropMaterial, true, true);
    if (boardFrameMesh) judgeBoardGroup.add(boardFrameMesh);

    const boardPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(1.5, 0.72),
      new THREE.MeshBasicMaterial({ map: judgeTex, side: THREE.DoubleSide })
    );
    boardPlane.position.z = 0.08;
    judgeBoardGroup.add(boardPlane);

    function updateJudgeScoreboardCanvas(combo, score, isBlackFlash = false) {
      judgeCtx.fillStyle = isBlackFlash ? '#7f1d1d' : '#131124';
      judgeCtx.fillRect(0, 0, 256, 128);
      judgeCtx.strokeStyle = isBlackFlash ? '#ef4444' : '#a855f7';
      judgeCtx.lineWidth = 6;
      judgeCtx.strokeRect(4, 4, 248, 120);

      judgeCtx.fillStyle = '#c084fc';
      judgeCtx.font = 'bold 18px sans-serif';
      judgeCtx.textAlign = 'center';
      judgeCtx.fillText(isBlackFlash ? '★ BLACK FLASH! ★' : 'DAIYOUSEI JUDGE', 128, 28);

      judgeCtx.fillStyle = '#fde047';
      judgeCtx.font = '900 44px monospace';
      judgeCtx.fillText(`${combo}x HIT`, 128, 76);

      judgeCtx.fillStyle = '#f8fafc';
      judgeCtx.font = 'bold 20px monospace';
      judgeCtx.fillText(`PTS: ${String(score).padStart(6, '0')}`, 128, 108);
      judgeTex.needsUpdate = true;
    }
    updateJudgeScoreboardCanvas(0, 0);

    // ============================================================================
    // 7. SKY DOME: CRIMSON MOON, STARFIELD, DRIFTING CLOUDS & DISTANT SKY BEAM
    // ============================================================================
    const skyGroup = new THREE.Group();
    scene.add(skyGroup);

    // Low Red-Tinged Cursed Moon
    const moonMat = new THREE.MeshBasicMaterial({ color: 0xff4d6d });
    const moonMesh = new THREE.Mesh(new THREE.BoxGeometry(4.5, 4.5, 0.8), moonMat);
    moonMesh.position.set(-22, 19, -38);
    moonMesh.lookAt(0, 4, 0);
    skyGroup.add(moonMesh);

    // Starfield (InstancedMesh)
    const STAR_COUNT = 160;
    const starGeom = new THREE.BoxGeometry(0.18, 0.18, 0.18);
    const starMat = new THREE.MeshBasicMaterial({ color: 0xe2e8f0, transparent: true, opacity: 0.85 });
    const starMesh = new THREE.InstancedMesh(starGeom, starMat, STAR_COUNT);
    for (let i = 0; i < STAR_COUNT; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI * 0.42;
      const r = 42 + Math.random() * 15;
      tempPos.set(r * Math.sin(phi) * Math.cos(theta), 8 + r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
      tempQuat.identity();
      const s = 0.5 + Math.random() * 1.2;
      tempScale.set(s, s, s);
      tempMatrix.compose(tempPos, tempQuat, tempScale);
      starMesh.setMatrixAt(i, tempMatrix);
    }
    skyGroup.add(starMesh);

    // Distant Energy Beam that sweeps the sky periodically
    const skyBeamMat = new THREE.MeshBasicMaterial({
      color: 0x38bdf8,
      transparent: true,
      opacity: 0.0,
      blending: THREE.AdditiveBlending
    });
    const skyBeamMesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 65, 1.2), skyBeamMat);
    skyBeamMesh.position.set(18, 20, -36);
    skyBeamMesh.rotation.z = 0.35;
    skyGroup.add(skyBeamMesh);

    // ============================================================================
    // 8. TOUHOU FUMO SORCERERS & CURSES (Exact room.html VoxelFumo Aesthetic!)
    // ============================================================================
    const allFumoRaycastMeshes = [];
    const fumos = [];

    class VoxelFumo {
      constructor(config) {
        this.id = config.id;
        this.name = config.name;
        this.role = config.role || 'Sorcerer Fumo';
        this.emoji = config.emoji || '🎀';
        this.accentColor = config.accentColor || '#a855f7';
        this.scaleFactor = config.scale || 1.0;
        this.FV = 0.084 * this.scaleFactor;
        this.radius = 0.86 * this.scaleFactor;
        this.pitchAudio = config.pitchAudio || 1.0;
        this.isStaticSpectator = Boolean(config.isStaticSpectator);

        this.homePos = config.homePos.clone();
        this.homeYaw = config.homeYaw || 0;

        this.pos = this.homePos.clone();
        this.vel = new THREE.Vector3();
        this.yaw = this.homeYaw;
        this.pitch = 0;
        this.roll = 0;
        this.angVel = new THREE.Vector3();
        this.isGrounded = true;
        this.isDragged = false;
        this.lastImpactTime = 0; // For Black Flash timing window!

        // Soft-Body Springs
        this.squash = 1.0;
        this.squashVel = 0.0;
        this.headPitch = 0.0;
        this.headRoll = 0.0;
        this.headPitchVel = 0.0;
        this.headRollVel = 0.0;
        this.limbPitch = 0.0;
        this.limbRoll = 0.0;
        this.limbPitchVel = 0.0;
        this.limbRollVel = 0.0;

        this.root = new THREE.Group();
        this.squashGroup = new THREE.Group();
        this.root.add(this.squashGroup);

        this.headPivot = new THREE.Group();
        this.headPivot.position.set(0, 7.2 * this.FV, 0);
        this.squashGroup.add(this.headPivot);

        this.leftArmPivot = new THREE.Group();
        this.leftArmPivot.position.set(-4.2 * this.FV, 6.2 * this.FV, 0.5 * this.FV);
        this.squashGroup.add(this.leftArmPivot);

        this.rightArmPivot = new THREE.Group();
        this.rightArmPivot.position.set(4.2 * this.FV, 6.2 * this.FV, 0.5 * this.FV);
        this.squashGroup.add(this.rightArmPivot);

        this.leftLegPivot = new THREE.Group();
        this.leftLegPivot.position.set(-2.3 * this.FV, 1.8 * this.FV, 3.2 * this.FV);
        this.squashGroup.add(this.leftLegPivot);

        this.rightLegPivot = new THREE.Group();
        this.rightLegPivot.position.set(2.3 * this.FV, 1.8 * this.FV, 3.2 * this.FV);
        this.squashGroup.add(this.rightLegPivot);

        this.wingsPivot = new THREE.Group();
        this.wingsPivot.position.set(0, 4.8 * this.FV, -3.5 * this.FV);
        this.squashGroup.add(this.wingsPivot);

        // Special Weapon / Aura Pivot (Barrier Ring, Knives, Myon Ghost, Yukari Gap, Aura)
        this.specialPivot = new THREE.Group();
        this.root.add(this.specialPivot);

        this.buildCharacterVoxels(config);
        this.syncTransform(0);
        scene.add(this.root);
      }

      buildCharacterVoxels(cfg) {
        const bodyVoxels = [];
        const headVoxels = [];
        const leftArmVoxels = [];
        const rightArmVoxels = [];
        const leftLegVoxels = [];
        const rightLegVoxels = [];
        const wingSolidVoxels = [];
        const wingGlowVoxels = [];
        const specialGlowVoxels = [];
        const specialSolidVoxels = [];

        const skinBase = '#ffe5d4';
        const blushCol = '#ff9ebb';
        const smileCol = '#4a2525';
        const jujutsuDark = cfg.outfitMain || '#191c2b'; // Dark sorcerer uniform base

        const addPlushVoxel = (arr, x, y, z, col, isSeam = false, sx = 1, sy = 1, sz = 1) => {
          const seamDarken = (isSeam && ((Math.abs(x + y + z) % 2) === 0)) ? 0.055 : 0;
          arr.push({
            x, y, z, sx, sy, sz,
            color: varyColor(col, x + this.id.length * 7, y, z, 0.04, seamDarken)
          });
        };

        // 1. STUBBY SITTING/STANDING FUMO TORSO (Sorcerer Uniform + Signature Accents)
        for (let y = 0; y <= 7; y++) {
          const rMax = (y === 0 || y === 7) ? 3.4 : 4.2 - (y * 0.12);
          for (let x = -4; x <= 4; x++) {
            for (let z = -3; z <= 3; z++) {
              const dist = Math.hypot(x, z * 1.15);
              if (dist > rMax) continue;

              const isSideSeam = (z === 0 && Math.abs(x) >= rMax - 0.9);
              let col = jujutsuDark;

              if (y === 1 && z >= 1) col = cfg.hemTrim || '#ffffff';
              if (cfg.hasWhiteApron && z >= 1 && Math.abs(x) <= 2 && y <= 5) {
                col = '#fcfcfc';
              }
              // Gold Jujutsu Sorcerer Buttons on uniform front!
              if (z >= 2 && x === 0 && (y === 3 || y === 5) && !cfg.hasWhiteApron) {
                col = '#eab308';
              }
              // High sorcerer collar or signature tie
              if (y >= 6 && z >= 2 && Math.abs(x) <= 2) {
                col = cfg.collarColor || '#1e1b2e';
                if (Math.abs(x) <= 1 && y === 6) col = cfg.tieColor || '#ef4444';
              }

              addPlushVoxel(bodyVoxels, x, y + 0.5, z, col, isSideSeam);
            }
          }
        }

        // 2. SHORT DANGLING ARMS (+ Held Sorcery Weapons!)
        for (const side of [-1, 1]) {
          const targetArr = side === -1 ? leftArmVoxels : rightArmVoxels;
          for (let y = -3; y <= 0; y++) {
            for (let x = -1; x <= 1; x++) {
              for (let z = -1; z <= 1; z++) {
                if (Math.abs(x) === 1 && Math.abs(z) === 1 && y === -3) continue;
                let col = cfg.sleeveColor || jujutsuDark;
                if (y === -3) col = skinBase;
                else if (y === -2 && cfg.cuffColor) col = cfg.cuffColor;
                addPlushVoxel(targetArr, x * 0.85 + side * 0.4, y, z * 0.85, col, x === 0);
              }
            }
          }
        }

        // Reimu's Ofuda-Wrapped Gohei in Right Hand
        if (this.id === 'reimu') {
          for (let gz = 0; gz <= 7; gz++) {
            addPlushVoxel(rightArmVoxels, 0.5, -2.8, gz * 0.9, '#78350f', false, 0.55, 0.55, 0.95);
          }
          for (let s = 1; s <= 3; s++) {
            addPlushVoxel(rightArmVoxels, 0.5 + (s % 2 === 0 ? 0.8 : -0.8), -3.2 - s * 0.6, 6.2, s === 2 ? '#ef4444' : '#ffffff', false, 0.9, 0.7, 0.3);
          }
        }

        // Marisa's Glowing Mini-Hakkero in Right Hand
        if (this.id === 'marisa') {
          addPlushVoxel(rightArmVoxels, 0.5, -2.8, 2.2, '#eab308', false, 1.8, 1.8, 0.8);
          addPlushVoxel(rightArmVoxels, 0.5, -2.8, 2.8, '#38bdf8', false, 1.1, 1.1, 0.5);
        }

        // Yukari's Purple Parasol in Left Hand
        if (this.id === 'yukari') {
          for (let py = -2; py <= 10; py++) {
            addPlushVoxel(leftArmVoxels, -1.2, py, 1.5, '#f472b6', false, 0.45, 0.95, 0.45);
          }
          for (let px = -4; px <= 4; px++) {
            for (let pz = -4; pz <= 4; pz++) {
              if (Math.hypot(px, pz) <= 4.2) {
                addPlushVoxel(leftArmVoxels, -1.2 + px * 0.85, 10.5 - Math.hypot(px, pz) * 0.25, 1.5 + pz * 0.85, '#a855f7');
              }
            }
          }
        }

        // 3. SHORT DANGLING LEGS WITH SHOES
        for (const side of [-1, 1]) {
          const targetArr = side === -1 ? leftLegVoxels : rightLegVoxels;
          for (let z = 0; z <= 4; z++) {
            for (let x = -1; x <= 1; x++) {
              for (let y = -1; y <= 1; y++) {
                if (Math.abs(x) === 1 && Math.abs(y) === 1) continue;
                let col = '#ffffff';
                if (z === 0) col = skinBase;
                if (z >= 3) col = cfg.shoeColor || '#1e1b2e';
                if (z === 4 && y === 1 && x === 0) col = cfg.accentColor;
                addPlushVoxel(targetArr, x * 0.9, y * 0.9, z * 0.9, col, y === 0);
              }
            }
          }
        }

        // 4. OVERSIZED ROUND FUMO HEAD, ICONIC 'ᗜˬᗜ' FACE, HAIR & HATS (Exact room.html Shell)
        for (let y = 0; y <= 12; y++) {
          for (let x = -7; x <= 7; x++) {
            for (let z = -6; z <= 6; z++) {
              const dy = (y - 6.0) * 1.05;
              const dx = x * 0.94;
              const dz = z * 1.02;
              const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
              if (dist > 6.4 || dist < 4.5) continue;

              let col = skinBase;
              const isHeadSeam = (z === 0 && Math.abs(x) >= 5);

              const isBackOrTop = (z <= 1) || (y >= 9) || (Math.abs(x) >= 5 && z <= 3);
              const isForeheadBangs = (z >= 4 && y >= 7 && (Math.abs(x) !== 2 || y >= 8));
              const isSideLocks = (Math.abs(x) >= 5 && z >= 2 && y >= 2);

              if (isBackOrTop || isForeheadBangs || isSideLocks) {
                col = cfg.hairColor;
              } else if (z >= 5) {
                // Sleeping Meiling has closed happy fumo eyes!
                if (this.id === 'meiling') {
                  if ((Math.abs(x) === 3 || Math.abs(x) === 2) && y === 5) col = '#1f141e';
                  else if (Math.abs(x) === 4 && y === 3) col = blushCol;
                  else if (y === 2 && Math.abs(x) <= 1) col = smileCol;
                } else {
                  if ((Math.abs(x) === 3 || Math.abs(x) === 2) && y >= 4 && y <= 6) {
                    if (y === 6) col = '#1f141e';
                    else if (y === 5 && Math.abs(x) === 2) col = '#ffffff';
                    else col = cfg.eyeColor;
                  } else if (Math.abs(x) === 4 && y === 3) {
                    col = blushCol;
                  } else if (y === 2 && Math.abs(x) <= 1) {
                    // Cirno gets an extra smug wide grin!
                    col = (x === 0) ? (this.id === 'cirno' ? '#38bdf8' : '#e07a7a') : smileCol;
                  }
                }
              }

              // Cirno's Gojo-Style White Bandage Blindfold pushed up on her forehead!
              if (this.id === 'cirno' && (y === 7 || y === 8) && z >= 2) {
                col = ((x + y) % 4 === 0) ? '#e2e8f0' : '#ffffff';
              }

              addPlushVoxel(headVoxels, x, y, z, col, isHeadSeam);
            }
          }
        }

        // Character-Specific Hair, Hats, Bows & Sorcery Accessories:
        if (this.id === 'reimu') {
          for (const side of [-1, 1]) {
            for (let y = -1; y <= 5; y++) {
              const tubeCol = (y === 5) ? '#e63946' : ((y >= 1 && y <= 4) ? '#ffffff' : cfg.hairColor);
              addPlushVoxel(headVoxels, side * 6.8, y, 2.2, tubeCol);
              addPlushVoxel(headVoxels, side * 6.8, y, 3.0, tubeCol);
            }
          }
          for (let bx = -7; bx <= 7; bx++) {
            const wingHeight = Math.min(4, Math.floor(Math.abs(bx) * 0.7) + 1);
            for (let by = -wingHeight; by <= wingHeight; by++) {
              addPlushVoxel(headVoxels, bx, 12.2 + by * 0.75, -1.5 - Math.abs(bx) * 0.15, '#d90429');
            }
          }
          // Glowing Hexagonal Barrier Ring + Orbiting Ofuda Talismans around Reimu
          for (let i = 0; i < 24; i++) {
            const ang = (i / 24) * Math.PI * 2;
            const r = 13.5;
            specialGlowVoxels.push({
              x: Math.cos(ang) * r,
              y: 5.5 + Math.sin(ang * 3) * 1.2,
              z: Math.sin(ang) * r,
              color: new THREE.Color(i % 4 === 0 ? '#ffffff' : '#ff4d6d'),
              sx: 1.5, sy: 0.7, sz: 1.5
            });
          }
        }

        if (this.id === 'cirno') {
          for (let bx = -6; bx <= 6; bx++) {
            const h = Math.min(3, Math.floor(Math.abs(bx) * 0.65) + 1);
            for (let by = -h; by <= h; by++) {
              addPlushVoxel(headVoxels, bx, 10.5 + by * 0.75, -4.8, '#1d4ed8');
            }
          }
          const wingAngles = [0.45, 0.05, -0.35];
          for (const side of [-1, 1]) {
            for (let w = 0; w < 3; w++) {
              const ang = wingAngles[w];
              for (let r = 1; r <= 7; r++) {
                wingGlowVoxels.push({
                  x: side * (1.2 + Math.cos(ang) * r * 1.05),
                  y: 1.0 + Math.sin(ang) * r * 1.05,
                  z: -0.5 - r * 0.15,
                  color: varyColor(r > 5 ? '#e0f2fe' : '#38bdf8', r, w, 0, 0.02),
                  sx: 1.1, sy: 0.85, sz: 0.6
                });
              }
            }
          }
        }

        if (this.id === 'marisa') {
          for (let y = -1; y <= 5; y++) {
            addPlushVoxel(headVoxels, -6.6, y, 2.8, y === 0 ? '#ffffff' : cfg.hairColor);
          }
          for (let hx = -10; hx <= 10; hx++) {
            for (let hz = -10; hz <= 10; hz++) {
              const r = Math.hypot(hx, hz);
              if (r <= 10.2 && r >= 4.2) {
                const brimY = 10.2 - hz * 0.22 + Math.sin(Math.atan2(hz, hx) * 4) * 0.4;
                addPlushVoxel(headVoxels, hx, brimY, hz - 1.2, '#181824');
              }
            }
          }
          for (let ch = 0; ch <= 9; ch++) {
            const coneR = Math.max(0.8, 5.2 - ch * 0.52);
            for (let hx = -6; hx <= 6; hx++) {
              for (let hz = -6; hz <= 6; hz++) {
                const r = Math.hypot(hx, hz);
                if (r <= coneR && r >= coneR - 1.3) {
                  const isRibbon = (ch === 1 || ch === 2);
                  addPlushVoxel(headVoxels, hx, 10.8 + ch * 0.9 - hz * 0.18, hz - 1.5 - ch * 0.28, isRibbon ? '#f8f9fa' : '#181824');
                }
              }
            }
          }
          for (let bx = -3; bx <= 3; bx++) {
            addPlushVoxel(headVoxels, bx, 11.8, 3.8, '#ffffff');
          }
        }

        if (this.id === 'sakuya') {
          for (const side of [-1, 1]) {
            for (let y = -2; y <= 5; y++) {
              const col = (y <= -1) ? '#22c55e' : cfg.hairColor;
              addPlushVoxel(headVoxels, side * 6.5, y, 3.2, col);
            }
          }
          for (let hx = -6; hx <= 6; hx++) {
            addPlushVoxel(headVoxels, hx, 11.8, 1.8 - Math.abs(hx) * 0.15, Math.abs(hx) === 6 ? '#22c55e' : '#ffffff');
            addPlushVoxel(headVoxels, hx, 12.5, 1.5 - Math.abs(hx) * 0.15, '#ffffff');
          }
          // Fan of 7 Frozen Throwing Knives hovering in an arc in front of Sakuya!
          for (let k = -3; k <= 3; k++) {
            const ang = k * 0.26;
            const kx = Math.sin(ang) * 11.0;
            const ky = 7.0 + Math.cos(ang) * 3.5;
            const kz = 6.5 + Math.cos(ang) * 2.0;
            // Blue handle + silver glowing blade
            specialSolidVoxels.push({ x: kx, y: ky, z: kz - 1.2, color: new THREE.Color('#2563eb'), sx: 0.7, sy: 0.7, sz: 1.4 });
            specialGlowVoxels.push({ x: kx, y: ky, z: kz + 0.8, color: new THREE.Color('#e2e8f0'), sx: 0.5, sy: 0.35, sz: 2.6 });
          }
        }

        if (this.id === 'youmu') {
          // Black ribbon headband on left side of silver bob
          for (let bx = -5; bx <= -2; bx++) {
            addPlushVoxel(headVoxels, bx, 11.5, 2.5, '#111827');
            addPlushVoxel(headVoxels, bx - 0.5, 12.4, 2.2, '#111827');
          }
          // Roukanken Sword Scabbard on her back
          for (let sy = -2; sy <= 11; sy++) {
            wingSolidVoxels.push({
              x: -3.5 + sy * 0.55,
              y: sy,
              z: -0.6,
              color: new THREE.Color(sy > 8 ? '#eab308' : '#f8fafc'),
              sx: 0.85, sy: 0.95, sz: 0.65
            });
          }
          // Orbiting White Ghost Wisp (Myon)
          for (let gx = -2; gx <= 2; gx++) {
            for (let gy = -2; gy <= 2; gy++) {
              for (let gz = -2; gz <= 2; gz++) {
                if (Math.hypot(gx, gy, gz) <= 2.1) {
                  specialGlowVoxels.push({
                    x: 11.5 + gx * 0.8,
                    y: 9.0 + gy * 0.8,
                    z: 2.0 + gz * 0.8,
                    color: new THREE.Color('#ecfeff')
                  });
                }
              }
            }
          }
        }

        if (this.id === 'yukari') {
          // Mob Cap with Red Ribbon
          for (let hx = -7; hx <= 7; hx++) {
            for (let hz = -7; hz <= 5; hz++) {
              const r = Math.hypot(hx, hz);
              if (r <= 7.0 && r >= 4.6) {
                addPlushVoxel(headVoxels, hx, 11.2, hz, '#ffffff');
                addPlushVoxel(headVoxels, hx, 12.1, hz * 0.85, '#e11d48');
                addPlushVoxel(headVoxels, hx * 0.8, 12.9, hz * 0.75, '#ffffff');
              }
            }
          }
          // Yukari's Gap Rimmed with Red Ribbons & Floating Eyes Behind Her!
          for (let gx = -12; gx <= 12; gx++) {
            const gh = Math.round(Math.cos((gx / 13) * (Math.PI / 2)) * 7);
            for (let gy = -gh; gy <= gh; gy++) {
              const isRim = (Math.abs(gy) === gh || Math.abs(gx) === 12);
              const isEye = ((Math.abs(gx) === 5 || gx === 0) && Math.abs(gy) <= 1 && gh >= 3);
              if (isRim) {
                specialGlowVoxels.push({ x: gx, y: 6 + gy, z: -5.5, color: new THREE.Color('#e11d48') });
              } else if (isEye) {
                specialGlowVoxels.push({
                  x: gx, y: 6 + gy, z: -5.2,
                  color: new THREE.Color(gy === 0 ? '#ef4444' : '#fef08a')
                });
              } else {
                specialSolidVoxels.push({ x: gx, y: 6 + gy, z: -5.8, color: new THREE.Color('#090514') });
              }
            }
          }
        }

        if (this.id === 'flandre') {
          for (let py = 2; py <= 7; py++) {
            addPlushVoxel(headVoxels, -7.2 - (7 - py) * 0.3, py, 0.5, py === 6 ? '#e63946' : cfg.hairColor);
          }
          for (let hx = -7; hx <= 7; hx++) {
            for (let hz = -7; hz <= 5; hz++) {
              const r = Math.hypot(hx, hz);
              if (r <= 6.8 && r >= 4.8) {
                addPlushVoxel(headVoxels, hx, 11.2, hz, '#3b0764');
                addPlushVoxel(headVoxels, hx, 12.1, hz * 0.85, '#ef4444');
              }
            }
          }
          const crystalColors = ['#ef4444', '#f97316', '#fde047', '#4ade80', '#38bdf8', '#6366f1', '#a855f7', '#ec4899'];
          for (const side of [-1, 1]) {
            for (let rx = 1; rx <= 9; rx++) {
              const branchY = 2.5 + (rx <= 4 ? rx * 0.45 : (4 * 0.45 - (rx - 4) * 0.35));
              wingSolidVoxels.push({
                x: side * rx, y: branchY, z: -0.5,
                color: new THREE.Color('#111827'),
                sx: 0.9, sy: 0.65, sz: 0.65
              });
              if (rx % 2 === 0 && rx <= 8) {
                const cIdx = (side === -1 ? (rx / 2 - 1) : (3 + rx / 2));
                const cHex = crystalColors[cIdx % 8];
                for (let cy = -2; cy <= 0; cy++) {
                  const width = (cy === -1) ? 1.35 : 0.75;
                  wingGlowVoxels.push({
                    x: side * (rx + 0.3),
                    y: branchY - 1.1 + cy * 0.95,
                    z: -0.5,
                    color: new THREE.Color(cHex),
                    sx: width, sy: 0.95, sz: 0.75
                  });
                }
              }
            }
          }
        }

        if (this.id === 'remilia') {
          for (let hx = -8; hx <= 8; hx++) {
            for (let hz = -7; hz <= 6; hz++) {
              const r = Math.hypot(hx, hz);
              if (r <= 7.4 && r >= 4.5) {
                addPlushVoxel(headVoxels, hx, 11.0, hz, '#4c0519');
                if (r <= 6.4) addPlushVoxel(headVoxels, hx, 12.0, hz, '#f43f5e');
              }
            }
          }
          for (const side of [-1, 1]) {
            for (let wx = 1; wx <= 6; wx++) {
              const topY = 2.0 + Math.sin((wx / 6) * Math.PI) * 2.5;
              for (let wy = -1; wy <= topY; wy++) {
                wingSolidVoxels.push({
                  x: side * wx, y: wy, z: -0.6 - wx * 0.15,

        const registerPart = (voxels, parent, mat = plushMaterial) => {
          const m = buildVoxelInstancedMesh(voxels, this.FV, mat, true, true);

        registerPart(leftLegVoxels, this.leftLegPivot);
        registerPart(rightLegVoxels, this.rightLegPivot);
        registerPart(wingSolidVoxels, this.wingsPivot);
        if (wingGlowVoxels.length > 0) {
          const wMat = (this.id === 'cirno') ? translucentIceMaterial : crimsonCurseMaterial;
          registerPart(wingGlowVoxels, this.wingsPivot, wMat);

        if (specialSolidVoxels.length > 0) {
          registerPart(specialSolidVoxels, this.specialPivot, plushMaterial);
        }
        if (specialGlowVoxels.length > 0) {
          const sMat = (this.id === 'flandre' || this.id === 'remilia') ? crimsonCurseMaterial : neonCursedMaterial;
          registerPart(specialGlowVoxels, this.specialPivot, sMat);

      squeeze(strength = 1.0) {
        this.squash = Math.max(0.48, this.squash - 0.44 * strength);
        this.squashVel = -3.8 * strength;
        this.headPitchVel += (Math.random() - 0.5) * 15 * strength;
        this.headRollVel += (Math.random() > 0.5 ? 1 : -1) * 12 * strength;
        this.limbPitch = -0.68 * strength;
        this.limbPitchVel = -6.5 * strength;
        spawnBurstParticles(this.pos.clone().add(new THREE.Vector3(0, 0.8, 0)), this.accentColor, 14);
        soundFX.playSqueeze(this.pitchAudio, this.pos);
        registerComboHit(120, this.pos, 'SQUISH!');

        // Clicking Yukari unleashes Domain Expansion!
        if (this.id === 'yukari' && !domainState.active) {
          triggerDomainExpansion();
        }
      }

      resetToHome() {
        this.pos.copy(this.homePos);
        this.vel.set(0, 0, 0);
        this.yaw = this.homeYaw;
        this.pitch = 0;
        this.roll = 0;
        this.angVel.set(0, 0, 0);
        this.isGrounded = true;
        this.isDragged = false;
        this.squeeze(0.7);
      }

      updatePhysics(dt, time) {
        // 1. Volume-Preserving Squash & Stretch Spring
        const squashStiff = 215.0;
        const squashDamp = 11.5;
        this.squashVel += ((1.0 - this.squash) * squashStiff - this.squashVel * squashDamp) * dt;
        this.squash = THREE.MathUtils.clamp(this.squash + this.squashVel * dt, 0.44, 1.58);

        // 2. Oversized Head Wobble Spring
        const headStiff = 145.0;
        const headDamp = 7.5;
        const idleBob = Math.sin(time * 2.4 + this.homePos.x) * 0.03;
        this.headPitchVel += ((idleBob - this.headPitch) * headStiff - this.headPitchVel * headDamp) * dt;
        this.headRollVel += ((0 - this.headRoll) * headStiff - this.headRollVel * headDamp) * dt;
        this.headPitch = THREE.MathUtils.clamp(this.headPitch + this.headPitchVel * dt, -0.55, 0.55);
        this.headRoll = THREE.MathUtils.clamp(this.headRoll + this.headRollVel * dt, -0.55, 0.55);

        // 3. Dangling Limb Springs
        const targetLimb = (this.isDragged || !this.isGrounded || domainState.active) ? 0.58 : 0.0;
        const limbStiff = 120.0;
        const limbDamp = 8.0;
        this.limbPitchVel += ((targetLimb - this.limbPitch) * limbStiff - this.limbPitchVel * limbDamp) * dt;
        this.limbRollVel += ((0 - this.limbRoll) * limbStiff - this.limbRollVel * limbDamp) * dt;
        this.limbPitch = THREE.MathUtils.clamp(this.limbPitch + this.limbPitchVel * dt, -0.8, 0.9);
        this.limbRoll = THREE.MathUtils.clamp(this.limbRoll + this.limbRollVel * dt, -0.6, 0.6);

        if (!this.isDragged && !this.isStaticSpectator) {
          if (domainState.active) {
            // Inside Domain Expansion: Every Fumo floats weightlessly in cursed space!
            const floatTargetY = this.homePos.y + 1.8 + Math.sin(time * 2.0 + this.homePos.x) * 0.55;
            this.vel.y += (floatTargetY - this.pos.y) * 4.5 * dt;
            this.vel.multiplyScalar(0.94);
            this.pos.addScaledVector(this.vel, dt);
            this.yaw += 0.45 * dt;
            this.roll = Math.sin(time * 1.6 + this.homePos.z) * 0.14;
            this.isGrounded = false;
          } else {
            // Standard Gravity & Courtyard Collisions
            this.vel.y -= 24.5 * dt;
            this.vel.multiplyScalar(Math.pow(0.986, dt * 60));
            this.pos.addScaledVector(this.vel, dt);

            this.yaw += this.angVel.y * dt;
            this.pitch += this.angVel.x * dt;
            this.roll += this.angVel.z * dt;
            this.angVel.multiplyScalar(Math.pow(0.92, dt * 60));

            this.isGrounded = false;

            // Spawn fast afterimage ghost trail when flying fast!
            const speed = this.vel.length();
            if (speed > 10.5 && Math.random() < 0.65) {
              spawnAfterimage(this.pos, this.accentColor, this.scaleFactor);
            }

            // Floor Collision (Y = 0)
            if (this.pos.y < 0) {
              const impact = -this.vel.y;
              this.pos.y = 0;
              if (impact > 2.2) {
                this.vel.y = impact * 0.42;
                this.onHardImpact(impact, new THREE.Vector3(this.pos.x, 0.05, this.pos.z));
              } else {
                this.vel.y = 0;
                this.isGrounded = true;
              }
              this.vel.x *= 0.80;
              this.vel.z *= 0.80;
            }

            // Courtyard Boundary Walls
            const bound = 10.8;
            if (Math.abs(this.pos.x) > bound) {
              this.pos.x = Math.sign(this.pos.x) * bound;
              const imp = Math.abs(this.vel.x);
              this.vel.x *= -0.5;
              if (imp > 3.5) this.onHardImpact(imp, this.pos.clone());
            }
            if (Math.abs(this.pos.z) > bound) {
              this.pos.z = Math.sign(this.pos.z) * bound;
              const imp = Math.abs(this.vel.z);
              this.vel.z *= -0.5;
              if (imp > 3.5) this.onHardImpact(imp, this.pos.clone());
            }

            // Furniture & Temple Structure AABB Collisions
            const r = this.radius * 0.72;
            const centerY = this.pos.y + r;

            for (let i = 0; i < furnitureColliders.length; i++) {
              const box = furnitureColliders[i];
              const cx = THREE.MathUtils.clamp(this.pos.x, box.min.x, box.max.x);
              const cy = THREE.MathUtils.clamp(centerY, box.min.y, box.max.y);
              const cz = THREE.MathUtils.clamp(this.pos.z, box.min.z, box.max.z);

              const dx = this.pos.x - cx;
              const dy = centerY - cy;
              const dz = this.pos.z - cz;
              const distSq = dx * dx + dy * dy + dz * dz;

              if (distSq < r * r) {
                const dist = Math.sqrt(distSq);
                if (centerY >= box.max.y - 0.28 && this.vel.y <= 0.6) {
                  const impact = -this.vel.y;
                  this.pos.y = box.max.y;
                  if (impact > 2.4) {
                    this.vel.y = impact * 0.38;
                    this.onHardImpact(impact, new THREE.Vector3(this.pos.x, box.max.y, this.pos.z));
                  } else {
                    this.vel.y = 0;
                    this.isGrounded = true;
                  }
                  this.vel.x *= 0.80;
                  this.vel.z *= 0.80;
                } else if (dist > 0.0001) {
                  const nx = dx / dist;
                  const ny = dy / dist;
                  const nz = dz / dist;
                  const pen = r - dist;
                  this.pos.x += nx * pen;
                  this.pos.y = Math.max(0, this.pos.y + ny * pen);
                  this.pos.z += nz * pen;

                  const vn = this.vel.x * nx + this.vel.y * ny + this.vel.z * nz;
                  if (vn < 0) {
                    const imp = -vn;
                    this.vel.x -= 1.45 * vn * nx;
                    this.vel.y -= 1.45 * vn * ny;
                    this.vel.z -= 1.45 * vn * nz;
                    if (imp > 3.0) this.onHardImpact(imp, this.pos.clone());
                  }
                }
              }
            }

            if (this.isGrounded) {
              this.pitch = THREE.MathUtils.lerp(this.pitch, 0, Math.min(1, dt * 9.5));
              this.roll = THREE.MathUtils.lerp(this.roll, 0, Math.min(1, dt * 9.5));
              this.angVel.multiplyScalar(0.75);
            }
          }
        }

        this.syncTransform(time);
      }

      onHardImpact(impactSpeed, contactPoint) {
        this.lastImpactTime = performance.now();
        this.squashVel -= Math.min(10.0, impactSpeed * 0.95);
        this.headPitchVel += (Math.random() - 0.5) * impactSpeed * 2.2;
        this.headRollVel += (Math.random() - 0.5) * impactSpeed * 2.2;
        soundFX.playImpact(impactSpeed, contactPoint);

        if (impactSpeed > 7.5) {
          triggerAnimeHitFX(contactPoint, impactSpeed, this.accentColor);
        } else {
          spawnBurstParticles(contactPoint, '#cbd5e1', 6);
        }
      }

      syncTransform(time) {
        this.root.position.copy(this.pos);
        this.root.rotation.order = 'YXZ';
        this.root.rotation.set(this.pitch, this.yaw, this.roll);

        const sy = this.squash;
        const sxz = 1.0 / Math.sqrt(Math.max(0.35, sy));
        this.squashGroup.scale.set(sxz, sy, sxz);

        this.headPivot.rotation.set(this.headPitch, 0, this.headRoll);
        this.leftArmPivot.rotation.set(this.limbPitch, 0, 0.18 + Math.abs(this.limbPitch) * 0.35 + this.limbRoll);
        this.rightArmPivot.rotation.set(this.limbPitch, 0, -0.18 - Math.abs(this.limbPitch) * 0.35 + this.limbRoll);
        this.leftLegPivot.rotation.set(this.limbPitch * 1.15, 0.08, this.limbRoll * 0.5);
        this.rightLegPivot.rotation.set(this.limbPitch * 1.15, -0.08, this.limbRoll * 0.5);

        const wingFlutter = Math.sin(time * 4.2 + this.homePos.x) * 0.07 + (1.0 - this.squash) * 0.35;
        this.wingsPivot.rotation.x = wingFlutter;

        // Animate special weapon / barrier rings
        if (this.id === 'reimu') {
          this.specialPivot.rotation.y = time * 1.4;
        } else if (this.id === 'youmu') {
          this.specialPivot.position.y = Math.sin(time * 3.2) * 0.18;
        }
      }
    }

    class VoxelCurseSpirit {
      constructor(homePos, isSnackNibbler = false) {
        this.isSnackNibbler = isSnackNibbler;
        this.scale = isSnackNibbler ? 0.58 : (0.85 + Math.random() * 0.3);
        this.unit = 0.08 * this.scale;
        this.homePos = homePos.clone();

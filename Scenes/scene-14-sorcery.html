<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Danmaku Showdown — Cursed Fumo Courtyard Battle</title>
  <link rel="stylesheet" href="../Shared/fumo-scene.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&family=Rubik+Mono+One&display=swap" rel="stylesheet">

  <!-- Three.js r128 + OrbitControls + Post-Processing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="../Shared/fumo-core.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background-color: #090812;
      color: #f8fafc;
    }
    .font-display {
      font-family: 'Fredoka', sans-serif;
    }
    .font-impact {
      font-family: 'Rubik Mono One', sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    .glass-panel {
      background: rgba(18, 16, 34, 0.76);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(168, 85, 247, 0.32);
      box-shadow: 0 10px 30px -6px rgba(0, 0, 0, 0.6), 0 0 18px rgba(139, 92, 246, 0.18);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .ui-btn {
      cursor: pointer;
    }
    .ui-btn:hover {
      transform: translateY(-2px) scale(1.03);
      border-color: rgba(236, 72, 153, 0.65);
    }
    .ui-btn:active {
      transform: translateY(1px) scale(0.97);
    }
    kbd {
      font-family: 'Fredoka', sans-serif;
      display: inline-block;
      padding: 1px 6px;
      font-size: 0.72rem;
      line-height: 1.2;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.14);
      border-bottom: 2px solid rgba(255, 255, 255, 0.28);
    }

    /* Radial Anime Speed Lines & Impact Flash Overlay */
    #fx-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      overflow: hidden;
    }
    #white-flash {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      transition: opacity 0.06s ease-out;
    }
    #speed-lines-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
    }

    /* Voxel-Style Floating Impact Text & Black Flash Banner */
    #popup-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 18;
      overflow: hidden;
    }
    .voxel-popup {
      position: absolute;
      transform: translate(-50%, -50%) scale(0.4);
      font-family: 'Rubik Mono One', monospace;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 4px 10px;
      border: 3px solid #090812;
      box-shadow: 4px 4px 0px #090812, -2px -2px 0px rgba(255,255,255,0.35);
      text-shadow: 3px 3px 0 #090812;
      white-space: nowrap;
      will-change: transform, opacity;
      transition: transform 0.16s cubic-bezier(0.18, 1.45, 0.36, 1), opacity 0.25s ease;
    }
    #black-flash-banner {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(1.25);
      transition: opacity 0.12s ease, transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      background: radial-gradient(circle, rgba(220, 38, 38, 0.28) 0%, rgba(0, 0, 0, 0.78) 75%);
    }
    #black-flash-banner.active {
      opacity: 1;
      transform: scale(1);
    }
    .bf-title {
      font-family: 'Rubik Mono One', sans-serif;
      font-size: clamp(2.4rem, 7vw, 5.5rem);
      color: #ffffff;
      text-shadow:
        -5px -5px 0 #000,
        5px -5px 0 #dc2626,
        -5px 5px 0 #dc2626,
        6px 6px 0 #000,
        0 0 40px #ef4444,
        0 0 80px #991b1b;
      letter-spacing: 0.06em;
      transform: skewX(-8deg);
    }
    .bf-sub {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1rem, 2.2vw, 1.5rem);
      color: #fca5a5;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-top: 4px;
      text-shadow: 2px 2px 0 #000;
    }

    /* Domain Expansion Title Banner */
    #domain-banner {
      position: fixed;
      top: 18%;
      left: 50%;
      transform: translate(-50%, -20px);
      pointer-events: none;
      z-index: 24;
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      text-align: center;
    }
    #domain-banner.active {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Anime Speed Lines & Flash Frame Layer -->
  <div id="fx-overlay">
    <canvas id="speed-lines-canvas"></canvas>
    <div id="white-flash"></div>
  </div>

  <!-- Floating Voxel Text Popups -->
  <div id="popup-layer"></div>

  <!-- Screen-Filling BLACK FLASH Overlay -->
  <div id="black-flash-banner">
    <div class="bf-title">BLACK FLASH</div>
    <div class="bf-sub">黒閃 • KOKUSEN CRITICAL +2500</div>
  </div>

  <!-- Domain Expansion Cinematic Title -->
  <div id="domain-banner">
    <div class="glass-panel rounded-2xl px-6 py-3 border-purple-400/60 shadow-2xl">
      <div class="text-xs tracking-[0.3em] text-purple-300 font-bold uppercase">領域展開 • Domain Expansion</div>
      <div class="font-display text-xl sm:text-2xl font-bold text-white tracking-wide mt-0.5">
        Boundary of Phantasm &amp; Floating Eyes
      </div>
    </div>
  </div>

  <!-- Top-Right HUD: Combo Scoreboard & Sorcery Actions (Top-Left kept 100% clear for Hub) -->
  <div class="fixed top-4 right-4 z-20 flex flex-col items-end gap-2.5">
    <div class="flex flex-wrap items-center justify-end gap-2">
      <!-- Live Combo & Score Meter -->
      <div id="combo-panel" class="glass-panel rounded-2xl px-4 py-2 flex items-center gap-3.5">
        <div class="text-right">
          <div class="text-[10px] uppercase tracking-widest text-purple-300 font-bold">Sorcery Score</div>
          <div id="hud-score" class="font-display text-lg font-bold text-amber-300 leading-tight">00000</div>
        </div>
        <div class="h-7 w-px bg-purple-400/30"></div>
        <div class="flex items-baseline gap-1">
          <span id="hud-combo" class="font-impact text-2xl sm:text-3xl text-rose-400 leading-none">0</span>
          <span class="font-display text-xs font-bold text-rose-200 uppercase">Hit Combo</span>
        </div>
      </div>

      <!-- Domain Expansion Button -->
      <button id="btn-domain" title="Unleash Yukari's Domain Expansion (Shortcut: D)"
        class="glass-panel ui-btn rounded-2xl px-3.5 py-2.5 flex items-center gap-2 text-xs sm:text-sm font-bold text-purple-200 border-purple-400/50">
        <span class="text-base leading-none">👁️</span>
        <span>Domain</span>
        <kbd class="hidden sm:inline-block">D</kbd>
      </button>

      <!-- All-Out Sorcery Barrage Button -->
      <button id="btn-barrage" title="Trigger All-Out Sorcery Clashes (Shortcut: Space)"
        class="glass-panel ui-btn rounded-2xl px-3.5 py-2.5 flex items-center gap-2 text-xs sm:text-sm font-bold text-cyan-200">
        <span class="text-base leading-none">⚡</span>
        <span class="hidden md:inline">Sorcery Clash</span>
      </button>

      <!-- Reset Courtyard Fumos -->
      <button id="btn-reset" title="Reset Plushies to Battle Stances (Shortcut: R)"
        class="glass-panel ui-btn rounded-2xl px-3 py-2.5 flex items-center gap-1.5 text-xs sm:text-sm font-bold">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        <span class="hidden sm:inline">Reset</span>
      </button>
    </div>

    <!-- Active / Hovered Fumo Status Pill + Black Flash Timing Prompt -->
    <div id="fumo-badge" class="glass-panel rounded-xl px-3.5 py-1.5 text-xs font-semibold hidden items-center gap-2">
      <span id="fumo-badge-dot" class="w-2.5 h-2.5 rounded-full inline-block bg-rose-500"></span>
      <span id="fumo-badge-name">Reimu Hakurei</span>
      <span id="fumo-badge-status" class="text-purple-200/80 ml-2">Grade 1 Fumo</span>
    </div>
  </div>

  <!-- Floating Cursor Tooltip -->
  <div id="fumo-tooltip" class="fixed z-30 pointer-events-none opacity-0 px-3 py-1.5 rounded-xl glass-panel text-xs font-semibold flex items-center gap-2 shadow-lg transition-opacity duration-150">
    <span id="tooltip-emoji">⛩️</span>
    <span id="tooltip-text">Reimu Fumo</span>
  </div>

  <!-- Bottom-Right Controls: Mute Speaker Toggle & Action Guide (Leaves Top-Left & Bottom-Left Hub Clear) -->
  <div class="fixed bottom-4 right-4 z-20 flex items-center gap-2.5">
    <div class="glass-panel rounded-2xl px-3.5 py-2 text-[11px] sm:text-xs font-semibold hidden md:flex items-center gap-3 text-slate-200/90 pointer-events-none">
      <span>🖱️ <b>Click:</b> Squeeze / Exorcise</span>
      <span>✋ <b>Drag &amp; Throw:</b> Smash &amp; Click at Impact for <b class="text-rose-400">BLACK FLASH!</b></span>
      <span><kbd>D</kbd> Domain Expansion</span>
    </div>

    <!-- Speaker Mute Toggle (M) -->
    <button id="btn-mute" title="Toggle Sound & Procedural Battle Music (Shortcut: M)"
      class="glass-panel ui-btn rounded-2xl p-2.5 flex items-center justify-center text-slate-100">
      <svg id="icon-sound-on" class="w-5 h-5 text-emerald-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
      <svg id="icon-sound-off" class="w-5 h-5 hidden text-rose-400 opacity-80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
    </button>
  </div>

  <script>
    // ============================================================================
    // 0. ADJUSTABLE VISUAL FX & POST-PROCESSING CONFIGURATION
    // ============================================================================
    const FX_CONFIG = {
      bloomDayStrength: 0.35,
      bloomNightStrength: 0.92,
      bloomDomainBoost: 0.38,
      bloomRadius: 0.58,
      bloomThresholdDay: 0.78,
      bloomThresholdNight: 0.52,
      baseChromaticAberration: 0.0014,
      maxChromaticSpike: 0.018,
      vignetteStrength: 0.42,
      filmGrainStrength: 0.045
    };

    const STORAGE_MODE_KEY = 'voxel_fumo_danmaku_mode';
    const STORAGE_MUTE_KEY = 'voxel_fumo_danmaku_mute';

    // ============================================================================
    // 1. WEB AUDIO API SYNTHESIZER, POOLED SFX & PROCEDURAL BATTLE MUSIC
    // ============================================================================
    class SorceryAudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.compressor = null;
        this.limiter = null;
        this.worldFilter = null; // Low-pass muffles world SFX during Domain Expansion
        this.musicGain = null;
        this.sfxGain = null;
        this.auraOsc1 = null;
        this.auraOsc2 = null;
        this.auraGain = null;
        this.windGain = null;
        this.nightShimmerGain = null;
        this.vendingGain = null;

        this.muted = false;
        try {
          this.muted = localStorage.getItem(STORAGE_MUTE_KEY) === 'true';
        } catch (e) {}

        this.activeVoices = 0;
        this.MAX_VOICES = 18;
        this.musicStep = 0;
        this.musicTimer = 0;
        this.isNight = true;
        this.comboIntensity = 0;
      }

      init() {
        if (this.ctx) {
          if (this.ctx.state === 'suspended' && !isScenePaused) {
            this.ctx.resume().catch(() => {});
          }
          return;
        }
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          this.ctx = new AudioCtx();

          // Dynamics Compressor + Limiter safety chain
          this.compressor = this.ctx.createDynamicsCompressor();
          this.compressor.threshold.value = -14;
          this.compressor.knee.value = 12;
          this.compressor.ratio.value = 6;
          this.compressor.attack.value = 0.003;
          this.compressor.release.value = 0.18;

          this.limiter = this.ctx.createDynamicsCompressor();
          this.limiter.threshold.value = -2.0;
          this.limiter.knee.value = 0.0;
          this.limiter.ratio.value = 20.0;
          this.limiter.attack.value = 0.001;
          this.limiter.release.value = 0.06;

          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.value = this.muted ? 0.0 : 0.42;

          this.worldFilter = this.ctx.createBiquadFilter();
          this.worldFilter.type = 'lowpass';
          this.worldFilter.frequency.value = 18000;
          this.worldFilter.Q.value = 0.7;

          this.sfxGain = this.ctx.createGain();
          this.sfxGain.gain.value = 0.88;

          this.musicGain = this.ctx.createGain();
          this.musicGain.gain.value = 0.24;

          this.sfxGain.connect(this.worldFilter);
          this.musicGain.connect(this.worldFilter);
          this.worldFilter.connect(this.compressor);
          this.compressor.connect(this.limiter);
          this.limiter.connect(this.masterGain);
          this.masterGain.connect(this.ctx.destination);

          // Create White/Pink Noise Buffer for impacts, wind, and beams
          const bufLen = this.ctx.sampleRate * 2.0;
          this.noiseBuffer = this.ctx.createBuffer(1, bufLen, this.ctx.sampleRate);
          const data = this.noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufLen; i++) {
            data[i] = Math.random() * 2 - 1;
          }

          this.setupContinuousBeds();
        } catch (e) {
          this.ctx = null;
        }
      }

      setupContinuousBeds() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        // 1. Cursed Energy Aura Hum (Swells when holding/throwing a fumo fast)
        this.auraOsc1 = this.ctx.createOscillator();
        this.auraOsc2 = this.ctx.createOscillator();
        this.auraGain = this.ctx.createGain();
        this.auraOsc1.type = 'sawtooth';
        this.auraOsc2.type = 'triangle';
        this.auraOsc1.frequency.value = 68;
        this.auraOsc2.frequency.value = 137.5;
        const auraFilter = this.ctx.createBiquadFilter();
        auraFilter.type = 'bandpass';
        auraFilter.frequency.value = 210;
        auraFilter.Q.value = 2.5;
        this.auraGain.gain.value = 0.001;
        this.auraOsc1.connect(auraFilter);
        this.auraOsc2.connect(auraFilter);
        auraFilter.connect(this.auraGain);
        this.auraGain.connect(this.sfxGain);
        this.auraOsc1.start(now);
        this.auraOsc2.start(now);

        // 2. Courtyard Wind Bed + Vending Machine Buzz
        const windSrc = this.ctx.createBufferSource();
        windSrc.buffer = this.noiseBuffer;
        windSrc.loop = true;
        const windFilter = this.ctx.createBiquadFilter();
        windFilter.type = 'bandpass';
        windFilter.frequency.value = 340;
        windFilter.Q.value = 1.8;
        this.windGain = this.ctx.createGain();
        this.windGain.gain.value = this.isNight ? 0.018 : 0.042;
        windSrc.connect(windFilter);
        windFilter.connect(this.windGain);
        this.windGain.connect(this.worldFilter);
        windSrc.start(now);

        // Faint 120Hz Vending Machine Hum
        const vendOsc = this.ctx.createOscillator();
        vendOsc.type = 'sine';
        vendOsc.frequency.value = 120;
        this.vendingGain = this.ctx.createGain();
        this.vendingGain.gain.value = 0.008;
        vendOsc.connect(this.vendingGain);
        this.vendingGain.connect(this.worldFilter);
        vendOsc.start(now);
      }

      setMuted(m) {
        this.muted = Boolean(m);
        try {
          localStorage.setItem(STORAGE_MUTE_KEY, String(this.muted));
        } catch (e) {}
        if (this.ctx && this.masterGain) {
          this.masterGain.gain.setTargetAtTime(this.muted ? 0.0 : 0.42, this.ctx.currentTime, 0.04);
        }
      }

      suspend() {
        if (this.ctx && this.ctx.state === 'running') {
          this.ctx.suspend().catch(() => {});
        }
      }

      resume() {
        if (this.ctx && this.ctx.state === 'suspended' && !this.muted) {
          this.ctx.resume().catch(() => {});
        }
      }

      // Helper: Create stereo panner based on world position projected to screen
      createPanner(worldPos, bypassMuffle = false) {
        if (!this.ctx) return null;
        const targetBus = bypassMuffle ? this.compressor : this.sfxGain;
        if (!this.ctx.createStereoPanner) return targetBus;
        const panner = this.ctx.createStereoPanner();
        let panVal = 0;
        if (worldPos && typeof camera !== 'undefined') {
          const proj = worldPos.clone().project(camera);
          panVal = THREE.MathUtils.clamp(proj.x * 0.75, -0.9, 0.9);
        }
        panner.pan.value = panVal;
        panner.connect(targetBus);
        return panner;
      }

      canSpawnVoice() {
        this.init();
        if (!this.ctx || this.muted || this.activeVoices >= this.MAX_VOICES) return false;
        this.activeVoices++;
        return true;
      }

      releaseVoice(delaySec) {
        setTimeout(() => {
          this.activeVoices = Math.max(0, this.activeVoices - 1);
        }, Math.max(50, delaySec * 1000));
      }

      randPitch(base = 1.0, spread = 0.04) {
        return base * (1.0 + (Math.random() * 2 - 1) * spread);
      }

      // 1. Squeeze: soft plush blip + spring-back boing
      playSqueeze(pitchMult = 1.0, worldPos = null) {
        if (!this.canSpawnVoice()) return;
        try {
          const now = this.ctx.currentTime;
          const out = this.createPanner(worldPos);
          const p = this.randPitch(pitchMult, 0.05);

          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(540 * p, now);
          osc1.frequency.exponentialRampToValueAtTime(790 * p, now + 0.075);
          gain1.gain.setValueAtTime(0.001, now);
          gain1.gain.linearRampToValueAtTime(0.14, now + 0.02);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc1.connect(gain1);
          gain1.connect(out);
          osc1.start(now);
          osc1.stop(now + 0.15);

          // Spring-back boing
          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(420 * p, now + 0.09);
          osc2.frequency.exponentialRampToValueAtTime(690 * p, now + 0.21);
          gain2.gain.setValueAtTime(0.001, now + 0.09);
          gain2.gain.linearRampToValueAtTime(0.10, now + 0.11);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc2.connect(gain2);
          gain2.connect(out);
          osc2.start(now + 0.09);
          osc2.stop(now + 0.25);
          this.releaseVoice(0.26);
        } catch (e) { this.releaseVoice(0.1); }
      }

      // 2. Pickup & Throw Whooshes
      playPickup(worldPos = null) {
        if (!this.canSpawnVoice()) return;
        try {
          const now = this.ctx.currentTime;
          const out = this.createPanner(worldPos);
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(240 * this.randPitch(), now);
          osc.frequency.exponentialRampToValueAtTime(510 * this.randPitch(), now + 0.11);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.09, now + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(gain);
          gain.connect(out);
          osc.start(now);
          osc.stop(now + 0.13);
          this.releaseVoice(0.14);
        } catch (e) { this.releaseVoice(0.1); }
      }

      playThrow(speed = 10, worldPos = null) {
        if (!this.canSpawnVoice()) return;
        try {
          const now = this.ctx.currentTime;
          const out = this.createPanner(worldPos);
          const norm = THREE.MathUtils.clamp(speed / 22, 0.25, 1.2);
          const src = this.ctx.createBufferSource();
          src.buffer = this.noiseBuffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.Q.value = 2.2;
          filter.frequency.setValueAtTime(950 * norm, now);
          filter.frequency.exponentialRampToValueAtTime(220, now + 0.18);
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.16 * norm, now + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
          src.connect(filter);
          filter.connect(gain);
          gain.connect(out);
          src.start(now);
          src.stop(now + 0.2);
          this.releaseVoice(0.21);
        } catch (e) { this.releaseVoice(0.1); }
      }

      // 3. Soft Landing ("poff") vs Hard Impact (Deep Boom + Gravel Crack)
      playImpact(speed = 5, worldPos = null) {
        if (!this.canSpawnVoice()) return;
        try {
          const now = this.ctx.currentTime;
          const out = this.createPanner(worldPos);
          const isHard = speed > 7.5;
          const norm = THREE.MathUtils.clamp(speed / 18, 0.15, 1.3);

          // Sub/body thump
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = isHard ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime((isHard ? 140 : 175) * this.randPitch(), now);
          osc.frequency.exponentialRampToValueAtTime(isHard ? 32 : 58, now + (isHard ? 0.24 : 0.11));
          gain.gain.setValueAtTime(Math.min(0.32, norm * 0.24), now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + (isHard ? 0.25 : 0.12));
          osc.connect(gain);
          gain.connect(out);
          osc.start(now);
          osc.stop(now + 0.26);

          // Gravel crack noise burst on hard impacts
          if (isHard) {
            const src = this.ctx.createBufferSource();
            src.buffer = this.noiseBuffer;
            const bp = this.ctx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.frequency.setValueAtTime(1400 * this.randPitch(), now);
            bp.Q.value = 1.1;
            const nGain = this.ctx.createGain();
            nGain.gain.setValueAtTime(Math.min(0.26, norm * 0.2), now);
            nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
            src.connect(bp);
            bp.connect(nGain);
            nGain.connect(out);
            src.start(now);
            src.stop(now + 0.17);
          }
          this.releaseVoice(0.27);
        } catch (e) { this.releaseVoice(0.1); }
      }

      // 4. BLACK FLASH (Sharp Electric Crackle + Sub-Bass Drop + Ring-Out + Music Duck)
      playBlackFlash(worldPos = null) {
        this.init();
        if (!this.ctx || this.muted) return;
        try {
          const now = this.ctx.currentTime;
          const out = this.createPanner(worldPos, true);

          // Duck background music for a dramatic beat
          if (this.musicGain) {
            this.musicGain.gain.cancelScheduledValues(now);
            this.musicGain.gain.setValueAtTime(0.02, now);
            this.musicGain.gain.exponentialRampToValueAtTime(0.24, now + 1.4);
          }

          // Massive Sub-Bass Hit
          const sub = this.ctx.createOscillator();
          const subGain = this.ctx.createGain();
          sub.type = 'sawtooth';
          sub.frequency.setValueAtTime(110, now);
          sub.frequency.exponentialRampToValueAtTime(26, now + 0.65);
          subGain.gain.setValueAtTime(0.45, now);
          subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
          sub.connect(subGain);
          subGain.connect(out);
          sub.start(now);
          sub.stop(now + 0.72);

          // Sharp Electric Crackle Burst
          const zap = this.ctx.createBufferSource();
          zap.buffer = this.noiseBuffer;
          const hp = this.ctx.createBiquadFilter();
          hp.type = 'highpass';
          hp.frequency.value = 1800;
          const zapGain = this.ctx.createGain();
          zapGain.gain.setValueAtTime(0.38, now);
          zapGain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
          zap.connect(hp);
          hp.connect(zapGain);
          zapGain.connect(out);
          zap.start(now);
          zap.stop(now + 0.34);

          // High Crystalline Ring-Out Tail
          [1180, 1770, 2360].forEach((freq, idx) => {
            const rOsc = this.ctx.createOscillator();
            const rGain = this.ctx.createGain();
            rOsc.type = 'sine';
            rOsc.frequency.setValueAtTime(freq, now);
            rGain.gain.setValueAtTime(0.08 / (idx + 1), now);
            rGain.gain.exponentialRampToValueAtTime(0.0008, now + 1.1);
            rOsc.connect(rGain);
            rGain.connect(out);
            rOsc.start(now);
            rOsc.stop(now + 1.15);
          });
        } catch (e) {}
      }

      // 5. Combo Chime (Rising pitch with each chained hit + milestone chord)
      playCombo(comboCount) {
        if (!this.canSpawnVoice()) return;
        try {
          const now = this.ctx.currentTime;
          const semitone = Math.min(24, comboCount);
          const baseFreq = 330 * Math.pow(2, semitone / 12);
          const isMilestone = (comboCount > 0 && comboCount % 5 === 0);

          const notes = isMilestone ? [baseFreq, baseFreq * 1.25, baseFreq * 1.5] : [baseFreq];
          notes.forEach((f, i) => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = isMilestone ? 'triangle' : 'sine';
            osc.frequency.setValueAtTime(f, now + i * 0.035);
            g.gain.setValueAtTime(isMilestone ? 0.11 : 0.08, now + i * 0.035);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.25 + i * 0.06);
            osc.connect(g);
            g.connect(this.sfxGain);
            osc.start(now + i * 0.035);
            osc.stop(now + 0.32 + i * 0.06);
          });
          this.releaseVoice(0.35);
        } catch (e) { this.releaseVoice(0.1); }
      }

      // 6. Exorcism Zap & Paper Talisman Flutter
      playExorcism(worldPos = null) {
        if (!this.canSpawnVoice()) return;
        try {
          const now = this.ctx.currentTime;
          const out = this.createPanner(worldPos);

          // Bright electric zap
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(980 * this.randPitch(), now);
          osc.frequency.exponentialRampToValueAtTime(190, now + 0.14);
          g.gain.setValueAtTime(0.16, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.connect(g);
          g.connect(out);
          osc.start(now);
          osc.stop(now + 0.16);

          // Paper talisman flutter
          const src = this.ctx.createBufferSource();
          src.buffer = this.noiseBuffer;
          const bp = this.ctx.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.setValueAtTime(2600, now + 0.05);
          const ng = this.ctx.createGain();
          ng.gain.setValueAtTime(0.12, now + 0.05);
          ng.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          src.connect(bp);
          bp.connect(ng);
          ng.connect(out);
          src.start(now + 0.05);
          src.stop(now + 0.23);
          this.releaseVoice(0.25);
        } catch (e) { this.releaseVoice(0.1); }
      }

      // 7. Character Signature Attack Sounds (Marisa Beam, Sakuya Knives, Youmu Slash)
      playMarisaBeam(worldPos = null) {
        if (!this.canSpawnVoice()) return;
        try {
          const now = this.ctx.currentTime;
          const out = this.createPanner(worldPos);
          // Rising charge whine
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.28);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.95);
          g.gain.setValueAtTime(0.001, now);
          g.gain.linearRampToValueAtTime(0.18, now + 0.25);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.98);
          osc.connect(g);
          g.connect(out);
          osc.start(now);
          osc.stop(now + 1.0);

          // Roaring laser noise sweep
          const src = this.ctx.createBufferSource();
